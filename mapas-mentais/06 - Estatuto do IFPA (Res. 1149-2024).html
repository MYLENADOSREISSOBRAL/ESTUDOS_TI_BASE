<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estatuto do IFPA</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;
  --c-excecao:#be123c; --c-competencia:#0e7490; --c-sancao:#9f1239; --c-exemplo:#a16207; --c-atencao:#d97706;
  --mark:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
    --mark:#7a5d00;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}
</style>

<style>
#lt-btn{position:fixed;right:16px;bottom:16px;z-index:9999;width:46px;height:46px;border-radius:50%;border:1px solid var(--line,#ccc);background:var(--panel,var(--paper,#fff));color:var(--ink,#111);font:700 16px/1 system-ui,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#lt-btn:hover{border-color:var(--accent,#2f5fd0)}
#lt-pn{position:fixed;right:16px;bottom:72px;z-index:9999;width:min(330px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel,var(--paper,#fff));color:var(--ink,#111);border:1px solid var(--line,#ccc);border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
#lt-pn[hidden]{display:none}
body:has(button.localizar.flutua) #lt-btn{bottom:76px}
body:has(button.localizar.flutua) #lt-pn{bottom:132px}
#lt-pn h3{margin:0 0 10px;font-size:15px}
#lt-pn h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#666)}
#lt-pn .lt-g{display:flex;flex-wrap:wrap;gap:6px}
#lt-pn .lt-s{width:38px;height:38px;border-radius:8px;border:1px solid rgba(128,128,128,.45);cursor:pointer;padding:0;font:700 14px/1 Georgia,serif;display:flex;align-items:center;justify-content:center}
#lt-pn .lt-s.on{outline:3px solid var(--accent,#2f5fd0);outline-offset:1px}
#lt-pn .lt-s.def{font:600 10px/1 system-ui,sans-serif;background:var(--soft,#eee);color:var(--ink,#111)}
#lt-pn label.lt-c{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted,#666)}
#lt-pn input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line,#ccc);border-radius:6px;background:none;cursor:pointer}
#lt-pn .lt-r{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
#lt-pn .lt-ct{font-size:12px;color:var(--muted,#666)}
#lt-pn .lt-ct.baixo{color:#c0392b;font-weight:600}
#lt-pn button.lt-x{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line,#ccc);background:var(--soft,#eee);color:var(--ink,#111);cursor:pointer}
@media print{#lt-btn,#lt-pn{display:none!important}}
</style>
<script>
(function(){
var KEY='mm-leitura', root=document.documentElement;
var FUNDOS=[
 ['Branco','#ffffff'],['Creme','#fbf6e9'],['Sépia','#f4ecd8'],['Papel antigo','#ece0c6'],
 ['Verde suave','#e7f0e3'],['Azul suave','#e5edf5'],['Cinza-claro','#eceff1'],['Lavanda','#efebf6'],
 ['Cinza-escuro','#2b2f36'],['Sépia escuro','#2a231b'],['Verde-noite','#1a2520'],['Noturno','#121417']];
var LETRAS=[
 ['Preto','#111111'],['Grafite','#343a44'],['Marrom','#4a3423'],['Azul-marinho','#1c2a4d'],
 ['Verde-escuro','#1f3d2b'],['Vinho','#5c1f2c'],['Branco-gelo','#eef1f5'],['Bege claro','#e9dcc0'],
 ['Âmbar','#f0c674'],['Verde-claro','#b9e0c1'],['Azul-claro','#b7cdf2']];
var VARS=['--bg','--panel','--paper','--soft','--line','--muted','--code-bg','--ink','color-scheme'];
function ler(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function salvar(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function escuro(h){return lum(h)<.18}
function contraste(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var st=ler();
function aplicar(){
  var r=root.style; VARS.forEach(function(v){r.removeProperty(v)});
  if(st.bg){
    var d=escuro(st.bg), mx=d?'#ffffff':'#000000';
    root.dataset.theme=d?'dark':'light';
    r.setProperty('--panel',st.bg); r.setProperty('--paper',st.bg);
    r.setProperty('--bg','color-mix(in srgb,'+st.bg+' '+(d?'92%':'95%')+','+mx+')');
    r.setProperty('--soft','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--code-bg','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--line','color-mix(in srgb,'+st.bg+' '+(d?'78%':'84%')+','+mx+')');
    r.setProperty('color-scheme',d?'dark':'light');
  } else {
    var th=null; try{th=localStorage.getItem('mm-theme')}catch(e){}
    if(th) root.dataset.theme=th; else delete root.dataset.theme;
  }
  if(st.ink){
    r.setProperty('--ink',st.ink);
    r.setProperty('--muted','color-mix(in srgb,'+st.ink+' 72%,var(--panel,var(--paper,#888)))');
  }
}
aplicar();
function corFundoAtual(){
  var probe=document.getElementById('lt-pn')||document.body;
  var c=getComputedStyle(probe).backgroundColor.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#ffffff';
}
function corTextoAtual(){
  var c=getComputedStyle(document.body).color.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#111111';
}
function montar(){
  aplicar();
  var b=document.createElement('button'); b.id='lt-btn'; b.type='button'; b.title='Cores de leitura (fundo e letras)'; b.setAttribute('aria-label','Cores de leitura'); b.textContent='Aa';
  var p=document.createElement('div'); p.id='lt-pn'; p.hidden=true; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Cores de leitura');
  function grade(lista,chave,ehFundo){
    var h='<div class="lt-g"><button type="button" class="lt-s def" data-k="'+chave+'" data-v="" title="Padrão do tema">padrão</button>';
    lista.forEach(function(x){
      h+='<button type="button" class="lt-s" data-k="'+chave+'" data-v="'+x[1]+'" title="'+x[0]+'" style="'+(ehFundo?'background:'+x[1]+';color:'+(escuro(x[1])?'#eee':'#222'):'background:var(--panel,var(--paper,#fff));color:'+x[1])+'">'+(ehFundo?'':'Aa')+'</button>';
    });
    return h+'</div>';
  }
  p.innerHTML='<h3>Cores de leitura</h3>'+
   '<h4>Cor do fundo</h4>'+grade(FUNDOS,'bg',true)+
   '<label class="lt-c"><input type="color" data-k="bg"> Outra cor de fundo</label>'+
   '<h4>Cor das letras</h4>'+grade(LETRAS,'ink',false)+
   '<label class="lt-c"><input type="color" data-k="ink"> Outra cor de letra</label>'+
   '<div class="lt-r"><span class="lt-ct"></span><button type="button" class="lt-x">Restaurar padrão</button></div>';
  document.body.appendChild(p); document.body.appendChild(b);
  function sync(){
    p.querySelectorAll('.lt-s').forEach(function(s){s.classList.toggle('on',(st[s.dataset.k]||'')===s.dataset.v)});
    var bg=corFundoAtual(), ink=corTextoAtual();
    p.querySelector('input[data-k=bg]').value=st.bg||bg;
    p.querySelector('input[data-k=ink]').value=st.ink||ink;
    var c=contraste(bg,ink), el=p.querySelector('.lt-ct');
    el.textContent='Contraste '+c.toFixed(1)+':1'+(c<4.5?' (baixo para leitura)':'');
    el.classList.toggle('baixo',c<4.5);
  }
  function definir(k,v){ if(v) st[k]=v; else delete st[k]; salvar(st); aplicar(); sync(); }
  p.addEventListener('click',function(e){
    var s=e.target.closest('.lt-s'); if(s) definir(s.dataset.k,s.dataset.v);
    if(e.target.closest('.lt-x')){ st={}; salvar(st); aplicar(); sync(); }
  });
  p.addEventListener('input',function(e){ if(e.target.type==='color') definir(e.target.dataset.k,e.target.value); });
  b.addEventListener('click',function(){ p.hidden=!p.hidden; if(!p.hidden) sync(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') p.hidden=true; });
  document.addEventListener('click',function(e){ if(!p.hidden&&!p.contains(e.target)&&e.target!==b) p.hidden=true; });
  // O botão ◐ (claro/escuro) das páginas volta o fundo ao padrão do tema escolhido
  var tb=document.getElementById('themeBtn');
  if(tb) tb.addEventListener('click',function(){ if(st.bg){ delete st.bg; salvar(st); aplicar(); } });
  window.addEventListener('storage',function(e){ if(e.key===KEY){ st=ler(); aplicar(); if(!p.hidden) sync(); } });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar); else montar();
})();
</script>

rafo único"}]}, {"t": "Seção V – Das Pró-reitorias (5)", "tipo": "topico", "ref": "Arts. 20–25", "filhos": [{"t": "Órgãos estratégicos; Pró-reitores designados pelo Reitor", "tipo": "conceito", "d": "Definem políticas e diretrizes de ensino, pesquisa, inovação, extensão, administração, planejamento, desenvolvimento e gestão de pessoas.", "ref": "Art. 20"}, {"t": "PRODEGEP – Desenvolvimento e Gestão de Pessoas", "tipo": "competencia", "d": "Define a Política de Desenvolvimento e Gestão de Pessoas; planeja, coordena e avalia pagamento, ingressos, vacâncias, afastamentos, saúde, aposentadoria, desenvolvimento e treinamento.", "ref": "Art. 21"}, {"t": "PROEN – Ensino", "tipo": "competencia", "d": "Planeja, coordena, define e avalia políticas e atividades acadêmicas, articuladas à pesquisa e à extensão.", "ref": "Art. 22"}, {"t": "PROEX – Extensão", "tipo": "competencia", "d": "Atividades e políticas de extensão e relações com a sociedade: interação entre Instituto, parceiros, mundo do trabalho e comunidade.", "ref": "Art. 23"}, {"t": "PROPPG – Pesquisa, Pós-graduação e Inovação", "tipo": "competencia", "d": "Políticas e atividades de pesquisa, pós-graduação e inovação, articuladas ao ensino e à extensão, em todos os níveis de ensino.", "ref": "Art. 24"}, {"t": "PROAD – Administração", "tipo": "competencia", "d": "Coordena e acompanha execução orçamentária, financeira e patrimonial; acompanha elaboração de projetos, execução e fiscalização de obras.", "ref": "Art. 25"}, {"t": "Todas em consonância com diretrizes do MEC, CONSUP e legislação", "tipo": "regra", "ref": "Arts. 21–25"}, {"t": "Competências detalhadas: Regimento Geral e Regimento Interno da Reitoria", "tipo": "regra", "ref": "Art. 25, parágrafo único"}, {"t": "Siglas não constam do Estatuto", "tipo": "atencao", "ext": true, "d": "As siglas (PROEN, PROEX etc.) são de uso institucional; o texto usa apenas os nomes por extenso."}]}, {"t": "Seção VI – Das Diretorias Sistêmicas", "tipo": "topico", "filhos": [{"t": " filhos": [{"t": "Princípios curriculares", "tipo": "classificacao", "d": "Estética, sensibilidade, política da igualdade, ética, identidade, interdisciplinaridade, contextualização, flexibilidade e educação como formação na vida e para a vida.", "ref": "Art. 37"}, {"t": "Concepção de sociedade, trabalho, cultura, educação, tecnologia e ser humano", "tipo": "conceito", "ref": "Art. 37"}]}, {"t": "Ofertas: FIC, técnico de nível médio, graduação e pós-graduação", "tipo": "classificacao", "ref": "Art. 38"}, {"t": "Apoio de programas e projetos de ensino e parcerias público-públicas", "tipo": "regra", "ref": "Art. 39"}]}, {"t": "Cap. II – Da Extensão", "tipo": "topico", "filhos": [{"t": "Processo educativo, cultural e científico", "tipo": "conceito", "d": "Articula ensino e pesquisa de forma indissociável para uma relação transformadora entre IFPA e sociedade.", "ref": "Art. 40"}, {"t": "Relações institucionais devem fomentar oportunidades extensionistas", "tipo": "regra", "ref": "Art. 40, parágrafo único"}, {"t": "Pautas: interdisciplinaridade, relevância social, respeito às culturas comunitárias", "tipo": "conceito", "d": "Objetivo: apoiar o desenvolvimento social e regional, considerando os arranjos produtivos locais, sociais e culturais.", "ref": "Art. 41"}, {"t": "Propósito: fomentar e divulgar conhecimentos à comunidade", "tipo": "regra", "ref": "Art. 41, § 1º"}, {"t": "Formas de extensão", "tipo": "classificacao", "d": "Programas e projetos, extensão tecnológica, desenvolvimento tecnológico, serviços, produtos, processos, eventos, fomento a estágio e emprego, cursos, consultorias, publicações, atividades esportivas, artísticas e culturais, empreendedorismo, relações internacionais, acompanhamento de egressos.", "ref": "Art. 41, § 2º"}, {"t": "Recursos próprios no orçamento, sem prejuízo de outras fontes", "tipo": "regra", "ref": "Art. 41, § 3º"}, {"t": "Incentivar programas, articulando-se com fomento e parcerias público-público ou público-privadas", "tipo": "regra", "ref": "Art. 42"}]}, {"t": "Cap. III – Da Pesquisa, Pós-graduação e Inovação", "tipo": "topico", "filhos": [{"t": "Pesquisa: processo educativo de investigação e produção de conhecimento", "tipo": "conceito", "d": "Visa à inovação e à solução de problemas científicos e tecnológicos, em todos os níveis e modalidades, com vistas ao desenvolvimento social.", "ref": "Art. 43"}, {"t": "Objetivo: formar recursos humanos para investigação e difusão", "tipo": "conceito", "d": "Conhecimentos científicos, tecnológicos, culturais e artísticos, em articulação com ensino e extensão, ao longo de toda a formação.", "ref": "Art. 44"}, {"t": "Cabe ao IFPA", "tipo": "competencia", "ref": "Art. 45", "filhos": [{"t": "Promover projetos de pesquisa e consignar recursos no orçamento", "tipo": "regra", "ref": "Art. 45, § 1º"}, {"t": "Proteger a propriedade intelectual; estimular transferência de tecnologia", "tipo": "regra", "d": "Gerada pela comunidade interna e externa.", "ref": "Art. 45, § 2º"}, {"t": "Estimular parcerias produtivas público-público ou público-privadas", "tipo": "regra", "ref": "Art. 45, § 3º"}, {"t": "Permitir uso do capital intelectual em projetos de PD&I", "tipo": "regra", "ref": "Art. 45, § 4º"}]}]}]}}, {"id": "titulo-4", "titulo": "Título IV – Da Comunidade Acadêmica (arts. 46–54)", "raiz": {"t": "Comunidade Acadêmica", "tipo": "topico", "d": "Composta pelos corpos discente, docente e técnico-administrativo.", "ref": "Art. 46", "filhos": [{"t": "Cap. I – Corpo Discente", "tipo": "topico", "filhos": [{"t": "Estudantes matriculados nos cursos e programas", "tipo": "conceito", "ref": "Art. 47"}, {"t": "Currículo integral: diploma ou certificado", "tipo": "regra", "d": "Na forma dos Regulamentos Didáticos e do Regimento Geral.", "ref": "Art. 47, § 1º"}, {"t": "Matrícula especial: só declaração das disciplinas/competências", "tipo": "excecao", "ref": "Art. 47, § 2º"}, {"t": "Intercambistas integram o corpo discente", "tipo": "regra", "ref": "Art. 47, § 3º"}, {"t": "Participação política", "tipo": "regra", "d": "Discentes com matrícula regular ativa em cursos técnicos, de graduação e de pós-graduação votam e são votados para representações no CONSUP, Conselho Diretor, Colegiados de Cursos e Comissões, e participam da escolha do Reitor.", "ref": "Art. 48", "filhos": [{"t": "Art. 48 não menciona a escolha de Diretor Geral para discentes", "tipo": "atencao", "ref": "Art. 48"}]}]}, {"t": "Cap. II – Corpo Docente", "tipo": "topico", "filhos": [{"t": "Professores do quadro permanente (RJU) e demais admitidos na forma da lei", "tipo": "conceito", "ref": "Art. 49"}, {"t": "Lotação por Campus, exercício vinculado a uma Diretoria de Ensino", "tipo": "regra", "ref": "Art. 49, § 1º", "filhos": [{"t": "Exceto os em exercício na Reitoria", "tipo": "excecao", "ref": "Art. 49, § 1º"}]}, {"t": "Professores visitantes podem integrar o corpo docente", "tipo": "regra", "d": "Para fomentar intercâmbio e mobilidade acadêmica nacional e internacional.", "ref": "Art. 49, § 2º"}, {"t": "Só docentes do quadro ativo permanente votam e são votados", "tipo": "excecao", "d": "Na consulta para Reitor e Diretores Gerais dos Campi.", "ref": "Art. 50"}]}, {"t": "Cap. III – Corpo Técnico-Administrativo", "tipo": "topico", "filhos": [{"t": "Servidores do quadro permanente e temporário (RJU)", "tipo": "conceito", "d": "Atividades de planejamento, organização, execução e avaliação; específicas de pesquisa, extensão e inovação; apoio técnico, administrativo e operacional.", "ref": "Art. 51"}, {"t": "Só TAEs do quadro ativo permanente votam e são votados", "tipo": "excecao", "d": "Na consulta para Reitor e Diretores Gerais dos Campi.", "ref": "Art. 52"}]}, {"t": "Cap. IV – Regime Disciplinar", "tipo": "topico", "filhos": [{"t": "Discentes: regulamento próprio", "tipo": "sancao", "d": "Apreciado pelo Conselho Diretor de cada Campus e aprovado pelo CONSUP.", "ref": "Art. 53"}, {"t": "Docentes e TAEs: legislação federal", "tipo": "sancao", "d": "Disposições legais, normas e regulamentos sobre ordem disciplinar, sanções e recursos previstos pela legislação federal.", "ref": "Art. 54"}, {"t": "Lei 8.112/90 como base do regime disciplinar dos servidores", "tipo": "atencao", "ext": true, "d": "Complementação: o art. 54 fala genericamente em legislação federal; a Lei 8.112/90 (RJU) é a principal norma aplicável."}]}]}}, {"id": "titulo-5", "titulo": "Título V – Dos Diplomas, Certificados e Títulos (arts. 55–59)", "raiz": {"t": "Diplomas, Certificados e Títulos", "tipo": "topico", "ref": "Arts. 55–59", "filhos": [{"t": "Emite certificados e diplomas a concluintes", "tipo": "competencia", "d": "Registro e expedição de diplomas conforme a Lei 9.394/1996 (LDB) e demais legislações.", "ref": "Art. 55"}, {"t": "Instituição acreditadora e certificadora de competências profissionais", "tipo": "competencia", "ref": "Art. 56"}, {"t": "Pode conferir títulos honoríficos, de benemérito e medalhas de mérito educacional", "tipo": "competencia", "d": "Conforme o Regimento Geral.", "ref": "Art. 57"}, {"t": "Pode registrar diplomas de IES sem autonomia universitária", "tipo": "competencia", "d": "Nos termos do art. 99, § 1º, do Decreto 9.235/2017.", "ref": "Art. 58"}, {"t": "Certificadora do ENCCEJA e do ENEM (edições 2009 a 2016)", "tipo": "competencia", "ref": "Art. 59", "filhos": [{"t": "ENEM só nas edições de 2009 a 2016", "tipo": "atencao", "ref": "Art. 59"}]}]}}, {"id": "titulos-6-7", "titulo": "Títulos VI e VII – Patrimônio; Disposições Transitórias e Finais (arts. 60–63)", "raiz": {"t": "Patrimônio e Disposições Finais", "tipo": "topico", "ref": "Arts. 60–63", "filhos": [{"t": "Título VI – Do Patrimônio", "tipo": "topico", "ref": "Art. 60", "filhos": [{"t": "Constituição do patrimônio (5 incisos)", "tipo": "classificacao", "ref": "Art. 60, I–V", "filhos": [{"t": "I – Bens e direitos da Reitoria e de cada Campus", "tipo": "classificacao", "ref": "Art. 60, I"}, {"t": "II – Bens e direitos que vier a adquirir", "tipo": "classificacao", "ref": "Art. 60, II"}, {"t": "III – Doações ou legados", "tipo": "classificacao", "ref": "Art. 60, III"}, {"t": "IV – Incorporações de bens resultantes de serviços realizados", "tipo": "classificacao", "ref": "Art. 60, IV"}, {"t": "V – Direitos de registros e patentes", "tipo": "classificacao", "ref": "Art. 60, V"}]}, {"t": "Uso exclusivo para a consecução de seus objetivos", "tipo": "regra", "ref": "Art. 60, parágrafo único"}, {"t": "Vedada alienação, exceto nos casos e condições permitidos em lei", "tipo": "excecao", "ref": "Art. 60, parágrafo único"}]}, {"t": "Título VII – Disposições Transitórias e Finais", "tipo": "topico", "ref": "Arts. 61–63", "filhos": [{"t": "Pode constituir colegiados normativos e consultivos e comissões técnicas/administrativas", "tipo": "competencia", "d": "Conforme necessidade específica.", "ref": "Art. 61"}, {"t": "Alteração do Estatuto", "tipo": "regra", "ref": "Art. 62", "filhos": [{"t": "Quórum qualificado: 2/3 dos integrantes do CONSUP", "tipo": "prazo", "ref": "Art. 62"}, {"t": "Sessão convocada exclusivamente para esse fim", "tipo": "excecao", "ref": "Art. 62"}, {"t": "2/3 dos integrantes (não dos presentes)", "tipo": "atencao", "ref": "Art. 62"}]}, {"t": "Regimento Geral: revisão em 120 dias do início da vigência", "tipo": "prazo", "d": "O Regimento Geral regulamenta as atividades da Administração Superior, Reitoria, Campi e demais órgãos.", "ref": "Art. 63"}]}]}}], "comparacoes": [{"titulo": "CONSUP × CODIR", "colunas": ["Aspecto", "CONSUP", "CODIR"], "linhas": [["Natureza", "Consultivo e deliberativo; órgão máximo", "Órgão superior consultivo, de apoio e assessoramento"], ["Composição", "Definida no Regimento Geral; paritária entre segmentos", "Reitor (presidente), Pró-reitores, Diretores Sistêmicos, Diretor Executivo, Diretores Gerais"], ["Reunião ordinária", "A cada 2 meses", "Uma vez por mês"], ["Reunião extraordinária", "Presidente ou 2/3 dos membros", "Presidente ou 2/3 dos membros"], ["Mandato", "2 anos, 1 recondução (exceto natos)", "Não previsto (membros por cargo)"], ["Quórum de instalação", "50% + 1 dos membros", "Não previsto no Estatuto"], ["Base legal", "Art. 10", "Art. 11"]]}, {"titulo": "Reitor × Diretor Geral de Campus", "colunas": ["Aspecto", "Reitor", "Diretor Geral"], "linhas": [["Escolha", "Processo eletivo (servidores ativos permanentes + discentes regulares)", "Nomeado pelo Reitor, conforme legislação"], ["Mandato", "4 anos da nomeação, 1 recondução após nova eleição", "Não fixado no Estatuto"], ["Vacância – aposentadoria", "'Aposentadoria'", "'Aposentadoria voluntária ou compulsória'"], ["Após vacância", "Substituto legal convoca CONSUP; consulta em até 90 dias", "Substituto legal designado na forma da legislação"], ["Órgão colegiado que preside", "CONSUP e CODIR", "Conselho Diretor do Campus"], ["Base legal", "Arts. 13–15", "Arts. 34–36"]]}, {"titulo": "Auditoria Interna × Corregedoria × Ouvidoria × Comissão de Ética", "colunas": ["Aspecto", "Auditoria Interna", "Corregedoria", "Ouvidoria", "Comissão de Ética"], "linhas": [["Vinculação", "Vinculada ao CONSUP", "Integra a Reitoria, subordinada ao Reitor", "Órgão do IFPA", "Instância colegiada consultiva"], ["Foco", "Fortalecer gestão, racionalizar controle; apoio à CGU e TCU", "Correição: ilícitos de servidores, TCE, responsabilização de PJ", "Denúncias, reclamações, elogios, sugestões", "Consulta do dirigente máximo e servidores"], ["Dirigente", "Auditor Chefe: designado pelo Reitor, aprovado pelo CONSUP e CGU", "Não especificado", "Não especificado", "Não especificado"], ["Base legal", "Art. 28", "Art. 30", "Art. 29", "Art. 31"]]}, {"titulo": "Autonomia do IFPA × autonomia do Campus", "colunas": ["Aspecto", "IFPA (autarquia)", "Campus"], "linhas": [["Autonomias", "Administrativa, patrimonial, financeira, didático-pedagógica e disciplinar", "Administrativa e financeira"], ["Base legal", "Art. 1º", "Art. 33"]]}, {"titulo": "Direito de voto nos processos eletivos", "colunas": ["Segmento", "Requisito", "Escolha de Reitor", "Escolha de Diretor Geral", "Base"], "linhas": [["Discentes", "Matrícula regular ativa (técnico, graduação, pós)", "Sim", "Não mencionado no art. 48", "Art. 48"], ["Docentes", "Quadro ativo permanente", "Sim", "Sim", "Art. 50"], ["Técnico-administrativos", "Quadro ativo permanente", "Sim", "Sim", "Art. 52"]]}, {"titulo": "Regime disciplinar: discentes × servidores", "colunas": ["Aspecto", "Discentes", "Docentes e TAEs"], "linhas": [["Fonte", "Regulamento próprio", "Legislação federal (normas, sanções e recursos)"], ["Aprovação", "Apreciado pelo Conselho Diretor de cada Campus, aprovado pelo CONSUP", "—"], ["Base legal", "Art. 53", "Art. 54"]]}], "pegadinhas": [{"texto": "O CONSUP é consultivo E deliberativo; o CODIR é apenas consultivo, de apoio e assessoramento.", "ref": "Arts. 10 e 11"}, {"texto": "CONSUP reúne-se ordinariamente a cada dois meses; CODIR, uma vez por mês. Fácil inverter.", "ref": "Art. 10, § 6º; Art. 11, § 1º"}, {"texto": "Mandato dos membros do CONSUP é de 2 anos, com UMA recondução imediata; membros natos não seguem essa regra.", "ref": "Art. 10, § 2º"}, {"texto": "O Reitor nomeia os membros do CONSUP, exceto ele próprio e o representante do MEC.", "ref": "Art. 10, § 1º"}, {"texto": "Quórum de instalação do CONSUP: 50% mais um dos membros; quórum para alterar o Estatuto: 2/3 dos integrantes, em sessão exclusiva.", "ref": "Art. 10, § 8º; Art. 62"}, {"texto": "Afastamento definitivo: suplente completa o mandato e escolhe-se novo suplente; afastamento temporário: suplente só pelo período do afastamento.", "ref": "Art. 10, §§ 3º a 5º"}, {"texto": "Mandato do Reitor: 4 anos contados da NOMEAÇÃO (não da eleição/posse), com uma recondução após novo processo eletivo.", "ref": "Art. 13"}, {"texto": "Vacância de Reitor: o CONSUP tem prazo MÁXIMO de 90 dias, contados da vacância, para realizar e finalizar a consulta.", "ref": "Art. 14, parágrafo único"}, {"texto": "Vacância por exoneração exige processo disciplinar; a demissão é hipótese separada — ambas nos termos da Lei 8.112/90.", "ref": "Art. 14, I e II"}, {"texto": "O IFPA tem 17 Campi MAIS um Campus Avançado (Vigia) — 18 unidades além da Reitoria.", "ref": "Art. 2º"}, {"texto": "Criação de novos Campi exige estudo de viabilidade e autorização do CONSUP E do MEC.", "ref": "Art. 2º"}, {"texto": "Equiparação do IFPA às universidades federais é só para regulação, avaliação e supervisão da educação superior.", "ref": "Art. 1º, § 3º"}, {"texto": "Limite territorial para criar/extinguir cursos e registrar diplomas é o estado do Pará; EaD segue legislação específica.", "ref": "Art. 1º, § 4º"}, {"texto": "Percentuais são MÍNIMOS: 50% técnico de nível médio e 20% licenciaturas/formação pedagógica, por exercício.", "ref": "Art. 7º"}, {"texto": "Ajuste da oferta de nível superior: o CONSUP PODE autorizar, mas com anuência do MEC.", "ref": "Art. 7º, parágrafo único"}, {"texto": "Cursos técnicos de nível médio devem ser ofertados PRIORITARIAMENTE na forma integrada (não exclusivamente).", "ref": "Art. 6º, I"}, {"texto": "O Campus tem autonomia administrativa e financeira — não patrimonial, didático-pedagógica nem disciplinar.", "ref": "Art. 33"}, {"texto": "Conselho Diretor do Campus é CONSULTIVO e presidido pelo Diretor Geral; o Regimento Interno do Campus é aprovado pelo CONSUP.", "ref": "Art. 34"}, {"texto": "Auditoria Interna é vinculada ao CONSUP; o Auditor Chefe é designado pelo Reitor e aprovado pelo CONSUP e pela CGU.", "ref": "Art. 28, § 1º"}, {"texto": "Corregedoria é subordinada diretamente ao Reitor (integra a Reitoria), diferente da Auditoria.", "ref": "Art. 30"}, {"texto": "Responsabilidade solidária com o Reitor alcança Pró-reitores, Diretores Sistêmicos e Diretores Gerais, no limite das competências delegadas.", "ref": "Art. 9º, parágrafo único"}, {"texto": "Estudante em matrícula especial NÃO recebe diploma/certificado — só declaração das disciplinas ou competências.", "ref": "Art. 47, § 2º"}, {"texto": "Para votar/ser votado na consulta de Reitor e Diretor Geral, docentes e TAEs devem ser do quadro ATIVO PERMANENTE; o corpo TAE inclui temporários, mas estes não votam.", "ref": "Arts. 50–52"}, {"texto": "IFPA é certificador do ENEM apenas nas edições de 2009 a 2016; do ENCCEJA, sem esse limite no texto.", "ref": "Art. 59"}, {"texto": "Revisão do Regimento Geral: 120 dias após o início da vigência do Estatuto (não 90).", "ref": "Art. 63"}], "erros_frequentes": [{"texto": "Achar que o Estatuto lista a composição do CONSUP: ele remete ao Regimento Geral.", "ref": "Art. 10, caput"}, {"texto": "Confundir o número de Pró-reitorias (5) com o de Diretorias Sistêmicas (3).", "ref": "Art. 8º, II, d–e; Art. 20"}, {"texto": "Classificar a ASCOM ou a Diretoria Executiva como órgãos de controle: são órgãos executivos.", "ref": "Art. 8º, II"}, {"texto": "Esquecer o CGRCI entre os órgãos colegiados.", "ref": "Art. 8º, I, c"}, {"texto": "Atribuir à Pró-reitoria de Administração a gestão de pessoas: é da Pró-reitoria de Desenvolvimento e Gestão de Pessoas.", "ref": "Arts. 21 e 25"}, {"texto": "Dizer que Pró-reitores são eleitos: são designados pelo Reitor; Diretores Sistêmicos são nomeados pelo Reitor.", "ref": "Arts. 20 e 26"}, {"texto": "Tratar a Comissão de Ética como órgão deliberativo/punitivo: é instância colegiada consultiva.", "ref": "Art. 31"}], "relacoes": [{"texto": "Lei nº 11.892/2008: o IFPA foi criado nos termos dela e rege-se por ela (arts. 1º e 3º); o art. 7º (mínimos de 50%/20% de vagas) manda observar a legislação vigente.", "ext": false}, {"texto": "Lei nº 8.112/1990: referida nas hipóteses de vacância (exoneração por processo disciplinar e demissão) do Reitor e do Diretor Geral (arts. 14 e 36).", "ext": false}, {"texto": "Lei nº 12.527/2011 (LAI): todos os atos do CONSUP são públicos (art. 10, § 9º).", "ext": false}, {"texto": "Lei nº 9.394/1996 (LDB): base para registro e expedição de diplomas (art. 55).", "ext": false}, {"texto": "Decreto nº 3.591/2000 (com redação do Decreto 4.304/2002): vinculação da Auditoria Interna ao CONSUP (art. 28).", "ext": false}, {"texto": "Decreto nº 9.235/2017, art. 99, § 1º: autoriza o registro de diplomas de IES sem autonomia universitária (art. 58).", "ext": false}, {"texto": "Regimento Geral do IFPA: detalha estrutura, competências e composição do CONSUP; deve ser revisado em 120 dias (arts. 8º, 10 e 63).", "ext": false}, {"texto": "Decreto nº 6.986/2009 regulamenta a escolha de Reitores e Diretores-Gerais dos IFs (mandato de 4 anos também para Diretor-Geral, pela Lei 11.892, art. 13).", "ext": true}], "perguntas": [{"p": "Qual a natureza jurídica do IFPA e a quais autonomias faz jus?", "r": "Autarquia vinculada ao MEC, com autonomia administrativa, patrimonial, financeira, didático-pedagógica e disciplinar.", "ref": "Art. 1º"}, {"p": "Para que fins o IFPA é equiparado às universidades federais?", "r": "Para a incidência das disposições de regulação, avaliação e supervisão do IFPA e de seus cursos superiores.", "ref": "Art. 1º, § 3º"}, {"p": "Como o IFPA está constituído atualmente?", "r": "Pela Reitoria, 17 Campi e um Campus Avançado (Vigia).", "ref": "Art. 2º"}, {"p": "Quais os requisitos para criação de novos Campi?", "r": "Estudos de viabilidade e autorização do CONSUP e do MEC.", "ref": "Art. 2º"}, {"p": "Quais instrumentos normativos internos regem o IFPA?", "r": "Estatuto, Regimento Geral, Resoluções do CONSUP e Atos da Reitoria, dos Campi e demais unidades.", "ref": "Art. 3º"}, {"p": "Quais percentuais mínimos de vagas o IFPA deve garantir?", "r": "50% para educação profissional técnica de nível médio e 20% para licenciaturas e/ou programas especiais de formação pedagógica, em cada exercício.", "ref": "Art. 7º"}, {"p": "Quem pode autorizar o ajuste da oferta de nível superior?", "r": "O CONSUP, com anuência do MEC, nas regiões em que as demandas iniciais o justificarem.", "ref": "Art. 7º, parágrafo único"}, {"p": "Quais são os órgãos colegiados do IFPA?", "r": "CONSUP, CODIR e Comitê de Governança, Risco, Controle Interno e Integridade (CGRCI).", "ref": "Art. 8º, I"}, {"p": "Quais os órgãos de controle e assessoramento?", "r": "Procuradoria Federal, Auditoria Interna, Ouvidoria, Corregedoria e Comissão de Ética.", "ref": "Art. 8º, III"}, {"p": "Quem responde solidariamente com o Reitor por atos de gestão?", "r": "Pró-reitores, Diretores Sistêmicos e Diretores Gerais dos Campi, no limite das competências delegadas.", "ref": "Art. 9º, parágrafo único"}, {"p": "Qual o mandato dos membros do CONSUP?", "r": "2 anos, permitida uma recondução para o período imediatamente subsequente, exceto membros natos.", "ref": "Art. 10, § 2º"}, {"p": "Qual a periodicidade das reuniões ordinárias do CONSUP e quem convoca as extraordinárias?", "r": "A cada dois meses; extraordinárias convocadas pelo Presidente ou por 2/3 dos membros.", "ref": "Art. 10, § 6º"}, {"p": "Qual o quórum de instalação das reuniões do CONSUP?", "r": "Presença mínima de 50% mais um dos membros.", "ref": "Art. 10, § 8º"}, {"p": "O que ocorre no afastamento definitivo de membro do CONSUP?", "r": "O suplente assume para completar o mandato original e é escolhido novo suplente.", "ref": "Art. 10, §§ 3º e 4º"}, {"p": "Qual a composição do CODIR?", "r": "Reitor (presidente), Pró-reitores, Diretores Sistêmicos, Diretor Executivo e Diretores Gerais dos Campi.", "ref": "Art. 11"}, {"p": "Como é escolhido o Reitor e qual seu mandato?", "r": "Por processo eletivo entre servidores ativos permanentes (docentes e TAEs) e discentes regulares; mandato de 4 anos da nomeação, com uma recondução após novo processo eletivo.", "ref": "Art. 13"}, {"p": "Quais as hipóteses de vacância do cargo de Reitor?", "r": "Exoneração por processo disciplinar, demissão, posse em cargo inacumulável, falecimento, renúncia, aposentadoria e término do mandato.", "ref": "Art. 14"}, {"p": "Qual o prazo para nova consulta em caso de vacância da Reitoria?", "r": "O substituto legal convoca o CONSUP, que tem até 90 dias da vacância para realizar e finalizar a consulta.", "ref": "Art. 14, parágrafo único"}, {"p": "A quem compete representar o IFPA em juízo?", "r": "Ao Reitor.", "ref": "Art. 15"}, {"p": "Quantas Pró-reitorias tem o IFPA e quem designa os Pró-reitores?", "r": "Cinco; designados pelo Reitor.", "ref": "Art. 20"}, {"p": "A que Pró-reitoria compete a execução orçamentária, financeira e patrimonial e a fiscalização de obras?", "r": "À Pró-reitoria de Administração.", "ref": "Art. 25"}, {"p": "A que órgão a Auditoria Interna é vinculada e como é escolhido o Auditor Chefe?", "r": "Ao CONSUP; o Auditor Chefe é designado pelo Reitor e submetido à aprovação do CONSUP e da CGU.", "ref": "Art. 28"}, {"p": "Qual a posição da Corregedoria na estrutura?", "r": "Integra a Reitoria e é subordinada diretamente ao Reitor.", "ref": "Art. 30"}, {"p": "Que autonomias tem o Campus?", "r": "Administrativa e financeira.", "ref": "Art. 33"}, {"p": "Qual a natureza do Conselho Diretor do Campus e quem o preside?", "r": "Órgão consultivo, presidido pelo Diretor Geral.", "ref": "Art. 34"}, {"p": "Quem aprova o Regimento Interno do Campus?", "r": "O CONSUP, após apreciação pelo Conselho Diretor.", "ref": "Art. 34, parágrafo único"}, {"p": "Como as ações de extensão são definidas?", "r": "Como processo educativo, cultural e científico que articula ensino e pesquisa de forma indissociável, para relação transformadora entre IFPA e sociedade.", "ref": "Art. 40"}, {"p": "O que cabe ao IFPA na área de pesquisa, pós-graduação e inovação?", "r": "Promover projetos de pesquisa com recursos orçamentários, proteger a propriedade intelectual e estimular transferência de tecnologia, estimular parcerias e permitir uso do capital intelectual em PD&I.", "ref": "Art. 45"}, {"p": "Quem compõe a comunidade acadêmica?", "r": "Os corpos discente, docente e técnico-administrativo.", "ref": "Art. 46"}, {"p": "O que recebe o estudante em regime de matrícula especial?", "r": "Somente declaração das disciplinas cursadas ou competências adquiridas.", "ref": "Art. 47, § 2º"}, {"p": "Quem pode votar e ser votado na consulta para Reitor e Diretores Gerais, entre os servidores?", "r": "Apenas docentes e técnico-administrativos do quadro ativo permanente.", "ref": "Arts. 50 e 52"}, {"p": "Como é estabelecido o regime disciplinar dos discentes?", "r": "Por regulamento próprio apreciado pelo Conselho Diretor de cada Campus e aprovado pelo CONSUP.", "ref": "Art. 53"}, {"p": "De quais exames o IFPA é instituição certificadora?", "r": "ENCCEJA e ENEM (edições de 2009 a 2016).", "ref": "Art. 59"}, {"p": "Quais bens compõem o patrimônio do IFPA e podem ser alienados?", "r": "Bens e direitos da Reitoria e Campi, os adquiridos, doações/legados, incorporações por serviços e direitos de registros e patentes; não podem ser alienados, salvo nos casos e condições permitidos em lei.", "ref": "Art. 60"}, {"p": "Qual o quórum para alterar o Estatuto?", "r": "2/3 dos integrantes do CONSUP, em sessão convocada exclusivamente para esse fim.", "ref": "Art. 62"}, {"p": "Em quanto tempo o Regimento Geral deve ser revisado?", "r": "Em 120 dias após o início da vigência do Estatuto.", "ref": "Art. 63"}], "cobertura": [{"item": "Título I – Cap. I – Da natureza e finalidade (arts. 1º–3º)", "status": "ok", "obs": "Endereços completos das sedes resumidos (listados os nomes dos Campi)."}, {"item": "Título I – Cap. II – Princípios, finalidades e características, objetivos (arts. 4º–7º)", "status": "ok", "obs": ""}, {"item": "Título I – Cap. III – Da organização administrativa (art. 8º)", "status": "ok", "obs": ""}, {"item": "Título II – Da Gestão, disposição inicial (art. 9º)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. I – Órgãos colegiados: Seção I CONSUP (art. 10)", "status": "ok", "obs": "Composição não consta do Estatuto (remetida ao Regimento Geral)."}, {"item": "Título II – Cap. I – Seção II Colégio de Dirigentes (art. 11)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. II – Da Reitoria (arts. 12–14) e Seções I a VI (arts. 15–26)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. III – Órgãos de controle e assessoramento, Seções I a V (arts. 27–31)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. IV – Dos Campi (arts. 32–36)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. I – Do Ensino (arts. 37–39)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. II – Da Extensão (arts. 40–42)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. III – Da Pesquisa, Pós-graduação e Inovação (arts. 43–45)", "status": "ok", "obs": ""}, {"item": "Título IV – Da Comunidade Acadêmica (art. 46) e Caps. I a III (arts. 47–52)", "status": "ok", "obs": ""}, {"item": "Título IV – Cap. IV – Do Regime Disciplinar (arts. 53–54)", "status": "ok", "obs": ""}, {"item": "Título V – Dos Diplomas, Certificados e Títulos (arts. 55–59)", "status": "ok", "obs": ""}, {"item": "Título VI – Do Patrimônio (art. 60)", "status": "ok", "obs": ""}, {"item": "Título VII – Das Disposições Transitórias e Finais (arts. 61–63)", "status": "ok", "obs": ""}], "nao_verificado": ["Conferido: o Estatuto (art. 10) não traz a composição do CONSUP e remete ao Regimento Geral; ela está no Regimento Geral (Res. 1187/2024), art. 5º — o nó de composição agora cita essa fonte (marcado ext por não constar do Estatuto).", "Conferido no PDF: o art. 11 tem dois incisos 'IV' (Diretor Executivo; Diretores Gerais dos Campi) — erro material do texto.", "Conferido no PDF: o art. 45 enumera as atribuições como §§ 1º a 4º após 'cabe ao IFPA:' — mantida a numeração do original.", "Conferido: o Estatuto não fixa o mandato do Diretor Geral (só cita 'término do mandato', art. 36, VII); o prazo de 4 anos está no Regimento Geral, art. 50, § 1º (nó ext).", "Conferido no PDF: não há cláusula de vigência nem bloco de assinatura; considera-se a data do cabeçalho (19/02/2024)."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
