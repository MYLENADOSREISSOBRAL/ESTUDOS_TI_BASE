<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lei nº 8.112/1990</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;
  --c-excecao:#be123c; --c-competencia:#0e7490; --c-sancao:#9f1239; --c-exemplo:#a16207; --c-atencao:#d97706;
  --mark:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
    --mark:#7a5d00;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}
</style>

<style>
#lt-btn{position:fixed;right:16px;bottom:16px;z-index:9999;width:46px;height:46px;border-radius:50%;border:1px solid var(--line,#ccc);background:var(--panel,var(--paper,#fff));color:var(--ink,#111);font:700 16px/1 system-ui,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#lt-btn:hover{border-color:var(--accent,#2f5fd0)}
#lt-pn{position:fixed;right:16px;bottom:72px;z-index:9999;width:min(330px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel,var(--paper,#fff));color:var(--ink,#111);border:1px solid var(--line,#ccc);border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
#lt-pn[hidden]{display:none}
body:has(button.localizar.flutua) #lt-btn{bottom:76px}
body:has(button.localizar.flutua) #lt-pn{bottom:132px}
#lt-pn h3{margin:0 0 10px;font-size:15px}
#lt-pn h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#666)}
#lt-pn .lt-g{display:flex;flex-wrap:wrap;gap:6px}
#lt-pn .lt-s{width:38px;height:38px;border-radius:8px;border:1px solid rgba(128,128,128,.45);cursor:pointer;padding:0;font:700 14px/1 Georgia,serif;display:flex;align-items:center;justify-content:center}
#lt-pn .lt-s.on{outline:3px solid var(--accent,#2f5fd0);outline-offset:1px}
#lt-pn .lt-s.def{font:600 10px/1 system-ui,sans-serif;background:var(--soft,#eee);color:var(--ink,#111)}
#lt-pn label.lt-c{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted,#666)}
#lt-pn input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line,#ccc);border-radius:6px;background:none;cursor:pointer}
#lt-pn .lt-r{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
#lt-pn .lt-ct{font-size:12px;color:var(--muted,#666)}
#lt-pn .lt-ct.baixo{color:#c0392b;font-weight:600}
#lt-pn button.lt-x{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line,#ccc);background:var(--soft,#eee);color:var(--ink,#111);cursor:pointer}
@media print{#lt-btn,#lt-pn{display:none!important}}
</style>
<script>
(function(){
var KEY='mm-leitura', root=document.documentElement;
var FUNDOS=[
 ['Branco','#ffffff'],['Creme','#fbf6e9'],['Sépia','#f4ecd8'],['Papel antigo','#ece0c6'],
 ['Verde suave','#e7f0e3'],['Azul suave','#e5edf5'],['Cinza-claro','#eceff1'],['Lavanda','#efebf6'],
 ['Cinza-escuro','#2b2f36'],['Sépia escuro','#2a231b'],['Verde-noite','#1a2520'],['Noturno','#121417']];
var LETRAS=[
 ['Preto','#111111'],['Grafite','#343a44'],['Marrom','#4a3423'],['Azul-marinho','#1c2a4d'],
 ['Verde-escuro','#1f3d2b'],['Vinho','#5c1f2c'],['Branco-gelo','#eef1f5'],['Bege claro','#e9dcc0'],
 ['Âmbar','#f0c674'],['Verde-claro','#b9e0c1'],['Azul-claro','#b7cdf2']];
var VARS=['--bg','--panel','--paper','--soft','--line','--muted','--code-bg','--ink','color-scheme'];
function ler(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function salvar(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function escuro(h){return lum(h)<.18}
function contraste(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var st=ler();
function aplicar(){
  var r=root.style; VARS.forEach(function(v){r.removeProperty(v)});
  if(st.bg){
    var d=escuro(st.bg), mx=d?'#ffffff':'#000000';
    root.dataset.theme=d?'dark':'light';
    r.setProperty('--panel',st.bg); r.setProperty('--paper',st.bg);
    r.setProperty('--bg','color-mix(in srgb,'+st.bg+' '+(d?'92%':'95%')+','+mx+')');
    r.setProperty('--soft','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--code-bg','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--line','color-mix(in srgb,'+st.bg+' '+(d?'78%':'84%')+','+mx+')');
    r.setProperty('color-scheme',d?'dark':'light');
  } else {
    var th=null; try{th=localStorage.getItem('mm-theme')}catch(e){}
    if(th) root.dataset.theme=th; else delete root.dataset.theme;
  }
  if(st.ink){
    r.setProperty('--ink',st.ink);
    r.setProperty('--muted','color-mix(in srgb,'+st.ink+' 72%,var(--panel,var(--paper,#888)))');
  }
}
aplicar();
function corFundoAtual(){
  var probe=document.getElementById('lt-pn')||document.body;
  var c=getComputedStyle(probe).backgroundColor.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#ffffff';
}
function corTextoAtual(){
  var c=getComputedStyle(document.body).color.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#111111';
}
function montar(){
  aplicar();
  var b=document.createElement('button'); b.id='lt-btn'; b.type='button'; b.title='Cores de leitura (fundo e letras)'; b.setAttribute('aria-label','Cores de leitura'); b.textContent='Aa';
  var p=document.createElement('div'); p.id='lt-pn'; p.hidden=true; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Cores de leitura');
  function grade(lista,chave,ehFundo){
    var h='<div class="lt-g"><button type="button" class="lt-s def" data-k="'+chave+'" data-v="" title="Padrão do tema">padrão</button>';
    lista.forEach(function(x){
      h+='<button type="button" class="lt-s" data-k="'+chave+'" data-v="'+x[1]+'" title="'+x[0]+'" style="'+(ehFundo?'background:'+x[1]+';color:'+(escuro(x[1])?'#eee':'#222'):'background:var(--panel,var(--paper,#fff));color:'+x[1])+'">'+(ehFundo?'':'Aa')+'</button>';
    });
    return h+'</div>';
  }
  p.innerHTML='<h3>Cores de leitura</h3>'+
   '<h4>Cor do fundo</h4>'+grade(FUNDOS,'bg',true)+
   '<label class="lt-c"><input type="color" data-k="bg"> Outra cor de fundo</label>'+
   '<h4>Cor das letras</h4>'+grade(LETRAS,'ink',false)+
   '<label class="lt-c"><input type="color" data-k="ink"> Outra cor de letra</label>'+
   '<div class="lt-r"><span class="lt-ct"></span><button type="button" class="lt-x">Restaurar padrão</button></div>';
  document.body.appendChild(p); document.body.appendChild(b);
  function sync(){
    p.querySelectorAll('.lt-s').forEach(function(s){s.classList.toggle('on',(st[s.dataset.k]||'')===s.dataset.v)});
    var bg=corFundoAtual(), ink=corTextoAtual();
    p.querySelector('input[data-k=bg]').value=st.bg||bg;
    p.querySelector('input[data-k=ink]').value=st.ink||ink;
    var c=contraste(bg,ink), el=p.querySelector('.lt-ct');
    el.textContent='Contraste '+c.toFixed(1)+':1'+(c<4.5?' (baixo para leitura)':'');
    el.classList.toggle('baixo',c<4.5);
  }
  function definir(k,v){ if(v) st[k]=v; else delete st[k]; salvar(st); aplicar(); sync(); }
  p.addEventListener('click',function(e){
    var s=e.target.closest('.lt-s'); if(s) definir(s.dataset.k,s.dataset.v);
    if(e.target.closest('.lt-x')){ st={}; salvar(st); aplicar(); sync(); }
  });
  p.addEventListener('input',function(e){ if(e.target.type==='color') definir(e.target.dataset.k,e.target.value); });
  b.addEventListener('click',function(){ p.hidden=!p.hidden; if(!p.hidden) sync(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') p.hidden=true; });
  document.addEventListener('click',function(e){ if(!p.hidden&&!p.contains(e.target)&&e.target!==b) p.hidden=true; });
  // O botão ◐ (claro/escuro) das páginas volta o fundo ao padrão do tema escolhido
  var tb=document.getElementById('themeBtn');
  if(tb) tb.addEventListener('click',function(){ if(st.bg){ delete st.bg; salvar(st); aplicar(); } });
  window.addEventListener('storage',function(e){ if(e.key===KEY){ st=ler(); aplicar(); if(!p.hidden) sync(); } });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar); else montar();
})();
</script>

", "ref": "Art. 4º"}]}, {"t": "Título II – Provimento, vacância, remoção, redistribuição e substituição (arts. 5º–39)", "tipo": "topico", "filhos": [{"t": "Provimento: nomeação, promoção, readaptação, reversão, aproveitamento, reintegração, recondução", "tipo": "classificacao", "ref": "Art. 8º"}, {"t": "Concurso: validade até 2 anos, prorrogável 1 vez por igual período", "tipo": "prazo", "ref": "Art. 12"}, {"t": "Posse em 30 dias; exercício em 15 dias", "tipo": "prazo", "ref": "Arts. 13, § 1º; 15, § 1º"}, {"t": "Estágio probatório 24 meses; estabilidade 2 anos (texto da lei)", "tipo": "prazo", "ref": "Arts. 20 e 21"}, {"t": "Vacância: exoneração, demissão, promoção, readaptação, aposentadoria, posse inacumulável, falecimento", "tipo": "classificacao", "ref": "Art. 33"}, {"t": "Remoção (servidor) × Redistribuição (cargo)", "tipo": "conceito", "ref": "Arts. 36 e 37"}, {"t": "Substituição: retribuição só após 30 dias consecutivos", "tipo": "prazo", "ref": "Art. 38, § 2º"}]}, {"t": "Título III – Direitos e vantagens (arts. 40–115)", "tipo": "topico", "filhos": [{"t": "Vencimento × Remuneração; irredutibilidade; teto", "tipo": "conceito", "ref": "Arts. 40–42"}, {"t": "Vantagens: indenizações (não incorporam), gratificações e adicionais", "tipo": "classificacao", "ref": "Art. 49"}, {"t": "Hora extra +50% (máx. 2h/jornada); noturno +25% (22h–5h); férias +1/3", "tipo": "prazo", "ref": "Arts. 73–76"}, {"t": "Férias: 30 dias, acumuláveis até 2 períodos, parceláveis em 3 etapas", "tipo": "prazo", "ref": "Art. 77"}, {"t": "Licenças (7 espécies do art. 81)", "tipo": "classificacao", "ref": "Art. 81"}, {"t": "Afastamentos: cessão, mandato eletivo, exterior, organismo internacional, pós-graduação", "tipo": "classificacao", "ref": "Arts. 93–96-A"}, {"t": "Concessões: sangue 1 dia; alistamento até 2 dias; casamento/luto 8 dias", "tipo": "prazo", "ref": "Art. 97"}, {"t": "Tempo de serviço: efetivo exercício × só aposentadoria/disponibilidade", "tipo": "regra", "ref": "Arts. 100–103"} ário de grande circulação", "tipo": "regra", "ref": "Art. 12, § 1º"}, {"t": "Não se abre novo concurso enquanto houver aprovado em concurso anterior com validade não expirada", "tipo": "excecao", "ref": "Art. 12, § 2º"}]}, {"t": "Posse e exercício (Seção IV)", "tipo": "topico", "ref": "Arts. 13–20", "filhos": [{"t": "Posse", "tipo": "topico", "ref": "Arts. 13–14", "filhos": [{"t": "Assinatura do termo com atribuições, deveres, responsabilidades e direitos", "tipo": "conceito", "d": "Não podem ser alterados unilateralmente, ressalvados atos de ofício previstos em lei.", "ref": "Art. 13"}, {"t": "Prazo: 30 dias da publicação do ato de provimento", "tipo": "prazo", "ref": "Art. 13, § 1º"}, {"t": "Se em licença (art. 81, I, III, V) ou afastamento (art. 102, I, IV, VI, VIII 'a','b','d','e','f', IX, X): conta do término do impedimento", "tipo": "excecao", "ref": "Art. 13, § 2º"}, {"t": "Pode ocorrer por procuração específica", "tipo": "regra", "ref": "Art. 13, § 3º"}, {"t": "Só há posse no provimento por nomeação", "tipo": "atencao", "ref": "Art. 13, § 4º"}, {"t": "Apresentar declaração de bens e valores e de acumulação de cargo/emprego/função", "tipo": "regra", "ref": "Art. 13, § 5º"}, {"t": "Sem posse no prazo: ato de provimento tornado sem efeito", "tipo": "sancao", "ref": "Art. 13, § 6º"}, {"t": "Depende de prévia inspeção médica oficial; só toma posse quem for apto física e mentalmente", "tipo": "regra", "ref": "Art. 14"}]}, {"t": "Exercício", "tipo": "topico", "ref": "Arts. 15–18", "filhos": [{"t": "Exercício: efetivo desempenho das atribuições do cargo ou função de confiança", "tipo": "conceito", "ref": "Art. 15"}, {"t": "Prazo: 15 dias contados da posse", "tipo": "prazo", "ref": "Art. 15, § 1º"}, {"t": "Sem exercício no prazo: exoneração (cargo) ou designação sem efeito (função)", "tipo": "sancao", "ref": "Art. 15, § 2º"}, {"t": "Compete à autoridade do órgão de destino dar exercício", "tipo": "competencia", "ref": "Art. 15, § 3º"}, {"t": "Função de confiança: exe ação de 1 mês por ano de exercício", "tipo": "prazo", "d": "Indenização isenta de IR; cargos vagos podem ser extintos.", "ref": "Art. 243, §§ 7º–9º"}, {"t": "Adicionais por tempo de serviço já concedidos viram anuênio", "tipo": "regra", "ref": "Art. 244"}, {"t": "Licença especial (Lei 1.711) vira licença-prêmio (arts. 87 a 90)", "tipo": "regra", "d": "Remissão desatualizada: no próprio PDF o art. 87 trata hoje da licença para capacitação (redação da Lei 9.527/97), arts. 88–89 revogados e 90 vetado.", "ref": "Art. 245"}, {"t": "Ajuste de contas com a Previdência pelo período celetista", "tipo": "regra", "ref": "Art. 247"}, {"t": "Pensões estatutárias anteriores mantidas pelo órgão de origem", "tipo": "regra", "ref": "Art. 248"}, {"t": "Contribuição na forma e percentuais vigentes até a lei do art. 231, § 1º", "tipo": "regra", "ref": "Art. 249"}, {"t": "Quem satisfizer em 1 ano as condições do art. 184, II, da Lei 1.711: aposenta com aquela vantagem", "tipo": "prazo", "d": "Dispositivo vetado e mantido pelo Congresso.", "ref": "Art. 250"}, {"t": "Vigência na publicação; efeitos financeiros no 1º dia do mês subsequente", "tipo": "prazo", "ref": "Art. 252"}, {"t": "Revoga a Lei 1.711/1952", "tipo": "regra", "ref": "Art. 253"}, {"t": "Arts. 246 (vetado) e 251 (revogado)", "tipo": "atencao", "ref": "Arts. 246 e 251"}]}, {"t": "Anexo: partes vetadas e mantidas pelo Congresso (1991)", "tipo": "topico", "filhos": [{"t": "Art. 87, § 2º; arts. 192, 193; art. 231, § 2º; art. 240, d e e; art. 250", "tipo": "classificacao"}, {"t": "Atualmente só o art. 250 subsiste no corpo da lei; os demais foram revogados ou reescritos", "tipo": "atencao", "d": "Arts. 192, 193 e 231 revogados; art. 87 reescrito pela Lei 9.527/97; art. 240, d e e revogadas."}]}]}}], "comparacoes": [{"titulo": "Remoção × Redistribuição", "colunas": ["Aspecto", "Remoção", "Redistribuição"], "linhas": [["O que se desloca", "O servidor", "O cargo efetivo (ocupado ou vago)"], ["Âmbito", "Mesmo quadro, com ou sem mudança de sede", "Para outro órgão/entidade do mesmo Poder"], ["Iniciativa", "De ofício ou a pedido (3 modalidades)", "Ex officio, interesse da administração"], ["Participação do SIPEC", "Não exigida", "Prévia apreciação do órgão central do SIPEC"], ["Base legal", "Art. 36", "Art. 37"]]}, {"titulo": "Reintegração × Recondução × Reversão × Aproveitamento", "colunas": ["Aspecto", "Reintegração", "Recondução", "Reversão", "Aproveitamento"], "linhas": [["Quem", "Estável demitido", "Estável", "Aposentado", "Servidor em disponibilidade"], ["Causa", "Invalidação da demissão (adm. ou judicial)", "Inabilitação em estágio de outro cargo ou reintegração do anterior ocupante", "Invalidez insubsistente ou interesse da Administração", "Retorno obrigatório à atividade"], ["Efeito", "Ressarcimento de todas as vantagens", "Volta ao cargo anterior", "Volta ao mesmo cargo ou transformado", "Cargo de atribuições e vencimentos compatíveis"], ["Base legal", "Art. 28", "Art. 29", "Arts. 25–27", "Arts. 30–32"]]}, {"titulo": "Sindicância × PAD × Rito sumário", "colunas": ["Aspecto", "Sindicância", "PAD", "Rito sumário"], "linhas": [["Prazo", "30 dias + 30", "60 dias + 60", "30 dias + até 15"], ["Comissão", "Não fixada no texto", "3 servidores estáveis", "2 servidores estáveis"], ["Penas possíveis", "Advertência ou suspensão até 30 dias", "Todas", "Demissão, destituição ou cassação (acumulação, abandono, inassiduidade)"], ["Defesa", "Ampla defesa", "10 dias (20 se vários; edital 15)", "5 dias"], ["Base legal", "Art. 145", "Arts. 148–166", "Arts. 133 e 140"]]}, {"titulo": "Prescrição: direito de petição × ação disciplinar", "colunas": ["Aspecto", "Direito de requerer (art. 110)", "Ação disciplinar (art. 142)"], "linhas": [["Prazos", "5 anos (demissão, cassação, patrimonial) / 120 dias (demais)", "5 anos (demissão, cassação, destituição) / 2 anos (suspensão) / 180 dias (advertência)"], ["Termo inicial", "Publicação do ato ou ciência", "Data em que o fato se tornou conhecido"], ["Interrupção", "Pedido de reconsideração e recurso", "Abertura de sindicância ou instauração de PAD"]]}, {"titulo": "Licenças: com × sem remuneração", "colunas": ["Licença", "Remuneração", "Prazo", "Base"], "linhas": [["Doença em pessoa da família", "60 dias com + 90 dias sem (a cada 12 meses)", "Até 150 dias somados", "Art. 83"], ["Afastamento do cônjuge", "Sem", "Indeterminado", "Art. 84"], ["Serviço militar", "Legislação específica; 30 dias sem remuneração para reassumir", "Duração do serviço", "Art. 85"], ["Atividade política", "Sem (convenção a véspera do registro); com vencimento (registro até 10º dia após eleição, máx. 3 meses)", "Período eleitoral", "Art. 86"], ["Capacitação", "Com", "Até 3 meses por quinquênio", "Art. 87"], ["Interesses particulares", "Sem", "Até 3 anos", "Art. 91"], ["Mandato classista", "Sem", "Duração do mandato", "Art. 92"], ["Tratamento de saúde", "Com", "Efetivo exercício até 24 meses", "Arts. 202–206"], ["Gestante / adotante / paternidade", "Com", "120 / 90 ou 30 / 5 dias", "Arts. 207–210"], ["Acidente em serviço", "Integral", "—", "Art. 211"]]}, {"titulo": "Advertência × Suspensão × Demissão", "colunas": ["Aspecto", "Advertência", "Suspensão", "Demissão"], "linhas": [["Hipóteses", "Art. 117, I–VIII e XIX; violação de dever", "Reincidência; art. 117, XVII–XVIII; demais não sujeitas a demissão", "Art. 132 (inclui art. 117, IX–XVI)"], ["Limite", "Por escrito", "Até 90 dias (multa 50%/dia possível)", "—"], ["Cancelamento do registro", "3 anos", "5 anos", "Não há"], ["Prescrição", "180 dias", "2 anos", "5 anos"], ["Competência", "Chefe da repartição", "Chefe (até 30 dias) / autoridade inferior à máxima (> 30 dias)", "Presidente da República, Presidentes das Casas, Tribunais, PGR"]]}, {"titulo": "Abandono de cargo × Inassiduidade habitual", "colunas": ["Aspecto", "Abandono", "Inassiduidade habitual"], "linhas": [["Conceito", "Ausência intencional por mais de 30 dias consecutivos", "Faltas sem causa justificada por 60 dias, interpoladamente, em 12 meses"], ["Pena", "Demissão", "Demissão"], ["Rito", "Sumário (art. 140)", "Sumário (art. 140)"], ["Base legal", "Art. 138", "Art. 139"]]}, {"titulo": "Adicionais e gratificações – percentuais", "colunas": ["Vantagem", "Valor", "Base"], "linhas": [["Serviço extraordinário", "+50% sobre a hora normal; máx. 2h por jornada", "Arts. 73–74"], ["Adicional noturno", "+25%; 22h às 5h; hora de 52min30s", "Art. 75"], ["Adicional de férias", "1/3 da remuneração", "Art. 76"], ["Gratificação natalina", "1/12 por mês; fração ≥ 15 dias = mês", "Art. 63"], ["GECC", "2,2% ou 1,2% do maior vencimento básico por hora; 120 h/ano", "Art. 76-A"], ["Auxílio-moradia", "Até 25% do cargo em comissão; mínimo garantido até R$ 1.800", "Art. 60-D"], ["Ajuda de custo", "Até 3 remunerações", "Art. 54"]]}], "pegadinhas": [{"texto": "A validade do concurso é de ATÉ 2 anos, prorrogável UMA única vez por IGUAL período (não 'por até 2 anos').", "ref": "Art. 12"}, {"texto": "Posse: 30 dias da publicação do ato de provimento; exercício: 15 dias da POSSE (não da publicação).", "ref": "Arts. 13, § 1º; 15, § 1º"}, {"texto": "Só há posse no provimento por NOMEAÇÃO; demais formas de provimento não têm posse.", "ref": "Art. 13, § 4º"}, {"texto": "Não tomar posse no prazo: ato tornado SEM EFEITO; não entrar em exercício: EXONERAÇÃO.", "ref": "Arts. 13, § 6º; 15, § 2º"}, {"texto": "O texto da lei fala em estágio de 24 meses e estabilidade em 2 anos, mas o PDF anota 'vide EMC 19' (3 anos).", "ref": "Arts. 20 e 21"}, {"texto": "Reintegração e recondução são exclusivas do servidor ESTÁVEL.", "ref": "Arts. 28 e 29"}, {"texto": "Não pode reverter o aposentado com 70 anos completos; reversão por interesse exige aposentadoria voluntária nos 5 anos anteriores.", "ref": "Arts. 25, II, d; 27"}, {"texto": "Remoção a pedido (modalidades II e III) não dá direito a ajuda de custo.", "ref": "Art. 53, § 3º"}, {"texto": "Substituto só recebe retribuição em afastamentos superiores a 30 dias consecutivos, e só pelos dias que excederem.", "ref": "Art. 38, § 2º"}, {"texto": "Diária é devida pela METADE quando não houver pernoite; restituição em 5 dias se não se afastar.", "ref": "Arts. 58, § 1º; 59"}, {"texto": "Insalubridade e periculosidade não se acumulam: o servidor deve optar por um dos adicionais.", "ref": "Art. 68, § 1º"}, {"texto": "Hora noturna = 52 minutos e 30 segundos, com acréscimo de 25% (e não 20%).", "ref": "Art. 75"}, {"texto": "Férias acumulam até 2 períodos; parcelamento em até 3 etapas exige requerimento do servidor E interesse da administração.", "ref": "Art. 77"}, {"texto": "Licença para capacitação: até 3 meses a cada quinquênio, NÃO acumuláveis.", "ref": "Art. 87"}, {"texto": "Licença para interesses particulares é a critério da Administração (não é direito), até 3 anos, vedada no estágio probatório.", "ref": "Art. 91"}, {"texto": "Afastamento para organismo internacional: perda TOTAL da remuneração, mas conta como efetivo exercício.", "ref": "Arts. 96 e 102, XI"}, {"texto": "Mestrado exige 3 anos no cargo e doutorado 4 anos, incluído o estágio probatório.", "ref": "Art. 96-A, § 2º"}, {"texto": "Doação de sangue: 1 dia; alistamento eleitoral: até 2 dias; casamento ou luto: 8 dias consecutivos.", "ref": "Art. 97"}, {"texto": "Horário especial do estudante exige compensação; o da pessoa com deficiência não exige.", "ref": "Art. 98, §§ 1º e 2º"}, {"texto": "Reconsideração e recurso: 30 dias; despacho em 5 dias e decisão em 30 dias. Pedido de reconsideração NÃO pode ser renovado.", "ref": "Arts. 106 e 108"}, {"texto": "Absolvição criminal só afasta a responsabilidade administrativa se negar o FATO ou a AUTORIA.", "ref": "Art. 126"}, {"texto": "Suspensão máxima de 90 dias; sindicância só aplica suspensão até 30 dias.", "ref": "Arts. 130 e 145, II"}, {"texto": "Prescrição disciplinar conta da data em que o fato se tornou CONHECIDO, não da data do fato.", "ref": "Art. 142, § 1º"}, {"texto": "Comissão de PAD: 3 servidores estáveis; rito sumário: 2 servidores estáveis.", "ref": "Arts. 149 e 133, I"}, {"texto": "Julgamento fora do prazo legal NÃO gera nulidade do processo; revisão não pode agravar a pena.", "ref": "Arts. 169, § 1º; 182, parágrafo único"}], "erros_frequentes": [{"texto": "Achar que indenizações (ajuda de custo, diárias, transporte, auxílio-moradia) se incorporam ao vencimento – nunca se incorporam.", "ref": "Art. 49, § 1º"}, {"texto": "Confundir remoção (desloca o servidor) com redistribuição (desloca o cargo).", "ref": "Arts. 36 e 37"}, {"texto": "Considerar a demissão de comissionado como 'exoneração': para não ocupante de efetivo a pena é destituição de cargo em comissão.", "ref": "Art. 135"}, {"texto": "Trocar os prazos de cancelamento de registro (advertência 3 anos; suspensão 5 anos) com os de prescrição (180 dias; 2 anos).", "ref": "Arts. 131 e 142"}, {"texto": "Supor que o afastamento preventivo suspende a remuneração – é sem prejuízo da remuneração, até 60 + 60 dias.", "ref": "Art. 147"}, {"texto": "Confundir prazos de defesa: 10 dias (um indiciado), 20 dias (vários), 15 dias (edital), 5 dias (rito sumário).", "ref": "Arts. 161, 163 e 133, § 2º"}, {"texto": "Pensar que a licença por doença em pessoa da família é toda remunerada: só 60 dias; os outros 90 são sem remuneração.", "ref": "Art. 83, § 2º"}, {"texto": "Confundir abandono (mais de 30 dias consecutivos) com inassiduidade (60 dias interpolados em 12 meses).", "ref": "Arts. 138 e 139"}, {"texto": "Achar que mandato eletivo conta como efetivo exercício para promoção por merecimento – é exceção expressa.", "ref": "Art. 102, V"}, {"texto": "Supor que auxílio-reclusão é sempre 1/2: na prisão em flagrante ou preventiva é 2/3; na condenação definitiva sem perda do cargo, 1/2.", "ref": "Art. 229"}], "relacoes": [{"texto": "Constituição Federal, art. 41 (EC 19/1998): estabilidade após 3 anos de efetivo exercício; o PDF faz remissão 'vide EMC nº 19' nos arts. 20 e 21.", "ext": true}, {"texto": "CF, art. 40 e EC 103/2019: regras atuais de aposentadoria do servidor (o art. 186 traz a redação original e remete ao art. 40 da CF).", "ext": true}, {"texto": "CF, art. 37, XVI e XVII: hipóteses constitucionais de acumulação lícita a que remete o art. 118 (dois cargos de professor; professor + outro cargo; dois cargos/empregos privativos de profissionais de saúde). Desde a EC 138/2025, a alínea b admite professor com outro cargo 'de qualquer natureza' (antes: 'técnico ou científico').", "ext": true}, {"texto": "Lei 9.784/1999 (processo administrativo federal): aplicação subsidiária a processos administrativos, inclusive quanto a recursos e prazos não regulados pela Lei 8.112.", "ext": true}, {"texto": "Lei 8.429/1992 (improbidade administrativa): relaciona-se com a demissão por improbidade (art. 132, IV) e a indisponibilidade de bens (art. 136).", "ext": true}, {"texto": "Lei 8.745/1993: contratação temporária de excepcional interesse público, que revogou os arts. 232–235.", "ext": true}, {"texto": "Lei 11.091/2005 (PCCTAE) e Lei 12.772/2012 (magistério federal): planos de carreira aplicáveis aos servidores do IFPA, que complementam a Lei 8.112.", "ext": true}], "perguntas": [{"p": "Quais são os requisitos básicos para investidura em cargo público?", "r": "Nacionalidade brasileira, gozo dos direitos políticos, quitação com obrigações militares e eleitorais, escolaridade exigida, idade mínima de 18 anos e aptidão física e mental.", "ref": "Art. 5º"}, {"p": "Qual o percentual máximo de vagas reservadas a pessoas com deficiência?", "r": "Até 20% das vagas oferecidas no concurso.", "ref": "Art. 5º, § 2º"}, {"p": "Quais são as formas de provimento vigentes?", "r": "Nomeação, promoção, readaptação, reversão, aproveitamento, reintegração e recondução.", "ref": "Art. 8º"}, {"p": "Quais os prazos para posse e para entrar em exercício?", "r": "Posse em 30 dias da publicação do ato de provimento; exercício em 15 dias da posse.", "ref": "Arts. 13, § 1º; 15, § 1º"}, {"p": "Quais fatores são avaliados no estágio probatório?", "r": "Assiduidade, disciplina, capacidade de iniciativa, produtividade e responsabilidade.", "ref": "Art. 20"}, {"p": "Como o servidor estável pode perder o cargo segundo a Lei 8.112?", "r": "Por sentença judicial transitada em julgado ou por PAD com ampla defesa.", "ref": "Art. 22"}, {"p": "Quais os requisitos da reversão no interesse da administração?", "r": "Pedido do aposentado, aposentadoria voluntária, estável na atividade, aposentadoria nos 5 anos anteriores e cargo vago; vedada a quem tem 70 anos.", "ref": "Arts. 25, II; 27"}, {"p": "Quais são as modalidades de remoção a pedido independentemente do interesse da Administração?", "r": "Acompanhar cônjuge servidor deslocado no interesse da Administração; motivo de saúde comprovado por junta médica; processo seletivo quando interessados excedem vagas.", "ref": "Art. 36, parágrafo único, III"}, {"p": "Qual o limite da jornada de trabalho?", "r": "Máximo de 40 horas semanais, com mínimo de 6 e máximo de 8 horas diárias, salvo leis especiais.", "ref": "Art. 19"}, {"p": "O que acontece com quem recebe diárias e não se afasta da sede?", "r": "Deve restituí-las integralmente em 5 dias.", "ref": "Art. 59"}, {"p": "Qual o limite da ajuda de custo e o prazo para se apresentar na nova sede?", "r": "Até 3 meses de remuneração; deve apresentar-se em 30 dias, sob pena de restituir.", "ref": "Arts. 54 e 57"}, {"p": "Qual o valor máximo do auxílio-moradia?", "r": "25% do valor do cargo em comissão, função ou cargo de Ministro ocupado, sem superar 25% da remuneração de Ministro; garantido o ressarcimento até R$ 1.800,00.", "ref": "Art. 60-D"}, {"p": "Como se calcula a gratificação natalina e quando é paga?", "r": "1/12 da remuneração de dezembro por mês de exercício, considerando mês integral a fração de 15 dias ou mais; paga até 20 de dezembro.", "ref": "Arts. 63–64"}, {"p": "Quais os percentuais do serviço extraordinário e do adicional noturno?", "r": "Extraordinário: 50% sobre a hora normal, máximo 2 horas por jornada. Noturno: 25%, das 22h às 5h, com hora de 52min30s.", "ref": "Arts. 73–75"}, {"p": "Quantos dias de férias tem o servidor que opera com Raios X?", "r": "20 dias consecutivos por semestre, proibida a acumulação.", "ref": "Art. 79"}, {"p": "Em que hipóteses as férias podem ser interrompidas?", "r": "Calamidade pública, comoção interna, convocação para júri, serviço militar ou eleitoral, ou necessidade do serviço declarada pela autoridade máxima.", "ref": "Art. 80"}, {"p": "Quais licenças podem ser concedidas ao servidor em estágio probatório?", "r": "As do art. 81, I a IV (doença na família, afastamento do cônjuge, serviço militar, atividade política), os afastamentos dos arts. 94, 95 e 96 e o curso de formação para outro cargo federal.", "ref": "Art. 20, § 4º"}, {"p": "Quais os limites da licença por motivo de doença em pessoa da família?", "r": "A cada 12 meses, até 60 dias com remuneração e até 90 dias sem remuneração, consecutivos ou não.", "ref": "Art. 83, § 2º"}, {"p": "Qual o número de servidores licenciáveis para mandato classista?", "r": "2 (até 5.000 associados), 4 (5.001 a 30.000) e 8 (mais de 30.000).", "ref": "Art. 92"}, {"p": "Como fica o servidor eleito vereador?", "r": "Com compatibilidade de horário, recebe as vantagens do cargo sem prejuízo da remuneração do mandato; sem compatibilidade, é afastado, podendo optar pela remuneração.", "ref": "Art. 94, III"}, {"p": "Qual o prazo máximo de afastamento para estudo ou missão no exterior?", "r": "4 anos; nova ausência só após igual período.", "ref": "Art. 95, § 1º"}, {"p": "Que tempo conta apenas para aposentadoria e disponibilidade?", "r": "Serviço estadual/municipal/distrital, licença remunerada por doença na família que exceder 30 dias em 12 meses, licença para atividade política (art. 86, § 2º), mandato eletivo anterior ao ingresso, atividade privada vinculada à Previdência, tiro de guerra e licença para tratamento de saúde que exceder 24 meses.", "ref": "Art. 103"}, {"p": "Quais os prazos de prescrição do direito de requerer?", "r": "5 anos para demissão, cassação de aposentadoria/disponibilidade, interesse patrimonial e créditos trabalhistas; 120 dias nos demais casos.", "ref": "Art. 110"}, {"p": "Quais proibições do art. 117 levam à demissão?", "r": "Incisos IX a XVI (valer-se do cargo, gerência de sociedade/comércio, intermediação, propina, estado estrangeiro, usura, desídia, uso de recursos da repartição).", "ref": "Art. 132, XIII"}, {"p": "Quando a acumulação de cargos, mesmo lícita, é admitida?", "r": "Somente com comprovação da compatibilidade de horários.", "ref": "Art. 118, § 2º"}, {"p": "Quais são as penalidades disciplinares?", "r": "Advertência, suspensão, demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão e destituição de função comissionada.", "ref": "Art. 127"}, {"p": "Quando a suspensão pode ser convertida em multa?", "r": "Por conveniência do serviço, na base de 50% por dia de vencimento ou remuneração, permanecendo o servidor em serviço.", "ref": "Art. 130, § 2º"}, {"p": "Quem aplica a pena de demissão?", "r": "O Presidente da República, os Presidentes das Casas do Legislativo e dos Tribunais Federais e o Procurador-Geral da República.", "ref": "Art. 141, I"}, {"p": "Quais os prazos de prescrição da ação disciplinar?", "r": "5 anos (demissão, cassação e destituição de cargo em comissão), 2 anos (suspensão) e 180 dias (advertência), contados da data em que o fato se tornou conhecido.", "ref": "Art. 142"}, {"p": "Qual o prazo da sindicância e o que dela pode resultar?", "r": "Até 30 dias, prorrogável por igual período; pode resultar em arquivamento, advertência ou suspensão de até 30 dias, ou instauração de PAD.", "ref": "Art. 145"}, {"p": "Quando o PAD é obrigatório?", "r": "Quando o ilícito ensejar suspensão por mais de 30 dias, demissão, cassação de aposentadoria ou disponibilidade, ou destituição de cargo em comissão.", "ref": "Art. 146"}, {"p": "Qual o prazo do afastamento preventivo?", "r": "Até 60 dias, sem prejuízo da remuneração, prorrogável por igual prazo.", "ref": "Art. 147"}, {"p": "Qual a composição da comissão de PAD e o prazo de conclusão?", "r": "3 servidores estáveis; 60 dias da publicação do ato que a constituir, prorrogável por igual prazo.", "ref": "Arts. 149 e 152"}, {"p": "Qual o prazo para julgamento do PAD?", "r": "20 dias do recebimento do processo; julgamento fora do prazo não gera nulidade.", "ref": "Arts. 167 e 169, § 1º"}, {"p": "Quais as regras da revisão do processo disciplinar?", "r": "Cabe a qualquer tempo, com fatos novos; ônus da prova do requerente; comissão revisora tem 60 dias; julgamento em 20 dias; não pode agravar a pena.", "ref": "Arts. 174–182"}, {"p": "Qual a duração da licença à gestante, à adotante e paternidade?", "r": "Gestante: 120 dias; adotante: 90 dias (criança até 1 ano) ou 30 dias (mais de 1 ano); paternidade: 5 dias.", "ref": "Arts. 207, 208 e 210"}, {"p": "Quanto vale o auxílio-funeral e em quanto tempo é pago?", "r": "Um mês da remuneração ou provento, pago em 48 horas à pessoa da família que custeou o funeral.", "ref": "Art. 226"}, {"p": "Quais os valores do auxílio-reclusão?", "r": "2/3 da remuneração na prisão em flagrante ou preventiva; metade na condenação definitiva a pena que não determine perda do cargo.", "ref": "Art. 229"}, {"p": "Como se contam os prazos da Lei 8.112?", "r": "Em dias corridos, excluindo o dia do começo e incluindo o do vencimento, prorrogando-se para o primeiro dia útil se vencer em dia sem expediente.", "ref": "Art. 238"}, {"p": "Por quanto tempo dura a pensão do cônjuge com 35 anos na data do óbito (18 contribuições e 2 anos de união)?", "r": "15 anos (faixa de 30 a 40 anos de idade).", "ref": "Art. 222, VII, b, 4"}], "cobertura": [{"item": "Título I – Capítulo Único (arts. 1º–4º)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. I, Seção I – Disposições gerais (arts. 5º–8º)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. I, Seção II – Nomeação (arts. 9º–10)", "status": "ok", "obs": ""}, {"item": "Título II – C : "ok", "obs": ""}, {"item": "Título IV – Cap. III – Acumulação (arts. 118–120)", "status": "ok", "obs": ""}, {"item": "Título IV – Cap. IV – Responsabilidades (arts. 121–126-A)", "status": "ok", "obs": ""}, {"item": "Título IV – Cap. V – Penalidades (arts. 127–142)", "status": "ok", "obs": ""}, {"item": "Título V – Cap. I – Disposições gerais do PAD (arts. 143–146)", "status": "ok", "obs": "§§ 1º–2º do art. 143 revogados."}, {"item": "Título V – Cap. II – Afastamento preventivo (art. 147)", "status": "ok", "obs": ""}, {"item": "Título V – Cap. III – Processo disciplinar (arts. 148–152)", "status": "ok", "obs": ""}, {"item": "Título V – Cap. III, Seção I – Inquérito (arts. 153–166)", "status": "ok", "obs": ""}, {"item": "Título V – Cap. III, Seção II – Julgamento (arts. 167–173)", "status": "ok", "obs": ""}, {"item": "Título V – Cap. III, Seção III – Revisão do processo (arts. 174–182)", "status": "ok", "obs": ""}, {"item": "Título VI – Cap. I – Disposições gerais da seguridade (arts. 183–185)", "status": "ok", "obs": ""}, {"item": "Título VI – Cap. II, Seção I – Aposentadoria (arts. 186–195)", "status": "ok", "obs": "Arts. 192–193 revogados; regras do art. 186 em redação original (ver nao_verificado)."}, {"item": "Título VI – Cap. II, Seções II a VI – Auxílio-natalidade, salário-família, licenças de saúde, gestante/adotante/paternidade, acidente (arts. 196–214)", "status": "ok", "obs": ""}, {"item": "Título VI – Cap. II, Seção VII – Pensão (arts. 215–225)", "status": "ok", "obs": "Art. 216 e várias alíneas/parágrafos revogados."}, {"item": "Título VI – Cap. II, Seções VIII–IX – Auxílio-funeral e auxílio-reclusão (arts. 226–229)", "status": "ok", "obs": ""}, {"item": "Título VI – Cap. III – Assistência à saúde (art. 230)", "status": "ok", "obs": ""}, {"item": "Título VI – Cap. IV – Custeio (art. 231)", "status": "ok", "obs": "Revogado; apenas mencionado."}, {"item": "Título VII – Contratação temporária (arts. 232–235)", "status": "ok", "obs": "Todos revogados pela Lei 8.745/93; apenas mencionados."}, {"item": "Título VIII – Disposições gerais (arts. 236–242)", "status": "ok", "obs": ""}, {"item": "Título IX – Disposições transitórias e finais (arts. 243–253)", "status": "ok", "obs": "Art. 246 vetado; art. 251 revogado."}, {"item": "Anexo – Partes vetadas e mantidas pelo Congresso (1991)", "status": "ok", "obs": "Registrado como nó de atenção; maior parte superada."}], "nao_verificado": ["O texto extraído não mostra trechos riscados (redações anteriores); foram usadas apenas as redações que aparecem no PDF, e os dispositivos marcados '(Revogado)', '(VETADO)' ou '(Vigência encerrada)' não foram tratados como regra vigente.", "Conferido: arts. 20 e 21 do PDF (e do Planalto atual) mantêm 24 meses de estágio e 2 anos de estabilidade, com as notas 'vide EMC nº 19' e 'prazo 3 anos - vide EMC nº 19'. O mapa traz o texto da lei e o alerta.", "Conferido: art. 186 está na redação original com 'Vide art. 40 da Constituição'; os requisitos atuais estão na CF/EC 103/2019 (nó de alerta ext). Os incisos do art. 186 não valem como regra atual de aposentadoria.", "Conferido (PDF via pdftotext): art. 217, IV, c aparece só como '(Vide Lei nº 13.135, de 2015) (Vigência)'. No Planalto atual: 'c) tenha deficiência grave; ou' (Lei 13.135/2015). Foi acrescentado um nó de alerta ext.", "Conferido: a remissão do art. 222, III às 'alíneas a e b do inciso VII do caput deste artigo' está correta (art. 222, VII, a e b: prazos da pensão de cônjuge/companheiro).", "Conferido: o art. 169, § 2º remete ao art. 142, § 2º (prazos da lei penal para infração que também é crime); a remissão é coerente.", "Resultados externos (ext): ADI 2975 (2020) declarou inconstitucional o art. 137, parágrafo único; ADPF 418 (2020) foi julgada improcedente, ou seja, a cassação de aposentadoria (arts. 127, IV, e 134) é constitucional. No PDF a nota 'Vide ADIN 2975' fica no caput do art. 137.", "Arts. 93, §§ 6º–7º: o texto (PDF e Planalto atual) ainda diz 'Ministério do Planejamento, Orçamento e Gestão'; hoje a gestão de pessoal civil fica com o Ministério da Gestão e da Inovação em Serviços Públicos (informação externa, não está no PDF).", "Conferido: o art. 245 remete à licença-prêmio dos arts. 87 a 90, mas no próprio PDF o art. 87 trata hoje da licença para capacitação (Lei 9.527/97), os arts. 88–89 foram revogados e o 90 foi vetado. A remissão está desatualizada no texto legal; o nó do art. 245 explica isso."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
