<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lei nº 9.784/1999</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;
  --c-excecao:#be123c; --c-competencia:#0e7490; --c-sancao:#9f1239; --c-exemplo:#a16207; --c-atencao:#d97706;
  --mark:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
    --mark:#7a5d00;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}
</style>

ts. 66–70)", "raiz": {"t": "Prazos, sanções e disposições finais", "tipo": "topico", "filhos": [{"t": "Contagem de prazos (Cap. XVI)", "tipo": "topico", "ref": "Arts. 66–67", "filhos": [{"t": "Início: data da cientificação oficial", "tipo": "regra", "ref": "Art. 66"}, {"t": "Exclui o dia do começo; inclui o do vencimento", "tipo": "prazo", "ref": "Art. 66"}, {"t": "Vencimento sem expediente ou encerrado antes: prorroga ao 1º dia útil", "tipo": "prazo", "ref": "Art. 66, § 1º"}, {"t": "Prazos em dias: contagem contínua", "tipo": "prazo", "ref": "Art. 66, § 2º"}, {"t": "Meses/anos: de data a data; sem dia equivalente → último dia do mês", "tipo": "prazo", "ref": "Art. 66, § 3º"}, {"t": "Prazos não se suspendem, salvo força maior comprovada", "tipo": "excecao", "ref": "Art. 67"}, {"t": "Contagem contínua, mas há prazos expressos em 'dias úteis' (arts. 26, 41, 62)", "tipo": "atencao"}]}, {"t": "Sanções (Cap. XVII)", "tipo": "topico", "ref": "Art. 68", "filhos": [{"t": "Aplicadas por autoridade competente", "tipo": "competencia", "ref": "Art. 68"}, {"t": "Natureza pecuniária ou obrigação de fazer/não fazer", "tipo": "classificacao", "ref": "Art. 68"}, {"t": "Sempre assegurado o direito de defesa", "tipo": "regra", "ref": "Art. 68"}]}, {"t": "Disposições finais (Cap. XVIII)", "tipo": "topico", "ref": "Arts. 69–70", "filhos": [{"t": "Processos específicos: lei própria; esta Lei apenas subsidiária", "tipo": "regra", "ref": "Art. 69"}, {"t": "Prioridade de tramitação (Lei 12.008/2009)", "tipo": "topico", "ref": "Art. 69-A", "filhos": [{"t": "Em qualquer órgão ou instância; parte ou interessado", "tipo": "regra", "ref": "Art. 69-A, caput"}, {"t": "I – idade igual ou superior a 60 anos", "tipo": "prazo", "ref": "Art. 69-A, I"}, {"t": "II – pessoa com deficiência física ou mental", "tipo": "classificacao", "ref": "Art. 69-A, II"}, {"t": "IV – doenças graves listadas ou outra grave (medicina especializada)", "tipo": "classificacao", "d": "Tuberculose ativa, esclerose múltipla, neoplasia maligna, hanseníase, paralisia irreversível e incapacitante, cardiopatia grave, Parkinson, espondiloartrose anquilosante, nefropatia grave, hepatopatia grave, Paget avançada (osteíte deformante), contaminação por radiação, AIDS.", "ref": "Art. 69-A, IV"}, {"t": "Mesmo que a doença seja contraída após o início do processo", "tipo": "atencao", "ref": "Art. 69-A, IV"}, {"t": "Requerimento com prova da condição à autoridade competente", "tipo": "regra", "ref": "Art. 69-A, § 1º"}, {"t": "Deferida: autos com identificação própria de tramitação prioritária", "tipo": "regra", "ref": "Art. 69-A, § 2º"}, {"t": "Vetados: inciso III e §§ 3º e 4º", "tipo": "atencao", "ref": "Art. 69-A"}]}, {"t": "Vigência: data da publicação", "tipo": "regra", "ref": "Art. 70"}]}]}}, {"id": "prazos", "titulo": "Quadro de prazos e números da Lei 9.784/1999", "raiz": {"t": "Todos os prazos e números", "tipo": "topico", "filhos": [{"t": "Dias úteis", "tipo": "topico", "filhos": [{"t": "3 dias úteis – antecedência da intimação para comparecimento", "tipo": "prazo", "ref": "Art. 26, § 2º"}, {"t": "3 dias úteis – antecedência da intimação de prova/diligência", "tipo": "prazo", "ref": "Art. 41"}, {"t": "5 dias úteis – alegações dos demais interessados no recurso", "tipo": "prazo", "ref": "Art. 62"}]}, {"t": "Dias (corridos)", "tipo": "topico", "filhos": [{"t": "5 dias – prazo geral para atos (dilatável até o dobro)", "tipo": "prazo", "ref": "Art. 24"}, {"t": "5 dias – reconsideração pela autoridade recorrida", "tipo": "prazo", "ref": "Art. 56, § 1º"}, {"t": "10 dias – manifestação após encerrada a instrução", "tipo": "prazo", "ref": "Art. 44"}, {"t": "10 dias – interposição de recurso", "tipo": "prazo", "ref": "Art. 59"}, {"t": "15 dias – parecer obrigatório de órgão consultivo", "tipo": "prazo", "ref": "Art. 42"}, {"t": "30 dias (+30) – decidir após a instrução", "tipo": "prazo", "ref": "Art. 49"}, {"t": "30 dias (+30) – decidir recurso", "tipo": "prazo", "ref": "Art. 59, §§ 1º e 2º"}]}, {"t": "Anos e outros números", "tipo": "topico", "filhos": [{"t": "5 anos – decadência para anular atos favoráveis", "tipo": "prazo", "ref": "Art. 54"}, {"t": "A qualquer tempo – revisão de processo sancionador", "tipo": "prazo", "ref": "Art. 65"}, {"t": "18 anos – capacidade processual", "tipo": "prazo", "ref": "Art. 10"}, {"t": "60 anos – prioridade de tramitação", "tipo": "prazo", "ref": "Art. 69-A, I"}, {"t": "3 instâncias – máximo do recurso", "tipo": "prazo", "ref": "Art. 57"}, {"t": "3 ou mais órgãos – decisão coordenada", "tipo": "prazo", "ref": "Art. 49-A"}, {"t": "3º grau – parentesco/afinidade em impedimento e suspeição", "tipo": "prazo", "ref": "Arts. 18, II e 20"}]}]}}], "comparacoes": [{"titulo": "Impedimento × Suspeição", "colunas": ["Aspecto", "Impedimento", "Suspeição"], "linhas": [["Base legal", "Arts. 18–19", "Arts. 20–21"], ["Hipóteses", "Interesse direto/indireto; atuação como perito, testemunha ou representante (inclusive de cônjuge, companheiro, parentes/afins até 3º grau); litígio com interessado ou cônjuge/companheiro", "Amizade íntima ou inimizade notória com interessados ou seus cônjuges, companheiros, parentes e afins até 3º grau"], ["Natureza", "Objetiva; dever de abster-se", "Subjetiva; 'pode ser arguida'"], ["Conduta do agente", "Comunicar à autoridade competente e abster-se", "Lei não prevê dever de comunicar; arguição pelo interessado"], ["Consequência", "Omissão em comunicar = falta grave disciplinar", "Indeferimento da arguição: recurso sem efeito suspensivo"]]}, {"titulo": "Delegação × Avocação", "colunas": ["Aspecto", "Delegação", "Avocação"], "linhas": [["Base legal", "Arts. 12–14", "Art. 15"], ["Sentido", "Transfere parte da competência a outro órgão/titular", "Superior chama para si competência do inferior"], ["Hierarquia", "Dispensa subordinação hierárquica", "Só de órgão hierarquicamente inferior"], ["Pressupostos", "Conveniência por razões técnicas, sociais, econômicas, jurídicas ou territoriais; sem impedimento legal", "Caráter excepcional, temporário e motivos relevantes devidamente justificados"], ["Limites", "Vedada para atos normativos, recursos e competência exclusiva", "Lei não lista vedações específicas"], ["Formalidades", "Publicação do ato e da revogação; especificar matérias, limites, duração, objetivos e recurso; revogável a qualquer tempo", "Não detalhadas na Lei"]]}, {"titulo": "Anulação × Revogação × Convalidação", "colunas": ["Aspecto", "Anulação", "Revogação", "Convalidação"], "linhas": [["Base legal", "Arts. 53–54", "Art. 53", "Art. 55"], ["Motivo", "Vício de legalidade", "Conveniência ou oportunidade", "Defeito sanável"], ["Natureza", "Dever ('deve anular')", "Faculdade ('pode revogar')", "Faculdade ('poderão ser convalidados')"], ["Limite", "Decadência de 5 anos para atos favoráveis, salvo má-fé", "Respeito aos direitos adquiridos", "Sem lesão ao interesse público nem prejuízo a terceiros"], ["Motivação", "Obrigatória (art. 50, VIII)", "Obrigatória (art. 50, VIII)", "Obrigatória (art. 50, VIII)"]]}, {"titulo": "Parecer obrigatório vinculante × não vinculante (atraso)", "colunas": ["Aspecto", "Vinculante", "Não vinculante"], "linhas": [["Prazo", "15 dias, salvo norma especial ou necessidade comprovada", "15 dias, salvo norma especial ou necessidade comprovada"], ["Efeito do atraso", "Processo não tem seguimento até a apresentação", "Processo pode prosseguir e ser decidido com dispensa"], ["Responsabilidade", "De quem der causa ao atraso", "De quem se omitiu"], ["Base legal", "Art. 42, § 1º", "Art. 42, § 2º"]]}, {"titulo": "Recurso × Revisão", "colunas": ["Aspecto", "Recurso", "Revisão"], "linhas": [["Base legal", "Arts. 56–64-B", "Art. 65"], ["Cabimento", "Decisões administrativas em geral (legalidade e mérito)", "Processos de que resultem sanções"], ["Prazo", "10 dias da ciência/divulgação", "A qualquer tempo"], ["Iniciativa", "Legitimados do art. 58", "A pedido ou de ofício"], ["Pressuposto", "Inconformismo com a decisão", "Fatos novos ou circunstâncias relevantes"], ["Agravamento", "Possível, com prévia ciência do recorrente (art. 64, p.ú.)", "Vedado (art. 65, p.ú.)"]]}, {"titulo": "Interessados (art. 9º) × Legitimados a recorrer (art. 58)", "colunas": ["Inciso", "Interessados no processo (art. 9º)", "Legitimados a recorrer (art. 58)"], "linhas": [["I", "PF/PJ que iniciem o processo como titulares ou representantes", "Titulares de direitos e interesses que forem parte"], ["II", "Quem, sem iniciar, possa ser afetado pela decisão", "Quem for indiretamente afetado pela decisão recorrida"], ["III", "Organizações e associações representativas – coletivos", "Organizações e associações representativas – coletivos"], ["IV", "Pessoas ou associações legalmente constituídas – difusos", "Cidadãos ou associações – difusos"]]}, {"titulo": "Consulta pública × Audiência pública", "colunas": ["Aspecto", "Consulta pública", "Audiência pública"], "linhas": [["Base legal", "Art. 31", "Art. 32"], ["Pressuposto", "Assunto de interesse geral; sem prejuízo à parte", "Relevância da questão, a juízo da autoridade"], ["Forma", "Despacho motivado; divulgação oficial; alegações escritas em prazo fixado", "Debates sobre a matéria"], ["Efeito", "Não confere condição de interessado, mas direito a resposta fundamentada", "Resultados apresentados com indicação do procedimento (art. 34)"]]}], "pegadinhas": [{"texto": "A Administração 'pode' anular atos ilegais. ERRADO: deve anular (ilegalidade) e pode revogar (conveniência/oportunidade).", "ref": "Art. 53"}, {"texto": "A decadência de 5 anos atinge atos com efeitos favoráveis e não corre havendo comprovada má-fé; nos efeitos patrimoniais contínuos conta-se do 1º pagamento, não da prática do ato.", "ref": "Art. 54, caput e § 1º"}, {"texto": "Delegação exige subordinação hierárquica. ERRADO: pode ocorrer ainda que o delegado não seja subordinado. A avocação é que se dá em relação a órgão inferior.", "ref": "Arts. 12 e 15"}, {"texto": "Decisões tomadas por delegação consideram-se editadas pelo delegado, não pelo delegante.", "ref": "Art. 14, § 3º"}, {"texto": "Decisão de recursos administrativos é indelegável; o ato de delegação, porém, deve indicar o recurso cabível.", "ref": "Arts. 13, II e 14, § 1º"}, {"texto": "Litigar com o interessado é causa de impedimento, não de suspeição; amizade íntima/inimizade notória é suspeição.", "ref": "Arts. 18, III e 20"}, {"texto": "A omissão em comunicar impedimento é falta grave; não há regra equivalente para suspeição.", "ref": "Art. 19, parágrafo único"}, {"texto": "O recurso contra indeferimento de suspeição NÃO tem efeito suspensivo.", "ref": "Art. 21"}, {"texto": "Prazo geral de 5 dias pode ser dilatado ATÉ O DOBRO (não 'por igual período a critério livre') e mediante comprovada justificação.", "ref": "Art. 24"}, {"texto": "Antecedência mínima da intimação: 3 dias ÚTEIS (não corridos).", "ref": "Arts. 26, § 2º e 41"}, {"texto": "Desatendimento da intimação NÃO importa reconhecimento da verdade dos fatos nem renúncia a direito.", "ref": "Art. 27"}, {"texto": "Comparecer à consulta pública não torna a pessoa interessada no processo.", "ref": "Art. 31, § 2º"}, {"texto": "Parecer obrigatório e vinculante atrasado PARALISA o processo; o não vinculante permite prosseguir.", "ref": "Art. 42, §§ 1º e 2º"}, {"texto": "Prazo para decidir após a instrução é de ATÉ 30 dias, prorrogável por igual período expressamente motivada (e não 15 ou 60 dias).", "ref": "Art. 49"}, {"texto": "Decisão coordenada exige 3 ou mais setores/órgãos/entidades e não se aplica a licitação, poder sancionador ou autoridades de Poderes distintos.", "ref": "Art. 49-A, caput e § 6º"}, {"texto": "A decisão que defere participação na decisão coordenada é irrecorrível.", "ref": "Art. 49-B, parágrafo único"}, {"texto": "Recurso: 5 dias para reconsiderar, 10 dias para interpor, 30 dias para decidir (prorrogáveis por igual período), 5 dias ÚTEIS para alegações dos demais interessados.", "ref": "Arts. 56, § 1º, 59 e 62"}, {"texto": "O recurso é dirigido à autoridade que proferiu a decisão, não diretamente à autoridade superior.", "ref": "Art. 56, § 1º"}, {"texto": "Regra: recurso sem efeito suspensivo; pode ser concedido pela autoridade recorrida ou imediatamente superior, de ofício ou a pedido.", "ref": "Art. 61"}, {"texto": "Recurso interposto perante órgão incompetente não é conhecido, mas o prazo é devolvido e indica-se a autoridade competente.", "ref": "Art. 63, § 1º"}, {"texto": "No recurso pode haver agravamento (com ciência prévia); na revisão é vedado agravar a sanção.", "ref": "Arts. 64, parágrafo único e 65, parágrafo único"}, {"texto": "Recurso tramita por no máximo 3 instâncias, salvo disposição legal diversa.", "ref": "Art. 57"}, {"texto": "Prazos processuais não se suspendem, salvo força maior devidamente comprovada.", "ref": "Art. 67"}, {"texto": "Prioridade de tramitação: 60 anos ou mais (não 65), e a doença grave pode ter sido contraída após o início do processo.", "ref": "Art. 69-A"}, {"texto": "Reconhecimento de firma só é exigido em caso de dúvida de autenticidade, salvo imposição legal.", "ref": "Art. 22, § 2º"}], "erros_frequentes": [{"texto": "Confundir legitimados do art. 9º (pessoas ou associações legalmente constituídas para difusos) com os do art. 58 (cidadãos ou associações para difusos).", "ref": "Arts. 9º, IV e 58, IV"}, {"texto": "Achar que a assistência por advogado é obrigatória: é facultativa, salvo quando a lei a exigir.", "ref": "Art. 3º, IV"}, {"texto": "Supor que a Lei 9.784 prevalece sobre leis de processos específicos: ela se aplica apenas subsidiariamente.", "ref": "Art. 69"}, {"texto": "Acreditar que o recurso só discute legalidade: cabe também por razões de mérito.", "ref": "Art. 56"}, {"texto": "Exigir caução para recorrer como regra: a interposição independe de caução, salvo exigência legal.", "ref": "Art. 56, § 2º"}, {"texto": "Pensar que, sem competência legal específica, o processo começa na autoridade de maior grau: é na de MENOR grau hierárquico.", "ref": "Art. 17"}, {"texto": "Considerar que as provas propostas podem ser recusadas livremente: só se ilícitas, impertinentes, desnecessárias ou protelatórias, por decisão fundamentada.", "ref": "Art. 38, § 2º"}, {"texto": "Esquecer que a não apresentação de dados necessários ao pedido no prazo leva ao arquivamento do processo.", "ref": "Art. 40"}, {"texto": "Achar que a desistência de um interessado extingue o processo para todos: atinge só quem a formulou e o processo pode prosseguir pelo interesse público.", "ref": "Art. 51, §§ 1º e 2º"}], "relacoes": [{"texto": "Relação com a CF/88, art. 5º, LV (contraditório e ampla defesa em processo administrativo) e art. 37, caput (LIMPE).", "ext": true}, {"texto": "Relação com a Lei 8.112/1990: o PAD é processo específico regido por lei própria; a Lei 9.784 aplica-se subsidiariamente (art. 69).", "ext": true}, {"texto": "Súmulas 346 e 473 do STF consagram a autotutela, positivada no art. 53.", "ext": true}, {"texto": "Súmula Vinculante 21 do STF: é inconstitucional exigir depósito ou arrolamento prévio de bens para admissibilidade de recurso administrativo (dialoga com o art. 56, § 2º).", "ext": true}, {"texto": "Súmula Vinculante 3 do STF: contraditório e ampla defesa nos processos do TCU quando a decisão puder resultar em anulação ou revogação de ato benéfico, excetuada a apreciação inicial de aposentadoria, reforma e pensão.", "ext": true}, {"texto": "Lei 11.417/2006 (súmula vinculante) inseriu os arts. 56, § 3º, 64-A e 64-B; reclamação ao STF prevista no art. 103-A, § 3º, da CF.", "ext": true}, {"texto": "STJ (Súmula 633): a Lei 9.784/99, especialmente o prazo decadencial do art. 54, pode ser aplicada subsidiariamente a Estados e Municípios sem norma local específica.", "ext": true}], "perguntas": [{"p": "A quem se aplica a Lei 9.784/1999?", "r": "À Administração Federal direta e indireta e aos órgãos dos Poderes Legislativo e Judiciário da União quando no desempenho de função administrativa.", "ref": "Art. 1º, caput e § 1º"}, {"p": "Qual a diferença legal entre órgão e entidade?", "r": "Órgão é unidade de atuação integrante da estrutura da Administração direta e indireta; entidade é unidade de atuação dotada de personalidade jurídica.", "ref": "Art. 1º, § 2º, I e II"}, {"p": "Quais são os princípios expressos no art. 2º?", "r": "Legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência (rol exemplificativo).", "ref": "Art. 2º"}, {"p": "É permitida a aplicação retroativa de nova interpretação administrativa?", "r": "Não; é vedada a aplicação retroativa de nova interpretação.", "ref": "Art. 2º, parágrafo único, XIII"}, {"p": "Quais os deveres do administrado?", "r": "Expor os fatos conforme a verdade; proceder com lealdade, urbanidade e boa-fé; não agir de modo temerário; prestar informações e colaborar no esclarecimento dos fatos.", "ref": "Art. 4º"}, {"p": "A partir de que idade se tem capacidade no processo administrativo?", "r": "Maiores de 18 anos, ressalvada previsão especial em ato normativo próprio.", "ref": "Art. 10"}, {"p": "O que não pode ser objeto de delegação?", "r": "Edição de atos normativos, decisão de recursos administrativos e matérias de competência exclusiva.", "ref": "Art. 13"}, {"p": "Quais os requisitos da avocação?", "r": "Caráter excepcional, motivos relevantes devidamente justificados, temporariedade e competência atribuída a órgão hierarquicamente inferior.", "ref": "Art. 15"}, {"p": "Qual a consequência de o servidor impedido não comunicar o impedimento?", "r": "Constitui falta grave para efeitos disciplinares.", "ref": "Art. 19, parágrafo único"}, {"p": "Qual o prazo para prática de atos quando não há disposição específica?", "r": "Cinco dias, salvo força maior, podendo ser dilatado até o dobro mediante comprovada justificação.", "ref": "Art. 24"}, {"p": "Como intimar interessados indeterminados ou com domicílio indefinido?", "r": "Por meio de publicação oficial.", "ref": "Art. 26, § 4º"}, {"p": "A intimação feita sem as prescrições legais é válida?", "r": "É nula, mas o comparecimento do administrado supre a falta ou irregularidade.", "ref": "Art. 26, § 5º"}, {"p": "Quando as provas propostas pelo interessado podem ser recusadas?", "r": "Somente quando ilícitas, impertinentes, desnecessárias ou protelatórias, mediante decisão fundamentada.", "ref": "Art. 38, § 2º"}, {"p": "Qual o prazo para emissão de parecer obrigatório e o efeito do atraso?", "r": "Até 15 dias; se vinculante, o processo não segue até a apresentação; se não vinculante, pode prosseguir com dispensa; em ambos há responsabilização.", "ref": "Art. 42"}, {"p": "Qual o prazo para o interessado se manifestar após o encerramento da instrução?", "r": "Máximo de 10 dias, salvo outro prazo legalmente fixado.", "ref": "Art. 44"}, {"p": "A Administração pode adotar medidas sem ouvir previamente o interessado?", "r": "Sim, em caso de risco iminente, motivadamente, providências acauteladoras.", "ref": "Art. 45"}, {"p": "Qual o prazo para decidir após concluída a instrução?", "r": "Até 30 dias, prorrogável por igual período expressamente motivada.", "ref": "Art. 49"}, {"p": "Quando cabe decisão coordenada?", "r": "Em decisões com participação de 3 ou mais setores, órgãos ou entidades, quando justificável pela relevância da matéria e houver discordância que prejudique a celeridade.", "ref": "Art. 49-A"}, {"p": "Em quais processos não se aplica a decisão coordenada?", "r": "Licitação; poder sancionador; processos com autoridades de Poderes distintos.", "ref": "Art. 49-A, § 6º"}, {"p": "Cite hipóteses em que a motivação é obrigatória.", "r": "Atos que neguem/limitem direitos; imponham deveres/sanções; decidam concurso; dispensem ou declarem inexigível licitação; decidam recursos; decorram de reexame de ofício; deixem de aplicar jurisprudência ou discrepem de pareceres; importem anulação, revogação, suspensão ou convalidação.", "ref": "Art. 50"}, {"p": "Em que hipóteses o órgão pode declarar extinto o processo?", "r": "Quando exaurida sua finalidade ou o objeto da decisão se tornar impossível, inútil ou prejudicado por fato superveniente.", "ref": "Art. 52"}, {"p": "Qual o prazo decadencial para a Administração anular atos favoráveis?", "r": "Cinco anos da data em que foram praticados, salvo comprovada má-fé; em efeitos patrimoniais contínuos, conta-se da percepção do primeiro pagamento.", "ref": "Art. 54"}, {"p": "Quais os requisitos para convalidação?", "r": "Defeitos sanáveis e decisão evidenciando ausência de lesão ao interesse público e de prejuízo a terceiros.", "ref": "Art. 55"}, {"p": "A quem é dirigido o recurso e o que ocorre se não houver reconsideração?", "r": "À autoridade que proferiu a decisão; se não reconsiderar em 5 dias, encaminha à autoridade superior.", "ref": "Art. 56, § 1º"}, {"p": "Quais os prazos de interposição e de decisão do recurso?", "r": "Interposição em 10 dias da ciência ou divulgação oficial; decisão em até 30 dias do recebimento dos autos, prorrogável por igual período com justificativa explícita.", "ref": "Art. 59"}, {"p": "O recurso administrativo tem efeito suspensivo?", "r": "Em regra não, salvo disposição legal; havendo justo receio de prejuízo de difícil ou incerta reparação, a autoridade recorrida ou a imediatamente superior pode concedê-lo.", "ref": "Art. 61"}, {"p": "Quando o recurso não será conhecido?", "r": "Interposto fora do prazo, perante órgão incompetente, por não legitimado ou após exaurida a esfera administrativa.", "ref": "Art. 63"}, {"p": "Pode a decisão do recurso agravar a situação do recorrente?", "r": "Sim, desde que ele seja cientificado para formular alegações antes da decisão.", "ref": "Art. 64, parágrafo único"}, {"p": "Quais as características da revisão?", "r": "Cabe em processos de que resultem sanções, a qualquer tempo, a pedido ou de ofício, diante de fatos novos ou circunstâncias relevantes; não pode agravar a sanção.", "ref": "Art. 65"}, {"p": "Como se contam os prazos na Lei 9.784?", "r": "A partir da cientificação oficial, excluindo o dia do começo e incluindo o do vencimento; prorrogam-se ao 1º dia útil se o vencimento cair em dia sem expediente; em dias, contagem contínua; em meses/anos, de data a data.", "ref": "Art. 66"}, {"p": "Quais as naturezas possíveis das sanções?", "r": "Pecuniária ou obrigação de fazer ou de não fazer, assegurado sempre o direito de defesa.", "ref": "Art. 68"}, {"p": "Quem tem prioridade de tramitação?", "r": "Pessoa com 60 anos ou mais, pessoa com deficiência física ou mental e portadores das doenças graves listadas ou outra doença grave, mesmo contraída após o início do processo.", "ref": "Art. 69-A"}, {"p": "Como se obtém a prioridade de tramitação?", "r": "Requerimento à autoridade competente com prova da condição; deferida, os autos recebem identificação própria.", "ref": "Art. 69-A, §§ 1º e 2º"}], "cobertura": [{"item": "Cap. I – Disposições gerais (arts. 1º–2º)", "status": "ok", "obs": ""}, {"item": "Cap. II – Direitos dos administrados (art. 3º)", "status": "ok", "obs": ""}, {"item": "Cap. III – Deveres do administrado (art. 4º)", "status": "ok", "obs": ""}, {"item": "Cap. IV – Início do processo (arts. 5º–8º)", "status": "ok", "obs": ""}, {"item": "Cap. V – Interessados (arts. 9º–10)", "status": "ok", "obs": ""}, {"item": "Cap. VI – Competência (arts. 11–17)", "status": "ok", "obs": ""}, {"item": "Cap. VII – Impedimentos e suspeição (arts. 18–21)", "status": "ok", "obs": ""}, {"item": "Cap. VIII – Forma, tempo e lugar dos atos (arts. 22–25)", "status": "ok", "obs": ""}, {"item": "Cap. IX – Comunicação dos atos (arts. 26–28)", "status": "ok", "obs": ""}, {"item": "Cap. X – Instrução (arts. 29–47)", "status": "ok", "obs": ""}, {"item": "Cap. XI – Dever de decidir (arts. 48–49)", "status": "ok", "obs": ""}, {"item": "Cap. XI-A – Decisão coordenada (arts. 49-A–49-G)", "status": "ok", "obs": "Dispositivos vetados (49-A §§ 2º e 3º; 49-C; 49-G § 2º) apenas mencionados."}, {"item": "Cap. XII – Motivação (art. 50)", "status": "ok", "obs": ""}, {"item": "Cap. XIII – Desistência e extinção (arts. 51–52)", "status": "ok", "obs": ""}, {"item": "Cap. XIV – Anulação, revogação e convalidação (arts. 53–55)", "status": "ok", "obs": ""}, {"item": "Cap. XV – Recurso administrativo e revisão (arts. 56–65)", "status": "ok", "obs": "Inclui arts. 56, § 3º, 64-A e 64-B (Lei 11.417/2006)."}, {"item": "Cap. XVI – Prazos (arts. 66–67)", "status": "ok", "obs": ""}, {"item": "Cap. XVII – Sanções (art. 68)", "status": "ok", "obs": ""}, {"item": "Cap. XVIII – Disposições finais (arts. 69–70)", "status": "ok", "obs": "Art. 69-A: inciso III e §§ 3º e 4º vetados, apenas mencionados."}], "nao_verificado": ["Conferido em 23/10/2026: o texto do PDF é igual, palavra por palavra, ao texto atual do Planalto (l9784.htm). As únicas alterações são das Leis 11.417/2006, 12.008/2009 e 14.210/2021, todas no PDF. O art. 69-A continua com a expressão 'pessoa portadora de deficiência' e não ganhou incisos novos.", "A palavra 'Vigência' depois das inclusões da Lei 11.417/2006 (arts. 56, § 3º, 64-A e 64-B) é só um link do site do Planalto; a data de vigência não aparece no PDF e não afeta o conteúdo.", "Os conteúdos com ext: true (súmulas do STF/STJ, mnemônico, CF/88) são complementação externa e não estão no PDF."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });
