<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lei nº 13.709/2018</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;

}

  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
    --mark:#7a5d00;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}

lhos": [{"t": "Rol taxativo do inciso II: dado financeiro não está na lista", "tipo": "atencao", "ref": "Art. 5º, II"}]}, {"t": "Dado anonimizado", "tipo": "conceito", "d": "Dado de titular que não possa ser identificado, considerando meios técnicos razoáveis e disponíveis na ocasião do tratamento.", "ref": "Art. 5º, III"}, {"t": "Banco de dados", "tipo": "conceito", "d": "Conjunto estruturado de dados pessoais, em um ou vários locais, em suporte eletrônico ou físico.", "ref": "Art. 5º, IV"}]}, {"t": "Sujeitos", "tipo": "topico", "filhos": [{"t": "Titular", "tipo": "competencia", "d": "Pessoa natural a quem se referem os dados pessoais objeto de tratamento.", "ref": "Art. 5º, V"}, {"t": "Controlador", "tipo": "competencia", "d": "Pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento.", "ref": "Art. 5º, VI"}, {"t": "Operador", "tipo": "competencia", "d": "Pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento em nome do controlador.", "ref": "Art. 5º, VII"}, {"t": "Encarregado", "tipo": "competencia", "d": "Pessoa indicada pelo controlador e operador para atuar como canal de comunicação entre controlador, titulares e a Agência Nacional de Proteção de Dados (ANPD).", "ref": "Art. 5º, VIII", "filhos": [{"t": "Redação vigente: 'pessoa' (não exige pessoa natural) indicada pelo controlador E operador", "tipo": "atencao", "ref": "Art. 5º, VIII"}]}, {"t": "Agentes de tratamento = controlador e operador", "tipo": "conceito", "ref": "Art. 5º, IX", "filhos": [{"t": "Encarregado NÃO é agente de tratamento", "tipo": "atencao", "ref": "Art. 5º, IX"}]}, {"t": "Órgão de pesquisa", "tipo": "competencia", "d": "Órgão/entidade da administração direta ou indireta ou PJ de direito privado sem fins lucrativos, constituída sob leis brasileiras, com sede e foro no País, cuja missão inclua pesquisa básica ou aplicada de caráter histórico, científico, tecnológico ou estatístico.", "ref": "Art. 5º, XVIII"}, ida separadamente pelo controlador"], ["É dado pessoal?", "Não, salvo reversão (meios próprios ou esforços razoáveis)", "Sim (a reidentificação é possível pelo controlador)"], ["Base legal", "Art. 5º, XI; art. 12", "Art. 13, § 4º"]]}, {"titulo": "Bloqueio × Eliminação × Anonimização", "colunas": ["Aspecto", "Bloqueio", "Eliminação", "Anonimização"], "linhas": [["Natureza", "Suspensão temporária, com guarda do dado", "Exclusão definitiva do dado", "Remoção da possibilidade de associação ao titular"], ["Como direito do titular", "Art. 18, IV", "Art. 18, IV e VI", "Art. 18, IV"], ["Como sanção", "Art. 52, V (até regularização)", "Art. 52, VI", "Não é sanção"], ["Base conceitual", "Art. 5º, XIII", "Art. 5º, XIV", "Art. 5º, XI"]]}, {"titulo": "Fundamentos (art. 2º) × Princípios (art. 6º)", "colunas": ["Aspecto", "Fundamentos", "Princípios"], "linhas": [["Quantidade", "7 incisos", "Boa-fé + 10 incisos"], ["Exemplos", "Privacidade, autodeterminação informativa, livre iniciativa, defesa do consumidor", "Finalidade, adequação, necessidade, transparência, segurança, responsabilização"], ["Função", "Base da disciplina da proteção de dados", "Devem ser observados nas atividades de tratamento"]]}, {"titulo": "Sanções a entes privados × órgãos públicos", "colunas": ["Sanção (art. 52)", "Agente privado", "Órgão/entidade pública (§ 3º)"], "linhas": [["I – advertência", "Sim", "Sim"], ["II – multa simples / III – multa diária", "Sim", "Não"], ["IV – publicização", "Sim", "Sim"], ["V – bloqueio / VI – eliminação", "Sim", "Sim"], ["X – suspensão parcial do banco / XI – suspensão da atividade / XII – proibição", "Sim (após ao menos uma das sanções II a VI)", "Sim"]]}, {"titulo": "Empresas públicas e SEM no tratamento de dados", "colunas": ["Situação", "Tratamento equiparado a", "Base"], "linhas": [["Atuando em regime de concorrência (art. 173 CF)", "PJ de direito privado particular", "Art. 24, caput"], ["Operacionalizando políticas públicas", "Órgãos e entidades do Poder Público", "Art. 24, parágrafo único"]]}], "pegadinhas": [{"texto": "A LGPD protege dados da pessoa natural; dados de pessoa jurídica não são 'dado pessoal'.", "ref": "Art. 1º; art. 5º, I e V"}, {"texto": "Tratamento para fins acadêmicos está fora da LGPD, mas aplicam-se os arts. 7º e 11 (não é exclusão total).", "ref": "Art. 4º, II, b"}, {"texto": "Dados de segurança pública: privados só sob tutela de PJ de direito público; a totalidade do banco nunca pode ser tratada por privado, salvo capital integralmente público.", "ref": "Art. 4º, §§ 2º e 4º"}, {"texto": "Dado financeiro NÃO é dado sensível; o rol do art. 5º, II inclui origem racial, religião, opinião política, sindicato, saúde, vida sexual, genético e biométrico.", "ref": "Art. 5º, II"}, {"texto": "Encarregado não é agente de tratamento; agentes são apenas controlador e operador.", "ref": "Art. 5º, IX"}, {"texto": "Redação vigente: encarregado é 'pessoa' indicada pelo controlador E operador (não mais 'pessoa natural' indicada só pelo controlador).", "ref": "Art. 5º, VIII"}, {"texto": "Legítimo interesse e proteção do crédito não autorizam tratamento de dados sensíveis.", "ref": "Arts. 7º, IX e X; 11"}, {"texto": "O ônus de provar o consentimento é do controlador, não do titular.", "ref": "Art. 8º, § 2º"}, {"texto": "Autorizações genéricas são nulas; o consentimento deve se referir a finalidades determinadas.", "ref": "Art. 8º, § 4º"}, {"texto": "Revogação do consentimento não invalida tratamentos anteriores: ficam ratificados enquanto não houver pedido de eliminação.", "ref": "Art. 8º, § 5º"}, {"texto": "Para crianças basta o consentimento de PELO MENOS UM dos pais ou do responsável legal.", "ref": "Art. 14, § 1º"}, {"texto": "Dados de criança coletados sem consentimento para contatar os pais: uso uma única vez e sem armazenamento.", "ref": "Art. 14, § 3º"}, {"texto": "Declaração completa de acesso: até 15 dias do requerimento; formato simplificado é imediato.", "ref": "Art. 19, I e II"}, {"texto": "A portabilidade não inclui dados já anonimizados pelo controlador.", "ref": "Art. 18, § 7º"}, {"texto": "Revisão de decisão automatizada: a redação vigente não exige que seja feita por pessoa natural.", "ref": "Art. 20"}, {"texto": "O juiz PODE (não deve) inverter o ônus da prova a favor do titular.", "ref": "Art. 42, § 2º"}, {"texto": "Operador só responde solidariamente se descumprir a legislação ou não seguir instruções LÍCITAS do controlador.", "ref": "Art. 42, § 1º, I"}, {"texto": "Multa simples: até 2% do faturamento no Brasil, sem tributos, limitada a R$ 50 milhões POR INFRAÇÃO (não por ano).", "ref": "Art. 52, II"}, {"texto": "Órgãos públicos não recebem multa; podem receber advertência, publicização, bloqueio, eliminação, suspensões e proibição.", "ref": "Art. 52, § 3º"}, {"texto": "Suspensões (X e XI): máximo 6 meses, prorrogável por igual período; só após ao menos uma das sanções II a VI.", "ref": "Art. 52, X, XI e § 6º"}, {"texto": "Multas arrecadadas vão ao Fundo de Defesa de Direitos Difusos, não à ANPD.", "ref": "Art. 52, § 5º"}, {"texto": "Sanções são aplicadas EXCLUSIVAMENTE pela ANPD.", "ref": "Art. 55-K"}, {"texto": "ANPD vigente: 'Agência Nacional de Proteção de Dados', autarquia especial vinculada ao Ministério da Justiça e Segurança Pública (não mais à Presidência).", "ref": "Art. 55-A"}, {"texto": "Conselho Diretor: 5 diretores, mandato de 4 anos, nomeação após aprovação do Senado.", "ref": "Art. 55-D"}, {"texto": "CNPD tem 23 membros, sendo 5 do Executivo federal (não 6) e mandato de 2 anos com 1 recondução para os da sociedade.", "ref": "Art. 58-A"}], "erros_frequentes": [{"texto": "Achar que o consentimento é a principal ou única base legal: há 10 hipóteses no art. 7º, sem hierarquia.", "ref": "Art. 7º"}, {"texto": "Confundir bloqueio (suspensão temporária) com eliminação (exclusão).", "ref": "Art. 5º, XIII e XIV"}, {"texto": "Pensar que dispensa de consentimento libera o agente das demais obrigações da Lei.", "ref": "Art. 7º, § 6º"}, {"texto": "Supor que dados anonimizados sempre ficam fora da LGPD: se a anonimização for reversível com esforços razoáveis, são dados pessoais.", "ref": "Art. 12"}, {"texto": "Afirmar que o Poder Público pode transferir livremente dados a entes privados: a regra é a vedação, com exceções do art. 26, § 1º.", "ref": "Art. 26, § 1º"}, {"texto": "Tratar empresa pública em concorrência como Poder Público para fins da LGPD.", "ref": "Art. 24"}, {"texto": "Confundir fundamentos (art. 2º) com princípios (art. 6º).", "ref": "Arts. 2º e 6º"}, {"texto": "Incluir 'publicização' entre sanções vedadas a órgãos públicos; é permitida (inciso IV).", "ref": "Art. 52, § 3º"}], "relacoes": [{"texto": "Relação com a Lei de Acesso à Informação (Lei 12.527/11): define as PJ de direito público do Cap. IV, rege a execução descentralizada e prazos/procedimentos dos direitos perante o Poder Público.", "ext": false}, {"texto": "Relação com a Lei 9.784/99 e a Lei do Habeas Data (9.507/97): regem prazos e procedimentos de exercício dos direitos do titular perante o Poder Público.", "ext": false}, {"texto": "Relação com o CDC (Lei 8.078/90): sanções da LGPD não substituem as do CDC; responsabilidade nas relações de consumo segue a legislação pertinente; titular pode peticionar a órgãos de defesa do consumidor.", "ext": false}, {"texto": "Relação com a Lei 8.112/90, Lei 8.429/92 (Improbidade) e LAI: sanções a órgãos públicos aplicam-se sem prejuízo dessas leis.", "ext": false}, {"texto": "Relação com o Marco Civil da Internet (Lei 12.965/14): a LGPD altera seus arts. 7º, X e 16, II.", "ext": false}, {"texto": "Relação com a Lei 13.848/19 (agências reguladoras): a ANPD, como Agência, segue esse regime.", "ext": false}, {"texto": "A EC nº 115/2022 incluiu a proteção de dados pessoais, inclusive nos meios digitais, como direito fundamental (art. 5º, LXXIX, CF) e atribuiu à União legislar privativamente sobre o tema.", "ext": true}], "perguntas": [{"p": "Quais os objetivos da LGPD?", "r": "Proteger os direitos fundamentais de liberdade e privacidade e o livre desenvolvimento da personalidade da pessoa natural.", "ref": "Art. 1º"}, {"p": "A LGPD se aplica a tratamento feito no exterior?", "r": "Sim, se o tratamento visar oferta de bens/serviços ou tratar dados de indivíduos no Brasil, ou se os dados tiverem sido coletados no Brasil (titular aqui no momento da coleta).", "ref": "Art. 3º, II, III e § 1º"}, {"p": "Em que casos a LGPD não se aplica?", "r": "Fins particulares e não econômicos de pessoa natural; fins exclusivamente jornalísticos, artísticos ou acadêmicos (estes com arts. 7º e 11); segurança pública, defesa nacional, segurança do Estado, investigação penal; dados vindos do exterior sem compartilhamento, em país com proteção adequada.", "ref": "Art. 4º"}, {"p": "O que é dado pessoal sensível?", "r": "Dado sobre origem racial/étnica, convicção religiosa, opinião política, filiação a sindicato ou organização religiosa, filosófica ou política, saúde, vida sexual, dado genético ou biométrico, vinculado a pessoa natural.", "ref": "Art. 5º, II"}, {"p": "Quem são os agentes de tratamento?", "r": "O controlador e o operador.", "ref": "Art. 5º, IX"}, {"p": "O que diz o princípio da necessidade?", "r": "Limitação do tratamento ao mínimo necessário, com dados pertinentes, proporcionais e não excessivos.", "ref": "Art. 6º, III"}, {"p": "Quais as bases legais do art. 7º?", "r": "Consentimento; obrigação legal/regulatória; políticas públicas pela administração; órgão de pesquisa; execução de contrato; exercício regular de direitos; proteção da vida; tutela da saúde; legítimo interesse; proteção do crédito.", "ref": "Art. 7º"}, {"p": "Como deve ser o consentimento escrito?", "r": "Em cláusula destacada das demais cláusulas contratuais.", "ref": "Art. 8º, § 1º"}, {"p": "Quando o consentimento é nulo por vício de informação?", "r": "Quando as informações tiverem conteúdo enganoso ou abusivo ou não forem apresentadas previamente com transparência, de forma clara e inequívoca.", "ref": "Art. 9º, § 1º"}, {"p": "Quais limites ao tratamento por legítimo interesse?", "r": "Finalidades legítimas a partir de situações concretas; apenas dados estritamente necessários; transparência; ANPD pode pedir relatório de impacto.", "ref": "Art. 10"}, {"p": "Quando dados de saúde podem ser compartilhados para vantagem econômica?", "r": "Em serviços de saúde, assistência farmacêutica e à saúde, em benefício dos titulares, para permitir portabilidade solicitada pelo titular ou transações financeiras e administrativas desses serviços.", "ref": "Art. 11, § 4º"}, {"p": "O que é vedado às operadoras de planos de saúde?", "r": "Tratar dados de saúde para seleção de riscos na contratação de qualquer modalidade e na contratação e exclusão de beneficiários.", "ref": "Art. 11, § 5º"}, {"p": "Quando dados anonimizados são considerados pessoais?", "r": "Quando a anonimização for revertida com meios próprios ou puder ser revertida com esforços razoáveis; também os usados para perfil comportamental de pessoa identificada.", "ref": "Art. 12, caput e § 2º"}, {"p": "Quais as hipóteses de término do tratamento?", "r": "Finalidade alcançada ou dados desnecessários; fim do período; comunicação do titular (inclusive revogação), resguardado o interesse público; determinação da autoridade nacional.", "ref": "Art. 15"}, {"p": "Em que casos os dados podem ser conservados após o término?", "r": "Obrigação legal/regulatória; estudo por órgão de pesquisa; transferência a terceiro respeitada a Lei; uso exclusivo do controlador com dados anonimizados.", "ref": "Art. 16"}, {"p": "Qual o prazo para resposta completa de acesso aos dados?", "r": "Até 15 dias contados do requerimento; em formato simplificado, imediatamente.", "ref": "Art. 19"}, {"p": "Perante quem o titular pode peticionar contra o controlador?", "r": "Perante a autoridade nacional e também os organismos de defesa do consumidor.", "ref": "Art. 18, §§ 1º e 8º"}, {"p": "Quais requisitos para o tratamento pelo Poder Público?", "r": "Finalidade pública e interesse público, informando as hipóteses de tratamento (preferencialmente em sítios eletrônicos) e indicando encarregado.", "ref": "Art. 23"}, {"p": "Quando o Poder Público pode transferir dados a entidades privadas?", "r": "Execução descentralizada de atividade pública; dados acessíveis publicamente; previsão legal ou contratos/convênios; exclusivamente prevenção de fraudes ou proteção do titular.", "ref": "Art. 26, § 1º"}, {"p": "Cite hipóteses de transferência internacional permitida.", "r": "País com proteção adequada; garantias (cláusulas, normas corporativas, selos); cooperação jurídica internacional; proteção da vida; autorização da ANPD; acordo de cooperação; política pública; consentimento específico; art. 7º, II, V e VI.", "ref": "Art. 33"}, {"p": "Quais as atividades do encarregado?", "r": "Aceitar reclamações dos titulares; receber comunicações da ANPD; orientar funcionários e contratados; executar demais atribuições.", "ref": "Art. 41, § 2º"}, {"p": "Quando os agentes não são responsabilizados?", "r": "Se provarem que não realizaram o tratamento, que não houve violação à legislação ou que o dano decorre de culpa exclusiva do titular ou de terceiro.", "ref": "Art. 43"}, {"p": "O que deve conter a comunicação de incidente de segurança?", "r": "Natureza dos dados, titulares envolvidos, medidas de proteção, riscos, motivos da demora e medidas de reversão/mitigação.", "ref": "Art. 48, § 1º"}, {"p": "Qual o limite da multa simples?", "r": "Até 2% do faturamento no Brasil no último exercício, excluídos tributos, limitada a R$ 50.000.000,00 por infração.", "ref": "Art. 52, II"}, {"p": "Quais sanções podem ser aplicadas a órgãos públicos?", "r": "Advertência, publicização, bloqueio, eliminação, suspensão parcial do banco, suspensão da atividade e proibição (incisos I, IV, V, VI, X, XI e XII).", "ref": "Art. 52, § 3º"}, {"p": "Qual a natureza jurídica atual da ANPD?", "r": "Agência Nacional de Proteção de Dados, autarquia de natureza especial vinculada ao MJSP, com autonomia funcional, técnica, decisória, administrativa e financeira, sede e foro no DF.", "ref": "Art. 55-A"}, {"p": "Como são escolhidos os diretores da ANPD?", "r": "Pelo Presidente da República, após aprovação do Senado; 5 diretores; mandato de 4 anos.", "ref": "Art. 55-D"}, {"p": "Como um membro do Conselho Diretor perde o cargo?", "r": "Somente por renúncia, condenação judicial transitada em julgado ou demissão em PAD.", "ref": "Art. 55-E"}, {"p": "Qual a composição do CNPD?", "r": "23 representantes: 5 Executivo federal, 1 Senado, 1 Câmara, 1 CNJ, 1 CNMP, 1 CGI.br, 3 sociedade civil, 3 ICTs, 3 confederações sindicais, 2 setor empresarial e 2 setor laboral.", "ref": "Art. 58-A"}, {"p": "Quando entraram em vigor as sanções da LGPD?", "r": "Em 1º de agosto de 2021.", "ref": "Art. 65, I-A"}], "cobertura": [{"item": "Cap. I – Disposições preliminares (arts. 1º–6º)", "status": "ok", "obs": "Dividido em três mapas: âmbito, definições e princípios."}, {"item": "Cap. II – Seção I: Requisitos do tratamento (arts. 7º–10)", "status": "ok", "obs": "§§ 1º e 2º do art. 7º revogados."}, {"item": "Cap. II – Seção II: Dados sensíveis (arts. 11–13)", "status": "ok", "obs": ""}, {"item": "Cap. II – Seção III: Crianças e adolescentes (art. 14)", "status": "ok", "obs": ""}, {"item": "Cap. II – Seção IV: Término do tratamento (arts. 15–16)", "status": "ok", "obs": ""}, {"item": "Cap. III – Direitos do titular (arts. 17–22)", "status": "ok", "obs": "Art. 20, § 3º vetado."}, {"item": "Cap. IV – Seção I: Regras do Poder Público (arts. 23–30)", "status": "ok", "obs": "Art. 23, II e IV, art. 26, § 1º, II e art. 28 vetados."}, {"item": "Cap. IV – Seção II: Responsabilidade (arts. 31–32)", "status": "ok", "obs": ""}, {"item": "Cap. V – Transferência internacional (arts. 33–36)", "status": "ok", "obs": ""}, {"item": "Cap. VI – Seção I: Controlador e operador (arts. 37–40)", "status": "ok", "obs": ""}, {"item": "Cap. VI – Seção II: Encarregado (art. 41)", "status": "ok", "obs": "§ 4º vetado."}, {"item": "Cap. VI – Seção III: Responsabilidade e ressarcimento (arts. 42–45)", "status": "ok", "obs": ""}, {"item": "Cap. VII – Seção I: Segurança e sigilo (arts. 46–49)", "status": "ok", "obs": ""}, {"item": "Cap. VII – Seção II: Boas práticas e governança (arts. 50–51)", "status": "ok", "obs": ""}, {"item": "Cap. VIII – Seção I: Sanções administrativas (arts. 52–54)", "status": "ok", "obs": "Art. 52, VII a IX vetados; X a XII promulgados após derrubada de veto."}, {"item": "Cap. IX – Seção I: ANPD (arts. 55–57, 55-A a 55-M)", "status": "ok", "obs": "Arts. 55, 56 e 57 vetados; art. 55-B revogado; art. 55-C, V revogado; art. 55-A §§ 1º–3º revogados."}, {"item": "Cap. IX – Seção II: CNPD (arts. 58–59, 58-A e 58-B)", "status": "ok", "obs": "Arts. 58 e 59 vetados."}, {"item": "Cap. X – Disposições finais e transitórias (arts. 60–65)", "status": "ok", "obs": ""}], "nao_verificado": ["Conferido: a nota do art. 55-A cita 'Lei nº 15.452, de 2026' por erro de digitação (o mesmo erro está no Planalto, mas o link aponta para a Lei 15.352/2026, de 25/2/2026, conversão da MP 1.317/2025, que dá a redação atual do art. 55-A).", "Conferido: art. 65, II – a redação da MP 959/2020 ('3 de maio de 2021') aparece riscada no Planalto; vigente a de 24 meses após a publicação (Lei 13.853/2019).", "Art. 26, § 1º, VI (dados acessíveis publicamente, MP 869/2018) não consta da Lei 13.853/2019 e não aparece riscado nem no Planalto; o mapa considera vigente o rol I, III, IV e V (II vetado). Sem efeito prático: o inciso III já prevê a mesma hipótese.", "Conferido no Planalto (out/2026): os arts. 55-D, § 1º (cargo DAS no mínimo de nível 5), 55-G, § 1º (apoio da Casa Civil) e 55-M, I (bens transferidos por órgãos da Presidência) continuam com a redação antiga, sem ajuste à ANPD vinculada ao MJSP; o mapa segue esse texto.", "Conferido: o art. 62 aparece revogado pela MP 869/2018 e reproduzido em seguida sem nota (igual no Planalto); a Lei 13.853/2019 (conversão da MP) não o revogou, por isso é tratado como vigente."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
