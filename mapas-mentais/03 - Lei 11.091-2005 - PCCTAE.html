*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}

cao", "d": "Aqueles de que trata a Lei nº 7.596/1987.", "ref": "Art. 1º, caput"}, {"t": "Cargos referidos no art. 15, § 5º", "tipo": "classificacao", "d": "Servidores redistribuídos para as IFE e enquadrados no Plano.", "ref": "Art. 1º, caput"}, {"t": "Cargos vagos e ocupados integram o quadro de pessoal das IFE", "tipo": "regra", "ref": "Art. 1º, § 1º"}, {"t": "Regime jurídico: Lei nº 8.112/1990, observada esta Lei", "tipo": "regra", "ref": "Art. 1º, § 2º"}]}, {"t": "Instituições Federais de Ensino (IFE)", "tipo": "conceito", "ref": "Art. 2º", "d": "Órgãos e entidades públicos vinculados ao MEC que tenham por atividade-fim o desenvolvimento e aperfeiçoamento do ensino, da pesquisa e extensão e que integram o Sistema Federal de Ensino.", "filhos": [{"t": "Três requisitos: vínculo ao MEC + atividade-fim + Sistema Federal de Ensino", "tipo": "atencao"}]}, {"t": "Princípios e diretrizes da gestão dos cargos", "tipo": "classificacao", "ref": "Art. 3º", "filhos": [{"t": "I – Natureza do processo educativo, função social e objetivos do Sistema Federal de Ensino", "tipo": "conceito", "ref": "Art. 3º, I"}, {"t": "II – Dinâmica dos processos de pesquisa, ensino, extensão e administração", "tipo": "conceito", "d": "E as competências específicas decorrentes.", "ref": "Art. 3º, II"}, {"t": "III – Qualidade do processo de trabalho", "tipo": "conceito", "ref": "Art. 3º, III"}, {"t": "IV – Reconhecimento do saber não instituído", "tipo": "conceito", "d": "Resultante da atuação profissional na dinâmica de ensino, pesquisa e extensão. É a base do RSC-PCCTAE (art. 12-B, § 1º).", "ref": "Art. 3º, IV"}, {"t": "V – Vinculação ao planejamento estratégico e ao desenvolvimento organizacional", "tipo": "conceito", "ref": "Art. 3º, V"}, {"t": "VI – Investidura condicionada à aprovação em concurso público", "tipo": "conceito", "ref": "Art. 3º, VI"}, {"t": "VII – Desenvolvimento do servidor vinculado aos objetivos institucionais", "tipo": "conceito", "ref": "Art. 3º, VII"}, {"t": "VIII – Garantia de programas de capacitação: formação específica e geral", "tipo": "conceito", "d": "Na formação geral está incluída a educação formal.", "ref": "Art. 3º, VIII"}, {"t": "IX – Avaliação de desempenho como processo pedagógico", "tipo": "conceito", "ref": "Art. 3º, IX", "d": "Mediante critérios objetivos decorrentes das metas institucionais, referenciada no caráter coletivo do trabalho e nas expectativas dos usuários.", "filhos": [{"t": "Caráter COLETIVO do trabalho + expectativas dos usuários", "tipo": "atencao", "d": "Bancas costumam trocar por 'caráter individual'."}]}, {"t": "X – Oportunidade de acesso a direção, assessoramento, chefia, coordenação e assistência", "tipo": "conceito", "d": "Respeitadas as normas específicas.", "ref": "Art. 3º, X"}]}, {"t": "Bolsas aos técnico-administrativos efetivos", "tipo": "regra", "ref": "Art. 3º, parágrafo único (Lei 14.695/2023)", "d": "As IFE PODERÃO conceder, na forma do regulamento, bolsas de pesquisa, de desenvolvimento, de inovação e de intercâmbio aos envolvidos nessas atividades, atendido o art. 8º.", "filhos": [{"t": "Faculdade (\"poderão\"), não obrigação", "tipo": "atencao"}]}, {"t": "Dimensionamento do quadro de pessoal", "tipo": "topico", "ref": "Art. 4º", "filhos": [{"t": "IFE avalia ANUALMENTE a adequação do quadro às suas necessidades", "tipo": "competencia", "d": "Propõe ao MEC, se for o caso, o redimensionamento.", "ref": "Art. 4º, caput"}, {"t": "Variáveis consideradas (entre outras)", "tipo": "classificacao", "ref": "Art. 4º, I a IV", "filhos": [{"t": "I – demandas institucionais", "tipo": "classificacao"}, {"t": "II – proporção força de trabalho do Plano × usuários", "tipo": "classificacao"}, {"t": "III – inovações tecnológicas", "tipo": "classificacao"}, {"t": "IV – modernização dos processos de trabalho", "tipo": "classificacao"}]}, {"t": "Cargos vagos alocados provisoriamente no MEC DEVERÃO ser redistribuídos às IFE", "tipo": "regra", "d": "Conforme as variáveis I a IV e o art. 24, § 1º, I.", "ref": "Art. 4º, parágrafo único"}]}]}}, {"id": "cap-3", "titulo": "Cap. III – Conceitos (art. 5º)", "raiz": {"t": "Conceitos da Lei 11.091", "tipo": "topico", "ref": "Art. 5º", "filhos": [{"t": "I – Plano de carreira", "tipo": "conceito", "ref": "Art. 5º, I", "d": "Conjunto de princípios, diretrizes e normas que regulam o desenvolvimento profissional dos servidores titulares de cargos de determinada carreira; instrumento de gestão do órgão ou entidade."}, {"t": "II – Nível de classificação", "tipo": "conceito", "ref": "Art. 5º, II", "d": "Conjunto de cargos de mesma hierarquia, classificados a partir de: escolaridade, nível de responsabilidade, conhecimentos, habilidades específicas, formação especializada, experiência, risco e esforço físico.", "filhos": [{"t": "Critérios incluem RISCO e ESFORÇO FÍSICO", "tipo": "atencao"}]}, {"t": "III – Padrão de vencimento (redação vigente)", "tipo": "conceito", "ref": "Art. 5º, III (Lei 15.141/2025)", "d": "Posição do servidor na escala de vencimento da carreira em função do cargo e nível de classificação.", "filhos": [{"t": "Redação antiga incluía o 'nível de capacitação'; foi suprimido", "tipo": "atencao", "ref": "Art. 5º, III"}]}, {"t": "IV – Cargo", "tipo": "conceito", "ref": "Art. 5º, IV", "d": "Conjunto de atribuições e responsabilidades previstas na estrutura organizacional que são cometidas a um servidor."}, {"t": "V – Nível de capacitação: REVOGADO", "tipo": "atencao", "ref": "Art. 5º, V", "d": "Revogado pela MP 1.286/2024 e pela Lei 15.141/2025. Era a posição na Matriz Hierárquica decorrente de capacitação realizada após o ingresso."}, {"t": "VI – Ambiente organizacional", "tipo": "conceito", "ref": "Art. 5º, VI", "d": "Área específica de atuação do servidor, integrada por atividades afins ou complementares, organizada a partir das necessidades institucionais, e que orienta a política de desenvolvimento de pessoal."}, {"t": "VII – Usuários", "tipo": "conceito", "ref": "Art. 5º, VII", "d": "Pessoas ou coletividades internas ou externas à IFE que usufruem direta ou indiretamente dos serviços por ela prestados."}]}}, {"id": "cap-4", "titulo": "Cap. IV – Estrutura do Plano de Carreira (arts. 6º–8º)", "raiz": {"t": "Estrutura do PCCTAE", "tipo": "topico", "ref": "Arts. 6º–8º", "filhos": [{"t": "Art. 6º – estrutura em níveis de capacitação: REVOGADO", "tipo": "atencao", "ref": "Art. 6º", "d": "Redação original: 5 níveis de classificação, 4 níveis de capacitação cada e 39 padrões (intervalo de 1 padrão entre níveis de capacitação e 2 entre níveis de classificação, Anexo I). Depois (Lei 11.784/2008): 5 níveis × 4 níveis de capacitação, Anexo I-C. Revogado pela MP 1.286/2024 e Lei 15.141/2025."}, {"t": "Níveis de classificação A, B, C, D e E", "tipo": "classificacao", "ref": "Art. 7º (Lei 15.141/2025)", "d": "Organizados conforme o art. 5º, II, o Anexo II e o Anexo II-A."}, {"t": "19 padrões de vencimento por nível de classificação", "tipo": "prazo", "ref": "Art. 7º-A", "d": "A partir de 1º/1/2025, conforme correlação do Anexo I-D.", "filhos": [{"t": "Não confundir com os 39 padrões da redação original", "tipo": "atencao"}]}, {"t": "Novos cargos do PCCTAE", "tipo": "classificacao", "ref": "Art. 7º-B", "filhos": [{"t": "Técnico em Educação – nível D", "tipo": "classificacao", "d": "Atividades de apoio técnico, administrativo e logístico relativas às competências constitucionais e legais das IFE.", "ref": "Art. 7º-B, I"}, {"t": "Analista em Educação – nível E", "tipo": "classificacao", "d": "Atividades técnicas, administrativas e logísticas relativas às competências constitucionais e legais das IFE.", "ref": "Art. 7º-B, II"}, {"t": "Criação por transformação de cargos vagos da Tabela I do Anexo VIII", "tipo": "prazo", "ref": "Art. 7º-B, § 1º", "d": "No âmbito do MEC, para redistribuição às IFE.", "filhos": [{"t": "4.040 cargos de Técnico em Educação", "tipo": "prazo", "ref": "Art. 7º-B, § 1º, I"}, {"t": "6.060 cargos de Analista em Educação", "tipo": "prazo", "ref": "Art. 7º-B, § 1º, II"}]}, {"t": "Concurso só após a regulamentação", "tipo": "regra", "ref": "Art. 7º-B, § 2º"}, {"t": "Podem ser exigidos outros requisitos em razão da profissão", "tipo": "regra", "ref": "Art. 7º-B, § 3º"}, {"t": "Áreas, especialidades, formação e atribuições: em regulamento", "tipo": "regra", "ref": "Art. 7º-B, § 4º"}]}, {"t": "Cargos da Tabela III do Anexo VIII: alocados provisoriamente no MEC", "tipo": "regra", "d": "Os vagos e os que vierem a vagar.", "ref": "Art. 7º-C"}, {"t": "Transformação autorizada (sem aumento de despesa) dos cargos que vagarem da Tabela II do Anexo VIII", "tipo": "regra", "ref": "Art. 7º-D", "filhos": [{"t": "6.226 cargos de Técnico em Educação", "tipo": "prazo", "ref": "Art. 7º-D, I"}, {"t": "9.340 cargos de Analista em Educação", "tipo": "prazo", "ref": "Art. 7º-D, II"}, {"t": "MEC submete as transformações ao Órgão Central do Sipec", "tipo": "competencia", "d": "Observada a adequação orçamentária e financeira.", "ref": "Art. 7º-E"}]}, {"t": "Regulamento do Executivo disporá sobre transformação dos cargos do Anexo II em Técnico/Analista em Educação", "tipo": "regra", "d": "Cargos vagos e que vierem a vagar; sem aumento de despesa.", "ref": "Art. 7º-F"}, {"t": "Atribuições gerais dos cargos", "tipo": "classificacao", "ref": "Art. 8º", "d": "Sem prejuízo das atribuições específicas e observados requisitos de qualificação e competências.", "filhos": [{"t": "I – Planejar, organizar, executar ou avaliar o apoio técnico-administrativo ao ensino", "tipo": "regra", "ref": "Art. 8º, I"}, {"t": "II – Idem quanto a pesquisa, extensão, inovação, gestão e assistência especializada", "tipo": "regra", "d": "Atividades técnico-administrativas e especializadas (redação Lei 15.141/2025).", "ref": "Art. 8º, II"}, {"t": "III – Executar tarefas específicas com recursos da IFE", "tipo": "regra", "d": "Para assegurar eficiência, eficácia e efetividade das atividades de pesquisa, extensão, inovação, gestão e assistência especializada.", "ref": "Art. 8º, III"}, {"t": "Exercidas de acordo com o ambiente organizacional", "tipo": "regra", "ref": "Art. 8º, § 1º"}, {"t": "§ 2º (atribuições específicas em regulamento): REVOGADO", "tipo": "atencao", "ref": "Art. 8º, § 2º"}, {"t": "Inciso II inclui coordenação de projetos de pesquisa e extensão, com bolsas", "tipo": "regra", "ref": "Art. 8º, § 3º (Lei 14.695/2023)", "d": "Bolsas pagas pela IFE, por agência oficial de fomento, por fundação de apoio credenciada por IFE ou por organismo internacional amparado por ato, tratado ou convenção."}]}]}}, {"id": "cap-5-desenvolvimento", "titulo": "Cap. V – Ingresso e formas de desenvolvimento (arts. 9º–10-B)", "raiz": {"t": "Ingresso e desenvolvimento na carreira", "tipo": "topico", "ref": "Arts. 9º–10-B", "filhos": [{"t": "Ingresso", "tipo": "topico", "ref": "Art. 9º", "filhos": [{"t": "No padrão inicial do respectivo nível de classificação", "tipo": "regra", "d": "Redação vigente (Lei 15.141/2025). A original falava no padrão inicial do 1º nível de capacitação.", "ref": "Art. 9º, caput"}, {"t": "Concurso de provas ou de provas e títulos", "tipo": "regra", "d": "Observados os requisitos de ingresso do Anexo II.", "ref": "Art. 9º, caput"}, {"t": "Concurso pode ser por áreas de especialização, em 1 ou mais fases, com curso de formação", "tipo": "regra", "d": "Conforme o plano de desenvolvimento dos integrantes do Plano de Carreira.", "ref": "Art. 9º, § 1º"}, {"t": "Edital define fases, escolaridade, formação, experiência, critérios eliminatórios/classificatórios e restrições do ambiente organizacional", "tipo": "regra", "ref": "Art. 9º, § 2º"}]}, {"t": "Desenvolvimento a partir de 1º/1/2025 (regra vigente)", "tipo": "topico", "ref": "Art. 10-B", "d": "Mudança de padrão de vencimento mediante progressão por mérito OU aceleração da progressão por capacitação.", "filhos": [{"t": "Progressão por mérito", "tipo": "conceito", "ref": "Art. 10-B, § 1º", "d": "Mudança para o padrão imediatamente subsequente, a cada 12 meses de efetivo exercício, se o servidor apresentar o resultado fixado em programa de avaliação de desempenho.", "filhos": [{"t": "Interstício: 12 meses", "tipo": "prazo", "ref": "Art. 10-B, § 1º"}, {"t": "Aproveita-se o tempo desde a última progressão", "tipo": "regra", "ref": "Art. 10-B, § 2º"}, {"t": "Saldo do interstício anterior a 1º/1/2025 conta uma única vez na progressão seguinte", "tipo": "regra", "d": "Independentemente do momento em que a progressão venha a ser concedida.", "ref": "Art. 10-B, § 6º"}]}, {"t": "Aceleração da progressão por capacitação", "tipo": "conceito", "ref": "Art. 10-B, § 3º", "d": "Mudança de padrão decorrente de certificação em programa de capacitação compatível com o cargo, respeitado interstício de 5 anos de efetivo exercício e cumprida a carga horária mínima em ações de desenvolvimento (Anexo III-A).", "filhos": [{"t": "Interstício: 5 anos de efetivo exercício", "tipo": "prazo", "ref": "Art. 10-B, § 3º"}, {"t": "Cada mudança de padrão pelo antigo instituto conta 5 anos para o interstício", "tipo": "regra", "d": "Computam-se 5 anos de efetivo exercício para cada mudança de padrão decorrente da antiga progressão por capacitação.", "ref": "Art. 10-B, § 4º"}, {"t": "Cada evento de capacitação é computado uma única vez", "tipo": "excecao", "ref": "Art. 10-B, § 5º"}]}]}, {"t": "Regras do art. 10 (sistema anterior por níveis de capacitação)", "tipo": "topico", "ref": "Art. 10", "d": "O texto compilado não marca o caput nem todos os parágrafos como revogados, mas o art. 10-B passou a reger o desenvolvimento desde 2025.", "filhos": [{"t": "Desenvolvimento 'exclusivamente' por mudança de nível de capacitação e de padrão", "tipo": "regra", "ref": "Art. 10, caput"}, {"t": "Progressão por Capacitação Profissional", "tipo": "conceito", "ref": "Art. 10, § 1º", "d": "Mudança de nível de capacitação, no mesmo cargo e nível de classificação, por certificação em programa de capacitação compatível com cargo, ambiente organizacional e carga horária mínima, respeitado interstício de 18 meses (Anexo III).", "filhos": [{"t": "Interstício: 18 meses", "tipo": "prazo", "ref": "Art. 10, § 1º"}, {"t": "Reposicionamento na mesma posição relativa no novo nível", "tipo": "regra", "ref": "Art. 10, § 3º"}, {"t": "Soma de cargas horárias permitida; vedado curso < 20 horas-aula", "tipo": "excecao", "d": "Soma de cursos feitos durante a permanência no nível atual + excedente do interstício anterior (redação Lei 12.772/2012; a original vedava a soma).", "ref": "Art. 10, § 4º"}, {"t": "Nível E: disciplinas isoladas de mestrado/doutorado podem valer como certificação", "tipo": "regra", "d": "Concluídas com aproveitamento, como aluno regular, com relação direta com o cargo, em cursos reconhecidos pelo MEC; ato do Ministro da Educação.", "ref": "Art. 10, § 6º"}]}, {"t": "Progressão por Mérito a cada 2 anos (§ 2º): REVOGADO", "tipo": "atencao", "ref": "Art. 10, § 2º"}, {"t": "Mudança de nível de capacitação/padrão não muda o nível de classificação", "tipo": "excecao", "ref": "Art. 10, § 5º"}, {"t": "Liberação para mestrado/doutorado: depende de avaliação de desempenho favorável", "tipo": "regra", "ref": "Art. 10, § 7º"}, {"t": "Critérios da liberação: portaria conjunta Planejamento + Educação", "tipo": "competencia", "ref": "Art. 10, § 8º"}, {"t": "Lei 15.141/2025 revogou expressamente só o § 2º do art. 10, o art. 10-A e o Anexo III", "tipo": "atencao", "ext": true, "ref": "Lei 15.141/2025, art. 217, XV", "d": "Conferido no Planalto (out/2026): o art. 217, XV, da Lei 15.141/2025 revoga, na Lei 11.091, o art. 5º, V, o art. 6º, o § 2º do art. 8º, o § 2º do art. 10, o art. 10-A (inteiro, inclusive o parágrafo único), o art. 12 (inteiro) e os Anexos III e V. O caput e os demais §§ do art. 10 não foram revogados expressamente, mas ficaram esvaziados pelo art. 10-B; em prova, use o art. 10-B."}, {"t": "Art. 10-A: mérito a cada 18 meses desde 1º/5/2008 – REVOGADO", "tipo": "atencao", "ref": "Art. 10-A", "d": "Revogado pela MP 1.286/2024 e Lei 15.141/2025. Hoje o interstício de mérito é 12 meses (art. 10-B, § 1º). O compilado marca só o caput como revogado, mas a Lei 15.141/2025 (art. 217, XV, \"e\") revogou o art. 10-A inteiro, inclusive o parágrafo único (fonte externa)."}]}]}}, {"id": "cap-5-iq-rsc", "titulo": "Cap. V – Incentivo à Qualificação e RSC-PCCTAE (arts. 11–12-I)", "raiz": {"t": "Incentivo à Qualificação (IQ) e RSC-PCCTAE", "tipo": "topico", "ref": "Arts. 11–12-I", "filhos": [{"t": "Incentivo à Qualificação", "tipo": "topico", "ref": "Arts. 11, 12 e 12-A", "filhos": [{"t": "Devido a quem tem educação formal superior à exigida para o cargo", "tipo": "conceito", "d": "Na forma de regulamento.", "ref": "Art. 11"}, {"t": "Calculado sobre o padrão de vencimento percebido (Anexo IV)", "tipo": "regra", "d": "A partir de 1º/1/2025.", "ref": "Art. 12-A, caput"}, {"t": "Executivo federal fixa critérios e processos de validação de certificados e títulos", "tipo": "competencia", "d": "Observadas as diretrizes do art. 24, § 2º.", "ref": "Art. 12-A, § 1º"}, {"t": "Certificado/diploma/titulação acima da escolaridade mínima de INGRESSO, independentemente do nível de classificação", "tipo": "regra", "ref": "Art. 12-A, § 2º"}, {"t": "Percentuais NÃO acumuláveis; incorporados à aposentadoria e pensão", "tipo": "excecao", "ref": "Art. 12-A, § 3º"}, {"t": "Integra proventos/pensões só se certificados obtidos até a aposentadoria ou instituição da pensão", "tipo": "excecao", "ref": "Art. 12-A, § 4º"}, {"t": "Histórico: exigência de 4 anos de exercício e distinção relação direta × indireta", "tipo": "atencao", "ref": "Art. 12", "d": "A redação original exigia 4 anos de efetivo exercício (suprimido em 2008). No compilado, o caput do art. 12 aparece revogado (MP 1.286/2024 e Lei 15.141/2025) e os §§ 1º a 4º revogados pela MP 1.286/2024; os incisos I e II (área direta gera percentual maior; certificados de fundamental/médio contam como relação direta) e o § 2º original ficaram sem marca. Regra vigente: art. 12-A."}, {"t": "Art. 12 inteiro está revogado (Lei 15.141/2025, art. 217, XV, \"f\")", "tipo": "atencao", "ext": true, "ref": "Lei 15.141/2025, art. 217, XV, f", "d": "Conferido no Planalto (out/2026): a Lei 15.141/2025 revogou o art. 12 por inteiro (caput, incisos e parágrafos). A distinção entre área de relação direta e indireta não existe mais; o IQ segue o art. 12-A e o Anexo IV."}, {"t": "Anexo IV vigente desde 1º/1/2025 (percentuais do IQ)", "tipo": "prazo", "ext": true, "ref": "Lei 15.141/2025, art. 132 e Anexo CCXXIII", "d": "Não consta do PDF (anexo só em link). Conferido no Planalto (out/2026): fundamental 10%; médio 15%; médio profissionalizante ou médio com curso técnico 20%; graduação 25%; especialização (≥ 360 h) 30%; mestrado 52%; doutorado 75%. Tabela única, sem distinção entre relação direta e indireta."}]}, {"t": "RSC-PCCTAE – Reconhecimento de Saberes e Competências", "tipo": "topico", "ref": "Arts. 12-B a 12-I (Lei 15.367/2026)", "filhos": [{"t": "Instituído a partir de 1º/4/2026", "tipo": "prazo", "ref": "Art. 12-B, caput"}, {"t": "Reconhece o saber não instituído dos servidores ATIVOS", "tipo": "conceito", "d": "Resultante da atuação no exercício do cargo, na dinâmica de ensino, pesquisa e extensão (art. 3º, IV).", "ref": "Art. 12-B, § 1º"}, {"t": "Uso EXCLUSIVO para percepção do IQ – modalidade alternativa", "tipo": "regra", "d": "Alternativa aos critérios do art. 12-A, § 2º (titulação formal).", "ref": "Art. 12-B, § 2º"}, {"t": "Concedido pela IFE de lotação do servidor", "tipo": "competencia", "ref": "Art. 12-B, § 3º"}, {"t": "6 níveis e percentuais de IQ sobre o vencimento básico", "tipo": "classificacao", "ref": "Art. 12-C, caput e § 2º", "filhos": [{"t": "RSC-I: sem ensino fundamental → 10%", "tipo": "prazo", "ref": "Art. 12-C, § 2º, I"}, {"t": "RSC-II: ensino fundamental → 15%", "tipo": "prazo", "ref": "Art. 12-C, § 2º, II"}, {"t": "RSC-III: ensino médio ou técnico de nível médio → 25%", "tipo": "prazo", "ref": "Art. 12-C, § 2º, III"}, {"t": "RSC-IV: graduação → 30%", "tipo": "prazo", ramento por tempo de serviço", "tipo": "classificacao", "ref": "Art. 15, § 1º, II"}, {"t": "Anexo VI: termo de opção", "tipo": "classificacao", "ref": "Art. 16"}, {"t": "Anexo VII: Tabela de Correlação", "tipo": "classificacao", "ref": "Art. 15"}, {"t": "Anexo VIII (Tabelas I, II, III): cargos transformados/alocados no MEC", "tipo": "classificacao", "ref": "Arts. 7º-B a 7º-D"}, {"t": "Valores salariais e percentuais do Anexo IV não verificáveis no PDF", "tipo": "atencao"}]}}], "comparacoes": [{"titulo": "Progressão por mérito × Aceleração da progressão por capacitação (regime vigente desde 1º/1/2025)", "colunas": ["Aspecto", "Progressão por mérito", "Aceleração da progressão por capacitação"], "linhas": [["Conceito", "Mudança para o padrão imediatamente subsequente", "Mudança de padrão de vencimento por certificação em programa de capacitação"], ["Interstício", "12 meses de efetivo exercício", "5 anos de efetivo exercício"], ["Requisito", "Resultado fixado em programa de avaliação de desempenho", "Certificação compatível com o cargo + carga horária mínima (Anexo III-A)"], ["Contagem", "Aproveita tempo desde a última progressão; saldo anterior a 2025 conta uma vez", "5 anos por mudança de padrão pelo antigo instituto; cada evento computado uma vez"], ["Base legal", "Art. 10-B, §§ 1º, 2º e 6º", "Art. 10-B, §§ 3º a 5º"]]}, {"titulo": "Regime original × Regime vigente (MP 1.286/2024 e Lei 15.141/2025)", "colunas": ["Aspecto", "Redação anterior", "Redação vigente"], "linhas": [["Estrutura", "5 níveis de classificação × 4 níveis de capacitação (39 padrões no original)", "5 níveis de classificação com 19 padrões cada (art. 7º-A)"], ["Ingresso", "Padrão inicial do 1º nível de capacitação", "Padrão inicial do nível de classificação"], ["Mérito", "A cada 2 anos (original) / 18 meses (desde 1º/5/2008)", "A cada 12 meses"], ["Capacitação", "Mudança de nível de capacitação, interstício de 18 meses", "Aceleração (mudança de padrão), interstício de 5 anos"], ["Padrão de vencimento (conceito)", "Função do nível de capacitação, cargo e nível de classificação", "Função do cargo e do nível de classificação"], ["Tabela de vencimentos", "Anexo I → I-B → I-C", "Anexo I-D"]]}, {"titulo": "IQ por titulação × IQ por RSC-PCCTAE", "colunas": ["Aspecto", "IQ por titulação", "IQ via RSC-PCCTAE"], "linhas": [["Fundamento", "Educação formal acima da exigida para ingresso", "Saber não instituído reconhecido (art. 3º, IV)"], ["Base legal", "Arts. 11 e 12-A", "Arts. 12-B a 12-I"], ["Quem concede/valida", "Critérios do Poder Executivo federal", "IFE de lotação, via CRSC-PCCTAE"], ["Alcance", "Ativos; incorpora à aposentadoria/pensão se certificado obtido antes", "Só ativos em efetivo exercício; vedado no estágio probatório; teto de 75% dos servidores"], ["Vigência", "Desde 2025 na forma do art. 12-A", "A partir de 1º/4/2026"]]}, {"titulo": "Comissões previstas na Lei", "colunas": ["Aspecto", "Comissão de Enquadramento", "Comissão Nacional de Supervisão", "Comissão Interna de Supervisão", "CRSC-PCCTAE"], "linhas": [["Onde", "Cada IFE", "Vinculada ao MEC", "Cada IFE", "Cada IFE"], ["Composição", "Paritária: servidores do Plano (indicados pelos pares) + administração superior", "Paritária: MEC + dirigentes das IFES + entidades da categoria", "Servidores do Plano", "Em regulamento"], ["Função", "Aplicar o enquadramento; resultado homologado pelo colegiado superior", "Acompanhar, assessorar, avaliar a implementação", "Acompanhar, orientar, fiscalizar e avaliar na IFE", "Avaliar requisitos e memorial do RSC (até 120 dias)"], ["Base legal", "Arts. 19–21", "Art. 22, caput e §§ 1º–2º", "Art. 22, § 3º", "Art. 12-E"]]}], "pegadinhas": [{"texto": "O interstício vigente da progressão por mérito é de 12 meses (art. 10-B), e não 18 meses (art. 10-A, revogado) nem 2 anos (art. 10, § 2º, revogado).", "ref": "Art. 10-B, § 1º"}, {"texto": "A aceleração da progressão por capacitação exige interstício de 5 anos, não 18 meses (regra do antigo art. 10, § 1º).", "ref": "Art. 10-B, § 3º"}, {"texto": "Desde 2025 são 19 padrões de vencimento em cada nível de classificação; os 39 padrões eram da redação original do art. 6º.", "ref": "Art. 7º-A"}, {"texto": "Técnico em Educação é nível D; Analista em Educação é nível E (não C e D).", "ref": "Art. 7º-B"}, {"texto": "Criados 4.040 Técnicos e 6.060 Analistas (Tabela I do Anexo VIII); a transformação autorizada da Tabela II prevê 6.226 Técnicos e 9.340 Analistas.", "ref": "Arts. 7º-B, § 1º, e 7º-D"}, {"texto": "O conceito de nível de capacitação (art. 5º, V) está revogado; o padrão de vencimento hoje depende só do cargo e do nível de classificação.", "ref": "Art. 5º, III e V"}, {"texto": "Percentuais do IQ NÃO são acumuláveis, mas SÃO incorporados à aposentadoria e pensão (desde que os certificados tenham sido obtidos até a aposentadoria ou instituição da pensão).", "ref": "Art. 12-A, §§ 3º e 4º"}, {"texto": "O IQ é devido independentemente do nível de classificação do cargo ocupado; a referência é a escolaridade mínima de ingresso.", "ref": "Art. 12-A, § 2º"}, {"texto": "O RSC-PCCTAE serve EXCLUSIVAMENTE para percepção do IQ, não para progressão.", "ref": "Art. 12-B, § 2º"}, {"texto": "O RSC-PCCTAE não se aplica ao servidor em estágio probatório e é limitado a 75% do total de servidores do PCCTAE.", "ref": "Art. 12-C, §§ 1º e 5º"}, {"texto": "A CRSC pode indeferir o RSC mesmo com os requisitos do art. 12-D atendidos (análise de mérito do memorial, fundamentada).", "ref": "Art. 12-E, § 1º"}, {"texto": "Efeitos financeiros do RSC: da concessão, sem retroagir ao requerimento; só retroagem ao fim dos 120 dias se a concessão atrasar.", "ref": "Art. 12-H"}, {"texto": "Novo RSC só após 3 anos da última concessão e apenas para o percentual subsequente ao já recebido.", "ref": "Art. 12-F"}, {"texto": "RSC-III (ensino médio) dá 25%; RSC-V (lato sensu) dá 52%; RSC-VI (mestrado) dá 75%.", "ref": "Art. 12-C, § 2º"}, {"texto": "A opção pelo enquadramento é IRRETRATÁVEL e devia ser feita em 60 dias; quem não optou ficou em quadro em extinção (Lei 7.596/87).", "ref": "Art. 16"}, {"texto": "Prazos do enquadramento: 90 dias (Matriz Hierárquica e redistribuídos), 180 dias (Comissão relaciona habilitados ao IQ), recurso em 30 dias e decisão em 60 dias.", "ref": "Arts. 15, 20 e 21"}, {"texto": "O resultado da Comissão de Enquadramento é homologado pelo colegiado SUPERIOR; o recurso indeferido vai ao colegiado MÁXIMO da IFE.", "ref": "Arts. 19, § 1º, e 21, parágrafo único"}, {"texto": "Os efeitos da Lei se aplicam a aposentados e pensionistas, EXCETO quanto ao art. 10 (desenvolvimento na carreira).", "ref": "Art. 23, I"}, {"texto": "A vedação de redistribuição é entre IFE e outros órgãos; entre IFE ela é permitida.", "ref": "Art. 26-B"}, {"texto": "O afastamento para colaboração (art. 26-A) é com ônus para a instituição de ORIGEM e não pode exceder 4 anos.", "ref": "Art. 26-A"}, {"texto": "A parcela complementar NÃO é absorvida pelos aumentos com efeitos a partir de 2025 e 2026.", "ref": "Art. 15, § 6º"}, {"texto": "A avaliação de desempenho é referenciada no caráter COLETIVO do trabalho e nas expectativas dos usuários, como processo pedagógico.", "ref": "Art. 3º, IX"}, {"texto": "A IFE avalia o quadro ANUALMENTE e PROPÕE o redimensionamento ao MEC (não decide sozinha).", "ref": "Art. 4º"}], "erros_frequentes": [{"texto": "Estudar a carreira ainda pelos 4 níveis de capacitação e 39 padrões: o art. 6º e o conceito de nível de capacitação foram revogados (MP 1.286/2024 e Lei 15.141/2025).", "ref": "Arts. 5º, V, 6º e 7º-A"}, {"texto": "Confundir IQ (educação formal acima da exigida) com progressão por capacitação (cursos de capacitação para mudança de padrão).", "ref": "Arts. 10-B e 12-A"}, {"texto": "Achar que o IQ ainda exige 4 anos de efetivo exercício: requisito suprimido em 2008.", "ref": "Art. 12"}, {"texto": "Dizer que a liberação para mestrado/doutorado é automática: depende de resultado favorável na avaliação de desempenho.", "ref": "Art. 10, § 7º"}, {"texto": "Supor que o regime jurídico é próprio: é o da Lei 8.112/1990, observada a Lei 11.091.", "ref": "Art. 1º, § 2º"}, {"texto": "Achar que empregados (celetistas) das IFE mudam de regime: a Lei veda alteração de regime jurídico.", "ref": "Art. 23, II"}], "relacoes": [{"texto": "Lei 8.112/1990: regime jurídico aplicável aos cargos do PCCTAE (art. 1º, § 2º)."}, {"texto": "Lei 7.596/1987 (PUCRCE): origem dos cargos técnico-administrativos e técnico-marítimos; regime do quadro em extinção de quem não optou (arts. 1º, 16 e 17)."}, {"texto": "LC 101/2000 (LRF), arts. 16 e 17: condição para editar o regulamento do IQ e do enquadramento por capacitação (art. 26, parágrafo único)."}, {"texto": "CF, art. 169, § 1º: disponibilidade orçamentária como limite do RSC-PCCTAE (art. 12-C, § 1º)."}, {"texto": "Leis 10.868/2004 (GT), 10.908/2004 (GEAT) e 10.698/2003 (VPI): vantagens não devidas aos integrantes do Plano (arts. 13 e 13-A)."}, {"texto": "Lei 12.772/2012, Lei 11.784/2008, Lei 14.695/2023, MP 1.286/2024, Lei 15.141/2025 e Lei 15.367/2026: principais diplomas alteradores indicados no texto compilado."}, {"texto": "Na prática, o Decreto nº 5.825/2006 traz as diretrizes do plano de desenvolvimento (art. 24) e o Decreto nº 5.824/2006 regulamenta IQ/capacitação no regime anterior; verificar normas posteriores à Lei 15.141/2025.", "ext": true}], "perguntas": [{"p": "Qual o regime jurídico dos cargos do PCCTAE?", "r": "O da Lei nº 8.112/1990, observadas as disposições da Lei 11.091.", "ref": "Art. 1º, § 2º"}, {"p": "O que são Instituições Federais de Ensino para a Lei?", "r": "Órgãos e entidades públicos vinculados ao MEC com atividade-fim de desenvolvimento e aperfeiçoamento do ensino, pesquisa e extensão, integrantes do Sistema Federal de Ensino.", "ref": "Art. 2º"}, {"p": "Como deve ser a avaliação de desempenho segundo os princípios do Plano?", "r": "Processo pedagógico, com critérios objetivos decorrentes das metas institucionais, referenciada no caráter coletivo do trabalho e nas expectativas dos usuários.", "ref": "Art. 3º, IX"}, {"p": "Com que periodicidade a IFE avalia a adequação de seu quadro de pessoal?", "r": "Anualmente, propondo ao MEC, se for o caso, o redimensionamento.", "ref": "Art. 4º"}, {"p": "Defina nível de classificação.", "r": "Conjunto de cargos de mesma hierarquia, classificados por escolaridade, responsabilidade, conhecimentos, habilidades, formação especializada, experiência, risco e esforço físico.", "ref": "Art. 5º, II"}, {"p": "O que é ambiente organizacional?", "r": "Área específica de atuação do servidor, integrada por atividades afins ou complementares, organizada a partir das necessidades institucionais, que orienta a política de desenvolvimento de pessoal.", "ref": "Art. 5º, VI"}, {"p": "Quantos padrões de vencimento há por nível de classificação desde 2025?", "r": "Dezenove, conforme o Anexo I-D.", "ref": "Art. 7º-A"}, {"p": "Quais cargos foram incluídos pelo art. 7º-B e em que níveis?", "r": "Técnico em Educação (nível D) e Analista em Educação (nível E).", "ref": "Art. 7º-B"}, {"p": "Onde ocorre o ingresso na carreira hoje?", "r": "No padrão inicial do respectivo nível de classificação, por concurso de provas ou de provas e títulos, observados os requisitos do Anexo II.", "ref": "Art. 9º"}, {"p": "Como se dá o desenvolvimento na carreira desde 1º/1/2025?", "r": "Pela mudança de padrão de vencimento mediante progressão por mérito ou aceleração da progressão por capacitação.", "ref": "Art. 10-B"}, {"p": "Qual o interstício da progressão por mérito e seu requisito?", "r": "12 meses de efetivo exercício e resultado fixado em programa de avaliação de desempenho.", "ref": "Art. 10-B, § 1º"}, {"p": "Qual o interstício da aceleração da progressão por capacitação?", "r": "5 anos de efetivo exercício, com certificação compatível com o cargo e carga horária mínima do Anexo III-A.", "ref": "Art. 10-B, § 3º"}, {"p": "Um mesmo evento de capacitação pode ser usado duas vezes na aceleração?", "r": "Não; cada evento é computado uma única vez.", "ref": "Art. 10-B, § 5º"}, {"p": "A mudança de padrão de vencimento altera o nível de classificação?", "r": "Não.", "ref": "Art. 10, § 5º"}, {"p": "A liberação para mestrado e doutorado depende de quê?", "r": "De resultado favorável na avaliação de desempenho; critérios em portaria conjunta dos Ministros do Planejamento e da Educação.", "ref": "Art. 10, §§ 7º e 8º"}, {"p": "Quem tem direito ao Incentivo à Qualificação?", "r": "O servidor com certificado, diploma ou titulação que exceda a escolaridade mínima de ingresso no cargo, independentemente do nível de classificação.", "ref": "Arts. 11 e 12-A, § 2º"}, {"p": "Os percentuais do IQ são acumuláveis?", "r": "Não; mas são incorporados à aposentadoria e pensão se os certificados foram obtidos até a aposentadoria ou instituição da pensão.", "ref": "Art. 12-A, §§ 3º e 4º"}, {"p": "Para que serve o RSC-PCCTAE e desde quando?", "r": "Exclusivamente para percepção do IQ, como modalidade alternativa à titulação; instituído a partir de 1º/4/2026.", "ref": "Art. 12-B"}, {"p": "Quais os percentuais de IQ pelo RSC-PCCTAE?", "r": "I 10%, II 15%, III 25%, IV 30%, V 52% e VI 75% do vencimento básico.", "ref": "Art. 12-C, § 2º"}, {"p": "Servidor em estágio probatório pode obter o RSC-PCCTAE?", "r": "Não.", "ref": "Art. 12-C, § 5º"}, {"p": "Qual o prazo para a CRSC analisar o requerimento de RSC?", "r": "Até 120 dias do protocolo; se exceder, os efeitos financeiros retroagem ao fim desse prazo.", "ref": "Arts. 12-E, § 3º, e 12-H, § 1º"}, {"p": "Após quanto tempo se pode requerer novo RSC?", "r": "Após 3 anos da data da última concessão, e só para o percentual subsequente.", "ref": "Art. 12-F"}, {"p": "Os integrantes do Plano recebem GT, GEAT ou VPI?", "r": "Não fazem jus a nenhuma delas.", "ref": "Arts. 13, parágrafo único, e 13-A"}, {"p": "Qual a natureza da opção pelo enquadramento e o prazo?", "r": "Irretratável, formalizada em 60 dias do início da vigência, conforme termo do Anexo VI.", "ref": "Art. 16"}, {"p": "Como é composta a Comissão de Enquadramento?", "r": "Paritariamente por servidores do Plano indicados pelos pares e por representantes da administração superior da IFE.", "ref": "Art. 19, § 2º"}, {"p": "Quais os prazos de recurso contra o enquadramento?", "r": "30 dias para o servidor recorrer à Comissão, que decide em 60 dias; indeferido, cabe recurso ao colegiado máximo da IFE.", "ref": "Art. 21"}, {"p": "Como é composta a Comissão Nacional de Supervisão?", "r": "Paritariamente por representantes do MEC, dos dirigentes das IFES e das entidades representativas da categoria.", "ref": "Art. 22, § 1º"}, {"p": "O que deve conter o plano de desenvolvimento dos integrantes da carreira?", "r": "Dimensionamento das necessidades institucionais (com modelos de alocação de vagas), Programa de Capacitação e Aperfeiçoamento e Programa de Avaliação de Desempenho.", "ref": "Art. 24, § 1º"}, {"p": "Quais os prazos das IFE após o regulamento do art. 24?", "r": "90 dias para o plano de desenvolvimento; 180 dias para o programa de capacitação; 360 dias para iniciar a avaliação de desempenho e o dimensionamento.", "ref": "Art. 24, § 3º"}, {"p": "Qual o limite do afastamento para colaboração e quem autoriza?", "r": "Até 4 anos, com ônus para a origem, autorizado pelo dirigente máximo da IFE e vinculado a projeto ou convênio.", "ref": "Art. 26-A"}, {"p": "É possível redistribuir cargo de uma IFE para outro órgão federal?", "r": "Não; a redistribuição é vedada entre IFE e outros órgãos, mas permitida entre IFE.", "ref": "Art. 26-B"}, {"p": "Os efeitos da Lei alcançam aposentados e pensionistas?", "r": "Sim, exceto quanto ao art. 10 (desenvolvimento na carreira).", "ref": "Art. 23, I"}], "cobertura": [{"item": "Cap. I – Disposições preliminares (arts. 1º–2º)", "status": "ok", "obs": ""}, {"item": "Cap. II – Organização do quadro de pessoal (arts. 3º–4º)", "status": "ok", "obs": ""}, {"item": "Cap. III – Conceitos (art. 5º)", "status": "ok", "obs": "Inciso V revogado mencionado em nó de atenção."}, {"item": "Cap. IV – Estrutura do Plano (arts. 6º–8º, incl. 7º-A a 7º-F)", "status": "ok", "obs": "Art. 6º revogado indicado como atenção."}, {"item": "Cap. V – Ingresso e desenvolvimento (arts. 9º–10-B)", "status": "ok", "obs": "Art. 10 mapeado como regime anterior; art. 10-A revogado."}, {"item": "Cap. V – Incentivo à Qualificação (arts. 11–12-A)", "status": "ok", "obs": "Percentuais do Anexo IV não constam do PDF; nó com ext: true."}, {"item": "Cap. V – RSC-PCCTAE (arts. 12-B–12-I)", "status": "ok", "obs": ""}, {"item": "Cap. VI – Remuneração (arts. 13–14)", "status": "ok", "obs": ""}, {"item": "Cap. VII – Enquadramento (arts. 15–21)", "status": "ok", "obs": ""}, {"item": "Cap. VIII – Disposições finais e transitórias (arts. 22–27)", "status": "ok", "obs": ""}, {"item": "Anexos I a VIII", "status": "nao", "obs": "O PDF contém apenas os links 'Download para Anexos'; tabelas (vencimentos, Anexo II, III, III-A, IV, V, VI, VII, VIII) não estão no texto. Mapeada só a função de cada anexo."}], "nao_verificado": ["Anexos ausentes do PDF (apenas links): valores das tabelas salariais (Anexos I, I-B, I-C, I-D), lista de cargos (Anexo II/II-A), cargas horárias (Anexo III-A) e tabelas de enquadramento (VI a VIII) não foram conferidos. O Anexo IV vigente foi conferido no Planalto (Lei 15.141/2025, Anexo CCXXIII) e incluído como ext; Anexos III e V foram revogados pela Lei 15.141/2025.", "Conferido (Planalto, out/2026): a Lei 15.141/2025, art. 217, XV, revogou o art. 12 inteiro (caput, incisos I e II e todos os §§); o compilado do PDF só marca o caput e os §§ 1º a 4º (estes apenas pela MP 1.286/2024). Nota ext acrescentada no mapa.", "Conferido (Planalto, out/2026): a Lei 15.141/2025, art. 217, XV, revogou só o § 2º do art. 10 e o art. 10-A inteiro (inclusive o parágrafo único); o caput e os §§ 1º e 3º a 8º do art. 10 não foram revogados expressamente, mas foram esvaziados pelo art. 10-B (e o Anexo III, a que remete o § 1º, foi revogado).", "Arts. 15, 18, 20, 23 e 26 ainda mencionam 'nível de capacitação'/'Matriz Hierárquica' por serem regras transitórias de 2005; mantidos como texto histórico.", "Percentuais do Anexo IV (redação da Lei 15.141/2025, a partir de 1º/1/2025) incluídos apenas como complementação externa (ext: true), conferidos no Planalto."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},

};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
