ivalente ou superior aprovada", "tipo": "regra", "ref": "Art. 67, § 6º"}, {"t": "Estrangeiras: solicitação de registro no Brasil na assinatura do contrato", "tipo": "regra", "ref": "Art. 67, § 7º"}, {"t": "Pode exigir relação de compromissos que reduzam disponibilidade técnica", "tipo": "regra", "ref": "Art. 67, § 8º"}, {"t": "Atestados de potencial subcontratado: limitado a 25% do objeto", "tipo": "prazo", "ref": "Art. 67, § 9º"}, {"t": "Atestado de consórcio sem identificação individual", "tipo": "regra", "d": "Homogêneo: proporção da participação (salvo serviços intelectuais: integral a cada um); heterogêneo: conforme campos de atuação. Juntar instrumento de constituição se o percentual não constar.", "ref": "Art. 67, §§ 10 e 11"}, {"t": "Não se admitem atestados de profissionais que deram causa a impedimento ou inidoneidade", "tipo": "excecao", "ref": "Art. 67, § 12"}]}, {"t": "Fiscal, social e trabalhista (art. 68)", "tipo": "classificacao", "d": "I – CPF/CNPJ; II – inscrição estadual/municipal; III – regularidade com Fazendas; IV – Seguridade Social e FGTS; V – Justiça do Trabalho; VI – art. 7º, XXXIII, da CF (trabalho do menor).", "ref": "Art. 68", "filhos": [{"t": "Documentos substituíveis por outros meios hábeis, inclusive eletrônicos", "tipo": "regra", "ref": "Art. 68, § 1º"}]}, {"t": "Econômico-financeira (art. 69)", "tipo": "topico", "ref": "Art. 69", "filhos": [{"t": "Por coeficientes e índices objetivos do edital; documentação restrita a", "tipo": "classificacao", "d": "I – balanço, DRE e demonstrações dos 2 últimos exercícios; II – certidão negativa de falência.", "ref": "Art. 69, I e II"}, {"t": "Pode exigir declaração de contador sobre os índices", "tipo": "regra", "ref": "Art. 69, § 1º"}, {"t": "Vedado exigir faturamento mínimo anterior e índices de rentabilidade/lucratividade", "tipo": "excecao", "ref": "Art. 69, § 2º"}, {"t": "Admite relação de compromissos assumidos", "tipo": "regra", "ref": "Art. 69, § 3º"}, {"t": "Capital mínimo ou patrimônio líquido mínimo de até 10% do valor estimado", "tipo": "prazo", "d": "Em compras para entrega futura e obras e serviços.", "ref": "Art. 69, § 4º"}, {"t": "Vedados índices não usuais", "tipo": "excecao", "ref": "Art. 69, § 5º"}, {"t": "PJ com menos de 2 anos: último exercício", "tipo": "prazo", "ref": "Art. 69, § 6º"}]}, {"t": "Forma da documentação (art. 70)", "tipo": "topico", "ref": "Art. 70", "filhos": [{"t": "Original, cópia ou meio admitido; substituível por registro cadastral", "tipo": "regra", "ref": "Art. 70, I e II"}, {"t": "Dispensável total/parcialmente", "tipo": "excecao", "d": "Entrega imediata; valores inferiores a 1/4 do limite de dispensa para compras em geral; produtos de P&D até R$ 300.000,00.", "ref": "Art. 70, III"}, {"t": "Estrangeiras que não funcionem no País: documentos equivalentes", "tipo": "regra", "ref": "Art. 70, p.u."}]}]}, {"t": "Encerramento (art. 71)", "tipo": "topico", "ref": "Art. 71", "filhos": [{"t": "Autoridade superior pode", "tipo": "classificacao", "d": "I – devolver para saneamento; II – revogar por conveniência e oportunidade; III – anular de ofício ou por provocação (ilegalidade insanável); IV – adjudicar e homologar.", "ref": "Art. 71, I–IV"}, {"t": "Nulidade: indica atos viciados e invalida dependentes; apura responsabilidade", "tipo": "sancao", "ref": "Art. 71, § 1º"}, {"t": "Revogação: fato superveniente devidamente comprovado", "tipo": "regra", "ref": "Art. 71, § 2º"}, {"t": "Anulação/revogação: prévia manifestação dos interessados", "tipo": "regra", "ref": "Art. 71, § 3º"}, {"t": "Aplica-se à contratação direta e aos procedimentos auxiliares", "tipo": "regra", "ref": "Art. 71, § 4º"}, {"t": "Revogação = mérito + fato superveniente; anulação = ilegalidade insanável", "tipo": "atencao", "ref": "Art. 71, II e III"}]}]}}, {"id": "t2-contratacao-direta", "titulo": "Título II – Cap. VIII: Contratação direta – processo e inexigibilidade (arts. 72–74)", "raiz": {"t": "Contratação direta – processo e inexigibilidade", "tipo": "topico", "ref": "Arts. 72–74", "filhos": [{"t": "Processo de contratação direta (art. 72)", "tipo": "topico", "ref": "Art. 72", "filhos": [{"t": "Compreende inexigibilidade e dispensa", "tipo": "conceito", "ref": "Art. 72, caput"}, {"t": "Instrução obrigatória", "tipo": "classificacao", "d": "I – DFD e, se for o caso, ETP, análise de riscos, TR, projeto básico/executivo; II – estimativa de despesa (art. 23); III – parecer jurídico e técnicos; IV – compatibilidade orçamentária; V – habilitação e qualificação mínima; VI – razão da escolha do contratado; VII – justificativa de preço; VIII – autorização da autoridade competente.", "ref": "Art. 72, I–VIII"}, {"t": "Ato autorizativo ou extrato divulgado em sítio oficial", "tipo": "regra", "ref": "Art. 72, p.u."}, {"t": "Contratação direta indevida com dolo, fraude ou erro grosseiro: contratado e agente respondem solidariamente pelo dano", "tipo": "sancao", "ref": "Art. 73"}]}, {"t": "Inexigibilidade (art. 74) – inviabilidade de competição", "tipo": "topico", "d": "Rol exemplificativo ('em especial').", "ref": "Art. 74", "filhos": [{"t": "I – fornecedor/produtor/representante comercial exclusivo", "tipo": "regra", "ref": "Art. 74, I", "filhos": [{"t": "Prova: atestado ou contrato de exclusividade, declaração do fabricante ou documento idôneo", "tipo": "regra", "d": "Vedada preferência por marca.", "ref": "Art. 74, § 1º"}]}, {"t": "II – profissional do setor artístico, direto ou por empresário exclusivo, consagrado pela crítica ou opinião pública", "tipo": "regra", "ref": "Art. 74, II", "filhos": [{"t": "Empresário exclusivo: exclusividade permanente e contínua (País ou Estado)", "tipo": "conceito", "d": "Afastada representação restrita a evento ou local específico.", "ref": "Art. 74, § 2º"}, {"t": "Divulgação no PNCP deve detalhar cachê, transporte, hospedagem, infraestrutura e logística", "tipo": "regra", "ref": "Art. 94, § 2º"}]}, {"t": "III – serviços técnicos especializados intelectuais com notória especialização", "tipo": "regra", "d": "a) estudos, planejamentos, projetos; b) pareceres, perícias, avaliações; c) assessorias, consultorias, auditorias; d) fiscalização, supervisão, gerenciamento; e) patrocínio ou defesa de causas; f) treinamento; g) restauração de obras de arte; h) controles de qualidade, testes, ensaios etc.", "ref": "Art. 74, III", "filhos": [{"t": "VEDADA inexigibilidade para publicidade e divulgação", "tipo": "excecao", "ref": "Art. 74, III"}, {"t": "Notória especialização: conceito que permita inferir trabalho essencial e reconhecidamente adequado", "tipo": "conceito", "ref": "Art. 74, § 3º"}, {"t": "Vedada subcontratação ou atuação de profissionais distintos dos que justificaram a inexigibilidade", "tipo": "excecao", "ref": "Art. 74, § 4º"}]}, {"t": "IV – objetos que devam ou possam ser contratados por credenciamento", "tipo": "regra", "ref": "Art. 74, IV"}, {"t": "V – aquisição ou locação de imóvel cujas instalações e localização tornem necessária sua escolha", "tipo": "regra", "ref": "Art. 74, V", "filhos": [{"t": "Requisitos", "tipo": "classificacao", "d": "I – avaliação prévia (estado, adaptações, amortização); II – certificação da inexistência de imóveis públicos vagos que atendam; III – justificativa da singularidade e vantagem.", "ref": "Art. 74, § 5º"}]}, {"t": "Inexigibilidade: competição inviável (rol exemplificativo); dispensa: competição viável, mas lei faculta (rol taxativo)", "tipo": "atencao", "d": "O 'em especial' do art. 74 indica rol exemplificativo; o art. 75 enumera hipóteses.", "ref": "Arts. 74 e 75"}]}]}}, {"id": "t2-dispensa", "titulo": "Título II – Cap. VIII, Seção III: Dispensa de licitação (art. 75)", "raiz": {"t": "Dispensa de licitação (licitação dispensável)", "tipo": "topico", "ref": "Art. 75", "filhos": [{"t": "Por valor", "tipo": "topico", "ref": "Art. 75, I e II", "filhos": [{"t": "I – obras e serviços de engenharia ou manutenção de veículos automotores: inferior a R$ 100.000,00", "tipo": "prazo", "d": "Valor nominal do texto; atualizado por decretos (art. 182).", "ref": "Art. 75, I"}, {"t": "II – outros serviços e compras: inferior a R$ 50.000,00", "tipo": "prazo", "d": "Valor nominal do texto; atualizado por decretos (art. 182).", "ref": "Art. 75, II"}, {"t": "Valores atualizados em 2026: I – R$ 130.984,20; II – R$ 65.492,11", "tipo": "atencao", "ext": true, "ref": "Decreto 12.807/2025", "d": "Não constam do PDF. Conferido no Planalto: Decreto 12.807/2025, vigente desde 1º/1/2026 (revogou o Decreto 12.343/2024). Em prova, observe se a questão pede o valor da lei (R$ 100 mil / R$ 50 mil) ou o atualizado."}, {"t": "Aferição dos limites: somatório no exercício pela unidade gestora e por objetos de mesma natureza (mesmo ramo)", "tipo": "regra", "ref": "Art. 75, § 1º"}, {"t": "Exceção ao § 1º: manutenção de veículos próprios até R$ 8.000,00 (inclui peças)", "tipo": "excecao", "ref": "Art. 75, § 7º"}, {"t": "Valores duplicados para consórcio público e agências executivas (autarquia/fundação)", "tipo": "prazo", "ref": "Art. 75, § 2º"}, {"t": "Preferencialmente: aviso em sítio oficial por no mínimo 3 dias úteis para propostas adicionais", "tipo": "prazo", "ref": "Art. 75, § 3º"}, {"t": "Preferencialmente pagas por cartão de pagamento, extrato no PNCP", "tipo": "regra", "ref": "Art. 75, § 4º"}]}, {"t": "III – licitação deserta ou fracassada há menos de 1 ano", "tipo": "regra", "d": "Mantidas todas as condições do edital, quando: a) não surgiram interessados ou propostas válidas; b) propostas com preços manifestamente superiores ao mercado ou incompatíveis com os oficiais.", "ref": "Art. 75, III"}, {"t": "IV – por objeto", "tipo": "classificacao", "ref": "Art. 75, IV", "filhos": [{"t": "a) peças para manutenção de equipamentos, do fornecedor original, durante a garantia técnica", "tipo": "regra", "ref": "Art. 75, IV, a"}, {"t": "b) acordo internacional aprovado pelo CN, condições manifestamente vantajosas", "tipo": "regra", "ref": "Art. 75, IV, b"}, {"t": "c) produtos para pesquisa e desenvolvimento; obras e serviços de engenharia limitados a R$ 300.000,00", "tipo": "prazo", "d": "Para engenharia segue procedimentos especiais regulamentares (§ 5º).", "ref": "Art. 75, IV, c e § 5º"}, {"t": "d) transferência de tecnologia ou licenciamento por ICT pública ou agência de fomento", "tipo": "regra", "ref": "Art. 75, IV, d"}, {"t": "e) hortifrutigranjeiros, pães e perecíveis, no período do processo licitatório, pelo preço do dia", "tipo": "regra", "ref": "Art. 75, IV, e"}, {"t": "f) bens/serviços nacionais de alta complexidade tecnológica E defesa nacional (cumulativos)", "tipo": "regra", "ref": "Art. 75, IV, f"}, {"t": "g) materiais das Forças Armadas (exceto uso pessoal e administrativo) para padronização logística", "tipo": "regra", "d": "Autorização por ato do comandante da força.", "ref": "Art. 75, IV, g"}, {"t": "h) contingentes militares em operações de paz no exterior", "tipo": "regra", "d": "Justificativa de preço e escolha, ratificada pelo comandante.", "ref": "Art. 75, IV, h"}, {"t": "i) abastecimento de efetivos militares em estada eventual de curta duração", "tipo": "regra", "ref": "Art. 75, IV, i"}, {"t": "j) coleta/comercialização de resíduos recicláveis por associações ou cooperativas de catadores de baixa renda", "tipo": "regra", "ref": "Art. 75, IV, j"}, {"t": "k) aquisição ou restauração de obras de arte e objetos históricos de autenticidade certificada", "tipo": "regra", "ref": "Art. 75, IV, k"}, {"t": "l) rastreamento e obtenção de provas (Lei 12.850/2013, art. 3º, II e V) com sigilo", "tipo": "regra", "ref": "Art. 75, IV, l"}, {"t": "m) medicamentos exclusivamente para doenças raras definidas pelo Ministério da Saúde", "tipo": "regra", "ref": "Art. 75, IV, m"}]}, {"t": "Demais hipóteses", "tipo": "classificacao", "ref": "Art. 75, V–XVIII", "filhos": [{"t": "V – inovação (arts. 3º, 3º-A, 4º, 5º e 20 da Lei 10.973/2004)", "tipo": "regra", "ref": "Art. 75, V"}, {"t": "VI – comprometimento da segurança nacional (casos do Ministro da Defesa)", "tipo": "regra", "ref": "Art. 75, VI"}, {"t": "VII – guerra, estado de defesa, estado de sítio, intervenção federal ou grave perturbação da ordem", "tipo": "regra", "ref": "Art. 75, VII"}, {"t": "VIII – emergência ou calamidade pública", "tipo": "regra", "d": "Só para bens necessários e parcelas concluídas em no máximo 1 ano da ocorrência; vedadas prorrogação e recontratação da mesma empresa.", "ref": "Art. 75, VIII", "filhos": [{"t": "Prazo máximo de 1 ano contado da ocorrência da emergência/calamidade", "tipo": "prazo", "ref": "Art. 75, VIII"}, {"t": "Emergencial: manter continuidade do serviço público; preços de mercado (art. 23); concluir licitação; apurar responsabilidade de quem deu causa", "tipo": "regra", "ref": "Art. 75, § 6º"}, {"t": "O PDF remete à ADI 6890 neste inciso", "tipo": "atencao", "d": "Não há texto de decisão no PDF.", "ref": "Art. 75, VIII", "filhos": [{"t": "STF (ADI 6890, 2024): vedação de recontratação é constitucional, mas só para a MESMA emergência", "tipo": "atencao", "ext": true, "ref": "ADI 6890", "d": "Interpretação conforme (unânime, sessão virtual encerrada em 6/9/2024, rel. Min. Cristiano Zanin): a vedação incide na recontratação fundada na mesma situação emergencial ou calamitosa que extrapole 1 ano; não impede a empresa de participar da licitação substitutiva nem de ser contratada por outro fundamento, inclusive nova emergência. Fonte secundária (informativos/boletins); confira o acórdão no portal do STF."}]}]}, {"t": "IX – aquisição por PJ de direito público de bens/serviços de órgão ou entidade criada para esse fim, preço de mercado", "tipo": "regra", "ref": "Art. 75, IX"}, {"t": "X – intervenção da União no domínio econômico (regular preços/abastecimento)", "tipo": "regra", "ref": "Art. 75, X"}, {"t": "XI – contrato de programa com ente federativo/entidade (consórcio público ou convênio de cooperação)", "tipo": "regra", "ref": "Art. 75, XI"}, {"t": "XII – transferência de tecnologia de produtos estratégicos para o SUS", "tipo": "regra", "ref": "Art. 75, XII"}, {"t": "XIII – profissionais para comissão de avaliação de técnica, de notória especialização", "tipo": "regra", "ref": "Art. 75, XIII"}, {"t": "XIV – associação de pessoas com deficiência, sem fins lucrativos, serviços prestados exclusivamente por PcD", "tipo": "regra", "d": "Preço compatível com o mercado.", "ref": "Art. 75, XIV"}, {"t": "XV – instituição de ensino, pesquisa, extensão, desenvolvimento institucional, inovação ou recuperação social do preso", "tipo": "regra", "d": "Inquestionável reputação ética e profissional e sem fins lucrativos.", "ref": "Art. 75, XV"}, {"t": "XVI – produtos estratégicos para a saúde fornecidos por produtores públicos via fundação de apoio criada antes da Lei", "tipo": "regra", "d": "Redação dada pela Lei 15.471/2026; preço compatível com o mercado.", "ref": "Art. 75, XVI"}, {"t": "XVII – entidades sem fins lucrativos para cisternas/tecnologias sociais de acesso à água (famílias rurais de baixa renda)", "tipo": "regra", "d": "Incluído pela Lei 14.628/2023.", "ref": "Art. 75, XVII"}, {"t": "XVIII – entidades sem fins lucrativos para o Programa Cozinha Solidária", "tipo": "regra", "d": "Incluído pela Lei 14.628/2023.", "ref": "Art. 75, XVIII"}]}, {"t": "Prazos de contrato ligados à dispensa: até 10 anos nas hipóteses do art. 75, IV, f e g, e V, VI, XII e XVI", "tipo": "prazo", "ref": "Art. 108"}, {"t": "Dispensa por valor admite substituir o instrumento de contrato", "tipo": "regra", "ref": "Art. 95, I"}]}}, {"id": "t2-alienacoes", "titulo": "Título II – Cap. IX: Alienações (arts. 76–77)", "raiz": {"t": "Alienação de bens da Administração", "tipo": "topico", "ref": "Arts. 76–77", "filhos": [{"t": "Requisitos gerais: interesse público justificado e avaliação prévia", "tipo": "regra", "ref": "Art. 76, caput"}, {"t": "Imóveis (art. 76, I)", "tipo": "topico", "ref": "Art. 76, I", "filhos": [{"t": "Autorização legislativa + licitação na modalidade LEILÃO", "tipo": "regra", "d": "Inclusive de autarquias e fundações.", "ref": "Art. 76, I"}, {"t": "Licitação dispensada", "tipo": "classificacao", "d": "a) dação em pagamento; b) doação só para órgão/entidade da Administração (ressalvadas f, g, h); c) permuta (diferença até metade do valor do imóvel ofertado pela União, com torna); d) investidura; e) venda a órgão/entidade da Administração; f) habitação ou regularização fundiária de interesse social; g) imóveis comerciais locais até 250 m² em regularização fundiária; h) terras públicas rurais da União e do Incra (limite da Lei 11.952/2009); i) legitimação de posse (Lei 6.383/1976); j) legitimação fundiária e de posse (Lei 13.465/2017).", "ref": "Art. 76, I, a–j"}, {"t": "Imóveis de procedimento judicial ou dação: dispensa autorização legislativa; exige avaliação e leilão", "tipo": "excecao", "ref": "Art. 76, § 1º"}, {"t": "Imóvel doado a ente público reverte ao doador cessadas as razões; vedada alienação pelo beneficiário", "tipo": "regra", "ref": "Art. 76, § 2º"}, {"t": "Título de propriedade/direito real de uso com dispensa: I – outro órgão/entidade; II – pessoa natural com ocupação rural mansa e pacífica", "tipo": "regra", "ref": "Art. 76, § 3º"}, {"t": "Condicionamentos do § 3º, II (sem autorização legislativa)", "tipo": "classificacao", "d": "I – detenção anterior a 1º/12/2004; II – demais requisitos da regularização fundiária; III – vedada exploração não prevista; IV – extinção automática por utilidade/necessidade pública ou interesse social; V – zona rural apta à agropecuária; VI – limite da Lei 11.952 (vedada dispensa para áreas superiores); VII – acúmulo com a alínea 'i'.", "ref": "Art. 76, § 4º"}, {"t": "Investidura", "tipo": "conceito", "d": "I – venda a proprietário lindeiro de área remanescente inaproveitável, por preço ≥ avaliação e ≤ 50% do valor máximo de dispensa de bens e serviços; II – venda de imóvel residencial em núcleo anexo a usina hidrelétrica, dispensável e não reversível.", "ref": "Art. 76, § 5º"}, {"t": "Doação com encargo: licitada; instrumento com encargos, prazo e cláusula de reversão, sob pena de nulidade", "tipo": "regra", "d": "Dispensada a licitação se interesse público justificado; garantia de financiamento: hipoteca em 2º grau ao doador.", "ref": "Art. 76, §§ 6º e 7º"}]}, {"t": "Móveis (art. 76, II)", "tipo": "topico", "ref": "Art. 76, II", "filhos": [{"t": "Licitação na modalidade LEILÃO (sem autorização legislativa)", "tipo": "regra", "ref": "Art. 76, II"}, {"t": "Licitação dispensada", "tipo": "classificacao", "d": "a) doação para fins de interesse social; b) permuta só entre órgãos/entidades; c) venda de ações (bolsa); d) venda de títulos; e) venda de bens produzidos/comercializados por entidades da Administração; f) venda de materiais sem utilização previsível a outros órgãos.", "ref": "Art. 76, II, a–f"}]}, {"t": "Venda de imóveis: direito de preferência ao licitante que comprove ocupação", "tipo": "regra", "ref": "Art. 77"}, {"t": "Imóveis exigem autorização legislativa; móveis não", "tipo": "atencao", "ref": "Art. 76, I e II"}, {"t": "'Licitação dispensada' (art. 76) ≠ 'dispensável' (art. 75)", "tipo": "atencao", "d": "No art. 76 a própria lei dispensa; no art. 75 a Administração pode dispensar.", "ref": "Arts. 75 e 76"}]}}, {"id": "t2-procedimentos-auxiliares", "titulo": "Título II – Cap. X: Instrumentos/procedimentos auxiliares (arts. 78–88)", "raiz": {"t": "Procedimentos auxiliares", "tipo": "topico", "ref": "Arts. 78–88", "filhos": [{"t": "Rol (art. 78)", "tipo": "classificacao", "d": "I – credenciamento; II – pré-qualificação; III – procedimento de manifestação de interesse (PMI); IV – sistema de registro de preços (SRP); V – registro cadastral.", "ref": "Art. 78", "filhos": [{"t": "Critérios claros e objetivos em regulamento", "tipo": "regra", "ref": "Art. 78, § 1º"}, {"t": "Julgamento da pré-qualificação e do PMI segue o procedimento das licitações", "tipo": "regra", "ref": "Art. 78, § 2º"}]}, {"t": "Credenciamento (art. 79)", "tipo": "topico", "ref": "Art. 79", "filhos": [{"t": "Hipóteses", "tipo": "classificacao", "d": "I – paralela e não excludente (contratações simultâneas padronizadas); II – seleção a critério de terceiros (beneficiário escolhe); III – mercados fluidos (flutuação constante de valor); IV – comércio eletrônico: bens e serviços comuns padronizados no Sistema de Compras Expressas (Sicx) – incluído pela Lei 15.266/2025.", "ref": "Art. 79, I–IV"}, {"t": "Regras (§ 1º)", "tipo": "classificacao", "d": "I – edital de chamamento permanente em sítio oficial; II – no inciso I, critérios objetivos de distribuição da demanda; III – condições padronizadas e, nos incisos I e II, valor da contratação definido; IV – no inciso III, registrar cotações vigentes; V – vedado cometer a terceiros sem autorização; VI – denúncia por qualquer parte nos prazos do edital; VII – no Sicx, regulamento federal sobre admissão, preços, entrega, plataforma, pagamento em até 30 dias e sanções (arts. 155–163).", "ref": "Art. 79, § 1º"}, {"t": "Sicx pagamento: prazo não superior a 30 dias do recebimento", "tipo": "prazo", "ref": "Art. 79, § 1º, VII, e"}, {"t": "Sicx pode ser disponibilizado a estatais e entidades privadas sem fins lucrativos", "tipo": "regra", "ref": "Art. 79, § 2º"}, {"t": "Credenciamento é hipótese de INEXIGIBILIDADE", "tipo": "atencao", "ref": "Art. 74, IV"}]}, {"t": "Pré-qualificação (art. 80)", "tipo": "topico", "ref": "Art. 80", "filhos": [{"t": "Seleciona previamente: I – licitantes com condições de habilitação; II – bens que atendam exigências técnicas/qualidade", "tipo": "conceito", "ref": "Art. 80, I e II"}, {"t": "Aberta a licitantes: dispensa documentos já no registro cadastral; aberta a bens: pode exigir prova de qualidade", "tipo": "regra", "ref": "Art. 80, § 1º"}, {"t": "Permanentemente aberta", "tipo": "regra", "ref": "Art. 80, § 2º"}, {"t": "Edital: informações mínimas do objeto, modalidade, forma da futura licitação e critérios", "tipo": "regra", "ref": "Art. 80, § 3º"}, {"t": "Exame dos documentos em até 10 dias úteis", "tipo": "prazo", "ref": "Art. 80, § 4º"}, {"t": "Bens e serviços pré-qualificados integram o catálogo", "tipo": "regra", "ref": "Art. 80, § 5º"}, {"t": "Por grupos/segmentos; parcial ou total", "tipo": "regra", "ref": "Art. 80, §§ 6º e 7º"}, {"t": "Validade: até 1 ano, atualizável a qualquer tempo, e não superior à validade dos documentos", "tipo": "prazo", "ref": "Art. 80, § 8º"}, {"t": "Divulgação obrigatória; licitação seguinte pode ser restrita aos pré-qualificados", "tipo": "regra", "ref": "Art. 80, §§ 9º e 10"}]}, {"t": "Procedimento de manifestação de interesse – PMI (art. 81)", "tipo": "topico", "ref": "Art. 81", "filhos": [{"t": "Edital de chamamento público para estudos, investigações, levantamentos e projetos de soluções inovadoras", "tipo": "conceito", "ref": "Art. 81, caput"}, {"t": "Vencedor da licitação ressarce os dispêndios", "tipo": "regra", "ref": "Art. 81, § 1º"}, {"t": "O PMI", "tipo": "excecao", "d": "I – não dá preferência; II – não obriga a licitar; III – não gera, por si só, direito a ressarcimento; IV – remunerado só pelo vencedor, vedada cobrança do poder público.", "ref": "Art. 81, § 2º"}, {"t": "Aceitação mediante parecer fundamentado", "tipo": "regra", "ref": "Art. 81, § 3º"}, {"t": "Pode ser restrito a startups (MEI, ME, EPP inovadoras)", "tipo": "regra", "d": "Validação prévia por métricas objetivas.", "ref": "Art. 81, § 4º"}]}, {"t": "Sistema de registro de preços (arts. 82–86)", "tipo": "topico", "ref": "Arts. 82–86", "filhos": [{"t": "Edital dispõe sobre", "tipo": "classificacao", "d": "I – quantidade máxima por item; II – quantidade mínima a cotar; III – preços diferentes (locais, acondicionamento, lote, outros); IV – proposta em quantitativo inferior; V – critério menor preço ou maior desconto sobre tabela; VI – alteração de preços; VII – registro de mais de um fornecedor que aceite o preço do vencedor; VIII – vedação de participar de mais de uma ata com mesmo objeto (salvo quantitativo inferior ao máximo); IX – cancelamento da ata.", "ref": "Art. 82, I–IX"}, {"t": "Menor preço por grupo só se inviável adjudicar por item e demonstrada vantagem", "tipo": "excecao", "d": "Item específico de grupo exige pesquisa de mercado prévia.", "ref": "Art. 82, §§ 1º e 2º"}, {"t": "Registro sem total a adquirir (só unidades) apenas: 1ª licitação sem histórico; alimento perecível; serviço integrado ao fornecimento", "tipo": "excecao", "d": "Obrigatório valor máximo da despesa e vedada participação de outro órgão.", "ref": "Art. 82, §§ 3º e 4º"}, {"t": "Condições do SRP (inclusive obras e engenharia)", "tipo": "classificacao", "d": "I – ampla pesquisa de mercado; II – seleção conforme regulamento; III – rotina de controle; IV – atualização periódica; V – período de validade; VI – inclusão de quem cotar igual ao vencedor e de quem mantiver proposta original.", "ref": "Art. 82, § 5º"}, {"t": "SRP possível em inexigibilidade e dispensa para mais de um órgão", "tipo": "regra", "ref": "Art. 82, § 6º"}, {"t": "Preço registrado obriga o fornecedor, não a Administração", "tipo": "atencao", "d": "Facultada licitação específica motivada.", "ref": "Art. 83"}, {"t": "Vigência da ata: 1 ano, prorrogável por igual período se preço vantajoso", "tipo": "prazo", "ref": "Art. 84"}, {"t": "Contrato da ata: vigência conforme a ata", "tipo": "regra", "ref": "Art. 84, p.u."}, {"t": "Obras/engenharia por SRP: projeto padronizado sem complexidade e necessidade permanente ou frequente", "tipo": "regra", "ref": "Art. 85"}, {"t": "Intenção de registro de preços (IRP)", "tipo": "topico", "ref": "Art. 86", "filhos": [{"t": "Gerenciador divulga IRP por no mínimo 8 dias úteis", "tipo": "prazo", "ref": "Art. 86, caput"}, {"t": "Dispensável se o gerenciador for o único contratante", "tipo": "excecao", "ref": "Art. 86, § 1º"}, {"t": "Adesão ('carona') de não participante", "tipo": "regra", "d": "I – justificativa da vantagem; II – valores compatíveis com o mercado (art. 23); III – consulta e aceitação do gerenciador e do fornecedor.", "ref": "Art. 86, § 2º"}, {"t": "Quem pode aderir", "tipo": "classificacao", "d": "I – órgãos federais, estaduais, distritais e municipais a atas de gerenciador federal, estadual ou distrital; II – órgãos municipais a atas de gerenciador municipal, se o SRP foi formalizado mediante licitação (Lei 14.770/2023).", "ref": "Art. 86, § 3º"}, {"t": "Limite por órgão aderente: 50% dos quantitativos registrados", "tipo": "prazo", "ref": "Art. 86, § 4º"}, {"t": "Limite total das adesões: dobro do quantitativo de cada item", "tipo": "prazo", "ref": "Art. 86, § 5º"}, {"t": "Exceções ao limite do § 5º", "tipo": "excecao", "d": "Transferências voluntárias para programa federal descentralizado (ata federal); compra emergencial de medicamentos e material médico-hospitalar em ata do Ministério da Saúde.", "ref": "Art. 86, §§ 6º e 7º"}, {"t": "Órgãos federais NÃO podem aderir a atas estaduais, distritais ou municipais", "tipo": "excecao", "ref": "Art. 86, § 8º"}]}]}, {"t": "Registro cadastral (arts. 87–88)", "tipo": "topico", "ref": "Arts. 87–88", "filhos": [{"t": "Sistema unificado do PNCP para cadastro de licitantes e de contratados", "tipo": "regra", "d": "Regulamento do Poder Executivo federal (redação Lei 15.266/2025).", "ref": "Art. 87, caput"}, {"t": "Público, aberto, com chamamento público pela internet no mínimo anual", "tipo": "prazo", "ref": "Art. 87, § 1º"}, {"t": "Proibido exigir registro cadastral complementar para acesso ao edital", "tipo": "excecao", "ref": "Art. 87, § 2º"}, {"t": "Licitação restrita a cadastrados admite cadastro no prazo de propostas", "tipo": "regra", "ref": "Art. 87, §§ 3º e 4º"}, {"t": "Inscrito classificado por categorias e grupos; recebe certificado renovável", "tipo": "regra", "ref": "Art. 88, §§ 1º e 2º"}, {"t": "Avaliação de desempenho contratual registrada no cadastro", "tipo": "regra", "d": "Condicionada ao cadastro de atesto de cumprimento de obrigações.", "ref": "Art. 88, §§ 3º e 4º"}, {"t": "Registro pode ser alterado, suspenso ou cancelado", "tipo": "sancao", "ref": "Art. 88, § 5º"}, {"t": "Quem requereu cadastro pode participar; contrato depende do certificado", "tipo": "regra", "ref": "Art. 88, § 6º"}]}]}}, {"id": "t3-formalizacao-garantias-riscos", "titulo": "Título III – Caps. I a III: Formalização, garantias e alocação de riscos (arts. 89–103)", "raiz": {"t": "Formalização, garantias e alocação de riscos", "tipo": "topico", "ref": "Arts. 89–103", "filhos": [{"t": "Formalização dos contratos (Cap. I)", "tipo": "topico", "ref": "Arts. 89–95", "filhos": [{"t": "Regime jurídico do contrato (art. 89)", "tipo": "conceito", "ref": "Art. 89", "filhos": [{"t": "Regido por suas cláusulas e preceitos de direito público", "tipo": "conceito", "d": "Supletivamente: princípios da teoria geral dos contratos e disposições de direito privado.", "ref": "Art. 89, caput"}, {"t": "Conteúdo mínimo de identificação", "tipo": "regra", "d": "Nomes das partes e representantes, finalidade, ato que autorizou a lavratura, nº do processo da licitação ou contratação direta e sujeição às normas da Lei e às cláusulas.", "ref": "Art. 89, § 1º"}, {"t": "Cláusulas claras e precisas, conforme edital e proposta vencedora (ou ato da contratação direta)", "tipo": "regra", "ref": "Art. 89, § 2º"}]}, {"t": "Convocação para assinar (art. 90)", "tipo": "topico", "ref": "Art. 90", "filhos": [{"t": "Convocação no prazo e condições do edital, sob pena de decair o direito à contratação", "tipo": "regra", "d": "Sem prejuízo das sanções previstas na Lei.", "ref": "Art. 90, caput"}, {"t": "Prazo de convocação prorrogável 1 vez, por igual período", "tipo": "prazo", "d": "Solicitação justificada durante o transcurso e motivo aceito pela Administração.", "ref": "Art. 90, § 1º"}, {"t": "Convocado não assina: FACULTADO chamar remanescentes na ordem, nas condições do vencedor", "tipo": "regra", "ref": "Art. 90, § 2º"}, {"t": "Vencida a validade da proposta sem convocação: licitantes liberados", "tipo": "regra", "ref": "Art. 90, § 3º"}, {"t": "Nenhum remanescente aceita: negociação ou contratação nas condições dos remanescentes", "tipo": "regra", "d": "I – negociar na ordem de classificação preço melhor, mesmo acima do preço do adjudicatário; II – frustrada a negociação, adjudicar nas condições ofertadas pelos remanescentes. Observado o valor estimado e sua atualização.", "ref": "Art. 90, § 4º"}, {"t": "Recusa injustificada do adjudicatário = descumprimento total + perda imediata da garantia de proposta", "tipo": "sancao", "ref": "Art. 90, § 5º"}, {"t": "Recusa não penaliza remanescentes chamados para negociação (§ 4º, I)", "tipo": "excecao", "ref": "Art. 90, § 6º"}, {"t": "Remanescente de obra/serviço/fornecimento após rescisão: pode convocar demais classificados", "tipo": "regra", "d": "Mesmos critérios dos §§ 2º e 4º.", "ref": "Art. 90, § 7º"}, {"t": "Nova contratada pode aproveitar saldo empenhado ou em restos a pagar não processados", "tipo": "regra", "d": "Incluídos pela Lei 14.770/2023. Frustradas as providências, o saldo pode ser computado como disponibilidade para nova licitação, se vantajoso e mantido o objeto.", "ref": "Art. 90, §§ 8º e 9º"}]}, {"t": "Forma e publicidade (art. 91)", "tipo": "topico", "ref": "Art. 91", "filhos": [{"t": "Forma escrita; juntados ao processo; divulgados em sítio eletrônico oficial", "tipo": "regra", "ref": "Art. 91, caput"}, {"t": "Sigilo admitido se imprescindível à segurança da sociedade e do Estado (LAI)", "tipo": "excecao", "ref": "Art. 91, § 1º"}, {"t": "Direitos reais sobre imóveis: escritura pública em notas de tabelião", "tipo": "regra", "ref": "Art. 91, § 2º"}, {"t": "Forma eletrônica admitida (regulamento)", "tipo": "regra", "ref": "Art. 91, § 3º"}, {"t": "Antes de formalizar ou prorrogar: regularidade fiscal, Ceis, Cnep e certidões", "tipo": "regra", "d": "Certidões negativas de inidoneidade, de impedimento e de débitos trabalhistas, juntadas ao processo.", "ref": "Art. 91, § 4º"}]}, {"t": "Cláusulas necessárias (art. 92)", "tipo": "topico", "ref": "Art. 92", "filhos": [{"t": "Rol de 19 incisos", "tipo": "classificacao", "d": "I objeto; II vinculação ao edital/proposta ou ato de contratação direta; III legislação aplicável; IV regime de execução/forma de fornecimento; V preço, pagamento, reajuste (data-base e periodicidade) e atualização monetária; VI medição e prazos de liquidação/pagamento; VII prazos de início, conclusão, entrega, observação e recebimento definitivo; VIII crédito orçamentário; IX matriz de risco; X prazo de resposta à repactuação; XI prazo de resposta ao reequilíbrio; XII garantias; XIII prazo de garantia mínima do objeto e assistência técnica; XIV direitos, responsabilidades, penalidades e multas; XV importação e câmbio; XVI manter condições de habilitação; XVII reserva de cargos (PcD, reabilitado, aprendiz); XVIII modelo de gestão; XIX casos de extinção.", "ref": "Art. 92, I–XIX"}, {"t": "Foro da sede da Administração (inclusive contratado no exterior)", "tipo": "regra", "ref": "Art. 92, § 1º", "filhos": [{"t": "Exceções ao foro da sede", "tipo": "excecao", "d": "I – licitação internacional com financiamento de organismo internacional ou agência estrangeira de cooperação; II – empresa estrangeira, equipamentos fabricados e entregues no exterior, com autorização do Chefe do Executivo; III – unidades administrativas sediadas no exterior.", "ref": "Art. 92, § 1º, I–III"}]}, {"t": "Período antecedente à ordem de serviço (pendências, liberação de áreas)", "tipo": "regra", "ref": "Art. 92, § 2º"}, {"t": "Índice de reajuste obrigatório, independentemente do prazo, data-base = data do orçamento estimado", "tipo": "regra", "d": "Pode haver mais de um índice específico ou setorial.", "ref": "Art. 92, § 3º"}, {"t": "Serviços contínuos – interregno mínimo de 1 ano – reajuste × repactuação", "tipo": "classificacao", "ref": "Art. 92, § 4º", "filhos": [{"t": "Reajustamento em sentido estrito: sem dedicação exclusiva/predominância de mão de obra; por índices", "tipo": "conceito", "ref": "Art. 92, § 4º, I"}, {"t": "Repactuação: com dedicação exclusiva ou predominância de mão de obra; demonstração analítica dos custos", "tipo": "conceito", "ref": "Art. 92, § 4º, II"}]}, {"t": "Obras e serviços de engenharia: medição mensal, se compatível", "tipo": "prazo", "ref": "Art. 92, § 5º"}, {"t": "Resposta ao pedido de repactuação: preferencialmente 1 mês", "tipo": "prazo", "d": "Contado da entrega da documentação do art. 135, § 6º.", "ref": "Art. 92, § 6º"}, {"t": "Adimplemento: prestação do serviço, obra, entrega do bem ou evento que gere documento de cobrança", "tipo": "conceito", "d": "Incluído pela Lei 14.770/2023.", "ref": "Art. 92, § 7º"}]}, {"t": "Cessão de direitos patrimoniais (art. 93)", "tipo": "topico", "ref": "Art. 93", "filhos": [{"t": "Projetos e serviços técnicos especializados (inclusive software): autor cede todos os direitos patrimoniais", "tipo": "regra", "d": "Administração pode utilizar e alterar livremente, sem nova autorização do autor.", "ref": "Art. 93, caput"}, {"t": "Obra imaterial tecnológica não privilegiável: inclui dados e documentos da tecnologia", "tipo": "regra", "ref": "Art. 93, § 1º"}, {"t": "Pode deixar de exigir a cessão em P&D científico, tecnológico ou de inovação (Lei 10.973/2004)", "tipo": "excecao", "ref": "Art. 93, § 2º"}, {"t": "Alteração posterior do projeto: autor comunicado e registros promovidos", "tipo": "regra", "ref": "Art. 93, § 3º"}]}, {"t": "Divulgação no PNCP – condição de EFICÁCIA (art. 94)", "tipo": "topico", "ref": "Art. 94", "filhos": [{"t": "Prazos contados da assinatura", "tipo": "prazo", "d": "I – 20 dias úteis (licitação); II – 10 dias úteis (contratação direta).", "ref": "Art. 94, I e II"}, {"t": "Urgência: eficácia desde a assinatura; publicação nos mesmos prazos sob pena de nulidade", "tipo": "excecao", "ref": "Art. 94, § 1º"}, {"t": "Artista por inexigibilidade: identificar cachê, transporte, hospedagem, infraestrutura, logística", "tipo": "regra", "ref": "Art. 94, § 2º"}, {"t": "Obras: quantitativos e preços em até 25 dias úteis da assinatura; executados em até 45 dias úteis da conclusão", "tipo": "prazo", "ref": "Art. 94, § 3º"}, {"t": "§§ 4º e 5º vetados", "tipo": "atencao", "ref": "Art. 94, §§ 4º e 5º"}]}, {"t": "Instrumento de contrato (art. 95)", "tipo": "topico", "ref": "Art. 95", "filhos": [{"t": "Obrigatório, salvo hipóteses em que pode ser substituído", "tipo": "regra", "d": "Substitutos: carta-contrato, nota de empenho, autorização de compra ou ordem de execução de serviço.", "ref": "Art. 95, caput"}, {"t": "Hipóteses de substituição", "tipo": "excecao", "d": "I – dispensa em razão de valor; II – compras com entrega imediata e integral, sem obrigações futuras (inclusive assistência técnica), independentemente do valor.", "ref": "Art. 95, I e II"}, {"t": "Aplica-se o art. 92, no que couber, aos instrumentos substitutos", "tipo": "regra", "ref": "Art. 95, § 1º"}, {"t": "Contrato verbal é nulo, salvo pequenas compras/pronto pagamento até R$ 10.000,00", "tipo": "sancao", "d": "Valor nominal do texto; o PDF remete aos decretos de atualização (até o Decreto 12.807/2025).", "ref": "Art. 95, § 2º"}]}]}, {"t": "Garantias (Cap. II)", "tipo": "topico", "ref": "Arts. 96–102", "filhos": [{"t": "Exigência: a critério da autoridade, em cada caso, com previsão no edital", "tipo": "regra", "ref": "Art. 96, caput"}, {"t": "Modalidades – escolha do CONTRATADO", "tipo": "classificacao", "d": "I – caução em dinheiro ou títulos da dívida pública escriturais; II – seguro-garantia; III – fiança bancária; IV – título de capitalização com pagamento único e resgate total (Lei 14.770/2023).", "ref": "Art. 96, § 1º"}, {"t": "Suspensão por ordem/inadimplemento da Administração: contratado não precisa renovar a garantia", "tipo": "excecao", "ref": "Art. 96, § 2º"}, {"t": "Seguro-garantia: prazo mínimo de 1 mês entre homologação e assinatura para prestá-lo", "tipo": "prazo", "ref": "Art. 96, § 3º"}, {"t": "Seguro-garantia (art. 97)", "tipo": "topico", "ref": "Art. 97", "filhos": [{"t": "Cobre obrigações, multas, prejuízos e indenizações", "tipo": "conceito", "ref": "Art. 97, caput"}, {"t": "Vigência da apólice ≥ prazo do contrato, acompanhando-o por endosso", "tipo": "regra", "ref": "Art. 97, I"}, {"t": "Continua em vigor mesmo sem pagamento do prêmio", "tipo": "regra", "ref": "Art. 97, II"}, {"t": "Contratos contínuos: substituição da apólice na renovação/aniversário, sem período descoberto", "tipo": "regra", "ref": "Art. 97, p.u."}]}, {"t": "Percentuais", "tipo": "prazo", "ref": "Arts. 98 e 99", "filhos": [{"t": "Até 5% do valor inicial; até 10% se justificado (complexidade e riscos)", "tipo": "prazo", "ref": "Art. 98, caput"}, {"t": "Contínuos com vigência > 1 ano: base = valor anual", "tipo": "regra", "ref": "Art. 98, p.u."}, {"t": "Obras/engenharia de grande vulto: seguro-garantia com cláusula de retomada até 30%", "tipo": "prazo", "ref": "Art. 99"}]}, {"t": "Liberação após fiel execução ou extinção por culpa exclusiva da Administração", "tipo": "regra", "d": "Em dinheiro: atualizada monetariamente.", "ref": "Art. 100"}, {"t": "Bens entregues pela Administração (contratado depositário): valor acrescido à garantia", "tipo": "regra", "ref": "Art. 101"}, {"t": "Cláusula de retomada pela seguradora (art. 102)", "tipo": "topico", "ref": "Art. 102", "filhos": [{"t": "Obras/engenharia: seguradora assume e conclui o objeto em caso de inadimplemento", "tipo": "conceito", "ref": "Art. 102, caput"}, {"t": "Seguradora: interveniente anuente; acesso às instalações, acompanhamento, auditoria, esclarecimentos", "tipo": "regra", "ref": "Art. 102, I, a–d"}, {"t": "Empenho em nome da seguradora se demonstrada regularidade fiscal; pode subcontratar", "tipo": "regra", "ref": "Art. 102, II e III"}, {"t": "Conclui o objeto → isenta de pagar a importância segurada; não assume → paga integralmente", "tipo": "regra", "ref": "Art. 102, p.u., I e II"}]}]}, {"t": "Alocação de riscos (Cap. III)", "tipo": "topico", "ref": "Art. 103", "filhos": [{"t": "Contrato PODE prever matriz de alocação de riscos (público, privado ou compartilhado)", "tipo": "conceito", "ref": "Art. 103, caput"}, {"t": "Critérios: natureza do risco, beneficiário e capacidade de gerenciá-lo", "tipo": "regra", "ref": "Art. 103, § 1º"}, {"t": "Riscos seguráveis: preferencialmente ao contratado", "tipo": "regra", "ref": "Art. 103, § 2º"}, {"t": "Alocação quantificada no valor estimado", "tipo": "regra", "ref": "Art. 103, § 3º"}, {"t": "Matriz define o equilíbrio econômico-financeiro inicial", "tipo": "conceito", "ref": "Art. 103, § 4º"}, {"t": "Atendida a matriz: equilíbrio mantido, renúncia aos pleitos sobre riscos assumidos", "tipo": "regra", "ref": "Art. 103, § 5º", "filhos": [{"t": "Exceto: alterações unilaterais (art. 124, I) e tributos diretos por legislação superveniente", "tipo": "excecao", "ref": "Art. 103, § 5º, I e II"}]}, {"t": "Métodos usuais; ministérios/secretarias supervisores podem definir parâmetros", "tipo": "competencia", "ref": "Art. 103, § 6º"}, {"t": "Matriz é obrigatória em alguns casos (art. 22, § 3º – grande vulto, integrada e semi-integrada)", "tipo": "atencao", "ref": "Arts. 22 e 103"}]}]}}, {"id": "t3-prerrogativas-duracao-execucao", "titulo": "Título III – Caps. IV a VI: Prerrogativas, duração e execução (arts. 104–123)", "raiz": {"t": "Prerrogativas, duração e execução dos contratos", "tipo": "topico", "ref": "Arts. 104–123", "filhos": [{"t": "Prerrogativas da Administração (Cap. IV)", "tipo": "topico", "ref": "Art. 104", "filhos": [{"t": "Cláusulas exorbitantes", "tipo": "classificacao", "d": "I – modificar unilateralmente (respeitados direitos do contratado); II – extinguir unilateralmente nos casos da Lei; III – fiscalizar; IV – aplicar sanções; V – ocupar provisoriamente bens e utilizar pessoal/serviços.", "ref": "Art. 104, I–V"}, {"t": "Ocupação provisória: risco a serviços essenciais ou acautelar apuração de faltas (inclusive após extinção)", "tipo": "regra", "ref": "Art. 104, V, a e b"}, {"t": "Cláusulas econômico-financeiras e monetárias: só com prévia concordância do contratado", "tipo": "excecao", "ref": "Art. 104, § 1º"}, {"t": "Modificação unilateral → revisão das cláusulas econômico-financeiras", "tipo": "regra", "ref": "Art. 104, § 2º"}]}, {"t": "Duração dos contratos (Cap. V)", "tipo": "topico", "ref": "Arts. 105–114", "filhos": [{"t": "Duração prevista em edital; créditos orçamentários e PPA se ultrapassar 1 exercício", "tipo": "regra", "ref": "Art. 105, caput"}, {"t": "Restos a pagar de contratos plurianuais não cancelados automaticamente antes do fim da vigência", "tipo": "regra", "d": "Nem os de contratos rescindidos nos casos do art. 90, §§ 8º e 9º (Lei 14.770/2023).", "ref": "Art. 105, p.u."}, {"t": "Serviços e fornecimentos contínuos: até 5 anos", "tipo": "prazo", "ref": "Art. 106", "filhos": [{"t": "Diretrizes", "tipo": "regra", "d": "I – autoridade atesta maior vantagem econômica da plurianualidade; II – atestar créditos e vantagem no início e a cada exercício; III – opção de extinguir sem ônus se faltar crédito ou vantagem.", "ref": "Art. 106, I–III"}, {"t": "Extinção só na data de aniversário e com no mínimo 2 meses", "tipo": "prazo", "ref": "Art. 106, § 1º"}, {"t": "Aplica-se ao aluguel de equipamentos e uso de programas de informática", "tipo": "regra", "ref": "Art. 106, § 2º"}]}, {"t": "Prorrogação sucessiva de contínuos até 10 anos (vigência decenal)", "tipo": "prazo", "d": "Previsão em edital + autoridade atesta condições e preços vantajosos; permitida negociação ou extinção sem ônus.", "ref": "Art. 107"}, {"t": "Até 10 anos: art. 75, IV, f e g; V; VI; XII; XVI", "tipo": "prazo", "ref": "Art. 108"}, {"t": "Prazo indeterminado: Administração usuária de serviço público em monopólio", "tipo": "prazo", "d": "Comprovados créditos orçamentários a cada exercício.", "ref": "Art. 109"}, {"t": "Contrato que gere receita / contrato de eficiência", "tipo": "prazo", "d": "I – até 10 anos sem investimento; II – até 35 anos com investimento (benfeitorias permanentes às expensas do contratado, revertidas ao patrimônio público).", "ref": "Art. 110"}, {"t": "Escopo predefinido: prorrogação AUTOMÁTICA se o objeto não for concluído", "tipo": "regra", "ref": "Art. 111", "filhos": [{"t": "Culpa do contratado: mora + sanções; ou extinção com medidas de continuidade", "tipo": "sancao", "ref": "Art. 111, p.u., I e II"}]}, {"t": "Prazos de lei especial não são afastados", "tipo": "regra", "ref": "Art. 112"}, {"t": "Fornecimento e serviço associado: fornecimento + operação/manutenção (máx. 5 anos do recebimento)", "tipo": "prazo", "d": "Prorrogável na forma do art. 107.", "ref": "Art. 113"}, {"t": "Operação continuada de sistemas estruturantes de TI: até 15 anos", "tipo": "prazo", "ref": "Art. 114"}, {"t": "Memorize: 5 / 10 / 10 / indeterminado / 10-35 / 5 + fornecimento / 15", "tipo": "atencao", "ref": "Arts. 106–114"}]}, {"t": "Execução dos contratos (Cap. VI)", "tipo": "topico", "ref": "Arts. 115–123", "filhos": [{"t": "Execução fiel; cada parte responde por sua inexecução", "tipo": "regra", "ref": "Art. 115, caput"}, {"t": "Proibido retardar imotivadamente, inclusive por posse de novo Chefe do Executivo ou novo titular", "tipo": "excecao", "ref": "Art. 115, § 1º"}, {"t": "Licença/manifestação prévia ambiental antes da divulgação do edital (quando a cargo da Administração)", "tipo": "regra", "d": "Parte vetada promulgada em 10/06/2021. §§ 2º e 3º vetados.", "ref": "Art. 115, § 4º"}, {"t": "Impedimento, paralisação ou suspensão: cronograma prorrogado automaticamente por apostila", "tipo": "regra", "ref": "Art. 115, § 5º"}, {"t": "Obra paralisada por mais de 1 mês: aviso público em sítio oficial e placa no local", "tipo": "prazo", "d": "Com motivo, responsável e data prevista de reinício; textos elaborados pela Administração.", "ref": "Art. 115, §§ 6º e 7º"}, {"t": "Reserva de cargos (PcD, reabilitado, aprendiz) durante toda a execução; comprovar quando solicitado", "tipo": "regra", "ref": "Art. 116"}, {"t": "Fiscalização (art. 117)", "tipo": "topico", "ref": "Art. 117", "filhos": [{"t": "1 ou mais fiscais designados (requisitos do art. 7º) ou substitutos", "tipo": "competencia", "d": "Permitida contratação de terceiros para assisti-los.", "ref": "Art. 117, caput"}, {"t": "Fiscal registra ocorrências e determina regularização", "tipo": "competencia", "ref": "Art. 117, § 1º"}, {"t": "Informa superiores sobre o que ultrapassar sua competência", "tipo": "competencia", "ref": "Art. 117, § 2º"}, {"t": "Auxiliado por assessoramento jurídico e controle interno", "tipo": "competencia", "ref": "Art. 117, § 3º"}, {"t": "Terceiro contratado: responsabilidade civil objetiva, confidencialidade, não exerce atribuição exclusiva de fiscal", "tipo": "regra", "ref": "Art. 117, § 4º, I"}, {"t": "Contratar terceiro não exime o fiscal, nos limites das informações recebidas", "tipo": "atencao", "ref": "Art. 117, § 4º, II"}]}, {"t": "Preposto aceito pela Administração no local da obra/serviço", "tipo": "competencia", "ref": "Art. 118"}, {"t": "Contratado repara/corrige/substitui às suas expensas vícios e defeitos", "tipo": "regra", "ref": "Art. 119"}, {"t": "Responde por danos à Administração ou terceiros; fiscalização não exclui nem reduz", "tipo": "sancao", "ref": "Art. 120"}, {"t": "Encargos trabalhistas, previdenciários, fiscais e comerciais (art. 121)", "tipo": "topico", "ref": "Art. 121", "filhos": [{"t": "Somente o contratado é responsável", "tipo": "regra", "ref": "Art. 121, caput"}, {"t": "Inadimplência não transfere responsabilidade à Administração", "tipo": "regra", "ref": "Art. 121, § 1º"}, {"t": "Exceção – dedicação exclusiva de mão de obra + falha na fiscalização", "tipo": "excecao", "d": "Administração responde SOLIDARIAMENTE pelos previdenciários e SUBSIDIARIAMENTE pelos trabalhistas.", "ref": "Art. 121, § 2º"}, {"t": "Medidas de proteção (dedicação exclusiva)", "tipo": "classificacao", "d": "I – caução, fiança ou seguro-garantia para verbas rescisórias; II – pagamento condicionado à quitação trabalhista; III – conta vinculada; IV – pagamento direto das verbas, deduzido; V – férias, 13º, ausências e rescisórias pagas só no fato gerador.", "ref": "Art. 121, § 3º"}, {"t": "Conta vinculada: valores absolutamente impenhoráveis", "tipo": "regra", "ref": "Art. 121, § 4º"}, {"t": "Previdenciárias: art. 31 da Lei 8.212/1991", "tipo": "regra", "ref": "Art. 121, § 5º"}]}, {"t": "Subcontratação (art. 122)", "tipo": "topico", "ref": "Art. 122", "filhos": [{"t": "Partes até o limite autorizado pela Administração", "tipo": "regra", "ref": "Art. 122, caput"}, {"t": "Comprovar capacidade técnica do subcontratado", "tipo": "regra", "ref": "Art. 122, § 1º"}, {"t": "Regulamento ou edital podem vedar, restringir ou condicionar", "tipo": "regra", "ref": "Art. 122, § 2º"}, {"t": "Vedada com vínculo ou parentesco até 3º grau com dirigente/agentes da licitação, fiscalização ou gestão", "tipo": "excecao", "d": "A proibição deve constar expressamente do edital.", "ref": "Art. 122, § 3º"}]}, {"t": "Dever de decidir solicitações e reclamações (art. 123)", "tipo": "regra", "ref": "Art. 123", "filhos": [{"t": "Salvo requerimentos impertinentes, protelatórios ou sem interesse", "tipo": "excecao", "ref": "Art. 123, caput"}, {"t": "Prazo: 1 mês após a instrução, prorrogável por igual período", "tipo": "prazo", "ref": "Art. 123, p.u."}]}]}]}}, {"id": "t3-alteracao-extincao-recebimento", "titulo": "Título III – Caps. VII a IX: Alteração, extinção e recebimento (arts. 124–140)", "raiz": {"t": "Alteração, extinção e recebimento dos contratos", "tipo": "topico", "ref": "Arts. 124–140", "filhos": [{"t": "Alteração dos contratos e dos preços (Cap. VII)", "tipo": "topico", "ref": "Arts. 124–136", "filhos": [{"t": "Hipóteses de alteração (art. 124)", "tipo": "classificacao", "ref": "Art. 124", "filhos": [{"t": "Unilateral", "tipo": "classificacao", "d": "a) qualitativa – modificação do projeto/especificações; b) quantitativa – acréscimo ou diminuição do objeto, nos limites da Lei.", "ref": "Art. 124, I"}, {"t": "Por acordo", "tipo": "classificacao", "d": "a) substituição da garantia; b) regime de execução ou modo de fornecimento; c) forma de pagamento (vedada antecipação sem contraprestação); d) reequilíbrio por força maior, caso fortuito, fato do príncipe ou fatos imprevisíveis/previsíveis de consequências incalculáveis, respeitada a matriz de risco.", "ref": "Art. 124, II"}, {"t": "Falha de projeto em obras: apuração de responsabilidade do RT e ressarcimento", "tipo": "sancao", "ref": "Art. 124, § 1º"}, {"t": "Atraso em desapropriação, desocupação, servidão ou licenciamento ambiental → reequilíbrio (II, d)", "tipo": "regra", "ref": "Art. 124, § 2º"}]}, {"t": "Limites: 25% acréscimos/supressões; 50% acréscimos em reforma", "tipo": "prazo", "d": "Sobre o valor inicial atualizado; contratado é obrigado a aceitar nas mesmas condições.", "ref": "Art. 125"}, {"t": "Alteração unilateral não pode transfigurar o objeto", "tipo": "excecao", "ref": "Art. 126"}, {"t": "Sem preço unitário: relação proposta/orçamento-base aplicada aos preços referenciais", "tipo": "regra", "ref": "Art. 127"}, {"t": "Obras: aditivos não podem reduzir em favor do contratado o desconto sobre o preço de referência", "tipo": "excecao", "ref": "Art. 128"}, {"t": "Supressão com materiais já no local: pagos pelo custo comprovado e reajustado + indenização", "tipo": "regra", "ref": "Art. 129"}, {"t": "Alteração unilateral que altere encargos: reequilíbrio NO MESMO termo aditivo", "tipo": "regra", "ref": "Art. 130"}, {"t": "Extinção não impede reconhecer desequilíbrio (termo indenizatório)", "tipo": "regra", "ref": "Art. 131", "filhos": [{"t": "Pedido durante a vigência e antes de eventual prorrogação (art. 107)", "tipo": "prazo", "ref": "Art. 131, p.u."}]}, {"t": "Termo aditivo é condição para executar; antecipação justificada → formalizar em até 1 mês", "tipo": "prazo", "ref": "Art. 132"}, {"t": "Integrada/semi-integrada: vedada alteração de valores, salvo", "tipo": "excecao", "d": "I – reequilíbrio por caso fortuito ou força maior; II – alteração de projeto a pedido da Administração (não por erro do contratado), nos limites do art. 125; III – alteração de projeto na semi-integrada (art. 46, § 5º); IV – evento da matriz de riscos a cargo da Administração.", "ref": "Art. 133"}, {"t": "Fato do príncipe tributário/legal: preços alterados para mais ou menos", "tipo": "regra", "ref": "Art. 134"}, {"t": "Repactuação (art. 135)", "tipo": "topico", "ref": "Art. 135", "filhos": [{"t": "Serviços contínuos com dedicação exclusiva ou predominância de mão de obra", "tipo": "conceito", "d": "Data vinculada: I – à apresentação da proposta (custos de mercado); II – ao acordo/convenção/dissídio coletivo (custos de mão de obra).", "ref": "Art. 135, caput"}, {"t": "Administração não se vincula a cláusulas coletivas não trabalhistas, PLR, direitos não previstos em lei", "tipo": "excecao", "d": "Nem às que tratem de obrigações aplicáveis só a contratos com a Administração.", "ref": "Art. 135, §§ 1º e 2º"}, {"t": "Interregno mínimo de 1 ano (da proposta ou da última repactuação)", "tipo": "prazo", "ref": "Art. 135, § 3º"}, {"t": "Pode ser fracionada (mão de obra × insumos; várias categorias)", "tipo": "regra", "ref": "Art. 135, §§ 4º e 5º"}, {"t": "Precedida de solicitação do contratado com planilha ou novo instrumento coletivo", "tipo": "regra", "ref": "Art. 135, § 6º"}]}, {"t": "Apostila (dispensa termo aditivo)", "tipo": "classificacao", "d": "I – reajuste/repactuação previstos no contrato; II – atualizações, compensações ou penalizações financeiras; III – alteração da razão/denominação social; IV – empenho de dotações.", "ref": "Art. 136"}]}, {"t": "Hipóteses de extinção (Cap. VIII)", "tipo": "topico", "ref": "Arts. 137–139", "filhos": [{"t": "Motivos (motivação formal, contraditório e ampla defesa)", "tipo": "classificacao", "d": "I – descumprimento de normas/cláusulas/prazos; II – desatender determinações do fiscal ou superior; III – alteração social que restrinja a capacidade; IV – falência, insolvência, dissolução ou falecimento; V – caso fortuito/força maior; VI – atraso ou impossibilidade de licença ambiental; VII – atraso na liberação de áreas; VIII – interesse público justificado pela autoridade máxima; IX – descumprir reserva de cargos.", "ref": "Art. 137, I–IX"}, {"t": "Regulamento pode especificar procedimentos de verificação", "tipo": "regra", "ref": "Art. 137, § 1º"}, {"t": "Direito do CONTRATADO à extinção", "tipo": "classificacao", "ref": "Art. 137, § 2º", "filhos": [{"t": "I – supressão além do limite do art. 125", "tipo": "regra", "ref": "Art. 137, § 2º, I"}, {"t": "II – suspensão por ordem escrita por mais de 3 meses", "tipo": "prazo", "ref": "Art. 137, § 2º, II"}, {"t": "III – repetidas suspensões totalizando 90 dias úteis", "tipo": "prazo", "ref": "Art. 137, § 2º, III"}, {"t": "IV – atraso de pagamento superior a 2 meses da nota fiscal", "tipo": "prazo", "ref": "Art. 137, § 2º, IV"}, {"t": "V – não liberação de área, local, objeto ou fontes de materiais", "tipo": "regra", "ref": "Art. 137, § 2º, V"}, {"t": "II, III e IV: não cabem em calamidade, grave perturbação, guerra ou se o contratado contribuiu", "tipo": "excecao", "ref": "Art. 137, § 3º, I"}, {"t": "Contratado pode optar por suspender suas obrigações até a normalização (com reequilíbrio)", "tipo": "regra", "ref": "Art. 137, § 3º, II"}]}, {"t": "Emitentes das garantias notificados do processo de apuração", "tipo": "regra", "ref": "Art. 137, § 4º"}, {"t": "Formas de extinção (art. 138)", "tipo": "classificacao", "ref": "Art. 138", "filhos": [{"t": "Unilateral, escrita, pela Administração (não se o descumprimento for dela)", "tipo": "regra", "ref": "Art. 138, I"}, {"t": "Consensual: acordo, conciliação, mediação ou comitê de resolução de disputas (se houver interesse da Administração)", "tipo": "regra", "ref": "Art. 138, II"}, {"t": "Arbitral ou judicial", "tipo": "regra", "ref": "Art. 138, III"}, {"t": "Unilateral e consensual: autorização escrita e fundamentada + termo no processo", "tipo": "regra", "ref": "Art. 138, § 1º"}, {"t": "Culpa exclusiva da Administração: ressarcimento + devolução da garantia, pagamentos devidos e desmobilização", "tipo": "regra", "ref": "Art. 138, § 2º"}]}, {"t": "Consequências da extinção unilateral (art. 139)", "tipo": "sancao", "ref": "Art. 139", "filhos": [{"t": "Medidas", "tipo": "classificacao", "d": "I – assunção imediata do objeto; II – ocupação e uso de local, instalações, equipamentos, material e pessoal; III – execução da garantia (prejuízos, verbas trabalhistas/fundiárias/previdenciárias, multas, exigência de retomada pela seguradora); IV – retenção de créditos até o limite dos prejuízos e multas.", "ref": "Art. 139, I–IV"}, {"t": "I e II a critério da Administração (execução direta ou indireta)", "tipo": "regra", "ref": "Art. 139, § 1º"}, {"t": "Inciso II exige autorização expressa de ministro ou secretário estadual/municipal", "tipo": "competencia", "ref": "Art. 139, § 2º"}]}]}, {"t": "Recebimento do objeto (Cap. IX)", "tipo": "topico", "ref": "Art. 140", "filhos": [{"t": "Obras e serviços", "tipo": "regra", "d": "a) provisório: responsável pela fiscalização, termo detalhado (exigências técnicas); b) definitivo: servidor ou comissão designada, termo detalhado.", "ref": "Art. 140, I"}, {"t": "Compras", "tipo": "regra", "d": "a) provisório: de forma SUMÁRIA pelo fiscal, com verificação posterior; b) definitivo: servidor ou comissão, termo detalhado.", "ref": "Art. 140, II"}, {"t": "Rejeição total ou parcial em desacordo com o contrato", "tipo": "regra", "ref": "Art. 140, § 1º"}, {"t": "Recebimento não exclui responsabilidade civil (solidez/segurança) nem ético-profissional", "tipo": "atencao", "ref": "Art. 140, § 2º"}, {"t": "Prazos e métodos: regulamento ou contrato", "tipo": "regra", "ref": "Art. 140, § 3º"}, {"t": "Ensaios e testes por conta do contratado (salvo disposição contrária)", "tipo": "regra", "ref": "Art. 140, § 4º"}, {"t": "Projeto de obra: projetista/consultor responde objetivamente por falha de projeto", "tipo": "sancao", "ref": "Art. 140, § 5º"}, {"t": "Obra: responsabilidade objetiva pela solidez e segurança por no mínimo 5 anos", "tipo": "prazo", "d": "Edital/contrato podem prever prazo superior.", "ref": "Art. 140, § 6º"}]}]}}, {"id": "t3-pagamentos", "titulo": "Título III – Cap. X: Pagamentos (arts. 141–146)", "raiz": {"t": "Pagamentos (Título III, Cap. X)", "tipo": "topico", "ref": "Arts. 141–146", "filhos": [{"t": "Ordem cronológica por fonte de recursos (art. 141)", "tipo": "topico", "ref": "Art. 141", "filhos": [{"t": "Categorias: I – fornecimento de bens; II – locações; III – serviços; IV – obras", "tipo": "classificacao", "ref": "Art. 141, I–IV"}, {"t": "Alteração da ordem: prévia justificativa + posterior comunicação ao controle interno e TC", "tipo": "regra", "ref": "Art. 141, § 1º", "filhos": [{"t": "Exclusivamente nas situações", "tipo": "excecao", "d": "I – grave perturbação, emergência ou calamidade; II – ME, EPP, agricultor familiar, produtor rural PF, MEI e cooperativa, com risco de descontinuidade; III – serviços de sistemas estruturantes, com risco de descontinuidade; IV – falência, recuperação judicial ou dissolução; V – objeto imprescindível ao patrimônio ou atividades finalísticas, com risco de descontinuidade.", "ref": "Art. 141, § 1º, I–V"}]}, {"t": "Inobservância imotivada: apuração de responsabilidade", "tipo": "sancao", "ref": "Art. 141, § 2º"}, {"t": "Divulgação MENSAL da ordem e justificativas no sítio (acesso à informação)", "tipo": "prazo", "ref": "Art. 141, § 3º"}, {"t": "Pagar fatura com preterição da ordem cronológica é crime (art. 337-H do CP)", "tipo": "atencao", "ref": "Art. 178"}]}, {"t": "Pagamento em conta vinculada ou pela comprovação do fato gerador (previsão expressa)", "tipo": "regra", "d": "Parágrafo único vetado.", "ref": "Art. 142"}, {"t": "Controvérsia sobre dimensão/qualidade/quantidade: parcela incontroversa paga no prazo", "tipo": "regra", "ref": "Art. 143"}, {"t": "Remuneração variável (art. 144)", "tipo": "topico", "r unidade do capital.", "ref": "Art. 147, I–XI"}, {"t": "Paralisação não é de interesse público → continuidade + indenização por perdas e danos", "tipo": "regra", "d": "Sem prejuízo da apuração de responsabilidade e penalidades.", "ref": "Art. 147, p.u."}, {"t": "Declaração de nulidade: efeito RETROATIVO (desconstitui efeitos produzidos)", "tipo": "sancao", "ref": "Art. 148, caput"}, {"t": "Impossível retorno ao estado anterior: indenização por perdas e danos", "tipo": "regra", "ref": "Art. 148, § 1º"}, {"t": "Modulação: eficácia futura por até 6 meses, prorrogável uma única vez", "tipo": "prazo", "ref": "Art. 148, § 2º"}, {"t": "Administração indeniza o executado e prejuízos não imputáveis ao contratado; responsabiliza quem deu causa", "tipo": "regra", "ref": "Art. 149"}, {"t": "Sem caracterização do objeto e indicação de créditos: nulidade e responsabilização", "tipo": "sancao", "ref": "Art. 150"}]}, {"t": "Meios alternativos (Cap. XII)", "tipo": "topico", "ref": "Arts. 151–154", "filhos": [{"t": "Conciliação, mediação, comitê de resolução de disputas e arbitragem", "tipo": "classificacao", "ref": "Art. 151, caput"}, {"t": "Para direitos patrimoniais disponíveis", "tipo": "regra", "d": "Ex.: reequilíbrio econômico-financeiro, inadimplemento contratual, cálculo de indenizações.", "ref": "Art. 151, p.u."}, {"t": "Arbitragem: sempre de DIREITO e PÚBLICA", "tipo": "excecao", "ref": "Art. 152"}, {"t": "Contratos podem ser aditados para adotar os meios alternativos", "tipo": "regra", "ref": "Art. 153"}, {"t": "Escolha de árbitros/comitês: critérios isonômicos, técnicos e transparentes", "tipo": "regra", "ref": "Art. 154"}]}]}}, {"id": "t4-infracoes-sancoes", "titulo": "Título IV – Cap. I: Infrações e sanções administrativas (arts. 155–163)", "raiz": {"t": "Infrações e sanções administrativas", "tipo": "topico", "ref": "Arts. 155–163", "filhos": [{"t": "Infrações (art. 155)", "tipo": "classificacao", "ref": "Art. 155", "filhos": [{"t": "I – inexecução parcial", "tipo": "regra", "ref": "Art. 155, I"}, {"t": "II – inexecução parcial com grave dano; III – inexecução total", "tipo": "regra", "ref": "Art. 155, II e III"}, {"t": "IV – não entregar documentação; V – não manter a proposta; VI – não celebrar o contrato", "tipo": "regra", "d": "V: salvo fato superveniente justificado. VI: quando convocado dentro da validade da proposta.", "ref": "Art. 155, IV–VI"}, {"t": "VII – retardamento injustificado da execução/entrega", "tipo": "regra", "ref": "Art. 155, VII"}, {"t": "VIII – declaração/documentação falsa; IX – fraude na licitação/execução", "tipo": "regra", "ref": "Art. 155, VIII e IX"}, {"t": "X – comportamento inidôneo/fraude; XI – atos ilícitos para frustrar a licitação; XII – ato lesivo (art. 5º da Lei 12.846/2013)", "tipo": "regra", "ref": "Art. 155, X–XII"}]}, {"t": "Sanções (art. 156)", "tipo": "classificacao", "d": "I – advertência; II – multa; III – impedimento de licitar e contratar; IV – declaração de inidoneidade.", "ref": "Art. 156, I–IV"}, {"t": "Dosimetria", "tipo": "regra", "d": "I – natureza e gravidade; II – peculiaridades do caso; III – agravantes/atenuantes; IV – danos; V – programa de integridade.", "ref": "Art. 156, § 1º"}, {"t": "Advertência: EXCLUSIVAMENTE para inexecução parcial (155, I), se não couber sanção mais grave", "tipo": "sancao", "ref": "Art. 156, § 2º"}, {"t": "Multa: 0,5% a 30% do valor do contrato; qualquer infração", "tipo": "prazo", "ref": "Art. 156, § 3º"}, {"t": "Impedimento: incisos II a VII; máximo 3 anos; só no ente federativo que aplicou", "tipo": "sancao", "d": "Abrange Administração direta e indireta do ente sancionador.", "ref": "Art. 156, § 4º"}, {"t": "Inidoneidade: incisos VIII a XII (ou II–VII se mais grave); 3 a 6 anos; todos os entes", "tipo": "sancao", "ref": "Art. 156, § 5º"}, {"t": "Inidoneidade: análise jurídica prévia + competência exclusiva", "tipo": "competencia", "d": "I – Executivo: ministro de Estado, secretário estadual ou municipal; autarquia/fundação: autoridade máxima; dministradores e sócios com poderes, sucessora ou empresa do mesmo ramo coligada/controlada; contraditório, ampla defesa e análise jurídica prévia.", "ref": "Art. 160"}, {"t": "Informar Ceis e Cnep em até 15 dias úteis da aplicação da sanção", "tipo": "prazo", "ref": "Art. 161, caput"}, {"t": "Executivo regulamentará soma de sanções de contratos distintos", "tipo": "regra", "ref": "Art. 161, p.u."}, {"t": "Multa de mora por atraso injustificado; conversível em compensatória + extinção unilateral", "tipo": "sancao", "ref": "Art. 162"}, {"t": "Reabilitação (art. 163)", "tipo": "topico", "ref": "Art. 163", "filhos": [{"t": "Perante a própria autoridade que aplicou a penalidade; requisitos CUMULATIVOS", "tipo": "competencia", "ref": "Art. 163, caput"}, {"t": "Requisitos", "tipo": "classificacao", "d": "I – reparação integral do dano; II – pagamento da multa; III – prazo mínimo: 1 ano (impedimento) ou 3 anos (inidoneidade); IV – condições do ato punitivo; V – análise jurídica prévia conclusiva.", "ref": "Art. 163, I–V"}, {"t": "Infrações VIII e XII: exige programa de integridade", "tipo": "regra", "ref": "Art. 163, p.u."}]}]}}, {"id": "t4-impugnacoes-recursos", "titulo": "Título IV – Cap. II: Impugnações, esclarecimentos e recursos (arts. 164–168)", "raiz": {"t": "Impugnações, pedidos de esclarecimento e recursos", "tipo": "topico", "ref": "Arts. 164–168", "filhos": [{"t": "Impugnação e esclarecimento (art. 164)", "tipo": "topico", "ref": "Art. 164", "filhos": [{"t": "Qualquer pessoa é parte legítima", "tipo": "competencia", "ref": "Art. 164, caput"}, {"t": "Protocolo até 3 dias úteis antes da abertura", "tipo": "prazo", "ref": "Art. 164, caput"}, {"t": "Resposta em sítio oficial em até 3 dias úteis, limitada ao último dia útil antes da abertura", "tipo": "prazo", "ref": "Art. 164, p.u."}]}, {"t": "Recurso e reconsideração (art. 165)", "tipo": "topico", "ref": "Art. 165", "filhos": [{"t": "Recurso: 3 dias úteis da intimação ou lavratura da ata", "tipo": "prazo", "ref": "Art. 165, I", "filhos": [{"t": "Cabimento", "tipo": "classificacao", "d": "a) pré-qualificação ou registro cadastral; b) julgamento das propostas; c) habilitação/inabilitação; d) anulação ou revogação da licitação; e) extinção unilateral do contrato.", "ref": "Art. 165, I, a–e"}]}, {"t": "Pedido de reconsideração: 3 dias úteis, quando não couber recurso hierárquico", "tipo": "prazo", "ref": "Art. 165, II"}, {"t": "Julgamento e habilitação: intenção de recorrer IMEDIATA, sob pena de preclusão; apreciação em fase única", "tipo": "atencao", "d": "Prazo das razões conta da ata de habilitação/inabilitação (ou da ata de julgamento, se houver inversão de fases).", "ref": "Art. 165, § 1º"}, {"t": "Trâmite: autor do ato reconsidera em 3 dias úteis; superior decide em até 10 dias úteis", "tipo": "prazo", "ref": "Art. 165, § 2º"}, {"t": "Acolhimento invalida só atos insuscetíveis de aproveitamento", "tipo": "regra", "ref": "Art. 165, § 3º"}, {"t": "Contrarrazões: mesmo prazo do recurso", "tipo": "prazo", "ref": "Art. 165, § 4º"}, {"t": "Vista dos elementos indispensáveis à defesa", "tipo": "regra", "ref": "Art. 165, § 5º"}]}, {"t": "Recursos contra sanções", "tipo": "topico", "ref": "Arts. 166–167", "filhos": [{"t": "Advertência, multa e impedimento: recurso em 15 dias úteis", "tipo": "prazo", "ref": "Art. 166, caput"}, {"t": "Reconsideração pelo autor em 5 dias úteis; superior decide em até 20 dias úteis", "tipo": "prazo", "ref": "Art. 166, p.u."}, {"t": "Inidoneidade: APENAS pedido de reconsideração em 15 dias úteis, decidido em até 20 dias úteis", "tipo": "atencao", "ref": "Art. 167"}]}, {"t": "Efeito suspensivo do recurso e da reconsideração até a decisão final", "tipo": "regra", "ref": "Art. 168, caput"}, {"t": "Autoridade auxiliada pelo assessoramento jurídico", "tipo": "competencia", "ref": "Art. 168, p.u."}]}}, {"id": "t4-controle", "titulo": "Título IV – Cap. III: Controle das contratações (arts. 169–173)", "raiz": {"t": "Controle das contratações", "tipo": "topico",
