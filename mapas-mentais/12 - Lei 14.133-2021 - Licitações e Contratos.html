]]}], "pegadinhas": [{"texto": "A garantia contratual é ESCOLHIDA pelo contratado entre as modalidades; a Administração apenas decide se exige (e o percentual).", "ref": "Art. 96, caput e § 1º"}, {"texto": "Garantia: até 5% (até 10% justificado); 30% só para seguro-garantia com cláusula de retomada em obras de grande vulto. A garantia de PROPOSTA é de até 1%.", "ref": "Arts. 58, § 1º, 98 e 99"}, {"texto": "Divulgação do contrato no PNCP é condição de EFICÁCIA (não de validade): 20 dias úteis (licitação) e 10 dias úteis (contratação direta).", "ref": "Art. 94"}, {"texto": "Contrato verbal é nulo, salvo pequenas compras ou pronto pagamento de até R$ 10.000,00 (valor nominal) — não R$ 50 mil.", "ref": "Art. 95, § 2º"}, {"texto": "Limite de acréscimo de 50% vale só para ACRÉSCIMOS em reforma de edifício ou equipamento; supressões ficam em 25%.", "ref": "Art. 125"}, {"texto": "Contratos contínuos: até 5 anos, prorrogáveis até 10 — não confundir com os 35 anos (contrato com investimento) e 15 anos (TI estruturante).", "ref": "Arts. 106, 107, 110 e 114"}, {"texto": "Na dedicação exclusiva de mão de obra com falha de fiscalização, a Administração responde SOLIDARIAMENTE pelos encargos previdenciários e SUBSIDIARIAMENTE pelos trabalhistas (não o contrário).", "ref": "Art. 121, § 2º"}, {"texto": "Suspensão por ordem escrita: mais de 3 MESES; repetidas suspensões: 90 DIAS ÚTEIS; atraso de pagamento: mais de 2 MESES.", "ref": "Art. 137, § 2º, II a IV"}, {"texto": "Advertência só cabe para inexecução PARCIAL (art. 155, I) e quando não se justificar sanção mais grave.", "ref": "Art. 156, § 2º"}, {"texto": "Impedimento: prazo MÁXIMO de 3 anos e só no ente que aplicou; inidoneidade: MÍNIMO 3 e MÁXIMO 6 anos em todos os entes.", "ref": "Art. 156, §§ 4º e 5º"}, {"texto": "Multa vai de 0,5% a 30% do valor do contrato e pode ser cumulada com qualquer outra sanção.", "ref": "Art. 156, §§ 3º e 7º"}, {"texto": "Contra a declaração de inidoneidade não cabe recurso, apenas PEDIDO DE RECONSIDERAÇÃO (15 dias úteis).", "ref": "Art. 167"}, {"texto": "Prescrição de 5 anos conta da CIÊNCIA da infração pela Administração (não da prática do fato); a instauração INTERROMPE e o acordo de leniência SUSPENDE.", "ref": "Art. 158, § 4º"}, {"texto": "Reabilitação é requerida perante a PRÓPRIA autoridade que aplicou a penalidade, com prazo mínimo de 1 ano (impedimento) ou 3 anos (inidoneidade).", "ref": "Art. 163"}, {"texto": "Impugnação do edital: até 3 dias úteis ANTES da abertura, por QUALQUER pessoa (não só licitantes).", "ref": "Art. 164"}, {"texto": "Recurso na licitação: 3 dias úteis; o superior decide em 10 dias úteis. Recurso contra sanção: 15 dias úteis; superior decide em 20 dias úteis.", "ref": "Arts. 165 e 166"}, {"texto": "A 2ª linha de defesa é o assessoramento jurídico e o controle interno do PRÓPRIO órgão; a 3ª é o órgão central de controle interno e o tribunal de contas.", "ref": "Art. 169"}, {"texto": "O PNCP é obrigatório para DIVULGAÇÃO, mas a realização das contratações por ele é FACULTATIVA.", "ref": "Art. 174, I e II"}, {"texto": "Arbitragem nos contratos da Lei é sempre de DIREITO (não por equidade) e pública.", "ref": "Art. 152"}, {"texto": "Pagamento antecipado é, em regra, VEDADO; só se admite com sensível economia ou condição indispensável, justificado e previsto no edital.", "ref": "Art. 145"}, {"texto": "Nos crimes do CP, só perturbação de processo licitatório (337-I) e violação de sigilo (337-J) têm DETENÇÃO; os demais são reclusão.", "ref": "Art. 178"}, {"texto": "Prazo de modulação da nulidade: até 6 meses, prorrogável UMA única vez.", "ref": "Art. 148, § 2º"}, {"texto": "Inexigibilidade tem rol exemplificativo; dispensa (art. 75) tem rol taxativo; licitação dispensada (art. 76) é para alienações.", "ref": "Arts. 74, 75 e 76"}, {"texto": "Pregão não se aplica a obras nem a serviços técnicos especializados intelectuais, mas cabe em serviço COMUM de engenharia.", "ref": "Art. 29, p.u."}, {"texto": "Regra das fases: julgamento ANTES da habilitação; a inversão é excepcional, motivada e prevista no edital.", "ref": "Art. 17, § 1º"}], "erros_frequentes": [{"texto": "Achar que convite e tomada de preços ainda existem: o rol do art. 28 é taxativo (pregão, concorrência, concurso, leilão, diálogo competitivo).", "ref": "Art. 28"}, {"texto": "Confundir 'pode ser exigida' garantia (faculdade da autoridade) com escolha da modalidade (direito do contratado).", "ref": "Art. 96"}, {"texto": "Supor que reajuste e repactuação exigem termo aditivo: são registrados por apostila.", "ref": "Art. 136, I"}, {"texto": "Pensar que o pedido de reequilíbrio pode ser feito após a prorrogação: deve ser formulado durante a vigência e antes de eventual prorrogação.", "ref": "Art. 131, p.u."}, {"texto": "Afirmar que a nulidade do contrato é sempre declarada: depende de análise do interesse público (art. 147), podendo-se optar pela continuidade com indenização.", "ref": "Arts. 147 e 148"}, {"texto": "Achar que a fiscalização da Administração reduz a responsabilidade do contratado por danos.", "ref": "Art. 120"}, {"texto": "Confundir comissão de contratação (mín. 3 membros, art. 8º, § 2º) com comissão do processo de responsabilização (2 ou mais servidores estáveis, art. 158).", "ref": "Arts. 8º, § 2º, e 158"}, {"texto": "Atribuir a competência para inidoneidade a qualquer autoridade: é exclusiva de ministro de Estado, secretário estadual/municipal ou autoridade máxima da autarquia/fundação.", "ref": "Art. 156, § 6º"}, {"texto": "Esquecer que o recebimento definitivo de obra não exime o contratado da responsabilidade objetiva por no mínimo 5 anos.", "ref": "Art. 140, § 6º"}, {"texto": "Supor que o contratado pode suspender o contrato por atraso de pagamento em caso de calamidade pública ou guerra.", "ref": "Art. 137, § 3º, I"}], "relacoes": [{"texto": "Constituição Federal, art. 22, XXVII: competência privativa da União para normas gerais de licitação e contratação — base da Lei.", "ext": true}, {"texto": "Lei 13.303/2016 (estatais): fora do âmbito da Lei 14.133, salvo os crimes do CP (arts. 178 e 185)."}, {"texto": "Lei 12.846/2013 (Anticorrupção): ato lesivo do art. 5º é infração (art. 155, XII); apuração conjunta (art. 159); leniência suspende a prescrição (art. 158, § 4º, II)."}, {"texto": "Lei 12.527/2011 (LAI): sigilo de contratos (art. 91, § 1º), acesso irrestrito dos órgãos de controle (art. 169, § 2º) e dados abertos do PNCP (art. 174, § 4º)."}, {"texto": "LC 123/2006: tratamento favorecido a ME/EPP (arts. 42–49) aplicado pelo art. 4º e empate ficto preservado (art. 60, § 2º)."}, {"texto": "Leis 8.987/1995 (concessões) e 11.079/2004 (PPP): passam a admitir concorrência ou diálogo competitivo (arts. 179 e 180) e recebem aplicação subsidiária da Lei (art. 186)."}, {"texto": "Leis 8.666/1993, 10.520/2002 e RDC (arts. 1º–47-A da Lei 12.462/2011): revogadas em 30/12/2023; remissões a elas passam a esta Lei (arts. 189 e 193)."}, {"texto": "Lei 4.320/1964, art. 63: liquidação da despesa comunicada à administração tributária (art. 146)."}, {"texto": "Lei 9.784/1999 (processo administrativo federal) pode ser aplicada subsidiariamente aos processos sancionadores e recursos, conforme entendimento doutrinário.", "ext": true}], "perguntas": [{"p": "Quais são as modalidades de licitação da Lei 14.133?", "r": "Pregão, concorrência, concurso, leilão e diálogo competitivo; vedada a criação de outras ou sua combinação.", "ref": "Art. 28"}, {"p": "Qual a sequência das fases da licitação?", "r": "Preparatória, divulgação do edital, propostas e lances, julgamento, habilitação, recursal e homologação.", "ref": "Art. 17"}, {"p": "Qual o prazo mínimo para propostas na aquisição de bens por menor preço?", "r": "8 dias úteis da divulgação do edital (15 nos demais casos).", "ref": "Art. 55, I"}, {"p": "A inexigibilidade tem rol taxativo?", "r": "Não; o art. 74 traz rol exemplificativo ('em especial') de casos de inviabilidade de competição.", "ref": "Art. 74"}, {"p": "Em quanto tempo o contrato deve ser divulgado no PNCP?", "r": "20 dias úteis (licitação) ou 10 dias úteis (contratação direta) da assinatura, como condição de eficácia.", "ref": "Art. 94"}, {"p": "Quando o instrumento de contrato pode ser substituído?", "r": "Na dispensa por valor e nas compras com entrega imediata e integral sem obrigações futuras, independentemente do valor.", "ref": "Art. 95"}, {"p": "Quais as modalidades de garantia contratual?", "r": "Caução em dinheiro ou títulos da dívida pública, seguro-garantia, fiança bancária e título de capitalização; a escolha é do contratado.", "ref": "Art. 96, § 1º"}, {"p": "Qual o percentual máximo de garantia?", "r": "Até 5% do valor inicial, majorável a 10% justificadamente; até 30% em obras de grande vulto com seguro-garantia e cláusula de retomada.", "ref": "Arts. 98 e 99"}, {"p": "O que ocorre se a seguradora não assumir a execução na cláusula de retomada?", "r": "Paga a integralidade da importância segurada; se concluir o objeto, fica isenta.", "ref": "Art. 102, p.u."}, {"p": "Qual a duração máxima dos contratos de serviços contínuos?", "r": "Até 5 anos, prorrogáveis sucessivamente até a vigência máxima decenal.", "ref": "Arts. 106 e 107"}, {"p": "Qual o prazo de contratos que geram receita com investimento?", "r": "Até 35 anos (sem investimento, até 10 anos).", "ref": "Art. 110"}, {"p": "Qual o prazo para a Administração decidir requerimento do contratado?", "r": "1 mês após a instrução, prorrogável motivadamente por igual período, salvo prazo específico.", "ref": "Art. 123, p.u."}, {"p": "Quais os limites de alteração unilateral quantitativa?", "r": "25% do valor inicial atualizado para acréscimos ou supressões; 50% para acréscimos em reforma de edifício ou equipamento.", "ref": "Art. 125"}, {"p": "Quando a Administração responde por encargos do contratado?", "r": "Só em serviços contínuos com dedicação exclusiva de mão de obra e se comprovada falha na fiscalização: solidária (previdenciários) e subsidiária (trabalhistas).", "ref": "Art. 121, § 2º"}, {"p": "Quais registros podem ser feitos por apostila?", "r": "Reajuste/repactuação previstos, atualizações e compensações financeiras, alteração de razão social e empenho de dotações.", "ref": "Art. 136"}, {"p": "Quando o contratado tem direito à extinção por suspensão?", "r": "Suspensão por ordem escrita por mais de 3 meses ou suspensões repetidas que totalizem 90 dias úteis (não em calamidade, guerra ou grave perturbação).", "ref": "Art. 137, §§ 2º e 3º"}, {"p": "Quem faz o recebimento definitivo?", "r": "Servidor ou comissão designada pela autoridade competente, mediante termo detalhado.", "ref": "Art. 140, I, b, e II, b"}, {"p": "Por quanto tempo o contratado responde pela solidez da obra após o recebimento definitivo?", "r": "No mínimo 5 anos, admitido prazo maior no edital e contrato.", "ref": "Art. 140, § 6º"}, {"p": "Em que categorias se divide a ordem cronológica de pagamentos?", "r": "Fornecimento de bens, locações, prestação de serviços e realização de obras, para cada fonte de recursos.", "ref": "Art. 141"}, {"p": "Por quanto tempo a autoridade pode diferir a eficácia da nulidade?", "r": "Até 6 meses, prorrogável uma única vez, para nova contratação.", "ref": "Art. 148, § 2º"}, {"p": "Quais meios alternativos de solução de controvérsias são previstos?", "r": "Conciliação, mediação, comitê de resolução de disputas e arbitragem (de direito e pública), para direitos patrimoniais disponíveis.", "ref": "Arts. 151 e 152"}, {"p": "Quais as sanções administrativas?", "r": "Advertência, multa, impedimento de licitar e contratar e declaração de inidoneidade.", "ref": "Art. 156"}, {"p": "Qual o alcance e prazo do impedimento de licitar?", "r": "Administração direta e indireta do ente que aplicou, por até 3 anos.", "ref": "Art. 156, § 4º"}, {"p": "Quem conduz o processo para impedimento e inidoneidade?", "r": "Comissão de 2 ou mais servidores estáveis (ou empregados permanentes, preferencialmente com 3 anos de serviço); defesa em 15 dias úteis.", "ref": "Art. 158"}, {"p": "Qual o prazo prescricional das infrações?", "r": "5 anos da ciência pela Administração; interrompido pela instauração do processo; suspenso por leniência ou decisão judicial.", "ref": "Art. 158, § 4º"}, {"p": "Quais os requisitos da reabilitação?", "r": "Reparação integral do dano, pagamento da multa, prazo mínimo (1 ano impedimento/3 anos inidoneidade), condições do ato punitivo e análise jurídica; programa de integridade para os incisos VIII e XII.", "ref": "Art. 163"}, {"p": "Em quanto tempo as sanções devem ser lançadas no Ceis/Cnep?", "r": "Em até 15 dias úteis da aplicação.", "ref": "Art. 161"}, {"p": "Qual o prazo do recurso contra julgamento das propostas?", "r": "3 dias úteis da intimação ou da ata, com manifestação imediata da intenção de recorrer; apreciação em fase única.", "ref": "Art. 165, I, b, e § 1º"}, {"p": "O recurso tem efeito suspensivo?", "r": "Sim; recurso e pedido de reconsideração suspendem o ato até a decisão final.", "ref": "Art. 168"}, {"p": "Quais são as linhas de defesa no controle das contratações?", "r": "1ª: agentes e autoridades da governança; 2ª: assessoramento jurídico e controle interno do órgão; 3ª: órgão central de controle interno e tribunal de contas.", "ref": "Art. 169"}, {"p": "Qual o prazo do tribunal de contas para decidir o mérito após suspender cautelarmente a licitação?", "r": "25 dias úteis do recebimento das informações, prorrogável uma vez; o órgão presta informações em 10 dias úteis.", "ref": "Art. 171, §§ 1º e 2º"}, {"p": "Como é composto o Comitê Gestor do PNCP?", "r": "Presidido por indicado do PR; 3 representantes da União, 2 dos Estados/DF (Consad) e 2 dos Municípios (CNM).", "ref": "Art. 174, § 1º"}, {"p": "Como se atualizam os valores da Lei?", "r": "Pelo Poder Executivo federal, a cada 1º de janeiro, pelo IPCA-E, com divulgação no PNCP.", "ref": "Art. 182"}, {"p": "Qual a pena da contratação direta ilegal?", "r": "Reclusão de 4 a 8 anos e multa (CP, art. 337-E).", "ref": "Art. 178"}, {"p": "Quando foram revogadas as Leis 8.666/93 e 10.520/02?", "r": "Em 30 de dezembro de 2023 (os arts. 89 a 108 da Lei 8.666 na data da publicação).", "ref": "Art. 193"}, {"p": "Qual a regra para contratos assinados antes da vigência da Lei?", "r": "Continuam regidos pela legislação revogada.", "ref": "Art. 190"}], "cobertura": [{"item": "Título I – Cap. I: Âmbito de aplicação (arts. 1º–4º)", "status": "ok", "obs": "Mapa t1-ambito-principios."}, {"item": "Título I – Cap. II: Princípios (art. 5º)", "status": "ok", "obs": "Mapa t1-ambito-principios."}, {"item": "Título I – Cap. III: Definições (art. 6º)", "status": "ok", "obs": "Mapas t1-definicoes-a e t1-definicoes-b."}, {"item": "Título I – Cap. IV: Agentes públicos (arts. 7º–10)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. I: Processo licitatório (arts. 11–17)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. II, Seção I: Instrução do processo / fase preparatória (arts. 18–27)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. II, Seção II: Modalidades (arts. 28–32)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. II, Seção III: Critérios de julgamento (arts. 33–39)", "status": "ok", "obs": "Inclui § 2º do art. 37 (parte vetada promulgada)."}, {"item": "Título II – Cap. II, Seção IV: Disposições setoriais – compras, obras, serviços, locação, internacionais (arts. 40–52)", "status": "ok", "obs": "Inclui art. 44-A (Lei 15.210/2025)."}, {"item": "Título II – Cap. III: Divulgação do edital (arts. 53–54)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. IV: Apresentação de propostas e lances (arts. 55–58)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. V: Julgamento (arts. 59–61)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. VI: Habilitação (arts. 62–70)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. VII: Encerramento da licitação (art. 71)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. VIII, Seções I e II: Contratação direta e inexigibilidade (arts. 72–74)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. VIII, Seção III: Dispensa (art. 75)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. IX: Alienações (arts. 76–77)", "status": "ok", "obs": ""}, {"item": "Título II – Cap. X: Procedimentos auxiliares – Seções I a VI (arts. 78–88)", "status": "ok", "obs": "Credenciamento, pré-qualificação, PMI, SRP e registro cadastral."}, {"item": "Título III – Cap. I: Formalização dos contratos (arts. 89–95)", "status": "ok", "obs": "Art. 94, §§ 4º e 5º vetados."}, {"item": "Título III – Cap. II: Garantias (arts. 96–102)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. III: Alocação de riscos (art. 103)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. IV: Prerrogativas da Administração (art. 104)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. V: Duração dos contratos (arts. 105–114)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. VI: Execução dos contratos (arts. 115–123)", "status": "ok", "obs": "Art. 115, §§ 2º e 3º vetados; § 4º é parte vetada promulgada."}, {"item": "Título III – Cap. VII: Alteração dos contratos e dos preços (arts. 124–136)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. VIII: Hipóteses de extinção (arts. 137–139)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. IX: Recebimento do objeto (art. 140)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. X: Pagamentos (arts. 141–146)", "status": "ok", "obs": "Art. 142, p.u., vetado."}, {"item": "Título III – Cap. XI: Nulidade dos contratos (arts. 147–150)", "status": "ok", "obs": ""}, {"item": "Título III – Cap. XII: Meios alternativos de resolução de controvérsias (arts. 151–154)", "status": "ok", "obs": ""}, {"item": "Título IV – Cap. I: Infrações e sanções administrativas (arts. 155–163)", "status": "ok", "obs": "Art. 159, p.u., vetado."}, {"item": "Título IV – Cap. II: Impugnações, esclarecimentos e recursos (arts. 164–168)", "status": "ok", "obs": ""}, {"item": "Título IV – Cap. III: Controle das contratações (arts. 169–173)", "status": "ok", "obs": "Art. 172 vetado."}, {"item": "Título V – Cap. I: PNCP (arts. 174–176)", "status": "ok", "obs": "Art. 174, § 5º, e redação original do art. 175, § 2º vetados (§ 2º promulgado depois)."}, {"item": "Título V – Cap. II: Alterações legislativas (arts. 177–180)", "status": "ok", "obs": "Crimes do CP (337-E a 337-P) detalhados."}, {"item": "Título V – Cap. III: Disposições transitórias e finais (arts. 181–194)", "status": "ok", "obs": "Art. 188 e art. 184, § 1º, vetados; redações da MP 1.167/2023 com vigência encerrada apenas registradas."}], "nao_verificado": ["Valores monetários estão na redação nominal da lei (o PDF só remete aos decretos de atualização). Os valores de 2026 foram conferidos no Planalto (Decreto 12.807/2025) e incluídos como ext nos nós dos arts. 75 e 182.", "Conferido: o art. 184, § 4º, remete ao § 1º vetado. Pela Mensagem de veto 721/2023 (Planalto), o § 1º tratava da aplicação financeira dos saldos (poupança/fundos de curto prazo), e não do § 2º, I; o § 4º, vetado por arrastamento, consta do texto vigente. Nota ext acrescentada.", "Conferido: o art. 175, § 1º, aparece duas vezes no PDF (original e Lei 15.266/2025); o mapa usa a redação da Lei 15.266/2025 (sistema eletrônico de PJ de direito público ou privado, regulamento do Executivo federal).", "Conferido: art. 191 – vale a redação original (a da MP 1.167/2023 teve vigência encerrada); art. 193, II – vale a redação da LC 198/2023 (revogação em 30/12/2023). O mapa segue isso.", "Art. 75, VIII: o PDF remete à ADI 6890 sem reproduzir a decisão; resumo do julgado (2024) incluído como ext com base em fontes secundárias, sem conferência do acórdão no portal do STF.", "Itens com ext: true (relações com CF, art. 22, XXVII e Lei 9.784/1999) não constam do PDF."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
