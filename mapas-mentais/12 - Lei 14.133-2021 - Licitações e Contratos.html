<title>Lei nº 14.133/2021</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;

  --mark:#fde68a;
}

  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;

  }

  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}
</style>

zo", "ref": "Arts. 96–102"}, {"t": "Alocação de riscos: matriz define o equilíbrio inicial", "tipo": "conceito", "ref": "Art. 103"}, {"t": "Prerrogativas (cláusulas exorbitantes)", "tipo": "competencia", "ref": "Art. 104"}, {"t": "Duração: 5 anos contínuos, prorrogáveis até 10; até 35 anos com investimento; 15 anos TI estruturante", "tipo": "prazo", "ref": "Arts. 105–114"}, {"t": "Execução: fiscal, preposto, encargos, subcontratação, dever de decidir em 1 mês", "tipo": "regra", "ref": "Arts. 115–123"}, {"t": "Alteração: unilateral (25%/50%) e por acordo; reajuste, repactuação, apostila", "tipo": "regra", "ref": "Arts. 124–136"}, {"t": "Extinção: motivos, direito do contratado, formas, consequências", "tipo": "regra", "ref": "Arts. 137–139"}, {"t": "Recebimento provisório e definitivo; garantia de 5 anos em obras", "tipo": "regra", "ref": "Art. 140"}, {"t": "Pagamentos: ordem cronológica; antecipação vedada como regra", "tipo": "regra", "ref": "Arts. 141–146"}, {"t": "Nulidade condicionada ao interesse público; meios alternativos (arbitragem de direito e pública)", "tipo": "sancao", "ref": "Arts. 147–154"}]}, {"t": "Título IV – Das irregularidades", "tipo": "topico", "ref": "Arts. 155–173", "filhos": [{"t": "12 infrações; 4 sanções: advertência, multa (0,5%–30%), impedimento (até 3 anos), inidoneidade (3–6 anos)", "tipo": "sancao", "ref": "Arts. 155–156"}, {"t": "Processo de responsabilização (comissão de 2+ estáveis), prescrição de 5 anos, reabilitação", "tipo": "regra", "ref": "Arts. 157–163"}, {"t": "Impugnação até 3 dias úteis antes; recurso em 3 dias úteis; recursos de sanções em 15 dias úteis", "tipo": "prazo", "ref": "Arts. 164–168"}, {"t": "Controle: três linhas de defesa e controle social; suspensão cautelar pelo TC (25 dias úteis)", "tipo": "competencia", "ref": "Arts. 169–173"}]}, {"t": "Título V – Disposições gerais", "tipo": "topico", "ref": "Arts. 174–194", "filhos": [{"t": "PNCP: divulgação obrigatória, Comitê Gestor, municípios até 20 mil hab. (6 anos e ratificados pelo PR; II – condições peculiares das agências/organismos, desde que: a) exigidas para obter o empréstimo/doação; b) não conflitem com princípios constitucionais; c) indicadas no contrato de empréstimo e com parecer favorável do órgão jurídico do contratante do financiamento antes da celebração; d) vetada.", "ref": "Art. 1º, § 3º"}, {"t": "Documentação ao Senado deve referir as condições contratuais do § 3º", "tipo": "regra", "ref": "Art. 1º, § 4º"}, {"t": "Reservas internacionais: ato normativo próprio do Banco Central", "tipo": "excecao", "d": "Gestão direta e indireta das reservas internacionais (inclusive serviços conexos) – observados os princípios do art. 37, caput, da CF.", "ref": "Art. 1º, § 5º"}]}, {"t": "Objetos a que a Lei se aplica (art. 2º)", "tipo": "classificacao", "ref": "Art. 2º", "filhos": [{"t": "I – alienação e concessão de direito real de uso de bens", "tipo": "regra"}, {"t": "II – compra, inclusive por encomenda", "tipo": "regra"}, {"t": "III – locação", "tipo": "regra"}, {"t": "IV – concessão e permissão de uso de bens públicos", "tipo": "regra"}, {"t": "V – prestação de serviços, inclusive técnico-profissionais especializados", "tipo": "regra"}, {"t": "VI – obras e serviços de arquitetura e engenharia", "tipo": "regra"}, {"t": "VII – contratações de TI e comunicação", "tipo": "regra"}]}, {"t": "Não se subordinam ao regime da Lei (art. 3º)", "tipo": "excecao", "ref": "Art. 3º", "filhos": [{"t": "Operações de crédito (interno/externo) e gestão de dívida pública", "tipo": "excecao", "d": "Incluídas contratação de agente financeiro e concessão de garantia relacionadas.", "ref": "Art. 3º, I"}, {"t": "Contratações sujeitas a normas de legislação própria", "tipo": "excecao", "ref": "Art. 3º, II"}]}, {"t": "ME/EPP – arts. 42 a 49 da LC 123/2006 (art. 4º)", "tipo": "topico", "ref": "Art. 4º", "filhos": [{"t": "Aplicam-se os arts. 42 a 49 da LC 123/2006", "tipo": "regra", "ref": "Art. 4º, caput"}, {"t": "Não se aplicam a item (bens/serviços) ou licitação (obras/serv. engenharia) com valor estimado superior à receita bruta máxima de EPP", "tipo": "excecao", "ref": "Art. 4º, § 1º, I e II"}, {"t": "Benefícios limitados a ME/EPP que, no ano-calendário, não tenham contratos somados acima da receita bruta máxima de EPP", "tipo": "excecao", "d": "O órgão deve exigir declaração de observância desse limite.", "ref": "Art. 4º, § 2º"}, {"t": "Contratos com vigência > 1 ano: considera-se o valor anual", "tipo": "prazo", "ref": "Art. 4º, § 3º"}]}, {"t": "Princípios (art. 5º)", "tipo": "topico", "ref": "Art. 5º", "filhos": [{"t": "Rol de princípios", "tipo": "classificacao", "d": "Legalidade, impessoalidade, moralidade, publicidade, eficiência, interesse público, probidade administrativa, igualdade, planejamento, transparência, eficácia, segregação de funções, motivação, vinculação ao edital, julgamento objetivo, segurança jurídica, razoabilidade, competitividade, proporcionalidade, celeridade, economicidade e desenvolvimento nacional sustentável.", "ref": "Art. 5º"}, {"t": "Aplicam-se também as disposições da LINDB (Decreto-Lei 4.657/1942)", "tipo": "regra", "ref": "Art. 5º"}, {"t": "Princípios frequentes em prova: planejamento, segregação de funções, transparência, eficácia, celeridade, competitividade", "tipo": "atencao", "d": "Todos expressos no art. 5º; o rol é cobrado em questões do tipo 'qual NÃO consta'.", "ref": "Art. 5º"}]}]}}, {"id": "t1-definicoes-a", "titulo": "Título I – Cap. III: Definições (art. 6º, I–XXI) – sujeitos, objetos e serviços", "raiz": {"t": "Definições – sujeitos, objetos e serviços", "tipo": "topico", "ref": "Art. 6º, I–XXI", "filhos": [{"t": "Sujeitos e estrutura", "tipo": "topico", "filhos": [{"t": "Órgão", "tipo": "conceito", "d": "Unidade de atuação integrante da estrutura da Administração Pública.", "ref": "Art. 6º, I"}, {"t": "Entidade", "tipo": "conceito", "d": "Unidade de atuação dotada de personalidade jurídica.", "ref": "Art. 6º, II"}, {"t": "Administração Pública", "tipo": "conceito", "d": "Administração direta e indireta de U, E, DF e M, inclusive entidades de direito privado sob controle do poder público e fundações por ele instituídas ou mantidas.", "ref": "Art. 6º, III"}, {"t": "Administração", "tipo": "conceito", "d": "Órgão ou entidade por meio do qual a Administração Pública atua.", "ref": "Art. 6º, IV"}, {"t": "Agente público", "tipo": "conceito", "d": "Quem, por eleição, nomeação, designação, contratação ou qualquer vínculo, exerce mandato, cargo, emprego ou função em PJ da Administração Pública.", "ref": "Art. 6º, V"}, {"t": "Autoridade", "tipo": "conceito", "d": "Agente público dotado de poder de decisão.", "ref": "Art. 6º, VI"}, {"t": "Contratante", "tipo": "conceito", "d": "Pessoa jurídica integrante da Administração Pública responsável pela contratação.", "ref": "Art. 6º, VII"}, {"t": "Contratado", "tipo": "conceito", "d": "Pessoa física ou jurídica, ou consórcio de PJs, signatária de contrato com a Administração.", "ref": "Art. 6º, VIII"}, {"t": "Licitante", "tipo": "conceito", "d": "PF ou PJ, ou consórcio de PJs, que participa ou manifesta intenção de participar; equipara-se o fornecedor/prestador que, a pedido da Administração, oferece proposta.", "ref": "Art. 6º, IX"}]}, {"t": "Objetos", "tipo": "topico", "filhos": [{"t": "Compra", "tipo": "conceito", "d": "Aquisição remunerada de bens, de uma só vez ou parceladamente.", "ref": "Art. 6º, X", "filhos": [{"t": "Compra imediata: entrega em até 30 dias da ordem de fornecimento", "tipo": "prazo", "ref": "Art. 6º, X"}]}, {"t": "Serviço", "tipo": "conceito", "d": "Atividade(s) destinada(s) a obter utilidade intelectual ou material de interesse da Administração.", "ref": "Art. 6º, XI"}, {"t": "Obra", "tipo": "conceito", "d": "Atividade privativa por lei de arquiteto e engenheiro que implica intervenção no meio ambiente, inovando o espaço físico ou alterando substancialmente bem imóvel.", "ref": "Art. 6º, XII"}, {"t": "Bens e serviços comuns", "tipo": "conceito", "d": "Padrões de desempenho e qualidade objetivamente definidos pelo edital, por especificações usuais de mercado.", "ref": "Art. 6º, XIII"}, {"t": "Bens e serviços especiais", "tipo": "conceito", "d": "Por alta heterogeneidade ou complexidade, não podem ser descritos como comuns; exige justificativa prévia do contratante.", "ref": "Art. 6º, XIV"}]}, {"t": "Espécies de serviços", "tipo": "topico", "filhos": [{"t": "Serviços e fornecimentos contínuos", "tipo": "conceito", "d": "Para manutenção da atividade administrativa, decorrentes de necessidades permanentes ou prolongadas.", "ref": "Art. 6º, XV"}, {"t": "Contínuos com dedicação exclusiva de mão de obra", "tipo": "conceito", "d": "Modelo exige, entre outros: a) empregados à disposição nas dependências do contratante; b) contratado não compartilha recursos humanos e materiais com outros contratos; c) contratante pode fiscalizar distribuição, controle e supervisão dos RH.", "ref": "Art. 6º, XVI"}, {"t": "Não contínuos ou por escopo", "tipo": "conceito", "d": "Serviço específico em período predeterminado, prorrogável justificadamente pelo prazo necessário à conclusão do objeto.", "ref": "Art. 6º, XVII"}, {"t": "Técnicos especializados de natureza predominantemente intelectual", "tipo": "classificacao", "d": "a) estudos técnicos, planejamentos, projetos básicos e executivos; b) pareceres, perícias e avaliações; c) assessorias, consultorias técnicas e auditorias financeiras e tributárias; d) fiscalização, supervisão e gerenciamento de obras e serviços; e) patrocínio ou defesa de causas judiciais e administrativas; f) treinamento e aperfeiçoamento de pessoal; g) restauração de obras de arte e bens de valor histórico; h) controles de qualidade e tecnológico, análises, testes, ensaios, instrumentação e monitoramento de obras e meio ambiente e demais serviços de engenharia do inciso.", "ref": "Art. 6º, XVIII"}, {"t": "Notória especialização", "tipo": "conceito", "d": "Conceito do profissional/empresa, decorrente de desempenho anterior, estudos, experiência, publicações, organização, aparelhamento, equipe técnica etc., que permite inferir que seu trabalho é essencial e reconhecidamente adequado à plena satisfação do objeto.", "ref": "Art. 6º, XIX"}, {"t": "Serviço de engenharia", "tipo": "conceito", "d": "Atividade de interesse da Administração, não enquadrada como obra, privativa por lei de arquiteto, engenheiro ou técnicos especializados.", "ref": "Art. 6º, XXI", "filhos": [{"t": "a) Serviço comum de engenharia", "tipo": "conceito", "d": "Ações objetivamente padronizáveis de manutenção, adequação e adaptação de bens móveis e imóveis, preservando características originais.", "ref": "Art. 6º, XXI, a"}, {"t": "b) Serviço especial de engenharia", "tipo": "conceito", "d": "Alta heterogeneidade ou complexidade; não se enquadra na alínea 'a'.", "ref": "Art. 6º, XXI, b"}, {"t": "Pregão cabe para serviço comum de engenharia", "tipo": "atencao", "d": "Exceção expressa do art. 29, parágrafo único.", "ref": "Art. 29, p.u."}]}]}, {"t": "Estudo técnico preliminar (ETP)", "tipo": "conceito", "d": "Documento da primeira etapa do planejamento: caracteriza o interesse público e a melhor solução e dá base ao anteprojeto, TR ou projeto básico, se concluída a viabilidade.", "ref": "Art. 6º, XX"}]}}, {"id": "t1-definicoes-b", "titulo": "Título I – Cap. III: Definições (art. 6º, XXII–LX) – documentos, regimes, modalidades e preços", "raiz": {"t": "Definições – documentos, regimes, modalidades, procedimentos e preços", "tipo": "topico", "ref": "Art. 6º, XXII–LX", "filhos": [{"t": "Grande vulto: valor estimado acima de R$ 200.000.000,00", "tipo": "prazo", "d": "Valor nominal do texto; o PDF remete a Decretos de atualização (10.922/2021 a 12.807/2025) – art. 182 (IPCA-E).", "ref": "Art. 6º, XXII"}, {"t": "Documentos técnicos", "tipo": "topico", "filhos": [{"t": "Termo de referência (bens e serviços)", "tipo": "classificacao", "d": "a) definição do objeto (natureza, quantitativos, prazo, prorrogação); b) fundamentação (referência ao ETP ou extrato não sigiloso); c) solução como um todo – ciclo de vida; d) requisitos; e) modelo de execução; f) modelo de gestão; g) critérios de medição e pagamento; h) forma e critérios de seleção do fornecedor; i) estimativas do valor (preços unitários referenciais, memórias de cálculo – em documento separado e classificado); j) adequação orçamentária.", "ref": "Art. 6º, XXIII"}, {"t": "Anteprojeto", "tipo": "classificacao", "d": "Peça técnica com subsídios para o projeto básico; mínimo: a) programa de necessidades, demanda, motivação, visão global e nível de serviço; b) solidez, segurança, durabilidade; c) prazo de entrega; d) estética/traçado; e) adequação ao interesse público, economia, facilidade, impacto ambiental e acessibilidade; f) proposta de concepção; g) projetos/estudos anteriores; h) levantamento topográfico e cadastral; i) pareceres de sondagem; j) memorial descritivo.", "ref": "Art. 6º, XXIV"}, {"t": "Projeto básico", "tipo": "conceito", "d": "Elementos necessários e suficientes, com precisão adequada, para definir e dimensionar obra/serviço, com base no ETP; assegura viabilidade técnica e impacto ambiental; permite avaliar custo e definir métodos e prazo.", "ref": "Art. 6º, XXV", "filhos": [{"t": "Elementos a) a f)", "tipo": "classificacao", "d": "a) levantamentos topográficos, sondagens, ensaios, estudos socioambientais; b) soluções técnicas globais e localizadas; c) tipos de serviços, materiais e equipamentos; d) métodos construtivos, instalações provisórias; e) subsídios para plano de licitação e gestão da obra; f) orçamento detalhado do custo global.", "ref": "Art. 6º, XXV, a–f"}, {"t": "Orçamento detalhado obrigatório só nos regimes I, II, III, IV e VII do art. 46", "tipo": "atencao", "d": "Empreitada por preço unitário, preço global, integral, tarefa e fornecimento com serviço associado (não na integrada/semi-integrada).", "ref": "Art. 6º, XXV, f"}]}, {"t": "Projeto executivo", "tipo": "conceito", "d": "Elementos para execução completa da obra, detalhando o projeto básico, conforme normas técnicas.", "ref": "Art. 6º, XXVI"}, {"t": "Matriz de riscos", "tipo": "conceito", "d": "Cláusula contratual que define riscos e responsabilidades e caracteriza o equilíbrio econômico-financeiro inicial.", "ref": "Art. 6º, XXVII", "filhos": [{"t": "Conteúdo mínimo", "tipo": "classificacao", "d": "a) eventos supervenientes que possam impactar o equilíbrio e eventual termo aditivo; b) obrigações de resultado: frações com liberdade de inovação; c) obrigações de meio: frações sem liberdade de inovação (aderência à solução predefinida).", "ref": "Art. 6º, XXVII, a–c"}]}]}, {"t": "Regimes de execução (definições)", "tipo": "classificacao", "ref": "Art. 6º, XXVIII–XXXIV", "filhos": [{"t": "Empreitada por preço unitário", "tipo": "conceito", "d": "Preço certo de unidades determinadas.", "ref": "Art. 6º, XXVIII"}, {"t": "Empreitada por preço global", "tipo": "conceito", "d": "Preço certo e total.", "ref": "Art. 6º, XXIX"}, {"t": "Empreitada integral", "tipo": "conceito", "d": "Empreendimento em sua integralidade, sob inteira responsabilidade do contratado até a entrega em condições de operação.", "ref": "Art. 6º, XXX"}, {"t": "Contratação por tarefa", "tipo": "conceito", "d": "Mão de obra para pequenos trabalhos por preço certo, com ou sem materiais.", "ref": "Art. 6º, XXXI"}, {"t": "Contratação integrada", "tipo": "conceito", "d": "Contratado elabora projetos BÁSICO e EXECUTIVO, executa, fornece, monta, testa e pré-opera.", "ref": "Art. 6º, XXXII"}, {"t": "Contratação semi-integrada", "tipo": "conceito", "d": "Contratado elabora apenas o projeto EXECUTIVO, executa, fornece, monta, testa e pré-opera.", "ref": "Art. 6º, XXXIII"}, {"t": "Fornecimento e prestação de serviço associado", "tipo": "conceito", "d": "Além do fornecimento, contratado responde por operação e/ou manutenção por tempo determinado.", "ref": "Art. 6º, XXXIV"}, {"t": "Integrada = básico + executivo; semi-integrada = só executivo", "tipo": "atencao", "ref": "Art. 6º, XXXII e XXXIII"}]}, {"t": "Âmbito nacional/internacional", "tipo": "topico", "filhos": [{"t": "Licitação internacional", "tipo": "conceito", "d": "Processada no território nacional admitindo estrangeiros com cotação em moeda estrangeira, ou com objeto executado total/parcialmente no exterior.", "ref": "Art. 6º, XXXV"}, {"t": "Serviço nacional", "tipo": "conceito", "d": "Prestado em território nacional, nas condições do Poder Executivo federal.", "ref": "Art. 6º, XXXVI"}, {"t": "Produto manufaturado nacional", "tipo": "conceito", "d": "Produzido no território nacional conforme processo produtivo básico ou regras de origem do Executivo federal.", "ref": "Art. 6º, XXXVII"}]}, {"t": "Modalidades (definições)", "tipo": "classificacao", "ref": "Art. 6º, XXXVIII–XLII", "filhos": [{"t": "Concorrência", "tipo": "conceito", "d": "Bens e serviços especiais e obras e serviços comuns e especiais de engenharia. Critérios: menor preço; melhor técnica ou conteúdo artístico; técnica e preço; maior retorno econômico; maior desconto.", "ref": "Art. 6º, XXXVIII"}, {"t": "Concurso", "tipo": "conceito", "d": "Escolha de trabalho técnico, científico ou artístico; critério melhor técnica ou conteúdo artístico; prêmio ou remuneração ao vencedor.", "ref": "Art. 6º, XXXIX"}, {"t": "Leilão", "tipo": "conceito", "d": "Alienação de imóveis ou de móveis inservíveis ou legalmente apreendidos a quem oferecer o maior lance.", "ref": "Art. 6º, XL"}, {"t": "Pregão", "tipo": "conceito", "d": "Obrigatório para bens e serviços comuns; critério menor preço ou maior desconto.", "ref": "Art. 6º, XLI"}, {"t": "Diálogo competitivo", "tipo": "conceito", "d": "Obras, serviços e compras; diálogos com licitantes pré-selecionados por critérios objetivos para desenvolver alternativas; proposta final após encerrar os diálogos.", "ref": "Art. 6º, XLII"}, {"t": "Concorrência NÃO tem 'maior lance'; pregão só menor preço ou maior desconto", "tipo": "atencao", "ref": "Art. 6º, XXXVIII e XLI"}]}, {"t": "Procedimentos e instrumentos", "tipo": "topico", "filhos": [{"t": "Credenciamento", "tipo": "conceito", "d": "Chamamento público para que interessados preencham requisitos e se credenciem para executar o objeto quando convocados.", "ref": "Art. 6º, XLIII"}, {"t": "Pré-qualificação", "tipo": "conceito", "d": "Procedimento seletivo prévio à licitação, por edital, para análise das condições de habilitação (total ou parcial) dos interessados ou do objeto.", "ref": "Art. 6º, XLIV"}, {"t": "Sistema de registro de preços (SRP)", "tipo": "conceito", "d": "Procedimentos para registro formal de preços (serviços, obras, aquisição e locação de bens) para contratações futuras, via contratação direta ou licitação por pregão ou concorrência.", "ref": "Art. 6º, XLV"}, {"t": "Ata de registro de preços", "tipo": "conceito", "d": "Documento vinculativo e obrigacional, compromisso para futura contratação: objeto, preços, fornecedores, órgãos participantes e condições.", "ref": "Art. 6º, XLVI"}, {"t": "Órgão gerenciador / participante / não participante", "tipo": "competencia", "d": "Gerenciador conduz o SRP e gerencia a ata; participante integra os procedimentos iniciais e a ata; não participante não participa dos procedimentos iniciais nem integra a ata.", "ref": "Art. 6º, XLVII–XLIX"}, {"t": "Comissão de contratação", "tipo": "competencia", "d": "Agentes públicos, em caráter permanente ou especial, para receber, examinar e julgar documentos de licitações e procedimentos auxiliares.", "ref": "Art. 6º, L"}, {"t": "Catálogo eletrônico de padronização", "tipo": "conceito", "d": "Sistema informatizado centralizado, com preços, para padronizar itens disponíveis para licitação.", "ref": "Art. 6º, LI"}, {"t": "Sítio eletrônico oficial", "tipo": "conceito", "d": "Sítio certificado digitalmente no qual o ente divulga de forma centralizada informações e serviços de governo digital.", "ref": "Art. 6º, LII"}, {"t": "Contrato de eficiência", "tipo": "conceito", "d": "Prestação de serviços (pode incluir obras e bens) para gerar economia (redução de despesas correntes); remuneração por percentual da economia gerada.", "ref": "Art. 6º, LIII"}, {"t": "Seguro-garantia", "tipo": "conceito", "d": "Garante o fiel cumprimento das obrigações do contratado.", "ref": "Art. 6º, LIV"}, {"t": "Produtos para pesquisa e desenvolvimento", "tipo": "conceito", "d": "Bens, insumos, serviços e obras para pesquisa científica e tecnológica, desenvolvimento ou inovação, discriminados em projeto de pesquisa.", "ref": "Art. 6º, LV"}, {"t": "Agente de contratação", "tipo": "competencia", "d": "Designado pela autoridade competente entre servidores efetivos ou empregados públicos permanentes, para conduzir a licitação até a homologação.", "ref": "Art. 6º, LX"}]}, {"t": "Preços e equilíbrio", "tipo": "topico", "filhos": [{"t": "Sobrepreço", "tipo": "conceito", "d": "Preço orçado ou contratado expressivamente superior aos referenciais de mercado: de 1 item (preços unitários) ou do valor global (tarefa, empreitada global, integral, semi-integrada ou integrada).", "ref": "Art. 6º, LVI"}, {"t": "Superfaturamento", "tipo": "conceito", "d": "Dano ao patrimônio da Administração, p. ex.: a) medição de quantidades superiores; b) deficiência que reduza qualidade, vida útil ou segurança; c) alterações de orçamento que desequilibrem em favor do contratado; d) alterações financeiras (antecipações, distorção de cronograma, prorrogação injustificada, reajuste irregular).", "ref": "Art. 6º, LVII"}, {"t": "Sobrepreço = no orçamento/preço; superfaturamento = dano na execução", "tipo": "atencao", "ref": "Art. 6º, LVI e LVII"}, {"t": "Reajustamento em sentido estrito", "tipo": "conceito", "d": "Aplicação do índice de correção monetária previsto no contrato, retratando variação do custo de produção; admite índices específicos ou setoriais.", "ref": "Art. 6º, LVIII"}, {"t": "Repactuação", "tipo": "conceito", "d": "Para serviços contínuos com dedicação exclusiva ou predominância de mão de obra; análise da variação dos custos; data vinculada à proposta (custos de mercado) e ao acordo/convenção/dissídio coletivo (mão de obra).", "ref": "Art. 6º, LIX"}]}]}}, {"id": "t1-agentes", "titulo": "Título I – Cap. IV: Agentes públicos (arts. 7º–10)", "raiz": {"t": "Agentes públicos", "tipo": "topico", "ref": "Arts. 7º–10", "filhos": [{"t": "Designação e gestão por competências (art. 7º)", "tipo": "topico", "ref": "Art. 7º", "filhos": [{"t": "Autoridade máxima (ou quem as normas indicarem) promove gestão por competências e designa agentes", "tipo": "competencia", "ref": "Art. 7º, caput"}, {"t": "Requisitos dos designados", "tipo": "classificacao", "ref": "Art. 7º, I–III", "filhos": [{"t": "I – preferencialmente servidor efetivo ou empregado público permanente", "tipo": "regra", "ref": "Art. 7º, I"}, {"t": "II – atribuições ligadas a licitações/contratos, ou formação compatível, ou certificação por escola de governo", "tipo": "regra", "ref": "Art. 7º, II"}, {"t": "III – não ser cônjuge/companheiro nem parente até o 3º grau de licitantes ou contratados habituais", "tipo": "excecao", "d": "Nem ter com eles vínculo técnico, comercial, econômico, financeiro, trabalhista e civil.", "ref": "Art. 7º, III"}]}, {"t": "Segregação de funções", "tipo": "regra", "d": "Vedada a designação do mesmo agente para atuação simultânea em funções mais suscetíveis a riscos (reduzir ocultação de erros e fraudes).", "ref": "Art. 7º, § 1º"}, {"t": "Aplica-se também a assessoramento jurídico e controle interno", "tipo": "regra", "ref": "Art. 7º, § 2º"}, {"t": "Art. 7º: 'preferencialmente' efetivo; art. 8º: agente de contratação é OBRIGATORIAMENTE efetivo/empregado permanente", "tipo": "atencao", "ref": "Arts. 7º, I, e 8º"}]}, {"t": "Agente de contratação e comissão (art. 8º)", "tipo": "topico", "ref": "Art. 8º", "filhos": [{"t": "Licitação conduzida por agente de contratação", "tipo": "competencia", "d": "Designado entre servidores efetivos ou empregados públicos permanentes; toma decisões, acompanha o trâmite, impulsiona o procedimento até a homologação.", "ref": "Art. 8º, caput"}, {"t": "Auxiliado por equipe de apoio; responde individualmente", "tipo": "sancao", "d": "Salvo quando induzido a erro pela equipe.", "ref": "Art. 8º, § 1º"}, {"t": "Bens/serviços especiais: pode ser substituído por comissão de contratação (mín. 3 membros)", "tipo": "competencia", "d": "Respondem solidariamente, ressalvado o membro com posição divergente fundamentada e registrada em ata.", "ref": "Art. 8º, § 2º"}, {"t": "Regras de atuação definidas em regulamento", "tipo": "regra", "d": "Inclui agente, equipe de apoio, comissão, fiscais e gestores; prevista possibilidade de apoio do jurídico e do controle interno.", "ref": "Art. 8º, § 3º"}, {"t": "Bens/serviços especiais não rotineiros: contratação por prazo determinado de empresa/profissional para assessorar", "tipo": "regra", "ref": "Art. 8º, § 4º"}, {"t": "No pregão o agente é designado pregoeiro", "tipo": "competencia", "ref": "Art. 8º, § 5º"}]}, {"t": "Vedações ao agente público (art. 9º)", "tipo": "excecao", "ref": "Art. 9º", "filhos": [{"t": "I – admitir/prever situações que", "tipo": "classificacao", "d": "a) comprometam, restrinjam ou frustrem o caráter competitivo (inclusive quanto a cooperativas); b) estabeleçam preferências por naturalidade, sede ou domicílio; c) sejam impertinentes ou irrelevantes ao objeto.", "ref": "Art. 9º, I"}, {"t": "II – tratamento diferenciado entre empresas brasileiras e estrangeiras", "tipo": "excecao", "d": "Comercial, legal, trabalhista, previdenciário etc., inclusive moeda, modalidade e local de pagamento, mesmo com financiamento internacional.", "ref": "Art. 9º, II"}, {"t": "III – resistência injustificada, retardar ou deixar de praticar ato de ofício", "tipo": "excecao", "ref": "Art. 9º, III"}, {"t": "Agente do órgão licitante não pode participar da licitação ou execução", "tipo": "excecao", "d": "Observadas situações de conflito de interesses durante e após o exercício.", "ref": "Art. 9º, § 1º"}, {"t": "Vedações estendem-se a terceiros auxiliares", "tipo": "regra", "d": "Equipe de apoio, profissional especializado, funcionário de assessoria técnica.", "ref": "Art. 9º, § 2º"}]}, {"t": "Defesa pela advocacia pública (art. 10)", "tipo": "topico", "ref": "Art. 10", "filhos": [{"t": "Agente que seguiu parecer jurídico (art. 53, § 1º) pode ser representado pela advocacia pública", "tipo": "regra", "d": "Nas esferas administrativa, controladora ou judicial, a critério do agente.", "ref": "Art. 10, caput"}, {"t": "Não se aplica se houver nos autos provas de atos ilícitos dolosos", "tipo": "excecao", "ref": "Art. 10, § 1º, II"}, {"t": "Vale mesmo se o agente não ocupar mais o cargo", "tipo": "regra", "ref": "Art. 10, § 2º"}]}]}}, {"id": "t2-processo", "titulo": "Título II – Cap. I: Processo licitatório (arts. 11–17)", "raiz": {"t": "Processo licitatório", "tipo": "topico", "ref": "Arts. 11–17", "filhos": [{"t": "Objetivos (art. 11)", "tipo": "classificacao", "ref": "Art. 11", "filhos": [{"t": "I – proposta apta a gerar o resultado mais vantajoso, inclusive ciclo de vida", "tipo": "regra"}, {"t": "II – tratamento isonômico e justa competição", "tipo": "regra"}, {"t": "III – evitar sobrepreço, preços inexequíveis e superfaturamento", "tipo": "regra"}, {"t": "IV – incentivar inovação e desenvolvimento nacional sustentável", "tipo": "regra"}, {"t": "Governança das contratações: responsabilidade da alta administração", "tipo": "competencia", "d": "Implementar processos e estruturas, inclusive gestão de riscos e controles internos; alinhar ao planejamento estratégico e leis orçamentárias.", "ref": "Art. 11, p.u."}]}, {"t": "Regras do processo (art. 12)", "tipo": "topico", "ref": "Art. 12", "filhos": [{"t": "Documentos escritos, datados, com local e assinatura", "tipo": "regra", "ref": "Art. 12, I"}, {"t": "Moeda corrente nacional, salvo art. 52 (internacionais)", "tipo": "regra", "ref": "Art. 12, II"}, {"t": "Formalismo moderado: falhas meramente formais não afastam o licitante", "tipo": "regra", "ref": "Art. 12, III"}, {"t": "Autenticação de cópia perante agente ou declaração de advogado", "tipo": "regra", "ref": "Art. 12, IV"}, {"t": "Reconhecimento de firma só com dúvida de autenticidade, salvo imposição legal", "tipo": "excecao", "ref": "Art. 12, V"}, {"t": "Atos preferencialmente digitais", "tipo": "regra", "ref": "Art. 12, VI"}, {"t": "Plano de contratações anual (PCA)", "tipo": "regra", "d": "Elaborado a partir dos documentos de formalização de demandas; 'poderão' elaborar; deve ser divulgado em sítio oficial e observado pelo ente.", "ref": "Art. 12, VII e § 1º"}, {"t": "Assinatura digital ICP-Brasil permitida", "tipo": "regra", "ref": "Art. 12, § 2º"}]}, {"t": "Publicidade (art. 13)", "tipo": "topico", "ref": "Art. 13", "filhos": [{"t": "Atos são públicos, salvo sigilo imprescindível à segurança da sociedade e do Estado", "tipo": "regra", "ref": "Art. 13, caput"}, {"t": "Publicidade diferida", "tipo": "excecao", "d": "I – conteúdo das propostas até a abertura; II – orçamento da Administração (art. 24).", "ref": "Art. 13, p.u."}]}, {"t": "Impedidos de disputar/participar (art. 14)", "tipo": "excecao", "ref": "Art. 14", "filhos": [{"t": "I – autor do anteprojeto, projeto básico ou executivo (PF ou PJ)", "tipo": "excecao", "ref": "Art. 14, I"}, {"t": "II – empresa responsável pelo projeto, ou da qual o autor seja dirigente, controlador, acionista com mais de 5% do capital votante, RT ou subcontratado", "tipo": "excecao", "ref": "Art. 14, II"}, {"t": "III – quem esteja impossibilitado por sanção", "tipo": "sancao", "d": "Estende-se a quem atue em substituição para burlar a sanção, inclusive controladora, controlada ou coligada, se comprovado.", "ref": "Art. 14, III e § 1º"}, {"t": "IV – vínculo ou parentesco até 3º grau com dirigente ou agente da licitação/fiscalização/gestão", "tipo": "excecao", "d": "A proibição deve constar expressamente do edital.", "ref": "Art. 14, IV"}, {"t": "V – controladoras, controladas ou coligadas concorrendo entre si", "tipo": "excecao", "ref": "Art. 14, V"}, {"t": "VI – condenado nos 5 anos anteriores por trabalho infantil, escravo ou contratação vedada de adolescentes", "tipo": "prazo", "d": "Condenação judicial com trânsito em julgado.", "ref": "Art. 14, VI"}, {"t": "Autor do projeto pode apoiar planejamento/licitação/gestão, sob supervisão exclusiva de agentes públicos", "tipo": "excecao", "ref": "Art. 14, § 2º"}, {"t": "Equiparam-se aos autores as empresas do mesmo grupo econômico", "tipo": "regra", "ref": "Art. 14, § 3º"}, {"t": "Não impede contratação integrada (projeto básico e executivo como encargo) nem projeto executivo nos demais regimes", "tipo": "excecao", "ref": "Art. 14, § 4º"}, {"t": "Financiamento internacional: vedada participação de sancionados por essas entidades ou inidôneos", "tipo": "excecao", "ref": "Art. 14, § 5º"}]}, {"t": "Consórcio (art. 15)", "tipo": "topico", "ref": "Art. 15", "filhos": [{"t": "Permitido, salvo vedação justificada", "tipo": "regra", "ref": "Art. 15, caput"}, {"t": "Normas", "tipo": "classificacao", "d": "I – compromisso de constituição; II – empresa líder; III – somatório de quantitativos (técnica) e de valores (econômico-financeira); IV – consorciada não participa de mais de um consórcio nem isoladamente; V – responsabilidade solidária na licitação e execução.", "ref": "Art. 15, I–V"}, {"t": "Acréscimo de 10% a 30% sobre o valor exigido para habilitação econômico-financeira", "tipo": "prazo", "d": "Salvo justificação; não se aplica a consórcios formados integralmente por ME/EPP.", "ref": "Art. 15, §§ 1º e 2º"}, {"t": "Vencedor constitui e registra o consórcio antes do contrato", "tipo": "regra", "ref": "Art. 15, § 3º"}, {"t": "Edital pode limitar número de consorciadas (justificativa técnica)", "tipo": "regra", "ref": "Art. 15, § 4º"}, {"t": "Substituição de consorciado: autorização expressa e mesmos quantitativos/valores", "tipo": "regra", "ref": "Art. 15, § 5º"}]}, {"t": "Cooperativas (art. 16)", "tipo": "topico", "ref": "Art. 16", "filhos": [{"t": "Podem participar quando", "tipo": "classificacao", "d": "I – observarem Leis 5.764/71, 12.690/12 e LC 130/09; II – demonstrativo de atuação cooperada com repartição de receitas e despesas; III – qualquer cooperado com igual qualificação puder executar (vedado indicar pessoas nominalmente); IV – cooperativas da Lei 12.690: serviços especializados do objeto social, de forma complementar.", "ref": "Art. 16, I–IV"}]}, {"t": "Fases da licitação (art. 17)", "tipo": "topico", "ref": "Art. 17", "filhos": [{"t": "Sequência", "tipo": "classificacao", "d": "I – preparatória; II – divulgação do edital; III – apresentação de propostas e lances; IV – julgamento; V – habilitação; VI – recursal; VII – homologação.", "ref": "Art. 17, I–VII"}, {"t": "Inversão: habilitação antes de propostas/julgamento", "tipo": "excecao", "d": "Mediante ato motivado com explicitação dos benefícios e previsão expressa no edital.", "ref": "Art. 17, § 1º"}, {"t": "Forma preferencialmente eletrônica", "tipo": "regra", "d": "Presencial admitida se motivada; sessão registrada em ata e gravada em áudio e vídeo (gravação juntada aos autos).", "ref": "Art. 17, §§ 2º e 5º"}, {"t": "Amostras, exame de conformidade e prova de conceito do provisoriamente vencedor", "tipo": "regra", "d": "Desde que previsto no edital, na fase de julgamento.", "ref": "Art. 17, § 3º"}, {"t": "Pode exigir atos em formato eletrônico como condição de validade", "tipo": "regra", "ref": "Art. 17, § 4º"}, {"t": "Certificação por organização acreditada pelo Inmetro", "tipo": "regra", "d": "Para aceitar estudos/projetos, conclusão de fases ou objetos, e material/corpo técnico para habilitação.", "ref": "Art. 17, § 6º"}, {"t": "Regra: julgamento ANTES da habilitação (inverso da Lei 8.666)", "tipo": "atencao", "ref": "Art. 17"}]}]}}, {"id": "t2-fase-preparatoria", "titulo": "Título II – Cap. II, Seção I: Fase preparatória (arts. 18–27)", "raiz": {"t": "Fase preparatória – instrução do processo", "tipo": "topico", "ref": "Arts. 18–27", "filhos": [{"t": "Planejamento (art. 18)", "tipo": "topico", "ref": "Art. 18", "filhos": [{"t": "Compatível com o PCA e as leis orçamentárias", "tipo": "regra", "ref": "Art. 18, caput"}, {"t": "Conteúdo da fase preparatória", "tipo": "classificacao", "d": "I – necessidade fundamentada em ETP; II – objeto (TR, anteprojeto, projeto básico/executivo); III – condições de execução, pagamento, garantias e recebimento; IV – orçamento estimado; V – edital; VI – minuta de contrato (anexo obrigatório quando necessária); VII – regime de fornecimento/execução; VIII – modalidade, critério, modo de disputa; IX – motivação das condições do edital; X – análise de riscos; XI – motivação sobre o momento de divulgar o orçamento.", "ref": "Art. 18, I–XI"}, {"t": "ETP – 13 elementos", "tipo": "classificacao", "d": "I – necessidade; II – previsão no PCA; III – requisitos; IV – estimativas de quantidades; V – levantamento de mercado; VI – estimativa do valor; VII – solução como um todo; VIII – justificativa do parcelamento ou não; IX – resultados pretendidos; X – providências prévias (capacitação); XI – contratações correlatas; XII – impactos ambientais; XIII – posicionamento conclusivo.", "ref": "Art. 18, § 1º"}, {"t": "Elementos obrigatórios do ETP: I, IV, VI, VIII e XIII", "tipo": "atencao", "d": "Necessidade, quantidades, valor, parcelamento e posicionamento conclusivo; os demais exigem justificativa se ausentes.", "ref": "Art. 18, § 2º"}, {"t": "Obras e serviços comuns de engenharia: especificação só em TR ou projeto básico", "tipo": "excecao", "d": "Se demonstrada inexistência de prejuízo; dispensada elaboração de projetos.", "ref": "Art. 18, § 3º"}]}, {"t": "Órgãos com competência regulamentar (art. 19)", "tipo": "competencia", "ref": "Art. 19", "filhos": [{"t": "Deveres", "tipo": "classificacao", "d": "I – centralização de procedimentos; II – catálogo eletrônico de padronização (pode adotar o federal); III – sistema de acompanhamento de obras com imagem e vídeo; IV – modelos de minutas (pode adotar as federais); V – modelos digitais de obras (gradativo).", "ref": "Art. 19, I–V"}, {"t": "Catálogo usável em licitações de menor preço ou maior desconto", "tipo": "regra", "ref": "Art. 19, § 1º"}, {"t": "Não usar catálogo ou minutas exige justificativa escrita", "tipo": "regra", "ref": "Art. 19, § 2º"}, {"t": "BIM preferencialmente em obras e serviços de engenharia e arquitetura", "tipo": "regra", "ref": "Art. 19, § 3º"}]}, {"t": "Bens de consumo: qualidade comum, vedado luxo (art. 20)", "tipo": "excecao", "ref": "Art. 20", "filhos": [{"t": "Cada Poder define em regulamento limites comum × luxo", "tipo": "competencia", "ref": "Art. 20, § 1º"}, {"t": "Após 180 dias da promulgação, novas compras só com regulamento editado", "tipo": "prazo", "ref": "Art. 20, § 2º"}]}, {"t": "Audiência e consulta pública (art. 21)", "tipo": "topico", "ref": "Art. 21", "filhos": [{"t": "Audiência pública: antecedência mínima de 8 dias úteis", "tipo": "prazo", "d": "Faculdade ('poderá'); presencial ou a distância; com disponibilização prévia de ETP e elementos do edital.", "ref": "Art. 21, caput"}, {"t": "Consulta pública prévia: sugestões no prazo fixado", "tipo": "regra", "ref": "Art. 21, p.u."}]}, {"t": "Matriz de alocação de riscos no edital (art. 22)", "tipo": "topico", "ref": "Art. 22", "filhos": [{"t": "Facultativa em regra; pode considerar taxa de risco no valor estimado", "tipo": "regra", "ref": "Art. 22, caput"}, {"t": "Alocação eficiente e mecanismos de mitigação", "tipo": "regra", "ref": "Art. 22, § 1º"}, {"t": "Contrato reflete a matriz", "tipo": "classificacao", "d": "I – hipóteses de reequilíbrio; II – resolução quando sinistro impedir/majorar excessivamente; III – seguros obrigatórios com custo no preço.", "ref": "Art. 22, § 2º"}, {"t": "OBRIGATÓRIA: grande vulto ou contratação integrada/semi-integrada", "tipo": "atencao", "ref": "Art. 22, § 3º"}, {"t": "Integrada/semi-integrada: riscos da solução de projeto básico escolhida pelo contratado são dele", "tipo": "regra", "ref": "Art. 22, § 4º"}]}, {"t": "Estimativa do valor (art. 23)", "tipo": "topico", "ref": "Art. 23", "filhos": [{"t": "Compatível com valores de mercado, bancos públicos, quantidades, economia de escala e local", "tipo": "regra", "ref": "Art. 23, caput"}, {"t": "Bens e serviços em geral – parâmetros combinados ou não", "tipo": "classificacao", "d": "I – mediana do painel de preços/banco de preços em saúde do PNCP; II – contratações similares em 1 ano anterior; III – mídia especializada, tabelas oficiais, sítios (com data e hora); IV – pesquisa direta com no mínimo 3 fornecedores (orçamentos com até 6 meses antes do edital); V – base nacional de notas fiscais.", "ref": "Art. 23, § 1º"}, {"t": "Obras e serviços de engenharia – ordem obrigatória", "tipo": "classificacao", "d": "Valor + BDI + ES: I – mediana do Sicro (transportes) ou Sinapi (demais); II – mídia/tabelas/sítios; III – contratações similares em 1 ano; IV – notas fiscais.", "ref": "Art. 23, § 2º"}, {"t": "Estados, DF e Municípios sem recursos da União podem usar outros sistemas de custos", "tipo": "excecao", "ref": "Art. 23, § 3º"}, {"t": "Contratação direta sem estimativa: contratado comprova com notas fiscais de até 1 ano ou outro meio idôneo", "tipo": "regra", "ref": "Art. 23, § 4º"}, {"t": "Integrada/semi-integrada: orçamento sintético; metodologia expedita/paramétrica só para frações não detalhadas", "tipo": "regra", "d": "Licitantes devem apresentar no mínimo o mesmo nível de detalhamento.", "ref": "Art. 23, §§ 5º e 6º"}, {"t": "Bens: parâmetros 'combinados ou não'; engenharia: 'na seguinte ordem'", "tipo": "atencao", "ref": "Art. 23, §§ 1º e 2º"}]}, {"t": "Orçamento sigiloso (art. 24)", "tipo": "topico", "ref": "Art. 24", "filhos": [{"t": "Pode ser sigiloso, desde que justificado", "tipo": "regra", "d": "Sem prejuízo de divulgar quantitativos e informações para elaborar propostas.", "ref": "Art. 24, caput"}, {"t": "Sigilo não prevalece para controle interno e externo", "tipo": "excecao", "ref": "Art. 24, I"}, {"t": "Maior desconto: preço estimado ou máximo aceitável consta do edital", "tipo": "excecao", "ref": "Art. 24, p.u."}]}, {"t": "Edital (art. 25)", "tipo": "topico", "ref": "Art. 25", "filhos": [{"t": "Conteúdo: objeto, convocação, julgamento, habilitação, recursos, penalidades, fiscalização, gestão, entrega e pagamento", "tipo": "regra", "ref": "Art. 25, caput"}, {"t": "Minutas padronizadas sempre que o objeto permitir", "tipo": "regra", "ref": "Art. 25, § 1º"}, {"t": "Pode prever mão de obra, materiais e tecnologias locais (se ETP demonstrar ausência de prejuízo)", "tipo": "regra", "ref": "Art. 25, § 2º"}, {"t": "Todos os elementos divulgados no sítio oficial na mesma data, sem registro para acesso", "tipo": "regra", "ref": "Art. 25, § 3º"}, {"t": "Grande vulto: programa de integridade do vencedor em 6 meses da celebração", "tipo": "prazo", "ref": "Art. 25, § 4º"}, {"t": "Pode atribuir ao contratado licenciamento ambiental e desapropriação", "tipo": "regra", "ref": "Art. 25, § 5º"}, {"t": "Licenciamento de obras da Lei: prioridade no Sisnama", "tipo": "regra", "ref": "Art. 25, § 6º"}, {"t": "Índice de reajustamento obrigatório, independentemente do prazo", "tipo": "regra", "d": "Data-base vinculada à do orçamento estimado; admite mais de um índice.", "ref": "Art. 25, § 7º"}, {"t": "Serviços contínuos (interregno mínimo de 1 ano)", "tipo": "classificacao", "d": "I – reajustamento estrito sem dedicação exclusiva/predominância de mão de obra; II – repactuação com dedicação exclusiva/predominância de mão de obra.", "ref": "Art. 25, § 8º"}, {"t": "Percentual mínimo de mão de obra: mulheres vítimas de violência doméstica; egressos do sistema prisional", "tipo": "regra", "d": "Na forma de regulamento.", "ref": "Art. 25, § 9º"}]}, {"t": "Margem de preferência (art. 26)", "tipo": "topico", "ref": "Art. 26", "filhos": [{"t": "Para: I – bens manufaturados e serviços nacionais (normas técnicas brasileiras); II – bens reciclados, recicláveis ou biodegradáveis", "tipo": "classificacao", "ref": "Art. 26, I e II"}, {"t": "Inciso I: definida por decisão fundamentada do Executivo federal", "tipo": "competencia", "ref": "Art. 26, § 1º, I"}, {"t": "Até 10% sobre o preço dos bens/serviços que não se enquadrem", "tipo": "prazo", "ref": "Art. 26, § 1º, II"}, {"t": "Extensível ao Mercosul com reciprocidade em acordo internacional", "tipo": "regra", "ref": "Art. 26, § 1º, III"}, {"t": "Até 20% para resultantes de desenvolvimento e inovação tecnológica no País", "tipo": "prazo", "ref": "Art. 26, § 2º"}, {"t": "Não se aplica se a capacidade de produção nacional for inferior à quantidade/parcelamento", "tipo": "excecao", "ref": "Art. 26, § 5º"}, {"t": "Medidas de compensação comercial, industrial ou tecnológica", "tipo": "regra", "d": "Mediante prévia justificativa da autoridade.", "ref": "Art. 26, § 6º"}, {"t": "TIC estratégica: licitação restrita a tecnologia nacional (PPB – Lei 10.176/2001)", "tipo": "excecao", "ref": "Art. 26, § 7º"}, {"t": "Divulgação anual das empresas favorecidas e volume de recursos", "tipo": "regra", "ref": "Art. 27"}]}]}}, {"id": "t2-modalidades", "titulo": "Título II – Cap. II, Seção II: Modalidades de licitação (arts. 28–32)", "raiz": {"t": "Modalidades de licitação", "tipo": "topico", "ref": "Arts. 28–32", "filhos": [{"t": "Rol taxativo (art. 28)", "tipo": "classificacao", "d": "I – pregão; II – concorrência; III – concurso; IV – leilão; V – diálogo competitivo.", "ref": "Art. 28", "filhos": [{"t": "Pode usar procedimentos auxiliares do art. 78", "tipo": "regra", "ref": "Art. 28, § 1º"}, {"t": "Vedada criação de outras modalidades ou combinação delas", "tipo": "excecao", "ref": "Art. 28, § 2º"}, {"t": "Não existem mais convite e tomada de preços", "tipo": "atencao", "d": "Comparação com a Lei 8.666/93.", "ext": true}]}, {"t": "Pregão e concorrência (art. 29)", "tipo": "topico", "ref": "Art. 29", "filhos": [{"t": "Seguem o rito comum do art. 17", "tipo": "regra", "ref": "Art. 29, caput"}, {"t": "Pregão sempre que o objeto tiver padrões objetivamente definidos por especificações usuais de mercado", "tipo": "regra", "ref": "Art. 29, caput"}, {"t": "Pregão NÃO se aplica a serviços técnicos especializados intelectuais nem a obras e serviços de engenharia", "tipo": "excecao", "d": "Exceto serviço comum de engenharia (art. 6º, XXI, a).", "ref": "Art. 29, p.u."}, {"t": "Pregoeiro conduz o pregão", "tipo": "competencia", "ref": "Art. 8º, § 5º"}]}, {"t": "Concurso (art. 30)", "tipo": "topico", "ref": "Art. 30", "filhos": [{"t": "Edital indica", "tipo": "classificacao", "d": "I – qualificação dos participantes; II – diretrizes e forma de apresentação do trabalho; III – condições e prêmio/remuneração.", "ref": "Art. 30, I–III"}, {"t": "Concurso de projeto: vencedor cede direitos patrimoniais (art. 93) e autoriza execução", "tipo": "regra", "ref": "Art. 30, p.u."}]}, {"t": "Leilão (art. 31)", "tipo": "topico", "ref": "Art. 31", "filhos": [{"t": "Leiloeiro oficial ou servidor designado", "tipo": "competencia", "d": "Regulamento dispõe sobre procedimentos operacionais.", "ref": "Art. 31, caput"}, {"t": "Leiloeiro oficial selecionado por credenciamento ou pregão com maior desconto nas comissões", "tipo": "regra", "d": "Parâmetro máximo: percentuais da lei da profissão.", "ref": "Art. 31, § 1º"}, {"t": "Edital no sítio oficial contém", "tipo": "classificacao", "d": "I – descrição do bem (imóvel: situação, divisas, matrícula); II – valor de avaliação, preço mínimo, pagamento, comissão; III – local de móveis, veículos e semoventes; IV – sítio e período (presencial só por inviabilidade técnica ou desvantagem); V – ônus e gravames.", "ref": "Art. 31, § 2º"}, {"t": "Edital afixado em local de ampla circulação na sede", "tipo": "regra", "ref": "Art. 31, § 3º"}, {"t": "Sem registro cadastral prévio e SEM fase de habilitação", "tipo": "atencao", "d": "Homologado após lances, fase recursal e pagamento pelo vencedor.", "ref": "Art. 31, § 4º"}]}, {"t": "Diálogo competitivo (art. 32)", "tipo": "topico", "ref": "Art. 32", "filhos": [{"t": "Restrito a contratações em que a Administração", "tipo": "classificacao", "ref": "Art. 32, I e II", "filhos": [{"t": "I – objeto com: a) inovação tecnológica ou técnica; b) impossibilidade de satisfazer sem adaptar soluções do mercado; c) impossibilidade de definir especificações com precisão", "tipo": "regra", "ref": "Art. 32, I"}, {"t": "II – necessidade de definir meios e alternativas: a) solução técnica; b) requisitos técnicos; c) estrutura jurídica ou financeira", "tipo": "regra", "ref": "Art. 32, II"}]}, {"t": "Manifestação de interesse: prazo mínimo de 25 dias úteis", "tipo": "prazo", "ref": "Art. 32, § 1º, I"}, {"t": "Pré-seleção por critérios do edital; admitidos todos que preencham os requisitos", "tipo": "regra", "ref": "Art. 32, § 1º, II"}, {"t": "Vedado divulgar informação discriminatória ou revelar soluções sem consentimento", "tipo": "excecao", "ref": "Art. 32, § 1º, III e IV"}, {"t": "Fase de diálogo até identificar solução (decisão fundamentada); reuniões gravadas em áudio e vídeo", "tipo": "regra", "ref": "Art. 32, § 1º, V e VI"}, {"t": "Fases sucessivas podem restringir soluções", "tipo": "regra", "ref": "Art. 32, § 1º, VII"}, {"t": "Fase competitiva: prazo não inferior a 60 dias úteis para propostas", "tipo": "prazo", "ref": "Art. 32, § 1º, VIII"}, {"t": "Esclarecimentos/ajustes sem discriminação; vencedora por critérios divulgados no início da fase competitiva", "tipo": "regra", "ref": "Art. 32, § 1º, IX e X"}, {"t": "Comissão de pelo menos 3 servidores efetivos/empregados permanentes", "tipo": "competencia", "d": "Admitida contratação de profissionais para assessoramento, que assinam termo de confidencialidade.", "ref": "Art. 32, § 1º, XI e § 2º"}, {"t": "Diálogo: 25 dias úteis (interesse) × 60 dias úteis (propostas)", "tipo": "atencao", "ref": "Art. 32, § 1º, I e VIII"}]}]}}, {"id": "t2-criterios", "titulo": "Título II – Cap. II, Seção III: Critérios de julgamento (arts. 33–39)", "raiz": {"t": "Critérios de julgamento", "tipo": "topico", "ref": "Arts. 33–39", "filhos": [{"t": "Rol (art. 33)", "tipo": "classificacao", "d": "I – menor preço; II – maior desconto; III – melhor técnica ou conteúdo artístico; IV – técnica e preço; V – maior lance (leilão); VI – maior retorno econômico.", "ref": "Art. 33"}, {"t": "Menor preço / maior desconto (art. 34)", "tipo": "topico", "ref": "Art. 34", "filhos": [{"t": "Consideram o menor dispêndio, atendidos parâmetros mínimos de qualidade", "tipo": "regra", "d": "Também técnica e preço, quando couber.", "ref": "Art. 34, caput"}, {"t": "Custos indiretos do ciclo de vida podem ser considerados se objetivamente mensuráveis", "tipo": "regra", "d": "Manutenção, utilização, reposição, depreciação e impacto ambiental.", "ref": "Art. 34, § 1º"}, {"t": "Maior desconto: referência no preço global do edital; desconto estende-se aos aditivos", "tipo": "regra", "ref": "Art. 34, § 2º"}]}, {"t": "Melhor técnica ou conteúdo artístico (art. 35)", "tipo": "topico", "ref": "Art. 35", "filhos": [{"t": "Considera exclusivamente propostas técnicas/artísticas; edital define prêmio ou remuneração", "tipo": "regra", "ref": "Art. 35, caput"}, {"t": "Para projetos e trabalhos de natureza técnica, científica ou artística", "tipo": "regra", "ref": "Art. 35, p.u."}]}, {"t": "Técnica e preço (art. 36)", "tipo": "topico", "ref": "Art. 36", "filhos": [{"t": "Maior pontuação pela ponderação das notas de técnica e preço", "tipo": "regra", "ref": "Art. 36, caput"}, {"t": "Escolhido quando o ETP demonstrar relevância da qualidade técnica, para", "tipo": "classificacao", "d": "I – serviços técnicos especializados intelectuais (preferencialmente); II – serviços de tecnologia sofisticada e domínio restrito; III – bens e serviços especiais de TIC; IV – obras e serviços especiais de engenharia; V – objetos com soluções alternativas e variações de execução mensuráveis.", "ref": "Art. 36, § 1º"}, {"t": "Proporção máxima de 70% para a proposta técnica", "tipo": "prazo", "ref": "Art. 36, § 2º"}, {"t": "Desempenho pretérito em contratos públicos deve ser considerado na pontuação técnica", "tipo": "regra", "ref": "Art. 36, § 3º"}]}, {"t": "Como julgar melhor técnica / técnica e preço (art. 37)", "tipo": "topico", "ref": "Art. 37", "filhos": [{"t": "Métodos", "tipo": "classificacao", "d": "I – capacitação e experiência por atestados; II – notas a quesitos qualitativos por banca; III – notas por desempenho em contratações anteriores (art. 88, § 3º, e cadastro do PNCP).", "ref": "Art. 37, I–III"}, {"t": "Banca: no mínimo 3 membros", "tipo": "competencia", "d": "Servidores efetivos/empregados permanentes ou profissionais contratados por conhecimento técnico, supervisionados por designados conforme art. 7º.", "ref": "Art. 37, § 1º"}, {"t": "Serviços técnicos 'a', 'd' e 'h' do art. 6º, XVIII acima de R$ 300.000,00: melhor técnica ou técnica e preço (70% técnica)", "tipo": "prazo", "d": "Ressalvada a inexigibilidade. Parte vetada promulgada; valor sujeito aos decretos de atualização.", "ref": "Art. 37, § 2º"}]}, {"t": "Pontuação por capacitação técnico-profissional exige participação direta e pessoal do profissional", "tipo": "regra", "ref": "Art. 38"}, {"t": "Maior retorno econômico (art. 39)", "tipo": "topico", "ref": "Art. 39", "filhos": [{"t": "Exclusivo para contrato de eficiência", "tipo": "atencao", "d": "Considera a maior economia; remuneração em percentual proporcional à economia efetivamente obtida.", "ref": "Art. 39, caput"}, {"t": "Licitante apresenta", "tipo": "classificacao", "d": "I – proposta de trabalho (obras/serviços/bens com prazos; economia estimada em unidade de medida e monetária); II – proposta de preço (percentual sobre a economia estimada, em unidade monetária).", "ref": "Art. 39, § 1º"}, {"t": "Edital prevê parâmetros objetivos de mensuração da economia", "tipo": "regra", "ref": "Art. 39, § 2º"}, {"t": "Retorno econômico = economia estimada – proposta de preço", "tipo": "conceito", "ref": "Art. 39, § 3º"}, {"t": "Economia não gerada", "tipo": "sancao", "d": "I – diferença descontada da remuneração; II – se superior ao limite máximo do contrato, outras sanções cabíveis.", "ref": "Art. 39, § 4º"}]}, {"t": "Modalidade × critério", "tipo": "topico", "filhos": [{"t": "Pregão: menor preço ou maior desconto", "tipo": "regra", "ref": "Art. 6º, XLI"}, {"t": "Concorrência: menor preço, melhor técnica/conteúdo artístico, técnica e preço, maior retorno econômico, maior desconto", "tipo": "regra", "ref": "Art. 6º, XXXVIII"}, {"t": "Concurso: melhor técnica ou conteúdo artístico", "tipo": "regra", "ref": "Art. 6º, XXXIX"}, {"t": "Leilão: maior lance", "tipo": "regra", "ref": "Arts. 6º, XL, e 33, V"}, {"t": "Diálogo competitivo: critérios objetivos divulgados no início da fase competitiva", "tipo": "regra", "ref": "Art. 32, § 1º, VIII e X"}, {"t": "SRP: menor preço ou maior desconto sobre tabela de preços", "tipo": "regra", "ref": "Art. 82, V"}]}]}}, {"id": "t2-setoriais", "titulo": "Título II – Cap. II, Seção IV: Disposições setoriais (arts. 40–52)", "raiz": {"t": "Disposições setoriais", "tipo": "topico", "ref": "Arts. 40–52", "filhos": [{"t": "Compras (arts. 40–44-A)", "tipo": "topico", "ref": "Arts. 40–44-A", "filhos": [{"t": "Planejamento considera expectativa de consumo anual", "tipo": "regra", "ref": "Art. 40, caput", "filhos": [{"t": "Observar", "tipo": "classificacao", "d": "I – condições semelhantes ao setor privado; II – SRP quando pertinente; III – quantidades por técnicas quantitativas (admitido fornecimento contínuo); IV – guarda e armazenamento; V – princípios da padronização, do parcelamento (viável e vantajoso) e da responsabilidade fiscal.", "ref": "Art. 40, I–V"}]}, {"t": "TR de compras: elementos do art. 6º, XXIII + especificação (catálogo), locais de entrega/recebimento, garantia e assistência técnica", "tipo": "regra", "ref": "Art. 40, § 1º"}, {"t": "Parcelamento considera lotes, mercado local e ampliação da competição", "tipo": "regra", "ref": "Art. 40, § 2º"}, {"t": "Parcelamento NÃO adotado quando", "tipo": "excecao", "d": "I – economia de escala/gestão recomendar mesmo fornecedor; II – sistema único e integrado com risco ao conjunto; III – padronização ou marca levar a fornecedor exclusivo.", "ref": "Art. 40, § 3º"}, {"t": "Manutenção/assistência técnica por deslocamento ou unidade em distância compatível (com ETP)", "tipo": "regra", "ref": "Art. 40, § 4º"}, {"t": "Excepcionalmente a Administração pode (art. 41)", "tipo": "classificacao", "ref": "Art. 41", "filhos": [{"t": "I – indicar marcas/modelos, justificadamente", "tipo": "regra", "d": "a) padronização; b) compatibilidade com plataformas; c) marca/modelo de vários fornecedores única capaz de atender; d) marca como mera referência.", "ref": "Art. 41, I"}, {"t": "II – exigir amostra ou prova de conceito", "tipo": "regra", "d": "Na pré-qualificação, no julgamento (só do provisoriamente vencedor) ou na vigência do contrato/ata, se previsto no edital e justificado.", "ref": "Art. 41, II e p.u."}, {"t": "III – vedar marca/produto comprovadamente inadequado (processo administrativo)", "tipo": "excecao", "ref": "Art. 41, III"}, {"t": "IV – carta de solidariedade do fabricante para revendedor/distribuidor", "tipo": "regra", "ref": "Art. 41, IV"}]}, {"t": "Prova de qualidade de produto similar (art. 42)", "tipo": "classificacao", "d": "I – normas técnicas (órgãos oficiais, ABNT, entidade credenciada pelo Inmetro); II – declaração de outro órgão de nível federativo equivalente ou superior; III – certificação/laudo de instituição oficial ou credenciada.", "ref": "Art. 42", "filhos": [{"t": "Pode exigir certificação por instituição credenciada pelo Conmetro", "tipo": "regra", "ref": "Art. 42, § 1º"}, {"t": "Protótipo e amostras do provisoriamente vencedor; exame por instituição indicada no edital", "tipo": "regra", "ref": "Art. 42, §§ 2º e 3º"}]}, {"t": "Padronização (art. 43)", "tipo": "classificacao", "d": "I – parecer técnico; II – despacho motivado da autoridade superior; III – síntese divulgada em sítio oficial.", "ref": "Art. 43", "filhos": [{"t": "Adesão à padronização de órgão de nível federativo igual ou superior, motivada", "tipo": "regra", "ref": "Art. 43, § 1º"}, {"t": "Software de uso disseminado: regulamento de gestão estratégica", "tipo": "regra", "ref": "Art. 43, § 2º"}]}, {"t": "Compra × locação: ETP compara custos e benefícios", "tipo": "regra", "ref": "Art. 44"}, {"t": "Equipamento diagnóstico/terapêutico do SUS acima do valor do art. 75, II: considerar aproveitamento na vida útil", "tipo": "regra", "d": "Edital demonstra capacidade instalada ou plano de atendimento aos requisitos de operação. Incluído pela Lei 15.210/2025 (§§ 2º–5º vetados).", "ref": "Art. 44-A"}]}, {"t": "Obras e serviços de engenharia (arts. 45–46)", "tipo": "topico", "ref": "Arts. 45–46", "filhos": [{"t": "Normas a respeitar", "tipo": "classificacao", "d": "I – resíduos sólidos; II – mitigação e compensação ambiental; III – redução de consumo de energia e recursos; IV – impacto de vizinhança; V – patrimônio histórico, cultural, arqueológico e imaterial; VI – acessibilidade.", "ref": "Art. 45"}, {"t": "Regimes de execução indireta", "tipo": "classificacao", "d": "I – empreitada por preço unitário; II – preço global; III – integral; IV – tarefa; V – contratação integrada; VI – semi-integrada; VII – fornecimento e prestação de serviço associado.", "ref": "Art. 46, caput"}, {"t": "Vedada obra/serviço de engenharia sem projeto executivo", "tipo": "excecao", "d": "Ressalvado o art. 18, § 3º.", "ref": "Art. 46, § 1º"}, {"t": "Integrada: dispensado projeto básico; exige anteprojeto", "tipo": "excecao", "ref": "Art. 46, § 2º"}, {"t": "Integrada: projeto básico do contratado submetido à aprovação; vedadas alterações que reduzam qualidade/vida útil", "tipo": "regra", "d": "Responsabilidade integral do contratado pelos riscos do projeto básico.", "ref": "Art. 46, § 3º"}, {"t": "Integrada/semi-integrada: desapropriação – edital/contrato preveem", "tipo": "classificacao", "d": "I – responsável por cada fase; II – pagamento das indenizações; III – estimativa do valor; IV – distribuição de riscos; V – em nome de quem se registra a imissão e a propriedade.", "ref": "Art. 46, § 4º"}, {"t": "Semi-integrada: projeto básico alterável com autorização prévia e demonstração de superioridade", "tipo": "regra", "d": "Contratado assume riscos da alteração.", "ref": "Art. 46, § 5º"}, {"t": "Cada etapa precedida da conclusão e aprovação da anterior", "tipo": "regra", "ref": "Art. 46, § 6º"}, {"t": "Regimes II a VI licitados por preço global; medição por etapas/metas", "tipo": "regra", "d": "Vedada remuneração por preços unitários.", "ref": "Art. 46, § 9º"}]}, {"t": "Serviços em geral (arts. 47–50)", "tipo": "topico", "ref": "Arts. 47–50", "filhos": [{"t": "Princípios da padronização e do parcelamento", "tipo": "regra", "d": "Parcelamento considera responsabilidade técnica, custo de vários contratos e ampliação da competição.", "ref": "Art. 47"}, {"t": "Manutenção e assistência técnica: edital define local", "tipo": "regra", "ref": "Art. 47, § 2º"}, {"t": "Terceirização de atividades acessórias, instrumentais ou complementares", "tipo": "regra", "ref": "Art. 48, caput", "filhos": [{"t": "Vedado à Administração", "tipo": "excecao", "d": "I – indicar pessoas nominalmente; II – fixar salário inferior ao legal; III – subordinação com funcionário da terceirizada; IV – pagamento por exclusivo reembolso de salários; V – tarefas fora do escopo; VI – intervenção na gestão interna do contratado.", "ref": "Art. 48, I–VI"}, {"t": "Contratado não pode contratar cônjuge/parente até 3º grau de dirigente ou agente da licitação/fiscalização", "tipo": "excecao", "d": "Proibição deve constar do edital.", "ref": "Art. 48, p.u."}]}, {"t": "Mais de uma empresa para o mesmo serviço", "tipo": "regra", "d": "Com justificativa, sem perda de economia de escala, quando execução concorrente e simultânea e conveniente; controle individualizado.", "ref": "Art. 49"}, {"t": "Dedicação exclusiva: comprovar obrigações trabalhistas e FGTS quando solicitado, sob pena de multa", "tipo": "sancao", "d": "Registro de ponto, recibos de salários, FGTS, férias, quitação de dispensados, vale-transporte e alimentação.", "ref": "Art. 50"}]}, {"t": "Locação de imóveis (art. 51)", "tipo": "topico", "ref": "Art. 51", "filhos": [{"t": "Precedida de licitação e avaliação prévia (estado, adaptações, amortização)", "tipo": "regra", "d": "Ressalvado o art. 74, V (inexigibilidade).", "ref": "Art. 51"}]}, {"t": "Licitações internacionais (art. 52)", "tipo": "topico", "ref": "Art. 52", "filhos": [{"t": "Edital ajustado à política monetária e comércio exterior", "tipo": "regra", "ref": "Art. 52, caput"}, {"t": "Se estrangeiro cota em moeda estrangeira, brasileiro também pode", "tipo": "regra", "d": "Pagamento ao brasileiro em moeda nacional; garantias equivalentes.", "ref": "Art. 52, §§ 1º–3º"}, {"t": "Gravames por estimativas/médias de tributos; mesmas regras para todos", "tipo": "regra", "ref": "Art. 52, §§ 4º e 5º"}, {"t": "Vedadas barreiras ao estrangeiro; admitida margem de preferência do art. 26", "tipo": "excecao", "ref": "Art. 52, § 6º"}]}]}}, {"id": "t2-divulgacao-propostas", "titulo": "Título II – Caps. III e IV: Divulgação do edital e apresentação de propostas e lances (arts. 53–58)", "raiz": {"t": "Divulgação do edital e propostas/lances", "tipo": "topico", "ref": "Arts. 53–58", "filhos": [{"t": "Controle prévio de legalidade (art. 53)", "tipo": "topico", "ref": "Art. 53", "filhos": [{"t": "Ao final da fase preparatória: órgão de assessoramento jurídico faz análise jurídica", "tipo": "competencia", "ref": "Art. 53, caput"}, {"t": "Parecer jurídico deve", "tipo": "classificacao", "d": "I – seguir critérios objetivos prévios de prioridade; II – linguagem simples, clara e objetiva, com todos os elementos indispensáveis e pressupostos de fato e de direito.", "ref": "Art. 53, § 1º"}, {"t": "Concluída a instrução técnica e jurídica, autoridade determina a divulgação do edital", "tipo": "regra", "ref": "Art. 53, § 3º"}, {"t": "Também para contratações diretas, acordos, convênios, adesões a atas e aditivos", "tipo": "regra", "ref": "Art. 53, § 4º"}, {"t": "Análise jurídica dispensável em hipóteses definidas pela autoridade jurídica máxima", "tipo": "excecao", "d": "Considerando baixo valor, baixa complexidade, entrega imediata ou minutas padronizadas.", "ref": "Art. 53, § 5º"}]}, {"t": "Publicidade do edital (art. 54)", "tipo": "topico", "ref": "Art. 54", "filhos": [{"t": "Divulgação e manutenção do inteiro teor no PNCP", "tipo": "regra", "ref": "Art. 54, caput"}, {"t": "Obrigatório extrato no Diário Oficial do ente e em jornal diário de grande circulação", "tipo": "regra", "d": "Parte vetada promulgada (consórcio público: ente de maior nível).", "ref": "Art. 54, § 1º"}, {"t": "Facultada divulgação adicional em sítio oficial do ente e direta a cadastrados", "tipo": "regra", "ref": "Art. 54, § 2º"}, {"t": "Após homologação, documentos da fase preparatória não integrantes do edital vão ao PNCP", "tipo": "regra", "ref": "Art. 54, § 3º"}]}, {"t": "Prazos mínimos para propostas e lances (art. 55) – dias úteis da divulgação do edital", "tipo": "prazo", "ref": "Art. 55", "filhos": [{"t": "Aquisição de bens", "tipo": "topico", "ref": "Art. 55, I", "filhos": [{"t": "8 dias úteis – menor preço ou maior desconto", "tipo": "prazo", "ref": "Art. 55, I, a"}, {"t": "15 dias úteis – demais casos", "tipo": "prazo", "ref": "Art. 55, I, b"}]}, {"t": "Serviços e obras", "tipo": "topico", "ref": "Art. 55, II", "filhos": [{"t": "10 dias úteis – menor preço/maior desconto, serviços comuns e obras/serviços comuns de engenharia", "tipo": "prazo", "ref": "Art. 55, II, a"}, {"t": "25 dias úteis – menor preço/maior desconto, serviços especiais e obras/serviços especiais de engenharia", "tipo": "prazo", "ref": "Art. 55, II, b"}, {"t": "60 dias úteis – contratação integrada", "tipo": "prazo", "ref": "Art. 55, II, c"}, {"t": "35 dias úteis – semi-integrada ou demais casos", "tipo": "prazo", "ref": "Art. 55, II, d"}]}, {"t": "15 dias úteis – maior lance", "tipo": "prazo", "ref": "Art. 55, III"}, {"t": "35 dias úteis – técnica e preço ou melhor técnica/conteúdo artístico", "tipo": "prazo", "ref": "Art. 55, IV"}, {"t": "Modificação do edital: nova divulgação e reabertura dos prazos", "tipo": "regra", "d": "Exceto se a alteração não comprometer a formulação das propostas.", "ref": "Art. 55, § 1º"}, {"t": "Prazos podem ser reduzidos até a metade nas licitações do Ministério da Saúde (SUS)", "tipo": "excecao", "d": "Mediante decisão fundamentada.", "ref": "Art. 55, § 2º"}, {"t": "Memorize: bens 8/15; serviços 10/25/60/35; maior lance 15; técnica 35", "tipo": "atencao", "ref": "Art. 55"}]}, {"t": "Modos de disputa (art. 56)", "tipo": "topico", "ref": "Art. 56", "filhos": [{"t": "Aberto: lances públicos e sucessivos, crescentes ou decrescentes", "tipo": "conceito", "ref": "Art. 56, I"}, {"t": "Fechado: propostas em sigilo até data e hora designadas", "tipo": "conceito", "ref": "Art. 56, II"}, {"t": "Podem ser usados isolada ou conjuntamente", "tipo": "regra", "ref": "Art. 56, caput"}, {"t": "Vedado fechado ISOLADO com menor preço ou maior desconto", "tipo": "excecao", "ref": "Art. 56, § 1º"}, {"t": "Vedado aberto com técnica e preço", "tipo": "excecao", "ref": "Art. 56, § 2º"}, {"t": "Lances intermediários", "tipo": "conceito", "d": "I – maior lance: iguais ou inferiores ao maior ofertado; II – demais critérios: iguais ou superiores ao menor ofertado.", "ref": "Art. 56, § 3º"}, {"t": "Diferença de pelo menos 5% entre 1º e 2º: pode reiniciar disputa aberta para demais colocações", "tipo": "prazo", "ref": "Art. 56, § 4º"}, {"t": "Obras/serviços de engenharia: vencedor reelabora planilhas (quantitativos, custos unitários, BDI e ES) após julgamento", "tipo": "regra", "ref": "Art. 56, § 5º"}, {"t": "Edital pode fixar intervalo mínimo entre lances", "tipo": "regra", "ref": "Art. 57"}]}, {"t": "Garantia de proposta (art. 58)", "tipo": "topico", "ref": "Art. 58", "filhos": [{"t": "Pode ser exigida como requisito de pré-habilitação", "tipo": "regra", "ref": "Art. 58, caput"}, {"t": "Até 1% do valor estimado", "tipo": "prazo", "ref": "Art. 58, § 1º"}, {"t": "Devolvida em 10 dias úteis da assinatura do contrato ou da declaração de fracasso", "tipo": "prazo", "ref": "Art. 58, § 2º"}, {"t": "Execução integral se recusar assinar ou não apresentar documentos", "tipo": "sancao", "ref": "Art. 58, § 3º"}, {"t": "Modalidades do art. 96, § 1º", "tipo": "regra", "ref": "Art. 58, § 4º"}]}]}}, {"id": "t2-julgamento-habilitacao", "titulo": "Título II – Caps. V a VII: Julgamento, habilitação e encerramento (arts. 59–71)", "raiz": {"t": "Julgamento, habilitação e encerramento", "tipo": "topico", "ref": "Arts. 59–71", "filhos": [{"t": "Julgamento (arts. 59–61)", "tipo": "topico", "ref": "Arts. 59–61", "filhos": [{"t": "Desclassificação das propostas", "tipo": "classificacao", "d": "I – vícios insanáveis; II – desatendimento das especificações técnicas; III – preços inexequíveis ou acima do orçamento estimado; IV – exequibilidade não demonstrada quando exigida; V – outras desconformidades insanáveis.", "ref": "Art. 59, I–V"}, {"t": "Conformidade pode ser verificada só na proposta mais bem classificada", "tipo": "regra", "ref": "Art. 59, § 1º"}, {"t": "Diligências para aferir exequibilidade", "tipo": "regra", "ref": "Art. 59, § 2º"}, {"t": "Obras e engenharia: avalia preço global, quantitativos e preços unitários relevantes", "tipo": "regra", "ref": "Art. 59, § 3º"}, {"t": "Obras/serviços de engenharia: inexequível abaixo de 75% do orçado", "tipo": "prazo", "ref": "Art. 59, § 4º"}, {"t": "Proposta abaixo de 85% do orçado: garantia adicional igual à diferença", "tipo": "prazo", "ref": "Art. 59, § 5º"}, {"t": "Desempate – ordem (art. 60)", "tipo": "classificacao", "d": "I – disputa final (nova proposta em ato contínuo); II – desempenho contratual prévio (registros cadastrais); III – ações de equidade entre homens e mulheres; IV – programa de integridade.", "ref": "Art. 60, I–IV"}, {"t": "Persistindo empate – preferência sucessiva", "tipo": "classificacao", "d": "I – empresas estabelecidas no Estado/DF do órgão licitante (ou no Estado do Município licitante); II – empresas brasileiras; III – que invistam em pesquisa e tecnologia no País; IV – que comprovem práticas de mitigação (Lei 12.187/2009).", "ref": "Art. 60, § 1º"}, {"t": "Não prejudica o empate ficto de ME/EPP (art. 44 da LC 123)", "tipo": "atencao", "ref": "Art. 60, § 2º"}, {"t": "Negociação com o primeiro colocado", "tipo": "regra", "d": "Pode ser feita com os demais, na ordem, se o primeiro for desclassificado por ficar acima do preço máximo; conduzida por agente ou comissão; resultado divulgado e anexado.", "ref": "Art. 61"}]}, {"t": "Habilitação (arts. 62–70)", "tipo": "topico", "ref": "Arts. 62–70", "filhos": [{"t": "Conceito e divisão", "tipo": "conceito", "d": "Verifica a capacidade do licitante: I – jurídica; II – técnica; III – fiscal, social e trabalhista; IV – econômico-financeira.", "ref": "Art. 62"}, {"t": "Disposições gerais (art. 63)", "tipo": "topico", "ref": "Art. 63", "filhos": [{"t": "Pode exigir declaração de atendimento aos requisitos (responde pela veracidade)", "tipo": "regra", "ref": "Art. 63, I"}, {"t": "Documentos só do vencedor, salvo inversão de fases", "tipo": "regra", "ref": "Art. 63, II"}, {"t": "Regularidade fiscal sempre após o julgamento e só do mais bem classificado", "tipo": "atencao", "ref": "Art. 63, III"}, {"t": "Declaração de cumprimento da reserva de cargos (PcD e reabilitados)", "tipo": "regra", "ref": "Art. 63, IV"}, {"t": "Declaração de que a proposta cobre todos os custos trabalhistas, sob pena de desclassificação", "tipo": "regra", "ref": "Art. 63, § 1º"}, {"t": "Vistoria prévia: pode ser exigida sob pena de inabilitação, mas sempre substituível por declaração do RT", "tipo": "regra", "d": "Se optarem por vistoria, datas e horários diferentes.", "ref": "Art. 63, §§ 2º–4º"}]}, {"t": "Vedada substituição/novos documentos após entrega, salvo diligência", "tipo": "excecao", "d": "I – complementar informações sobre fatos existentes à época da abertura; II – atualizar documentos vencidos após o recebimento das propostas.", "ref": "Art. 64", "filhos": [{"t": "Comissão pode sanar erros que não alterem a substância", "tipo": "regra", "ref": "Art. 64, § 1º"}, {"t": "Habilitação anterior encerrada: não cabe exclusão salvo fatos supervenientes ou só conhecidos depois", "tipo": "excecao", "ref": "Art. 64, § 2º"}]}, {"t": "Empresas criadas no exercício: balanço de abertura", "tipo": "regra", "ref": "Art. 65, § 1º"}, {"t": "Habilitação por processo eletrônico a distância", "tipo": "regra", "ref": "Art. 65, § 2º"}, {"t": "Jurídica: existência jurídica e autorização para a atividade", "tipo": "conceito", "ref": "Art. 66"}, {"t": "Técnica (art. 67) – documentação restrita a", "tipo": "classificacao", "d": "I – profissional com atestado de responsabilidade técnica; II – certidões/atestados de capacidade operacional; III – pessoal técnico, instalações e aparelhamento; IV – requisitos de lei especial; V – registro na entidade profissional; VI – declaração de conhecimento das condições locais.", "ref": "Art. 67, I–VI", "filhos": [{"t": "Atestados só para parcelas de maior relevância: valor individual ≥ 4% do total estimado", "tipo": "prazo", "ref": "Art. 67, § 1º"}, {"t": "Quantidades mínimas de até 50% dessas parcelas; vedadas limitações de tempo e local", "tipo": "prazo", "ref": "Art. 67, § 2º"}, {"t": "Salvo obras/engenharia, atestados podem ser substituídos por outra prova (regulamento)", "tipo": "excecao", "ref": "Art. 67, § 3º"}, {"t": "Atestados estrangeiros aceitos com tradução", "tipo": "regra", "ref": "Art. 67, § 4º"}, {"t": "Serviços contínuos: prazo mínimo de experiência não superior a 3 anos", "tipo": "prazo", "ref": "Art. 67, § 5º"}, {"t": "Profissionais indicados participam; substituição por equ
