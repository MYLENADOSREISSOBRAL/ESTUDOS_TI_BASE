*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}

.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){

}

va, patrimonial, financeira, didático-pedagógica, disciplinar", "tipo": "classificacao", "ref": "Art. 1º, parágrafo único"}, {"t": "Escolas Técnicas Vinculadas NÃO são autarquias", "tipo": "atencao", "d": "Pertencem à estrutura das universidades federais (art. 4º); o inciso IV não consta do parágrafo único.", "ref": "Art. 1º, parágrafo único; art. 4º"}]}]}, {"t": "Natureza dos Institutos Federais", "tipo": "conceito", "d": "Instituições de educação superior, básica e profissional, pluricurriculares e multicampi, especializadas na oferta de educação profissional e tecnológica nas diferentes modalidades, com base na conjugação de conhecimentos técnicos e tecnológicos com suas práticas pedagógicas.", "ref": "Art. 2º, caput", "filhos": [{"t": "Equiparados às universidades federais para regulação, avaliação e supervisão da educação superior", "tipo": "regra", "ref": "Art. 2º, § 1º"}, {"t": "Instituições acreditadoras e certificadoras de competências profissionais", "tipo": "competencia", "d": "No âmbito de sua atuação.", "ref": "Art. 2º, § 2º"}, {"t": "Autonomia para criar e extinguir cursos e registrar diplomas", "tipo": "competencia", "d": "Nos limites de sua área de atuação territorial, mediante autorização do seu Conselho Superior.", "ref": "Art. 2º, § 3º", "filhos": [{"t": "Cursos a distância: aplica-se legislação específica", "tipo": "excecao", "ref": "Art. 2º, § 3º"}, {"t": "Quem autoriza é o Conselho Superior (não o MEC, nem o Reitor)", "tipo": "atencao", "ref": "Art. 2º, § 3º"}]}]}, {"t": "UTFPR", "tipo": "conceito", "d": "Universidade especializada (art. 52, parágrafo único, da Lei 9.394/96), regida pelos princípios, finalidades e objetivos da Lei nº 11.184/2005.", "ref": "Art. 3º"}, {"t": "Escolas Técnicas Vinculadas às Universidades Federais", "tipo": "conceito", "d": "Estabelecimentos de ensino pertencentes à estrutura organizacional das universidades federais, dedicando-se precipuamente à formação profissional técnica de nível médio, em suas áreas de atuação.", "ref": "Art. 4º"}, {"t": "Colégio Pedro II", "tipo": "conceito", "d": "Instituição federal de ensino, pluricurricular e multicampi, vinculada ao MEC, especializada na oferta de educação básica e de licenciaturas.", "ref": "Art. 4º-A", "filhos": [{"t": "Equiparado aos IFs para autonomia, gestão de pessoal, regulação, avaliação e supervisão", "tipo": "regra", "d": "Equiparação para efeito das disposições que regem a autonomia, a utilização dos instrumentos de gestão do quadro de pessoal e as ações de regulação, avaliação e supervisão das instituições e dos cursos de educação profissional e superior.", "ref": "Art. 4º-A, parágrafo único"}, {"t": "Atenção: IFs equiparam-se a universidades; CPII equipara-se aos IFs", "tipo": "atencao", "ref": "Art. 2º, § 1º; art. 4º-A, parágrafo único"}]}]}}, {"id": "cap-2-sec-1", "titulo": "Capítulo II, Seção I – Da criação dos Institutos Federais (art. 5º)", "raiz": {"t": "Criação dos Institutos Federais", "tipo": "topico", "ref": "Art. 5º", "filhos": [{"t": "39 IFs criados (incisos I a XXXIX)", "tipo": "classificacao", "d": "Criados por transformação (de uma instituição), integração (de várias) ou desmembramento (IF Sertão Paraibano, incluído pela Lei 15.367/2026).", "ref": "Art. 5º, I a XXXIX", "filhos": [{"t": "Transformação: uma instituição vira IF", "tipo": "classificacao", "d": "Ex.: IF Acre (ETF Acre), IF Amapá, IF Bahia, IF Brasília, IF Goiás, IF Sertão Pernambucano (CEFET Petrolina), IF Piauí, IF Paraná (Escola Técnica da UFPR), IF Rio de Janeiro (CEFET Química de Nilópolis), IF Fluminense (CEFET Campos), IF RN, IF Sul-rio-grandense (CEFET Pelotas), IF Roraima, IF Santa Catarina, IF São Paulo.", "ref": "Art. 5º"}, {"t": "Integração: várias instituições formam um IF", "tipo": "classificacao", "d": "Ex.: IF Alagoas, IF Amazonas, IF Baiano, IF Ceará, IF Espírito Santo, IF Goiano, IF Maranhão, IFs mineiros, IF Mato Grosso, IF MS, IF Pará, IF Paraíba, IF Pernambuco, IF RS, IF Farroupilha, IF Rondônia, IF Catarinense, IF Sergipe, IF Tocantins.", "ref": "Art. 5º"}, {"t": "Desmembramento: IF do Sertão Paraibano (do IF da Paraíba)", "tipo": "classificacao", "d": "Inciso XXXIX incluído pela Lei nº 15.367/2026.", "ref": "Art. 5º, XXXIX"}, {"t": "XX – Instituto Federal do Pará (IFPA)", "tipo": "exemplo", "d": "Criado mediante integração do CEFET do Pará e das Escolas Agrotécnicas Federais de Castanhal e de Marabá. Reitoria sediada em Belém (Anexo I).", "ref": "Art. 5º, XX; Anexo I", "filhos": [{"t": "IFPA = integração (CEFET-PA + EAF Castanhal + EAF Marabá), não transformação", "tipo": "atencao", "ref": "Art. 5º, XX"}]}]}, {"t": "Localidades das reitorias: Anexo I", "tipo": "regra", "ref": "Art. 5º, § 1º"}, {"t": "Unidade de ensino da instituição transformada/integrada vira campus automaticamente", "tipo": "regra", "d": "Independentemente de qualquer formalidade.", "ref": "Art. 5º, § 2º"}, {"t": "Escolas Técnicas Vinculadas que integram IFs: Anexo II", "tipo": "regra", "ref": "Art. 5º, § 3º"}, {"t": "Adesão de Escolas Técnicas Vinculadas não incluídas (Anexo III)", "tipo": "regra", "d": "Poderão, mediante aprovação do Conselho Superior de sua universidade federal, propor ao MEC a adesão ao IF constituído na mesma base territorial.", "ref": "Art. 5º, § 4º", "filhos": [{"t": "Adesão é faculdade ('poderão'), não obrigação", "tipo": "atencao", "ref": "Art. 5º, § 4º"}]}, {"t": "Relação dos campi de cada IF: ato do Ministro da Educação", "tipo": "competencia", "ref": "Art. 5º, § 5º"}, {"t": "Bolsas de pesquisa, desenvolvimento, inovação e intercâmbio", "tipo": "regra", "d": "Os IFs poderão concedê-las, nos termos de regulamentação de órgão técnico competente do MEC (redação da Lei 14.695/2023).", "ref": "Art. 5º, § 6º", "filhos": [{"t": "Beneficiários: alunos, docentes, ocupantes de cargo efetivo, detentores de função/emprego público, pesquisadores externos ou de empresas", "tipo": "classificacao", "d": "Desde que efetivamente envolvidos nessas atividades.", "ref": "Art. 5º, § 6º"}]}]}}, {"id": "cap-2-sec-2-3", "titulo": "Capítulo II, Seções II e III – Finalidades, características e objetivos (arts. 6º–8º)", "raiz": {"t": "Finalidades, objetivos e percentuais de vagas", "tipo": "topico", "filhos": [{"t": "Finalidades e características (9 incisos)", "tipo": "classificacao", "ref": "Art. 6º", "filhos": [{"t": "I – ofertar EPT em todos os níveis e modalidades", "tipo": "regra", "d": "Formando e qualificando cidadãos para atuação profissional nos diversos setores da economia, com ênfase no desenvolvimento socioeconômico local, regional e nacional.", "ref": "Art. 6º, I"}, {"t": "II – EPT como processo educativo e investigativo", "tipo": "regra", "d": "De geração e adaptação de soluções técnicas e tecnológicas às demandas sociais e peculiaridades regionais.", "ref": "Art. 6º, II"}, {"t": "III – integração e verticalização da educação básica à profissional e superior", "tipo": "regra", "d": "Otimizando infraestrutura física, quadros de pessoal e recursos de gestão.", "ref": "Art. 6º, III"}, {"t": "IV – oferta formativa em benefício dos arranjos produtivos, sociais e culturais locais", "tipo": "regra", "d": "Identificados com base no mapeamento das potencialidades de desenvolvimento socioeconômico e cultural no âmbito de atuação do IF.", "ref": "Art. 6º, IV"}, {"t": "V – centro de excelência no ensino de ciências (em geral) e ciências aplicadas (em particular)", "tipo": "regra", "d": "Estimulando o espírito crítico voltado à investigação empírica.", "ref": "Art. 6º, V"}, {"t": "VI – centro de referência no apoio ao ensino de ciências nas instituições públicas", "tipo": "regra", "d": "Oferecendo capacitação técnica e atualização pedagógica aos docentes das redes públicas.", "ref": "Art. 6º, VI"}, {"t": "VII – programas de extensão e divulgação científica e tecnológica", "tipo": "regra", "ref": "Art. 6º, VII"}, {"t": "VIII – pesquisa aplicada, produção cultural, empreendedorismo, cooperativismo, desenvolvimento C&T", "tipo": "regra", "d": "Realizar e estimular.", "ref": "Art. 6º, VIII"}, {"t": "IX – produção, desenvolvimento e transferência de tecnologias sociais", "tipo": "regra", "d": "Notadamente as voltadas à preservação do meio ambiente.", "ref": "Art. 6º, IX"}, {"t": "Excelência (V) × referência (VI): não confundir", "tipo": "atencao", "d": "Centro de EXCELÊNCIA na oferta do ensino de ciências; centro de REFERÊNCIA no apoio à oferta do ensino de ciências nas instituições públicas.", "ref": "Art. 6º, V e VI"}]}, {"t": "Objetivos (observadas as finalidades do art. 6º)", "tipo": "classificacao", "ref": "Art. 7º", "filhos": [{"t": "I – educação profissional técnica de nível médio", "tipo": "regra", "d": "Prioritariamente na forma de cursos integrados, para concluintes do ensino fundamental e para o público da EJA.", "ref": "Art. 7º, I", "filhos": [{"t": "Base do mínimo de 50% das vagas", "tipo": "prazo", "ref": "Art. 8º, caput"}]}, {"t": "II – formação inicial e continuada (FIC) de trabalhadores", "tipo": "regra", "d": "Capacitação, aperfeiçoamento, especialização e atualização de profissionais, em todos os níveis de escolaridade, nas áreas da EPT.", "ref": "Art. 7º, II"}, {"t": "III – pesquisas aplicadas", "tipo": "regra", "d": "Estimulando soluções técnicas e tecnológicas e estendendo seus benefícios à comunidade.", "ref": "Art. 7º, III"}, {"t": "IV – atividades de extensão", "tipo": "regra", "d": "De acordo com os princípios e finalidades da EPT, em articulação com o mundo do trabalho e os segmentos sociais, com ênfase na produção, desenvolvimento e difusão de conhecimentos científicos e tecnológicos.", "ref": "Art. 7º, IV"}, {"t": "V – processos educativos para geração de trabalho e renda e emancipação do cidadão", "tipo": "regra", "d": "Na perspectiva do desenvolvimento socioeconômico local e regional.", "ref": "Art. 7º, V"}, {"t": "VI – educação superior", "tipo": "classificacao", "ref": "Art. 7º, VI", "filhos": [{"t": "a) cursos superiores de tecnologia", "tipo": "regra", "d": "Formação de profissionais para os diferentes setores da economia.", "ref": "Art. 7º, VI, a"}, {"t": "b) licenciaturas e programas especiais de formação pedagógica", "tipo": "regra", "d": "Formação de professores para a educação básica, sobretudo em ciências e matemática, e para a educação profissional. Base do mínimo de 20% das vagas.", "ref": "Art. 7º, VI, b"}, {"t": "c) bacharelado e engenharia", "tipo": "regra", "ref": "Art. 7º, VI, c"}, {"t": "d) pós-graduação lato sensu (aperfeiçoamento e especialização)", "tipo": "regra", "ref": "Art. 7º, VI, d"}, {"t": "e) pós-graduação stricto sensu (mestrado e doutorado)", "tipo": "regra", "d": "Para estabelecer bases sólidas em educação, ciência e tecnologia, com vistas à geração e inovação tecnológica.", "ref": "Art. 7º, VI, e"}]}]}, {"t": "Percentuais mínimos de vagas (em cada exercício)", "tipo": "prazo", "ref": "Art. 8º", "filhos": [{"t": "Mínimo de 50% – educação profissional técnica de nível médio (art. 7º, I)", "tipo": "prazo", "ref": "Art. 8º, caput"}, {"t": "Mínimo de 20% – licenciaturas e formação pedagógica (art. 7º, VI, b)", "tipo": "prazo", "ref": "Art. 8º, caput"}, {"t": "Cálculo pelo conceito de aluno-equivalente (regulamento do MEC)", "tipo": "regra", "ref": "Art. 8º, § 1º"}, {"t": "Ajuste da oferta de nível superior", "tipo": "excecao", "d": "Onde as demandas sociais por formação superior justificarem, o Conselho Superior do IF poderá, com anuência do MEC, autorizar o ajuste da oferta desse nível, sem prejuízo do índice do caput, para atender ao art. 7º, I.", "ref": "Art. 8º, § 2º", "filhos": [{"t": "Quem autoriza: Conselho Superior + anuência do MEC", "tipo": "competencia", "ref": "Art. 8º, § 2º"}]}, {"t": "São MÍNIMOS (não máximos), apurados por exercício", "tipo": "atencao", "ref": "Art. 8º, caput"}]}]}}, {"id": "cap-2-sec-4", "titulo": "Capítulo II, Seção IV – Estrutura organizacional; Reitor e Diretor-Geral (arts. 9º–13)", "raiz": {"t": "Estrutura organizacional dos IFs", "tipo": "topico", "filhos": [{"t": "Estrutura multicampi", "tipo": "conceito", "d": "Proposta orçamentária anual identificada para cada campus e para a reitoria.", "ref": "Art. 9º", "filhos": [{"t": "Exceto pessoal, encargos sociais e benefícios aos servidores", "tipo": "excecao", "ref": "Art. 9º"}]}, {"t": "Órgãos superiores: Colégio de Dirigentes e Conselho Superior", "tipo": "competencia", "ref": "Art. 10, caput", "filhos": [{"t": "Ambos presididos pelo Reitor", "tipo": "competencia", "ref": "Art. 10, § 1º"}, {"t": "Colégio de Dirigentes – caráter consultivo", "tipo": "competencia", "ref": "Art. 10, § 2º", "filhos": [{"t": "Composição: Reitor, Pró-Reitores e Diretor-Geral de cada campus", "tipo": "classificacao", "ref": "Art. 10, § 2º"}]}, {"t": "Conselho Superior – caráter consultivo e deliberativo", "tipo": "competencia", "ref": "Art. 10, § 3º", "filhos": [{"t": "Representantes: docentes, estudantes, técnico-administrativos, egressos, sociedade civil, MEC e Colégio de Dirigentes", "tipo": "classificacao", "ref": "Art. 10, § 3º"}, {"t": "Representação paritária dos segmentos da comunidade acadêmica", "tipo": "regra", "ref": "Art. 10, § 3º"}]}, {"t": "Estatuto do IF dispõe sobre estrutura, competências e funcionamento de ambos", "tipo": "regra", "ref": "Art. 10, § 4º"}, {"t": "Consultivo (Colégio) × consultivo E deliberativo (Conselho)", "tipo": "atencao", "ref": "Art. 10, §§ 2º e 3º"}]}, {"t": "Órgão executivo: Reitoria (1 Reitor + 5 Pró-Reitores)", "tipo": "competencia", "ref": "Art. 11, caput", "filhos": [{"t": "Requisitos para Pró-Reitor", "tipo": "regra", "d": "Servidor ocupante de cargo efetivo da carreira docente ou de cargo efetivo com nível superior da carreira dos técnico-administrativos (PCCTAE), com mínimo de 5 anos de efetivo exercício em instituição federal de EPT (redação da Lei 12.772/2012).", "ref": "Art. 11, § 1º", "filhos": [{"t": "5 anos de efetivo exercício em instituição federal de EPT", "tipo": "prazo", "ref": "Art. 11, § 1º"}, {"t": "Pró-Reitores nomeados pelo Reitor", "tipo": "competencia", "d": "Nos termos da legislação aplicável à nomeação de cargos de direção.", "ref": "Art. 12, § 3º"}]}, {"t": "Reitoria pode ficar em espaço físico distinto dos campi", "tipo": "regra", "d": "Desde que previsto no estatuto e aprovado pelo MEC.", "ref": "Art. 11, § 2º"}]}, {"t": "Reitor", "tipo": "competencia", "ref": "Art. 12", "filhos": [{"t": "Nomeado pelo Presidente da República", "tipo": "competencia", "d": "Escolhido obrigatoriamente o candidato com maior número de votos na consulta à comunidade escolar (redação da Lei 15.367/2026).", "ref": "Art. 12, caput"}, {"t": "Mandato de 4 anos, permitida uma recondução", "tipo": "prazo", "ref": "Art. 12, caput"}, {"t": "Consulta à comunidade escolar – pesos", "tipo": "prazo", "ref": "Art. 12, caput", "filhos": [{"t": "1/3 docentes", "tipo": "prazo", "ref": "Art. 12, caput"}, {"t": "1/3 servidores técnico-administrativos", "tipo": "prazo", "ref": "Art. 12, caput"}, {"t": "1/3 corpo discente", "tipo": "prazo", "ref": "Art. 12, caput"}]}, {"t": "Requisitos para candidatura", "tipo": "regra", "d": "Docente do Quadro de Pessoal Ativo Permanente de qualquer campus do IF, com mínimo de 5 anos de efetivo exercício em instituição federal de EPT e pelo menos um dos requisitos abaixo.", "ref": "Art. 12, § 1º", "filhos": [{"t": "I – título de doutor; ou", "tipo": "regra", "ref": "Art. 12, § 1º, I"}, {"t": "II – Classe C, nível 4, ou Classe Titular da Carreira do Magistério EBTT", "tipo": "regra", "d": "Redação da Lei 15.367/2026. A redação anterior previa Classes DIV ou DV do EBTT ou Professor Associado do Magistério Superior.", "ref": "Art. 12, § 1º, II"}, {"t": "Só DOCENTES podem ser Reitor (técnico-administrativo não)", "tipo": "atencao", "ref": "Art. 12, § 1º"}]}, {"t": "Extinção do mandato", "tipo": "sancao", "ref": "Art. 12, § 2º", "filhos": [{"t": "Decurso do prazo", "tipo": "classificacao", "ref": "Art. 12, § 2º"}, {"t": "Antes do prazo: aposentadoria (voluntária ou compulsória), renúncia, destituição ou vacância", "tipo": "classificacao", "ref": "Art. 12, § 2º"}]}, {"t": "Redação da MP 914/2019 teve vigência encerrada", "tipo": "atencao", "d": "O PDF mostra trechos 'Revogado pela MP 914/2019 (Vigência Encerrada)'; a MP perdeu eficácia, prevalecendo o texto da lei com as alterações posteriores.", "ref": "Arts. 11 a 14"}]}, {"t": "Diretor-Geral de campus", "tipo": "competencia", "ref": "Art. 13", "filhos": [{"t": "Campi dirigidos por Diretores-Gerais nomeados pelo Reitor", "tipo": "competencia", "ref": "Art. 13, caput"}, {"t": "Mandato de 4 anos, permitida uma recondução", "tipo": "prazo", "ref": "Art. 13, caput"}, {"t": "Consulta à comunidade do campus: 1/3 docentes, 1/3 técnico-administrativos, 1/3 discentes", "tipo": "prazo", "ref": "Art. 13, caput"}, {"t": "Requisitos para candidatura", "tipo": "regra", "d": "Servidor efetivo da carreira docente ou servidor com formação em nível superior ocupante de cargo efetivo da carreira dos técnico-administrativos (PCCTAE), com mínimo de 5 anos de efetivo exercício em instituição federal de EPT e em pelo menos uma das situações abaixo (redação da Lei 15.367/2026).", "ref": "Art. 13, § 1º", "filhos": [{"t": "I – preencher os requisitos para candidatura a Reitor", "tipo": "regra", "ref": "Art. 13, § 1º, I"}, {"t": "II – mínimo de 2 anos em cargo ou função de gestão na instituição; ou", "tipo": "prazo", "ref": "Art. 13, § 1º, II"}, {"t": "III – curso de formação para cargo/função de gestão em instituições da administração pública, concluído com aproveitamento", "tipo": "regra", "ref": "Art. 13, § 1º, III"}, {"t": "Técnico-administrativo de nível superior PODE ser Diretor-Geral", "tipo": "atencao", "ref": "Art. 13, § 1º"}]}, {"t": "MEC expede normas complementares sobre os cursos do inciso III", "tipo": "competencia", "d": "Reconhecimento, validação e oferta regular.", "ref": "Art. 13, § 2º"}]}]}}, {"id": "cap-2a", "titulo": "Capítulo II-A – Do Colégio Pedro II (arts. 13-A e 13-B)", "raiz": {"t": "Colégio Pedro II", "tipo": "topico", "d": "Capítulo incluído pela Lei nº 12.677/2012.", "filhos": [{"t": "Mesma estrutura e organização dos Institutos Federais", "tipo": "regra", "ref": "Art. 13-A"}, {"t": "Unidades escolares existentes passam a campi automaticamente", "tipo": "regra", "d": "Independentemente de qualquer formalidade.", "ref": "Art. 13-B, caput", "filhos": [{"t": "Novos campi: dependem de autorização específica do MEC", "tipo": "excecao", "ref": "Art. 13-B, parágrafo único"}]}]}}, {"id": "cap-3", "titulo": "Capítulo III – Disposições gerais e transitórias (arts. 14–20)", "raiz": {"t": "Disposições gerais e transitórias", "tipo": "topico", "filhos": [{"t": "Transição de dirigentes (pro tempore)", "tipo": "regra", "ref": "Art. 14", "filhos": [{"t": "Diretor-Geral da instituição transformada/integrada nomeado Reitor", "tipo": "regra", "d": "Exerce o cargo até o fim do mandato em curso, em caráter pro tempore.", "ref": "Art. 14, caput", "filhos": [{"t": "Prazo máximo de 180 dias: proposta de estatuto e PDI ao MEC", "tipo": "prazo", "d": "Assegurada a participação da comunidade acadêmica.", "ref": "Art. 14, caput"}]}, {"t": "Diretores-Gerais das instituições transformadas em campus: Diretor-Geral pro tempore até o fim do mandato", "tipo": "regra", "ref": "Art. 14, § 1º"}, {"t": "Campi em implantação: Diretor-Geral pro tempore nomeado pelo Reitor", "tipo": "regra", "d": "Até que seja possível identificar candidatos que atendam aos requisitos do art. 13, § 1º.", "ref": "Art. 14, § 2º"}, {"t": "Limite máximo: 2 mandatos consecutivos", "tipo": "excecao", "d": "O Diretor-Geral nomeado Reitor pro tempore ou Diretor-Geral pro tempore de campus não pode candidatar-se a novo mandato se já estiver no exercício do segundo.", "ref": "Art. 14, § 3º"}]}, {"t": "Criação de novas instituições de EPT e expansão seguem o modelo de IF", "tipo": "regra", "d": "Observando parâmetros e normas definidos pelo MEC.", "ref": "Art. 15"}, {"t": "Pessoal", "tipo": "regra", "ref": "Art. 16", "filhos": [{"t": "Redistribuídos aos IFs todos os cargos e funções, ocupados e vagos", "tipo": "regra", "ref": "Art. 16, caput"}, {"t": "Servidores mantidos na lotação atual", "tipo": "regra", "ref": "Art. 16, § 1º", "filhos": [{"t": "Exceto os designados pela administração superior para a Reitoria", "tipo": "excecao", "ref": "Art. 16, § 1º"}]}, {"t": "Mudança de lotação entre campi do mesmo IF = remoção (art. 36 da Lei 8.112/90)", "tipo": "regra", "ref": "Art. 16, § 2º"}]}, {"t": "Patrimônio dos novos IFs", "tipo": "classificacao", "ref": "Art. 17", "filhos": [{"t": "I – bens e direitos das instituições integrantes, transferidos automaticamente, sem reservas ou condições", "tipo": "classificacao", "ref": "Art. 17, I"}, {"t": "II – bens e direitos que vier a adquirir", "tipo": "classificacao", "ref": "Art. 17, II"}, {"t": "III – doações ou legados", "tipo": "classificacao", "ref": "Art. 17, III"}, {"t": "IV – incorporações resultantes de serviços realizados", "tipo": "classificacao", "ref": "Art. 17, IV"}, {"t": "Uso exclusivo para seus objetivos; alienação só nos casos e condições da lei", "tipo": "excecao", "ref": "Art. 17, parágrafo único"}]}, {"t": "Art. 18 – CEFET-RJ e CEFET-MG como autarquias: REVOGADO", "tipo": "atencao", "d": "Revogado pela Lei nº 15.521/2026 (junto com o art. 1º, III).", "ref": "Art. 18"}, {"t": "Alterações na Lei nº 11.740/2008 (arts. 1º, 2º, 4º e 5º)", "tipo": "regra", "ref": "Art. 19", "filhos": [{"t": "Cargos para redistribuição/alocação a instituições federais de EPT e de ensino superior", "tipo": "regra", "ref": "Art. 19"}, {"t": "38 CD-1; 508 CD-4; 2.139 FG-2", "tipo": "prazo", "ref": "Art. 19 (art. 2º da Lei 11.740/2008)"}]}, {"t": "Vigência: data da publicação", "tipo": "prazo", "d": "Lei de 29/12/2008, publicada no DOU de 30/12/2008.", "ref": "Art. 20"}]}}, {"id": "anexos", "titulo": "Anexos I, II e III", "raiz": {"t": "Anexos da Lei 11.892/2008", "tipo": "topico", "filhos": [{"t": "Anexo I – Sedes das Reitorias", "tipo": "classificacao", "d": "Redação dada pela Lei nº 15.367/2026 (inclui IF do Sertão Paraibano, sede em Patos).", "ref": "Anexo I", "filhos": [{"t": "IF do Pará – Belém", "tipo": "exemplo", "ref": "Anexo I"}, {"t": "Capitais/destaques: Acre–Rio Branco; Amapá–Macapá; Amazonas–Manaus; Tocantins–Palmas; Roraima–Boa Vista; Rondônia–Porto Velho; Maranhão–São Luís", "tipo": "exemplo", "ref": "Anexo I"}, {"t": "Sedes fora da capital: IF Sudeste MG–Juiz de Fora; Sul de MG–Pouso Alegre; Norte de MG–Montes Claros; Triângulo–Uberaba; Sertão Pernambucano–Petrolina; Fluminense–Campos dos Goytacazes; RS–Bento Gonçalves; Farroupilha–Santa Maria; Sul-rio-grandense–Pelotas; Catarinense–Blumenau; Sertão Paraibano–Patos", "tipo": "exemplo", "ref": "Anexo I"}, {"t": "IF Baiano e IF Bahia: ambos em Salvador; IF Goiano e IF Goiás: ambos em Goiânia", "tipo": "atencao", "ref": "Anexo I"}, {"t": "Demais sedes (capitais): Alagoas–Maceió; Brasília–Brasília; Ceará–Fortaleza; Espírito Santo–Vitória; Minas Gerais–Belo Horizonte; Mato Grosso–Cuiabá; Mato Grosso do Sul–Campo Grande; Paraíba–João Pessoa; Pernambuco–Recife; Piauí–Teresina; Paraná–Curitiba; Rio de Janeiro–Rio de Janeiro; Rio Grande do Norte–Natal; Santa Catarina–Florianópolis; São Paulo–São Paulo; Sergipe–Aracaju", "tipo": "exemplo", "ref": "Anexo I"}]}, {"t": "Anexo II – Escolas Técnicas Vinculadas que passam a integrar IFs", "tipo": "classificacao", "ref": "Anexo II", "filhos": [{"t": "Colégio Técnico Universitário (UFJF) → IF Sudeste de MG", "tipo": "exemplo", "ref": "Anexo II"}, {"t": "Colégio Agrícola Nilo Peçanha (UFF) → IF Rio de Janeiro", "tipo": "exemplo", "ref": "Anexo II"}, {"t": "Colégio Técnico Agrícola Ildefonso Bastos Borges (UFF) → IF Fluminense", "tipo": "exemplo", "ref": "Anexo II"}, {"t": "Escola Técnica (UFPR) → IF Paraná", "tipo": "exemplo", "ref": "Anexo II"}, {"t": "Escola Técnica (UFRGS) e Colégio Técnico Industrial Prof. Mário Alquati (FURG) → IF Rio Grande do Sul", "tipo": "exemplo", "ref": "Anexo II"}, {"t": "Colégios Agrícolas de Camboriú e Senador Carlos Gomes (UFSC) → IF Catarinense", "tipo": "exemplo", "ref": "Anexo II"}]}, {"t": "Anexo III – Escolas Técnicas Vinculadas às Universidades Federais (não integradas)", "tipo": "classificacao", "d": "Podem propor adesão a IF da mesma base territorial (art. 5º, § 4º).", "ref": "Anexo III", "filhos": [{"t": "Pará: Escola de Música e Escola de Teatro e Dança da UFPA", "tipo": "exemplo", "d": "No PDF aparecem como 'da UFP' – Universidade Federal do Pará.", "ref": "Anexo III"}, {"t": "Outras: UFRR, UFMA, UFAL, UFMG, UFTM, UFU, UFV, UFPB, UFCG, UFRPE, UFPI (3), UFRRJ, UFRN (3), UFPEL, UFSM (3)", "tipo": "exemplo", "ref": "Anexo III"}, {"t": "Incluídos pela Lei 15.521/2026: Centros de Formação e Ensino Técnico da UFCI/MG e da UFCI/RJ", "tipo": "exemplo", "d": "Universidades Federais de Ciência e Inovação de Minas Gerais e do Rio de Janeiro.", "ref": "Anexo III"}]}]}}], "comparacoes": [{"titulo": "Colégio de Dirigentes × Conselho Superior", "colunas": ["Aspecto", "Colégio de Dirigentes", "Conselho Superior"], "linhas": [["Natureza", "Órgão superior", "Órgão superior"], ["Caráter", "Consultivo", "Consultivo e deliberativo"], ["Presidência", "Reitor", "Reitor"], ["Composição", "Reitor, Pró-Reitores e Diretor-Geral de cada campus", "Representantes de docentes, estudantes, técnico-administrativos, egressos, sociedade civil, MEC e Colégio de Dirigentes (paritária entre segmentos da comunidade acadêmica)"], ["Normas de funcionamento", "Estatuto do IF", "Estatuto do IF"], ["Base legal", "Art. 10, §§ 1º, 2º e 4º", "Art. 10, §§ 1º, 3º e 4º"]]}, {"titulo": "Reitor × Diretor-Geral de campus × Pró-Reitor", "colunas": ["Aspecto", "Reitor", "Diretor-Geral de campus", "Pró-Reitor"], "linhas": [["Quem nomeia", "Presidente da República (obrigatoriamente o mais votado)", "Reitor", "Reitor"], ["Mandato", "4 anos, 1 recondução", "4 anos, 1 recondução", "Não fixado na lei"], ["Consulta", "Comunidade escolar do IF: 1/3 docentes, 1/3 TAEs, 1/3 discentes", "Comunidade do campus: 1/3 docentes, 1/3 TAEs, 1/3 discentes", "Não há"], ["Quem pode", "Somente docente do quadro ativo permanente", "Docente efetivo ou TAE efetivo com nível superior", "Docente efetivo ou TAE efetivo com nível superior"], ["Tempo mínimo", "5 anos em instituição federal de EPT", "5 anos em instituição federal de EPT", "5 anos em instituição federal de EPT"], ["Requisito adicional", "Doutor OU Classe C nível 4 / Titular EBTT", "Requisitos de Reitor OU 2 anos em gestão OU curso de formação em gestão", "Nenhum"], ["Base legal", "Art. 12", "Art. 13", "Arts. 11, § 1º e 12, § 3º"]]}, {"titulo": "Instituições da Rede Federal de EPCT", "colunas": ["Instituição", "Natureza / especialidade", "Autarquia?", "Base legal"], "linhas": [["Institutos Federais", "Educação superior, básica e profissional; pluricurriculares e multicampi; equiparados às universidades federais", "Sim", "Arts. 1º, I e 2º"], ["UTFPR", "Universidade especializada (Lei 11.184/2005)", "Sim", "Arts. 1º, II e 3º"], ["CEFET-RJ e CEFET-MG", "Inciso III e art. 18 revogados pela Lei 15.521/2026", "—", "Art. 1º, III; art. 18"], ["Escolas Técnicas Vinculadas", "Integram a estrutura das universidades federais; formação técnica de nível médio", "Não", "Arts. 1º, IV e 4º"], ["Colégio Pedro II", "Educação básica e licenciaturas; pluricurricular e multicampi; equiparado aos IFs", "Sim", "Arts. 1º, V, 4º-A, 13-A e 13-B"]]}, {"titulo": "Percentuais mínimos de vagas", "colunas": ["Aspecto", "50%", "20%"], "linhas": [["Destinação", "Educação profissional técnica de nível médio", "Licenciaturas e programas especiais de formação pedagógica"], ["Objetivo vinculado", "Art. 7º, I", "Art. 7º, VI, b"], ["Natureza", "Mínimo, em cada exercício", "Mínimo, em cada exercício"], ["Forma de cálculo", "Aluno-equivalente (regulamento do MEC)", "Aluno-equivalente (regulamento do MEC)"]]}], "pegadinhas": [{"texto": "O Colégio de Dirigentes é apenas CONSULTIVO; o Conselho Superior é consultivo E deliberativo. Inverter os caracteres é erro clássico.", "ref": "Art. 10, §§ 2º e 3º"}, {"texto": "A presidência do Colégio de Dirigentes e do Conselho Superior é do Reitor (ambos), e não de membro eleito do Conselho.", "ref": "Art. 10, § 1º"}, {"texto": "Os percentuais são MÍNIMOS: 50% para técnico de nível médio e 20% para licenciaturas/formação pedagógica — não 50% para superior nem 20% para técnico.", "ref": "Art. 8º"}, {"texto": "O percentual de 20% refere-se a licenciaturas (art. 7º, VI, b), não a cursos superiores de tecnologia nem a bacharelados.", "ref": "Art. 8º; art. 7º, VI, b"}, {"texto": "A Reitoria é composta por 1 Reitor e 5 Pró-Reitores (não 4 nem 6).", "ref": "Art. 11"}, {"texto": "Reitor é nomeado pelo Presidente da República; Diretor-Geral de campus e Pró-Reitores são nomeados pelo Reitor.", "ref": "Arts. 12, caput e § 3º; 13"}, {"texto": "Somente DOCENTES podem candidatar-se a Reitor; técnico-administrativos de nível superior podem ser Diretor-Geral e Pró-Reitor, mas não Reitor.", "ref": "Arts. 11, § 1º; 12, § 1º; 13, § 1º"}, {"texto": "Os pesos da consulta são iguais (1/3 cada) para docentes, técnico-administrativos e discentes — não 70% docentes, como em universidades.", "ref": "Arts. 12 e 13"}, {"texto": "Mandato de Reitor e de Diretor-Geral: 4 anos, permitida UMA recondução (máximo de 2 mandatos consecutivos).", "ref": "Arts. 12, 13 e 14, § 3º"}, {"texto": "Requisitos de Reitor exigem 5 anos de efetivo exercício em instituição federal de EPT E (doutorado OU Classe C nível 4/Titular do EBTT) — o doutorado não é obrigatório.", "ref": "Art. 12, § 1º"}, {"texto": "Para Diretor-Geral, bastam 2 anos em cargo/função de gestão na instituição (além dos 5 anos em EPT) — não 2 anos em qualquer órgão.", "ref": "Art. 13, § 1º, II"}, {"texto": "As Escolas Técnicas Vinculadas integram a Rede, mas NÃO têm natureza autárquica; pertencem à estrutura das universidades federais.", "ref": "Art. 1º, parágrafo único; art. 4º"}, {"texto": "Para regulação, avaliação e supervisão da educação superior, os IFs são equiparados às universidades federais; o Colégio Pedro II é equiparado aos IFs.", "ref": "Arts. 2º, § 1º e 4º-A, parágrafo único"}, {"texto": "A criação/extinção de cursos e o registro de diplomas pelos IFs dependem de autorização do Conselho Superior, nos limites da área de atuação territorial.", "ref": "Art. 2º, § 3º"}, {"texto": "A proposta orçamentária é identificada por campus e reitoria, EXCETO pessoal, encargos sociais e benefícios.", "ref": "Art. 9º"}, {"texto": "O prazo para o Reitor pro tempore encaminhar estatuto e PDI ao MEC é de no máximo 180 dias (não 90 nem 1 ano).", "ref": "Art. 14"}, {"texto": "O IFPA foi criado por INTEGRAÇÃO (CEFET-PA + Escolas Agrotécnicas de Castanhal e Marabá), não por transformação; sua Reitoria fica em Belém.", "ref": "Art. 5º, XX; Anexo I"}, {"texto": "Mudança de lotação entre campi do mesmo IF segue o instituto da REMOÇÃO (art. 36 da Lei 8.112), não da redistribuição.", "ref": "Art. 16, § 2º"}, {"texto": "A lista de campi de cada IF é definida por ato do Ministro da Educação, não pelo Conselho Superior.", "ref": "Art. 5º, § 5º"}, {"texto": "O ajuste da oferta de nível superior é autorizado pelo Conselho Superior com anuência do MEC, sem prejuízo do índice de 50%.", "ref": "Art. 8º, § 2º"}, {"texto": "CEFET-RJ e CEFET-MG não integram mais a Rede: o inciso III do art. 1º e o art. 18 foram revogados pela Lei 15.521/2026.", "ref": "Art. 1º, III; art. 18"}, {"texto": "Pela Lei 15.367/2026, o Presidente deve nomear obrigatoriamente o candidato a Reitor mais votado na consulta.", "ref": "Art. 12, caput"}], "erros_frequentes": [{"texto": "Afirmar que o Conselho Superior é presidido por representante eleito da comunidade: é presidido pelo Reitor.", "ref": "Art. 10, § 1º"}, {"texto": "Confundir 'pluricurriculares e multicampi' (IFs) com 'universidade especializada' (UTFPR).", "ref": "Arts. 2º e 3º"}, {"texto": "Supor que o Conselho Superior é composto apenas por servidores: inclui egressos, sociedade civil, MEC e Colégio de Dirigentes.", "ref": "Art. 10, § 3º"}, {"texto": "Citar a antiga exigência 'Classes DIV ou DV do EBTT ou Professor Associado' como vigente; a redação atual é Classe C, nível 4, ou Classe Titular do EBTT.", "ref": "Art. 12, § 1º, II"}, {"texto": "Considerar vigentes os trechos 'revogados pela MP 914/2019': a MP teve vigência encerrada.", "ref": "Arts. 11 a 14"}, {"texto": "Achar que a extinção do mandato de Reitor só ocorre pelo fim do prazo: também por aposentadoria, renúncia, destituição ou vacância.", "ref": "Art. 12, § 2º"}], "relacoes": [{"texto": "Relação com a Lei 8.112/90: a mudança de lotação de servidores entre campi do mesmo IF observa a remoção (art. 36).", "ext": false}, {"texto": "Relação com a LDB (Lei 9.394/96): a UTFPR é universidade especializada nos termos do art. 52, parágrafo único.", "ext": false}, {"texto": "Relação com a Lei 11.184/2005: rege princípios, finalidades e objetivos da UTFPR.", "ext": false}, {"texto": "Relação com a Lei 11.740/2008: alterada pelo art. 19 (criação de cargos e funções CD/FG para instituições federais de EPT e ensino superior).", "ext": false}, {"texto": "O Decreto nº 7.022/2009 ('Vide' no cabeçalho) estabelece medidas organizacionais excepcionais para a implantação da Rede Federal (uso de unidades orçamentárias/gestoras das instituições em transformação em 2009–2010). O 'Regulamento' dos arts. 11, 12 e 13 (processo de escolha de dirigentes) é o Decreto nº 6.986/2009. Conteúdo não reproduzido no PDF; conferido no Planalto.", "ext": true}, {"texto": "Para o IFPA, o estatuto e o regimento detalham as competências do Conselho Superior (CONSUP) e do Colégio de Dirigentes, conforme remissão do art. 10, § 4º.", "ext": true}], "perguntas": [{"p": "Quais instituições compõem a Rede Federal de EPCT atualmente?", "r": "Institutos Federais, UTFPR, Escolas Técnicas Vinculadas às Universidades Federais e Colégio Pedro II (o inciso III, CEFET-RJ e CEFET-MG, foi revogado pela Lei 15.521/2026).", "ref": "Art. 1º"}, {"p": "Qual a natureza jurídica dos IFs e quais autonomias possuem?", "r": "Autarquias, com autonomia administrativa, patrimonial, financeira, didático-pedagógica e disciplinar.", "ref": "Art. 1º, parágrafo único"}, {"p": "Como o art. 2º define os Institutos Federais?", "r": "Instituições de educação superior, básica e profissional, pluricurriculares e multicampi, especializadas na oferta de EPT nas diferentes modalidades, conjugando conhecimentos técnicos e tecnológicos com práticas pedagógicas.", "ref": "Art. 2º"}, {"p": "A que os IFs são equiparados e para quê?", "r": "Às universidades federais, para efeito da regulação, avaliação e supervisão das instituições e cursos de educação superior.", "ref": "Art. 2º, § 1º"}, {"p": "Quem autoriza os IFs a criar/extinguir cursos e registrar diplomas?", "r": "O Conselho Superior, nos limites da área de atuação territorial do IF; para EaD aplica-se legislação específica.", "ref": "Art. 2º, § 3º"}, {"p": "Como foi criado o IFPA e onde fica sua Reitoria?", "r": "Por integração do CEFET do Pará e das Escolas Agrotécnicas Federais de Castanhal e de Marabá; Reitoria em Belém.", "ref": "Art. 5º, XX; Anexo I"}, {"p": "O que acontece com as unidades de ensino das instituições transformadas ou integradas?", "r": "Passam automaticamente, independentemente de formalidade, à condição de campus do novo IF.", "ref": "Art. 5º, § 2º"}, {"p": "Quais os percentuais mínimos de vagas dos IFs?", "r": "Mínimo de 50% para educação profissional técnica de nível médio (art. 7º, I) e mínimo de 20% para licenciaturas e programas de formação pedagógica (art. 7º, VI, b), em cada exercício, pelo conceito de aluno-equivalente.", "ref": "Art. 8º"}, {"p": "Em que forma deve ser ofertada prioritariamente a educação técnica de nível médio?", "r": "Prioritariamente na forma de cursos integrados, para concluintes do ensino fundamental e público da EJA.", "ref": "Art. 7º, I"}, {"p": "Quais cursos superiores os IFs podem ministrar?", "r": "Tecnologia, licenciaturas e programas especiais de formação pedagógica, bacharelado e engenharia, pós-graduação lato sensu e stricto sensu (mestrado e doutorado).", "ref": "Art. 7º, VI"}, {"p": "Quais são os órgãos superiores da administração dos IFs?", "r": "O Colégio de Dirigentes e o Conselho Superior, ambos presididos pelo Reitor.", "ref": "Art. 10"}, {"p": "Qual a composição do Colégio de Dirigentes?", "r": "Reitor, Pró-Reitores e Diretor-Geral de cada campus; tem caráter consultivo.", "ref": "Art. 10, § 2º"}, {"p": "Qual a composição do Conselho Superior?", "r": "Representantes dos docentes, estudantes, técnico-administrativos, egressos, sociedade civil, MEC e Colégio de Dirigentes, assegurada representação paritária dos segmentos da comunidade acadêmica; caráter consultivo e deliberativo.", "ref": "Art. 10, § 3º"}, {"p": "Qual é o órgão executivo dos IFs e sua composição?", "r": "A Reitoria, composta por 1 Reitor e 5 Pró-Reitores.", "ref": "Art. 11"}, {"p": "Quem pode ser nomeado Pró-Reitor?", "r": "Servidor efetivo da carreira docente ou de cargo efetivo com nível superior da carreira TAE (PCCTAE), com no mínimo 5 anos de efetivo exercício em instituição federal de EPT.", "ref": "Art. 11, § 1º"}, {"p": "Como é escolhido o Reitor e qual seu mandato?", "r": "Nomeado pelo Presidente da República, obrigatoriamente o candidato mais votado na consulta à comunidade escolar (pesos 1/3 docentes, 1/3 TAEs, 1/3 discentes), para mandato de 4 anos, permitida uma recondução.", "ref": "Art. 12, caput"}, {"p": "Quais os requisitos para candidatura a Reitor?", "r": "Ser docente do Quadro de Pessoal Ativo Permanente de qualquer campus, com 5 anos de efetivo exercício em instituição federal de EPT e: título de doutor OU estar na Classe C, nível 4, ou Classe Titular do EBTT.", "ref": "Art. 12, § 1º"}, {"p": "Como se extingue o mandato de Reitor?", "r": "Pelo decurso do prazo ou, antes, por aposentadoria (voluntária ou compulsória), renúncia, destituição ou vacância do cargo.", "ref": "Art. 12, § 2º"}, {"p": "Quem nomeia o Diretor-Geral de campus e qual o mandato?", "r": "O Reitor, após consulta à comunidade do campus (1/3 cada segmento), para mandato de 4 anos, permitida uma recondução.", "ref": "Art. 13, caput"}, {"p": "Quais os requisitos para candidatura a Diretor-Geral de campus?", "r": "Docente efetivo ou TAE efetivo com formação de nível superior, com 5 anos em instituição federal de EPT e: requisitos de Reitor, OU 2 anos em cargo/função de gestão na instituição, OU curso de formação em gestão concluído com aproveitamento.", "ref": "Art. 13, § 1º"}, {"p": "Qual a estrutura do Colégio Pedro II segundo a lei?", "r": "A mesma estrutura e organização dos IFs; suas unidades escolares viraram campi automaticamente; novos campi dependem de autorização específica do MEC.", "ref": "Arts. 13-A e 13-B"}, {"p": "Qual o prazo do Reitor pro tempore para encaminhar estatuto e PDI ao MEC?", "r": "No máximo 180 dias, assegurada a participação da comunidade acadêmica.", "ref": "Art. 14"}, {"p": "Qual o limite de investidura para dirigentes pro tempore?", "r": "2 mandatos consecutivos; quem já está no segundo mandato não pode candidatar-se a novo.", "ref": "Art. 14, § 3º"}, {"p": "Como se constitui o patrimônio dos novos IFs?", "r": "Bens e direitos das instituições integrantes (transferidos automaticamente), bens e direitos que adquirir, doações ou legados, e incorporações de serviços realizados; uso exclusivo para seus objetivos, alienação só nos casos da lei.", "ref": "Art. 17"}, {"p": "Como ocorre a mudança de lotação de servidor entre campi do mesmo IF?", "r": "Observa o instituto da remoção, nos termos do art. 36 da Lei 8.112/90.", "ref": "Art. 16, § 2º"}, {"p": "Escola Técnica Vinculada não incluída no Anexo II pode integrar um IF?", "r": "Sim: mediante aprovação do Conselho Superior da sua universidade, pode propor ao MEC a adesão ao IF da mesma base territorial.", "ref": "Art. 5º, § 4º"}, {"p": "Quais escolas da UFPA constam do Anexo III?", "r": "Escola de Música e Escola de Teatro e Dança da Universidade Federal do Pará.", "ref": "Anexo III"}, {"p": "A proposta orçamentária dos IFs é identificada para quais unidades?", "r": "Para cada campus e para a reitoria, exceto pessoal, encargos sociais e benefícios aos servidores.", "ref": "Art. 9º"}], "cobertura": [{"item": "Capítulo I – Da Rede Federal de EPCT (arts. 1º–4º-A)", "status": "ok", "obs": "Inclui redações das Leis 12.677/2012 e 15.521/2026."}, {"item": "Capítulo II, Seção I – Da criação dos IFs (art. 5º, I–XXXIX, §§ 1º–6º)", "status": "ok", "obs": "Incisos agrupados por forma de criação; IFPA detalhado. Lista nominal completa de cada IF não reproduzida nó a nó."}, {"item": "Capítulo II, Seção II – Finalidades e características (art. 6º)", "status": "ok", "obs": ""}, {"item": "Capítulo II, Seção III – Objetivos (arts. 7º–8º)", "status": "ok", "obs": ""}, {"item": "Capítulo II, Seção IV – Estrutura organizacional (arts. 9º–13)", "status": "ok", "obs": "Considera redação vigente (Lei 15.367/2026); trechos da MP 914/2019 com vigência encerrada apenas sinalizados."}, {"item": "Capítulo II-A – Do Colégio Pedro II (arts. 13-A–13-B)", "status": "ok", "obs": ""}, {"item": "Capítulo III – Disposições gerais e transitórias (arts. 14–20)", "status": "ok", "obs": "Art. 18 revogado (Lei 15.521/2026), mencionado em nó de atenção. Art. 19 resumido (alterações na Lei 11.740/2008)."}, {"item": "Anexo I – Sedes das Reitorias", "status": "ok", "obs": "Todas as 39 sedes mapeadas (redação da Lei 15.367/2026); correspondências conferidas com o Planalto."}, {"item": "Anexo II – Escolas Técnicas Vinculadas integradas aos IFs", "status": "ok", "obs": ""}, {"item": "Anexo III – Escolas Técnicas Vinculadas às Universidades Federais", "status": "parcial", "obs": "Destacadas as escolas da UFPA e as incluídas pela Lei 15.521/2026; demais resumidas por universidade."}], "nao_verificado": ["Conferido: no PDF o Anexo I tem as colunas desalinhadas (IF de Minas Gerais e IF de Mato Grosso aparecem sem sede e as sedes seguintes deslocadas; Aracaju e Palmas sobram no fim). As correspondências do mapa (ex.: IFPA–Belém, IF Sertão Paraibano–Patos) foram confirmadas no texto do Planalto (redação da Lei 15.367/2026).", "Conferido: art. 11, § 1º, art. 12, art. 13 e art. 14, § 2º aparecem no PDF com redações sobrepostas (original, MP 914/2019 com 'Vigência Encerrada', Leis 12.772/2012 e 15.367/2026); o mapa usa a redação vigente (Lei 12.772/2012 no art. 11, § 1º; Lei 15.367/2026 no art. 12, caput e § 1º, II, e no art. 13, § 1º), igual à do Planalto.", "O 'Regulamento' dos arts. 11, 12 e 13 (Decreto 6.986/2009, escolha de dirigentes) e o Decreto 7.022/2009 ('Vide', medidas excepcionais de implantação da Rede) não têm conteúdo no PDF; identificados no Planalto e registrados só em relações (ext).", "Conferido: no Anexo III o PDF (e o Planalto) grafa 'UFP' e 'UFRP', mas a coluna ao lado traz Universidade Federal do Pará e Universidade Federal Rural de Pernambuco; o mapa usa UFPA/UFRPE."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
