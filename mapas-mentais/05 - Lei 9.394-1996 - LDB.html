<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lei nº 9.394/1996 – LDB</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;
  --c-excecao:#be123c; --c-competencia:#0e7490; --c-sancao:#9f1239; --c-exemplo:#a16207; --c-atencao:#d97706;
  --mark:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
    --mark:#7a5d00;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}
</style>

<style>
#lt-btn{position:fixed;right:16px;bottom:16px;z-index:9999;width:46px;height:46px;border-radius:50%;border:1px solid var(--line,#ccc);background:var(--panel,var(--paper,#fff));color:var(--ink,#111);font:700 16px/1 system-ui,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#lt-btn:hover{border-color:var(--accent,#2f5fd0)}
#lt-pn{position:fixed;right:16px;bottom:72px;z-index:9999;width:min(330px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel,var(--paper,#fff));color:var(--ink,#111);border:1px solid var(--line,#ccc);border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
#lt-pn[hidden]{display:none}
body:has(button.localizar.flutua) #lt-btn{bottom:76px}
body:has(button.localizar.flutua) #lt-pn{bottom:132px}
#lt-pn h3{margin:0 0 10px;font-size:15px}
#lt-pn h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#666)}
#lt-pn .lt-g{display:flex;flex-wrap:wrap;gap:6px}
#lt-pn .lt-s{width:38px;height:38px;border-radius:8px;border:1px solid rgba(128,128,128,.45);cursor:pointer;padding:0;font:700 14px/1 Georgia,serif;display:flex;align-items:center;justify-content:center}
#lt-pn .lt-s.on{outline:3px solid var(--accent,#2f5fd0);outline-offset:1px}
#lt-pn .lt-s.def{font:600 10px/1 system-ui,sans-serif;background:var(--soft,#eee);color:var(--ink,#111)}
#lt-pn label.lt-c{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted,#666)}
#lt-pn input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line,#ccc);border-radius:6px;background:none;cursor:pointer}
#lt-pn .lt-r{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
#lt-pn .lt-ct{font-size:12px;color:var(--muted,#666)}
#lt-pn .lt-ct.baixo{color:#c0392b;font-weight:600}
#lt-pn button.lt-x{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line,#ccc);background:var(--soft,#eee);color:var(--ink,#111);cursor:pointer}
@media print{#lt-btn,#lt-pn{display:none!important}}
</style>
<script>
(function(){
var KEY='mm-leitura', root=document.documentElement;
var FUNDOS=[
 ['Branco','#ffffff'],['Creme','#fbf6e9'],['Sépia','#f4ecd8'],['Papel antigo','#ece0c6'],
 ['Verde suave','#e7f0e3'],['Azul suave','#e5edf5'],['Cinza-claro','#eceff1'],['Lavanda','#efebf6'],
 ['Cinza-escuro','#2b2f36'],['Sépia escuro','#2a231b'],['Verde-noite','#1a2520'],['Noturno','#121417']];
var LETRAS=[
 ['Preto','#111111'],['Grafite','#343a44'],['Marrom','#4a3423'],['Azul-marinho','#1c2a4d'],
 ['Verde-escuro','#1f3d2b'],['Vinho','#5c1f2c'],['Branco-gelo','#eef1f5'],['Bege claro','#e9dcc0'],
 ['Âmbar','#f0c674'],['Verde-claro','#b9e0c1'],['Azul-claro','#b7cdf2']];
var VARS=['--bg','--panel','--paper','--soft','--line','--muted','--code-bg','--ink','color-scheme'];
function ler(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function salvar(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function escuro(h){return lum(h)<.18}
function contraste(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var st=ler();
function aplicar(){
  var r=root.style; VARS.forEach(function(v){r.removeProperty(v)});
  if(st.bg){
    var d=escuro(st.bg), mx=d?'#ffffff':'#000000';
    root.dataset.theme=d?'dark':'light';
    r.setProperty('--panel',st.bg); r.setProperty('--paper',st.bg);
    r.setProperty('--bg','color-mix(in srgb,'+st.bg+' '+(d?'92%':'95%')+','+mx+')');
    r.setProperty('--soft','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--code-bg','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--line','color-mix(in srgb,'+st.bg+' '+(d?'78%':'84%')+','+mx+')');
    r.setProperty('color-scheme',d?'dark':'light');
  } else {
    var th=null; try{th=localStorage.getItem('mm-theme')}catch(e){}
    if(th) root.dataset.theme=th; else delete root.dataset.theme;
  }
  if(st.ink){
    r.setProperty('--ink',st.ink);
    r.setProperty('--muted','color-mix(in srgb,'+st.ink+' 72%,var(--panel,var(--paper,#888)))');
  }
}
aplicar();
function corFundoAtual(){
  var probe=document.getElementById('lt-pn')||document.body;
  var c=getComputedStyle(probe).backgroundColor.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#ffffff';
}
function corTextoAtual(){
  var c=getComputedStyle(document.body).color.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#111111';
}
function montar(){
  aplicar();
  var b=document.createElement('button'); b.id='lt-btn'; b.type='button'; b.title='Cores de leitura (fundo e letras)'; b.setAttribute('aria-label','Cores de leitura'); b.textContent='Aa';
  var p=document.createElement('div'); p.id='lt-pn'; p.hidden=true; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Cores de leitura');
  function grade(lista,chave,ehFundo){
    var h='<div class="lt-g"><button type="button" class="lt-s def" data-k="'+chave+'" data-v="" title="Padrão do tema">padrão</button>';
    lista.forEach(function(x){
      h+='<button type="button" class="lt-s" data-k="'+chave+'" data-v="'+x[1]+'" title="'+x[0]+'" style="'+(ehFundo?'background:'+x[1]+';color:'+(escuro(x[1])?'#eee':'#222'):'background:var(--panel,var(--paper,#fff));color:'+x[1])+'">'+(ehFundo?'':'Aa')+'</button>';
    });
    return h+'</div>';
  }
  p.innerHTML='<h3>Cores de leitura</h3>'+
   '<h4>Cor do fundo</h4>'+grade(FUNDOS,'bg',true)+
   '<label class="lt-c"><input type="color" data-k="bg"> Outra cor de fundo</label>'+
   '<h4>Cor das letras</h4>'+grade(LETRAS,'ink',false)+
   '<label class="lt-c"><input type="color" data-k="ink"> Outra cor de letra</label>'+
   '<div class="lt-r"><span class="lt-ct"></span><button type="button" class="lt-x">Restaurar padrão</button></div>';
  document.body.appendChild(p); document.body.appendChild(b);
  function sync(){
    p.querySelectorAll('.lt-s').forEach(function(s){s.classList.toggle('on',(st[s.dataset.k]||'')===s.dataset.v)});
    var bg=corFundoAtual(), ink=corTextoAtual();
    p.querySelector('input[data-k=bg]').value=st.bg||bg;
    p.querySelector('input[data-k=ink]').value=st.ink||ink;
    var c=contraste(bg,ink), el=p.querySelector('.lt-ct');
    el.textContent='Contraste '+c.toFixed(1)+':1'+(c<4.5?' (baixo para leitura)':'');
    el.classList.toggle('baixo',c<4.5);
  }
  function definir(k,v){ if(v) st[k]=v; else delete st[k]; salvar(st); aplicar(); sync(); }
  p.addEventListener('click',function(e){
    var s=e.target.closest('.lt-s'); if(s) definir(s.dataset.k,s.dataset.v);
    if(e.target.closest('.lt-x')){ st={}; salvar(st); aplicar(); sync(); }
  });
  p.addEventListener('input',function(e){ if(e.target.type==='color') definir(e.target.dataset.k,e.target.value); });
  b.addEventListener('click',function(){ p.hidden=!p.hidden; if(!p.hidden) sync(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') p.hidden=true; });
  document.addEventListener('click',function(e){ if(!p.hidden&&!p.contains(e.target)&&e.target!==b) p.hidden=true; });
  // O botão ◐ (claro/escuro) das páginas volta o fundo ao padrão do tema escolhido
  var tb=document.getElementById('themeBtn');
  if(tb) tb.addEventListener('click',function(){ if(st.bg){ delete st.bg; salvar(st); aplicar(); } });
  window.addEventListener('storage',function(e){ if(e.key===KEY){ st=ler(); aplicar(); if(!p.hidden) sync(); } });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar); else montar();
})();
</script>

2/2018.", "ref": "Art. 3º, XIII"}, {"t": "XIV – respeito à diversidade humana, linguística, cultural e identitária das pessoas surdas, surdo-cegas e com deficiência auditiva", "tipo": "conceito", "d": "Incluído pela Lei nº 14.191/2021.", "ref": "Art. 3º, XIV"}, {"t": "XV – garantia do direito de acesso a informações públicas sobre a gestão da educação", "tipo": "conceito", "d": "Incluído pela Lei nº 15.001/2024.", "ref": "Art. 3º, XV"}, {"t": "Hoje são 15 princípios (a redação original tinha 11: I a XI)", "tipo": "atencao", "d": "Incisos XII a XV foram acrescidos de 2013 a 2024. Contagem original conforme o mapa antigo (redação de 1996).", "ref": "Art. 3º, XII–XV"}]}]}]}}, {"id": "ldb-A-titulo-3", "titulo": "Título III – Do Direito à Educação e do Dever de Educar (arts. 4º–7º-A)", "raiz": {"t": "Título III – Do Direito à Educação e do Dever de Educar (arts. 4º–7º-A)", "tipo": "topico", "filhos": [{"t": "Dever do Estado com a educação escolar pública – garantias", "tipo": "classificacao", "ref": "Art. 4º, caput", "filhos": [{"t": "I – educação básica OBRIGATÓRIA e GRATUITA dos 4 aos 17 anos", "tipo": "prazo", "d": "Organizada em: a) pré-escola; b) ensino fundamental; c) ensino médio. Redação da Lei nº 12.796/2013.", "ref": "Art. 4º, I", "filhos": [{"t": "Etapas obrigatórias: pré-escola, fundamental e médio", "tipo": "classificacao", "ref": "Art. 4º, I, a–c"}, {"t": "A creche NÃO consta entre as etapas obrigatórias (só a pré-escola)", "tipo": "atencao", "ref": "Art. 4º, I, a"}, {"t": "Redação original (1996): obrigatório e gratuito só o ensino fundamental; médio com “progressiva extensão”", "tipo": "atencao", "d": "Mudança cobrada em prova: hoje a obrigatoriedade vai dos 4 aos 17 anos (Lei 12.796/2013, na esteira da EC 59/2009).", "ref": "Art. 4º, I", "ext": true}]}, {"t": "II – educação infantil GRATUITA às crianças de até 5 anos", "tipo": "prazo", "d": "Redação da Lei nº 12.796/2013.", "ref": "Art. 4º, II", "filhos": [{"t": "Gratuita ≠ obrigatória: a creche (até 3 anos) é gratuita, mas não obrigatória", "tipo": "atencao", "ref": "Arts. 4º, I e II; 30"}]}, {"t": "III – atendimento educacional especializado (AEE) gratuito", "tipo": "regra", "d": "Aos educandos com deficiência, transtornos globais do desenvolvimento e altas habilidades ou superdotação; transversal a todos os níveis, etapas e modalidades; PREFERENCIALMENTE na rede regular de ensino.", "ref": "Art. 4º, III", "filhos": [{"t": "“Preferencialmente” na rede regular – não “exclusivamente”", "tipo": "atencao", "ref": "Art. 4º, III"}]}, {"t": "IV – acesso público e gratuito aos ensinos fundamental e médio para quem não os concluiu na idade própria", "tipo": "regra", "ref": "Art. 4º, IV"}, {"t": "V – acesso aos níveis mais elevados do ensino, da pesquisa e da criação artística, segundo a capacidade de cada um", "tipo": "regra", "ref": "Art. 4º, V"}, {"t": "VI – oferta de ensino noturno regular, adequado às condições do educando", "tipo": "regra", "ref": "Art. 4º, VI"}, {"t": "VII – educação escolar regular para jovens e adultos", "tipo": "regra", "d": "Com características e modalidades adequadas às suas necessidades e disponibilidades; aos trabalhadores, garantem-se condições de acesso e permanência na escola.", "ref": "Art. 4º, VII"}, {"t": "VIII – programas suplementares em TODAS as etapas da educação básica", "tipo": "classificacao", "d": "Material didático-escolar, transporte, alimentação e assistência à saúde (redação da Lei nº 12.796/2013).", "ref": "Art. 4º, VIII", "filhos": [{"t": "Redação original: programas suplementares só no ensino fundamental", "tipo": "atencao", "ref": "Art. 4º, VIII", "ext": true}]}, {"t": "IX – padrões mínimos de qualidade do ensino", "tipo": "conceito", "d": "Variedade e quantidade mínimas, por aluno, de insumos indispensáveis ao processo de ensino-aprendizagem, adequados à idade e às necessidades de cada estudante, inclusive mobiliário, equipamentos e materiais pedagógicos apropriados (Lei nº 14.333/2022).", "ref": "Art. 4º, IX"}, {"t": "X – vaga na escola pública de educação infantil ou fundamental MAIS PRÓXIMA da residência", "tipo": "prazo", "d": "A toda criança a partir do dia em que completar 4 anos (incluído pela Lei nº 11.700/2008).", "ref": "Art. 4º, X"}, {"t": "XI – alfabetização plena e capacitação gradual para a leitura ao longo da educação básica", "tipo": "regra", "d": "Requisitos indispensáveis para a efetivação dos direitos e objetivos de aprendizagem e para o desenvolvimento dos indivíduos (Lei nº 14.407/2022).", "ref": "Art. 4º, XI"}, {"t": "XII – educação digital", "tipo": "regra", "d": "Garantia de conectividade de todas as instituições públicas de educação básica e superior à internet em alta velocidade, adequada ao uso pedagógico; competências de letramento digital de jovens e adultos, criação de conteúdos digitais, comunicação e colaboração, segurança e resolução de problemas (Lei nº 14.533/2023).", "ref": "Art. 4º, XII", "filhos": [{"t": "Ensino e aprendizagem digital: técnicas, ferramentas e recursos que fortaleçam docência e aprendizagem", "tipo": "regra", "d": "Devem fortalecer os papéis de docência e aprendizagem do professor e do aluno e criar espaços coletivos de mútuo desenvolvimento.", "ref": "Art. 4º, parágrafo único"}]}, {"t": "XIII – água potável e infraestrutura física e sanitária adequadas no ambiente escolar", "tipo": "regra", "d": "Incluído pela Lei nº 15.276/2025.", "ref": "Art. 4º, XIII"}]}, {"t": "Atendimento educacional ao aluno internado (classe hospitalar/domiciliar)", "tipo": "regra", "d": "Assegurado, durante o período de internação, ao aluno da EDUCAÇÃO BÁSICA internado para tratamento de saúde em regime hospitalar ou domiciliar por tempo prolongado, conforme regulamento do Poder Público na esfera de sua competência federativa (Lei nº 13.716/2018).", "ref": "Art. 4º-A"}, {"t": "Acesso à educação básica obrigatória = direito público subjetivo", "tipo": "conceito", "d": "Redação da Lei nº 12.796/2013 (o texto original falava em acesso ao ensino fundamental).", "ref": "Art. 5º, caput", "filhos": [{"t": "Legitimados para acionar o poder público", "tipo": "competencia", "d": "Qualquer cidadão, grupo de cidadãos, associação comunitária, organização sindical, entidade de classe ou outra legalmente constituída e, ainda, o Ministério Público.", "ref": "Art. 5º, caput"}, {"t": "Deveres do poder público, na esfera de sua competência federativa", "tipo": "competencia", "ref": "Art. 5º, § 1º", "filhos": [{"t": "I – recensear ANUALMENTE crianças e adolescentes em idade escolar e jovens e adultos sem educação básica concluída", "tipo": "regra", "ref": "Art. 5º, § 1º, I"}, {"t": "II – fazer-lhes a chamada pública", "tipo": "regra", "ref": "Art. 5º, § 1º, II"}, {"t": "III – zelar, junto aos pais ou responsáveis, pela frequência à escola", "tipo": "regra", "ref": "Art. 5º, § 1º, III"}, {"t": "IV – divulgar a lista de espera por vagas, inclusive creches", "tipo": "regra", "d": "Por ordem de colocação e, sempre que possível, por unidade escolar; divulgar também os critérios de elaboração da lista (Lei nº 14.685/2023).", "ref": "Art. 5º, § 1º, IV"}, {"t": "V – garantir a pais, responsáveis e estudantes acesso aos resultados das avaliações de qualidade e rendimento", "tipo": "regra", "d": "Avaliações realizadas diretamente pelo poder público ou em parceria com organizações internacionais (Lei nº 15.001/2024).", "ref": "Art. 5º, § 1º, V"}, {"t": "Redação original: competia a Estados e Municípios, em colaboração e com assistência da União", "tipo": "atencao", "ref": "Art. 5º, § 1º", "ext": true}]}, {"t": "Prioridade: primeiro o ensino obrigatório; depois demais níveis e modalidades", "tipo": "regra", "d": "Em todas as esferas administrativas, conforme as prioridades constitucionais e legais.", "ref": "Art. 5º, § 2º"}, {"t": "Ação judicial GRATUITA e de RITO SUMÁRIO", "tipo": "regra", "d": "Qualquer dos legitimados do caput pode peticionar no Judiciário na hipótese do § 2º do art. 208 da CF.", "ref": "Art. 5º, § 3º"}, {"t": "Negligência da autoridade em garantir o ensino obrigatório → crime de responsabilidade", "tipo": "sancao", "d": "“Poderá ela ser imputada por crime de responsabilidade”, comprovada a negligência.", "ref": "Art. 5º, § 4º"}, {"t": "Formas alternativas de acesso, independentemente da escolarização anterior", "tipo": "regra", "ref": "Art. 5º, § 5º"}, {"t": "Transparência de dados educacionais (Lei nº 15.017/2024)", "tipo": "topico", "ref": "Art. 5º, §§ 6º–8º", "filhos": [{"t": "Acesso público às informações do censo anual e dos exames e sistemas de avaliação da educação básica", "tipo": "regra", "d": "Nos termos de regulamento, considerado todo o processo de realização dessas atividades.", "ref": "Art. 5º, § 6º"}, {"t": "Sistemas de informações e estatísticas educacionais: dever de transparência e publicidade + LAI", "tipo": "regra", "d": "Vale para União, Estados, DF e Municípios, administração direta e indireta; direito fundamental de acesso à informação da Lei nº 12.527/2011.", "ref": "Art. 5º, § 7º"}, {"t": "Dados e microdados tratados, divulgados e compartilhados, sempre que possível, de forma ANONIMIZADA", "tipo": "regra", "d": "Dados agregados e desagregados de políticas censitárias, avaliativas ou regulatórias; parâmetros de anonimização em regulamento.", "ref": "Art. 5º, § 8º"}, {"t": "§§ 6º a 8º aplicam-se também ao censo, exames e avaliação da EDUCAÇÃO SUPERIOR", "tipo": "regra", "ref": "Art. 5º-A"}]}]}, {"t": "Dever dos pais/responsáveis: matricular na educação básica a partir dos 4 anos", "tipo": "prazo", "d": "Redação da Lei nº 12.796/2013.", "ref": "Art. 6º", "filhos": [{"t": "Evolução: 7 anos (1996) → 6 anos (Lei 11.114/2005) → 4 anos (Lei 12.796/2013)", "tipo": "atencao", "ref": "Art. 6º", "ext": true}]}, {"t": "Ensino livre à iniciativa privada – condições", "tipo": "classificacao", "ref": "Art. 7º", "filhos": [{"t": "I – cumprir normas gerais da educação nacional e do respectivo sistema", "tipo": "regra", "ref": "Art. 7º, I"}, {"t": "II – autorização de funcionamento e avaliação de qualidade pelo Poder Público", "tipo": "regra", "ref": "Art. 7º, II"}, {"t": "III – capacidade de autofinanciamento", "tipo": "regra", "ref": "Art. 7º, III", "filhos": [{"t": "Ressalvado o art. 213 da CF", "tipo": "excecao", "ref": "Art. 7º, III", "filhos": [{"t": "CF, art. 213: recursos públicos podem ir a escolas comunitárias, confessionais ou filantrópicas", "tipo": "atencao", "ref": "Art. 7º, III", "ext": true}]}]}]}, {"t": "Escusa de consciência religiosa: ausência a prova ou aula (Lei nº 13.796/2019)", "tipo": "regra", "d": "Aluno regularmente matriculado em instituição pública ou privada, de QUALQUER nível, pode ausentar-se de prova ou aula marcada para dia em que sua religião vede tais atividades, nos termos do art. 5º, VIII, da CF.", "ref": "Art. 7º-A", "filhos": [{"t": "Requisito: prévio e motivado requerimento", "tipo": "regra", "ref": "Art. 7º-A, caput"}, {"t": "Prestação alternativa: a critério da instituição e SEM CUSTOS para o aluno", "tipo": "classificacao", "ref": "Art. 7º-A, caput", "filhos": [{"t": "I – prova ou aula de reposição em data alternativa", "tipo": "exemplo", "d": "No turno de estudo do aluno ou em outro horário agendado com sua anuência expressa.", "ref": "Art. 7º-A, I"}, {"t": "II – trabalho escrito ou outra atividade de pesquisa", "tipo": "exemplo", "d": "Com tema, objetivo e data de entrega definidos pela instituição de ensino.", "ref": "Art. 7º-A, II"}]}, {"t": "Deve observar os parâmetros curriculares e o plano de aula do dia da ausência", "tipo": "regra", "ref": "Art. 7º-A, § 1º"}, {"t": "Cumprida, substitui a obrigação original para todos os efeitos, inclusive registro de frequência", "tipo": "regra", "ref": "Art. 7º-A, § 2º"}, {"t": "Adaptação progressiva das instituições no prazo de 2 anos", "tipo": "prazo", "ref": "Art. 7º-A, § 3º"}, {"t": "NÃO se aplica ao ensino militar (art. 83)", "tipo": "excecao", "ref": "Art. 7º-A, § 4º"}]}]}}, {"id": "ldb-A-titulo-4-incumbencias", "titulo": "Título IV – Organização da educação nacional: sistemas e incumbências (arts. 8º–13)", "raiz": {"t": "Título IV – Organização da educação nacional: sistemas e incumbências (arts. 8º–13)", "tipo": "topico", "filhos": [{"t": "Regime de colaboração: União, Estados, DF e Municípios organizam seus sistemas de ensino", "tipo": "conceito", "ref": "Art. 8º, caput", "filhos": [{"t": "União: coordenação da política nacional de educação", "tipo": "competencia", "d": "Articula os diferentes níveis e sistemas e exerce função NORMATIVA, REDISTRIBUTIVA e SUPLETIVA em relação às demais instâncias.", "ref": "Art. 8º, § 1º"}, {"t": "Sistemas de ensino têm liberdade de organização, nos termos desta Lei", "tipo": "regra", "ref": "Art. 8º, § 2º"}]}, {"t": "Incumbências da UNIÃO", "tipo": "competencia", "ref": "Art. 9º", "filhos": [{"t": "I – elaborar o Plano Nacional de Educação (PNE), em colaboração com Estados, DF e Municípios", "tipo": "competencia", "ref": "Art. 9º, I"}, {"t": "II – organizar, manter e desenvolver órgãos e instituições do sistema federal e o dos Territórios", "tipo": "competencia", "ref": "Art. 9º, II"}, {"t": "III – assistência técnica e financeira a Estados, DF e Municípios", "tipo": "competencia", "d": "Para desenvolvimento de seus sistemas e atendimento prioritário à escolaridade obrigatória; função redistributiva e supletiva.", "ref": "Art. 9º, III"}, {"t": "IV – competências e diretrizes para EI, EF e EM (em colaboração)", "tipo": "competencia", "d": "Nortearão os currículos e seus conteúdos mínimos, para assegurar formação básica comum.", "ref": "Art. 9º, IV"}, {"t": "IV-A – diretrizes para identificação, cadastramento e atendimento de alunos com altas habilidades/superdotação", "tipo": "competencia", "d": "Na educação básica e superior, em colaboração com Estados, DF e Municípios (Lei nº 13.234/2015).", "ref": "Art. 9º, IV-A"}, {"t": "V – coletar, analisar e disseminar informações sobre a educação", "tipo": "competencia", "ref": "Art. 9º, V"}, {"t": "VI – processo nacional de avaliação do rendimento escolar no ensino fundamental, médio e superior", "tipo": "competencia", "d": "Em colaboração com os sistemas, para definir prioridades e melhorar a qualidade do ensino.", "ref": "Art. 9º, VI"}, {"t": "VII – baixar normas gerais sobre cursos de graduação e pós-graduação", "tipo": "competencia", "ref": "Art. 9º, VII"}, {"t": "VII-A – avaliação nacional das instituições e cursos de educação profissional técnica e tecnológica", "tipo": "competencia", "d": "Em colaboração com os sistemas de ensino (Lei nº 14.645/2023).", "ref": "Art. 9º, VII-A"}, {"t": "VIII – processo nacional de avaliação das instituições de educação superior", "tipo": "competencia", "d": "Com a cooperação dos sistemas responsáveis por esse nível.", "ref": "Art. 9º, VIII"}, {"t": "IX – autorizar, reconhecer, credenciar, supervisionar e avaliar cursos das IES e estabelecimentos do seu sistema", "tipo": "competencia", "ref": "Art. 9º, IX"}, {"t": "Conselho Nacional de Educação (CNE)", "tipo": "competencia", "d": "Funções normativas e de supervisão e atividade permanente; criado por lei.", "ref": "Art. 9º, § 1º"}, {"t": "Para os incisos V a IX, a União tem acesso a todos os dados de todos os estabelecimentos e órgãos educacionais", "tipo": "regra", "ref": "Art. 9º, § 2º"}, {"t": "Inciso IX pode ser DELEGADO a Estados e DF que mantenham instituições de educação superior", "tipo": "excecao", "d": "Não há previsão de delegação a Municípios.", "ref": "Art. 9º, § 3º"}]}, {"t": "Incumbências dos ESTADOS", "tipo": "competencia", "ref": "Art. 10", "filhos": [{"t": "I – organizar, manter e desenvolver órgãos e instituições oficiais dos seus sistemas", "tipo": "competencia", "ref": "Art. 10, I"}, {"t": "II – definir com os Municípios formas de colaboração na oferta do ensino fundamental", "tipo": "competencia", "d": "Distribuição proporcional das responsabilidades, conforme a população a ser atendida e os recursos financeiros de cada esfera.", "ref": "Art. 10, II"}, {"t": "III – elaborar e executar políticas e planos educacionais, integrando e coordenando as ações dos seus Municípios", "tipo": "competencia", "d": "Em consonância com as diretrizes e planos nacionais.", "ref": "Art. 10, III"}, {"t": "IV – autorizar, reconhecer, credenciar, supervisionar e avaliar cursos das IES e estabelecimentos do seu sistema", "tipo": "competencia", "ref": "Art. 10, IV"}, {"t": "V – baixar normas complementares para o seu sistema", "tipo": "competencia", "ref": "Art. 10, V"}, {"t": "VI – ASSEGURAR o ensino fundamental e oferecer, com PRIORIDADE, o ensino médio a todos que o demandarem", "tipo": "competencia", "d": "Respeitado o art. 38 (redação da Lei nº 12.061/2009).", "ref": "Art. 10, VI"}, {"t": "VII – assumir o transporte escolar dos alunos da rede ESTADUAL", "tipo": "competencia", "d": "Permitindo aos respectivos professores, em trechos autorizados, o uso de assentos vagos nos veículos (Lei nº 14.862/2024).", "ref": "Art. 10, VII"}, {"t": "VIII – instituir Conselhos Escolares e Fóruns dos Conselhos Escolares, na forma da lei do art. 14", "tipo": "competencia", "d": "Lei nº 14.644/2023.", "ref": "Art. 10, VIII"}, {"t": "IX – articular-se com os Municípios sobre o transporte escolar", "tipo": "competencia", "d": "Para que o transporte das redes estadual (art. 10, VII) e municipal (art. 11, VI) atenda melhor alunos e professores (Lei nº 14.862/2024).", "ref": "Art. 10, IX"}, {"t": "DF: aplicam-se as competências de Estados E de Municípios", "tipo": "competencia", "ref": "Art. 10, parágrafo único"}]}, {"t": "Incumbências dos MUNICÍPIOS", "tipo": "competencia", "ref": "Art. 11", "filhos": [{"t": "I – organizar, manter e desenvolver órgãos e instituições dos seus sistemas", "tipo": "competencia", "d": "Integrando-os às políticas e planos educacionais da União e dos Estados.", "ref": "Art. 11, I"}, {"t": "II – exercer ação redistributiva em relação às suas escolas", "tipo": "competencia", "ref": "Art. 11, II"}, {"t": "III – baixar normas complementares para o seu sistema", "tipo": "competencia", "ref": "Art. 11, III"}, {"t": "IV – autorizar, credenciar e supervisionar os estabelecimentos do seu sistema", "tipo": "competencia", "ref": "Art. 11, IV", "filhos": [{"t": "Município não “reconhece” nem “avalia” (verbos dos arts. 9º, IX e 10, IV)", "tipo": "atencao", "ref": "Art. 11, IV"}]}, {"t": "V – oferecer educação infantil (creches e pré-escolas) e, com PRIORIDADE, o ensino fundamental", "tipo": "competencia", "d": "Educação infantil nas zonas urbanas e rurais, na proporção da distribuição populacional (Lei nº 15.369/2026).", "ref": "Art. 11, V", "filhos": [{"t": "Atuação em outros níveis SOMENTE com necessidades da sua área plenamente atendidas e recursos ACIMA dos mínimos constitucionais", "tipo": "excecao", "d": "Recursos acima dos percentuais mínimos vinculados pela CF à manutenção e desenvolvimento do ensino.", "ref": "Art. 11, V"}]}, {"t": "VI – assumir o transporte escolar dos alunos da rede MUNICIPAL", "tipo": "competencia", "d": "Permitindo aos professores, em trechos autorizados, o uso de assentos vagos (Lei nº 14.862/2024).", "ref": "Art. 11, VI"}, {"t": "VII – instituir Conselhos Escolares e Fóruns dos Conselhos Escolares, na forma da lei do art. 14", "tipo": "competencia", "d": "Lei nº 14.644/2023.", "ref": "Art. 11, VII"}, {"t": "Opção: integrar-se ao sistema estadual ou compor com ele sistema único de educação básica", "tipo": "regra", "ref": "Art. 11, parágrafo único"}]}, {"t": "Incumbências dos ESTABELECIMENTOS de ensino", "tipo": "competencia", "d": "Respeitadas as normas comuns e as do seu sistema de ensino.", "ref": "Art. 12", "filhos": [{"t": "I – ELABORAR e executar sua proposta pedagógica", "tipo": "competencia", "ref": "Art. 12, I"}, {"t": "II – administrar seu pessoal e seus recursos materiais e financeiros", "tipo": "competencia", "ref": "Art. 12, II"}, {"t": "III – assegurar o cumprimento dos dias letivos e horas-aula estabelecidas", "tipo": "competencia", "ref": "Art. 12, III"}, {"t": "IV – velar pelo cumprimento do plano de trabalho de cada docente", "tipo": "competencia", "ref": "Art. 12, IV"}, {"t": "V – prover meios para recuperação dos alunos de menor rendimento", "tipo": "competencia", "ref": "Art. 12, V"}, {"t": "VI – articular-se com as famílias e a comunidade (integração sociedade-escola)", "tipo": "competencia", "ref": "Art. 12, VI"}, {"t": "VII – informar pai e mãe, conviventes ou não com os filhos, e responsáveis legais", "tipo": "competencia", "d": "Sobre frequência e rendimento dos alunos e execução da proposta pedagógica (Lei nº 12.013/2009).", "ref": "Art. 12, VII"}, {"t": "VIII – notificar ao Conselho Tutelar do Município (Lei nº 15.231/2025)", "tipo": "competencia", "ref": "Art. 12, VIII", "filhos": [{"t": "a) alunos com faltas acima de 30% do percentual permitido em lei", "tipo": "prazo", "ref": "Art. 12, VIII, a"}, {"t": "b) ocorrências e dados de violência envolvendo alunos", "tipo": "regra", "d": "Especialmente automutilações, tentativas de suicídio e suicídios consumados.", "ref": "Art. 12, VIII, b"}, {"t": "Notificação vai só ao Conselho Tutelar; redações antigas incluíam juiz e MP e o patamar de 50%", "tipo": "atencao", "d": "Histórico: Lei 10.287/2001 (Conselho Tutelar, juiz e MP; 50%) → Lei 13.803/2019 (Conselho Tutelar; 30%) → Lei 15.231/2025 (alínea b, violência).", "ref": "Art. 12, VIII", "ext": true}]}, {"t": "IX – conscientização, prevenção e combate a todos os tipos de violência, especialmente bullying", "tipo": "competencia", "d": "Intimidação sistemática (bullying), no âmbito das escolas (Lei nº 13.663/2018).", "ref": "Art. 12, IX"}, {"t": "X – ações para promover a cultura de paz nas escolas", "tipo": "competencia", "d": "Lei nº 13.663/2018.", "ref": "Art. 12, X"}, {"t": "XI – ambiente escolar seguro: prevenção e enfrentamento ao uso ou dependência de drogas", "tipo": "competencia", "d": "Lei nº 13.840/2019.", "ref": "Art. 12, XI"}, {"t": "XII – instituir os Conselhos Escolares, na forma da lei do art. 14", "tipo": "competencia", "d": "Lei nº 14.644/2023.", "ref": "Art. 12, XII"}]}, {"t": "Incumbências dos DOCENTES", "tipo": "competencia", "ref": "Art. 13", "filhos": [{"t": "I – PARTICIPAR da elaboração da proposta pedagógica", "tipo": "competencia", "ref": "Art. 13, I", "filhos": [{"t": "Estabelecimento ELABORA (art. 12, I); docente PARTICIPA da elaboração", "tipo": "atencao", "ref": "Arts. 12, I; 13, I"}]}, {"t": "II – elaborar e cumprir plano de trabalho, segundo a proposta pedagógica", "tipo": "competencia", "ref": "Art. 13, II"}, {"t": "III – zelar pela aprendizagem dos alunos", "tipo": "competencia", "ref": "Art. 13, III"}, {"t": "IV – estabelecer estratégias de recuperação para alunos de menor rendimento", "tipo": "competencia", "ref": "Art. 13, IV"}, {"t": "V – ministrar dias letivos e horas-aula + participar integralmente de planejamento, avaliação e desenvolvimento profissional", "tipo": "competencia", "ref": "Art. 13, V"}, {"t": "VI – colaborar com a articulação da escola com famílias e comunidade", "tipo": "competencia", "ref": "Art. 13, VI"}]}]}}, {"id": "ldb-A-titulo-4-gestao-sistemas", "titulo": "Título IV – Gestão democrática, transparência e sistemas de ensino (arts. 14–20)", "raiz": {"t": "Título IV – Gestão democrática, transparência, autonomia e sistemas de ensino (arts. 14–20)", "tipo": "topico", "filhos": [{"t": "Gestão democrática do ensino público na educação básica", "tipo": "conceito", "d": "Normas definidas por LEI dos respectivos Estados, Municípios e DF, de acordo com suas peculiaridades (redação da Lei nº 14.644/2023).", "ref": "Art. 14, caput", "filhos": [{"t": "Princípios", "tipo": "classificacao", "ref": "Art. 14, I e II", "filhos": [{"t": "I – participação dos profissionais da educação na elaboração do projeto pedagógico da escola", "tipo": "conceito", "ref": "Art. 14, I"}, {"t": "II – participação das comunidades escolar e local em Conselhos Escolares e Fóruns dos Conselhos Escolares ou equivalentes", "tipo": "conceito", "ref": "Art. 14, II"}]}, {"t": "Redação original: “os sistemas de ensino definirão” as normas; hoje é a LEI de cada ente", "tipo": "atencao", "ref": "Art. 14, caput", "ext": true}, {"t": "Conselho Escolar – órgão DELIBERATIVO", "tipo": "competencia", "ref": "Art. 14, § 1º", "filhos": [{"t": "Diretor da Escola = membro NATO", "tipo": "competencia", "ref": "Art. 14, § 1º"}, {"t": "Representantes das comunidades escolar e local, ELEITOS POR SEUS PARES, por categorias", "tipo": "classificacao", "ref": "Art. 14, § 1º, I–V", "filhos": [{"t": "I – professores, orientadores educacionais, supervisores e administradores escolares", "tipo": "competencia", "ref": "Art. 14, § 1º, I"}, {"t": "II – demais servidores públicos com atividades administrativas na escola", "tipo": "competencia", "ref": "Art. 14, § 1º, II"}, {"t": "III – estudantes", "tipo": "competencia", "ref": "Art. 14, § 1º, III"}, {"t": "IV – pais ou responsáveis", "tipo": "competencia", "ref": "Art. 14, § 1º, IV"}, {"t": "V – membros da comunidade local", "tipo": "competencia", "ref": "Art. 14, § 1º, V"}]}]}, {"t": "Fórum dos Conselhos Escolares – colegiado de caráter DELIBERATIVO", "tipo": "competencia", "ref": "Art. 14, § 2º", "filhos": [{"t": "Finalidades: fortalecer os Conselhos Escolares da circunscrição e efetivar o processo democrático", "tipo": "conceito", "d": "Nas unidades educacionais e nas diferentes instâncias decisórias, com vistas a melhorar a qualidade da educação.", "ref": "Art. 14, § 2º"}, {"t": "Princípios: democratização da gestão; democratização do acesso e permanência; qualidade social da educação", "tipo": "classificacao", "ref": "Art. 14, § 2º, I–III"}, {"t": "Composição: 2 representantes do órgão do sistema de ensino + 2 de cada Conselho Escolar da circunscrição", "tipo": "prazo", "ref": "Art. 14, § 3º, I e II"}]}]}, {"t": "Transparência e acesso à informação como princípios de gestão das redes (Lei nº 15.001/2024)", "tipo": "conceito", "d": "União, Estados, DF e Municípios devem disponibilizar ao público, em meio eletrônico, informações acessíveis sobre:", "ref": "Art. 14-A", "filhos": [{"t": "I – vagas disponíveis e preenchidas por instituição; lista de espera; reserva de vagas nas federais (Lei 12.711/2012)", "tipo": "regra", "ref": "Art. 14-A, I"}, {"t": "II – bolsas e auxílios para estudo e pesquisa a estudantes, professores e pesquisadores", "tipo": "regra", "ref": "Art. 14-A, II"}, {"t": "III – atividades/projetos de pesquisa, extensão e inovação tecnológica (IES), finalizados e em andamento", "tipo": "regra", "ref": "Art. 14-A, III"}, {"t": "IV – estatísticas de fluxo e rendimento escolares", "tipo": "regra", "ref": "Art. 14-A, IV"}, {"t": "V – execução física e financeira de programas e projetos financiados com recursos públicos, renúncia fiscal ou subsídios", "tipo": "regra", "d": "Da educação básica e superior, discriminados pela denominação dada nos diplomas legais que os instituíram.", "ref": "Art. 14-A, V"}, {"t": "VI – currículo dos diretores de instituições e dos membros dos conselhos de educação", "tipo": "regra", "d": "Observada a LGPD (Lei nº 13.709/2018).", "ref": "Art. 14-A, VI"}, {"t": "VII – pautas e atas das reuniões do CNE e dos conselhos de educação dos Estados e do DF", "tipo": "regra", "ref": "Art. 14-A, VII"}]}, {"t": "Autonomia PROGRESSIVA das unidades escolares públicas de educação básica", "tipo": "regra", "d": "Os sistemas assegurarão progressivos graus de autonomia pedagógica e administrativa e de gestão financeira, observadas as normas gerais de direito financeiro público.", "ref": "Art. 15"}, {"t": "Composição dos sistemas de ensino", "tipo": "classificacao", "ref": "Arts. 16–18", "filhos": [{"t": "Sistema FEDERAL", "tipo": "competencia", "ref": "Art. 16", "filhos": [{"t": "I – instituições de ensino mantidas pela União", "tipo": "competencia", "ref": "Art. 16, I"}, {"t": "II – instituições de educação SUPERIOR mantidas pela iniciativa privada", "tipo": "competencia", "d": "Redação da Lei nº 13.868/2019.", "ref": "Art. 16, II"}, {"t": "III – órgãos federais de educação", "tipo": "competencia", "ref": "Art. 16, III"}]}, {"t": "Sistemas dos ESTADOS e do DF", "tipo": "competencia", "ref": "Art. 17", "filhos": [{"t": "I – instituições mantidas pelo Poder Público estadual e pelo DF", "tipo": "competencia", "ref": "Art. 17, I"}, {"t": "II – instituições de educação SUPERIOR mantidas pelo Poder Público MUNICIPAL", "tipo": "competencia", "ref": "Art. 17, II"}, {"t": "III – instituições de ensino fundamental e médio criadas e mantidas pela iniciativa privada", "tipo": "competencia", "ref": "Art. 17, III"}, {"t": "IV – órgãos de educação estaduais e do DF", "tipo": "competencia", "ref": "Art. 17, IV"}, {"t": "No DF, a educação infantil privada integra o sistema do DF", "tipo": "excecao", "ref": "Art. 17, parágrafo único"}]}, {"t": "Sistemas MUNICIPAIS", "tipo": "competencia", "ref": "Art. 18", "filhos": [{"t": "I – instituições de ensino fundamental, médio e de educação infantil mantidas pelo Poder Público municipal", "tipo": "competencia", "ref": "Art. 18, I"}, {"t": "II – instituições de educação infantil criadas e mantidas pela iniciativa privada", "tipo": "competencia", "ref": "Art. 18, II"}, {"t": "III – órgãos municipais de educação", "tipo": "competencia", "ref": "Art. 18, III"}]}, {"t": "IES municipal → sistema ESTADUAL; IES privada → sistema FEDERAL; EI privada → sistema MUNICIPAL (no DF, sistema do DF)", "tipo": "atencao", "ref": "Arts. 16, II; 17, II e p.u.; 18, II"}]}, {"t": "Categorias administrativas das instituições de ensino (3)", "tipo": "classificacao", "ref": "Art. 19", "filhos": [{"t": "I – públicas: criadas ou incorporadas, mantidas e administradas pelo Poder Público", "tipo": "conceito", "ref": "Art. 19, I"}, {"t": "II – privadas: mantidas e administradas por pessoas físicas ou jurídicas de direito privado", "tipo": "conceito", "ref": "Art. 19, II"}, {"t": "III – comunitárias, na forma da lei", "tipo": "conceito", "d": "Incluído pela Lei nº 13.868/2019.", "ref": "Art. 19, III"}, {"t": "Privadas e comunitárias PODEM qualificar-se como CONFESSIONAIS", "tipo": "regra", "d": "Atendidas a orientação confessional e a ideologia específicas.", "ref": "Art. 19, § 1º"}, {"t": "Privadas e comunitárias PODEM ser certificadas como FILANTRÓPICAS, na forma da lei", "tipo": "regra", "ref": "Art. 19, § 2º"}, {"t": "Confessional e filantrópica deixaram de ser categorias: hoje são qualificações de privadas/comunitárias", "tipo": "atencao", "d": "O art. 20 (que dividia as privadas em particulares, comunitárias, confessionais e filantrópicas) foi REVOGADO pela Lei nº 13.868/2019.", "ref": "Arts. 19 e 20"}]}]}}, {"id": "ldb-A-basica-organizacao", "titulo": "Título V – Cap. I e Cap. II, Seção I – Níveis escolares e organização da educação básica (arts. 21–25-A)", "raiz": {"t": "Título V – Cap. I e Cap. II, Seção I – Níveis escolares e organização da educação básica (arts. 21–25-A)", "tipo": "topico", "filhos": [{"t": "Composição da educação escolar: 2 níveis", "tipo": "classificacao", "ref": "Art. 21", "filhos": [{"t": "I – educação básica = educação infantil + ensino fundamental + ensino médio", "tipo": "classificacao", "ref": "Art. 21, I"}, {"t": "II – educação superior", "tipo": "classificacao", "ref": "Art. 21, II"}]}, {"t": "Finalidades da educação básica", "tipo": "classificacao", "d": "Desenvolver o educando; assegurar-lhe a formação comum indispensável para o exercício da cidadania; fornecer-lhe meios para progredir no trabalho e em estudos posteriores.", "ref": "Art. 22, caput", "filhos": [{"t": "Objetivos PRECÍPUOS: alfabetização plena e formação de leitores", "tipo": "conceito", "d": "Requisitos essenciais para cumprir as finalidades do caput (Lei nº 14.407/2022).", "ref": "Art. 22, parágrafo único"}]}, {"t": "Formas de organização da educação básica (rol exemplificativo)", "tipo": "classificacao", "d": "PODERÁ organizar-se em séries anuais, períodos semestrais, ciclos, alternância regular de períodos de estudos, grupos não seriados (com base na idade, competência e outros critérios) ou forma diversa, sempre que o interesse do processo de aprendizagem recomendar.", "ref": "Art. 23, caput", "filhos": [{"t": "Reclassificação de alunos, inclusive em transferências no País e do exterior", "tipo": "regra", "d": "Com base nas normas curriculares gerais (“a escola poderá”).", "ref": "Art. 23, § 1º"}, {"t": "Calendário adequado às peculiaridades locais (climáticas e econômicas)", "tipo": "regra", "d": "A critério do respectivo sistema de ensino, SEM reduzir o número de horas letivas previsto na Lei.", "ref": "Art. 23, § 2º"}]}, {"t": "Regras comuns do ensino FUNDAMENTAL e MÉDIO", "tipo": "topico", "ref": "Art. 24", "filhos": [{"t": "I – carga horária mínima anual: 800 h (fundamental) e 1.000 h (médio)", "tipo": "prazo", "d": "Distribuídas por, no mínimo, 200 dias de efetivo trabalho escolar, excluído o tempo dos exames finais, quando houver (Lei nº 14.945/2024).", "ref": "Art. 24, I", "filhos": [{"t": "Ampliação progressiva para 1.400 h, conforme prazos e metas do PNE", "tipo": "prazo", "ref": "Art. 24, § 1º"}, {"t": "Redação original: 800 h para fundamental e médio", "tipo": "atencao", "ref": "Art. 24, I", "ext": true}]}, {"t": "II – classificação em qualquer série/etapa, EXCETO a primeira do fundamental", "tipo": "classificacao", "ref": "Art. 24, II", "filhos": [{"t": "a) por promoção: cursou com aproveitamento a série anterior na própria escola", "tipo": "classificacao", "ref": "Art. 24, II, a"}, {"t": "b) por transferência: candidatos de outras escolas", "tipo": "classificacao", "ref": "Art. 24, II, b"}, {"t": "c) independentemente de escolarização anterior: avaliação feita pela escola", "tipo": "classificacao", "d": "Define o grau de desenvolvimento e experiência do candidato e permite inscrição na série/etapa adequada, conforme regulamentação do sistema.", "ref": "Art. 24, II, c"}]}, {"t": "III – progressão parcial (estabelecimentos com progressão regular por série)", "tipo": "regra", "d": "O regimento escolar pode admiti-la, preservada a sequência do currículo e observadas as normas do sistema.", "ref": "Art. 24, III"}, {"t": "IV – classes/turmas com alunos de séries distintas e níveis equivalentes", "tipo": "regra", "d": "Para ensino de línguas estrangeiras, artes ou outros componentes curriculares.", "ref": "Art. 24, IV"}, {"t": "V – verificação do rendimento escolar – critérios", "tipo": "classificacao", "ref": "Art. 24, V", "filhos": [{"t": "a) avaliação contínua e cumulativa; qualitativo > quantitativo; resultados do período > provas finais", "tipo": "regra", "ref": "Art. 24, V, a"}, {"t": "b) aceleração de estudos para alunos com atraso escolar", "tipo": "regra", "ref": "Art. 24, V, b"}, {"t": "c) avanço nos cursos e séries mediante verificação do aprendizado", "tipo": "regra", "ref": "Art. 24, V, c"}, {"t": "d) aproveitamento de estudos concluídos com êxito", "tipo": "regra", "ref": "Art. 24, V, d"}, {"t": "e) recuperação OBRIGATÓRIA, de preferência paralela ao período letivo", "tipo": "regra", "d": "Para casos de baixo rendimento, disciplinada pelas instituições em seus regimentos.", "ref": "Art. 24, V, e"}]}, {"t": "VI – controle de frequência pela escola; mínimo de 75% do total de horas letivas para aprovação", "tipo": "prazo", "d": "Conforme regimento e normas do sistema.", "ref": "Art. 24, VI"}, {"t": "VII – cada instituição expede históricos, declarações de conclusão de série e diplomas/certificados", "tipo": "competencia", "ref": "Art. 24, VII"}, {"t": "Sistemas disporão sobre oferta de EJA e de ensino noturno regular adequado ao educando", "tipo": "regra", "d": "Conforme o art. 4º, VI (incluído pela Lei nº 13.415/2017).", "ref": "Art. 24, § 2º"}]}, {"t": "Relação adequada alunos/professor, carga horária e condições materiais: objetivo PERMANENTE", "tipo": "regra", "ref": "Art. 25, caput", "filhos": [{"t": "Parâmetro fixado pelo respectivo sistema de ensino", "tipo": "competencia", "d": "À vista das condições disponíveis e das características regionais e locais.", "ref": "Art. 25, parágrafo único"}]}, {"t": "Infraestrutura mínima das escolas públicas de educação básica: DEVER do poder público", "tipo": "classificacao", "d": "Respeitadas as especificidades de cada etapa e modalidade (Lei nº 15.360/2026).", "ref": "Art. 25-A", "filhos": [{"t": "Número adequado de educandos por turma", "tipo": "regra", "ref": "Art. 25-A"}, {"t": "Biblioteca; laboratórios de ciências e de informática equipados; acesso à internet", "tipo": "regra", "ref": "Art. 25-A"}, {"t": "Quadra poliesportiva coberta; cozinha; refeitório; banheiros", "tipo": "regra", "ref": "Art. 25-A"}, {"t": "Acessibilidade; energia elétrica; água tratada; esgotamento sanitário; manejo de resíduos sólidos", "tipo": "regra", "ref": "Art. 25-A"}]}]}}, {"id": "ldb-A-basica-curriculo", "titulo": "Título V – Cap. II, Seção I – Currículo da educação básica e educação do campo (arts. 26–28)", "raiz": {"t": "Título V – Cap. II, Seção I – Currículo da educação básica e educação do campo (arts. 26–28)", "tipo": "topico", "filhos": [{"t": "Currículo = base nacional comum + parte diversificada", "tipo": "conceito", "d": "Currículos da educação infantil, do ensino fundamental e do ensino médio; a parte diversificada é definida em cada sistema e em cada estabelecimento, conforme características regionais e locais da sociedade, cultura, economia e educandos (Lei nº 12.796/2013).", "ref": "Art. 26, caput", "filhos": [{"t": "Inclui a EDUCAÇÃO INFANTIL (redação original: só fundamental e médio)", "tipo": "atencao", "ref": "Art. 26, caput", "ext": true}, {"t": "Novos componentes obrigatórios na BNCC: aprovação do CNE + homologação do Ministro da Educação", "tipo": "competencia", "ref": "Art. 26, § 10"}]}, {"t": "Componentes curriculares OBRIGATÓRIOS", "tipo": "classificacao", "ref": "Art. 26, §§ 1º–3º, 5º, 9º-B, 11", "filhos": [{"t": "Língua portuguesa, matemática, mundo físico e natural, realidade social e política (especialmente do Brasil)", "tipo": "regra", "ref": "Art. 26, § 1º", "filhos": [{"t": "Educação política e direitos da cidadania: componente obrigatório no estudo da realidade social e política", "tipo": "regra", "d": "Incluído pela Lei nº 15.468/2026.", "ref": "Art. 26, § 9º-B"}]}, {"t": "Arte, especialmente em suas expressões regionais: componente obrigatório da educação básica", "tipo": "regra", "d": "Redação da Lei nº 13.415/2017.", "ref": "Art. 26, § 2º", "filhos": [{"t": "Linguagens do componente Arte: artes visuais, dança, música e teatro", "tipo": "classificacao", "d": "Redação da Lei nº 13.278/2016 (antes, a Lei 11.769/2008 previa a música como conteúdo obrigatório, mas não exclusivo).", "ref": "Art. 26, § 6º"}]}, {"t": "Educação física: obrigatória, integrada à proposta pedagógica; prática FACULTATIVA a certos alunos", "tipo": "regra", "ref": "Art. 26, § 3º", "filhos": [{"t": "I – jornada de trabalho igual ou superior a 6 horas", "tipo": "excecao", "ref": "Art. 26, § 3º, I"}, {"t": "II – maior de 30 anos de idade", "tipo": "excecao", "ref": "Art. 26, § 3º, II"}, {"t": "III – prestando serviço militar inicial ou, em situação similar, obrigado à prática de educação física", "tipo": "excecao", "ref": "Art. 26, § 3º, III"}, {"t": "IV – amparado pelo Decreto-Lei nº 1.044/1969", "tipo": "excecao", "ref": "Art. 26, § 3º, IV"}, {"t": "V – vetado", "tipo": "atencao", "ref": "Art. 26, § 3º, V"}, {"t": "VI – que tenha prole", "tipo": "excecao", "ref": "Art. 26, § 3º, VI"}, {"t": "Facultativa é a PRÁTICA (para o aluno); o componente continua obrigatório", "tipo": "atencao", "d": "Redação da Lei nº 10.793/2003.", "ref": "Art. 26, § 3º"}, {"t": "Redação original: educação física facultativa nos cursos noturnos", "tipo": "atencao", "ref": "Art. 26, § 3º", "ext": true}]}, {"t": "Língua INGLESA no fundamental, a partir do 6º ano", "tipo": "regra", "d": "Redação da Lei nº 13.415/2017.", "ref": "Art. 26, § 5º", "filhos": [{"t": "Redação original: língua estrangeira moderna escolhida pela comunidade, a partir da 5ª série", "tipo": "atencao", "ref": "Art. 26, § 5º", "ext": tr A, § 2º"}, {"t": "Não alcança a educação infantil; vale também para escolas privadas", "tipo": "atencao", "ref": "Art. 26-A, caput"}]}, {"t": "Perspectivas FEMININAS nos conteúdos curriculares: inclusão obrigatória", "tipo": "regra", "d": "Nos estabelecimentos de ensino fundamental e médio, públicos e privados (Lei nº 14.986/2024).", "ref": "Art. 26-B", "filhos": [{"t": "História, ciência, artes e cultura do Brasil e do mundo, a partir das experiências femininas", "tipo": "classificacao", "d": "Para resgatar contribuições, vivências e conquistas femininas nas áreas científica, social, artística, cultural, econômica e política.", "ref": "Art. 26-B, parágrafo único"}]}, {"t": "Diretrizes dos conteúdos curriculares da educação básica", "tipo": "classificacao", "ref": "Art. 27", "filhos": [{"t": "I – difusão de valores de interesse social, direitos e deveres dos cidadãos, respeito ao bem comum e à ordem democrática", "tipo": "regra", "ref": "Art. 27, I"}, {"t": "II – consideração das condições de escolaridade dos alunos em cada estabelecimento", "tipo": "regra", "ref": "Art. 27, II"}, {"t": "III – orientação para o trabalho", "tipo": "regra", "ref": "Art. 27, III"}, {"t": "IV – promoção do desporto educacional e apoio às práticas desportivas não formais", "tipo": "regra", "ref": "Art. 27, IV"}]}, {"t": "Educação básica para a população RURAL: adaptações", "tipo": "classificacao", "ref": "Art. 28", "filhos": [{"t": "I – conteúdos e metodologias apropriados às escolas do campo, podendo usar a pedagogia da alternância", "tipo": "regra", "d": "Redação da Lei nº 14.767/2023.", "ref": "Art. 28, I"}, {"t": "II – organização escolar própria; calendário adequado ao ciclo agrícola e às condições climáticas", "tipo": "regra", "ref": "Art. 28, II"}, {"t": "III – adequação à natureza do trabalho na zona rural", "tipo": "regra", "ref": "Art. 28, III"}, {"t": "Fechamento de escolas do campo, indígenas e quilombolas: precedido de manifestação do órgão NORMATIVO do sistema", "tipo": "regra", "d": "Que considerará a justificativa da Secretaria de Educação, o diagnóstico do impacto da ação e a manifestação da comunidade escolar (Lei nº 12.960/2014).", "ref": "Art. 28, parágrafo único"}]}]}}, {"id": "ldb-A-educacao-infantil", "titulo": "Título V – Cap. II, Seção II – Educação infantil (arts. 29–31)", "raiz": {"t": "Título V – Cap. II, Seção II – Educação infantil (arts. 29–31)", "tipo": "topico", "filhos": [{"t": "Primeira etapa da educação básica", "tipo": "conceito", "d": "Finalidade: desenvolvimento INTEGRAL da criança de até 5 anos, nos aspectos físico, psicológico, intelectual e social, COMPLEMENTANDO a ação da família e da comunidade (Lei nº 12.796/2013).", "ref": "Art. 29", "filhos": [{"t": "Redação original: até 6 anos", "tipo": "atencao", "ref": "Art. 29", "ext": true}]}, {"t": "Oferta", "tipo": "classificacao", "ref": "Art. 30", "filhos": [{"t": "I – creches ou entidades equivalentes: crianças de até 3 anos", "tipo": "prazo", "ref": "Art. 30, I"}, {"t": "II – pré-escolas: crianças de 4 a 5 anos", "tipo": "prazo", "d": "Redação da Lei nº 12.796/2013 (original: 4 a 6 anos).", "ref": "Art. 30, II"}]}, {"t": "Regras comuns da educação infantil (Lei nº 12.796/2013)", "tipo": "classificacao", "ref": "Art. 31", "filhos": [{"t": "I – avaliação por acompanhamento e registro do desenvolvimento, SEM objetivo de promoção", "tipo": "regra", "d": "Mesmo para o acesso ao ensino fundamental.", "ref": "Art. 31, I"}, {"t": "II – carga horária mínima anual de 800 h, em no mínimo 200 dias de trabalho educacional", "tipo": "prazo", "ref": "Art. 31, II"}, {"t": "III – atendimento mínimo de 4 h diárias (turno parcial) e 7 h (jornada integral)", "tipo": "prazo", "ref": "Art. 31, III"}, {"t": "IV – controle de frequência pela instituição de educação pré-escolar: mínimo de 60% do total de horas", "tipo": "prazo", "ref": "Art. 31, IV", "filhos": [{"t": "60% na pré-escola × 75% no fundamental e médio", "tipo": "atencao", "ref": "Arts. 24, VI; 31, IV"}]}, {"t": "V – documentação que ateste os processos de desenvolvimento e aprendizagem da criança", "tipo": "regra", "ref": "Art. 31, V"}]}]}}, {"id": "ldb-A-ensino-fundamental", "titulo": "Título V – Cap. II, Seção III – Ensino fundamental (arts. 32–34)", "raiz": {"t": "Título V – Cap. II, Seção III – Ensino fundamental (arts. 32–34)", "tipo": "topico", "filhos": [{"t": "Ensino fundamental: obrigatório, 9 anos, gratuito na escola pública, início aos 6 anos", "tipo": "prazo", "d": "Objetivo: formação básica do cidadão (redação da Lei nº 11.274/2006).", "ref": "Art. 32, caput", "filhos": [{"t": "Redação original: duração mínima de 8 anos", "tipo": "atencao", "ref": "Art. 32, caput", "ext": true}, {"t": "Meios para a formação básica do cidadão", "tipo": "classificacao", "ref": "Art. 32, I–IV", "filhos": [{"t": "I – capacidade de aprender: pleno domínio da leitura, da escrita e do cálculo", "tipo": "regra", "ref": "Art. 32, I"}, {"t": "II – compreensão do ambiente natural e social, sistema político, tecnologia, artes e valores da sociedade", "tipo": "regra", "ref": "Art. 32, II"}, {"t": "III – capacidade de aprendizagem: conhecimentos, habilidades, atitudes e valores", "tipo": "regra", "ref": "Art. 32, III"}, {"t": "IV – fortalecimento dos vínculos de família, laços de solidariedade humana e tolerância recíproca", "tipo": "regra", "ref": "Art. 32, IV"}]}]}, {"t": "Organização", "tipo": "topico", "ref": "Art. 32, §§ 1º–4º", "filhos": [{"t": "FACULTADO aos sistemas desdobrar o fundamental em ciclos", "tipo": "regra", "ref": "Art. 32, § 1º"}, {"t": "Progressão CONTINUADA: podem adotá-la os estabelecimentos com progressão regular por série", "tipo": "regra", "d": "Sem prejuízo da avaliação do processo de ensino-aprendizagem, observadas as normas do sistema.", "ref": "Art. 32, § 2º", "filhos": [{"t": "Progressão continuada (art. 32, § 2º) ≠ progressão parcial (art. 24, III)", "tipo": "atencao", "ref": "Arts. 24, III; 32, § 2º"}]}, {"t": "Ministrado em língua portuguesa; comunidades indígenas put", "filhos": [{"t": "Ressalvados o ensino noturno e as formas alternativas de organização autorizadas na Lei", "tipo": "excecao", "ref": "Art. 34, § 1º"}, {"t": "Tempo integral de forma progressiva, a critério dos sistemas de ensino", "tipo": "regra", "ref": "Art. 34, § 2º"}]}]}}, {"id": "ldb-B-medio-curriculo", "titulo": "Título V, Cap. II, Seção IV – Ensino médio: finalidades, FGB e BNCC (arts. 35–35-D)", "raiz": {"t": "Seção IV – Do Ensino Médio: finalidades, currículo, FGB e BNCC (arts. 35–35-D)", "tipo": "topico", "d": "Estrutura vigente após a Lei nº 14.945/2024, que incluiu os arts. 35-B, 35-C e 35-D (o art. 35-A, da Lei 13.415/2017, não consta do texto vigente).", "ref": "Arts. 35–35-D", "filhos": [{"t": "Art. 35 – Ensino médio: conceito e finalidades", "tipo": "topico", "ref": "Art. 35", "filhos": [{"t": "Etapa final da educação básica", "tipo": "conceito", "ref": "Art. 35, caput"}, {"t": "Duração mínima de 3 anos", "tipo": "prazo", "d": "Combinado com o art. 24, I (1.000 h anuais mínimas no ensino médio, em ao menos 200 dias letivos).", "ref": "Art. 35, caput; art. 24, I"}, {"t": "Finalidades (4 incisos)", "tipo": "classificacao", "ref": "Art. 35, I a IV", "filhos": [{"t": "I – Consolidar e aprofundar conhecimentos do fundamental, possibilitando prosseguir estudos", "tipo": "regra", "ref": "Art. 35, I"}, {"t": "II – Preparação básica para o trabalho e a cidadania; continuar aprendendo; adaptar-se com flexibilidade a novas ocupações", "tipo": "regra", "ref": "Art. 35, II"}, {"t": "III – Aprimoramento como pessoa humana: formação ética, autonomia intelectual, pensamento crítico", "tipo": "regra", "ref": "Art. 35, III"}, {"t": "IV – Fundamentos científico-tecnológicos dos processos produtivos, relacionando teoria e prática em cada disciplina", "tipo": "regra", "ref": "Art. 35, IV"}]}, {"t": "Art. 35-A (BNCC do ensino médio, Lei 13.415/2017) não está no texto vigente", "tipo": "atencao", "d": "A matéria da BNCC do ensino médio passou a constar do art. 35-D (Lei 14.945/2024). Ver nao_verificado sobre a leitura das anotações de revogação.", "ref": "Art. 35-A; art. 35-D"}]}, {"t": "Art. 35-B – Composição do currículo e proposta pedagógica", "tipo": "topico", "ref": "Art. 35-B", "filhos": [{"t": "Currículo = formação geral básica (FGB) + itinerários formativos", "tipo": "conceito", "ref": "Art. 35-B, caput"}, {"t": "Elementos obrigatórios das propostas pedagógicas", "tipo": "classificacao", "ref": "Art. 35-B, § 1º", "filhos": [{"t": "I – Metodologias investigativas no ensino e aprendizagem", "tipo": "regra", "ref": "Art. 35-B, § 1º, I"}, {"t": "II – Conexão com a vida comunitária e social em cada território", "tipo": "regra", "ref": "Art. 35-B, § 1º, II"}, {"t": "III – Reconhecimento do trabalho e de seu caráter formativo", "tipo": "regra", "ref": "Art. 35-B, § 1º, III"}, {"t": "IV – Articulação dos saberes por áreas do conhecimento e, se for o caso, com o currículo técnico-profissional", "tipo": "regra", "ref": "Art. 35-B, § 1º, IV"}]}, {"t": "Projetos de vida assegurados aos estudantes", "tipo": "regra", "d": "Perspectiva do desenvolvimento integral (dimensões física, cognitiva e socioemocional), integração comunitária no território, participação cidadã e preparação para o mundo do trabalho, de forma ambiental e socialmente responsável.", "ref": "Art. 35-B, § 2º"}, {"t": "Oferta presencial", "tipo": "regra", "ref": "Art. 35-B, § 3º", "filhos": [{"t": "Ensino mediado por tecnologia: só excepcionalmente", "tipo": "excecao", "d": "Na forma de regulamento elaborado com a participação dos sistemas estaduais e distrital de ensino.", "ref": "Art. 35-B, § 3º"}]}, {"t": "Aproveitamento de experiências extraescolares (tempo integral)", "tipo": "regra", "d": "Excepcionalmente, para cumprir exigências curriculares do ensino médio em regime de tempo integral, os sistemas PODERÃO reconhecer aprendizagens, competências e habilidades extraescolares, com formas de comprovação definidas pelos sistemas.", "ref": "Art. 35-B, § 4º", "filhos": [{"t": "I – Estágio, aprendizagem profissional, trabalho remunerado ou voluntário supervisionado", "tipo": "classificacao", "d": "Desde que explicitada a relação com o currículo do ensino médio.", "ref": "Art. 35-B, § 4º, I"}, {"t": "II – Cursos de qualificação profissional concluídos", "tipo": "classificacao", "d": "Desde que comprovados por certificação emitida de acordo com a legislação.", "ref": "Art. 35-B, § 4º, II"}, {"t": "III – Extensão universitária, iniciação científica ou direção em grêmio estudantil", "tipo": "classificacao", "d": "Participação comprovada.", "ref": "Art. 35-B, § 4º, III"}, {"t": "Restrito ao regime de tempo integral e excepcional", "tipo": "atencao", "d": "Substitui o antigo § 11 do art. 36 (Lei 13.415/2017: demonstração prática, convênios com instituições de EaD etc.), hoje revogado pela Lei 14.945/2024.", "ref": "Art. 35-B, § 4º; art. 36, § 11 (revogado)"}]}]}, {"t": "Art. 35-C – Formação geral básica (FGB)", "tipo": "topico", "ref": "Art. 35-C", "filhos": [{"t": "Carga horária mínima total: 2.400 horas", "tipo": "prazo", "ref": "Art. 35-C, caput"}, {"t": "Articula a BNCC e a parte diversificada (art. 26, caput)", "tipo": "regra", "ref": "Art. 35-C, caput"}, {"t": "Com formação técnica e profissional (art. 36, V): FGB mínima de 2.100 horas", "tipo": "excecao", "ref": "Art. 35-C, parágrafo único", "filhos": [{"t": "Até 300 h da FGB podem aprofundar conteúdos da BNCC ligados à formação técnica oferecida", "tipo": "prazo", "ref": "Art. 35-C, parágrafo único"}]}, {"t": "Conta de prova: 2.400 h FGB + 600 h itinerário = 3.000 h", "tipo": "atencao", "d": "Coincide com 3 anos × 1.000 h anuais mínimas (arts. 24, I, e 35). Soma feita a partir do texto; a lei não escreve '3.000 horas' na Seção IV.", "ref": "Arts. 24, I; 35; 35-C; 36, caput"}]}, {"t": "Art. 35-D – BNCC do ensino médio", "tipo": "topico", "ref": "Art. 35-D", "filhos": [{"t": "Estabelece direitos e objetivos de aprendizagem, conforme diretrizes do CNE", "tipo": "regra", "ref": "Art. 35-D, caput"}, {"t": "4 áreas do conhecimento", "tipo": "classificacao", "ref": "Art. 35-D, I a IV", "filhos": [{"t": "I – Linguagens e suas tecnologias", "tipo": "classificacao", "d": "Língua portuguesa e suas literaturas, língua inglesa, artes e educação física.", "ref": "Art. 35-D, I"}, {"t": "II – Matemática e suas tecnologias", "tipo": "classificacao", "ref": "Art. 35-D, II"}, {"t": "III – Ciências da natureza e suas tecnologias", "tipo": "classificacao", "d": "Biologia, física e química.", "ref": "Art. 35-D, III"}, {"t": "IV – Ciências humanas e sociais aplicadas", "tipo": "classificacao", "d": "Filosofia, geografia, história e sociologia.", "ref": "Art. 35-D, IV"}]}, {"t": "BNCC cumprida integralmente ao longo da FGB", "tipo": "regra", "ref": "Art. 35-D, § 1º"}, {"t": "Ministrado em língua portuguesa; indígenas podem usar línguas maternas", "tipo": "regra", "ref": "Art. 35-D, § 2º"}, {"t": "Outras línguas estrangeiras: PODERÃO ser ofertadas, preferencialmente o espanhol", "tipo": "regra", "d": "De acordo com a disponibilidade de oferta, locais e horários definidos pelos sistemas de ensino. Inglês já integra a área de linguagens.", "ref": "Art. 35-D, § 3º"}, {"t": "Filosofia e Sociologia: hoje integram a área de ciências humanas", "tipo": "atencao", "d": "A antiga redação do art. 36, IV (Lei 11.684/2008: disciplinas obrigatórias em todas as séries) foi substituída pela Lei 13.415/2017; na redação vigente elas aparecem como componentes da área do art. 35-D, IV.", "ref": "Art. 35-D, IV; art. 36, IV"}]}]}}, {"id": "ldb-B-medio-itinerarios", "titulo": "Título V, Cap. II, Seção IV – Ensino médio: itinerários formativos (art. 36)", "raiz": {"t": "Art. 36 – Itinerários formativos e oferta do ensino médio", "tipo": "topico", "d": "Caput na redação da Lei 14.945/2024 (substituiu a da Lei 13.415/2017, que falava em 'BNCC e itinerários... arranjos curriculares').", "ref": "Art. 36", "filhos": [{"t": "Itinerários formativos: conceito e carga", "tipo": "topico", "ref": "Art. 36, caput", "filhos": [{"t": "Articulados com a parte diversificada (art. 26, caput)", "tipo": "regra", "ref": "Art. 36, caput"}, {"t": "Carga horária mínima: 600 horas", "tipo": "prazo", "ref": "Art. 36, caput", "filhos": [{"t": "Ressalvadas as especificidades da formação técnica e profissional", "tipo": "excecao", "ref": "Art. 36, caput"}]}, {"t": "Compostos de aprofundamento das áreas OU de formação técnica e profissional", "tipo": "conceito", "d": "Conforme a relevância para o contexto local e a possibilidade dos sistemas de ensino.", "ref": "Art. 36, caput"}]}, {"t": "5 ênfases", "tipo": "classificacao", "ref": "Art. 36, I a V", "filhos": [{"t": "I – Linguagens e suas tecnologias", "tipo": "classificacao", "ref": "Art. 36, I"}, {"t": "II – Matemática e suas tecnologias", "tipo": "classificacao", "ref": "Art. 36, II"}, {"t": "III – Ciências da natureza e suas tecnologias", "tipo": "classificacao", "ref": "Art. 36, III"}, {"t": "IV – Ciências humanas e sociais aplicadas", "tipo": "classificacao", "ref": "Art. 36, IV"}, {"t": "V – Formação técnica e profissional", "tipo": "classificacao", "d": "Organizada por eixos tecnológicos e áreas tecnológicas definidos nas DCN de EPT, observados o CNCT (art. 42-A, § 3º) e os arts. 36-A a 36-D (redação da Lei 14.945/2024).", "ref": "Art. 36, V"}]}, {"t": "Regras de organização dos itinerários", "tipo": "topico", "filhos": [{"t": "Cada itinerário contempla integralmente o aprofundamento de ao menos 1 área (I a IV)", "tipo": "regra", "d": "Ressalvada a formação técnica e profissional (inciso V).", "ref": "Art. 36, § 1º-A"}, {"t": "Toda escola de ensino médio: aprofundamento integral das 4 áreas em, no mínimo, 2 itinerários com ênfases distintas", "tipo": "regra", "d": "Dever dos sistemas de ensino garantir.", "ref": "Art. 36, § 2º-A", "filhos": [{"t": "Exceto as escolas que oferecerem formação técnica e profissional", "tipo": "excecao", "ref": "Art. 36, § 2º-A"}]}, {"t": "CNE (com sistemas estaduais e distrital) elabora diretrizes nacionais de aprofundamento de cada área", "tipo": "competencia", "d": "Com orientações sobre direitos e objetivos de aprendizagem dos itinerários; reconhecidas as especificidades da educação indígena e quilombola.", "ref": "Art. 36, § 2º-B"}, {"t": "União: indicadores e padrões de desempenho do ensino médio", "tipo": "competencia", "d": "Referência nos processos nacionais de avaliação, a partir da BNCC (art. 35-D) e das diretrizes de aprofundamento (§ 2º-B).", "ref": "Art. 36, § 2º-C"}, {"t": "Sistemas apoiam escolas em programas de orientação para escolha dos itinerários", "tipo": "competencia", "ref": "Art. 36, § 2º-D"}, {"t": "Segundo itinerário para concluinte ou egresso", "tipo": "regra", "d": "Os sistemas possibilitarão, mediante disponibilidade de vagas na rede, cursar um segundo itinerário formativo.", "ref": "Art. 36, § 5º"}]}, {"t": "Oferta da formação técnica e profissional", "tipo": "topico", "ref": "Art. 36, §§ 6º e 7º", "filhos": [{"t": "PODE ser por convênios/parcerias entre secretarias de educação e instituições credenciadas de EP, preferencialmente públicas", "tipo": "regra", "d": "Observados os limites da legislação (redação da Lei 14.945/2024; a redação de 2017 dizia 'a critério dos sistemas de ensino').", "ref": "Art. 36, § 6º, caput"}, {"t": "Considerará vivências práticas de trabalho (setor produtivo ou ambientes de simulação)", "tipo": "regra", "d": "Estabelecendo parcerias e usando, quando aplicável, instrumentos da legislação sobre aprendizagem profissional.", "ref": "Art. 36, § 6º, I"}, {"t": "§ 6º, II (certificados intermediários) foi revogado pela Lei 14.945/2024", "tipo": "atencao", "d": "A possibilidade de certificados de qualificação por etapas continua no art. 36-D, parágrafo único (formas concomitante e subsequente).", "ref": "Art. 36, § 6º, II; art. 36-D, parágrafo único"}, {"t": "Formações experimentais fora do CNCT", "tipo": "regra", "d": "Continuidade depende de dois requisitos, contados da data de oferta inicial.", "
