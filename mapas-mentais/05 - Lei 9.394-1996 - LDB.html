fissional.", "ref": "Art. 36-A, parágrafo único"}]}, {"t": "Art. 36-B – Formas de desenvolvimento", "tipo": "topico", "ref": "Art. 36-B", "filhos": [{"t": "I – Articulada com o ensino médio", "tipo": "classificacao", "d": "Desdobra-se em integrada e concomitante (art. 36-C).", "ref": "Art. 36-B, I"}, {"t": "II – Subsequente: para quem já concluiu o ensino médio", "tipo": "classificacao", "ref": "Art. 36-B, II"}, {"t": "Deve observar (3 incisos)", "tipo": "regra", "ref": "Art. 36-B, § 1º", "filhos": [{"t": "I – Objetivos e definições das DCN do Conselho Nacional de Educação", "tipo": "regra", "ref": "Art. 36-B, § 1º, I"}, {"t": "II – Normas complementares dos sistemas de ensino", "tipo": "regra", "ref": "Art. 36-B, § 1º, II"}, {"t": "III – Exigências de cada instituição, nos termos de seu projeto pedagógico", "tipo": "regra", "ref": "Art. 36-B, § 1º, III"}, {"t": "Antigo parágrafo único virou § 1º (Lei 14.645/2023)", "tipo": "atencao", "d": "Mesmo conteúdo; a renumeração permitiu incluir os §§ 2º e 3º.", "ref": "Art. 36-B, § 1º"}]}, {"t": "Articulação com a aprendizagem profissional (Lei 10.097/2000)", "tipo": "topico", "ref": "Art. 36-B, §§ 2º e 3º", "filhos": [{"t": "Formas articulada e subsequente PODEM ser ofertadas em articulação com a aprendizagem profissional", "tipo": "regra", "ref": "Art. 36-B, § 2º"}, {"t": "Aproveitamento possível (nos termos de regulamento)", "tipo": "classificacao", "ref": "Art. 36-B, § 3º", "filhos": [{"t": "I – Atividades pedagógicas da EPTNM contam para cumprir o contrato de aprendizagem", "tipo": "regra", "ref": "Art. 36-B, § 3º, I"}, {"t": "II – Horas de trabalho na aprendizagem contam para a carga horária do ensino médio", "tipo": "regra", "d": "No itinerário de formação técnica e profissional ou na EPTNM.", "ref": "Art. 36-B, § 3º, II"}]}]}]}, {"t": "Art. 36-C – Formas da EPTNM articulada", "tipo": "topico", "ref": "Art. 36-C", "filhos": [{"t": "I – Integrada", "tipo": "classificacao", "ref": "Art. 36-C, I", "filhos": [{"t": "Somente para quem já concluiu o ensino fundamental", "tipo": "regra", "ref": "Art. 36-C, I"}, {"t": "Curso planejado para conduzir à habilitação técnica de nível médio", "tipo": "regra", "ref": "Art. 36-C, I"}, {"t": "Na mesma instituição de ensino", "tipo": "regra", "ref": "Art. 36-C, I"}, {"t": "Matrícula única para cada aluno", "tipo": "regra", "ref": "Art. 36-C, I"}]}, {"t": "II – Concomitante", "tipo": "classificacao", "d": "Para quem ingresse no ensino médio ou já o esteja cursando.", "ref": "Art. 36-C, II", "filhos": [{"t": "Matrículas distintas para cada curso", "tipo": "regra", "ref": "Art. 36-C, II"}, {"t": "a) Mesma instituição, aproveitando oportunidades educacionais disponíveis", "tipo": "classificacao", "ref": "Art. 36-C, II, a"}, {"t": "b) Instituições distintas, aproveitando oportunidades educacionais disponíveis", "tipo": "classificacao", "ref": "Art. 36-C, II, b"}, {"t": "c) Instituições distintas mediante convênios de intercomplementaridade", "tipo": "classificacao", "d": "Visando ao planejamento e desenvolvimento de projeto pedagógico unificado. Mesmo com projeto unificado, continua sendo concomitante (matrículas distintas).", "ref": "Art. 36-C, II, c"}]}, {"t": "Ofertada em instituições distintas, ainda que com projeto unificado = concomitante, nunca integrada", "tipo": "atencao", "ref": "Art. 36-C, I e II, c"}]}, {"t": "Art. 36-D – Diplomas e certificados", "tipo": "topico", "ref": "Art. 36-D", "filhos": [{"t": "Diplomas técnicos, QUANDO REGISTRADOS: validade nacional e habilitam ao prosseguimento na educação superior", "tipo": "regra", "ref": "Art. 36-D, caput"}, {"t": "Certificados de qualificação para o trabalho por etapa", "tipo": "regra", "d": "Nas formas articulada concomitante e subsequente, quando estruturadas em etapas com terminalidade: certificado após concluir, com aproveitamento, cada etapa que caracterize qualificação para o trabalho.", "ref": "Art. 36-D, parágrafo único", "filhos": [{"t": "O dispositivo não menciona a forma integrada", "tipo": "atencao", "ref": "Art. 36-D, parágrafo único"}]}]}]}}, {"id": "ldb-B-eja", "titulo": "Título V, Cap. II, Seção V – Educação de jovens e adultos (arts. 37–38)", "raiz": {"t": "Seção V – Educação de Jovens e Adultos (arts. 37–38)", "tipo": "topico", "ref": "Arts. 37–38", "filhos": [{"t": "Art. 37 – Destinatários e natureza", "tipo": "topico", "ref": "Art. 37", "filhos": [{"t": "Para quem não teve acesso ou continuidade de estudos no fundamental e médio na idade própria", "tipo": "conceito", "ref": "Art. 37, caput"}, {"t": "Instrumento para a educação e a aprendizagem ao longo da vida", "tipo": "conceito", "d": "Trecho incluído pela Lei 13.632/2018 (redação do caput).", "ref": "Art. 37, caput"}, {"t": "Sistemas asseguram GRATUITAMENTE oportunidades educacionais apropriadas", "tipo": "regra", "d": "Consideradas as características do alunado, seus interesses, condições de vida e de trabalho, mediante cursos e exames.", "ref": "Art. 37, § 1º"}, {"t": "Poder Público viabiliza e estimula acesso e permanência do trabalhador na escola", "tipo": "competencia", "d": "Mediante ações integradas e complementares entre si.", "ref": "Art. 37, § 2º"}, {"t": "EJA articula-se, PREFERENCIALMENTE, com a educação profissional", "tipo": "regra", "d": "Na forma do regulamento (incluído pela Lei 11.741/2008).", "ref": "Art. 37, § 3º"}]}, {"t": "Art. 38 – Cursos e exames supletivos", "tipo": "topico", "ref": "Art. 38", "filhos": [{"t": "Sistemas manterão cursos e exames supletivos", "tipo": "competencia", "ref": "Art. 38, caput"}, {"t": "Compreendem a base nacional comum do currículo", "tipo": "regra", "ref": "Art. 38, caput"}, {"t": "Habilitam ao prosseguimento de estudos em caráter regular", "tipo": "regra", "ref": "Art. 38, caput"}, {"t": "Idades para os exames", "tipo": "prazo", "ref": "Art. 38, § 1º", "filhos": [{"t": "Conclusão do ensino fundamental: maiores de 15 anos", "tipo": "prazo", "ref": "Art. 38, § 1º, I"}, {"t": "Conclusão do ensino médio: maiores de 18 anos", "tipo e regulamento (Lei 14.645/2023).", "ref": "Art. 39, § 4º"}]}, {"t": "Art. 40 – Formas de desenvolvimento", "tipo": "topico", "ref": "Art. 40", "filhos": [{"t": "Em articulação com o ensino regular OU por estratégias de educação continuada", "tipo": "regra", "ref": "Art. 40"}, {"t": "Locais: instituições especializadas ou ambiente de trabalho", "tipo": "regra", "ref": "Art. 40"}, {"t": "Artigo regulamentado (texto indica '(Regulamento)')", "tipo": "atencao", "d": "O Decreto nº 5.154/2004 é o regulamento tradicionalmente citado.", "ref": "Art. 40", "ext": true}]}, {"t": "Art. 41 – Avaliação, reconhecimento e certificação de saberes", "tipo": "topico", "ref": "Art. 41", "filhos": [{"t": "Conhecimento adquirido na EPT, INCLUSIVE NO TRABALHO, PODERÁ ser avaliado, reconhecido e certificado", "tipo": "regra", "d": "Para prosseguimento ou conclusão de estudos (redação da Lei 11.741/2008).", "ref": "Art. 41, caput"}, {"t": "Parágrafo único revogado", "tipo": "atencao", "ref": "Art. 41, parágrafo único"}]}, {"t": "Art. 42 – Cursos especiais abertos à comunidade", "tipo": "topico", "ref": "Art. 42", "filhos": [{"t": "Instituições de EPT, além dos cursos regulares, OFERECERÃO cursos especiais", "tipo": "competencia", "ref": "Art. 42"}, {"t": "Matrícula condicionada à capacidade de aproveitamento, não necessariamente ao nível de escolaridade", "tipo": "regra", "ref": "Art. 42"}]}, {"t": "Art. 42-A – Itinerários contínuos e catálogos (Lei 14.645/2023)", "tipo": "topico", "ref": "Art. 42-A", "filhos": [{"t": "Princípio da integração curricular entre cursos e programas", "tipo": "conceito", "d": "EPT organizada em eixos tecnológicos, para viabilizar itinerários formativos contínuos e trajetórias progressivas entre todos os níveis educacionais.", "ref": "Art. 42-A, caput"}, {"t": "Itinerário contínuo: percurso que permite aproveitamento incremental", "tipo": "conceito", "d": "De experiências, certificações e conhecimentos ao longo da trajetória individual do estudante.", "ref": "Art. 42-A, § 1º"}, {"t": "Pode integrar um ou mais eixos tecnológicos", "tipo": "regra", "ref": "Art. 42-A, § 2º"}, {"t": "CNCT e CNCST orientam cursos e itinerários por eixos tecnológicos", "tipo": "regra", "d": "Para permitir equivalência no aproveitamento de estudos entre os níveis médio e superior.", "ref": "Art. 42-A, § 3º", "filhos": [{"t": "CNCT = Catálogo Nacional de Cursos Técnicos", "tipo": "conceito", "ref": "Art. 42-A, § 3º"}, {"t": "CNCST = Catálogo Nacional de Cursos Superiores de Tecnologia", "tipo": "conceito", "ref": "Art. 42-A, § 3º"}]}, {"t": "MEC mantém e atualiza periodicamente os catálogos", "tipo": "competencia", "d": "Em colaboração com sistemas de ensino, instituições e redes de EPT e entidades representativas de empregadores e trabalhadores; observadas a CBO e a dinâmica do mundo do trabalho.", "ref": "Art. 42-A, § 4º"}]}, {"t": "Art. 42-B – Oferta orientada pela avaliação de qualidade", "tipo": "topico", "ref": "Art. 42-B", "filhos": [{"t": "Avaliação das instituições e cursos do art. 9º, VII-A (União, em colaboração com os sistemas)", "tipo": "competencia", "ref": "Art. 42-B; art. 9º, VII-A"}, {"t": "Critérios que a avaliação deve considerar", "tipo": "classificacao", "ref": "Art. 42-B", "filhos": [{"t": "Estatísticas de oferta, fluxo e rendimento", "tipo": "classificacao", "ref": "Art. 42-B"}, {"t": "Aprendizagem dos saberes do trabalho", "tipo": "classificacao", "ref": "Art. 42-B"}, {"t": "Aderência da oferta ao contexto social, econômico e produtivo local e nacional", "tipo": "classificacao", "ref": "Art. 42-B"}, {"t": "Inserção dos egressos no mundo do trabalho", "tipo": "classificacao", "ref": "Art. 42-B"}, {"t": "Condições institucionais de oferta", "tipo": "classificacao", "ref": "Art. 42-B"}]}]}]}}, {"id": "ldb-C-superior-1", "titulo": "Título V, Cap. IV – Educação superior: finalidades, cursos, regulação, diplomas (arts. 43–51)", "raiz": {"t": "Educação superior – finalidades, cursos, regulação e vida acadêmica (arts. 43–51)", "tipo": "topico", "filhos": [{"t": "Finalidades da educação superior (8 incisos)", "tipo": "classificacao", "ref": "Art. 43", "filhos": [{"t": "Estimular criação cultural, espírito científico e pensamento reflexivo", "tipo": "regra", "ref": "Art. 43, I"}, {"t": "Formar diplomados aptos à inserção profissional e ao desenvolvimento da sociedade; colaborar na formação contínua", "tipo": "regra", "ref": "Art. 43, II"}, {"t": "Incentivar pesquisa e investigação científica", "tipo": "regra", "d": "Visando ao desenvolvimento da ciência e da tecnologia e à criação e difusão da cultura, e, assim, desenvolver o entendimento do homem e do meio em que vive.", "ref": "Art. 43, III"}, {"t": "Divulgar conhecimentos culturais, científicos e técnicos (patrimônio da humanidade)", "tipo": "regra", "d": "Comunicar o saber através do ensino, de publicações ou de outras formas de comunicação.", "ref": "Art. 43, IV"}, {"t": "Suscitar desejo permanente de aperfeiçoamento cultural e profissional", "tipo": "regra", "d": "Integrando os conhecimentos numa estrutura intelectual sistematizadora do conhecimento de cada geração.", "ref": "Art. 43, V"}, {"t": "Conhecer problemas do mundo presente (nacionais e regionais); prestar serviços especializados à comunidade", "tipo": "regra", "d": "Estabelecendo com a comunidade uma relação de reciprocidade.", "ref": "Art. 43, VI"}, {"t": "Promover a extensão, aberta à participação da população", "tipo": "regra", "d": "Visando à difusão das conquistas e benefícios da criação cultural e da pesquisa científica e tecnológica geradas na instituição.", "ref": "Art. 43, VII"}, {"t": "Atuar pela universalização e aprimoramento da educação básica", "tipo": "regra", "d": "Mediante formação e capacitação de profissionais, pesquisas pedagógicas e atividades de extensão que aproximem os dois níveis escolares. Incluído pela Lei 13.174/2015.", "ref": "Art. 43, VIII", "filhos": [{"t": "Inciso VIII não existia na redação original (só 7 finalidades)", "tipo": "atencao", "ref": "Art. 43, VIII"}]}]}, {"t": "Cursos e programas (4 espécies)", "tipo": "classificacao", "ref": "Art. 44", "filhos": [{"t": "Sequenciais por campo de saber", "tipo": "classificacao", "d": "De diferentes níveis de abrangência; abertos a quem atenda aos requisitos das instituições, desde que tenha concluído o ensino médio ou equivalente (Lei 11.632/2007).", "ref": "Art. 44, I", "filhos": [{"t": "Hoje exigem ensino médio concluído (redação original não exigia)", "tipo": "atencao", "ref": "Art. 44, I"}]}, {"t": "Graduação", "tipo": "classificacao", "d": "Abertos a quem concluiu o ensino médio ou equivalente E foi classificado em processo seletivo.", "ref": "Art. 44, II"}, {"t": "Pós-graduação", "tipo": "classificacao", "d": "Mestrado e doutorado, especialização, aperfeiçoamento e outros; abertos a diplomados em graduação que atendam às exigências das instituições.", "ref": "Art. 44, III"}, {"t": "Extensão", "tipo": "classificacao", "d": "Abertos a candidatos que atendam aos requisitos estabelecidos em cada caso pelas instituições.", "ref": "Art. 44, IV"}, {"t": "Processo seletivo da graduação", "tipo": "topico", "filhos": [{"t": "Resultado tornado público pela IES", "tipo": "regra", "d": "Obrigatória a divulgação da relação nominal dos classificados, da ordem de classificação e do cronograma das chamadas para matrícula, conforme critérios do edital.", "ref": "Art. 44, § 1º"}, {"t": "Candidato, classificado ou não, tem direito de acesso a suas notas e à sua posição na classificação geral", "tipo": "regra", "d": "Notas ou indicadores de desempenho em provas, exames e demais atividades da seleção (Lei 13.826/2019).", "ref": "Art. 44, § 1º"}, {"t": "Empate em IES pública: prioridade a renda familiar inferior a 10 salários mínimos", "tipo": "prazo", "d": "Se mais de um candidato preencher o critério, prioridade ao de menor renda familiar (Lei 13.184/2015).", "ref": "Art. 44, § 2º", "filhos": [{"t": "Critério de desempate só para instituições PÚBLICAS", "tipo": "atencao", "ref": "Art. 44, § 2º"}]}, {"t": "Seleção considerará competências e habilidades da BNCC", "tipo": "regra", "d": "Incluído pela Lei 13.415/2017.", "ref": "Art. 44, § 3º"}]}]}, {"t": "Instituições de ensino superior", "tipo": "regra", "d": "Públicas ou privadas, com variados graus de abrangência ou especialização.", "ref": "Art. 45"}, {"t": "Regulação e avaliação", "tipo": "topico", "ref": "Art. 46", "filhos": [{"t": "Autorização e reconhecimento de cursos + credenciamento de IES: prazos limitados", "tipo": "regra", "d": "Renovados periodicamente, após processo regular de avaliação.", "ref": "Art. 46, caput"}, {"t": "Prazo para saneamento de deficiências → reavaliação", "tipo": "regra", "ref": "Art. 46, § 1º", "filhos": [{"t": "Possíveis resultados da reavaliação (qualquer IES)", "tipo": "sancao", "d": "Desativação de cursos e habilitações; intervenção na instituição; suspensão temporária de prerrogativas da autonomia; descredenciamento.", "ref": "Art. 46, § 1º"}]}, {"t": "IES pública: Poder Executivo mantenedor acompanha o saneamento e fornece recursos adicionais, se necessários", "tipo": "competencia", "ref": "Art. 46, § 2º"}, {"t": "IES privada: sanções adicionais", "tipo": "sancao", "d": "Além das do § 1º: redução de vagas autorizadas e suspensão temporária de novos ingressos e de oferta de cursos (Lei 13.530/2017).", "ref": "Art. 46, § 3º"}, {"t": "MEC pode comutar as penalidades dos §§ 1º e 3º por outras medidas", "tipo": "regra", "d": "Faculdade; mediante procedimento específico e com aquiescência da instituição, para resguardar os interesses dos estudantes, desde que as medidas sejam adequadas para superar as deficiências e irregularidades (Lei 13.530/2017).", "ref": "Art. 46, § 4º", "filhos": [{"t": "Exige concordância (aquiescência) da instituição", "tipo": "atencao", "ref": "Art. 46, § 4º"}]}, {"t": "Medicina: Estados e DF devem adotar critérios da União para autorizar curso de graduação", "tipo": "competencia", "d": "Para fins de regulação (Lei 13.530/2017).", al", "tipo": "competencia", "ref": "Art. 54, § 1º, II"}, {"t": "Aprovar e executar planos de investimentos conforme recursos do Poder mantenedor", "tipo": "competencia", "ref": "Art. 54, § 1º, III"}, {"t": "Elaborar orçamentos anuais e plurianuais", "tipo": "competencia", "ref": "Art. 54, § 1º, IV"}, {"t": "Adotar regime financeiro e contábil próprio às suas peculiaridades", "tipo": "competencia", "ref": "Art. 54, § 1º, V"}, {"t": "Realizar operações de crédito/financiamento, com aprovação do Poder competente", "tipo": "competencia", "d": "Para aquisição de bens imóveis, instalações e equipamentos.", "ref": "Art. 54, § 1º, VI"}, {"t": "Efetuar transferências, quitações e outras providências orçamentárias, financeiras e patrimoniais", "tipo": "competencia", "ref": "Art. 54, § 1º, VII"}]}, {"t": "Autonomia pode ser estendida a instituições com alta qualificação (ensino ou pesquisa)", "tipo": "regra", "d": "Com base em avaliação realizada pelo Poder Público.", "ref": "Art. 54, § 2º"}]}, {"t": "União assegura anualmente, no Orçamento Geral, recursos para as IES que mantém", "tipo": "competencia", "ref": "Art. 55"}, {"t": "Gestão das IES públicas", "tipo": "topico", "ref": "Art. 56", "filhos": [{"t": "Princípio da gestão TRANSPARENTE e democrática", "tipo": "conceito", "d": "Assegurados órgãos colegiados deliberativos com participação dos segmentos da comunidade institucional, local e regional (redação da Lei 15.001/2024).", "ref": "Art. 56, caput", "filhos": [{"t": "“Transparente” foi acrescido pela Lei 15.001/2024; original falava só em gestão democrática", "tipo": "atencao", "ref": "Art. 56, caput"}]}, {"t": "Docentes ocupam 70% dos assentos em cada órgão colegiado e comissão", "tipo": "prazo", "d": "Em qualquer caso, inclusive nos que tratam de elaboração/modificação de estatutos e regimentos e da escolha de dirigentes.", "ref": "Art. 56, parágrafo único"}]}, {"t": "Professor de IES pública: mínimo de 8 horas semanais de aulas", "tipo": "prazo", "ref": "Art. 57", "fi "colunas": ["Aspecto", "Integrada", "Concomitante", "Subsequente"], "linhas": [["Base legal", "Art. 36-C, I", "Art. 36-C, II", "Art. 36-B, II"], ["Forma-mãe", "Articulada (art. 36-B, I)", "Articulada (art. 36-B, I)", "Autônoma (art. 36-B, II)"], ["Público", "Quem já concluiu o ensino fundamental", "Quem ingressa no ensino médio ou já o cursa", "Quem já concluiu o ensino médio"], ["Matrícula", "Única", "Distintas para cada curso", "Só no curso técnico"], ["Instituição", "Mesma instituição", "Mesma ou distintas (inclusive por convênio de intercomplementaridade com projeto pedagógico unificado)", "Não especificado"], ["Certificados de qualificação por etapa (art. 36-D, p.ú.)", "Não mencionada", "Sim, se estruturada em etapas com terminalidade", "Sim, se estruturada em etapas com terminalidade"], ["Articulação com aprendizagem profissional (art. 36-B, § 2º)", "Sim (é articulada)", "Sim (é articulada)", "Sim"]]}, {"titulo": "Formação geral básica × Itinerários formativos", "colunas": ["Aspecto", "Formação geral básica (FGB)", "Itinerários formativos"], "linhas": [["Base legal", "Art. 35-C", "Art. 36"], ["Carga mínima", "2.400 h (2.100 h se houver formação técnica)", "600 h, ressalvadas especificidades da formação técnica"], ["Conteúdo", "BNCC (4 áreas) + parte diversificada (art. 26)", "Aprofundamento de áreas ou formação técnica e profissional, articulados com a parte diversificada"], ["Exigência", "BNCC cumprida integralmente (art. 35-D, § 1º)", "Cada itinerário aprofunda integralmente ao menos 1 área, salvo o técnico (§ 1º-A)"], ["Oferta pela escola", "Para todos", "Mínimo de 2 itinerários com ênfases distintas cobrindo as 4 áreas, salvo escolas com formação técnica (§ 2º-A)"], ["Diretrizes", "BNCC conforme diretrizes do CNE (art. 35-D)", "Diretrizes nacionais de aprofundamento do CNE com sistemas estaduais/distrital (§ 2º-B); técnica: DCN de EPT e CNCT (inciso V)"]]}, {"titulo": "Cursos da educação profissional e tecnológica (art. 39, § 2º)", "colunas": ["Aspecto", "FIC / qualificação", "Técnico de nível médio", "Tecnológico (graduação e pós)"], "linhas": [["Inciso", "I", "II", "III"], ["Disciplina legal", "Arts. 39–42 (e cursos especiais do art. 42)", "Seção IV-A (arts. 36-A–36-D) e art. 36, V", "Art. 39, § 3º (DCN do CNE quanto a objetivos, características e duração)"], ["Catálogo", "—", "CNCT (art. 42-A, § 3º)", "CNCST (art. 42-A, § 3º)"], ["Certificação/diploma", "Certificação de saberes (art. 41)", "Diploma registrado com validade nacional (art. 36-D)", "Aproveitamento da EPTNM em áreas afins (art. 39, § 4º)"]]}, {"titulo": "Reconhecimento de saberes fora da escola", "colunas": ["Aspecto", "Art. 35-B, § 4º", "Art. 38, § 2º", "Art. 41"], "linhas": [["Âmbito", "Ensino médio em tempo integral", "EJA / exames supletivos", "Educação profissional e tecnológica"], ["Natureza", "Excepcional e facultativo (\"poderão\")", "Obrigatório: \"serão aferidos e reconhecidos\"", "Facultativo (\"poderá\")"], ["Meio", "Formas de comprovação definidas pelos sistemas (estágio, aprendizagem, trabalho, qualificação, extensão, IC, grêmio)", "Exames", "Avaliação, reconhecimento e certificação"], ["Finalidade", "Cumprir exigências curriculares", "Reconhecer conhecimentos adquiridos por meios informais", "Prosseguimento ou conclusão de estudos"]]}, {"titulo": "Diploma estrangeiro: graduação × mestrado/doutorado", "colunas": ["Aspecto", "Graduação", "Mestrado e doutorado"], "linhas": [["Ato", "Revalidação", "Reconhecimento"], ["Quem faz", "Universidades públicas", "Universidades (públicas ou privadas) com pós-graduação reconhecida e avaliada"], ["Requisito", "Curso do mesmo nível e área ou equivalente", "Mesma área, nível equivalente ou superior"], ["Ressalva", "Acordos internacionais de reciprocidade ou equiparação", "—"], ["Base legal", "Art. 48, § 2º", "Art. 48, § 3º"]]}, {"titulo": "Sanções da reavaliação: qualquer IES × IES privada", "colunas": ["Aspecto", "Qualquer IES (§ 1º)", "Adicionais para IES privada (§ 3º)"], "linhas": [["Sanções", "Desativação de cursos e habilitações; intervenção; suspensão temporária de prerrogativas da autonomia; descredenciamento", "Redução de vagas autorizadas; suspensão temporária de novos ingressos e de oferta de cursos"], ["IES pública", "Executivo mantenedor acompanha o saneamento e fornece recursos adicionais (§ 2º)", "Não se aplica"], ["Comutação", "MEC pode comutar, com aquiescência da IES (§ 4º)", "MEC pode comutar, com aquiescência da IES (§ 4º)"]]}, {"titulo": "Autonomia: todas as universidades (art. 53) × universidades públicas (art. 54, § 1º)", "colunas": ["Aspecto", "Art. 53 (todas)", "Art. 54, § 1º (públicas, além do art. 53)"], "linhas": [["Acadêmico", "Criar/extinguir cursos na sede; fixar currículos e vagas; pesquisa e extensão; conferir graus e diplomas", "—"], ["Pessoal", "Contratação e dispensa de professores e planos de carreira decididos pelos colegiados (§ 1º)", "Propor quadro de pessoal e plano de cargos e salários; elaborar regulamento de pessoal"], ["Financeiro", "Contratos e convênios; investimentos; administrar rendimentos; receber doações e legados", "Orçamentos anuais e plurianuais; regime financeiro e contábil próprio; operações de crédito com aprovação do Poder competente; transferências e quitações"], ["Doações", "Podem ser dirigidas a setores/projetos (§ 2º)", "Vão ao caixa único, com destinação garantida (art. 53, § 3º)"]]}, {"titulo": "Educação especial × educação bilíngue de surdos", "colunas": ["Aspecto", "Educação especial (Cap. V)", "Educação bilíngue de surdos (Cap. V-A)"], "linhas": [["Conceito", "Modalidade preferencialmente na rede regular", "Modalidade em Libras (L1) e português escrito (L2)"], ["Público", "Deficiência, TGD, altas habilidades ou superdotação", "Surdos, surdo-cegos, deficientes auditivos sinalizantes, surdos com altas habilidades ou outras deficiências associadas, optantes"], ["Início", "Educação infantil, ao longo da vida", "Zero ano, na educação infantil, ao longo da vida"], ["Locais", "Rede regular; classes/escolas/serviços especializados se impossível a integração", "Escolas bilíngues, classes bilíngues, escolas comuns ou polos"], ["Professores", "Especialização em nível médio ou superior (art. 59, III)", "Bilíngues com formação e especialização em nível superior (art. 60-B)"], ["Base legal", "Arts. 58–60", "Arts. 60-A–60-B"]]}, {"titulo": "Despesas de MDE: é × não é", "colunas": ["Tema", "É MDE (art. 70)", "Não é MDE (art. 71)"], "linhas": [["Pessoal", "Remuneração e aperfeiçoamento de docentes e demais profissionais", "Pessoal em desvio de função ou atividade alheia ao ensino"], ["Pesquisa", "Levantamentos, estudos e pesquisas para qualidade e expansão do ensino", "Pesquisa não vinculada às instituições de ensino ou sem visar qualidade/expansão"], ["Obras", "Construção e conservação de instalações necessárias ao ensino", "Obras de infraestrutura, mesmo que beneficiem a rede escolar"], ["Assistência ao aluno", "Material didático-escolar e transporte escolar; bolsas de estudo", "Alimentação, assistência médico-odontológica, farmacêutica, psicológica e social"], ["Outros", "Atividades-meio; amortização de operações de crédito; feiras e mostras (IX)", "Subvenção assistencial, desportiva ou cultural; formação de quadros da administração (militares, civis, diplomatas)"]]}, {"titulo": "Educação indígena × educação de surdos (disposições gerais)", "colunas": ["Aspecto", "Indígenas", "Surdos"], "linhas": [["Quem desenvolve programas", "Sistema de Ensino da União, com agências federais de cultura e de assistência aos índios (art. 78)", "Os sistemas de ensino, em regime de colaboração (art. 78-A)"], ["Apoio técnico e financeiro", "União (art. 79)", "União (art. 79-C)"], ["Planejamento", "Com audiência das comunidades indígenas", "Com participação das comunidades surdas, IES e entidades representativas"], ["Língua fortalecida", "Língua materna de cada comunidade", "Libras"], ["Plano", "Planos Nacionais de Educação", "Plano Nacional de Educação"]]}, {"titulo": "Formação de professores: regra × exceções", "colunas": ["Situação", "Formação exigida", "Base legal"], "linhas": [["Docência na educação básica (regra)", "Nível superior, licenciatura plena", "Art. 62"], ["Educação infantil e 5 primeiros anos do fundamental", "Mínimo: nível médio, modalidade normal", "Art. 62"], ["Itinerário de formação técnica e profissional", "Notório saber reconhecido pelo sistema", "Art. 61, IV"], ["Especialistas (administração, supervisão etc.)", "Graduação em pedagogia ou pós-graduação", "Art. 64"], ["Magistério superior", "Pós-graduação, prioritariamente mestrado/doutorado; ou notório saber reconhecido por universidade com doutorado em área afim", "Art. 66"]]}], "pegadinhas": [{"texto": "ERRADO: “a educação básica é obrigatória dos 6 aos 14 anos” (ou “só o fundamental é obrigatório”). Vigente: obrigatória e gratuita dos 4 aos 17 anos, abrangendo pré-escola, fundamental e médio.", "ref": "Art. 4º, I"}, {"texto": "ERRADO: “a creche integra a educação básica obrigatória”. A obrigatoriedade começa na pré-escola (4 anos); a educação infantil é GRATUITA até 5 anos, mas a creche não é obrigatória.", "ref": "Art. 4º, I e II"}, {"texto": "ERRADO: “educação infantil vai até 6 anos e pré-escola de 4 a 6”. Vigente: até 5 anos; creche até 3 e pré-escola de 4 a 5.", "ref": "Arts. 29 e 30"}, {"texto": "ERRADO: “é dever dos pais matricular os filhos a partir dos 6 (ou 7) anos”. Vigente: a partir dos 4 anos, na educação básica.", "ref": "Art. 6º"}, {"texto": "ERRADO: “direito público subjetivo é o acesso ao ensino fundamental”. Vigente: o acesso à educação básica OBRIGATÓRIA; e a ação judicial é gratuita e de rito sumário.", "ref": "Art. 5º, caput e § 3º"}, {"texto": "ERRADO: “a carga horária mínima anual é de 800 horas para todo o ensino básico”. No médio são 1.000 h; no fundamental e na educação infantil, 800 h; ampliação progressiva para 1.400 h conforme o PNE.", "ref": "Arts. 24, I e § 1º; 31, II"}, {"texto": "Frequência mínima: 75% do total de horas letivas no fundamental e médio (para aprovação) × 60% do total de horas na pré-escola. Não inverter.", "ref": "Arts. 24, VI; 31, IV"}, {"texto": "Educação infantil: 4 h diárias no turno parcial e 7 h na jornada integral; a avaliação NÃO tem objetivo de promoção, nem para ingresso no fundamental.", "ref": "Art. 31, I e III"}, {"texto": "ERRADO: “o Município pode reconhecer e avaliar cursos”. O Município autoriza, credencia e supervisiona; reconhecer e avaliar são verbos de União e Estados.", "ref": "Arts. 9º, IX; 10, IV; 11, IV"}, {"texto": "IES mantida por Município integra o sistema ESTADUAL; IES privada integra o sistema FEDERAL; escola privada de educação infantil integra o sistema MUNICIPAL (no DF, o sistema do DF).", "ref": "Arts. 16, II; 17, II e p.u.; 18, II"}, {"texto": "ERRADO: “confessionais e filantrópicas são categorias administrativas”. As categorias são públicas, privadas e comunitárias; privadas e comunitárias PODEM qualificar-se como confessionais e ser certificadas como filantrópicas. Art. 20 revogado (Lei 13.868/2019).", "ref": "Art. 19; art. 20"}, {"texto": "ERRADO: “as normas da gestão democrática são definidas pelos sistemas de ensino”. Hoje é LEI dos respectivos Estados, Municípios e DF (Lei 14.644/2023). No Conselho Escolar, o Diretor é membro NATO; os demais são eleitos por seus pares.", "ref": "Art. 14, caput e § 1º"}, {"texto": "Escola deve notificar ao Conselho Tutelar a relação de alunos com faltas acima de 30% do percentual permitido em lei (não 50%) e os casos de violência (automutilação, tentativas de suicídio, suicídios).", "ref": "Art. 12, VIII"}, {"texto": "Educação física: o componente é obrigatório; a PRÁTICA é facultativa ao aluno com jornada ≥ 6 h, maior de 30 anos, em serviço militar, amparado pelo DL 1.044/1969 ou que tenha prole. Não há hipótese de “curso noturno”.", "ref": "Art. 26, § 3º"}, {"texto": "Ensino religioso: matrícula facultativa, disciplina dos horários normais das escolas PÚBLICAS de ensino FUNDAMENTAL (não do médio), vedado o proselitismo; a expressão “sem ônus para os cofres públicos” não existe mais.", "ref": "Art. 33"}, {"texto": "O ensino médio tem duração MÍNIMA (não máxima) de três anos.", "ref": "Art. 35, caput"}, {"texto": "FGB: mínimo de 2.400 h; quando houver formação técnica e profissional, mínimo de 2.100 h, admitindo-se que até 300 h da FGB aprofundem conteúdos da BNCC ligados ao curso técnico (Lei 14.945/2024).", "ref": "Art. 35-C"}, {"texto": "Itinerários: mínimo de 600 h, ressalvadas as especificidades da formação técnica e profissional. É piso (mínimo), não teto, e não se confunde com as 2.400 h da FGB.", "ref": "Arts. 35-C e 36, caput"}, {"texto": "Os sistemas DEVEM garantir que toda escola de ensino médio ofereça o aprofundamento integral das quatro áreas em, no mínimo, 2 itinerários com ênfases distintas — exceto as escolas que oferecerem formação técnica e profissional.", "ref": "Art. 36, § 2º-A"}, {"texto": "O ensino médio é presencial; ensino mediado por tecnologia só EXCEPCIONALMENTE, conforme regulamento feito com participação dos sistemas estaduais e distrital.", "ref": "Art. 35-B, § 3º"}, {"texto": "Inglês integra a área de linguagens da BNCC; o espanhol NÃO é obrigatório: os currículos 'poderão' ofertar outras línguas estrangeiras, 'preferencialmente o espanhol'.", "ref": "Art. 35-D, I e § 3º"}, {"texto": "Forma integrada: só para quem concluiu o ensino FUNDAMENTAL, mesma instituição e matrícula ÚNICA. Instituições distintas com convênio de intercomplementaridade e projeto pedagógico unificado é forma CONCOMITANTE (matrículas distintas).", "ref": "Art. 36-C, I e II, c"}, {"texto": "Subsequente é para quem já concluiu o ensino MÉDIO; concomitante é para quem ingressa no ensino médio ou já o está cursando.", "ref": "Arts. 36-B, II; 36-C, II"}, {"texto": "Diplomas técnicos de nível médio têm validade nacional e habilitam ao ensino superior apenas QUANDO REGISTRADOS.", "ref": "Art. 36-D, caput"}, {"texto": "Certificados de qualificação para o trabalho por etapa estão previstos para as formas articulada CONCOMITANTE e SUBSEQUENTE (não há menção à integrada). Já o art. 36, § 6º, II (certificados intermediários no itinerário técnico) foi REVOGADO pela Lei 14.945/2024.", "ref": "Art. 36-D, parágrafo único; art. 36, § 6º, II"}, {"texto": "Exames supletivos: conclusão do fundamental para MAIORES de 15 anos; do médio para MAIORES de 18 anos.", "ref": "Art. 38, § 1º"}, {"texto": "A EJA deve articular-se 'preferencialmente' (não obrigatoriamente) com a educação profissional, na forma do regulamento.", "ref": "Art. 37, § 3º"}, {"texto": "A EPT abrange cursos de FIC/qualificação, técnicos de nível médio e tecnológicos de graduação E de pós-graduação.", "ref": "Art. 39, § 2º"}, {"texto": "Cursos especiais das instituições de EPT: 'oferecerão' (dever), abertos à comunidade, com matrícula condicionada à capacidade de aproveitamento e NÃO necessariamente ao nível de escolaridade.", "ref": "Art. 42"}, {"texto": "Formações experimentais fora do CNCT: reconhecimento pelo Conselho ESTADUAL de Educação em 3 anos e inserção no CNCT em 5 anos, contados da oferta inicial.", "ref": "Art. 36, § 7º"}, {"texto": "Art. 57: o professor de IES PÚBLICA tem MÍNIMO de 8 horas semanais de aulas – não “máximo”, não 12 h, e não se aplica às privadas.", "ref": "Art. 57"}, {"texto": "Art. 56, parágrafo único: docentes ocupam 70% dos assentos dos colegiados e comissões – inclusive nos de escolha de dirigentes e de reforma estatutária (não 50% nem 2/3).", "ref": "Art. 56, parágrafo único"}, {"texto": "Art. 56 hoje fala em gestão “transparente e democrática” (Lei 15.001/2024); a redação original falava apenas em gestão democrática.", "ref": "Art. 56"}, {"texto": "Universidade exige 1/3 (não metade) do corpo docente com mestrado OU doutorado e 1/3 em tempo integral.", "ref": "Art. 52, II e III"}, {"texto": "Diploma estrangeiro de graduação é REVALIDADO só por universidade PÚBLICA; de mestrado/doutorado é RECONHECIDO por universidade com pós-graduação reconhecida e avaliada (pode ser privada).", "ref": "Art. 48, §§ 2º e 3º"}, {"texto": "Oferta de graduação noturna é obrigatória apenas nas instituições PÚBLICAS; nas privadas, se houver, deve ter o mesmo padrão de qualidade do diurno.", "ref": "Art. 47, § 4º"}, {"texto": "Cursos sequenciais hoje exigem ensino médio concluído (Lei 11.632/2007); na redação original bastavam os requisitos da instituição.", "ref": "Art. 44, I"}, {"texto": "Art. 62 atual: nível médio (normal) é formação mínima para educação infantil e os CINCO primeiros anos do fundamental – a redação original dizia “quatro primeiras séries”.", "ref": "Art. 62"}, {"texto": "Formação INICIAL de professores: preferência ao presencial (EaD só subsidiariamente); formação CONTINUADA e capacitação podem usar EaD.", "ref": "Art. 62, §§ 2º e 3º"}, {"texto": "Prática de ensino mínima de 300 horas vale para a formação docente, EXCETO para a educação superior.", "ref": "Art. 65"}, {"texto": "Notório saber que supre título no magistério superior deve ser reconhecido por universidade com curso de DOUTORADO (não mestrado) em área afim.", "ref": "Art. 66, parágrafo único"}, {"texto": "Art. 82 hoje trata apenas de normas de ESTÁGIO pelos sistemas de ensino, observada a lei federal; o parágrafo único (sem vínculo empregatício, bolsa, seguro) foi revogado.", "ref": "Art. 82"}, {"texto": "União aplica no mínimo 18% (e não 25%) da receita de impostos em MDE; Estados, DF e Municípios, 25% ou o previsto nas Constituições/Leis Orgânicas.", "ref": "Art. 69"}, {"texto": "Repasse: arrecadado do 1º ao 10º dia → até o dia 20; do 11º ao 20º → até o dia 30; do 21º ao fim → até o dia 10 do mês seguinte.", "ref": "Art. 69, § 5º"}, {"texto": "Transporte escolar e material didático SÃO despesas de MDE; alimentação (merenda) e assistência médica NÃO são.", "ref": "Arts. 70, VIII; 71, IV"}, {"texto": "Concurso exigível por qualquer cidadão habilitado quando o cargo docente público é ocupado por não concursado há MAIS DE 6 anos.", "ref": "Art. 85"}, {"texto": "Professores bilíngues para surdos devem ter formação em nível SUPERIOR (art. 60-B); para a educação especial em geral, admite-se especialização em nível médio (art. 59, III).", "ref": "Arts. 59, III; 60-B"}, {"texto": "Terminalidade específica é para quem não atingir o nível exigido para concluir o ensino FUNDAMENTAL (não o médio); aceleração é para superdotados.", "ref": "Art. 59, II"}], "erros_frequentes": [{"texto": "Estudar pela redação original (mapa antigo): infantil até 6 anos, fundamental de 8 anos, obrigatoriedade só no fundamental, 800 h no médio. O texto vigente mudou todos esses números.", "ref": "Arts. 4º, 6º, 24, 29, 30, 32"}, {"texto": "Confundir “elaborar” a proposta pedagógica (estabelecimento) com “participar da elaboração” (docente).", "ref": "Arts. 12, I; 13, I"}, {"texto": "Confundir progressão PARCIAL (admitida pelo regimento, preservada a sequência do currículo) com progressão CONTINUADA (regime do fundamental).", "ref": "Arts. 24, III; 32, § 2º"}, {"texto": "Achar que a classificação independente de escolarização anterior vale para a primeira série do fundamental: o art. 24, II exclui a primeira série do fundamental.", "ref": "Art. 24, II"}, {"texto": "Supor que o art. 26-A (história afro-brasileira e indígena) e o art. 26-B (perspectivas femininas) alcançam a educação infantil ou só escolas públicas: valem para fundamental e médio, públicos E privados.", "ref": "Arts. 26-A e 26-B"}, {"texto": "Tratar como obrigatória a progressão continuada ou os ciclos: são facultativos (“podem adotar”, “é facultado”).", "ref": "Art. 32, §§ 1º e 2º"}, {"texto": "Esquecer a exceção do ensino militar na escusa religiosa do art. 7º-A.", "ref": "Art. 7º-A, § 4º"}, {"texto": "Confundir 'formação geral básica' (art. 35-C, 2.400 h) com 'Base Nacional Comum Curricular' (art. 35-D): a FGB articula a BNCC e a parte diversificada.", "ref": "Arts. 35-C e 35-D"}, {"texto": "Achar que a forma integrada pode ocorrer em instituições distintas: a lei exige a mesma instituição e matrícula única.", "ref": "Art. 36-C, I"}, {"texto": "Citar o art. 35-A ou os §§ 10 e 11 do art. 36 (módulos/créditos; reconhecimento de competências e convênios com EaD) como vigentes: foram retirados/revogados pela Lei 14.945/2024.", "ref": "Art. 36, §§ 10 e 11"}, {"texto": "Atribuir a manutenção dos catálogos CNCT/CNCST ao CNE: é o MEC, em colaboração com sistemas, redes de EPT e entidades de empregadores e trabalhadores, observada a CBO.", "ref": "Art. 42-A, § 4º"}, {"texto": "Supor que a escola noturna seja dever dos Municípios: são os ESTADOS que mantêm ao menos 1 escola com ensino médio noturno na sede de cada Município, havendo demanda manifesta e comprovada.", "ref": "Art. 36, § 8º-A"}, {"texto": "Ler o art. 41 como dever: o conhecimento adquirido na EPT, inclusive no trabalho, 'poderá' ser avaliado, reconhecido e certificado.", "ref": "Art. 41"}, {"texto": "Achar que a educação especial começa “de zero a seis anos” (redação original); hoje começa na educação infantil e se estende ao longo da vida.", "ref": "Art. 58, § 3º"}, {"texto": "Confundir as funções de magistério para aposentadoria especial com qualquer atividade educativa: só em estabelecimento de educação básica (docência, direção, coordenação e assessoramento pedagógico).", "ref": "Art. 67, § 2º"}, {"texto": "Supor que o art. 61 ainda define fundamentos da formação no caput: hoje o caput lista quem são os profissionais da educação básica e os fundamentos estão no § 1º.", "ref": "Art. 61"}, {"texto": "Pensar que o MEC pode comutar penalidades unilateralmente: exige procedimento específico e aquiescência da instituição.", "ref": "Art. 46, § 4º"}, {"texto": "Achar que a EaD é credenciada pelos sistemas estaduais: o credenciamento das instituições é da União; normas de produção, controle, avaliação e autorização dos programas cabem aos sistemas.", "ref": "Art. 80, §§ 1º e 3º"}, {"texto": "Confundir ação supletiva/redistributiva vedada: não pode beneficiar ente que ofereça vagas abaixo da sua capacidade de atendimento.", "ref": "Art. 75, § 4º"}, {"texto": "Achar que doações a universidades públicas podem ir diretamente às unidades: vão ao caixa único, com destinação garantida às unidades.", "ref": "Art. 53, § 3º"}], "relacoes": [{"texto": "CF/88: o art. 2º da LDB espelha o art. 205; o art. 3º reproduz e amplia o art. 206; o art. 4º desdobra o art. 208 (EC 59/2009 ampliou a obrigatoriedade para 4 a 17 anos); o art. 5º, § 3º remete ao art. 208, § 2º; o art. 7º, III ressalva o art. 213; o art. 7º-A invoca o art. 5º, VIII (escusa de consciência).", "ext": true}, {"texto": "Lei 12.527/2011 (LAI): o art. 5º, § 7º submete os sistemas de informações educacionais ao dever de transparência e ao direito de acesso à informação; o art. 14-A, VI remete à LGPD (Lei 13.709/2018) quanto aos currículos de dirigentes.", "ext": true}, {"texto": "ECA (Lei 8.069/1990): diretriz dos conteúdos sobre direitos de crianças e adolescentes (art. 32, § 5º) e o Conselho Tutelar é o destinatário das notificações do art. 12, VIII.", "ext": true}, {"texto": "Lei 13.005/2014 (PNE 2014–2024, prorrogado) e o novo PNE: o art. 24, § 1º vincula a ampliação para 1.400 h aos prazos e metas do Plano Nacional de Educação; o art. 9º, I atribui à União a elaboração do PNE.", "ext": true}, {"texto": "Lei 12.711/2012 (cotas): mencionada no art. 14-A, I (reserva de vagas nas instituições federais).", "ext": true}, {"texto": "STF, ADI 4439 (2017): admitiu ensino religioso confessional nas escolas públicas, em matrícula facultativa (art. 33).", "ext": true}, {"texto": "Art. 24, I (mesma LDB): 1.000 h anuais mínimas no ensino médio em 200 dias letivos; com os 3 anos mínimos do art. 35, fecha 3.000 h = 2.400 h (FGB) + 600 h (itinerários)."}, {"texto": "Art. 26, caput (mesma LDB): parte diversificada que se articula com a BNCC na FGB (art. 35-C) e com os itinerários (art. 36)."}, {"texto": "Art. 9º, VII-A (mesma LDB, Lei 14.645/2023): a União assegura, em colaboração, processo nacional de avaliação das instituições e cursos de EPT, referência para o art. 42-B."}, {"texto": "Lei 10.097/2000 (Lei da Aprendizagem, que alterou a CLT, arts. 428 e seguintes): base da articulação entre EPTNM e aprendizagem profissional do art. 36-B, §§ 2º e 3º.", "ext": true}, {"texto": "Decreto 5.154/2004: regulamenta os arts. 39 a 41 da LDB (formas integrada, concomitante e subsequente surgiram nele antes de serem levadas à lei pela Lei 11.741/2008).", "ext": true}, {"texto": "Lei 11.892/2008 (Institutos Federais): os IFs devem garantir parte relevante de suas vagas à EPTNM, prioritariamente na forma integrada, e atuar na EJA/PROEJA — conecta-se diretamente aos arts. 36-A a 42-B.", "ext": true}, {"texto": "Lei 14.645/2023: instituiu a política nacional de EPT, alterando os arts. 9º, 36-B, 39 e incluindo os arts. 42-A e 42-B.", "ext": true}, {"texto": "Art. 69 reproduz os percentuais mínimos do art. 212 da CF (18% União; 25% demais entes); o art. 73 manda os órgãos fiscalizadores verificarem prioritariamente o art. 212 da CF e o art. 60 do ADCT.", "ext": false}, {"texto": "Art. 67, § 2º define funções de magistério para fins dos arts. 40, § 5º, e 201, § 8º, da CF (aposentadoria especial de professor); o STF admitiu a constitucionalidade dessa definição na ADI 3772.", "ext": true}, {"texto": "Art. 60-A, § 3º remete à Lei 13.146/2015 (Estatuto da Pessoa com Deficiência), garantindo a surdos oralizados acesso a tecnologias assistivas.", "ext": false}, {"texto": "Art. 82 remete à lei federal de estágio, que é a Lei 11.788/2008 (a mesma que deu a redação atual ao artigo).", "ext": true}, {"texto": "Art. 77, § 3º remete à LC 187/2021 (certificação de entidades beneficentes) para exigências de transparência das escolas comunitárias, confessionais e filantrópicas.", "ext": false}, {"texto": "Art. 72, parágrafo único, II menciona o Fundeb (Fundo de Manutenção e Desenvolvimento da Educação Básica e de Valorização dos Profissionais da Educação), hoje regido pelo art. 212-A da CF e pela Lei 14.113/2020.", "ext": true}, {"texto": "Art. 61, IV remete ao art. 36, V (itinerário de formação técnica e profissional do ensino médio) – tema da Parte B.", "ext": false}, {"texto": "Art. 90-A remete ao art. 14 (gestão democrática e lei sobre Conselhos Escolares) – tema da Parte A.", "ext": false}], "perguntas": [{"p": "Qual a faixa etária da educação básica obrigatória e gratuita e quais etapas ela abrange?", "r": "Dos 4 aos 17 anos, organizada em pré-escola, ensino fundamental e ensino médio (redação da Lei 12.796/2013).", "ref": "Art. 4º, I"}, {"p": "A partir de que idade é dever dos pais matricular a criança na educação básica?", "r": "A partir dos 4 anos.", "ref": "Art. 6º"}, {"p": "O que é direito público subjetivo segundo o art. 5º e quem pode acionar o poder público para exigi-lo?", "r": "O acesso à educação básica obrigatória. Podem acionar qualquer cidadão, grupo de cidadãos, associação comunitária, organização sindical, entidade de classe ou outra legalmente constituída e o Ministério Público.", "ref": "Art. 5º, caput"}, {"p": "Quais as características da ação judicial prevista no art. 5º, § 3º?", "r": "É gratuita e de rito sumário; qualquer dos legitimados do caput pode peticionar no Judiciário na hipótese do art. 208, § 2º, da CF.", "ref": "Art. 5º, § 3º"}, {"p": "Quantos princípios do ensino o art. 3º traz hoje e qual o mais recente?", "r": "Quinze. O XV – garantia do direito de acesso a informações públicas sobre a gestão da educação – foi incluído pela Lei 15.001/2024.", "ref": "Art. 3º, XV"}, {"p": "Quais prestações alternativas podem ser dadas ao aluno que se ausenta por motivo religioso?", "r": "Prova ou aula de reposição em data alternativa, ou trabalho escrito/atividade de pesquisa com tema, objetivo e data definidos pela instituição; a critério da instituição, sem custos ao aluno, mediante prévio e motivado requerimento. Não se aplica ao ensino militar.", "ref": "Art. 7º-A"}, {"p": "Que funções a União exerce em relação às demais instâncias educacionais?", "r": "Normativa, redistributiva e supletiva, cabendo-lhe a coordenação da política nacional de educação.", "ref": "Art. 8º, § 1º"}, {"p": "As atribuições do art. 9º, IX podem ser delegadas a quem?", "r": "Aos Estados e ao Distrito Federal, desde que mantenham instituições de educação superior.", "ref": "Art. 9º, § 3º"}, {"p": "Em que condições o Município pode atuar em outros níveis de ensino além da educação infantil e do fundamental?", "r": "Somente quando estiverem atendidas plenamente as necessidades de sua área de competência e com recursos acima dos percentuais mínimos vinculados pela CF à manutenção e desenvolvimento do ensino.", "ref": "Art. 11, V"}, {"p": "O que a escola deve notificar ao Conselho Tutelar?", "r": "A relação de alunos com faltas acima de 30% do percentual permitido em lei e as ocorrências e dados de violência envolvendo alunos, especialmente automutilações, tentativas de suicídio e suicídios consumados.", "ref": "Art. 12, VIII"}, {"p": "Como é composto o Conselho Escolar?", "r": "Pelo Diretor da Escola, membro nato, e por representantes das comunidades escolar e local eleitos por seus pares: professores, orientadores, supervisores e administradores escolares; demais servidores administrativos; estudantes; pais ou responsáveis; membros da comunidade local.", "ref": "Art. 14, § 1º"}, {"p": "Como é composto o Fórum dos Conselhos Escolares?", "r": "Por 2 representantes do órgão responsável pelo sistema de ensino e 2 representantes de cada Conselho Escolar da circunscrição.", "ref": "Art. 14, § 3º"}, {"p": "Quais são as categorias administrativas das instituições de ensino?", "r": "Públicas, privadas e comunitárias (na forma da lei). Privadas e comunitárias podem qualificar-se como confessionais e ser certificadas como filantrópicas.", "ref": "Art. 19"}, {"p": "A que sistema pertence uma universidade mantida por Município?", "r": "Ao sistema de ensino do Estado.", "ref": "Art. 17, II"}, {"p": "Qual a carga horária mínima anual e a frequência mínima no fundamental e no médio?", "r": "800 h no fundamental e 1.000 h no médio, em no mínimo 200 dias de efetivo trabalho escolar; frequência mínima de 75% do total de horas letivas para aprovação. A carga será ampliada progressivamente para 1.400 h conforme o PNE.", "ref": "Art. 24, I, VI e § 1º"}, {"p": "Quais as regras de carga horária, jornada e frequência da educação infantil?", "r": "800 h anuais em no mínimo 200 dias; mínimo de 4 h diárias (parcial) e 7 h (integral); frequência mínima de 60% na pré-escola; avaliação sem objetivo de promoção.", "ref": "Art. 31"}, {"p": "Quem decide a inclusão de novos componentes curriculares obrigatórios na BNCC?", "r": "Depende de aprovação do Conselho Nacional de Educação e homologação pelo Ministro de Estado da Educação.", "ref": "Art. 26, § 10"}, {"p": "Quais são as linguagens do componente curricular Arte?", "r": "Artes visuais, dança, música e teatro.", "ref": "Art. 26, § 6º"}, {"p": "O que deve preceder o fechamento de escolas do campo, indígenas e quilombolas?", "r": "Manifestação do órgão normativo do sistema de ensino, considerando a justificativa da Secretaria de Educação, o diagnóstico do impacto e a manifestação da comunidade escolar.", "ref": "Art. 28, parágrafo único"}, {"p": "Quais as características do ensino fundamental no texto vigente?", "r": "Obrigatório, com duração de 9 anos, gratuito na escola pública, iniciando-se aos 6 anos; presencial (EAD só como complementação ou em situações emergenciais); jornada de pelo menos 4 h de trabalho efetivo em sala.", "ref": "Arts. 32, caput e § 4º; 34"}, {"p": "Qual a duração mínima do ensino médio e qual sua posição na educação básica?", "r": "Mínimo de três anos; é a etapa final da educação básica.", "ref": "Art. 35, caput"}, {"p": "De que se compõe o currículo do ensino médio na redação vigente?", "r": "De formação geral básica e de itinerários formativos.", "ref": "Art. 35-B, caput"}, {"p": "Qual a carga horária mínima da formação geral básica e qual a exceção?", "r": "2.400 h; no caso da formação técnica e profissional (art. 36, V), 2.100 h, admitindo-se até 300 h da FGB para aprofundar conteúdos da BNCC relacionados à formação técnica.", "ref": "Art. 35-C"}, {"p": "Quais as quatro áreas do conhecimento da BNCC do ensino médio e seus componentes?", "r": "Linguagens (português e literaturas, inglês, artes, educação física); matemática; ciências da natureza (biologia, física, química); ciências humanas e sociais aplicadas (filosofia, geografia, história, sociologia).", "ref": "Art. 35-D, I a IV"}, {"p": "Qual a carga horária mínima dos itinerários formativos e quais as ênfases?", "r": "600 h, ressalvadas as especificidades da formação técnica; ênfases: linguagens, matemática, ciências da natureza, ciências humanas e sociais aplicadas, e formação técnica e profissional.", "ref": "Art. 36, caput e I a V"}, {"p": "Quantos itinerários cada escola de ensino médio deve ofertar?", "r": "No mínimo 2, com ênfases distintas, garantindo o aprofundamento integral das quatro áreas; exceção: escolas que oferecem formação técnica e profissional.", "ref": "Art. 36, § 2º-A"}, {"p": "Em que condições os sistemas podem reconhecer experiências extraescolares no ensino médio?", "r": "Excepcionalmente, para cumprir exigências curriculares em regime de tempo integral, com comprovação definida pelos sistemas: estágio, aprendizagem, trabalho remunerado ou voluntário supervisionado (com relação explícita ao currículo); cursos de qualificação certificados; extensão, iniciação científica ou direção de grêmio.", "ref": "Art. 35-B, § 4º"}, {"p": "Quem deve manter escola com ensino médio noturno e em que condição?", "r": "Os Estados, ao menos 1 escola da rede pública na sede de cada Município, quando houver demanda manifesta e comprovada.", "ref": "Art. 36, § 8º-A"}, {"p": "Quais prazos se aplicam às formações técnicas experimentais fora do CNCT?", "r": "Reconhecimento pelo Conselho Estadual de Educação em 3 anos e inserção no CNCT em 5 anos, contados da oferta inicial.", "ref": "Art. 36, § 7º"}, {"p": "Quais as formas de desenvolvimento da educação profissional técnica de nível médio?", "r": "Articulada com o ensino médio (integrada ou concomitante) e subsequente (para quem já concluiu o ensino médio).", "ref": "Arts. 36-B e 36-C"}, {"p": "Quais as características da forma integrada?", "r": "Oferecida somente a quem concluiu o ensino fundamental; curso planejado para levar à habilitação técnica; na mesma instituição; matrícula única.", "ref": "Art. 36-C, I"}, {"p": "Quais as três possibilidades da forma concomitante?", "r": "Na mesma instituição; em instituições distintas aproveitando oportunidades disponíveis; em instituições distintas mediante convênios de intercomplementaridade com projeto pedagógico unificado — sempre com matrículas distintas.", "ref": "Art. 36-C, II"}, {"p": "Que aproveitamentos são possíveis quando a EPTNM é articulada com a aprendizagem profissional?", "r": "Das atividades pedagógicas da EPTNM para cumprir o contrato de aprendizagem; e das horas de trabalho da aprendizagem para integralizar a carga do ensino médio (itinerário técnico ou EPTNM), nos termos de regulamento.", "ref": "Art. 36-B, §§ 2º e 3º"}, {"p": "Qual o valor dos diplomas de cursos técnicos de nível médio?", "r": "Quando registrados, têm validade nacional e habilitam ao prosseguimento de estudos na educação superior.", "ref": "Art. 36-D, caput"}, {"p": "A partir de que idade se fazem os exames supletivos?", "r": "Ensino fundamental: maiores de 15 anos; ensino médio: maiores de 18 anos.", "ref": "Art. 38, § 1º"}, {"p": "Com o que a EJA deve articular-se preferencialmente?", "r": "Com a educação profissional, na forma do regulamento.", "ref": "Art. 37, § 3º"}, {"p": "Quais cursos a educação profissional e tecnológica abrange?", "r": "Formação inicial e continuada ou qualificação profissional; educação profissional técnica de nível médio; educação profissional tecnológica de graduação e pós-graduação.", "ref": "Art. 39, § 2º"}, {"p": "O que é itinerário contínuo de formação profissional e tecnológica?", "r": "Percurso formativo estruturado para permitir o aproveitamento incremental de experiências, certificações e conhecimentos ao longo da trajetória individual do estudante; pode integrar um ou mais eixos tecnológicos.", "ref": "Art. 42-A, §§ 1º e 2º"}, {"p": "Quem mantém e atualiza o CNCT e o CNCST e com que referência?", "r": "O MEC, em colaboração com sistemas de ensino, instituições e redes de EPT e entidades de empregadores e trabalhadores, observadas a CBO e a dinâmica do mundo do trabalho.", "ref": "Art. 42-A, § 4º"}, {"p": "Que critérios a avaliação de qualidade que orienta a oferta de EPT deve considerar?", "r": "Estatísticas de oferta, fluxo e rendimento; aprendizagem dos saberes do trabalho; aderência da oferta ao contexto social, econômico e produtivo local e nacional; inserção dos egressos no mundo do trabalho; condições institucionais de oferta.", "ref": "Art. 42-B"}, {"p": "Quantas são as finalidades da educação superior e qual foi incluída em 2015?", "r": "Oito; a do inciso VIII – atuar pela universalização e aprimoramento da educação básica (Lei 13.174/2015).", "ref": "Art. 43, VIII"}, {"p": "Quais cursos e programas abrange a educação superior?", "r": "Sequenciais por campo de saber, graduação, pós-graduação (mestrado, doutorado, especialização, aperfeiçoamento e outros) e extensão.", "ref": "Art. 44"}, {"p": "Quais sanções podem resultar da reavaliação de IES privada, além das gerais?", "r": "Redução de vagas autorizadas e suspensão temporária de novos ingressos e de oferta de cursos.", "ref": "Art. 46, § 3º"}, {"p": "Quem define os critérios para autorização de cursos de Medicina nos sistemas estaduais?", "r": "A União; Estados e DF devem adotar os critérios por ela definidos.", "ref": "Art. 46, § 5º"}, {"p": "Qual o mínimo de dias de trabalho acadêmico efetivo no ano letivo da educação superior?", "r": "200 dias, independentemente do ano civil, excluído o tempo de exames finais.", "ref": "Art. 47"}, {"p": "Qual o título obrigatório da página que divulga cursos e docentes e quando deve ser publicada?", "r": "“Grade e Corpo Docente”; até 1 mês antes do início das aulas.", "ref": "Art. 47, § 1º, I, a, e IV, b"}, {"p": "Quem registra diplomas de instituições não universitárias?", "r": "Universidades indicadas pelo Conselho Nacional de Educação.", "ref": "Art. 48, § 1º"}, {"p": "Quais os requisitos mínimos de corpo docente para uma universidade?", "r": "Pelo menos 1/3 com mestrado ou doutorado e 1/3 em tempo integral.", "ref": "Art. 52, II e III"}, {"p": "Quem decide, na universidade, sobre contratação e dispensa de professores?", "r": "Os colegiados de ensino e pesquisa, dentro dos recursos orçamentários disponíveis.", "ref": "Art. 53, § 1º, V"}, {"p": "Qual a proporção de docentes nos órgãos colegiados das IES públicas?", "r": "70% dos assentos em cada órgão colegiado e comissão.", "ref": "Art. 56, parágrafo único"}, {"p": "Qual é o público da educação especial?", "r": "Educandos com deficiência, transtornos globais do desenvolvimento e altas habilidades ou superdotação.", "ref": "Art. 58"}, {"p": "O que o poder público deve instituir para alunos com altas habilidades?", "r": "Cadastro nacional de alunos com altas habilidades ou superdotação matriculados na educação básica e superior.", "ref": "Art. 59-A"}, {"p": "Como se define a educação bilíngue de surdos e quando começa?", "r": "Modalidade oferecida em Libras como primeira língua e português escrito como segunda, para optantes; começa ao zero ano, na educação infantil, e segue ao longo da vida.", "ref": "Art. 60-A, caput e § 2º"}, {"p": "Quem pode ser profissional da educação básica com notório saber e para quê?", "r": "Profissionais reconhecidos pelos sistemas, para conteúdos afins à sua formação ou experiência, exclusivamente para o itinerário de formação técnica e profissional (art. 36, V).", "ref": "Art. 61, IV"}, {"p": "Quem é considerado professor da educação infantil para enquadramento na carreira do magistério?", "r": "Quem exerce função docente atuando diretamente com as crianças, com formação no magistério ou nível superior e aprovado em concurso, independentemente da designação do cargo.", "ref": "Art. 61, § 2º"}, {"p": "Quais professores têm direito a processo seletivo diferenciado para pedagogia/licenciatura?", "r": "Professores de redes públicas, concursados, com pelo menos 3 anos de exercício e sem diploma de graduação.", "ref": "Art. 62-B, § 1º"}, {"p": "Onde se forma o especialista em administração, supervisão e orientação educacional?", "r": "Em graduação em pedagogia ou em pós-graduação, a critério da instituição, garantida a base comum nacional.", "ref": "Art. 64"}, {"p": "Quais garantias de valorização o art. 67 assegura aos profissionais da educação?", "r": "Concurso de provas e títulos; aperfeiçoamento continuado com licenciamento periódico remunerado; piso salarial; progressão por titulação e desempenho; período para estudos e planejamento na carga horária; condições adequadas de trabalho.", "ref": "Art. 67, I a VI"}, {"p": "Com que periodicidade são corrigidas as diferenças que impeçam o cumprimento dos mínimos de MDE?", "r": "A cada trimestre do exercício financeiro.", "ref": "Art. 69, § 4º"}, {"p": "Como se calcula a capacidade de atendimento de cada governo?", "r": "Razão entre os recursos de uso constitucionalmente obrigatório em MDE e o custo anual do aluno relativo ao padrão mínimo de qualidade.", "ref": "Art. 75, § 2º"}, {"p": "Quais situações dão direito ao regime escolar especial do art. 81-A?", "r": "Estudantes impossibilitados de frequentar por tratamento ou condição de saúde e mães estudantes lactantes, mediante comprovação.", "ref": "Art. 81-A"}, {"p": "Qual o prazo dado às creches e pré-escolas para integrar-se ao sistema de ensino?", "r": "Três anos a contar da publicação da LDB.", "ref": "Art. 89"}], "cobertura": [{"item": "Título I – Da Educação (art. 1º)", "status": "ok", "obs": ""}, {"item": "Título II ita às crianças de até 5 anos” (Lei 12.796/2013). Considerei vigente a redação de 2013 (mais recente, coerente com o art. 4º, I e com a ordem do texto compilado); a de 2009 deve ser trecho riscado que não foi removido na extração.", "Duplicidades semelhantes no art. 26: § 2º (Leis 12.287/2010 e 13.415/2017), § 6º (Leis 11.769/2008 e 13.278/2016) e § 9º (Leis 13.010/2014 e 14.164/2021). Mapeei apenas a redação mais recente de cada um como vigente.", "Linhas 143–144 do txt: após o art. 19, § 2º aparecem marcas “(Revogado pela Lei nº 13.868, de 2019)” e um inciso “II – comunitárias...” (Lei 12.020/2009), resquícios do art. 20 revogado. Tratei o art. 20 como revogado e o art. 19, §§ 1º e 2º como vigentes.", "Art. 11, V (Lei 15.369/2026), art. 25-A (Lei 15.360/2026), art. 26, § 9º-B (Lei 15.468/2026), art. 4º, XIII (Lei 15.276/2025) e art. 12, VIII (Lei 15.231/2025) são alterações muito recentes; mapeadas conforme o txt, sem conferência de vigência/vacatio além do que o txt indica.", "Nós e pegadinhas sobre a redação original (1996) e redações intermediárias (ex.: matrícula aos 6 anos pela Lei 11.114/2005; 50% e juiz/MP no art. 12, VIII; ensino religioso “sem ônus”) vêm do mapa antigo e de conhecimento externo; nos nós estão marcados com ext:true.", "Art. 7º-A traz “(Vigência)” e “(Vide parágrafo único do art. 2)” referentes à Lei 13.796/2019; o prazo de 2 anos do § 3º foi mapeado sem verificar a data de início da vigência.", "Linha do art. 35, IV: o inciso é seguido de 15 anotações '(Revogado Lei nº 14.945, de 2024)' sem texto. Interpretei-as como pertencentes ao art. 35-A (e seus §§), cujo texto foi suprimido, e tratei o art. 35, IV como vigente. Convém conferir no site do Planalto.", "Art. 36, caput: o texto traz a redação da Lei 13.415/2017 e a da Lei 14.945/2024; adotei a da Lei 14.945/2024 (itinerários, 600 h). Incisos I–IV mantêm a redação de 2017; inciso V tem a redação de 2024.", "Art. 36: sobrou na linha do inciso III um trecho antigo ('IV – serão incluídas a Filosofia e a Sociologia como disciplinas obrigatórias...', Lei 11.684/2008), tratado como redação superada, não vigente.", "Art. 36, § 1º-A traz junto a anotação '(Revogado pela Lei nº 11.741, de 2008)', aparentemente resíduo do antigo § 2º; tratei o § 1º-A (Lei 14.945/2024) como vigente. O § 4º aparece só como 'º' (revogado pela Lei 11.741/2008, presumido).", "Art. 36, § 6º: há três redações do caput no arquivo; adotei a da Lei 14.945/2024. Inciso I com redação de 2017 tratado como vigente; inciso II revogado.", "Art. 36, §§ 10 e 11: o texto de 2017 aparece seguido de '(Revogado)' pela Lei 14.945/2024; tratei como revogados.", "Art. 40 indica '(Regulamento)' sem identificar o ato; a referência ao Decreto 5.154/2004 está marcada como ext.", "Art. 46, §§ 3º e 4º aparecem duplicados no txt: uma versão da MP 785/2017 e outra da Lei 13.530/2017. Usou-se a redação da Lei 13.530/2017 (lei de conversão), presumindo que a da MP é resíduo não riscado.", "Art. 61, III aparece duplicado no txt (mesmo texto); tratado como um único inciso.", "Art. 61, § 1º (caput, redação da Lei 15.326/2026), art. 61, § 2º (Lei 15.326/2026) e art. 67, II (redação da Lei 15.462/2026) constam apenas do texto do Planalto de 23/10/2026; não foi possível conferir essas leis em outra fonte.", "Art. 70, V traz a anotação solta “Vigência encerrada” e o art. 69 cita a MP 773/2017 (vigência encerrada); presumiu-se que o texto exibido é o vigente.", "Art. 81-A, § 2º remete aos incisos I, II e III do caput, mas o inciso III foi vetado; o mapa registra apenas I e II como situações.", "Art. 87, § 3º, IV aparece no txt com o texto integral seguido de “(Revogado pela lei nº 12.796, de 2013)”; tratado como revogado.", "Nó marcado ext sobre a educação bilíngue de surdos como modalidade autônoma é interpretação doutrinária, não texto da lei."]}</script>
<script>

  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const $ = (s,el=document)=>el.querySelector(s);

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>

 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>

</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
