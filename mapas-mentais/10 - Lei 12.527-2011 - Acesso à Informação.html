plomáticas e Consulares permanentes", "tipo": "competencia", "ref": "Art. 27, I, e"}]}, {"t": "Secreto: autoridades do inciso I + titulares de autarquias, fundações, EP e SEM", "tipo": "competencia", "ref": "Art. 27, II"}, {"t": "Reservado: incisos I e II + direção/comando/chefia DAS 101.5 ou superior", "tipo": "competencia", "d": "Ou hierarquia equivalente, conforme regulamentação de cada órgão.", "ref": "Art. 27, III"}, {"t": "Delegação de ultrassecreto/secreto a agente público, vedada subdelegação", "tipo": "excecao", "d": "Inclusive a agente em missão no exterior.", "ref": "Art. 27, § 1º"}, {"t": "Ultrassecreto por Comandantes ou Chefes de Missão: ratificação do Ministro", "tipo": "regra", "d": "No prazo previsto em regulamento.", "ref": "Art. 27, § 2º"}, {"t": "Classificação ultrassecreta: decisão enviada à CMRI", "tipo": "regra", "d": "No prazo do regulamento.", "ref": "Art. 27, § 3º"}]}, {"t": "Decisão de classificação: elementos mínimos", "tipo": "classificacao", "ref": "Art. 28", "filhos": [{"t": "Assunto da informação", "tipo": "regra", "ref": "Art. 28, I"}, {"t": "Fundamento (critérios do art. 24)", "tipo": "regra", "ref": "Art. 28, II"}, {"t": "Prazo em anos, meses ou dias, ou evento final", "tipo": "prazo", "ref": "Art. 28, III"}, {"t": "Identificação da autoridade classificadora", "tipo": "regra", "ref": "Art. 28, IV"}, {"t": "Decisão fica no mesmo grau de sigilo da informação", "tipo": "atencao", "ref": "Art. 28, p.ú."}]}, {"t": "Reavaliação da classificação", "tipo": "regra", "d": "Pela autoridade classificadora ou superior, de ofício ou mediante provocação, visando desclassificação ou redução do prazo.", "ref": "Art. 29", "filhos": [{"t": "Regulamento considera informações produzidas no exterior", "tipo": "regra", "ref": "Art. 29, § 1º"}, {"t": "Examina permanência dos motivos e possibilidade de danos", "tipo": "regra", "ref": "Art. 29, § 2º"}, {"t": "Redução de prazo: termo inicial continua a data de produção", "tipo": "atencao", "ref": "Art. 29, § 3º"}]}, {"t": "Publicação anual pela autoridade máxima na internet", "tipo": "competencia", "ref": "Art. 30", "filhos": [{"t": "Rol das desclassificadas nos últimos 12 meses", "tipo": "prazo", "ref": "Art. 30, I"}, {"t": "Rol de documentos classificados por grau", "tipo": "regra", "ref": "Art. 30, II"}, {"t": "Relatório estatístico de pedidos recebidos, atendidos e indeferidos", "tipo": "regra", "d": "Com informações genéricas sobre os solicitantes.", "ref": "Art. 30, III"}, {"t": "Exemplar para consulta pública nas sedes", "tipo": "regra", "ref": "Art. 30, § 1º"}, {"t": "Extrato com data, grau e fundamentos das classificadas", "tipo": "regra", "ref": "Art. 30, § 2º"}]}]}]}}, {"id": "cap-4-sec-5", "titulo": "Capítulo IV, Seção V – Informações pessoais (art. 31)", "raiz": {"t": "Cap. IV, Seção V – Das informações pessoais", "tipo": "topico", "ref": "Art. 31", "filhos": [{"t": "Tratamento transparente e com respeito à intimidade, vida privada, honra e imagem", "tipo": "conceito", "d": "E às liberdades e garantias individuais.", "ref": "Art. 31, caput"}, {"t": "Informações relativas à intimidade, vida privada, honra e imagem", "tipo": "regra", "ref": "Art. 31, § 1º", "filhos": [{"t": "Acesso restrito por até 100 anos da produção", "tipo": "prazo", "d": "Independentemente de classificação de sigilo.", "ref": "Art. 31, § 1º, I"}, {"t": "Acesso: agentes públicos legalmente autorizados e o próprio titular", "tipo": "competencia", "ref": "Art. 31, § 1º, I"}, {"t": "Terceiros: previsão legal ou consentimento expresso do titular", "tipo": "regra", "ref": "Art. 31, § 1º, II"}, {"t": "Não é grau de sigilo: restrição independe de classificação", "tipo": "atencao", "ref": "Art. 31, § 1º, I"}]}, {"t": "Quem obtém acesso responde pelo uso indevido", "tipo": "sancao", "ref": "Art. 31, § 2º"}, {"t": "Dispensa de consentimento – info necessária", "tipo": "excecao", "ref": "Art. 31, § 3º", "filhos": [{"t": "Prevenção e diagnóstico médico de incapaz, só para tratamento", "tipo": "excecao", "d": "Pessoa física ou legalmente incapaz; uso único e exclusivo para o tratamento médico.", "ref": "Art. 31, § 3º, I"}, {"t": "Estatísticas e pesquisas de evidente interesse público, previstas em lei", "tipo": "excecao", "d": "Vedada a identificação da pessoa.", "ref": "Art. 31, § 3º, II"}, {"t": "Cumprimento de ordem judicial", "tipo": "excecao", "ref": "Art. 31, § 3º, III"}, {"t": "Defesa de direitos humanos", "tipo": "excecao", "ref": "Art. 31, § 3º, IV"}, {"t": "Proteção do interesse público e geral preponderante", "tipo": "excecao", "ref": "Art. 31, § 3º, V"}]}, {"t": "Restrição não pode prejudicar apuração de irregularidades do titular", "tipo": "excecao", "d": "Nem ações de recuperação de fatos históricos de maior relevância.", "ref": "Art. 31, § 4º"}, {"t": "Regulamento disporá sobre procedimentos", "tipo": "regra", "ref": "Art. 31, § 5º"}]}}, {"id": "cap-5", "titulo": "Capítulo V – Responsabilidades (arts. 32–34)", "raiz": {"t": "Cap. V – Das responsabilidades", "tipo": "topico", "ref": "Arts. 32–34", "filhos": [{"t": "Condutas ilícitas do agente público ou militar", "tipo": "sancao", "ref": "Art. 32", "filhos": [{"t": "Recusar, retardar deliberadamente ou fornecer info incorreta/incompleta/imprecisa", "tipo": "sancao", "d": "Fornecimento incorreto deve ser intencional.", "ref": "Art. 32, I"}, {"t": "Usar indevidamente, subtrair, destruir, inutilizar, desfigurar, alterar ou ocultar", "tipo": "sancao", "d": "Informação sob guarda ou conhecida em razão do cargo, emprego ou função.", "ref": "Art. 32, II"}, {"t": "Agir com dolo ou má-fé na análise dos pedidos", "tipo": "sancao", "ref": "Art. 32, III"}, {"t": "Divulgar/acessar ou permitir acesso indevido a sigilosa ou pessoal", "tipo": "sancao", "ref": "Art. 32, IV"}, {"t": "Impor sigilo para proveito próprio/terceiro ou ocultar ilegalidade", "tipo": "sancao", "ref": "Art. 32, V"}, {"t": "Ocultar sigilosa da revisão de autoridade superior", "tipo": "sancao", "d": "Para beneficiar a si ou outrem, ou em prejuízo de terceiros.", "ref": "Art. 32, VI"}, {"t": "Destruir ou subtrair documentos sobre violações de direitos humanos", "tipo": "sancao", "d": "Por parte de agentes do Estado.", "ref": "Art. 32, VII"}]}, {"t": "Enquadramento (com contraditório, ampla defesa e devido processo)", "tipo": "sancao", "ref": "Art. 32, § 1º", "filhos": [{"t": "Militares: transgressões médias ou graves", "tipo": "sancao", "d": "Desde que não tipificadas como crime ou contravenção penal.", "ref": "Art. 32, § 1º, I"}, {"t": "Servidores (Lei 8.112): infração apenada no mínimo com suspensão", "tipo": "sancao", "ref": "Art. 32, § 1º, II"}, {"t": "Também improbidade (Leis 1.079/1950 e 8.429/1992)", "tipo": "sancao", "ref": "Art. 32, § 2º"}, {"t": "Militar: médias ou graves (não leves); servidor: mínimo suspensão (não advertência)", "tipo": "atencao", "ref": "Art. 32, § 1º"}]}, {"t": "Sanções a pessoa física/entidade privada com vínculo", "tipo": "sancao", "ref": "Art. 33", "filhos": [{"t": "Advertência", "tipo": "sancao", "ref": "Art. 33, I"}, {"t": "Multa", "tipo": "sancao", "ref": "Art. 33, II"}, {"t": "Rescisão do vínculo com o poder público", "tipo": "sancao", "ref": "Art. 33, III"}, {"t": "Suspensão de licitar e impedimento de contratar: até 2 anos", "tipo": "prazo", "ref": "Art. 33, IV"}, {"t": "Declaração de inidoneidade até reabilitação", "tipo": "sancao", "d": "Reabilitação perante a própria autoridade que aplicou a pena.", "ref": "Art. 33, V"}, {"t": "Multa cumulável com I, III e IV; defesa em 10 dias", "tipo": "prazo", "ref": "Art. 33, § 1º"}, {"t": "Reabilitação: ressarcir prejuízos e decorrido prazo da sanção do inciso IV", "tipo": "regra", "ref": "Art. 33, § 2º"}, {"t": "Inidoneidade: competência exclusiva da autoridade máxima", "tipo": "competencia", "d": "Defesa em 10 dias da abertura de vista.", "ref": "Art. 33, § 3º"}]}, {"t": "Responsabilidade direta dos órgãos por danos", "tipo": "sancao", "d": "Por divulgação não autorizada ou uso indevido de sigilosas ou pessoais.", "ref": "Art. 34", "filhos": [{"t": "Responsabilidade funcional em caso de dolo ou culpa; direito de regresso", "tipo": "sancao", "ref": "Art. 34, caput"}, {"t": "Aplica-se a particulares com vínculo que tratem indevidamente", "tipo": "sancao", "ref": "Art. 34, p.ú."}]}]}}, {"id": "cap-6", "titulo": "Capítulo VI – Disposições finais e transitórias (arts. 35–47)", "raiz": {"t": "Cap. VI – Disposições finais e transitórias", "tipo": "topico", "ref": "Arts. 35–47", "filhos": [{"t": "Comissão Mista de Reavaliação de Informações (CMRI)", "tipo": "competencia", "d": "Decide, na administração federal, sobre tratamento e classificação de informações sigilosas. Caput do art. 35 vetado.", "ref": "Art. 35, § 1º", "filhos": [{"t": "Requisitar esclarecimento ou conteúdo de ultrassecreta e secreta", "tipo": "competencia", "ref": "Art. 35, § 1º, I"}, {"t": "Rever classificação de ultrassecretas ou secretas", "tipo": "competencia", "d": "De ofício ou por provocação de pessoa interessada.", "ref": "Art. 35, § 1º, II"}, {"t": "Prorrogar sigilo de ultrassecreta por prazo determinado", "tipo": "competencia", "d": "Enquanto houver ameaça externa à soberania/integridade territorial ou grave risco às relações internacionais.", "ref": "Art. 35, § 1º, III", "filhos": [{"t": "Limitada a uma única renovação", "tipo": "prazo", "ref": "Art. 35, § 2º"}, {"t": "Prorrogação só para ULTRASSECRETA", "tipo": "atencao", "ref": "Art. 35, § 1º, III"}]}, {"t": "Revisão de ofício no máximo a cada 4 anos", "tipo": "prazo", "d": "Para ultrassecretos e secretos, após a reavaliação do art. 39.", "ref": "Art. 35, § 3º"}, {"t": "Não deliberação no prazo: desclassificação automática", "tipo": "sancao", "ref": "Art. 35, § 4º"}, {"t": "Integrantes com mandato de 2 anos (regulamento)", "tipo": "prazo", "ref": "Art. 35, § 5º"}]}, {"t": "Sigilo de tratados internacionais segue os próprios instrumentos", "tipo": "regra", "ref": "Art. 36"}, {"t": "Núcleo de Segurança e Credenciamento (NSC) – GSI/PR", "tipo": "competencia", "ref": "Art. 37", "filhos": [{"t": "Promover e propor regulamentação do credenciamento de segurança", "tipo": "competencia", "ref": "Art. 37, I"}, {"t": "Garantir segurança de sigilosas, inclusive estrangeiras", "tipo": "competencia", "d": "Sem prejuízo do MRE e demais órgãos.", "ref": "Art. 37, II"}, {"t": "Composição e funcionamento por regulamento", "tipo": "regra", "ref": "Art. 37, p.ú."}]}, {"t": "Lei 9.507/1997 (habeas data) aplica-se no que couber", "tipo": "regra", "d": "Informação de pessoa física ou jurídica em registros ou bancos de dados governamentais ou de caráter público.", "ref": "Art. 38"}, {"t": "Reavaliação transitória das ultrassecretas e secretas", "tipo": "prazo", "d": "Prazo máximo de 2 anos do início de vigência da lei.", "ref": "Art. 39", "filhos": [{"t": "Restrições seguem prazos e condições da LAI", "tipo": "regra", "ref": "Art. 39, § 1º"}, {"t": "CMRI pode rever a qualquer tempo (federal)", "tipo": "competencia", "ref": "Art. 39, § 2º"}, {"t": "Até o fim do prazo, mantém-se a classificação anterior", "tipo": "regra", "ref": "Art. 39, § 3º"}, {"t": "Não reavaliadas: acesso público automático", "tipo": "sancao", "ref": "Art. 39, § 4º"}]}, {"t": "Autoridade de monitoramento da LAI em cada órgão federal", "tipo": "competencia", "d": "Designada pelo dirigente máximo em 60 dias da vigência, diretamente subordinada a ele.", "ref": "Art. 40", "filhos": [{"t": "Assegurar cumprimento das normas de acesso", "tipo": "competencia", "ref": "Art. 40, I"}, {"t": "Monitorar implementação e apresentar relatórios periódicos", "tipo": "competencia", "ref": "Art. 40, II"}, {"t": "Recomendar medidas de aperfeiçoamento", "tipo": "competencia", "ref": "Art. 40, III"}, {"t": "Orientar as unidades", "tipo": "competencia", "ref": "Art. 40, IV"}]}, {"t": "Órgão federal designado pelo Executivo", "tipo": "competencia", "ref": "Art. 41", "filhos": [{"t": "Campanha nacional de cultura da transparência", "tipo": "competencia", "ref": "Art. 41, I"}, {"t": "Treinamento de agentes públicos", "tipo": "competencia", "ref": "Art. 41, II"}, {"t": "Monitorar aplicação e consolidar estatísticas do art. 30", "tipo": "competencia", "ref": "Art. 41, III"}, {"t": "Relatório anual ao Congresso Nacional", "tipo": "competencia", "ref": "Art. 41, IV"}]}, {"t": "Regulamentação pelo Executivo em 180 dias da publicação", "tipo": "prazo", "ref": "Art. 42"}, {"t": "Alterações na Lei 8.112/1990", "tipo": "regra", "ref": "Arts. 43–44", "filhos": [{"t": "Art. 116, VI: levar irregularidades à autoridade superior ou outra competente", "tipo": "regra", "d": "Outra autoridade quando houver suspeita de envolvimento da superior.", "ref": "Art. 43"}, {"t": "Art. 126-A: servidor não responde por comunicar crimes/improbidade", "tipo": "excecao", "d": "Nenhuma responsabilização civil, penal ou administrativa por dar ciência à autoridade competente.", "ref": "Art. 44"}]}, {"t": "Estados, DF e Municípios: legislação própria com regras específicas", "tipo": "competencia", "d": "Obedecidas as normas gerais, especialmente quanto ao art. 9º (SIC) e à Seção II do Cap. III (recursos).", "ref": "Art. 45"}, {"t": "Revogações: Lei 11.111/2005 e arts. 22 a 24 da Lei 8.159/1991", "tipo": "regra", "ref": "Art. 46"}, {"t": "Vigência: 180 dias após a publicação", "tipo": "prazo", "ref": "Art. 47"}]}}], "comparacoes": [{"titulo": "Transparência ativa × Transparência passiva", "colunas": ["Aspecto", "Ativa", "Passiva"], "linhas": [["Conceito", "Divulgação independentemente de requerimento", "Fornecimento mediante pedido de qualquer interessado"], ["Base legal", "Arts. 3º, II, e 8º (8º-A, 8º-B)", "Arts. 10 a 14"], ["Meio", "Sítios oficiais na internet (obrigatório) e outros meios legítimos", "Qualquer meio legítimo; alternativa pela internet obrigatória"], ["Conteúdo", "Rol mínimo do art. 8º, § 1º (competências, repasses, despesas, licitações, programas, FAQ)", "Informação especificada pelo requerente"], ["Prazo", "Manter atualizado (art. 8º, § 3º, VI)", "Imediato; ou até 20 dias + 10 prorrogáveis"], ["Exceção", "Municípios até 10.000 hab. dispensados da internet (salvo execução orçamentária/financeira em tempo real)", "Informação sigilosa ou pessoal pode ser negada, com indicação de recurso"]]}, {"titulo": "Graus de sigilo", "colunas": ["Aspecto", "Ultrassecreta", "Secreta", "Reservada"], "linhas": [["Prazo máximo (da produção)", "25 anos", "15 anos", "5 anos"], ["Quem classifica (federal)", "Presidente, Vice, Ministros e equiparados, Comandantes das Forças, Chefes de Missões Diplomáticas/Consulares", "Os do ultrassecreto + titulares de autarquias, fundações, EP e SEM", "Os anteriores + direção/comando/chefia DAS 101.5 ou superior (ou equivalente)"], ["Delegação", "Permitida, vedada subdelegação", "Permitida, vedada subdelegação", "Não prevista no art. 27, § 1º"], ["Prorrogação pela CMRI", "Sim, uma única renovação", "Não", "Não"], ["Revisão pela CMRI", "Sim (de ofício no máximo a cada 4 anos)", "Sim (de ofício no máximo a cada 4 anos)", "Não prevista no art. 35"], ["Observação", "Classificação por Comandantes/Chefes de Missão exige ratificação do Ministro; decisão enviada à CMRI", "—", "Grau das informações sobre segurança do Presidente/Vice e familiares (até o fim do mandato)"]]}, {"titulo": "Informação sigilosa × Informação pessoal", "colunas": ["Aspecto", "Sigilosa (classificada)", "Pessoal (intimidade, vida privada, honra, imagem)"], "linhas": [["Definição", "Restrição temporária por ser imprescindível à segurança da sociedade e do Estado (art. 4º, III)", "Relacionada a pessoa natural identificada ou identificável (art. 4º, IV)"], ["Necessita classificação?", "Sim, por autoridade competente em decisão formal (arts. 27–28)", "Não; restrição independe de classificação (art. 31, § 1º, I)"], ["Prazo", "25, 15 ou 5 anos, ou evento", "Até 100 anos da produção"], ["Quem acessa", "Quem tem necessidade de conhecer e está credenciado (art. 25, § 1º)", "Agentes legalmente autorizados e o titular; terceiros por lei ou consentimento expresso"]]}, {"titulo": "Instâncias recursais (Executivo federal)", "colunas": ["Aspecto", "Autoridade superior", "CGU", "Ministro de Estado", "CMRI"], "linhas": [["Cabimento", "Indeferimento de acesso ou das razões da negativa (art. 15)", "Negativas do art. 16, I–IV, após ao menos uma autoridade superior", "Indeferimento de pedido de desclassificação (art. 17)", "Negativa da CGU (art. 16, § 3º); indeferimento de desclassificação de secreta/ultrassecreta (art. 17, § 2º)"], ["Prazo de decisão", "5 dias", "5 dias", "Não fixado na lei", "Não fixado na lei"], ["Prazo para recorrer", "10 dias da ciência", "Não fixado expressamente", "Não fixado expressamente", "Não fixado expressamente"]]}, {"titulo": "Responsabilização: agente público/militar × particular com vínculo", "colunas": ["Aspecto", "Agente público ou militar", "Pessoa física/entidade privada com vínculo"], "linhas": [["Base", "Art. 32", "Art. 33"], ["Consequência", "Militar: transgressão média ou grave; servidor: infração apenada no mínimo com suspensão; possível improbidade", "Advertência, multa, rescisão do vínculo, suspensão até 2 anos, inidoneidade"], ["Defesa", "Contraditório, ampla defesa e devido processo legal", "10 dias (art. 33, §§ 1º e 3º)"]]}], "pegadinhas": [{"texto": "O prazo de resposta é de até 20 dias, prorrogável por mais 10 (não 'por igual período'); a regra é o acesso imediato.", "ref": "Art. 11, caput, §§ 1º e 2º"}, {"texto": "O pedido deve conter identificação do requerente; o que é vedado é exigir os motivos da solicitação.", "ref": "Art. 10, caput e § 3º"}, {"texto": "Recurso: 10 dias para interpor e 5 dias para a autoridade superior decidir (não o inverso).", "ref": "Art. 15"}, {"texto": "Só se recorre à CGU depois de pelo menos uma autoridade hierarquicamente superior apreciar o caso.", "ref": "Art. 16, § 1º"}, {"texto": "Prazos dos graus: ultrassecreta 25, secreta 15, reservada 5 anos, contados da PRODUÇÃO (não da classificação).", "ref": "Art. 24, § 1º"}, {"texto": "Informações sobre a segurança do Presidente e familiares são RESERVADAS (não ultrassecretas), até o fim do mandato ou do último mandato em caso de reeleição.", "ref": "Art. 24, § 2º"}, {"texto": "A delegação da competência para classificar abrange apenas ultrassecreto e secreto e é vedada a subdelegação.", "ref": "Art. 27, § 1º"}, {"texto": "Ratificação pelo Ministro só é exigida para ultrassecreto classificado por Comandantes das Forças e Chefes de Missões Diplomáticas/Consulares.", "ref": "Art. 27, § 2º"}, {"texto": "Reduzido o prazo de sigilo, o termo inicial continua sendo a data de produção.", "ref": "Art. 29, § 3º"}, {"texto": "Informação pessoal tem restrição de até 100 anos INDEPENDENTEMENTE de classificação de sigilo.", "ref": "Art. 31, § 1º, I"}, {"texto": "A CMRI só pode prorrogar o sigilo de informação ULTRASSECRETA, e uma única vez.", "ref": "Art. 35, § 1º, III, e § 2º"}, {"texto": "Revisão de ofício pela CMRI: no máximo a cada 4 anos; se não deliberar, há desclassificação automática.", "ref": "Art. 35, §§ 3º e 4º"}, {"texto": "Para servidores da Lei 8.112, as condutas ilícitas são apenadas, no mínimo, com suspensão (não advertência).", "ref": "Art. 32, § 1º, II"}, {"texto": "Para militares, as condutas são transgressões MÉDIAS ou GRAVES, desde que não sejam crime ou contravenção.", "ref": "Art. 32, § 1º, I"}, {"texto": "Suspensão de licitar/contratar do particular: prazo NÃO superior a 2 anos.", "ref": "Art. 33, IV"}, {"texto": "A multa pode ser aplicada juntamente com advertência, rescisão e suspensão; o § 1º não menciona a inidoneidade.", "ref": "Art. 33, § 1º"}, {"texto": "Declaração de inidoneidade é competência EXCLUSIVA da autoridade máxima do órgão ou entidade.", "ref": "Art. 33, § 3º"}, {"texto": "Os órgãos respondem DIRETAMENTE pelos danos; a responsabilidade funcional do agente exige dolo ou culpa (regresso).", "ref": "Art. 34"}, {"texto": "Municípios com até 10.000 habitantes estão dispensados da internet, mas não da divulgação em tempo real da execução orçamentária e financeira.", "ref": "Art. 8º, § 4º"}, {"texto": "O serviço de busca e fornecimento é gratuito; cobra-se só o custo de reprodução, com isenção para hipossuficientes.", "ref": "Art. 12"}, {"texto": "Entidades privadas sem fins lucrativos: publicidade restrita à parcela de recursos públicos recebidos e à sua destinação.", "ref": "Art. 2º, p.ú."}, {"texto": "Informações sobre violação de direitos humanos por agentes públicos não podem ser objeto de restrição de acesso.", "ref": "Art. 21, p.ú."}, {"texto": "Vigência e regulamentação: 180 dias da publicação; autoridade de monitoramento designada em 60 dias da vigência.", "ref": "Arts. 40, 42 e 47"}], "erros_frequentes": [{"texto": "Achar que existe o grau 'confidencial' — a LAI prevê apenas ultrassecreta, secreta e reservada.", "ref": "Art. 24"}, {"texto": "Confundir CGU (recurso contra negativas no Executivo federal) com CMRI (instância seguinte e revisora de classificações).", "ref": "Arts. 16 e 35"}, {"texto": "Supor que a LAI se aplica integralmente a entidades privadas sem fins lucrativos; aplica-se 'no que couber'.", "ref": "Art. 2º"}, {"texto": "Pensar que a informação parcialmente sigilosa é negada por inteiro; a parte não sigilosa deve ser fornecida.", "ref": "Art. 7º, § 2º"}, {"texto": "Confundir o prazo de 10 dias do responsável por informação extraviada com o prazo de recurso.", "ref": "Art. 7º, § 6º; Art. 15"}, {"texto": "Achar que o consentimento do titular é sempre indispensável para divulgar informação pessoal (há 5 hipóteses de dispensa).", "ref": "Art. 31, § 3º"}, {"texto": "Esquecer que o recurso ao Ministro de Estado é específico para pedido de desclassificação indeferido.", "ref": "Art. 17"}], "relacoes": [{"texto": "Lei 9.784/1999 (processo administrativo federal): aplica-se subsidiariamente ao procedimento de acesso.", "ext": false}, {"texto": "Lei 8.112/1990: a LAI alterou o art. 116, VI, e incluiu o art. 126-A (proteção ao servidor que comunica crimes ou improbidade); infrações da LAI apenadas no mínimo com suspensão.", "ext": false}, {"texto": "Leis 8.429/1992 e 1.079/1950: as condutas do art. 32 podem configurar improbidade.", "ext": false}, {"texto": "Lei 9.507/1997 (habeas data): aplica-se no que couber à informação de pessoa em bancos de dados públicos.", "ext": false}, {"texto": "LC 101/2000 (LRF), art. 73-B: base da divulgação em tempo real exigida mesmo de Municípios pequenos.", "ext": false}, {"texto": "Lei 7.115/1983: declaração de hipossuficiência para isenção dos custos de reprodução.", "ext": false}, {"texto": "A regulamentação federal da LAI é o Decreto nº 7.724/2012.", "ext": true}, {"texto": "A LGPD (Lei 13.709/2018) convive com a LAI no tratamento de dados pessoais pelo poder público.", "ext": true}], "perguntas": [{"p": "Quem se subordina ao regime da LAI?", "r": "Órgãos da administração direta dos Poderes Executivo, Legislativo (inclusive Cortes de Contas) e Judiciário, o MP, e autarquias, fundações públicas, empresas públicas, sociedades de economia mista e demais entidades controladas pelos entes.", "ref": "Art. 1º, p.ú."}, {"p": "A LAI se aplica a entidades privadas sem fins lucrativos?", "r": "Sim, no que couber, se receberem recursos públicos para ações de interesse público; a publicidade refere-se à parcela de recursos públicos e sua destinação.", "ref": "Art. 2º"}, {"p": "Defina informação sigilosa segundo a LAI.", "r": "Aquela submetida temporariamente à restrição de acesso público por ser imprescindível à segurança da sociedade e do Estado.", "ref": "Art. 4º, III"}, {"p": "O que é primariedade?", "r": "Qualidade da informação coletada na fonte, com o máximo de detalhamento possível, sem modificações.", "ref": "Art. 4º, IX"}, {"p": "Qual o conteúdo mínimo da transparência ativa?", "r": "Competências e estrutura (endereços, telefones, horários), repasses, despesas, licitações e contratos, dados de programas/ações/obras e respostas a perguntas frequentes.", "ref": "Art. 8º, § 1º"}, {"p": "Quais Municípios estão dispensados da divulgação na internet?", "r": "Os com até 10.000 habitantes, mantida a divulgação em tempo real da execução orçamentária e financeira (art. 73-B da LRF).", "ref": "Art. 8º, § 4º"}, {"p": "Quais as atribuições do SIC?", "r": "Atender e orientar o público, informar sobre tramitação de documentos e protocolizar documentos e requerimentos de acesso.", "ref": "Art. 9º, I"}, {"p": "Pode o órgão exigir que o requerente justifique o pedido?", "r": "Não; são vedadas exigências relativas aos motivos da solicitação de informações de interesse público.", "ref": "Art. 10, § 3º"}, {"p": "Qual o prazo de resposta quando não é possível o acesso imediato?", "r": "Até 20 dias, prorrogável por mais 10 dias mediante justificativa expressa, cientificado o requerente.", "ref": "Art. 11, §§ 1º e 2º"}, {"p": "O acesso à informação é gratuito?", "r": "Sim; pode-se cobrar apenas o custo de reprodução, ficando isento quem não puder pagar sem prejuízo do sustento próprio ou da família (Lei 7.115/83).", "ref": "Art. 12"}, {"p": "Qual o prazo para recorrer de negativa de acesso e quem decide?", "r": "10 dias da ciência, dirigido à autoridade hierarquicamente superior, que se manifesta em 5 dias.", "ref": "Art. 15"}, {"p": "Em que hipóteses cabe recurso à CGU?", "r": "Negativa de informação não classificada; negativa que não indica autoridade classificadora; inobservância dos procedimentos de classificação; descumprimento de prazos ou procedimentos. Delibera em 5 dias.", "ref": "Art. 16"}, {"p": "Negado o recurso pela CGU, qual a próxima instância?", "r": "A Comissão Mista de Reavaliação de Informações (CMRI).", "ref": "Art. 16, § 3º"}, {"p": "A quem se recorre do indeferimento de pedido de desclassificação na administração federal?", "r": "Ao Ministro de Estado da área (após ao menos uma autoridade superior e, nas Forças Armadas, o Comando); se secreta/ultrassecreta e indeferido, à CMRI.", "ref": "Art. 17"}, {"p": "Pode-se negar informação sobre violação de direitos humanos por agentes públicos?", "r": "Não; tais informações não podem ser objeto de restrição de acesso.", "ref": "Art. 21, p.ú."}, {"p": "Quais os graus de sigilo e prazos máximos?", "r": "Ultrassecreta 25 anos, secreta 15 anos e reservada 5 anos, contados da data de produção.", "ref": "Art. 24, § 1º"}, {"p": "O que ocorre ao fim do prazo de classificação?", "r": "A informação torna-se automaticamente de acesso público.", "ref": "Art. 24, § 4º"}, {"p": "Quem pode classificar no grau ultrassecreto?", "r": "Presidente, Vice-Presidente, Ministros de Estado e equiparados, Comandantes da Marinha, Exército e Aeronáutica, e Chefes de Missões Diplomáticas e Consulares permanentes no exterior.", "ref": "Art. 27, I"}, {"p": "Quem pode classificar no grau reservado?", "r": "As autoridades dos graus ultrassecreto e secreto e as que exerçam direção, comando ou chefia nível DAS 101.5 ou superior, ou equivalente.", "ref": "Art. 27, III"}, {"p": "Quais elementos mínimos da decisão de classificação?", "r": "Assunto, fundamento, prazo de sigilo (anos, meses ou dias) ou evento final, e identificação da autoridade classificadora; a decisão tem o mesmo grau de sigilo.", "ref": "Art. 28"}, {"p": "O que a autoridade máxima publica anualmente?", "r": "Rol das informações desclassificadas nos últimos 12 meses, rol de documentos classificados por grau e relatório estatístico de pedidos.", "ref": "Art. 30"}, {"p": "Qual o prazo de restrição das informações pessoais?", "r": "Até 100 anos da produção, independentemente de classificação, com acesso a agentes autorizados e ao titular.", "ref": "Art. 31, § 1º, I"}, {"p": "Quando se dispensa o consentimento para acesso a informação pessoal?", "r": "Diagnóstico médico de incapaz; estatísticas e pesquisas de interesse público previstas em lei (sem identificação); ordem judicial; defesa de direitos humanos; interesse público e geral preponderante.", "ref": "Art. 31, § 3º"}, {"p": "Como são enquadradas as condutas ilícitas do art. 32 para servidores federais?", "r": "Infrações administrativas apenadas, no mínimo, com suspensão, conforme a Lei 8.112/90, podendo também configurar improbidade.", "ref": "Art. 32, §§ 1º, II, e 2º"}, {"p": "Quais sanções se aplicam a particulares com vínculo com o poder público?", "r": "Advertência, multa, rescisão do vínculo, suspensão de licitar/impedimento de contratar até 2 anos e declaração de inidoneidade.", "ref": "Art. 33"}, {"p": "Quem aplica a declaração de inidoneidade?", "r": "Exclusivamente a autoridade máxima do órgão ou entidade, facultada defesa em 10 dias da abertura de vista.", "ref": "Art. 33, § 3º"}, {"p": "Quais as competências da CMRI?", "r": "Requisitar esclarecimentos/conteúdo de ultrassecretas e secretas, rever sua classificação e prorrogar o prazo de sigilo de ultrassecreta (uma única renovação).", "ref": "Art. 35, §§ 1º e 2º"}, {"p": "Qual o mandato dos integrantes da CMRI?", "r": "2 anos.", "ref": "Art. 35, § 5º"}, {"p": "O que é o NSC e onde está instituído?", "r": "Núcleo de Segurança e Credenciamento, no GSI da Presidência, para regulamentar credenciamento de segurança e garantir a segurança de informações sigilosas.", "ref": "Art. 37"}, {"p": "Qual a consequência da não reavaliação, em 2 anos, das informações secretas e ultrassecretas?", "r": "Passam automaticamente a ser de acesso público.", "ref": "Art. 39, § 4º"}, {"p": "Quais as atribuições da autoridade designada pelo dirigente máximo (art. 40)?", "r": "Assegurar o cumprimento, monitorar e relatar, recomendar medidas e orientar as unidades quanto à LAI.", "ref": "Art. 40"}, {"p": "O que o art. 126-A inserido na Lei 8.112 garante?", "r": "Que nenhum servidor será responsabilizado civil, penal ou administrativamente por dar ciência à autoridade competente de crimes ou improbidade.", "ref": "Art. 44"}, {"p": "Qual o prazo de vacatio legis da LAI?", "r": "180 dias após a publicação.", "ref": "Art. 47"}], "cobertura": [{"item": "Cap. I – Disposições gerais (arts. 1º–5º)", "status": "ok", "obs": ""}, {"item": "Cap. II – Acesso a informações e divulgação (arts. 6º–9º, incl. 8º-A e 8º-B)", "status": "ok", "obs": "Art. 7º, VIII vetado (Lei 14.345/2022) – apenas mencionado."}, {"item": "Cap. III, Seção I – Pedido de acesso (arts. 10–14)", "status": "ok", "obs": "Art. 12 coberto na redação da Lei 14.129/2021; a redação original também aparece no PDF."}, {"item": "Cap. III, Seção II – Recursos (arts. 15–20)", "status": "ok", "obs": "Art. 19, caput e § 1º vetados."}, {"item": "Cap. IV, Seção I – Disposições gerais (arts. 21–22)", "status": "ok", "obs": ""}, {"item": "Cap. IV, Seção II – Classificação quanto ao grau e prazos (arts. 23–24)", "status": "ok", "obs": ""}, {"item": "Cap. IV, Seção III – Proteção e controle (arts. 25–26)", "status": "ok", "obs": ""}, {"item": "Cap. IV, Seção IV – Classificação, reclassificação e desclassificação (arts. 27–30)", "status": "ok", "obs": ""}, {"item": "Cap. IV, Seção V – Informações pessoais (art. 31)", "status": "ok", "obs": ""}, {"item": "Cap. V – Responsabilidades (arts. 32–34)", "status": "ok", "obs": ""}, {"item": "Cap. VI – Disposições finais e transitórias (arts. 35–47)", "status": "ok", "obs": "Art. 35, caput vetado; §§ 1º–5º cobertos."}], "nao_verificado": ["Conferido: o PDF traz duas redações do art. 12 (original e Lei 14.129/2021); o mapa usa a da Lei 14.129/2021, cuja vigência (Planalto, art. 55 daquela lei) foi de 90 dias após a publicação para a União, 120 para Estados/DF e 180 para Municípios (nota ext no mapa).", "Conferido: 'Art. 8º-B..' (ponto duplicado) é erro de digitação também presente no Planalto; conteúdo íntegro.", "Conferido: o art. 27, III, ainda menciona 'DAS 101.5' também no texto do Planalto (out/2026); a equivalência com os cargos CCE/FCE atuais não está na lei e não foi mapeada.", "Conferido: a lei fixa prazo de 5 dias para a CGU (art. 16, caput) e para a autoridade superior prévia (art. 16, § 1º), mas não fixa prazo para a decisão do Ministro de Estado (art. 17), para a CMRI em grau recursal nem para interpor recurso à CGU/CMRI; isso fica para regulamento (não incluído no PDF)."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
