<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lei nº 12.527/2011</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;
  --c-excecao:#be123c; --c-competencia:#0e7490; --c-sancao:#9f1239; --c-exemplo:#a16207; --c-atencao:#d97706;
  --mark:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
    --mark:#7a5d00;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}

<style>
#lt-btn{position:fixed;right:16px;bottom:16px;z-index:9999;width:46px;height:46px;border-radius:50%;border:1px solid var(--line,#ccc);background:var(--panel,var(--paper,#fff));color:var(--ink,#111);font:700 16px/1 system-ui,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#lt-btn:hover{border-color:var(--accent,#2f5fd0)}
#lt-pn{position:fixed;right:16px;bottom:72px;z-index:9999;width:min(330px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel,var(--paper,#fff));color:var(--ink,#111);border:1px solid var(--line,#ccc);border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
#lt-pn[hidden]{display:none}
body:has(button.localizar.flutua) #lt-btn{bottom:76px}
body:has(button.localizar.flutua) #lt-pn{bottom:132px}
#lt-pn h3{margin:0 0 10px;font-size:15px}
#lt-pn h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#666)}
#lt-pn .lt-g{display:flex;flex-wrap:wrap;gap:6px}
#lt-pn .lt-s{width:38px;height:38px;border-radius:8px;border:1px solid rgba(128,128,128,.45);cursor:pointer;padding:0;font:700 14px/1 Georgia,serif;display:flex;align-items:center;justify-content:center}
#lt-pn .lt-s.on{outline:3px solid var(--accent,#2f5fd0);outline-offset:1px}
#lt-pn .lt-s.def{font:600 10px/1 system-ui,sans-serif;background:var(--soft,#eee);color:var(--ink,#111)}
#lt-pn label.lt-c{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted,#666)}
#lt-pn input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line,#ccc);border-radius:6px;background:none;cursor:pointer}
#lt-pn .lt-r{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
#lt-pn .lt-ct{font-size:12px;color:var(--muted,#666)}
#lt-pn .lt-ct.baixo{color:#c0392b;font-weight:600}
#lt-pn button.lt-x{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line,#ccc);background:var(--soft,#eee);color:var(--ink,#111);cursor:pointer}
@media print{#lt-btn,#lt-pn{display:none!important}}
</style>
<script>
(function(){
var KEY='mm-leitura', root=document.documentElement;
var FUNDOS=[
 ['Branco','#ffffff'],['Creme','#fbf6e9'],['Sépia','#f4ecd8'],['Papel antigo','#ece0c6'],
 ['Verde suave','#e7f0e3'],['Azul suave','#e5edf5'],['Cinza-claro','#eceff1'],['Lavanda','#efebf6'],
 ['Cinza-escuro','#2b2f36'],['Sépia escuro','#2a231b'],['Verde-noite','#1a2520'],['Noturno','#121417']];
var LETRAS=[
 ['Preto','#111111'],['Grafite','#343a44'],['Marrom','#4a3423'],['Azul-marinho','#1c2a4d'],
 ['Verde-escuro','#1f3d2b'],['Vinho','#5c1f2c'],['Branco-gelo','#eef1f5'],['Bege claro','#e9dcc0'],
 ['Âmbar','#f0c674'],['Verde-claro','#b9e0c1'],['Azul-claro','#b7cdf2']];
var VARS=['--bg','--panel','--paper','--soft','--line','--muted','--code-bg','--ink','color-scheme'];
function ler(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function salvar(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function escuro(h){return lum(h)<.18}
function contraste(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var st=ler();
function aplicar(){
  var r=root.style; VARS.forEach(function(v){r.removeProperty(v)});
  if(st.bg){
    var d=escuro(st.bg), mx=d?'#ffffff':'#000000';
    root.dataset.theme=d?'dark':'light';
    r.setProperty('--panel',st.bg); r.setProperty('--paper',st.bg);
    r.setProperty('--bg','color-mix(in srgb,'+st.bg+' '+(d?'92%':'95%')+','+mx+')');
    r.setProperty('--soft','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--code-bg','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--line','color-mix(in srgb,'+st.bg+' '+(d?'78%':'84%')+','+mx+')');
    r.setProperty('color-scheme',d?'dark':'light');
  } else {
    var th=null; try{th=localStorage.getItem('mm-theme')}catch(e){}
    if(th) root.dataset.theme=th; else delete root.dataset.theme;
  }
  if(st.ink){
    r.setProperty('--ink',st.ink);
    r.setProperty('--muted','color-mix(in srgb,'+st.ink+' 72%,var(--panel,var(--paper,#888)))');
  }
}
aplicar();
function corFundoAtual(){
  var probe=document.getElementById('lt-pn')||document.body;
  var c=getComputedStyle(probe).backgroundColor.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#ffffff';
}
function corTextoAtual(){
  var c=getComputedStyle(document.body).color.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#111111';
}
function montar(){
  aplicar();
  var b=document.createElement('button'); b.id='lt-btn'; b.type='button'; b.title='Cores de leitura (fundo e letras)'; b.setAttribute('aria-label','Cores de leitura'); b.textContent='Aa';
  var p=document.createElement('div'); p.id='lt-pn'; p.hidden=true; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Cores de leitura');
  function grade(lista,chave,ehFundo){
    var h='<div class="lt-g"><button type="button" class="lt-s def" data-k="'+chave+'" data-v="" title="Padrão do tema">padrão</button>';
    lista.forEach(function(x){
      h+='<button type="button" class="lt-s" data-k="'+chave+'" data-v="'+x[1]+'" title="'+x[0]+'" style="'+(ehFundo?'background:'+x[1]+';color:'+(escuro(x[1])?'#eee':'#222'):'background:var(--panel,var(--paper,#fff));color:'+x[1])+'">'+(ehFundo?'':'Aa')+'</button>';
    });
    return h+'</div>';
  }
  p.innerHTML='<h3>Cores de leitura</h3>'+
   '<h4>Cor do fundo</h4>'+grade(FUNDOS,'bg',true)+
   '<label class="lt-c"><input type="color" data-k="bg"> Outra cor de fundo</label>'+
   '<h4>Cor das letras</h4>'+grade(LETRAS,'ink',false)+
   '<label class="lt-c"><input type="color" data-k="ink"> Outra cor de letra</label>'+
   '<div class="lt-r"><span class="lt-ct"></span><button type="button" class="lt-x">Restaurar padrão</button></div>';
  document.body.appendChild(p); document.body.appendChild(b);
  function sync(){
    p.querySelectorAll('.lt-s').forEach(function(s){s.classList.toggle('on',(st[s.dataset.k]||'')===s.dataset.v)});
    var bg=corFundoAtual(), ink=corTextoAtual();
    p.querySelector('input[data-k=bg]').value=st.bg||bg;
    p.querySelector('input[data-k=ink]').value=st.ink||ink;
    var c=contraste(bg,ink), el=p.querySelector('.lt-ct');
    el.textContent='Contraste '+c.toFixed(1)+':1'+(c<4.5?' (baixo para leitura)':'');
    el.classList.toggle('baixo',c<4.5);
  }
  function definir(k,v){ if(v) st[k]=v; else delete st[k]; salvar(st); aplicar(); sync(); }
  p.addEventListener('click',function(e){
    var s=e.target.closest('.lt-s'); if(s) definir(s.dataset.k,s.dataset.v);
    if(e.target.closest('.lt-x')){ st={}; salvar(st); aplicar(); sync(); }
  });
  p.addEventListener('input',function(e){ if(e.target.type==='color') definir(e.target.dataset.k,e.target.value); });
  b.addEventListener('click',function(){ p.hidden=!p.hidden; if(!p.hidden) sync(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') p.hidden=true; });
  document.addEventListener('click',function(e){ if(!p.hidden&&!p.contains(e.target)&&e.target!==b) p.hidden=true; });
  // O botão ◐ (claro/escuro) das páginas volta o fundo ao padrão do tema escolhido
  var tb=document.getElementById('themeBtn');
  if(tb) tb.addEventListener('click',function(){ if(st.bg){ delete st.bg; salvar(st); aplicar(); } });
  window.addEventListener('storage',function(e){ if(e.key===KEY){ st=ler(); aplicar(); if(!p.hidden) sync(); } });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar); else montar();
})();
</script>

"t": "Dever do Estado: procedimentos objetivos, ágeis, linguagem fácil", "tipo": "regra", "ref": "Art. 5º"}]}, {"t": "Cap. II – Acesso e divulgação (arts. 6º–9º)", "tipo": "topico", "filhos": [{"t": "Direitos abrangidos pelo acesso (rol exemplificativo)", "tipo": "classificacao", "ref": "Art. 7º"}, {"t": "Acesso parcial: parte não sigilosa por certidão, extrato ou cópia", "tipo": "regra", "ref": "Art. 7º, § 2º"}, {"t": "Transparência ativa: divulgar independentemente de requerimento", "tipo": "conceito", "ref": "Art. 8º"}, {"t": "Internet obrigatória; dispensa para Municípios até 10.000 hab.", "tipo": "prazo", "ref": "Art. 8º, §§ 2º e 4º"}, {"t": "Serviços sociais autônomos e conselhos profissionais (Lei 15.141/2025)", "tipo": "regra", "ref": "Arts. 8º-A e 8º-B"}, {"t": "SIC e audiências/consultas públicas", "tipo": "competencia", "ref": "Art. 9º"}]}, {"t": "Cap. III – Procedimento de acesso (arts. 10–20)", "tipo": "topico", "filhos": [{"t": "Transparência passiva: pedido por qualquer interessado", "tipo": "conceito", "ref": "Art. 10"}, {"t": "Vedado exigir motivos do pedido de interesse público", "tipo": "excecao", "ref": "Art. 10, § 3º"}, {"t": "Acesso imediato; senão até 20 dias + 10 prorrogáveis", "tipo": "prazo", "ref": "Art. 11, §§ 1º e 2º"}, {"t": "Serviço gratuito; cobra só custo de reprodução", "tipo": "regra", "ref": "Art. 12"}, {"t": "Recurso: 10 dias; autoridade superior decide em 5 dias", "tipo": "prazo", "ref": "Art. 15"}, {"t": "Executivo federal: CGU (5 dias) → CMRI", "tipo": "competencia", "ref": "Art. 16"}, {"t": "Desclassificação: recurso ao Ministro de Estado → CMRI", "tipo": "competencia", "ref": "Art. 17"}, {"t": "Lei 9.784/99 subsidiária", "tipo": "regra", "ref": "Art. 20"}]}, {"t": "Cap. IV – Restrições de acesso (arts. 21–31)", "tipo": "topico", "filhos": [{"t": "Não se nega info para tutela de direitos fundamentais", "tipo": "excecao", "ref": "Art. 21"}, {"t": "Hipóteses de classificação (8 incisos)", "tipo": "classificacao", "ref": "Art. 23"}, {"t": "Graus: ultrassecreta 25, secreta 15, reservada 5 anos", "tipo": "prazo", "ref": "Art. 24, § 1º"}, {"t": "Autoridades classificadoras na esfera federal", "tipo": "competencia", "ref": "Art. 27"}, {"t": "Decisão de classificação, reavaliação e publicação anual", "tipo": "regra", "ref": "Arts. 28–30"}, {"t": "Informações pessoais: restrição até 100 anos", "tipo": "prazo", "ref": "Art. 31, § 1º, I"}]}, {"t": "Cap. V – Responsabilidades (arts. 32–34)", "tipo": "topico", "filhos": [{"t": "Condutas ilícitas do agente público ou militar", "tipo": "sancao", "ref": "Art. 32"}, {"t": "Infração da Lei 8.112: no mínimo suspensão", "tipo": "sancao", "ref": "Art. 32, § 1º, II"}, {"t": "Sanções a pessoa física/entidade privada com vínculo", "tipo": "sancao", "ref": "Art. 33"}, {"t": "Responsabilidade direta do órgão + direito de regresso", "tipo": "sancao", "ref": "Art. 34"}]}, {"t": "Cap. VI – Disposições finais e transitórias (arts. 35–47)", "tipo": "topico", "filhos": [{"t": "CMRI: rever e prorrogar classificações", "tipo": "competencia", "ref": "Art. 35, § 1º"}, {"t": "NSC no GSI/PR: credenciamento de segurança", "tipo": "competencia", "ref": "Art. 37"}, {"t": "Reavaliação em 2 anos das ultrassecretas/secretas", "tipo": "prazo", "ref": "Art. 39"}, {"t": "Autoridade de monitoramento designada em 60 dias", "tipo": "prazo", "ref": "Art. 40"}, {"t": "Altera Lei 8.112 (art. 116, VI e art. 126-A)", "tipo": "regra", "ref": "Arts. 43–44"}, {"t": "Vigência: 180 dias após publicação", "tipo": "prazo", "ref": "Art. 47"}]}]}}, {"id": "cap-1", "titulo": "Capítulo I – Disposições gerais (arts. 1º–5º)", "raiz": {"t": "Cap. I – Disposições gerais", "tipo": "topico", "ref": "Arts. 1º–5º", "filhos": [{"t": "Objeto da lei", "tipo": "conceito", "d": "Procedimentos a observar pela União, Estados, DF e Municípios para garantir o acesso a informações.", "ref": "Art. 1º", "filhos": [{"t": "Fundamentos constitucionais", "tipo": "classificacao", "d": "Art. 5º, XXXIII; art. 37, § 3º, II; art. 216, § 2º, da CF.", "ref": "Art. 1º"}]}, {"t": "Quem se subordina ao regime da lei", "tipo": "competencia", "ref": "Art. 1º, p.ú.", "filhos": [{"t": "Administração direta dos Poderes Executivo, Legislativo e Judiciário", "tipo": "competencia", "d": "Legislativo incluindo as Cortes de Contas; também o Ministério Público.", "ref": "Art. 1º, p.ú., I"}, {"t": "Indireta e entidades controladas", "tipo": "competencia", "d": "Autarquias, fundações públicas, empresas públicas, sociedades de economia mista e demais entidades controladas direta ou indiretamente pelos entes.", "ref": "Art. 1º, p.ú., II"}, {"t": "Tribunais de Contas estão expressamente incluídos", "tipo": "atencao", "ref": "Art. 1º, p.ú., I"}]}, {"t": "Entidades privadas sem fins lucrativos", "tipo": "competencia", "d": "Aplica-se 'no que couber' às que recebam recursos públicos para ações de interesse público.", "ref": "Art. 2º", "filhos": [{"t": "Formas de recebimento", "tipo": "classificacao", "d": "Diretamente do orçamento ou mediante subvenções sociais, contrato de gestão, termo de parceria, convênios, acordo, ajustes ou instrumentos congêneres.", "ref": "Art. 2º"}, {"t": "Publicidade limitada à parcela dos recursos públicos e sua destinação", "tipo": "excecao", "d": "Sem prejuízo das prestações de contas legalmente obrigatórias.", "ref": "Art. 2º, p.ú."}]}, {"t": "Diretrizes (além dos princípios da Administração)", "tipo": "classificacao", "d": "Procedimentos asseguram o direito fundamental de acesso à informação.", "ref": "Art. 3º", "filhos": [{"t": "Publicidade como preceito geral; sigilo como exceção", "tipo": "conceito", "ref": "Art. 3º, I"}, {"t": "Divulgação de interesse público independentemente de solicitação", "tipo": "regra", "ref": "Art. 3º, II"}, {"t": "Uso de meios da tecnologia da informação", "tipo": "regra", "ref": "Art. 3º, III"}, {"t": "Fomento à cultura de transparência", "tipo": "regra", "ref": "Art. 3º, IV"}, {"t": "Desenvolvimento do controle social", "tipo": "regra", "ref": "Art. 3º, V"}]}, {"t": "Definições legais", "tipo": "conceito", "ref": "Art. 4º", "filhos": [{"t": "Informação", "tipo": "conceito", "d": "Dados, processados ou não, que podem ser utilizados para produção e transmissão de conhecimento, contidos em qualquer meio, suporte ou formato.", "ref": "Art. 4º, I"}, {"t": "Documento", "tipo": "conceito", "d": "Unidade de registro de informações, qualquer que seja o suporte ou formato.", "ref": "Art. 4º, II"}, {"t": "Informação sigilosa", "tipo": "conceito", "d": "Submetida TEMPORARIAMENTE à restrição de acesso público por ser imprescindível à segurança da sociedade e do Estado.", "ref": "Art. 4º, III"}, {"t": "Informação pessoal", "tipo": "conceito", "d": "Relacionada à pessoa natural identificada ou identificável.", "ref": "Art. 4º, IV"}, {"t": "Tratamento da informação", "tipo": "conceito", "d": "Conjunto de ações: produção, recepção, classificação, utilização, acesso, reprodução, transporte, transmissão, distribuição, arquivamento, armazenamento, eliminação, avaliação, destinação ou controle.", "ref": "Art. 4º, V"}, {"t": "Qualidades da informação", "tipo": "classificacao", "ref": "Art. 4º, VI–IX", "filhos": [{"t": "Disponibilidade", "tipo": "conceito", "d": "Pode ser conhecida e utilizada por indivíduos, equipamentos ou sistemas autorizados.", "ref": "Art. 4º, VI"}, {"t": "Autenticidade", "tipo": "conceito", "d": "Produzida, expedida, recebida ou modificada por determinado indivíduo, equipamento ou sistema.", "ref": "Art. 4º, VII"}, {"t": "Integridade", "tipo": "conceito", "d": "Não modificada, inclusive quanto à origem, trânsito e destino.", "ref": "Art. 4º, VIII"}, {"t": "Primariedade", "tipo": "conceito", "d": "Coletada na fonte, com o máximo de detalhamento possível, sem modificações.", "ref": "Art. 4º, IX"}, {"t": "Não confundir autenticidade (autoria) × integridade (não modificação)", "tipo": "atencao", "ref": "Art. 4º, VII e VIII"}]}]}, {"t": "Dever do Estado de garantir o acesso", "tipo": "regra", "d": "Franqueado mediante procedimentos objetivos e ágeis, de forma transparente, clara e em linguagem de fácil compreensão.", "ref": "Art. 5º"}]}}, {"id": "cap-2", "titulo": "Capítulo II – Acesso a informações e divulgação / transparência ativa (arts. 6º–9º)", "raiz": {"t": "Cap. II – Do acesso a informações e da sua divulgação", "tipo": "topico", "ref": "Arts. 6º–9º", "filhos": [{"t": "Deveres dos órgãos e entidades", "tipo": "regra", "ref": "Art. 6º", "filhos": [{"t": "Gestão transparente: amplo acesso e divulgação", "tipo": "regra", "ref": "Art. 6º, I"}, {"t": "Proteção da informação: disponibilidade, autenticidade, integridade", "tipo": "regra", "ref": "Art. 6º, II"}, {"t": "Proteção da sigilosa e da pessoal (com eventual restrição)", "tipo": "regra", "ref": "Art. 6º, III"}]}, {"t": "Direitos compreendidos no acesso (entre outros)", "tipo": "classificacao", "ref": "Art. 7º", "filhos": [{"t": "Orientação sobre procedimentos e local da informação", "tipo": "regra", "ref": "Art. 7º, I"}, {"t": "Informação em registros/documentos, recolhidos ou não a arquivos públicos", "tipo": "regra", "ref": "Art. 7º, II"}, {"t": "Info produzida/custodiada por particular com vínculo, mesmo cessado", "tipo": "regra", "ref": "Art. 7º, III"}, {"t": "Informação primária, íntegra, autêntica e atualizada", "tipo": "regra", "ref": "Art. 7º, IV"}, {"t": "Atividades dos órgãos: política, organização e serviços", "tipo": "regra", "ref": "Art. 7º, V"}, {"t": "Patrimônio público, recursos públicos, licitação, contratos", "tipo": "regra", "ref": "Art. 7º, VI"}, {"t": "Programas/projetos/ações, metas e indicadores; auditorias e contas", "tipo": "regra", "d": "Inclui resultados de inspeções, auditorias, prestações e tomadas de contas do controle interno e externo, inclusive de exercícios anteriores.", "ref": "Art. 7º, VII, a e b"}, {"t": "Inciso VIII vetado (Lei 14.345/2022)", "tipo": "atencao", "ref": "Art. 7º, VIII"}]}, {"t": "Limites e garantias do acesso", "tipo": "regra", "ref": "Art. 7º, §§ 1º–6º", "filhos": [{"t": "Não abrange P&D científico/tecnológico de sigilo imprescindível", "tipo": "excecao", "d": "Projetos de pesquisa e desenvolvimento cujo sigilo seja imprescindível à segurança da sociedade e do Estado.", "ref": "Art. 7º, § 1º"}, {"t": "Informação parcialmente sigilosa: acesso à parte não sigilosa", "tipo": "regra", "d": "Por certidão, extrato ou cópia com ocultação da parte sob sigilo.", "ref": "Art. 7º, § 2º"}, {"t": "Documentos que fundamentam decisão: acesso com a edição do ato decisório", "tipo": "prazo", "ref": "Art. 7º, § 3º"}, {"t": "Negativa não fundamentada → medidas disciplinares (art. 32)", "tipo": "sancao", "ref": "Art. 7º, § 4º"}, {"t": "Extravio: interessado pode requerer abertura imediata de sindicância", "tipo": "regra", "ref": "Art. 7º, § 5º", "filhos": [{"t": "Responsável pela guarda: 10 dias para justificar e indicar testemunhas", "tipo": "prazo", "ref": "Art. 7º, § 6º"}]}]}, {"t": "Transparência ativa", "tipo": "conceito", "d": "Dever de divulgar, independentemente de requerimentos, em local de fácil acesso, informações de interesse coletivo ou geral produzidas ou custodiadas.", "ref": "Art. 8º", "filhos": [{"t": "Conteúdo mínimo", "tipo": "classificacao", "ref": "Art. 8º, § 1º", "filhos": [{"t": "Competências, estrutura, endereços, telefones e horários", "tipo": "regra", "ref": "Art. 8º, § 1º, I"}, {"t": "Repasses ou transferências de recursos financeiros", "tipo": "regra", "ref": "Art. 8º, § 1º, II"}, {"t": "Registros das despesas", "tipo": "regra", "ref": "Art. 8º, § 1º, III"}, {"t": "Licitações (editais e resultados) e todos os contratos", "tipo": "regra", "ref": "Art. 8º, § 1º, IV"}, {"t": "Dados de programas, ações, projetos e obras", "tipo": "regra", "ref": "Art. 8º, § 1º, V"}, {"t": "Respostas a perguntas mais frequentes", "tipo": "regra", "ref": "Art. 8º, § 1º, VI"}]}, {"t": "Divulgação obrigatória em sítios oficiais na internet", "tipo": "regra", "d": "Devem usar todos os meios e instrumentos legítimos de que dispuserem.", "ref": "Art. 8º, § 2º"}, {"t": "Requisitos dos sítios (na forma de regulamento)", "tipo": "classificacao", "ref": "Art. 8º, § 3º", "filhos": [{"t": "Ferramenta de pesquisa em linguagem clara", "tipo": "regra", "ref": "Art. 8º, § 3º, I"}, {"t": "Gravação de relatórios em formatos diversos, abertos e não proprietários", "tipo": "regra", "ref": "Art. 8º, § 3º, II"}, {"t": "Acesso automatizado: formatos abertos, estruturados, legíveis por máquina", "tipo": "regra", "ref": "Art. 8º, § 3º, III"}, {"t": "Divulgar detalhes dos formatos utilizados", "tipo": "regra", "ref": "Art. 8º, § 3º, IV"}, {"t": "Garantir autenticidade e integridade", "tipo": "regra", "ref": "Art. 8º, § 3º, V"}, {"t": "Manter informações atualizadas", "tipo": "regra", "ref": "Art. 8º, § 3º, VI"}, {"t": "Indicar canal eletrônico ou telefônico de contato", "tipo": "regra", "ref": "Art. 8º, § 3º, VII"}, {"t": "Acessibilidade para pessoas com deficiência", "tipo": "regra", "d": "Art. 17 da Lei 10.098/2000 e art. 9º da Convenção (Decreto Legislativo 186/2008).", "ref": "Art. 8º, § 3º, VIII"}]}, {"t": "Municípios até 10.000 habitantes: dispensados da internet", "tipo": "excecao", "d": "Mantida a divulgação em tempo real da execução orçamentária e financeira, conforme art. 73-B da LRF (LC 101/2000).", "ref": "Art. 8º, § 4º", "filhos": [{"t": "Dispensa NÃO alcança execução orçamentária/financeira em tempo real", "tipo": "atencao", "ref": "Art. 8º, § 4º"}]}]}, {"t": "Serviços sociais autônomos com recursos federais de contrato de gestão", "tipo": "regra", "d": "Entidades privadas (serviço social autônomo) destinatárias de contribuições ou recursos públicos federais decorrentes de contrato de gestão devem divulgar dados sobre empregados.", "ref": "Art. 8º-A (Lei 15.141/2025)", "filhos": [{"t": "Plano de cargos e salários, critérios de carreira e política salarial", "tipo": "regra", "ref": "Art. 8º-A, I"}, {"t": "Quantitativo por cargo e faixa salarial, com nome e cargo do empregado", "tipo": "regra", "ref": "Art. 8º-A, II"}, {"t": "Parcelas remuneratórias e indenizatórias por faixa salarial", "tipo": "regra", "d": "Inclui auxílios, ajudas de custo, gratificações, jetons e outras vantagens, ainda que eventuais.", "ref": "Art. 8º-A, III"}, {"t": "Funções gratificadas: quantitativo, critérios e ocupantes", "tipo": "regra", "ref": "Art. 8º-A, IV"}]}, {"t": "Conselhos de fiscalização profissional", "tipo": "regra", "d": "Divulgar, de forma nominal e individualizada, lista das parcelas remuneratórias e indenizatórias que os empregados possam receber.", "ref": "Art. 8º-B (Lei 15.141/2025)"}, {"t": "Meios de assegurar o acesso", "tipo": "regra", "ref": "Art. 9º", "filhos": [{"t": "Serviço de Informações ao Cidadão (SIC)", "tipo": "competencia", "ref": "Art. 9º, I", "filhos": [{"t": "Atender e orientar o público", "tipo": "regra", "ref": "Art. 9º, I, a"}, {"t": "Informar a tramitação de documentos", "tipo": "regra", "ref": "Art. 9º, I, b"}, {"t": "Protocolizar documentos e requerimentos de acesso", "tipo": "regra", "ref": "Art. 9º, I, c"}]}, {"t": "Audiências ou consultas públicas e participação popular", "tipo": "regra", "ref": "Art. 9º, II"}]}]}}, {"id": "cap-3", "titulo": "Capítulo III – Procedimento de acesso e recursos / transparência passiva (arts. 10–20)", "raiz": {"t": "Cap. III – Do procedimento de acesso à informação (transparência passiva)", "tipo": "topico", "ref": "Arts. 10–20", "filhos": [{"t": "Seção I – Do pedido de acesso", "tipo": "topico", "ref": "Arts. 10–14", "filhos": [{"t": "Legitimidade: qualquer interessado, por qualquer meio legítimo", "tipo": "regra", "d": "O pedido deve conter identificação do requerente e especificação da informação.", "ref": "Art. 10", "filhos": [{"t": "Identificação não pode inviabilizar a solicitação", "tipo": "excecao", "ref": "Art. 10, § 1º"}, {"t": "Alternativa de envio pelos sítios oficiais na internet", "tipo": "regra", "ref": "Art. 10, § 2º"}, {"t": "Vedadas exigências sobre os motivos do pedido", "tipo": "excecao", "d": "Para informações de interesse público.", "ref": "Art. 10, § 3º"}, {"t": "Identificação é exigida; motivação é que é vedada", "tipo": "atencao", "ref": "Art. 10, caput e § 3º"}]}, {"t": "Resposta ao pedido", "tipo": "regra", "ref": "Art. 11", "filhos": [{"t": "Regra: acesso imediato à informação disponível", "tipo": "regra", "ref": "Art. 11, caput"}, {"t": "Não sendo possível: prazo não superior a 20 dias", "tipo": "prazo", "ref": "Art. 11, § 1º", "filhos": [{"t": "Comunicar data, local e modo de consulta/reprodução/certidão", "tipo": "regra", "ref": "Art. 11, § 1º, I"}, {"t": "Indicar razões de fato ou de direito da recusa total/parcial", "tipo": "regra", "ref": "Art. 11, § 1º, II"}, {"t": "Informar que não possui; indicar ou remeter a quem detém", "tipo": "regra", "d": "Cientificando o interessado da remessa.", "ref": "Art. 11, § 1º, III"}]}, {"t": "Prorrogação por mais 10 dias com justificativa expressa", "tipo": "prazo", "d": "Requerente deve ser cientificado. Total máximo: 30 dias.", "ref": "Art. 11, § 2º"}, {"t": "Órgão pode oferecer meios para o próprio requerente pesquisar", "tipo": "regra", "ref": "Art. 11, § 3º"}, {"t": "Negativa por sigilo: informar recurso, prazos, condições e autoridade", "tipo": "regra", "ref": "Art. 11, § 4º"}, {"t": "Formato digital fornecido nesse formato, se houver anuência", "tipo": "regra", "ref": "Art. 11, § 5º"}, {"t": "Informação já pública: indicar por escrito lugar e forma de acesso", "tipo": "regra", "d": "Desonera o órgão do fornecimento direto, salvo se o requerente declarar não dispor de meios.", "ref": "Art. 11, § 6º"}]}, {"t": "Gratuidade", "tipo": "regra", "d": "Serviço de busca e fornecimento é gratuito (redação da Lei 14.129/2021).", "ref": "Art. 12", "filhos": [{"t": "Cobrança só do custo de reprodução (serviços e materiais)", "tipo": "excecao", "ref": "Art. 12, § 1º"}, {"t": "Isento quem não pode pagar sem prejuízo do sustento", "tipo": "excecao", "d": "Situação declarada nos termos da Lei 7.115/1983.", "ref": "Art. 12, § 2º"}, {"t": "Vigência da nova redação: 90 dias após 30/3/2021 para a União", "tipo": "atencao", "ext": true, "ref": "Lei 14.129/2021, art. 55", "d": "Conferido no Planalto: a Lei 14.129/2021 entrou em vigor após 90 dias da publicação para a União, 120 dias para Estados e DF e 180 dias para Municípios. Em substância, a regra não mudou: gratuidade, cobrança só do custo de reprodução e isenção do hipossuficiente."}]}, {"t": "Documento frágil: consulta de cópia certificada", "tipo": "regra", "ref": "Art. 13", "filhos": [{"t": "Sem cópia: reprodução por outro meio, às expensas do interessado", "tipo": "regra", "d": "Sob supervisão de servidor público, sem risco ao original.", "ref": "Art. 13, p.ú."}]}, {"t": "Direito ao inteiro teor da decisão de negativa", "tipo": "regra", "d": "Por certidão ou cópia.", "ref": "Art. 14"}]}, {"t": "Seção II – Dos recursos", "tipo": "topico", "ref": "Arts. 15–20", "filhos": [{"t": "Recurso contra indeferimento ou contra as razões da negativa", "tipo": "regra", "ref": "Art. 15", "filhos": [{"t": "Prazo: 10 dias da ciência", "tipo": "prazo", "ref": "Art. 15, caput"}, {"t": "Dirigido à autoridade hierarquicamente superior", "tipo": "competencia", "ref": "Art. 15, p.ú."}, {"t": "Manifestação em 5 dias", "tipo": "prazo", "ref": "Art. 15, p.ú."}]}, {"t": "Executivo federal: recurso à CGU", "tipo": "competencia", "d": "A CGU delibera em 5 dias.", "ref": "Art. 16", "filhos": [{"t": "Hipóteses", "tipo": "classificacao", "ref": "Art. 16, I–IV", "filhos": [{"t": "Negado acesso a informação NÃO classificada", "tipo": "regra", "ref": "Art. 16, I"}, {"t": "Negativa não indica autoridade classificadora ou superior", "tipo": "regra", "ref": "Art. 16, II"}, {"t": "Procedimentos de classificação não observados", "tipo": "regra", "ref": "Art. 16, III"}, {"t": "Descumprimento de prazos ou procedimentos", "tipo": "regra", "ref": "Art. 16, IV"}]}, {"t": "Pré-requisito: apreciação por ao menos uma autoridade superior (5 dias)", "tipo": "excecao", "ref": "Art. 16, § 1º"
