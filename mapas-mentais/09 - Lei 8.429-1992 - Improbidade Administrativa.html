<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}
</style>

<script id="data" type="application/json">{"id": "mm-l8429", "titulo": "Lei nº 8.429/1992", "subtitulo": "Lei de Improbidade Administrativa (LIA) – texto compilado com a reforma da Lei nº 14.230/2021", "fonte": "L8429.pdf", "versao_fonte": "Texto compilado do Planalto (Lei de 2/6/1992, DOU 3/6/1992), com alterações até a Lei nº 14.230/2021; consideradas apenas as redações vigentes. Constam no PDF remissões às ADIs 7042, 7043, 7156 e 7236.", "visao_geral": "A Lei 8.429/1992 regulamenta o § 4º do art. 37 da CF, disciplinando o sistema de responsabilização por atos de improbidade administrativa, que tutela a probidade na organização do Estado e a integridade do patrimônio público e social. Após a Lei 14.230/2021, só há improbidade por conduta DOLOSA tipificada nos arts. 9º (enriquecimento ilícito), 10 (prejuízo ao erário) e 11 (atentado aos princípios, rol taxativo). A lei está dividida em 8 capítulos: disposições gerais; atos de improbidade; penas (art. 12); declaração de bens; procedimento administrativo e processo judicial (indisponibilidade, ação, acordo de não persecução civil, sentença); disposições penais; prescrição (8 anos); disposições finais.", "mapas": [{"id": "geral", "titulo": "Mapa geral", "raiz": {"t": "Lei 8.429/1992 – Improbidade Administrativa", "tipo": "topico", "d": "Regulamenta o art. 37, § 4º, da CF; redação reformada pela Lei 14.230/2021.", "filhos": [{"t": "Cap. I – Disposições gerais (arts. 1º–8º-A)", "tipo": "topico", "filhos": [{"t": "Tutela a probidade e a integridade do patrimônio público e social", "tipo": "conceito", "ref": "Art. 1º, caput"}, {"t": "Improbidade = conduta DOLOSA tipificada nos arts. 9, 10 e 11", "tipo": "conceito", "ref": "Art. 1º, § 1º"}, {"t": "Dolo: vontade livre e consciente de alcançar o resultado ilícito", "tipo": "conceito", "d": "Não basta a voluntariedade do agente.", "ref": "Art. 1º, § 2º"}, {"t": "Princípios do direito administrativo sancionador", "tipo": "regra", "ref": "Art. 1º, § 4º"}, {"t": "Sujeitos: agente público, particular com recursos públicos, terceiro que induz/concorre dolosamente", "tipo": "competencia", "ref": "Arts. 2º e 3º"}, {"t": "Sucessor/herdeiro: só reparar o dano até o limite da herança", "tipo": "sancao", "ref": "Art. 8º"}]}, {"t": "Cap. II – Atos de improbidade (arts. 9º–11)", "tipo": "topico", "filhos": [{"t": "Art. 9º – Enriquecimento ilícito", "tipo": "classificacao", "d": "Auferir, mediante ato doloso, vantagem patrimonial indevida em razão do cargo. Rol exemplificativo ('notadamente').", "ref": "Art. 9º"}, {"t": "Art. 10 – Lesão ao erário", "tipo": "classificacao", "d": "Ação ou omissão dolosa que enseje, efetiva e comprovadamente, perda patrimonial. Rol exemplificativo.", "ref": "Art. 10"}, {"t": "Art. 11 – Atentado aos princípios", "tipo": "classificacao", "d": "Ação ou omissão dolosa que viole honestidade, imparcialidade e legalidade, 'caracterizada por uma das seguintes condutas' (rol fechado).", "ref": "Art. 11"}]}, {"t": "Cap. III – Penas (art. 12)", "tipo": "topico", "filhos": [{"t": "Art. 9º: direitos políticos e proibição de contratar até 14 anos; multa = acréscimo", "tipo": "prazo", "ref": "Art. 12, I"}, {"t": "Art. 10: direitos políticos e proibição de contratar até 12 anos; multa = dano", "tipo": "prazo", "ref": "Art. 12, II"}, {"t": "Art. 11: só multa até 24x remuneração e proibição de contratar até 4 anos", "tipo": "prazo", "ref": "Art. 12, III"}, {"t": "Execução só após trânsito em julgado", "tipo": "regra", "ref": "Art. 12, § 9º"}]}, {"t": "Cap. IV – Declaração de bens (art. 13)", "tipo": "topico", "filhos": [{"t": "Posse e exercício condicionados à declaração de IR", "tipo": "regra", "ref": "Art. 13"}, {"t": "Recusa ou declaração falsa: demissão", "tipo": "sancao", "ref": "Art. 13, § 3º"}]}, {"t": "Cap. V – Procedimento administrativo e processo judicial (arts. 14–18-A)", "tipo": "topico", "filhos": [{"t": "Representação por qualquer pessoa", "tipo": "regra", "ref": "Art. 14"}, {"t": "Indisponibilidade de bens (antecedente ou incidente)", "tipo": "regra", "ref": "Art. 16"}, {"t": "Ação proposta pelo MP, procedimento comum do CPC", "tipo": "regra", "ref": "Art. 17"}, {"t": "Acordo de não persecução civil", "tipo": "regra", "ref": "Art. 17-B"}, {"t": "Requisitos da sentença; natureza sancionatória da ação", "tipo": "regra", "ref": "Arts. 17-C e 17-D"}, {"t": "Ressarcimento, parcelamento em até 48x, unificação de sanções (limite 20 anos)", "tipo": "prazo", "ref": "Arts. 18 e 18-A"}]}, {"t": "Cap. VI – Disposições penais (arts. 19–22)", "tipo": "topico", "filhos": [{"t": "Crime: representação sabendo inocente (detenção 6 a 10 meses e multa)", "tipo": "sancao", "ref": "Art. 19"}, {"t": "Afastamento cautelar até 90 dias, prorrogável uma vez", "tipo": "prazo", "ref": "Art. 20, §§ 1º e 2º"}, {"t": "Independência relativa das instâncias", "tipo": "regra", "ref": "Art. 21"}, {"t": "Inquérito civil pelo MP", "tipo": "competencia", "ref": "Art. 22"}]}, {"t": "Cap. VII – Prescrição (arts. 23–23-C)", "tipo": "topico", "filhos": [{"t": "8 anos, contados do fato (ou da cessação da permanência)", "tipo": "prazo", "ref": "Art. 23"}, {"t": "Interrompida: recomeça pela metade (4 anos); prescrição intercorrente", "tipo": "prazo", "ref": "Art. 23, §§ 5º e 8º"}, {"t": "STF (ADIs 7156/7236, 2026) derrubou a redução pela metade e outros pontos da reforma", "tipo": "atencao", "d": "Ver alertas nos mapas detalhados (arts. 1º, § 8º; 3º, § 1º; 12, §§ 1º e 4º; 16; 17; 17-B, § 3º; 17-C, § 2º; 21, § 4º; 23, § 5º; 23-C).", "ext": true}, {"t": "Inquérito civil: 365 dias, prorrogável uma vez", "tipo": "prazo", "ref": "Art. 23, § 2º"}]}, {"t": "Cap. VIII – Disposições finais (arts. 24–25)", "tipo": "topico", "filhos": [{"t": "Vigência na data da publicação; revoga Leis 3.164/57 e 3.502/58", "tipo": "regra", "ref": "Arts. 24 e 25"}]}]}}, {"id": "cap1", "titulo": "Capítulo I – Disposições gerais (arts. 1º–8º-A)", "raiz": {"t": "Disposições gerais", "tipo": "topico", "ref": "Arts. 1º–8º-A", "filhos": [{"t": "Objeto e fundamento", "tipo": "topico", "filhos": [{"t": "Sistema de responsabilização tutela a probidade na organização do Estado", "tipo": "conceito", "d": "Como forma de assegurar a integridade do patrimônio público e social.", "ref": "Art. 1º, caput"}, {"t": "Ementa: sanções por improbidade do § 4º do art. 37 da CF", "tipo": "conceito", "ref": "Ementa"}, {"t": "Bens violados: probidade e integridade do patrimônio público e social", "tipo": "conceito", "d": "Dos Poderes Executivo, Legislativo e Judiciário, administração direta e indireta, na União, Estados, Municípios e DF.", "ref": "Art. 1º, § 5º"}]}, {"t": "Conceito de ato de improbidade e dolo", "tipo": "topico", "filhos": [{"t": "Atos de improbidade = condutas dolosas tipificadas nos arts. 9º, 10 e 11", "tipo": "conceito", "d": "Ressalvados tipos previstos em leis especiais.", "ref": "Art. 1º, § 1º"}, {"t": "Dolo: vontade livre e consciente de alcançar o resultado ilícito tipificado", "tipo": "conceito", "ref": "Art. 1º, § 2º", "filhos": [{"t": "Não basta a voluntariedade do agente", "tipo": "atencao", "ref": "Art. 1º, § 2º"}, {"t": "Não existe mais improbidade culposa (nem no art. 10)", "tipo": "atencao", "ref": "Arts. 1º, § 1º, e 10, caput"}]}, {"t": "Mero exercício da função, sem ato doloso com fim ilícito, afasta a responsabilidade", "tipo": "excecao", "ref": "Art. 1º, § 3º"}, {"t": "Aplicam-se os princípios constitucionais do direito administrativo sancionador", "tipo": "regra", "ref": "Art. 1º, § 4º"}, {"t": "Divergência interpretativa da lei baseada em jurisprudência não é improbidade", "tipo": "excecao", "d": "Ainda que a jurisprudência não seja pacificada e mesmo que não venha a prevalecer depois nos órgãos de controle ou tribunais.", "ref": "Art. 1º, § 8º", "filhos": [{"t": "PDF remete às ADIs 7236 e 7156 neste parágrafo", "tipo": "atencao", "d": "Dispositivo questionado no STF; conferir situação atual.", "ref": "Art. 1º, § 8º"}, {"t": "STF (ADIs 7156/7236, 2026): mantido, com condição", "tipo": "atencao", "d": "Só afasta a improbidade se a interpretação se apoiar em entendimento do STF, de tribunais superiores ou, na falta deles, de decisões colegiadas de 2ª instância. Fonte: notícias oficiais do STF; acórdão não conferido.", "ext": true, "ref": "Art. 1º, § 8º"}]}]}, {"t": "Sujeito passivo (entidades protegidas)", "tipo": "topico", "filhos": [{"t": "Poderes e administração direta e indireta de todos os entes", "tipo": "competencia", "ref": "Art. 1º, § 5º"}, {"t": "Entidade privada que receba subvenção, benefício ou incentivo fiscal/creditício", "tipo": "competencia", "d": "De entes públicos ou governamentais.", "ref": "Art. 1º, § 6º"}, {"t": "Entidade privada para cuja criação ou custeio o erário concorra", "tipo": "competencia", "d": "Independentemente de integrar a administração indireta.", "ref": "Art. 1º, § 7º", "filhos": [{"t": "Ressarcimento limitado à repercussão do ilícito sobre a contribuição dos cofres públicos", "tipo": "excecao", "ref": "Art. 1º, § 7º"}]}, {"t": "Parágrafo único do art. 1º: revogado (não há mais o corte de 50%)", "tipo": "atencao", "ref": "Art. 1º, parágrafo único"}]}, {"t": "Sujeito ativo", "tipo": "topico", "filhos": [{"t": "Agente público: agente político, servidor e todo aquele que exerce mandato, cargo, emprego ou função", "tipo": "competencia", "d": "Ainda que transitoriamente ou sem remuneração, por eleição, nomeação, designação, contratação ou qualquer forma de investidura ou vínculo, nas entidades do art. 1º.", "ref": "Art. 2º, caput"}, {"t": "Particular (PF ou PJ) que celebra convênio, contrato de repasse/gestão, termo de parceria/cooperação", "tipo": "competencia", "d": "Sujeita-se às sanções no que se refere a recursos de origem pública (ou ajuste administrativo equivalente).", "ref": "Art. 2º, parágrafo único"}, {"t": "Terceiro não agente que induza ou concorra DOLOSAMENTE", "tipo": "competencia", "d": "Aplica-se a lei no que couber. A redação atual retirou a mera hipótese de 'se beneficiar'.", "ref": "Art. 3º, caput"}, {"t": "Sócios, cotistas, diretores e colaboradores de PJ não respondem pelo ato imputado à PJ", "tipo": "excecao", "ref": "Art. 3º, § 1º", "filhos": [{"t": "Salvo participação e benefícios diretos comprovados – nos limites da participação", "tipo": "excecao", "ref": "Art. 3º, § 1º"}, {"t": "STF (ADIs 7156/7236, 2026): exigência de benefícios 'diretos' é inconstitucional", "tipo": "atencao", "d": "Sócios, cotistas, diretores e colaboradores podem responder com prova de participação ativa e dolo. Fonte: notícias oficiais do STF; acórdão não conferido.", "ext": true, "ref": "Art. 3º, § 1º"}]}, {"t": "PJ não sofre sanções da LIA se o ato também for sancionado pela Lei 12.846/2013 (Anticorrupção)", "tipo": "excecao", "ref": "Art. 3º, § 2º"}]}, {"t": "Representação ao MP", "tipo": "topico", "filhos": [{"t": "Havendo indícios, a autoridade que conhecer dos fatos representará ao MP competente", "tipo": "regra", "ref": "Art. 7º"}, {"t": "Arts. 4º, 5º e 6º revogados pela Lei 14.230/2021", "tipo": "atencao", "ref": "Arts. 4º a 6º"}]}, {"t": "Responsabilidade sucessória", "tipo": "topico", "filhos": [{"t": "Sucessor ou herdeiro: APENAS obrigação de reparar o dano até o limite da herança ou do patrimônio transferido", "tipo": "sancao", "ref": "Art. 8º"}, {"t": "Aplica-se também a alteração contratual, transformação, incorporação, fusão ou cisão societária", "tipo": "regra", "ref": "Art. 8º-A"}, {"t": "Fusão e incorporação: sucessora só repara o dano integral até o patrimônio transferido", "tipo": "excecao", "d": "Não se aplicam as demais sanções por atos anteriores à fusão/incorporação.", "ref": "Art. 8º-A, parágrafo único", "filhos": [{"t": "Exceto simulação ou evidente intuito de fraude, devidamente comprovados", "tipo": "excecao", "ref": "Art. 8º-A, parágrafo único"}]}]}]}}, {"id": "art9", "titulo": "Cap. II, Seção I – Enriquecimento ilícito (art. 9º)", "raiz": {"t": "Atos que importam enriquecimento ilícito", "tipo": "topico", "ref": "Art. 9º", "filhos": [{"t": "Conceito", "tipo": "conceito", "d": "Auferir, mediante a prática de ato doloso, qualquer tipo de vantagem patrimonial indevida em razão do exercício de cargo, mandato, função, emprego ou atividade nas entidades do art. 1º.", "ref": "Art. 9º, caput", "filhos": [{"t": "Rol exemplificativo ('e notadamente')", "tipo": "atencao", "ref": "Art. 9º, caput"}, {"t": "Exige dolo e vantagem patrimonial indevida do agente", "tipo": "atencao", "ref": "Art. 9º, caput"}]}, {"t": "Condutas típicas (incisos I–XII)", "tipo": "classificacao", "filhos": [{"t": "I – receber vantagem (comissão, percentagem, gratificação, presente) de interessado", "tipo": "exemplo", "d": "Dinheiro, bem móvel/imóvel ou vantagem econômica, para si ou outrem, de quem tenha interesse atingível por ação/omissão do agente.", "ref": "Art. 9º, I"}, {"t": "II – vantagem para facilitar aquisição/permuta/locação ou contratação por preço SUPERIOR ao de mercado", "tipo": "exemplo", "ref": "Art. 9º, II"}, {"t": "III – vantagem para facilitar alienação/permuta/locação de bem público ou serviço estatal por preço INFERIOR ao de mercado", "tipo": "exemplo", "ref": "Art. 9º, III"}, {"t": "IV – utilizar em obra ou serviço particular bem móvel público ou trabalho de servidores/empregados/terceirizados", "tipo": "exemplo", "ref": "Art. 9º, IV"}, {"t": "V – vantagem para tolerar jogos de azar, lenocínio, narcotráfico, contrabando, usura ou outra atividade ilícita", "tipo": "exemplo", "d": "Inclui aceitar promessa de tal vantagem.", "ref": "Art. 9º, V"}, {"t": "VI – vantagem para declaração falsa sobre dado técnico de obra/serviço ou sobre mercadorias e bens fornecidos", "tipo": "exemplo", "d": "Quantidade, peso, medida, qualidade ou característica.", "ref": "Art. 9º, VI"}, {"t": "VII – adquirir bens desproporcionais à evolução do patrimônio ou à renda", "tipo": "exemplo", "d": "No exercício e em razão do mandato/cargo/emprego/função, bens decorrentes dos atos do caput.", "ref": "Art. 9º, VII", "filhos": [{"t": "Assegurada ao agente a demonstração da licitude da origem da evolução", "tipo": "atencao", "ref": "Art. 9º, VII"}]}, {"t": "VIII – aceitar emprego, comissão ou consultoria para quem tenha interesse atingível, durante a atividade", "tipo": "exemplo", "ref": "Art. 9º, VIII"}, {"t": "IX – vantagem para intermediar liberação ou aplicação de verba pública", "tipo": "exemplo", "ref": "Art. 9º, IX"}, {"t": "X – vantagem para omitir ato de ofício, providência ou declaração obrigatória", "tipo": "exemplo", "ref": "Art. 9º, X"}, {"t": "XI – incorporar ao seu patrimônio bens, rendas, verbas ou valores públicos", "tipo": "exemplo", "ref": "Art. 9º, XI"}, {"t": "XII – usar em proveito próprio bens, rendas, verbas ou valores públicos", "tipo": "exemplo", "ref": "Art. 9º, XII"}]}, {"t": "Comparar com o art. 10", "tipo": "atencao", "d": "Art. 9º: o AGENTE enriquece (recebe/usa/incorpora). Art. 10: o agente PERMITE/FACILITA que terceiro se beneficie, causando perda ao erário (ex.: art. 9º, XI 'incorporar' × art. 10, I 'facilitar a incorporação').", "ref": "Arts. 9º, XI e 10, I"}]}}, {"id": "art10", "titulo": "Cap. II, Seção II – Prejuízo ao erário (art. 10)", "raiz": {"t": "Atos que causam prejuízo ao erário", "tipo": "topico", "ref": "Art. 10", "filhos": [{"t": "Conceito", "tipo": "conceito", "d": "Qualquer ação ou omissão DOLOSA que enseje, efetiva e comprovadamente, perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação dos bens ou haveres das entidades do art. 1º.", "ref": "Art. 10, caput", "filhos": [{"t": "Modalidade culposa foi excluída pela Lei 14.230/2021", "tipo": "atencao", "ref": "Art. 10, caput"}, {"t": "Dano deve ser efetivo e comprovado", "tipo": "atencao", "ref": "Art. 10, caput; art. 21, I"}, {"t": "Rol exemplificativo ('e notadamente')", "tipo": "atencao", "ref": "Art. 10, caput"}]}, {"t": "Condutas sobre o patrimônio público", "tipo": "classificacao", "filhos": [{"t": "I – facilitar ou concorrer para a indevida incorporação ao patrimônio particular de bens/valores públicos", "tipo": "exemplo", "ref": "Art. 10, I"}, {"t": "II – permitir ou concorrer para que particular utilize bens/valores públicos sem formalidades", "tipo": "exemplo", "ref": "Art. 10, II"}, {"t": "III – doar bens/valores públicos sem formalidades legais, ainda que para fins educativos ou assistenciais", "tipo": "exemplo", "d": "A PF, PJ ou ente despersonalizado.", "ref": "Art. 10, III"}, {"t": "IV – permitir ou facilitar alienação/permuta/locação ou prestação de serviço por preço INFERIOR ao de mercado", "tipo": "exemplo", "ref": "Art. 10, IV"}, {"t": "V – permitir ou facilitar aquisição/permuta/locação de bem ou serviço por preço SUPERIOR ao de mercado", "tipo": "exemplo", "ref": "Art. 10, V"}, {"t": "XII – permitir, facilitar ou concorrer para que terceiro se enriqueça ilicitamente", "tipo": "exemplo", "ref": "Art. 10, XII"}, {"t": "XIII – permitir uso em obra/serviço particular de veículos, máquinas, material ou trabalho de servidores", "tipo": "exemplo", "ref": "Art. 10, XIII"}]}, {"t": "Condutas financeiras, fiscais e orçamentárias", "tipo": "classificacao", "filhos": [{"t": "VI – operação financeira sem observância das normas ou aceitar garantia insuficiente/inidônea", "tipo": "exemplo", "ref": "Art. 10, VI"}, {"t": "VII – conceder benefício administrativo ou fiscal sem formalidades", "tipo": "exemplo", "ref": "Art. 10, VII"}, {"t": "IX – ordenar ou permitir despesas não autorizadas em lei ou regulamento", "tipo": "exemplo", "ref": "Art. 10, IX"}, {"t": "X – agir ilicitamente na arrecadação de tributo ou renda ou na conservação do patrimônio", "tipo": "exemplo", "d": "A redação anterior falava em 'negligentemente'; hoje é 'ilicitamente'.", "ref": "Art. 10, X"}, {"t": "XI – liberar verba pública sem estrita observância das normas ou influir para aplicação irregular", "tipo": "exemplo", "ref": "Art. 10, XI"}, {"t": "XXII – conceder, aplicar ou manter benefício financeiro/tributário contrário ao art. 8º-A da LC 116/2003 (ISS)", "tipo": "exemplo", "d": "Antes era o art. 10-A (Seção II-A), revogado; a conduta migrou para o art. 10.", "ref": "Art. 10, XXII; art. 10-A (revogado)"}]}, {"t": "Licitações, consórcios e parcerias", "tipo": "classificacao", "filhos": [{"t": "VIII – frustrar a licitude de licitação ou processo seletivo de parcerias, ou dispensá-los indevidamente", "tipo": "exemplo", "d": "Exige que acarrete perda patrimonial efetiva.", "ref": "Art. 10, VIII"}, {"t": "XIV – celebrar contrato de gestão associada de serviços públicos sem formalidades legais", "tipo": "exemplo", "ref": "Art. 10, XIV"}, {"t": "XV – celebrar contrato de rateio de consórcio público sem dotação orçamentária suficiente e prévia", "tipo": "exemplo", "d": "Ou sem observar as formalidades legais.", "ref": "Art. 10, XV"}, {"t": "XVI – facilitar incorporação ao patrimônio particular de recursos transferidos a entidades privadas por parceria", "tipo": "exemplo", "ref": "Art. 10, XVI"}, {"t": "XVII – permitir que particular utilize recursos públicos transferidos por parceria sem formalidades", "tipo": "exemplo", "ref": "Art. 10, XVII"}, {"t": "XVIII – celebrar parcerias com entidades privadas sem formalidades legais", "tipo": "exemplo", "ref": "Art. 10, XVIII"}, {"t": "XIX – agir para a configuração de ilícito na celebração, fiscalização e análise de contas de parcerias", "tipo": "exemplo", "ref": "Art. 10, XIX"}, {"t": "XX – liberar recursos de parcerias sem estrita observância das normas ou influir na aplicação irregular", "tipo": "exemplo", "ref": "Art. 10, XX"}, {"t": "XXI – revogado", "tipo": "atencao", "ref": "Art. 10, XXI"}]}, {"t": "Limites", "tipo": "topico", "filhos": [{"t": "Inobservância de formalidades sem perda patrimonial efetiva: sem ressarcimento", "tipo": "excecao", "d": "Vedado o enriquecimento sem causa das entidades do art. 1º.", "ref": "Art. 10, § 1º"}, {"t": "Mera perda patrimonial decorrente da atividade econômica não é improbidade", "tipo": "excecao", "d": "Salvo ato doloso comprovado praticado com essa finalidade.", "ref": "Art. 10, § 2º"}]}]}}, {"id": "art11", "titulo": "Cap. II, Seção III – Atentado aos princípios (art. 11)", "raiz": {"t": "Atos que atentam contra os princípios da administração", "tipo": "topico", "ref": "Art. 11", "filhos": [{"t": "Conceito", "tipo": "conceito", "d": "Ação ou omissão dolosa que viole os deveres de honestidade, imparcialidade e legalidade, caracterizada por uma das condutas dos incisos.", "ref": "Art. 11, caput", "filhos": [{"t": "Rol TAXATIVO: 'caracterizada por uma das seguintes condutas'", "tipo": "atencao", "d": "Diferente dos arts. 9º e 10, que usam 'notadamente'.", "ref": "Art. 11, caput"}, {"t": "Dever de 'lealdade às instituições' saiu do caput", "tipo": "atencao", "ref": "Art. 11, caput"}]}, {"t": "Condutas vigentes", "tipo": "classificacao", "filhos": [{"t": "III – revelar segredo funcional, propiciando benefício por informação privilegiada ou pondo em risco a segurança", "tipo": "exemplo", "d": "Segurança da sociedade e do Estado.", "ref": "Art. 11, III"}, {"t": "IV – negar publicidade aos atos oficiais", "tipo": "exemplo", "ref": "Art. 11, IV", "filhos": [{"t": "Exceto se imprescindível à segurança da sociedade e do Estado ou outras hipóteses legais", "tipo": "excecao", "ref": "Art. 11, IV"}]}, {"t": "V – frustrar, em ofensa à imparcialidade, o caráter concorrencial de concurso, chamamento ou licitação", "tipo": "exemplo", "d": "Com vistas a benefício próprio, direto ou indireto, ou de terceiros.", "ref": "Art. 11, V"}, {"t": "VI – deixar de prestar contas quando obrigado, dispondo de condições, para ocultar irregularidades", "tipo": "exemplo", "ref": "Art. 11, VI"}, {"t": "VII – revelar, antes da divulgação oficial, medida política ou econômica capaz de afetar preços", "tipo": "exemplo", "ref": "Art. 11, VII"}, {"t": "VIII – descumprir normas de celebração, fiscalização e aprovação de contas de parcerias", "tipo": "exemplo", "ref": "Art. 11, VIII"}, {"t": "XI – nepotismo: nomear cônjuge, companheiro ou parente até o 3º grau", "tipo": "exemplo", "d": "Linha reta, colateral ou por afinidade, da autoridade nomeante ou de servidor da mesma PJ em cargo de direção, chefia ou assessoramento, para cargo em comissão, de confiança ou função gratificada, em qualquer Poder e ente.", "ref": "Art. 11, XI", "filhos": [{"t": "Compreende o ajuste mediante designações recíprocas (nepotismo cruzado)", "tipo": "atencao", "ref": "Art. 11, XI"}]}, {"t": "XII – publicidade com recursos do erário que promova enaltecimento e personalização do agente", "tipo": "exemplo", "d": "Ato que contrarie o § 1º do art. 37 da CF, com inequívoco enaltecimento do agente e personalização de atos, programas, obras, serviços ou campanhas.", "ref": "Art. 11, XII"}]}, {"t": "Incisos revogados", "tipo": "atencao", "d": "I (fim proibido / desvio de finalidade), II (retardar ou deixar de praticar ato de ofício), IX (acessibilidade) e X (transferência a entidade privada de saúde sem contrato) foram revogados pela Lei 14.230/2021.", "ref": "Art. 11, I, II, IX e X"}, {"t": "Requisitos adicionais", "tipo": "topico", "filhos": [{"t": "Só há improbidade se comprovado o fim de obter proveito ou benefício indevido", "tipo": "regra", "d": "Para si ou para outra pessoa ou entidade, nos termos da Convenção da ONU contra a Corrupção (Decreto 5.687/2006).", "ref": "Art. 11, § 1º", "filhos": [{"t": "Aplica-se a QUAISQUER atos de improbidade, da LIA e de leis especiais", "tipo": "atencao", "ref": "Art. 11, § 2º"}]}, {"t": "Exige demonstração objetiva da ilegalidade, com indicação das normas violadas", "tipo": "regra", "d": "Normas constitucionais, legais ou infralegais.", "ref": "Art. 11, § 3º"}, {"t": "Exige lesividade relevante ao bem jurídico tutelado", "tipo": "regra", "ref": "Art. 11, § 4º"}, {"t": "Independe de dano ao erário e de enriquecimento ilícito", "tipo": "atencao", "ref": "Art. 11, § 4º"}, {"t": "Mera nomeação ou indicação política por detentores de mandato eletivo não é improbidade", "tipo": "excecao", "d": "Necessária a aferição de dolo com finalidade ilícita.", "ref": "Art. 11, § 5º"}]}]}}, {"id": "cap3", "titulo": "Capítulo III – Das penas (art. 12)", "raiz": {"t": "Sanções da improbidade", "tipo": "topico", "ref": "Art. 12", "filhos": [{"t": "Regras gerais", "tipo": "topico", "filhos": [{"t": "Independem do ressarcimento integral do dano (se efetivo) e das sanções penais, civis e administrativas", "tipo": "regra", "ref": "Art. 12, caput"}, {"t": "Podem ser aplicadas isolada ou cumulativamente, conforme a gravidade do fato", "tipo": "regra", "ref": "Art. 12, caput"}, {"t": "Ressarcimento integral do dano não está nos incisos: consta do caput ('independentemente')", "tipo": "atencao", "ref": "Art. 12, caput"}]}, {"t": "I – Enriquecimento ilícito (art. 9º)", "tipo": "sancao", "ref": "Art. 12, I", "filhos": [{"t": "Perda dos bens ou valores acrescidos ilicitamente", "tipo": "sancao", "ref": "Art. 12, I"}, {"t": "Perda da função pública", "tipo": "sancao", "ref": "Art. 12, I"}, {"t": "Suspensão dos direitos políticos até 14 anos", "tipo": "prazo", "ref": "Art. 12, I"}, {"t": "Multa civil equivalente ao valor do acréscimo patrimonial", "tipo": "prazo", "ref": "Art. 12, I"}, {"t": "Proibição de contratar/receber benefícios por prazo não superior a 14 anos", "tipo": "prazo", "d": "Direta ou indiretamente, ainda que por PJ da qual seja sócio majoritário.", "ref": "Art. 12, I"}]}, {"t": "II – Lesão ao erário (art. 10)", "tipo": "sancao", "ref": "Art. 12, II", "filhos": [{"t": "Perda dos bens acrescidos ilicitamente, se concorrer esta circunstância", "tipo": "sancao", "ref": "Art. 12, II"}, {"t": "Perda da função pública", "tipo": "sancao", "ref": "Art. 12, II"}, {"t": "Suspensão dos direitos políticos até 12 anos", "tipo": "prazo", "ref": "Art. 12, II"}, {"t": "Multa civil equivalente ao valor do dano", "tipo": "prazo", "ref": "Art. 12, II"}, {"t": "Proibição de contratar/receber benefícios por prazo não superior a 12 anos", "tipo": "prazo", "ref": "Art. 12, II"}]}, {"t": "III – Atentado aos princípios (art. 11)", "tipo": "sanc  "Outras disposições (arts. 23-A a 23-C)", "tipo": "topico", "filhos": [{"t": "Dever do poder público: capacitação contínua dos agentes em prevenção/repressão", "tipo": "regra", "ref": "Art. 23-A"}, {"t": "Sem adiantamento de custas, preparo, emolumentos, honorários periciais e outras despesas", "tipo": "regra", "d": "Nas ações e nos acordos regidos pela lei.", "ref": "Art. 23-B, caput", "filhos": [{"t": "Procedência: custas e despesas pagas ao final", "tipo": "regra", "ref": "Art. 23-B, § 1º"}, {"t": "Improcedência: honorários sucumbenciais só se comprovada má-fé", "tipo": "excecao", "ref": "Art. 23-B, § 2º"}]}, {"t": "Atos com recursos de partidos políticos ou suas fundações: Lei 9.096/1995", "tipo": "excecao", "d": "Enriquecimento ilícito, perda patrimonial, desvio etc. PDF remete às ADIs 7236 e 7156.", "ref": "Art. 23-C"}, {"t": "STF (ADIs 7156/7236, 2026): Lei 9.096 não exclui a LIA; as duas se aplicam", "tipo": "atencao", "d": "Fonte: notícias oficiais do STF; acórdão não conferido.", "ext": true, "ref": "Art. 23-C"}]}, {"t": "Disposições finais", "tipo": "topico", "filhos": [{"t": "Vigência na data da publicação", "tipo": "regra", "ref": "Art. 24"}, {"t": "Revoga as Leis 3.164/1957 e 3.502/1958", "tipo": "regra", "ref": "Art. 25"}]}]}}], "comparacoes": [{"titulo": "Espécies de improbidade e sanções (art. 12, redação da Lei 14.230/2021)", "colunas": ["Aspecto", "Art. 9º – Enriquecimento ilícito", "Art. 10 – Lesão ao erário", "Art. 11 – Princípios"], "linhas": [["Elemento subjetivo", "Dolo", "Dolo (culpa excluída)", "Dolo + fim de proveito indevido (§ 1º)"], ["Natureza do rol", "Exemplificativo ('notadamente')", "Exemplificativo ('notadamente')", "Taxativo ('caracterizada por uma das seguintes condutas')"], ["Dano/enriquecimento", "Vantagem patrimonial indevida do agente", "Perda patrimonial efetiva e comprovada", "Independe de dano e enriquecimento; exige lesividade relevante"], ["Perda de bens acrescidos", "Sim", "Sim, se concorrer a circunstância", "Não prevista"], ["Perda da função", "Sim (pode estender a outros vínculos, excepcionalmente; ver alerta do STF)", "Sim (só o vínculo da mesma natureza; ver alerta do STF)", "Não"], ["Suspensão dos direitos políticos", "Até 14 anos", "Até 12 anos", "Não"], ["Multa civil", "Equivalente ao acréscimo patrimonial", "Equivalente ao dano", "Até 24x a remuneração"], ["Proibição de contratar/receber benefícios", "Não superior a 14 anos", "Não superior a 12 anos", "Não superior a 4 anos"]]}, {"titulo": "Art. 9º × Art. 10 – condutas parecidas", "colunas": ["Tema", "Art. 9º (o agente se enriquece)", "Art. 10 (permite/facilita, causando prejuízo)"], "linhas": [["Incorporação de bens públicos", "XI – incorporar ao SEU patrimônio", "I – facilitar/concorrer para incorporação ao patrimônio particular"], ["Uso de bens públicos", "XII – usar em proveito próprio; IV – usar em obra/serviço particular", "II – permitir uso por particular; XIII – permitir uso em obra/serviço particular"], ["Preço superior ao de mercado", "II – perceber vantagem para facilitar contratação acima do mercado", "V – permitir ou facilitar aquisição acima do mercado"], ["Preço inferior ao de mercado", "III – perceber vantagem para facilitar alienação abaixo do mercado", "IV – permitir ou facilitar alienação abaixo do mercado"], ["Enriquecimento de terceiro", "—", "XII – permitir, facilitar ou concorrer para que terceiro se enriqueça"]]}, {"titulo": "Marcos temporais da LIA", "colunas": ["Instituto", "Prazo/limite", "Base legal"], "linhas": [["Prescrição da ação", "8 anos do fato (ou da cessação da permanência)", "Art. 23"], ["Prescrição após interrupção / intercorrente", "Metade: 4 anos (texto da lei; ver alerta do STF)", "Art. 23, §§ 5º e 8º"], ["Suspensão por inquérito civil/PAD", "Máximo 180 dias corridos", "Art. 23, § 1º"], ["Conclusão do inquérito civil", "365 dias, prorrogável 1x", "Art. 23, § 2º"], ["Ajuizamento após fim do inquérito", "30 dias", "Art. 23, § 3º"], ["Contestação", "30 dias (prazo comum)", "Art. 17, § 7º"], ["Interrupção do prazo de contestação para acordo", "Até 90 dias", "Art. 17, § 10-A"], ["Oitiva do réu na indisponibilidade", "5 dias", "Art. 16, § 3º"], ["Afastamento cautelar", "Até 90 dias, prorrogável 1x", "Art. 20, § 2º"], ["Aprovação do ANPC pelo órgão do MP", "Até 60 dias", "Art. 17-B, § 1º, II"], ["Manifestação do Tribunal de Contas no ANPC", "90 dias", "Art. 17-B, § 3º"], ["Impedimento de novo ANPC", "5 anos", "Art. 17-B, § 7º"], ["Inércia da PJ para liquidar", "6 meses do trânsito", "Art. 18, § 2º"], ["Parcelamento do débito", "Até 48 parcelas mensais", "Art. 18, § 4º"], ["Limite da unificação de sanções", "20 anos", "Art. 18-A, parágrafo único"], ["Valor impenhorável na indisponibilidade", "Até 40 salários mínimos", "Art. 16, § 13"], ["Crime do art. 19", "Detenção de 6 a 10 meses e multa", "Art. 19"]]}, {"titulo": "Ação de improbidade (art. 17-D) × Ação civil pública (Lei 7.347/85)", "colunas": ["Aspecto", "Ação de improbidade", "Ação civil pública"], "linhas": [["Natureza", "Repressiva, sancionatória, sanções de caráter pessoal; não é ação civil", "Tutela de interesses difusos, coletivos, controle de políticas públicas"], ["Objeto vedado / próprio", "Vedada para controle de políticas públicas e proteção de interesses difusos", "Meio ambiente, consumidor, patrimônio público e social, ordem urbanística etc."], ["Conversão", "Pode ser convertida em ACP (art. 17, § 16), com agravo de instrumento (§ 17)", "—"]]}], "pegadinhas": [{"texto": "Não existe mais ato de improbidade culposo, nem no art. 10: todas as espécies exigem dolo.", "ref": "Art. 1º, § 1º; art. 10, caput"}, {"texto": "Voluntariedade não basta: dolo é a vontade livre e consciente de alcançar o resultado ilícito.", "ref": "Art. 1º, § 2º"}, {"texto": "O rol do art. 11 é taxativo ('caracterizada por uma das seguintes condutas'); os dos arts. 9º e 10 são exemplificativos ('notadamente').", "ref": "Arts. 9º, 10 e 11"}, {"texto": "No art. 11 não há perda da função nem suspensão dos direitos políticos: só multa (até 24x a remuneração) e proibição de contratar (até 4 anos).", "ref": "Art. 12, III"}, {"texto": "As suspensões de direitos políticos não têm mais piso: são 'até 14' (art. 9º) e 'até 12' anos (art. 10).", "ref": "Art. 12, I e II"}, {"texto": "Multa do art. 9º é equivalente ao acréscimo patrimonial (não 'até 3 vezes'); a do art. 10 é equivalente ao dano (não 'até 2 vezes').", "ref": "Art. 12, I e II"}, {"texto": "A multa pode ser aumentada até o DOBRO (não o triplo) se ineficaz pela situação econômica do réu.", "ref": "Art. 12, § 2º"}, {"texto": "A indisponibilidade de bens NÃO recai sobre a multa civil, apenas sobre o integral ressarcimento do dano.", "ref": "Art. 16, § 10"}, {"texto": "A interrupção da prescrição faz o prazo recomeçar pela METADE (4 anos), não pelo prazo integral (texto da lei no PDF; ver alerta do STF no mapa).", "ref": "Art. 23, § 5º"}, {"texto": "A suspensão por inquérito civil ou processo administrativo é de no máximo 180 dias corridos, não 365.", "ref": "Art. 23, § 1º"}, {"texto": "O inquérito civil dura 365 dias, prorrogável UMA única vez por igual período.", "ref": "Art. 23, § 2º"}, {"texto": "O afastamento cautelar é determinado pela autoridade JUDICIAL, sem prejuízo da remuneração, por até 90 dias prorrogáveis uma vez.", "ref": "Art. 20, §§ 1º e 2º"}, {"texto": "No ANPC, a aprovação pelo órgão do MP em 60 dias só é exigida se o acordo for anterior ao ajuizamento; a homologação judicial é sempre exigida.", "ref": "Art. 17-B, § 1º, II e III"}, {"texto": "Descumprido o ANPC, o impedimento de novo acordo é de 5 anos, contados do conhecimento do descumprimento pelo MP (não da celebração).", "ref": "Art. 17-B, § 7º"}, {"texto": "O ANPC pode ser celebrado até na execução da sentença condenatória.", "ref": "Art. 17-B, § 4º"}, {"texto": "Não há remessa necessária nem reexame obrigatório na ação de improbidade.", "ref": "Art. 17-C, § 3º; art. 17, § 19, IV"}, {"texto": "Revelia não gera presunção de veracidade na ação de improbidade.", "ref": "Art. 17, § 19, I"}, {"texto": "Para cada ato deve ser indicado apenas um tipo (art. 9º, 10 ou 11); condenação por tipo diverso do da inicial é nula.", "ref": "Art. 17, §§ 10-D e 10-F, I"}, {"texto": "Sucessor ou herdeiro responde APENAS pela reparação do dano, até o limite da herança ou do patrimônio transferido – não pela multa.", "ref": "Art. 8º"}, {"texto": "Litisconsortes condenados respondem no limite da participação e benefícios: é vedada a solidariedade (texto da lei no PDF; ver alerta do STF no mapa).", "ref": "Art. 17-C, § 2º"}, {"texto": "A aplicação das sanções independe da efetiva ocorrência de dano, SALVO quanto ao ressarcimento e às condutas do art. 10.", "ref": "Art. 21, I"}, {"texto": "A pena do art. 13, § 3º (recusa ou falsidade na declaração de bens) é demissão.", "ref": "Art. 13, § 3º"}, {"texto": "O bem de família pode ser tornado indisponível se for fruto de vantagem indevida do art. 9º (não do art. 10).", "ref": "Art. 16, § 14"}, {"texto": "Honorários sucumbenciais na improcedência só se comprovada má-fé do autor.", "ref": "Art. 23-B, § 2º"}], "erros_frequentes": [{"texto": "Usar as penas antigas do art. 12 (8 a 10 anos, 5 a 8, 3 a 5; multa de 3x, 2x, 100x). Vigentes: até 14 / até 12 anos / multa até 24x e proibição até 4 anos.", "ref": "Art. 12"}, {"texto": "Citar o prazo prescricional antigo (5 anos após o mandato). Vigente: 8 anos do fato.", "ref": "Art. 23"}, {"texto": "Considerar 'retardar ou deixar de praticar ato de ofício' (antigo art. 11, II) ou o desvio de finalidade (antigo I) como improbidade do art. 11: foram revogados.", "ref": "Art. 11, I e II"}, {"texto": "Afirmar que é vedado acordo na ação de improbidade: a vedação foi substituída pelo ANPC.", "ref": "Arts. 17-B e 17, § 1º"}, {"texto": "Achar que ainda existe defesa prévia/notificação antes de receber a inicial: hoje há citação direta para contestar em 30 dias.", "ref": "Art. 17, § 7º"}, {"texto": "Supor que a sanção pode ser executada provisoriamente: só após o trânsito em julgado.", "ref": "Art. 12, § 9º; art. 20, caput"}, {"texto": "Achar que o terceiro responde por simplesmente se beneficiar do ato: hoje só responde se induzir ou concorrer dolosamente.", "ref": "Art. 3º, caput"}, {"texto": "Confundir a ação de improbidade com ação civil: o art. 17-D diz que ela é repressiva e sancionatória e não constitui ação civil.", "ref": "Art. 17-D"}], "relacoes": [{"texto": "CF, art. 37, § 4º: fundamento constitucional (suspensão dos direitos políticos, perda da função, indisponibilidade dos bens e ressarcimento ao erário, sem prejuízo da ação penal).", "ext": true}, {"texto": "Lei 12.846/2013 (Anticorrupção): PJ não sofre sanções da LIA se o ato também for sancionado por ela (art. 3º, § 2º); non bis in idem (art. 12, § 7º); CEIS (art. 12, § 8º)."}, {"texto": "CPC (Lei 13.105/2015): procedimento comum (art. 17), tutela de urgência (art. 16, § 8º), desconsideração da PJ (arts. 133–137), art. 489 na sentença (art. 17-C)."}, {"texto": "Lei 7.347/1985 (Ação Civil Pública): controle de políticas públicas e interesses difusos (art. 17-D, parágrafo único); conversão da ação de improbidade em ACP (art. 17, § 16)."}, {"texto": "Lei 8.112/1990: improbidade administrativa é causa de demissão do servidor federal (art. 132, IV), e a apuração administrativa segue o PAD (art. 14, § 3º da LIA).", "ext": true}, {"texto": "STF, Tema 1.199 (ARE 843.989, 2022): a revogação da modalidade culposa retroage apenas para atos sem trânsito em julgado; o novo regime prescricional não retroage.", "ext": true}, {"texto": "Convenção da ONU contra a Corrupção (Decreto 5.687/2006): fundamento da exigência de fim de obter proveito indevido (art. 11, § 1º)."}, {"texto": "Lei 9.096/1995: regime aplicável a atos envolvendo recursos de partidos políticos (art. 23-C)."}], "perguntas": [{"p": "O que se considera ato de improbidade após a Lei 14.230/2021?", "r": "As condutas dolosas tipificadas nos arts. 9º, 10 e 11, ressalvados tipos previstos em leis especiais.", "ref": "Art. 1º, § 1º"}, {"p": "Como a lei define dolo?", "r": "Vontade livre e consciente de alcançar o resultado ilícito tipificado nos arts. 9º, 10 e 11, não bastando a voluntariedade do agente.", "ref": "Art. 1º, § 2º"}, {"p": "Divergência interpretativa da lei configura improbidade?", "r": "Não, se baseada em jurisprudência, ainda que não pacificada e mesmo que não prevaleça depois.", "ref": "Art. 1º, § 8º"}, {"p": "Quem é agente público para a LIA?", "r": "Agente político, servidor público e todo aquele que exerce, ainda que transitoriamente ou sem remuneração, por qualquer forma de investidura ou vínculo, mandato, cargo, emprego ou função nas entidades do art. 1º.", "ref": "Art. 2º"}, {"p": "Quando o terceiro (não agente público) responde por improbidade?", "r": "Quando induzir ou concorrer dolosamente para a prática do ato, no que couber.", "ref": "Art. 3º"}, {"p": "Os sócios de uma PJ respondem pelo ato imputado à PJ?", "r": "Não, salvo se comprovada participação e benefícios diretos, respondendo nos limites da participação (texto da lei no PDF; ver alerta do STF no mapa).", "ref": "Art. 3º, § 1º"}, {"p": "Qual a responsabilidade do herdeiro do agente ímprobo?", "r": "Apenas a obrigação de reparar o dano até o limite da herança ou do patrimônio transferido.", "ref": "Art. 8º"}, {"p": "O art. 10 admite modalidade culposa?", "r": "Não. Exige ação ou omissão dolosa que enseje, efetiva e comprovadamente, perda patrimonial.", "ref": "Art. 10, caput"}, {"p": "A mera perda patrimonial decorrente da atividade econômica é improbidade?", "r": "Não, salvo se comprovado ato doloso praticado com essa finalidade.", "ref": "Art. 10, § 2º"}, {"p": "O nepotismo é improbidade? Em que artigo?", "r": "Sim, art. 11, XI: nomear cônjuge, companheiro ou parente até o 3º grau para cargo em comissão, de confiança ou função gratificada, inclusive por designações recíprocas.", "ref": "Art. 11, XI"}, {"p": "A mera nomeação política por detentor de mandato eletivo configura improbidade?", "r": "Não; é necessária a aferição de dolo com finalidade ilícita.", "ref": "Art. 11, § 5º"}, {"p": "Os atos do art. 11 exigem dano ao erário?", "r": "Não; independem de dano e de enriquecimento ilícito, mas exigem lesividade relevante ao bem jurídico tutelado.", "ref": "Art. 11, § 4º"}, {"p": "Quais as sanções para o ato do art. 9º?", "r": "Perda dos bens acrescidos, perda da função, suspensão dos direitos políticos até 14 anos, multa equivalente ao acréscimo e proibição de contratar/receber benefícios por até 14 anos.", "ref": "Art. 12, I"}, {"p": "Quais as sanções para o ato do art. 11?", "r": "Multa civil de até 24 vezes a remuneração e proibição de contratar ou receber benefícios por até 4 anos.", "ref": "Art. 12, III"}, {"p": "A perda da função pública atinge todos os vínculos do agente?", "r": "Não, só o vínculo de mesma qualidade e natureza da época da infração; no art. 9º o juiz pode, excepcionalmente, estendê-la (texto da lei no PDF; ver alerta do STF no mapa).", "ref": "Art. 12, § 1º"}, {"p": "Quando as sanções podem ser executadas?", "r": "Somente após o trânsito em julgado da sentença condenatória.", "ref": "Art. 12, § 9º"}, {"p": "Qual a consequência de recusar a declaração de bens ou prestá-la falsa?", "r": "Pena de demissão, sem prejuízo de outras sanções.", "ref": "Art. 13, § 3º"}, {"p": "Quais os requisitos para deferir a indisponibilidade de bens?", "r": "Perigo de dano irreparável ou risco ao resultado útil do processo, e probabilidade dos atos, após oitiva do réu em 5 dias (dispensável se o contraditório puder frustrar a medida) (texto da lei no PDF; ver alerta do STF no mapa).", "ref": "Art. 16, §§ 3º e 4º"}, {"p": "Qual valor é protegido da indisponibilidade?", "r": "Até 40 salários mínimos depositados em poupança, outras aplicações ou conta-corrente.", "ref": "Art. 16, § 13"}, {"p": "Quem propõe a ação de improbidade e qual o rito?", "r": "O Ministério Público, pelo procedimento comum do CPC, salvo disposições da LIA.", "ref": "Art. 17, caput"}, {"p": "Qual o prazo para contestar?", "r": "30 dias, prazo comum, contados na forma do art. 231 do CPC.", "ref": "Art. 17, § 7º"}, {"p": "Quais institutos do CPC não se aplicam à ação de improbidade?", "r": "Presunção de veracidade na revelia; imposição de ônus da prova ao réu (art. 373, §§ 1º e 2º); mais de uma ação pelo mesmo fato; reexame obrigatório.", "ref": "Art. 17, § 19"}, {"p": "Quais resultados mínimos o ANPC deve gerar?", "r": "Integral ressarcimento do dano e reversão à PJ lesada da vantagem indevida.", "ref": "Art. 17-B, I e II"}, {"p": "Quais os requisitos cumulativos do ANPC?", "r": "Oitiva do ente lesado; aprovação em até 60 dias pelo órgão do MP (se antes do ajuizamento); homologação judicial.", "ref": "Art. 17-B, § 1º"}, {"p": "Em que momentos pode ser celebrado o ANPC?", "r": "Durante a investigação, no curso da ação ou na execução da sentença condenatória.", "ref": "Art. 17-B, § 4º"}, {"p": "Qual a natureza da ação de improbidade segundo o art. 17-D?", "r": "Repressiva, sancionatória, para sanções de caráter pessoal; não constitui ação civil.", "ref": "Art. 17-D"}, {"p": "Em quantas parcelas o juiz pode autorizar o pagamento do débito?", "r": "Até 48 parcelas mensais corrigidas, se o réu demonstrar incapacidade financeira.", "ref": "Art. 18, § 4º"}, {"p": "Como funciona a unificação de sanções na continuidade de ilícito?", "r": "Aplica-se a maior sanção aumentada de 1/3 ou a soma, o que for mais benéfico; limite de 20 anos para direitos políticos e proibição de contratar.", "ref": "Art. 18-A"}, {"p": "Qual a pena do crime do art. 19?", "r": "Detenção de 6 a 10 meses e multa, para quem representa sabendo o agente inocente, além de indenização.", "ref": "Art. 19"}, {"p": "A absolvição criminal impede a ação de improbidade?", "r": "Sim, se for pelos mesmos fatos e confirmada por decisão colegiada (texto da lei no PDF; ver alerta do STF no mapa).", "ref": "Art. 21, § 4º"}, {"p": "Qual o prazo prescricional e seu termo inicial?", "r": "8 anos, da ocorrência do fato ou, em infrações permanentes, do dia em que cessou a permanência.", "ref": "Art. 23"}, {"p": "Quais são os marcos interruptivos da prescrição?", "r": "Ajuizamento; publicação da sentença condenatória; decisões de TJ/TRF, STJ e STF que confirmam condenação ou reformam improcedência.", "ref": "Art. 23, § 4º"}, {"p": "O que é a prescrição intercorrente na LIA?", "r": "Se entre os marcos interruptivos transcorrer metade do prazo (4 anos), o juiz, ouvido o MP, deve decretá-la de ofício ou a requerimento (texto da lei no PDF; ver alerta do STF no mapa).", "ref": "Art. 23, §§ 5º e 8º"}, {"p": "Há adiantamento de custas nas ações de improbidade?", "r": "Não; na procedência, custas ao final; honorários na improcedência só com má-fé comprovada.", "ref": "Art. 23-B"}], "cobertura": [{"item": "Ementa e preâmbulo", "status": "ok", "obs": ""}, {"item": "Cap. I – Disposições gerais (arts. 1º–8º-A)", "status": "ok", "obs": "Arts. 4º, 5º e 6º e parágrafos únicos dos arts. 1º e 7º revogados; mencionados como atenção."}, {"item": "Cap. II, Seção I – Enriquecimento ilícito (art. 9º)", "status": "ok", "obs": ""}, {"item": "Cap. II, Seção II – Prejuízo ao erário (art. 10)", "status": "ok", "obs": "Inciso XXI revogado."}, {"item": "Cap. II, Seção II-A – Art. 10-A", "status": "ok", "obs": "Revogado; conduta passou ao art. 10, XXII (citada)."}, {"item": "Cap. II, Seção III – Princípios (art. 11)", "status": "ok", "obs": "Incisos I, II, IX e X revogados (nó de atenção)."}, {"item": "Cap. III – Das penas (art. 12)", "status": "ok", "obs": "Usada só a redação da Lei 14.230/2021; inciso IV e parágrafo único revogados."}, {"item": "Cap. IV – Declaração de bens (art. 13)", "status": "ok", "obs": "§§ 1º e 4º revogados."}, {"item": "Cap. V – Procedimento administrativo (arts. 14–15)", "status": "ok", "obs": ""}, {"item": "Cap. V – Indisponibilidade de bens (art. 16)", "status": "ok", "obs": ""}, {"item": "Cap. V – Ação judicial (art. 17)", "status": "ok", "obs": "§§ 1º a 4º, 8º, 9º, 10, 12 e 13 revogados; art. 17-A vetado."}, {"item": "Cap. V – Acordo de não persecução civil (art. 17-B)", "status": "ok", "obs": ""}, {"item": "Cap. V – Sentença e natureza da ação (arts. 17-C e 17-D)", "status": "ok", "obs": ""}, {"item": "Cap. V – Ressarcimento e unificação (arts. 18 e 18-A)", "status": "ok", "obs": ""}, {"item": "Cap. VI – Disposições penais (arts. 19–22)", "status": "ok", "obs": ""}, {"item": "Cap. VII – Prescrição (arts. 23–23-C)", "status": "ok", "obs": "Incisos I a III do art. 23 revogados."}, {"item": "Cap. VIII – Disposições finais (arts. 24–25)", "status": "ok", "obs": ""}], "nao_verificado": ["Conferido: o arquivo txt/L8429.txt está completo (vai até o art. 25 e as assinaturas) e coincide com o pdftotext do L8429.pdf. O corte no art. 17, § 5º foi da leitura, não do arquivo. O mapa cobre do art. 1º ao 25 (arts. 5º e 6º revogados).", "O PDF remete às ADIs 7042, 7043, 7156 e 7236 sem dar o resultado. Resultados externos (ext), segundo notícias oficiais do STF: ADIs 7042/7043 (2022) – legitimidade concorrente da PJ interessada (art. 17, caput; 17-B) e defesa pela assessoria jurídica não obrigatória (art. 17, § 20); ADIs 7156/7236 (julgamento concluído em 1º/7/2026) – inconstitucionais a redução pela metade da prescrição (art. 23, § 5º; teto de 20 anos), a oitiva obrigatória do TC (17-B, § 3º), o encerramento automático por absolvição criminal (21, § 4º), a exigência de benefícios 'diretos' (3º, § 1º) e a limitação ao ente lesado (12, § 4º); perda de todas as funções como regra (12, § 1º); indisponibilidade sem prova rígida de urgência (16); solidariedade no ressarcimento (17-C, § 2º); juiz não vinculado à capitulação (17); art. 1º, § 8º mantido com condição; art. 23-C cumulativo com a Lei 9.096. O acórdão e a ata NÃO foram conferidos; o alcance exato por parágrafo (ex.: art. 12, § 10; 16, § 10; 17, §§ 10-C/10-D/10-F; reflexo no art. 23, § 8º) deve ser confirmado quando o acórdão for publicado.", "Pegadinhas, perguntas e comparações que dependem desses dispositivos mantêm o texto do PDF, com a indicação '(texto da lei no PDF; ver alerta do STF no mapa)', porque essas listas não exibem a marca ext.", "Conferido: no PDF, o art. 17, § 6º-A tem parêntese não fechado ('Código de Processo Civil (Incluído...'); erro de digitação da fonte, sem impacto."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
