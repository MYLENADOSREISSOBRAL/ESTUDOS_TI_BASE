cro), trabalhador e segurados, concursos de prognósticos e importador.", "ref": "Art. 195, I a IV"}, {"p": "Pode ser criado benefício da seguridade sem fonte de custeio?", "r": "Não; exige a correspondente fonte de custeio total.", "ref": "Art. 195, § 5º"}, {"p": "Quanto a União deve aplicar no mínimo em saúde?", "r": "15% da receita corrente líquida do exercício.", "ref": "Art. 198, § 2º, I"}, {"p": "Quais as diretrizes do SUS?", "r": "Descentralização com direção única em cada esfera; atendimento integral com prioridade preventiva; participação da comunidade.", "ref": "Art. 198, I a III"}, {"p": "Empresas estrangeiras podem participar da assistência à saúde?", "r": "É vedado, salvo nos casos previstos em lei.", "ref": "Art. 199, § 3º"}, {"p": "Quais as idades de aposentadoria da regra geral do RGPS?", "r": "65 anos (homem) e 62 anos (mulher), observado tempo mínimo de contribuição.", "ref": "Art. 201, § 7º, I"}, {"p": "E para trabalhadores rurais e regime de economia familiar?", "r": "60 anos (homem) e 55 anos (mulher), incluídos produtor rural, garimpeiro e pescador artesanal.", "ref": "Art. 201, § 7º, II"}, {"p": "Qual a redução para o professor?", "r": "5 anos sobre a idade do inciso I, com efetivo exercício na educação infantil e no ensino fundamental e médio.", "ref": "Art. 201, § 8º"}, {"p": "Em que casos LC pode prever critérios diferenciados de aposentadoria no RGPS?", "r": "Segurados com deficiência (avaliação biopsicossocial) e expostos a agentes químicos, físicos e biológicos prejudiciais à saúde.", "ref": "Art. 201, § 1º"}, {"p": "Algum benefício substitutivo do salário pode ser inferior ao salário mínimo?", "r": "Não.", "ref": "Art. 201, § 2º"}, {"p": "Qual o valor da aposentadoria do sistema especial de inclusão previdenciária?", "r": "1 salário mínimo.", "ref": "Art. 201, § 13"}, {"p": "Participante de regime próprio pode filiar-se ao RGPS como facultativo?", "r": "Não, é vedado.", "ref": "Art. 201, § 5º"}, {"p": "Qual o benefício assistencial previsto no art. 203, V?", "r": "Um salário mínimo mensal à pessoa com deficiência e ao idoso que comprovem não ter meios de se manter nem de ser mantidos pela família.", "ref": "Art. 203, V"}, {"p": "Quais os deveres do Estado com a educação quanto à faixa etária?", "r": "Educação básica obrigatória e gratuita dos 4 aos 17 anos; educação infantil (creche e pré-escola) até 5 anos.", "ref": "Art. 208, I e IV"}, {"p": "O acesso ao ensino obrigatório e gratuito é que tipo de direito?", "r": "Direito público subjetivo; o não oferecimento importa responsabilidade da autoridade competente.", "ref": "Art. 208, §§ 1º e 2º"}, {"p": "Quais as dimensões da autonomia universitária?", "r": "Didático-científica, administrativa e de gestão financeira e patrimonial; indissociabilidade entre ensino, pesquisa e extensão.", "ref": "Art. 207"}, {"p": "Quais os percentuais mínimos de MDE?", "r": "União 18%; Estados, DF e Municípios 25% da receita de impostos, incluídas transferências.", "ref": "Art. 212"}, {"p": "Recursos de MDE podem pagar aposentadorias?", "r": "Não; é vedado usar os recursos do caput e dos §§ 5º e 6º do art. 212 para aposentadorias e pensões.", "ref": "Art. 212, § 7º"}, {"p": "Como se compõe o Fundeb e qual a complementação da União?", "r": "20% de impostos e transferências listados; complementação mínima de 23% (10 VAAF + 10,5 VAAT + 2,5 resultados).", "ref": "Art. 212-A, II e V"}, {"p": "Qual a proporção mínima do Fundeb para pagamento de profissionais?", "r": "70% de cada fundo (excluída a parcela da alínea c).", "ref": "Art. 212-A, XI"}, {"p": "Qual a duração do PNE e a que deve conduzir?", "r": "Decenal; erradicação do analfabetismo, universalização, qualidade, formação para o trabalho, promoção humanística/científica/tecnológica e meta de recursos em proporção do PIB.", "ref": "Art. 214"}, {"p": "Escolas privadas podem receber recursos públicos?", "r": "Comunitárias, confessionais ou filantrópicas sem fins lucrativos que apliquem excedentes em educação e destinem o patrimônio a congênere ou ao Poder Público.", "ref": "Art. 213"}, {"p": "Quais bens a CF tombou diretamente?", "r": "Documentos e sítios detentores de reminiscências históricas dos antigos quilombos.", "ref": "Art. 216, § 5º"}, {"p": "Qual o prazo da justiça desportiva?", "r": "60 dias, contados da instauração do processo, para decisão final.", "ref": "Art. 217, § 2º"}, {"p": "Como os Estados atuam no Sistema Nacional de CT&I?", "r": "Legislam concorrentemente sobre suas peculiaridades; normas gerais por lei federal.", "ref": "Art. 219-B"}, {"p": "Quais os prazos de concessão de rádio e TV?", "r": "10 anos rádio; 15 anos televisão.", "ref": "Art. 223, § 5º"}, {"p": "Quem é responsável pela defesa do meio ambiente?", "r": "O Poder Público e a coletividade.", "ref": "Art. 225, caput"}, {"p": "Quais biomas são patrimônio nacional?", "r": "Floresta Amazônica, Mata Atlântica, Serra do Mar, Pantanal Mato-Grossense e Zona Costeira.", "ref": "Art. 225, § 4º"}, {"p": "O que é família monoparental na CF?", "r": "Comunidade formada por qualquer dos pais e seus descendentes.", "ref": "Art. 226, § 4º"}, {"p": "Até que idade há inimputabilidade penal?", "r": "São inimputáveis os menores de 18 anos.", "ref": "Art. 228"}, {"p": "Quem autoriza mineração em terras indígenas?", "r": "O Congresso Nacional, ouvidas as comunidades afetadas.", "ref": "Art. 231, § 3º"}, {"p": "Quantos deputados terá a Assembleia de novo Estado com menos de 600 mil habitantes?", "r": "17 deputados (24 se igual ou superior, até 1,5 milhão).", "ref": "Art. 235, I"}, {"p": "Como se ingressa na atividade notarial?", "r": "Por concurso público de provas e títulos.", "ref": "Art. 236, § 3º"}, {"p": "Qual o percentual mínimo do PIS/PASEP destinado ao BNDES?", "r": "28%.", "ref": "Art. 239, § 1º"}, {"p": "Quem recebe o abono do PIS/PASEP?", "r": "Empregados que recebam até 2 salários mínimos mensais de empregadores contribuintes: 1 salário mínimo anual.", "ref": "Art. 239, § 3º"}, {"p": "O que acontece com imóvel com cultivo ilegal de psicotrópicos?", "r": "Expropriação sem indenização, destinação à reforma agrária e habitação popular.", "ref": "Art. 243"}, {"p": "Como pode ocorrer a perda do cargo por insuficiência de desempenho de servidor em atividade exclusiva de Estado?", "r": "Somente mediante processo administrativo com contraditório e ampla defesa.", "ref": "Art. 247, parágrafo único"}, {"p": "Quem prestou o compromisso de cumprir a Constituição na promulgação?", "r": "O Presidente da República, o Presidente do STF e os membros do Congresso Nacional.", "ref": "Art. 1º"}, {"p": "O que o plebiscito do art. 2º decidiria?", "r": "A forma (república ou monarquia constitucional) e o sistema de governo (parlamentarismo ou presidencialismo).", "ref": "Art. 2º"}, {"p": "Qual era o quórum da revisão constitucional?", "r": "Maioria absoluta dos membros do Congresso, em sessão unicameral, após 5 anos da promulgação.", "ref": "Art. 3º"}, {"p": "Quais os requisitos da estabilidade excepcional do art. 19?", "r": "Servidor civil da administração direta, autárquica ou fundacional, em exercício em 5/10/1988 há pelo menos 5 anos continuados, admitido sem concurso.", "ref": "Art. 19"}, {"p": "A quem não se aplica o art. 19?", "r": "Aos ocupantes de cargos, funções e empregos de confiança ou em comissão, aos de livre exoneração e aos professores de nível superior.", "ref": "Art. 19, §§ 2º e 3º"}, {"p": "Qual a garantia transitória da empregada gestante?", "r": "Vedada a dispensa arbitrária ou sem justa causa desde a confirmação da gravidez até 5 meses após o parto.", "ref": "Art. 10, II, b"}, {"p": "Qual o prazo transitório da licença-paternidade?", "r": "Cinco dias, até que a lei discipline o art. 7º, XIX.", "ref": "Art. 10, § 1º"}, {"p": "Qual o prazo para os Estados elaborarem suas Constituições?", "r": "Um ano da promulgação da CF; as Leis Orgânicas municipais, 6 meses após a Constituição estadual.", "ref": "Art. 11"}, {"p": "Que Territórios foram transformados em Estados e qual foi extinto?", "r": "Roraima e Amapá viraram Estados; Fernando de Noronha foi extinto e reincorporado a Pernambuco.", "ref": "Arts. 14, 15"}, {"p": "Como foi composto inicialmente o STJ?", "r": "Pelos Ministros do TFR mais as nomeações para completar o número constitucional, indicadas em lista tríplice pelo TFR.", "ref": "Art. 27, §§ 2º e 5º"}, {"p": "O que ocorria com os decretos-leis editados até 2/9/1988 não apreciados em 180 dias?", "r": "Eram considerados rejeitados, preservada a validade dos atos praticados.", "ref": "Art. 25, § 1º"}, {"p": "Que direitos o ADCT assegura aos ex-combatentes da 2ª Guerra?", "r": "Aproveitamento no serviço público sem concurso, pensão especial de segundo-tenente, pensão a dependentes, assistência gratuita, aposentadoria integral aos 25 anos e prioridade na casa própria.", "ref": "Art. 53"}, {"p": "O que o art. 68 ADCT garante aos quilombolas?", "r": "A propriedade definitiva das terras que ocupam, com emissão dos títulos pelo Estado.", "ref": "Art. 68"}, {"p": "Qual o prazo fixado para demarcação das terras indígenas?", "r": "Cinco anos a partir da promulgação.", "ref": "Art. 67"}, {"p": "Qual o prazo para o Congresso elaborar o Código de Defesa do Consumidor?", "r": "120 dias da promulgação.", "ref": "Art. 48"}, {"p": "Qual o limite transitório de despesa com pessoal?", "r": "65% das receitas correntes, reduzindo o excesso em 1/5 por ano.", "ref": "Art. 38"}, {"p": "Qual a alíquota e duração inicial da CPMF?", "r": "Até 0,25%, cobrada por no máximo 2 anos, destinada ao Fundo Nacional de Saúde.", "ref": "Art. 74"}, {"p": "Até quando a CPMF foi prorrogada no texto e com que alíquota?", "r": "Até 31/12/2007, com alíquota de 0,38%.", "ref": "Art. 90"}, {"p": "Qual o percentual e o prazo da DRU no PDF?", "r": "30%, até 31/12/2023, para União, Estados/DF e Municípios.", "ref": "Arts. 76, 76-A, 76-B"}, {"p": "Quais os valores de RPV até a lei do ente?", "r": "40 salários mínimos (Estados e DF) e 30 salários mínimos (Municípios).", "ref": "Art. 87"}, {"p": "Até quando os entes em mora devem quitar precatórios no regime especial atual?", "r": "Até 31/12/2029, com depósitos mensais em conta do Tribunal de Justiça.", "ref": "Art. 101"}, {"p": "Qual a redução máxima nos acordos diretos de precatórios do regime especial?", "r": "40% do valor do crédito atualizado.", "ref": "Art. 102, § 1º"}, {"p": "Quando são vedadas desapropriações no regime especial?", "r": "Quando o estoque de precatórios supera 70% da RCL, salvo para saúde, educação, segurança, transporte público, saneamento e habitação de interesse social.", "ref": "Art. 103, parágrafo único"}, {"p": "Por quanto tempo vigora o Novo Regime Fiscal e como se corrige o limite?", "r": "20 exercícios; em 2017, despesa de 2016 + 7,2%; depois, limite anterior corrigido pelo IPCA.", "ref": "Arts. 106, 107, § 1º"}, {"p": "O que aciona as vedações do art. 109?", "r": "Despesa obrigatória primária acima de 95% da despesa primária total, verificada na aprovação da LOA.", "ref": "Art. 109"}, {"p": "Qual a ordem de pagamento do art. 107-A, § 8º?", "r": "RPV; alimentares de idosos, doentes graves e PcD até 3× RPV; demais alimentares até 3× RPV; alimentares acima disso; demais precatórios.", "ref": "Art. 107-A, § 8º"}, {"p": "Qual a complementação mínima da União ao Fundeb no 1º e 6º anos?", "r": "12% no 1º ano e 23% no 6º ano.", "ref": "Art. 60, I e VI"}, {"p": "Quais os mínimos de saúde de Estados e Municípios no art. 77?", "r": "12% (Estados e DF) e 15% (Municípios e DF) dos impostos e transferências indicados.", "ref": "Art. 77, II e III"}, {"p": "Qual a idade de aposentadoria compulsória do art. 100 ADCT e a quem se aplica?", "r": "75 anos, para Ministros do STF, Tribunais Superiores e TCU, até a LC do art. 40, § 1º, II.", "ref": "Art. 100"}, {"p": "Em quantas prestações podem ser parcelados os débitos previdenciários municipais dos arts. 115 e 116?", "r": "Até 240 prestações mensais, débitos vencidos até 31/10/2021, formalização até 30/6/2022.", "ref": "Arts. 115–117"}, {"p": "Que Municípios o art. 96 convalidou?", "r": "Os criados, fundidos, incorporados ou desmembrados por lei publicada até 31/12/2006, conforme a legislação estadual da época.", "ref": "Art. 96"}, {"p": "Qual o prazo para haver defensores em todas as unidades jurisdicionais?", "r": "8 anos, com prioridade para regiões de maior exclusão social e adensamento populacional.", "ref": "Art. 98"}], "cobertura": [{"item": "Preâmbulo", "status": "ok", "obs": ""}, {"item": "Título I – Princípios Fundamentais (arts. 1º–4º)", "status": "ok", "obs": ""}, {"item": "Título II, Cap. I – Art. 5º, caput e incisos I–XXI (igualdade, legalidade, liberdades, privacidade, associação)", "status": "ok", "obs": ""}, {"item": "Título II, Cap. I – Art. 5º, incisos XXII–XXXVI (propriedade, autoral/industrial, herança, consumidor, informação, petição, segurança jurídica)", "status": "ok", "obs": ""}, {"item": "Título II, Cap. I – Art. 5º, incisos XXXVII–LXVII (júri, garantias penais, penas, extradição, processo, prisão)", "status": "ok", "obs": ""}, {"item": "Título II, Cap. I – Art. 5º, incisos LXVIII–LXXIX e §§ 1º–4º (remédios, gratuidades, duração do processo, dados pessoais, tratados, TPI)", "status": "ok", "obs": ""}, {"item": "Título II, Cap. II – Direitos Sociais (arts. 6º–11)", "status": "ok", "obs": "Art. 7º, XXIX, alíneas a e b revogadas (apenas mencionadas)."}, {"item": "Título II, Cap. III – Nacionalidade (arts. 12–13)", "status": "ok", "obs": "Redação do art. 12, § 4º conforme o PDF (anterior à EC 131/2023); redação atual e novo § 5º em nó atenção ext."}, {"item": "Título II, Cap. IV – Direitos Políticos (arts. 14–16)", "status": "ok", "obs": ""}, {"item": "Título II, Cap. V – Partidos Políticos (art. 17)", "status": "ok", "obs": "PDF vai até o § 6º; §§ 7º–8º (EC 117/2022) e § 9º (EC 133/2024) não constam — resumidos em nó atenção ext."}, {"item": "Título III – Cap. I – Organização Político-Administrativa (arts. 18–19)", "status": "ok", "obs": ""}, {"item": "Cap. II – Da Un nhou §§ 7º–8º (EC 117/2022) e § 9º (EC 133/2024). Os mapas seguem o PDF; a redação atual está em nós de atenção ext.", "Conferido: a classificação doutrinária perda × suspensão (art. 15) e os mnemônicos (MP3.COM, SO-CI-DI-VA-PLU) não constam do PDF e estão marcados ext.", "Conferido: art. 39, caput – o PDF registra só a liminar da ADI 2.135; o mérito (6/11/2024, improcedência com efeitos prospectivos) está em nó ext.", "Conferido: art. 29-A, caput – o PDF traz o texto anterior e, em nota, a redação da EC 109/2021, vigente desde a legislatura iniciada em 2025 (nó ext).", "Conferido: art. 28, caput – posse em 6 de janeiro a partir das eleições de 2026 (nota do PDF, EC 111/2021).", "Conferido: art. 29-A, VI – o PDF grafa '8.000.0001' (erro tipográfico; leia-se 8.000.001, 'oito milhões e um').", "Conferido: art. 29, XIV remete ao 'art. 28, parágrafo único'; a nota do PDF manda ler '§ 1º' (EC 19/1998).", "Conferido: regras de transição da EC 103/2019 (ex.: art. 10 – 25 anos de contribuição, 10 no serviço público, 5 no cargo) não estão no texto do art. 40 do PDF; só aparecem como ext.", "Conferido no Planalto (out/2026): após a EC 116/2022, alteraram este título o art. 21, XXIII, b e c (EC 118/2022), art. 31, § 1º (EC 139/2026), art. 37, XVI, b (EC 138/2025) e § 11 (EC 135/2024), art. 40, § 4º e § 5º-A (EC 140/2026) e art. 43, § 4º (EC 132/2023). Os mapas seguem o PDF; as mudanças estão em nós de atenção ext.", "Conferido no Planalto (out/2026): após a EC 116/2022 mudaram, neste título, os arts. 50 (EC 132/2023), 73, 101, 104, 107, 111-A, 115 e 123 (idade máxima 70 – EC 122/2022), 75 (EC 139/2026), 93, VIII-A/VIII-B (EC 130/2023), 96, p.ú. (EC 134/2024), 100 (EC 136/2025) e 105 (relevância no REsp – EC 125/2022; I, j – EC 132/2023). Os mapas seguem o PDF; as mudanças estão em nós de atenção ext.", "Conferido: art. 82 – nota do PDF: posse em 5 de janeiro só a partir das eleições de 2026; PR eleito em 2022 fica até 5/1/2027.", "Conferido: art. 96, I, e remete ao 'art. 169, parágrafo único' com NE 'leia-se § 1º' (EC 19/1998); indicado no nó da alínea e.", "Art. 100, §§ 10 e 12: o PDF só traz a NE 'ver ADIs 4.425 e 4.357' (STF declarou inconstitucionais trechos do regime da EC 62/2009); o alcance atual dessas decisões não foi detalhado nos mapas.", "Conferido: art. 135 remete às 'Seções II e III deste Capítulo', que no PDF são Advocacia Pública e Advocacia (a Defensoria é a Seção IV).", "PDF compilado até a EC 116/2022. Conferido no Planalto (out/2026) que, nesta parte, houve alterações posteriores: Reforma Tributária (EC 132/2023) nos arts. 145–162 (IBS, CBS, Imposto Seletivo, arts. 149-B, 149-C, 156-A, 156-B, 159-A etc.) e no art. 167; art. 155 (ITCMD, EC 126/2022; IPVA, EC 137/2025); art. 166, §§ 9º–19 (emendas individuais em 2%, EC 126/2022); art. 165, §§ 17–22 (EC 135/2024 e EC 136/2025). Há nós de atenção ext para a Reforma e para as emendas individuais; o restante do mapa segue o PDF.", "Conferido: a nota do PDF ao art. 149 remete ao art. 36, II, da EC 103/2019 sem transcrevê-lo; o conteúdo (vigência da nova redação do art. 149 nos RPPS subnacionais condicionada a lei local referendadora) foi conferido no Planalto e incluído como nó ext.", "Extração do PDF íntegra; parágrafos quebrados por paginação (ex.: art. 143, § 1º; art. 166, § 16) foram conferidos na sequência e não há lacunas detectadas.", "Conferido: o art. 201, § 7º, I não fixa o tempo mínimo de contribuição; a regra de transição (15 anos mulher / 20 anos homem) está no art. 19 da EC 103/2019, fora do PDF – incluída como nó ext.", "Conferido: os 14 anos do art. 227, § 3º, I devem ser lidos com o art. 7º, XXXIII (no PDF, Título II): abaixo de 16 anos só como aprendiz, a partir de 14 – esclarecido no nó e em pegadinha.", "Conferido: art. 246 – a nota do PDF manda ler “até a promulgação da EC nº 32/2001”; os mapas já usam essa leitura.", "PDF compilado até a EC 116/2022. Conferido no Planalto (out/2026) que esta parte foi alterada depois: art. 195, V e §§ 15–19 (CBS, EC 132/2023); art. 198, IV, §§ 4º-A, 4º-B e 7º–15 (ACS/ACE e enfermagem: EC 120/2022, 124/2022, 127/2022 e 140/2026); art. 201, § 8º-A (EC 140/2026); art. 198, § 2º, II e III, art. 212-A e art. 225, § 1º, VIII (ajustes da EC 132/2023; art. 212-A também pela EC 135/2024); art. 239 (abono PIS/Pasep, EC 135/2024). As principais têm nó de atenção ext; o restante do mapa segue o texto do PDF.", "O ADCT do PDF termina no art. 118 (compilação até a EC 116/2022). Conferido no Planalto (out/2026): hoje o ADCT vai até o art. 138 (arts. 119–138 incluídos por emendas posteriores, a partir da EC 119/2022, com destaque para a transição da Reforma Tributária nos arts. 124–133); não foram mapeados, apenas sinalizados em nó ext do mapa geral.", "Conferido: as notas do editor (NE) existem no PDF – art. 2º (EC 2/1992), art. 22 (leia-se § 1º do art. 134), art. 25 (leia-se § 3º do art. 62), art. 34 (EC 3/1993), art. 75 (ADI 2.031), art. 79 (EC 67/2010) – e os nós as refletem; o conteúdo das emendas/ADI citadas (plebiscito antecipado, § 3º do art. 75 invalidado, fundo por prazo indeterminado) foi acrescentado como ext.", "Conferido no Planalto (out/2026): DRU prorrogada até 31/12/2032 (arts. 76, 76-A e 76-B, pelas EC 135/2024, 132/2023 e 136/2025; Municípios com 50% até 2026); teto de gastos (arts. 106, 107, 109–112 e 114) revogado pela EC 126/2022 após a LC 200/2023; o art. 107-A mantém “até o fim de 2026”, com remissão à ADI 7064. Os mapas seguem o PDF, com nós de atenção ext para a redação atual. Arts. 97, 115 e 116 também foram alterados pela EC 136/2025 e arts. 80, 82, 83 e 102 pela EC 132/2023 (não detalhado).", "Conferido em fontes secundárias (atas e notícias do julgamento, não o acórdão): nas ADIs 4357 e 4425 o STF declarou inconstitucional o art. 97 do ADCT por inteiro (a EC 62/2009 só em parte), com modulação em 25/3/2015; informação externa ao PDF, marcada ext."]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {
  topico:{n:'Tópico / estrutura',s:'■',h:'Títulos, capítulos e seções da norma'},
  conceito:{n:'Conceito / princípio',s:'◆',h:'Definições, natureza jurídica, princípios'},
  regra:{n:'Regra / procedimento',s:'▸',h:'Deveres, requisitos, etapas, procedimentos'},
  classificacao:{n:'Classificação / lista',s:'☰',h:'Espécies, tipos, modalidades, enumerações'},
  prazo:{n:'Prazo / número',s:'⏱',h:'Prazos, idades, percentuais, valores, quóruns, fórmulas'},
  excecao:{n:'Exceção / vedação',s:'✖',h:'Exceções, proibições, limites, ressalvas'},
  competencia:{n:'Órgão / competência',s:'⌂',h:'Sujeitos, autoridades, órgãos, atribuições, composição'},
  sancao:{n:'Sanção / consequência',s:'⚖',h:'Penalidades, nulidades, responsabilidade'},
  exemplo:{n:'Exemplo / aplicação',s:'✎',h:'Exemplos e aplicações práticas'},
  atencao:{n:'Atenção / pegadinha',s:'⚠',h:'Alertas e pontos que caem em prova'}
};
const LS = (k,v)=>{try{ if(v===undefined) return JSON.parse(localStorage.getItem(DATA.id+':'+k)); localStorage.setItem(DATA.id+':'+k,JSON.stringify(v)); }catch(e){ return null; }};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typ = t => TYPES[t] ? t : 'regra';
const $ = (s,el=document)=>el.querySelector(s);

// theme
const root=document.documentElement;
const th=(()=>{try{return localStorage.getItem('mm-theme')}catch(e){return null}})(); if(th) root.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('mm-theme',root.dataset.theme)}catch(e){}};

$('#h-title').textContent = DATA.titulo; $('#h-sub').textContent = DATA.subtitulo||'';

// index nodes with ids
const maps = DATA.mapas||[];
maps.forEach(m=>{ (function walk(n,p,d){ n._id=p; n._d=d; (n.filhos||[]).forEach((c,i)=>walk(c,p+'.'+i,d+1)); })(m.raiz,m.id,0); });

const TABS=[['mapas','Mapas'],['legenda','Legenda'],['comparacoes','Comparações'],['pegadinhas','Pegadinhas e erros'],['perguntas','Perguntas'],['relacoes','Relações'],['cobertura','Cobertura'],['naover','Não verificado']];
const tabsEl=$('#tabs'), main=$('#main');
TABS.forEach(([k,l])=>{ if(k==='comparacoes' && !(DATA.comparacoes||[]).length) return; if(k==='relacoes' && !(DATA.relacoes||[]).length) return; const b=document.createElement('button'); b.textContent=l; b.dataset.k=k; b.onclick=()=>showTab(k); tabsEl.appendChild(b); const sec=document.createElement('section'); sec.className='tab hidden'; sec.id='tab-'+k; main.appendChild(sec); });
function showTab(k){ tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); main.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+k)); LS('tab',k); }

// ---------- MAPS ----------
const T=$('#tab-mapas');
T.innerHTML = `<div class="panel intro"><div>${esc(DATA.visao_geral||'')}</div><div class="meta">Fonte: ${esc(DATA.fonte||'')}${DATA.versao_fonte?' · '+esc(DATA.versao_fonte):''}</div></div>
<div class="chips" id="chips"></div><select class="mapsel" id="mapsel" aria-label="Escolher mapa"></select>
<div class="toolbar">
 <button class="btn" data-v="mm">Mapa</button><button class="btn" data-v="ol">Lista</button><span class="sep"></span>
 <button class="btn" data-lv="1">Nível 1</button><button class="btn" data-lv="2">Nível 2</button><button class="btn" data-lv="3">Nível 3</button><button class="btn" data-lv="99">Expandir tudo</button><span class="sep"></span>
 <input id="q" type="search" placeholder="Buscar em todos os mapas (ex.: prazo, art. 37, estabilidade)"><span class="hits" id="hits"></span>
</div>
<div class="maptitle" id="maptitle"></div><div id="view"></div>`;
let cur = LS('map'); if(!maps.find(m=>m.id===cur)) cur = maps[0] && maps[0].id;
let view = LS('view') || (innerWidth<700?'ol':'mm');
let open = new Set(); let query='';
const chips=$('#chips'), sel=$('#mapsel');
maps.forEach(m=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=m.titulo; c.onclick=()=>pick(m.id); c.dataset.id=m.id; chips.appendChild(c); const o=document.createElement('option'); o.value=m.id; o.textContent=m.titulo; sel.appendChild(o); });
sel.onchange=()=>pick(sel.value);
if(maps.length>12){ chips.style.display='none'; sel.style.display='block'; }
function setLevel(lv){ open=new Set(); const m=maps.find(x=>x.id===cur); (function w(n){ if(n._d<lv && n.filhos&&n.filhos.length){open.add(n._id); n.filhos.forEach(w);} })(m.raiz); }
function pick(id){ cur=id; LS('map',id); setLevel(view==='mm'?2:2); render(); chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); sel.value=id; const on=chips.querySelector('.chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'nearest'}); }
T.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; LS('view',view); render();});
T.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{setLevel(+b.dataset.lv); render();});
let qt; $('#q').oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>search(e.target.value.trim()),200);};

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(s){ s=esc(s); if(!query) return s; const nq=norm(query); const ns=norm(s); let out='',i=0,j; while((j=ns.indexOf(nq,i))>-1){ out+=s.slice(i,j)+'<mark>'+s.slice(j,j+nq.length)+'</mark>'; i=j+nq.length; } return out+s.slice(i); }
function nodeMatch(n){ const nq=norm(query); return norm(n.t).includes(nq)||norm(n.d).includes(nq)||norm(n.ref).includes(nq); }
function search(q){ query=q; const hits=$('#hits'); if(!q){hits.textContent=''; setLevel(2); render(); return;}
  // count per map; jump to best map if current has none
  const counts={}; maps.forEach(m=>{ let c=0; (function w(n){ if(nodeMatch(n))c++; (n.filhos||[]).forEach(w); })(m.raiz); counts[m.id]=c; });
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!counts[cur]){ const best=maps.find(m=>counts[m.id]); if(best){ cur=best.id; sel.value=cur; chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===cur)); } }
  chips.querySelectorAll('.chip').forEach(c=>{ const n=counts[c.dataset.id]; c.textContent=maps.find(m=>m.id===c.dataset.id).titulo+(n?` (${n})`:''); });
  hits.textContent = total? `${total} resultado(s); ${counts[cur]||0} neste mapa` : 'nenhum resultado';
  open=new Set(); const m=maps.find(x=>x.id===cur);
  (function w(n,anc){ if(nodeMatch(n)) anc.forEach(a=>open.add(a)); (n.filhos||[]).forEach(c=>w(c,anc.concat(n._id))); })(m.raiz,[]);
  render();
}
function inner(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length;
  return `<div class="t"><span class="sym" title="${esc(TYPES[t].n)}">${TYPES[t].s}</span>${hl(n.t)}${n.ref?`<span class="ref">${hl(n.ref)}</span>`:''}${n.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}${k&&!open.has(n._id)?`<span class="more">+${k}</span>`:''}</div>${n.d?`<div class="d">${hl(n.d)}</div>`:''}`; }
function ol(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li class="lvl${Math.min(n._d,2)}"><div class="on-row"><button class="tog ${k?'':'none'}" data-id="${n._id}" aria-label="${isOpen?'Recolher':'Expandir'}">${isOpen?'▼':'▶'}</button><div class="box" style="--c:var(--c-${t})">${inner(n)}</div></div>${k&&isOpen?`<ul class="ol">${n.filhos.map(ol).join('')}</ul>`:''}</li>`; }
function mm(n){ const t=typ(n.tipo); const k=(n.filhos||[]).length; const isOpen=open.has(n._id);
  return `<li><div class="node ${k?'has':''} ${n._d===0?'root':''}" data-id="${n._id}" style="--c:var(--c-${t})" title="${k?(isOpen?'Clique para recolher':'Clique para expandir'):''}">${inner(n)}</div>${k&&isOpen?`<ul>${n.filhos.map(mm).join('')}</ul>`:''}</li>`; }
function render(){ const m=maps.find(x=>x.id===cur); if(!m) return; $('#maptitle').textContent=m.titulo;
  T.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const v=$('#view');
  if(view==='ol'){ v.innerHTML=`<div class="panel"><ul class="ol">${ol(m.raiz)}</ul></div>`; }
  else { v.innerHTML=`<div class="mmwrap"><div class="mm"><ul>${mm(m.raiz)}</ul></div></div>`; }
}
$('#view').addEventListener('click',e=>{ const el=e.target.closest('[data-id]'); if(!el) return; if(el.classList.contains('node')&&!el.classList.contains('has')) return; const id=el.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
if(cur){ pick(cur); }

// ---------- LEGEND ----------
$('#tab-legenda').innerHTML = `<div class="panel"><h2>Cores e símbolos (categoria de cada informação)</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="leg" style="--c:var(--c-${k})"><div class="sw">${v.s}</div><div><b>${v.n}</b><br><small>${v.h}</small></div></div>`).join('')}</div></div>
<div class="panel"><h2>Outros marcadores</h2><div class="grid">
<div class="leg"><span class="ref" style="margin:0">Art. 5º, II</span><div><small>Dispositivo exato da norma de onde a informação foi extraída.</small></div></div>
<div class="leg"><span class="ext" style="margin:0">✚ externo</span><div><small>Complementação que <b>não está no PDF</b> (contexto, doutrina, jurisprudência). Confira antes de usar em prova.</small></div></div>
<div class="leg"><span class="more" style="color:var(--accent);font-weight:600">+4</span><div><small>Nó recolhido; mostra quantos itens há dentro. Clique para expandir.</small></div></div>
<div class="leg"><div><small><b>Mapa geral</b> é o primeiro da lista e dá a visão do todo. Os <b>mapas complementares</b> detalham cada título ou capítulo. A busca procura em todos os mapas.</small></div></div>
</div></div>`;

// ---------- COMPARISONS ----------
if($('#tab-comparacoes')) $('#tab-comparacoes').innerHTML = (DATA.comparacoes||[]).map(c=>`<div class="panel"><h2>${esc(c.titulo)}</h2><div class="tblwrap"><table><thead><tr>${(c.colunas||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(c.linhas||[]).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');

// ---------- TRAPS ----------
const lst=(a,c)=>(a||[]).map(x=>`<div class="item" style="--c:var(--c-${c})">${esc(x.texto)}${x.ref?`<span class="ref">${esc(x.ref)}</span>`:''}${x.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}</div>`).join('');
$('#tab-pegadinhas').innerHTML = `<div class="panel"><h2>⚠ Pegadinhas comuns em prova</h2>${lst(DATA.pegadinhas,'atencao')||'<p>—</p>'}</div><div class="panel"><h2>✖ Erros frequentes</h2>${lst(DATA.erros_frequentes,'excecao')||'<p>—</p>'}</div>`;

// ---------- RELATIONS ----------
if($('#tab-relacoes')) $('#tab-relacoes').innerHTML = `<div class="panel"><h2>Relações com outros assuntos</h2>${(DATA.relacoes||[]).map(r=>`<div class="item" style="--c:var(--c-competencia)">${esc(r.texto)}${r.ext?'<span class="ext">✚ externo</span>':''}</div>`).join('')}</div>`;

// ---------- QUESTIONS ----------
const QS=DATA.perguntas||[]; let qst=LS('qs')||{};
function renderQ(){ const ok=Object.values(qst).filter(v=>v==='ok').length, bad=Object.values(qst).filter(v=>v==='bad').length;
 $('#tab-perguntas').innerHTML = `<div class="panel"><h2>Perguntas para testar a compreensão</h2><div class="score">${QS.length} perguntas · ✔ ${ok} acertos · ✖ ${bad} a revisar <button class="btn" id="qreset">Zerar</button> <button class="btn" id="qall">Mostrar todas as respostas</button></div>
 ${QS.map((q,i)=>`<div class="q ${qst[i]||''}" data-i="${i}"><div class="qrow"><div><b>${i+1}.</b> ${esc(q.p)}</div><div class="qbtns"><button class="btn" data-a="show">Resposta</button></div></div><div class="a">${esc(q.r)}${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}${q.ext?'<span class="ext" title="Complementação externa: não consta no PDF">✚ externo</span>':''}<div style="margin-top:8px"><button class="btn" data-a="ok">✔ Acertei</button> <button class="btn" data-a="bad">✖ Revisar</button></div></div></div>`).join('')}</div>`;
 $('#qreset').onclick=()=>{qst={};LS('qs',qst);renderQ();};
 $('#qall').onclick=()=>document.querySelectorAll('.q').forEach(x=>x.classList.add('open'));
}
$('#tab-perguntas').addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const q=b.closest('.q'); const i=q.dataset.i; if(b.dataset.a==='show') q.classList.toggle('open'); else { qst[i]=b.dataset.a; LS('qs',qst); q.classList.remove('ok','bad'); q.classList.add(b.dataset.a); } });
renderQ();

// ---------- COVERAGE ----------
let cov=LS('cov')||{};
const C=DATA.cobertura||[]; const nok=C.filter(c=>c.status==='ok').length;
$('#tab-cobertura').innerHTML = `<div class="panel"><h2>Lista de verificação da cobertura</h2><p class="score">${nok} de ${C.length} divisões com cobertura completa. A coluna “Estudei” é sua: marque conforme revisar (fica salva neste navegador).</p><div class="tblwrap"><table><thead><tr><th>Estudei</th><th>Divisão do documento</th><th>Status no mapa</th><th>Observação</th></tr></thead><tbody>${C.map((c,i)=>`<tr><td><input type="checkbox" data-c="${i}" ${cov[i]?'checked':''} aria-label="Estudei"></td><td>${esc(c.item)}</td><td><span class="st ${esc(c.status)}">${c.status==='ok'?'completo':c.status==='parcial'?'parcial':'não coberto'}</span></td><td>${esc(c.obs||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
$('#tab-cobertura').addEventListener('change',e=>{ const i=e.target.dataset.c; if(i==null) return; cov[i]=e.target.checked; LS('cov',cov); });

// ---------- UNVERIFIED ----------
$('#tab-naover').innerHTML = `<div class="panel"><h2>Conteúdo que não pôde ser verificado, lacunas e ambiguidades</h2>${(DATA.nao_verificado||[]).map(x=>`<div class="item" style="--c:var(--c-atencao)">${esc(x)}</div>`).join('')||'<p>—</p>'}</div>`;

showTab(LS('tab')&&document.getElementById('tab-'+LS('tab'))?LS('tab'):'mapas');
})();
</script>
</body>
</html>
