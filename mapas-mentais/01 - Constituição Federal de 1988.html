<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constituição da República Federativa do Brasil de 1988</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --soft:#eef1f5; --accent:#2f5fd0;
  --c-topico:#334155; --c-conceito:#2563eb; --c-regra:#0f8a5f; --c-classificacao:#7c3aed; --c-prazo:#c2410c;
  --c-excecao:#be123c; --c-competencia:#0e7490; --c-sancao:#9f1239; --c-exemplo:#a16207; --c-atencao:#d97706;
  --mark:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
    --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
    --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
    --mark:#7a5d00;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#1a1f28; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2e3644; --soft:#222936; --accent:#7ea2ff;
  --c-topico:#a3b1c6; --c-conceito:#7ea2ff; --c-regra:#4cc79a; --c-classificacao:#b69cff; --c-prazo:#ff9a5c;
  --c-excecao:#ff7a95; --c-competencia:#4fc3d9; --c-sancao:#ff8fae; --c-exemplo:#e8c25a; --c-atencao:#ffb547;
  --mark:#7a5d00;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.25rem;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:10px auto 0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.intro{color:var(--ink)}
.intro .meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mapsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.toolbar input{flex:1 1 200px;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.hits{color:var(--muted);font-size:.8rem}
.maptitle{font-size:1.05rem;font-weight:600;margin:4px 0 8px}
/* outline */
ul.ol{list-style:none;margin:0;padding:0}
ul.ol ul.ol{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line)}
.on-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tog{width:20px;height:20px;flex-shrink:0;border:0;background:none;cursor:pointer;color:var(--muted);padding:0;margin-top:2px;font-size:.75rem}
.tog.none{visibility:hidden}
.box{border-left:4px solid var(--c);padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--c) 8%,transparent);min-width:0;flex:1}
.lvl0>.on-row>.box{font-size:1.05rem;font-weight:700}
.lvl1>.on-row>.box{font-weight:600}
.t .sym{color:var(--c);font-weight:700;margin-right:4px}
.d{color:var(--muted);font-size:.86rem;margin-top:1px}
.ref{display:inline-block;font-size:.72rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--muted);white-space:nowrap;vertical-align:1px}
.ext{display:inline-block;font-size:.7rem;border:1px dashed var(--c-atencao);color:var(--c-atencao);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.cnt{font-size:.72rem;color:var(--muted);margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
/* mind map */
.mmwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;max-height:78vh}
.mm{display:inline-block;min-width:100%}
.mm ul{list-style:none;margin:0;padding:0 0 0 28px;position:relative}
.mm li{position:relative;display:flex;align-items:center;padding:4px 0}
.mm>ul{padding-left:0}
.mm ul ul::before{content:"";position:absolute;left:0;top:50%;width:14px;border-top:2px solid var(--line)}
.mm ul ul>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:2px solid var(--line)}
.mm ul ul>li:first-child::before{top:50%}
.mm ul ul>li:last-child::before{bottom:50%}
.mm ul ul>li:only-child::before{display:none}
.mm ul ul>li::after{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.mm .node{max-width:280px;min-width:120px;border:1.5px solid var(--c);border-radius:10px;padding:5px 9px;background:var(--panel);box-shadow:0 1px 0 var(--line);cursor:default;flex-shrink:0;font-size:.86rem}
.mm .node.has{cursor:pointer}
.mm .node.root{background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.mm .node.root .sym,.mm .node.root .ref{color:#fff}
.mm .node .d{font-size:.78rem}
.mm .node .more{font-size:.72rem;color:var(--c);font-weight:600;margin-left:4px}
.mm .kids{display:flex;flex-direction:column}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.leg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px}
.leg .sw{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:var(--c);flex-shrink:0}
.leg small{color:var(--muted)}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:8px;margin-bottom:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tblwrap{overflow-x:auto;margin-bottom:16px}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;color:#fff}
.st.ok{background:var(--c-regra)} .st.parcial{background:var(--c-atencao)} .st.nao{background:var(--c-excecao)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.q .a{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q.open .a{display:block}
.q .qrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q .qbtns{display:flex;gap:4px;flex-shrink:0}
.q.ok{border-left:4px solid var(--c-regra)} .q.bad{border-left:4px solid var(--c-excecao)}
.score{color:var(--muted);font-size:.85rem;margin-bottom:10px}
h2{font-size:1.05rem;margin:0 0 10px}
.hidden{display:none!important}
@media (max-width:700px){
  body{font-size:14px}
  .chips{display:none} .mapsel{display:block}
  h1{font-size:1.05rem}
  .mm .node{max-width:200px;min-width:90px}
  ul.ol ul.ol{margin-left:6px;padding-left:8px}
}
@media print{
  header{position:static} nav.tabs,.toolbar,.hbtns,.chips,.mapsel{display:none!important}
  .tab{display:block!important} .mmwrap{max-height:none;overflow:visible}
  .q .a{display:block!important}
}
</style>
<!-- leitura:inicio -->
<style>
#lt-btn{position:fixed;right:16px;bottom:16px;z-index:9999;width:46px;height:46px;border-radius:50%;border:1px solid var(--line,#ccc);background:var(--panel,var(--paper,#fff));color:var(--ink,#111);font:700 16px/1 system-ui,"Segoe UI",Arial,sans-serif;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#lt-btn:hover{border-color:var(--accent,#2f5fd0)}
#lt-pn{position:fixed;right:16px;bottom:72px;z-index:9999;width:min(330px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--panel,var(--paper,#fff));color:var(--ink,#111);border:1px solid var(--line,#ccc);border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
#lt-pn[hidden]{display:none}
body:has(button.localizar.flutua) #lt-btn{bottom:76px}
body:has(button.localizar.flutua) #lt-pn{bottom:132px}
#lt-pn h3{margin:0 0 10px;font-size:15px}
#lt-pn h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted,#666)}
#lt-pn .lt-g{display:flex;flex-wrap:wrap;gap:6px}
#lt-pn .lt-s{width:38px;height:38px;border-radius:8px;border:1px solid rgba(128,128,128,.45);cursor:pointer;padding:0;font:700 14px/1 Georgia,serif;display:flex;align-items:center;justify-content:center}
#lt-pn .lt-s.on{outline:3px solid var(--accent,#2f5fd0);outline-offset:1px}
#lt-pn .lt-s.def{font:600 10px/1 system-ui,sans-serif;background:var(--soft,#eee);color:var(--ink,#111)}
#lt-pn label.lt-c{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted,#666)}
#lt-pn input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line,#ccc);border-radius:6px;background:none;cursor:pointer}
#lt-pn .lt-r{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
#lt-pn .lt-ct{font-size:12px;color:var(--muted,#666)}
#lt-pn .lt-ct.baixo{color:#c0392b;font-weight:600}
#lt-pn button.lt-x{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line,#ccc);background:var(--soft,#eee);color:var(--ink,#111);cursor:pointer}
@media print{#lt-btn,#lt-pn{display:none!important}}
</style>
<script>
(function(){
var KEY='mm-leitura', root=document.documentElement;
var FUNDOS=[
 ['Branco','#ffffff'],['Creme','#fbf6e9'],['Sépia','#f4ecd8'],['Papel antigo','#ece0c6'],
 ['Verde suave','#e7f0e3'],['Azul suave','#e5edf5'],['Cinza-claro','#eceff1'],['Lavanda','#efebf6'],
 ['Cinza-escuro','#2b2f36'],['Sépia escuro','#2a231b'],['Verde-noite','#1a2520'],['Noturno','#121417']];
var LETRAS=[
 ['Preto','#111111'],['Grafite','#343a44'],['Marrom','#4a3423'],['Azul-marinho','#1c2a4d'],
 ['Verde-escuro','#1f3d2b'],['Vinho','#5c1f2c'],['Branco-gelo','#eef1f5'],['Bege claro','#e9dcc0'],
 ['Âmbar','#f0c674'],['Verde-claro','#b9e0c1'],['Azul-claro','#b7cdf2']];
var VARS=['--bg','--panel','--paper','--soft','--line','--muted','--code-bg','--ink','color-scheme'];
function ler(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function salvar(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function escuro(h){return lum(h)<.18}
function contraste(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
var st=ler();
function aplicar(){
  var r=root.style; VARS.forEach(function(v){r.removeProperty(v)});
  if(st.bg){
    var d=escuro(st.bg), mx=d?'#ffffff':'#000000';
    root.dataset.theme=d?'dark':'light';
    r.setProperty('--panel',st.bg); r.setProperty('--paper',st.bg);
    r.setProperty('--bg','color-mix(in srgb,'+st.bg+' '+(d?'92%':'95%')+','+mx+')');
    r.setProperty('--soft','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--code-bg','color-mix(in srgb,'+st.bg+' '+(d?'88%':'93%')+','+mx+')');
    r.setProperty('--line','color-mix(in srgb,'+st.bg+' '+(d?'78%':'84%')+','+mx+')');
    r.setProperty('color-scheme',d?'dark':'light');
  } else {
    var th=null; try{th=localStorage.getItem('mm-theme')}catch(e){}
    if(th) root.dataset.theme=th; else delete root.dataset.theme;
  }
  if(st.ink){
    r.setProperty('--ink',st.ink);
    r.setProperty('--muted','color-mix(in srgb,'+st.ink+' 72%,var(--panel,var(--paper,#888)))');
  }
}
aplicar();
function corFundoAtual(){
  var probe=document.getElementById('lt-pn')||document.body;
  var c=getComputedStyle(probe).backgroundColor.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#ffffff';
}
function corTextoAtual(){
  var c=getComputedStyle(document.body).color.match(/\d+(\.\d+)?/g);
  return c?'#'+c.slice(0,3).map(function(v){return ('0'+Math.round(+v).toString(16)).slice(-2)}).join(''):'#111111';
}
function montar(){
  aplicar();
  var b=document.createElement('button'); b.id='lt-btn'; b.type='button'; b.title='Cores de leitura (fundo e letras)'; b.setAttribute('aria-label','Cores de leitura'); b.textContent='Aa';
  var p=document.createElement('div'); p.id='lt-pn'; p.hidden=true; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Cores de leitura');
  function grade(lista,chave,ehFundo){
    var h='<div class="lt-g"><button type="button" class="lt-s def" data-k="'+chave+'" data-v="" title="Padrão do tema">padrão</button>';
    lista.forEach(function(x){
      h+='<button type="button" class="lt-s" data-k="'+chave+'" data-v="'+x[1]+'" title="'+x[0]+'" style="'+(ehFundo?'background:'+x[1]+';color:'+(escuro(x[1])?'#eee':'#222'):'background:var(--panel,var(--paper,#fff));color:'+x[1])+'">'+(ehFundo?'':'Aa')+'</button>';
    });
    return h+'</div>';
  }
  p.innerHTML='<h3>Cores de leitura</h3>'+
   '<h4>Cor do fundo</h4>'+grade(FUNDOS,'bg',true)+
   '<label class="lt-c"><input type="color" data-k="bg"> Outra cor de fundo</label>'+
   '<h4>Cor das letras</h4>'+grade(LETRAS,'ink',false)+
   '<label class="lt-c"><input type="color" data-k="ink"> Outra cor de letra</label>'+
   '<div class="lt-r"><span class="lt-ct"></span><button type="button" class="lt-x">Restaurar padrão</button></div>';
  document.body.appendChild(p); document.body.appendChild(b);
  function sync(){
    p.querySelectorAll('.lt-s').forEach(function(s){s.classList.toggle('on',(st[s.dataset.k]||'')===s.dataset.v)});
    var bg=corFundoAtual(), ink=corTextoAtual();
    p.querySelector('input[data-k=bg]').value=st.bg||bg;
    p.querySelector('input[data-k=ink]').value=st.ink||ink;
    var c=contraste(bg,ink), el=p.querySelector('.lt-ct');
    el.textContent='Contraste '+c.toFixed(1)+':1'+(c<4.5?' (baixo para leitura)':'');
    el.classList.toggle('baixo',c<4.5);
  }
  function definir(k,v){ if(v) st[k]=v; else delete st[k]; salvar(st); aplicar(); sync(); }
  p.addEventListener('click',function(e){
    var s=e.target.closest('.lt-s'); if(s) definir(s.dataset.k,s.dataset.v);
    if(e.target.closest('.lt-x')){ st={}; salvar(st); aplicar(); sync(); }
  });
  p.addEventListener('input',function(e){ if(e.target.type==='color') definir(e.target.dataset.k,e.target.value); });
  b.addEventListener('click',function(){ p.hidden=!p.hidden; if(!p.hidden) sync(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') p.hidden=true; });
  document.addEventListener('click',function(e){ if(!p.hidden&&!p.contains(e.target)&&e.target!==b) p.hidden=true; });
  // O botão ◐ (claro/escuro) das páginas volta o fundo ao padrão do tema escolhido
  var tb=document.getElementById('themeBtn');
  if(tb) tb.addEventListener('click',function(){ if(st.bg){ delete st.bg; salvar(st); aplicar(); } });
  window.addEventListener('storage',function(e){ if(e.key===KEY){ st=ler(); aplicar(); if(!p.hidden) sync(); } });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',montar); else montar();
})();
</script>

om os meios e recursos inerentes.", "ref": "Art. 5º, LV"}, {"t": "Inadmissíveis as provas obtidas por meios ilícitos", "tipo": "excecao", "ref": "Art. 5º, LVI"}, {"t": "Presunção de inocência até o trânsito em julgado da sentença penal condenatória", "tipo": "regra", "ref": "Art. 5º, LVII"}, {"t": "Civilmente identificado não sofre identificação criminal, salvo hipóteses legais", "tipo": "excecao", "ref": "Art. 5º, LVIII"}, {"t": "Ação privada subsidiária da pública se esta não for intentada no prazo legal", "tipo": "regra", "ref": "Art. 5º, LIX"}, {"t": "Publicidade dos atos processuais: lei só restringe por intimidade ou interesse social", "tipo": "regra", "ref": "Art. 5º, LX"}]}, {"t": "Prisão e direitos do preso", "tipo": "topico", "filhos": [{"t": "Prisão só em flagrante ou por ordem escrita e fundamentada de autoridade judiciária", "tipo": "regra", "ref": "Art. 5º, LXI", "filhos": [{"t": "Salvo transgressão militar ou crime propriamente militar definidos em lei", "tipo": "excecao", "ref": "Art. 5º, LXI"}]}, {"t": "Prisão e local comunicados imediatamente ao juiz e à família ou pessoa indicada", "tipo": "regra", "ref": "Art. 5º, LXII"}, {"t": "Preso informado de seus direitos, inclusive de permanecer calado", "tipo": "regra", "d": "Assegurada a assistência da família e de advogado.", "ref": "Art. 5º, LXIII"}, {"t": "Direito à identificação dos responsáveis pela prisão ou interrogatório", "tipo": "regra", "ref": "Art. 5º, LXIV"}, {"t": "Prisão ilegal imediatamente relaxada pela autoridade judiciária", "tipo": "regra", "ref": "Art. 5º, LXV"}, {"t": "Ninguém preso quando a lei admitir liberdade provisória, com ou sem fiança", "tipo": "regra", "ref": "Art. 5º, LXVI"}, {"t": "Prisão civil por dívida: vedada", "tipo": "excecao", "ref": "Art. 5º, LXVII", "filhos": [{"t": "Texto ressalva: devedor voluntário e inescusável de alimentos e depositário infiel", "tipo": "excecao", "ref": "Art. 5º, LXVII"}, {"t": "STF (SV 25): ilícita a prisão do depositário infiel; só a do a true, "d": "Ministro do STF, Presidentes (República/Vice, Câmara, Senado), Carreira diplomática, Oficial das FA, Ministro da Defesa."}]}, {"t": "Perda da nacionalidade", "tipo": "sancao", "ref": "Art. 12, § 4º", "filhos": [{"t": "I – cancelamento da naturalização por sentença judicial", "tipo": "sancao", "d": "Em virtude de atividade nociva ao interesse nacional (só atinge naturalizado).", "ref": "Art. 12, § 4º, I"}, {"t": "II – aquisição de outra nacionalidade", "tipo": "sancao", "ref": "Art. 12, § 4º, II", "filhos": [{"t": "a) salvo reconhecimento de nacionalidade originária pela lei estrangeira", "tipo": "excecao", "ref": "Art. 12, § 4º, II, a"}, {"t": "b) salvo naturalização imposta como condição de permanência ou exercício de direitos civis", "tipo": "excecao", "ref": "Art. 12, § 4º, II, b"}]}, {"t": "Redação atual (EC 131/2023) difere do PDF", "tipo": "atencao", "d": "Texto vigente: I – cancelamento da naturalização por sentença judicial em virtude de fraude no processo de naturalização ou de atentado contra a ordem constitucional e o Estado Democrático; II – pedido expresso de perda perante autoridade brasileira competente, ressalvadas situações que acarretem apatridia (alíneas a e b revogadas). Novo § 5º: essa renúncia não impede readquirir a nacionalidade originária, nos termos da lei. Mera aquisição de outra nacionalidade não gera mais perda.", "ref": "Art. 12, §§ 4º e 5º (EC 131/2023)", "ext": true}]}, {"t": "Art. 13 – Idioma e símbolos", "tipo": "topico", "ref": "Art. 13", "filhos": [{"t": "Língua portuguesa é o idioma oficial", "tipo": "regra", "ref": "Art. 13, caput"}, {"t": "Símbolos: bandeira, hino, armas e selo nacionais", "tipo": "classificacao", "ref": "Art. 13, § 1º"}, {"t": "Estados, DF e Municípios poderão ter símbolos próprios", "tipo": "regra", "ref": "Art. 13, § 2º"}]}]}}, {"id": "cf1-direitos-politicos", "titulo": "Título II, Cap. IV – Direitos Políticos (arts. 14–16)", "raiz": {"t": "Direitos Políticos", "tipo": "topico", "ref": "Arts. 14–16", "filhos": [{"t": "Soberania popular", "tipo": "topico", "ref": "Art. 14, caput", "filhos": [{"t": "Sufrágio universal; voto direto, secreto, com valor igual para todos", "tipo": "conceito", "ref": "Art. 14, caput"}, {"t": "Instrumentos (nos termos da lei): plebiscito, referendo, iniciativa popular", "tipo": "classificacao", "ref": "Art. 14, I–III"}, {"t": "Plebiscito é prévio; referendo é posterior ao ato", "tipo": "atencao", "ext": true}]}, {"t": "Alistamento e voto (capacidade ativa)", "tipo": "topico", "ref": "Art. 14, §§ 1º–2º", "filhos": [{"t": "Obrigatórios: maiores de 18 anos", "tipo": "prazo", "ref": "Art. 14, § 1º, I"}, {"t": "Facultativos: analfabetos, maiores de 70, entre 16 e 18 anos", "tipo": "prazo", "ref": "Art. 14, § 1º, II"}, {"t": "Inalistáveis: estrangeiros e conscritos (durante o serviço militar obrigatório)", "tipo": "excecao", "ref": "Art. 14, § 2º"}]}, {"t": "Condições de elegibilidade (capacidade passiva)", "tipo": "topico", "ref": "Art. 14, § 3º", "filhos": [{"t": "Nacionalidade brasileira; pleno exercício dos direitos políticos; alistamento", "tipo": "regra", "ref": "Art. 14, § 3º, I–III"}, {"t": "Domicílio eleitoral na circunscrição; filiação partidária", "tipo": "regra", "ref": "Art. 14, § 3º, IV–V"}, {"t": "Idade mínima", "tipo": "prazo", "ref": "Art. 14, § 3º, VI", "filhos": [{"t": "35 anos: Presidente, Vice-Presidente e Senador", "tipo": "prazo", "ref": "Art. 14, § 3º, VI, a"}, {"t": "30 anos: Governador e Vice (Estados e DF)", "tipo": "prazo", "ref": "Art. 14, § 3º, VI, b"}, {"t": "21 anos: Dep. Federal, Estadual/Distrital, Prefeito, Vice-Prefeito, juiz de paz", "tipo": "prazo", "ref": "Art. 14, § 3º, VI, c"}, {"t": "18 anos: Vereador", "tipo": "prazo", "ref": "Art. 14, § 3º, VI, d"}, {"t": "Senador exige 35 (não 30); Prefeito exige 21 (não 18)", "tipo": "atencao", "ref": "Art. 14, § 3º, VI"}]}]}, {"t": "Inelegibilidades", "tipo": "topico", "ref": "Art. 14, §§ 4º–9º", "filhos": [{"t": "Absoluta: inalistáveis e analfabetos", "tipo": "excecao", "d": "Analfabeto pode votar (facultativo), mas não pode ser votado.", "ref": "Art. 14, § 4º"}, {"t": "Reeleição: chefes do Executivo para um único período subsequente", "tipo": "regra", "d": "Presidente, Governadores, Prefeitos e quem os houver sucedido ou substituído no curso do mandato.", "ref": "Art. 14, § 5º"}, {"t": "Desincompatibilização: renunciar até 6 meses antes para concorrer a outros cargos", "tipo": "prazo", "d": "Presidente, Governadores e Prefeitos.", "ref": "Art. 14, § 6º"}, {"t": "Reflexa: cônjuge e parentes até 2º grau ou por adoção do chefe do Executivo", "tipo": "excecao", "d": "No território de jurisdição do titular; inclui parentes de quem o substituiu nos 6 meses anteriores ao pleito.", "ref": "Art. 14, § 7º", "filhos": [{"t": "Salvo se já titular de mandato eletivo e candidato à reeleição", "tipo": "excecao", "ref": "Art. 14, § 7º"}]}, {"t": "Militar alistável é elegível", "tipo": "regra", "ref": "Art. 14, § 8º", "filhos": [{"t": "Menos de 10 anos de serviço: afasta-se da atividade", "tipo": "prazo", "ref": "Art. 14, § 8º, I"}, {"t": "Mais de 10 anos: agregado; se eleito, inatividade no ato da diplomação", "tipo": "prazo", "ref": "Art. 14, § 8º, II"}]}, {"t": "Lei complementar estabelece outros casos e prazos de cessação", "tipo": "regra", "d": "Para proteger probidade, moralidade (vida pregressa) e normalidade/legitimidade das eleições contra poder econômico ou abuso de função.", "ref": "Art. 14, § 9º"}, {"t": "Inelegibilidade só por CF ou LEI COMPLEMENTAR (não lei ordinária)", "tipo": "atencao", "ref": "Art. 14, § 9º"}]}, {"t": "Ação de impugnação de mandato eletivo (AIME)", "tipo": "topico", "ref": "Art. 14, §§ 10–11", "filhos": [{"t": "Prazo: 15 dias contados da diplomação, perante a Justiça Eleitoral", "tipo": "prazo", "ref": "Art. 14, § 10"}, {"t": "Provas de abuso do poder econômico, corrupção ou fraude", "tipo": "regra", "ref": "Art. 14, § 10"}, {"t": "Tramita em segredo de justiça; autor responde se temerária ou de má-fé", "tipo": "sancao", "ref": "Art. 14, § 11"}]}, {"t": "Consultas populares municipais", "tipo": "topico", "ref": "Art. 14, §§ 12–13", "filhos": [{"t": "Concomitantes às eleições municipais", "tipo": "regra", "d": "Questões locais aprovadas pelas Câmaras Municipais, encaminhadas à Justiça Eleitoral até 90 dias antes da eleição, observados limites operacionais de quesitos.", "ref": "Art. 14, § 12"}, {"t": "Manifestações durante a campanha, sem propaganda gratuita no rádio e TV", "tipo": "excecao", "ref": "Art. 14, § 13"}]}, {"t": "Art. 15 – Vedada a cassação; perda ou suspensão só nos casos", "tipo": "topico", "ref": "Art. 15", "filhos": [{"t": "I – cancelamento da naturalização por sentença transitada em julgado", "tipo": "sancao", "ref": "Art. 15, I"}, {"t": "II – incapacidade civil absoluta", "tipo": "sancao", "ref": "Art. 15, II"}, {"t": "III – condenação criminal transitada em julgado, enquanto durarem os efeitos", "tipo": "sancao", "ref": "Art. 15, III"}, {"t": "IV – recusa de obrigação a todos imposta ou prestação alternativa (art. 5º, VIII)", "tipo": "sancao", "ref": "Art. 15, IV"}, {"t": "V – improbidade administrativa (art. 37, § 4º)", "tipo": "sancao", "ref": "Art. 15, V"}, {"t": "Doutrina: I = perda; II, III, V = suspensão; IV = perda ou suspensão (divergente)", "tipo": "atencao", "ext": true}]}, {"t": "Art. 16 – Anterioridade eleitoral", "tipo": "prazo", "d": "Lei que altera o processo eleitoral vigora na publicação, mas não se aplica à eleição que ocorra até 1 ano da data de sua vigência.", "ref": "Art. 16"}]}}, {"id": "cf1-partidos", "titulo": "Título II, Cap. V – Partidos Políticos (art. 17)", "raiz": {"t": "Partidos Políticos", "tipo": "topico", "ref": "Art. 17", "filhos": [{"t": "Livre criação, fusão, incorporação e extinção", "tipo": "regra", "ref": "Art. 17, caput", "filhos": [{"t": "Resguardados: soberania nacional, regime democrático, pluripartidarismo, direitos fundamentais", "tipo": "excecao", "ref": "Art. 17, caput"}]}, {"t": "Preceitos obrigatórios", "tipo": "classificacao", "ref": "Art. 17, I–IV", "filhos": [{"t": "I – caráter nacional", "tipo": "regra", "ref": "Art. 17, I"}, {"t": "II – proibido receber recursos de entidade/governo estrangeiro ou subordinar-se a eles", "tipo": "excecao", "ref": "Art. 17, II"}, {"t": "III – prestação de contas à Justiça Eleitoral", "tipo": "regra", "ref": "Art. 17, III"}, {"t": "IV – funcionamento parlamentar de acordo com a lei", "tipo": "regra", "ref": "Art. 17, IV"}]}, {"t": "Autonomia partidária", "tipo": "conceito", "ref": "Art. 17, § 1º", "filhos": [{"t": "Define estrutura interna, órgãos permanentes e provisórios, organização e funcionamento", "tipo": "regra", "ref": "Art. 17, § 1º"}, {"t": "Coligações só nas eleições majoritárias; vedadas nas proporcionais", "tipo": "excecao", "ref": "Art. 17, § 1º"}, {"t": "Sem obrigatoriedade de vinculação entre candidaturas nacional/estadual/distrital/municipal", "tipo": "regra", "ref": "Art. 17, § 1º"}, {"t": "Estatutos devem prever normas de disciplina e fidelidade partidária", "tipo": "regra", "ref": "Art. 17, § 1º"}]}, {"t": "Personalidade jurídica pela lei civil; estatuto registrado no TSE", "tipo": "regra", "ref": "Art. 17, § 2º"}, {"t": "Cláusula de desempenho (fundo partidário e rádio/TV gratuitos)", "tipo": "prazo", "ref": "Art. 17, § 3º", "filhos": [{"t": "I – mínimo 3% dos votos válidos para a Câmara, em 1/3 das UFs, com mínimo de 2% em cada", "tipo": "prazo", "ref": "Art. 17, § 3º, I"}, {"t": "II – ou eleger pelo menos 15 Deputados Federais em 1/3 das UFs", "tipo": "prazo", "ref": "Art. 17, § 3º, II"}, {"t": "Requisitos alternativos (basta um)", "tipo": "atencao", "ref": "Art. 17, § 3º"}]}, {"t": "Vedada organização paramilitar", "tipo": "excecao", "ref": "Art. 17, § 4º"}, {"t": "Eleito por partido sem cláusula: mantém mandato e pode migrar", "tipo": "regra", "d": "Filiação a partido que atingiu os requisitos não conta para distribuição de fundo partidário e tempo de rádio/TV.", "ref": "Art. 17, § 5º"}, {"t": "Fidelidade: parlamentar proporcional que se desliga perde o mandato", "tipo": "sancao", "d": "Deputados Federais, Estaduais, Distritais e Vereadores; salvo anuência do partido ou justa causa legal; migração não computada para fundos e rádio/TV.", "ref": "Art. 17, § 6º", "filhos": [{"t": "Não alcança cargos majoritários (Senador, chefes do Executivo)", "tipo": "atencao", "ref": "Art. 17, § 6º"}]}, {"t": "Atualização: §§ 7º a 9º incluídos após o PDF", "tipo": "atencao", "d": "§ 7º (EC 117/2022): mínimo de 5% do fundo partidário em programas de promoção da participação política das mulheres. § 8º (EC 117/2022): no mínimo 30% do FEFC, da parcela do fundo partidário para campanhas e do tempo de rádio/TV para candidatas, proporcional ao número de candidatas. § 9º (EC 133/2024): 30% dos recursos do FEFC e do fundo partidário para campanhas aplicados em candidaturas de pessoas pretas e pardas.", "ref": "Art. 17, §§ 7º–9º (EC 117/2022 e EC 133/2024)", "ext": true}]}}, {"id": "cf2-cap1", "titulo": "Cap. I – Organização Político-Administrativa (arts. 18–19)", "raiz": {"t": "Cap. I – Organização Político-Administrativa", "tipo": "topico", "ref": "Arts. 18–19", "filhos": [{"t": "Entes federativos autônomos", "tipo": "conceito", "d": "União, Estados, DF e Municípios, todos autônomos nos termos da CF.", "ref": "Art. 18, caput", "filhos": [{"t": "Territórios NÃO são entes autônomos", "tipo": "atencao", "d": "Os Territórios Federais integram a União.", "ref": "Art. 18, § 2º"}]}, {"t": "Brasília é a Capital Federal", "tipo": "regra", "ref": "Art. 18, § 1º", "filhos": [{"t": "Capital = Brasília, não o DF", "tipo": "atencao", "d": "O texto diz 'Brasília é a Capital Federal'.", "ref": "Art. 18, § 1º"}]}, {"t": "Territórios Federais", "tipo": "regra", "d": "Integram a União; criação, transformação em Estado ou reintegração ao Estado de origem: reguladas em LEI COMPLEMENTAR.", "ref": "Art. 18, § 2º"}, {"t": "Alteração de Estados", "tipo": "regra", "d": "Incorporar-se entre si, subdividir-se ou desmembrar-se (para anexar a outros ou formar novos Estados/Territórios).", "ref": "Art. 18, § 3º", "filhos": [{"t": "Requisito 1: plebiscito da população diretamente interessada", "tipo": "regra", "ref": "Art. 18, § 3º"}, {"t": "Requisito 2: Congresso Nacional, por lei complementar", "tipo": "competencia", "ref": "Art. 18, § 3º"}]}, {"t": "Alteração de Municípios", "tipo": "regra", "d": "Criação, incorporação, fusão e desmembramento.", "ref": "Art. 18, § 4º", "filhos": [{"t": "Por LEI ESTADUAL", "tipo": "competencia", "ref": "Art. 18, § 4º"}, {"t": "Dentro do período fixado por LC FEDERAL", "tipo": "prazo", "ref": "Art. 18, § 4º"}, {"t": "Plebiscito prévio às populações dos Municípios envolvidos", "tipo": "regra", "ref": "Art. 18, § 4º"}, {"t": "Após divulgação dos Estudos de Viabilidade Municipal", "tipo": "regra", "d": "Apresentados e publicados na forma da lei.", "ref": "Art. 18, § 4º"}, {"t": "Estados: LC federal do Congresso; Municípios: lei estadual", "tipo": "atencao", "d": "Não confundir o tipo de lei/ente em cada caso.", "ref": "Art. 18, §§ 3º e 4º"}]}, {"t": "Vedações a todos os entes", "tipo": "excecao", "ref": "Art. 19", "filhos": [{"t": "Estabelecer cultos/igrejas, subvencioná-los, embaraçar funcionamento, manter dependência ou aliança", "tipo": "excecao", "d": "Ressalvada, na forma da lei, a colaboração de interesse público (Estado laico).", "ref": "Art. 19, I"}, {"t": "Recusar fé aos documentos públicos", "tipo": "excecao", "ref": "Art. 19, II"}, {"t": "Criar distinções entre brasileiros ou preferências entre si", "tipo": "excecao", "ref": "Art. 19, III"}]}]}}, {"id": "cf2-cap2", "titulo": "Cap. II – Da União: bens e competências (arts. 20–24)", "raiz": {"t": "Cap. II – Da União", "tipo": "topico", "ref": "Arts. 20–24", "filhos": [{"t": "Bens da União", "tipo": "classificacao", "ref": "Art. 20", "filhos": [{"t": "Os que atualmente lhe pertencem e os que lhe vierem a ser atribuídos", "tipo": "classificacao", "ref": "Art. 20, I"}, {"t": "Terras de ": "Ao longo das fronteiras terrestres; fundamental para defesa; ocupação e uso regulados em lei.", "ref": "Art. 20, § 2º"}]}, {"t": "Competência EXCLUSIVA da União (material/administrativa)", "tipo": "competencia", "d": "'Compete à União' – atividades administrativas; sem previsão de delegação.", "ref": "Art. 21", "filhos": [{"t": "Relações exteriores e defesa", "tipo": "classificacao", "ref": "Art. 21, I a IV", "filhos": [{"t": "Manter relações com Estados estrangeiros e participar de organizações internacionais", "tipo": "classificacao", "ref": "Art. 21, I"}, {"t": "Declarar guerra e celebrar a paz", "tipo": "classificacao", "ref": "Art. 21, II"}, {"t": "Assegurar a defesa nacional", "tipo": "classificacao", "ref": "Art. 21, III"}, {"t": "Permitir trânsito/permanência temporária de forças estrangeiras", "tipo": "classificacao", "d": "Nos casos previstos em lei complementar.", "ref": "Art. 21, IV"}]}, {"t": "Decretar estado de sítio, estado de defesa e intervenção federal", "tipo": "classificacao", "ref": "Art. 21, V"}, {"t": "Material bélico: autorizar e fiscalizar produção e comércio", "tipo": "classificacao", "ref": "Art. 21, VI"}, {"t": "Moeda e finanças", "tipo": "classificacao", "ref": "Art. 21, VII e VIII", "filhos": [{"t": "Emitir moeda", "tipo": "classificacao", "ref": "Art. 21, VII"}, {"t": "Administrar reservas cambiais; fiscalizar crédito, câmbio, capitalização, seguros e previdência privada", "tipo": "classificacao", "ref": "Art. 21, VIII"}]}, {"t": "Planos nacionais e regionais de ordenação do território e desenvolvimento", "tipo": "classificacao", "ref": "Art. 21, IX"}, {"t": "Serviço postal e correio aéreo nacional", "tipo": "classificacao", "ref": "Art. 21, X"}, {"t": "Telecomunicações (direta ou por autorização, concessão, permissão)", "tipo": "classificacao", "d": "Lei disporá sobre organização dos serviços e criação de órgão regulador.", "ref": "Art. 21, XI"}, {"t": "Explorar diretamente ou mediante autorização, concessão ou permissão", "tipo": t. 29, caput"}]}, {"t": "Eleições e posse", "tipo": "regra", "ref": "Art. 29, I a III", "filhos": [{"t": "Prefeito, Vice e Vereadores: mandato de 4 anos, pleito direto e simultâneo em todo o País", "tipo": "prazo", "ref": "Art. 29, I"}, {"t": "Eleição no 1º domingo de outubro do ano anterior ao término", "tipo": "prazo", "d": "2º turno (art. 77) só em Municípios com MAIS de 200 mil ELEITORES.", "ref": "Art. 29, II"}, {"t": "Posse em 1º de janeiro do ano subsequente", "tipo": "prazo", "ref": "Art. 29, III"}, {"t": "200 mil eleitores (não habitantes)", "tipo": "atencao", "ref": "Art. 29, II"}]}, {"t": "Limite máximo de Vereadores (24 faixas)", "tipo": "prazo", "d": "De 9 a 55 Vereadores conforme população.", "ref": "Art. 29, IV", "filhos": [{"t": "a) 9 Vereadores – até 15 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, a"}, {"t": "b) 11 Vereadores – 15 mil a 30 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, b"}, {"t": "c) 13 Vereadores – 30 mil a 50 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, c"}, {"t": "d) 15 Vereadores – 50 mil a 80 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, d"}, {"t": "e) 17 Vereadores – 80 mil a 120 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, e"}, {"t": "f) 19 Vereadores – 120 mil a 160 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, f"}, {"t": "g) 21 Vereadores – 160 mil a 300 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, g"}, {"t": "h) 23 Vereadores – 300 mil a 450 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, h"}, {"t": "i) 25 Vereadores – 450 mil a 600 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, i"}, {"t": "j) 27 Vereadores – 600 mil a 750 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, j"}, {"t": "k) 29 Vereadores – 750 mil a 900 mil hab.", "tipo": "prazo", "ref": "Art. 29, IV, k"}, {"t": "l) 31 Vereadores – 900 mil a 1,05 milhão hab.", "tipo": "prazo", "ref": "Art. 29, IV, l"}, {"t": "m) 33 Vereadores – 1,05 a 1,2 milhão hab.", "tipo": "prazo", "ref": "Art. 29, IV, m"}, {"t": "n) 35 Vereadores – 1,2 a 1,35 milhão hab.", "tipo": "prazo", "ref": "Art. 29, IV, n"}, {"t": "o) 37 Vereadores – 1,35 a 1,5 milhão hab.", "tipo": "prazo", "ref": "Art. 29, IV, o"}, {"t": "p) 39 Vereadores – 1,5 a 1,8 milhão hab.", "tipo": "prazo", "ref": "Art. 29, IV, p"}, {"t": "q) 41 Vereadores – 1,8 a 2,4 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, q"}, {"t": "r) 43 Vereadores – 2,4 a 3 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, r"}, {"t": "s) 45 Vereadores – 3 a 4 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, s"}, {"t": "t) 47 Vereadores – 4 a 5 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, t"}, {"t": "u) 49 Vereadores – 5 a 6 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, u"}, {"t": "v) 51 Vereadores – 6 a 7 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, v"}, {"t": "w) 53 Vereadores – 7 a 8 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, w"}, {"t": "x) 55 Vereadores – mais de 8 milhões hab.", "tipo": "prazo", "ref": "Art. 29, IV, x"}]}, {"t": "Subsídios", "tipo": "prazo", "ref": "Art. 29, V a VII", "filhos": [{"t": "Prefeito, Vice e Secretários: lei de iniciativa da Câmara", "tipo": "regra", "d": "Observados arts. 37, XI, 39, § 4º, 150, II, 153, III e § 2º, I.", "ref": "Art. 29, V"}, {"t": "Vereadores: fixados pela Câmara em cada legislatura para a subsequente", "tipo": "regra", "ref": "Art. 29, VI", "filhos": [{"t": "até 10 mil hab.: máx. 20% do Dep. Estadual", "tipo": "prazo", "ref": "Art. 29, VI, a"}, {"t": "10.001 a 50 mil: 30%", "tipo": "prazo", "ref": "Art. 29, VI, b"}, {"t": "50.001 a 100 mil: 40%", "tipo": "prazo", "ref": "Art. 29, VI, c"}, {"t": "100.001 a 300 mil: 50%", "tipo": "prazo", "ref": "Art. 29, VI, d"}, {"t": "300.001 a 500 mil: 60%", "tipo": "prazo", "ref": "Art. 29, VI, e"}, {"t": "mais de 500 mil: 75%", "tipo": "prazo", "ref": "Art. 29, VI, f"}]}, {"t": "Despesa total com remuneração dos Vereadores ≤ 5% da receita do Município", "tipo": "prazo", "ref": "Art. 29, VII"}]}, {"t": "Outros preceitos da Lei Orgânica", "tipo": "regra", "ref": "Art. 29, VIII a XIV", "filhos": [{"t": "Inviolabilidade dos Vereadores por opiniões, palavras e votos", "tipo": "conceito", "d": "No exercício do mandato e NA CIRCUNSCRIÇÃO do Município.", "ref": "Art. 29, VIII"}, {"t": "Proibições e incompatibilidades similares às do Congresso/Assembleia", "tipo": "regra", "ref": "Art. 29, IX"}, {"t": "Julgamento do Prefeito perante o Tribunal de Justiça", "tipo": "competencia", "ref": "Art. 29, X"}, {"t": "Organização das funções legislativas e fiscalizadoras da Câmara", "tipo": "regra", "ref": "Art. 29, XI"}, {"t": "Cooperação das associações representativas no planejamento municipal", "tipo": "regra", "ref": "Art. 29, XII"}, {"t": "Iniciativa popular: mínimo 5% do eleitorado", "tipo": "prazo", "d": "Projetos de interesse específico do Município, da cidade ou de bairros.", "ref": "Art. 29, XIII"}, {"t": "Perda do mandato do Prefeito nos termos do art. 28, § 1º", "tipo": "sancao", "d": "Texto diz 'parágrafo único'; NE: leia-se § 1º (EC 19/1998).", "ref": "Art. 29, XIV"}]}, {"t": "Limites de despesa do Legislativo Municipal", "tipo": "prazo", "d": "% sobre receita tributária + transferências (arts. 153, § 5º, 158 e 159) realizadas no exercício anterior; incluídos subsídios dos Vereadores.", "ref": "Art. 29-A", "filhos": [{"t": "até 100 mil hab.: 7%", "tipo": "prazo", "ref": "Art. 29-A, I"}, {"t": "100 mil a 300 mil: 6%", "tipo": "prazo", "ref": "Art. 29-A, II"}, {"t": "300.001 a 500 mil: 5%", "tipo": "prazo", "ref": "Art. 29-A, III"}, {"t": "500.001 a 3 milhões: 4,5%", "tipo": "prazo", "ref": "Art. 29-A, IV"}, {"t": "3.000.001 a 8 milhões: 4%", "tipo": "prazo", "ref": "Art. 29-A, V"}, {"t": "acima de 8 milhões: 3,5%", "tipo": "prazo", "ref": "Art. 29-A, VI"}, {"t": "Inativos: texto principal exclui; EC 109/2021 passa a INCLUIR inativos e pensionistas", "tipo": "atencao", "d": "Vigência a partir da primeira legislatura municipal após 16/3/2021 (nota do PDF).", "ref": "Art. 29-A, caput e nota"}, {"t": "Câmara: máx. 70% de sua receita com folha de pagamento", "tipo": "prazo", "d": "Incluído o subsídio dos Vereadores.", "ref": "Art. 29-A, § 1º"}, {"t": "Crime de responsabilidade do PREFEITO", "tipo": "sancao", "ref": "Art. 29-A, § 2º", "filhos": [{"t": "Repasse acima dos limites", "tipo": "sancao", "ref": "Art. 29-A, § 2º, I"}, {"t": "Não enviar repasse até o dia 20 de cada mês", "tipo": "sancao", "ref": "Art. 29-A, § 2º, II"}, {"t": "Enviar a menor que a proporção da Lei Orçamentária", "tipo": "sancao", "ref": "Art. 29-A, § 2º, III"}]}, {"t": "Crime de responsabilidade do PRESIDENTE DA CÂMARA: desrespeitar o limite de 70%", "tipo": "sancao", "ref": "Art. 29-A, § 3º"}, {"t": "Hoje vale a redação da EC 109/2021", "tipo": "atencao", "d": "A primeira legislatura municipal após 16/3/2021 começou em 1º/1/2025: desde então os gastos com inativos e pensionistas entram no limite do art. 29-A.", "ref": "Art. 29-A, caput (EC 109/2021)", "ext": true}]}, {"t": "Competências dos Municípios", "tipo": "competencia", "ref": "Art. 30", "filhos": [{"t": "Legislar sobre assuntos de interesse local", "tipo": "competencia", "ref": "Art. 30, I"}, {"t": "Suplementar a legislação federal e estadual no que couber", "tipo": "competencia", "ref": "Art. 30, II"}, {"t": "Instituir e arrecadar tributos; aplicar rendas", "tipo": "competencia", "d": "Com obrigação de prestar contas e publicar balancetes nos prazos legais.", "ref": "Art. 30, III"}, {"t": "Criar, organizar e suprimir distritos", "tipo": "competencia", "d": "Observada a legislação estadual.", "ref": "Art. 30, IV"}, {"t": "Serviços públicos de interesse local, incluído transporte coletivo (essencial)", "tipo": "competencia", "d": "Diretamente ou por concessão ou permissão.", "ref": "Art. 30, V"}, {"t": "Educação infantil e ensino fundamental", "tipo": "competencia", "d": "Com cooperação técnica e financeira da União e do Estado.", "ref": "Art. 30, VI"}, {"t": "Atendimento à saúde da população", "tipo": "competencia", "d": "Com cooperação técnica e financeira da União e do Estado.", "ref": "Art. 30, VII"}, {"t": "Ordenamento territorial: uso, parcelamento e ocupação do solo urbano", "tipo": "competencia", "ref": "Art. 30, VIII"}, {"t": "Proteção do patrimônio histórico-cultural local", "tipo": "competencia", "d": "Observada legislação e fiscalização federal e estadual.", "ref": "Art. 30, IX"}]}, {"t": "Fiscalização do Município", "tipo": "regra", "ref": "Art. 31", "filhos": [{"t": "Controle externo: Câmara Municipal; controle interno: Executivo", "tipo": "competencia", "ref": "Art. 31, caput"}, {"t": "Auxílio do TCE ou do Conselho/Tribunal de Contas dos Municípios, onde houver", "tipo": "competencia", "ref": "Art. 31, § 1º"}, {"t": "Parecer prévio sobre contas do Prefeito só deixa de prevalecer por 2/3 da Câmara", "tipo": "prazo", "ref": "Art. 31, § 2º"}, {"t": "Contas à disposição do contribuinte por 60 dias, anualmente", "tipo": "prazo", "d": "Qualquer contribuinte pode questionar a legitimidade.", "ref": "Art. 31, § 3º"}, {"t": "Vedada criação de Tribunais, Conselhos ou órgãos de Contas Municipais", "tipo": "excecao", "d": "Os já existentes ('onde houver', § 1º) permanecem.", "ref": "Art. 31, § 4º"}, {"t": "§ 1º alterado pela EC 139/2026", "tipo": "atencao", "d": "Texto atual acrescenta, ao fim do § 1º, 'vedada sua extinção, criação ou instalação' (dos Tribunais/Conselhos de Contas que auxiliam a Câmara). O § 4º não foi alterado.", "ref": "Art. 31, § 1º (EC 139/2026)", "ext": true}]}]}}, {"id": "cf2-cap5", "titulo": "Cap. V – Do Distrito Federal e dos Territórios (arts. 32–33)", "raiz": {"t": "Cap. V – Do Distrito Federal e dos Territórios", "tipo": "topico", "ref": "Arts. 32–33", "filhos": [{"t": "Seção I – Distrito Federal", "tipo": "topico", "ref": "Art. 32", "filhos": [{"t": "Vedada divisão em Municípios", "tipo": "excecao", "ref": "Art. 32, caput"}, {"t": "Lei orgânica: 2 turnos, interstício 10 dias, 2/3 da Câmara Legislativa", "tipo": "prazo", "d": "Promulgada pela Câmara Legislativa, atendidos os princípios da CF.", "ref": "Art. 32, caput"}, {"t": "Competências legislativas de Estados E Municípios", "tipo": "competencia", "ref": "Art. 32, § 1º"}, {"t": "Eleição de Governador, Vice (art. 77) e Deputados Distritais coincide com a estadual", "tipo": "regra", "d": "Mandato de igual duração.", "ref": "Art. 32, § 2º"}, {"t": "Aplica-se o art. 27 aos Deputados Distritais e à Câmara Legislativa", "tipo": "regra", "ref": "Art. 32, § 3º"}, {"t": "Lei FEDERAL disporá sobre uso, pelo GDF, das polícias civil, penal, militar e bombeiros", "tipo": "competencia", "d": "Organizadas e mantidas pela União (art. 21, XIV).", "ref": "Art. 32, § 4º"}]}, {"t": "Seção II – Territórios", "tipo": "topico", "ref": "Art. 33", "filhos": [{"t": "Lei disporá sobre organização administrativa e judiciária", "tipo": "regra", "ref": "Art. 33, caput"}, {"t": "Podem ser divididos em Municípios", "tipo": "regra", "d": "Aplica-se, no que couber, o Cap. IV.", "ref": "Art. 33, § 1º"}, {"t": "Contas do Governo do Território: Congresso Nacional, com parecer prévio do TCU", "tipo": "competencia", "ref": "Art. 33, § 2º"}, {"t": "Territórios com mais de 100 mil habitantes", "tipo": "prazo", "d": "Além do Governador nomeado: órgãos judiciários de 1ª e 2ª instância, membros do MP e defensores públicos federais; lei disporá sobre eleição da Câmara Territorial.", "ref": "Art. 33, § 3º"}]}]}}, {"id": "cf2-cap6", "titulo": "Cap. VI – Da Intervenção (arts. 34–36)", "raiz": {"t": "Cap. VI – Da Intervenção", "tipo": "topico", "d": "Medida excepcional: a regra é a NÃO intervenção.", "ref": "Arts. 34–36", "filhos": [{"t": "Intervenção FEDERAL (União → Estados e DF)", "tipo": "competencia", "d": "Hipóteses taxativas.", "ref": "Art. 34", "filhos": [{"t": "I – Manter a integridade nacional", "tipo": "classificacao", "ref": "Art. 34, I"}, {"t": "II – Repelir invasão estrangeira ou de uma unidade da Federação em outra", "tipo": "classificacao", "ref": "Art. 34, II"}, {"t": "III – Pôr termo a grave comprometimento da ordem pública", "tipo": "classificacao", "ref": "Art. 34, III"}, {"t": "IV – Garantir o livre exercício de qualquer dos Poderes nas unidades", "tipo": "classificacao", "ref": "Art. 34, IV"}, {"t": "V – Reorganizar finanças da unidade que:", "tipo": "classificacao", "ref": "Art. 34, V", "filhos": [{"t": "a) suspender pagamento da dívida fundada por mais de 2 anos consecutivos", "tipo": "prazo", "d": "Salvo força maior.", "ref": "Art. 34, V, a"}, {"t": "b) deixar de entregar aos Municípios receitas tributárias constitucionais nos prazos legais", "tipo": "classificacao", "ref": "Art. 34, V, b"}]}, {"t": "VI – Prover a execução de lei federal, ordem ou decisão judicial", "tipo": "classificacao", "ref": "Art. 34, VI"}, {"t": "VII – Assegurar princípios constitucionais sensíveis", "tipo": "classificacao", "ref": "Art. 34, VII", "filhos": [{"t": "a) forma republicana, sistema representativo e regime democrático", "tipo": "classificacao", "ref": "Art. 34, VII, a"}, {"t": "b) direitos da pessoa humana", "tipo": "classificacao", "ref": "Art. 34, VII, b"}, {"t": "c) autonomia municipal", "tipo": "classificacao", "ref": "Art. 34, VII, c"}, {"t": "d) prestação de contas da administração pública, direta e indireta", "tipo": "classificacao", "ref": "Art. 34, VII, d"}, {"t": "e) aplicação do mínimo da receita de impostos estaduais em ensino e saúde", "tipo": "classificacao", "ref": "Art. 34, VII, e"}]}]}, {"t": "Intervenção ESTADUAL (Estado → Municípios; União → Municípios de Território)", "tipo": "competencia", "ref": "Art. 35", "filhos": [{"t": "I – Dívida fundada não paga por 2 anos consecutivos, sem força maior", "tipo": "prazo", "ref": "Art. 35, I"}, {"t": "II – Não prestação das contas devidas", "tipo": "classificacao", "ref": "Art. 35, II"}, {"t": "III – Não aplicação do mínimo da receita municipal em ensino e saúde", "tipo": "classificacao", "ref": "Art. 35, III"}, {"t": "IV – TJ der provimento a representação", "tipo": "classificacao", "d": "Para assegurar princípios da Constituição Estadual ou prover execução de lei, ordem ou decisão judicial.", "ref": "Art. 35, IV"}, {"t": "União NÃO intervém em Municípios de Estados", "tipo": "atencao", "d": "Só nos localizados em Território Federal.", "ref": "Art. 35, caput"}]}, {"t": "Pressupostos da decretação", "tipo": "regra", "ref": "Art. 36", "filhos": [{"t": "Coação a Poder (art. 34, IV)", "tipo": "regra", "d": "Solicitação do Legislativo ou Executivo coacto/impedido; requisição do STF se a coação for contra o Judiciário.", "ref": "Art. 36, I"}, {"t": "Desobediência a ordem/decisão judiciária", "tipo": "regra", "d": "Requisição do STF, do STJ ou do TSE.", "ref": "Art. 36, II"}, {"t": "Princípios sensíveis (art. 34, VII) e recusa à execução de lei federal", "tipo": "regra", "d": "Provimento, pelo STF, de representação do Procurador-Geral da República.", "ref": "Art. 36, III"}, {"t": "Inciso IV revogado", "tipo": "atencao", "ref": "Art. 36, IV"}, {"t": "Demais hipóteses (art. 34, I, II, III e V): decretação de ofício pelo Presidente", "tipo": "competencia", "ref": "Arts. 21, V, e 84, X", "ext": true}]}, {"t": "Procedimento", "tipo": "regra", "ref": "Art. 36, §§ 1º a 4º", "filhos": [{"t": "Decreto especifica amplitude, prazo e condições; nomeia interventor, se couber", "tipo": "regra", "ref": "Art. 36, § 1º"}, {"t": "Submetido ao Congresso Nacional ou à Assembleia Legislativa em 24 horas", "tipo": "prazo", "ref": "Art. 36, § 1º"}, {"t": "Se não estiver funcionando: convocação extraordinária, também em 24 horas", "tipo": "prazo", "ref": "Art. 36, § 2º"}, {"t": "Dispensa de controle político: art. 34, VI e VII, e art. 35, IV", "tipo": "excecao", "d": "Decreto limita-se a suspender o ato impugnado, se bastar para restabelecer a normalidade.", "ref": "Art. 36, § 3º"}, {"t": "Cessados os motivos, autoridades afastadas voltam aos cargos", "tipo": "regra", "d": "Salvo impedimento legal.", "ref": "Art. 36, § 4º"}]}]}}, {"id": "cf2-cap7-art37-incisos", "titulo": "Cap. VII – Adm. Pública: princípios e incisos ; necessidade temporária de excepcional interesse público.", "ref": "Art. 37, IX"}, {"t": "Remuneração", "tipo": "regra", "ref": "Art. 37, X a XV", "filhos": [{"t": "X – Fixação/alteração só por LEI ESPECÍFICA", "tipo": "regra", "d": "Observada a iniciativa privativa em cada caso.", "ref": "Art. 37, X", "filhos": [{"t": "Revisão geral anual: sempre na mesma data e sem distinção de índices", "tipo": "prazo", "ref": "Art. 37, X"}]}, {"t": "XI – Teto remuneratório", "tipo": "prazo", "d": "Inclui remuneração, subsídio, proventos, pensões, vantagens pessoais, percebidos cumulativamente ou não.", "ref": "Art. 37, XI", "filhos": [{"t": "Teto geral: subsídio mensal dos Ministros do STF", "tipo": "prazo", "ref": "Art. 37, XI"}, {"t": "Municípios: subsídio do Prefeito", "tipo": "prazo", "ref": "Art. 37, XI"}, {"t": "Estados/DF – Executivo: subsídio do Governador", "tipo": "prazo", "ref": "Art. 37, XI"}, {"t": "Estados/DF – Legislativo: subsídio dos Deputados Estaduais/Distritais", "tipo": "prazo", "ref": "Art. 37, XI"}, {"t": "Estados/DF – Judiciário: Desembargadores do TJ, até 90,25% do Ministro do STF", "tipo": "prazo", "d": "Também aplicável a membros do MP, Procuradores e Defensores Públicos.", "ref": "Art. 37, XI"}, {"t": "Subteto único opcional (§ 12): Desembargador do TJ (≤ 90,25% STF)", "tipo": "prazo", "d": "Por emenda à Constituição Estadual/Lei Orgânica; não se aplica a Deputados Estaduais/Distritais e Vereadores.", "ref": "Art. 37, § 12"}, {"t": "Verbas indenizatórias previstas em lei não entram no teto", "tipo": "excecao", "ref": "Art. 37, § 11"}, {"t": "Teto alcança EP e SEM (e subsidiárias) que recebem recursos públicos para pessoal ou custeio", "tipo": "regra", "ref": "Art. 37, § 9º"}]}, {"t": "XII – Vencimentos do Legislativo e Judiciário não podem superar os do Executivo", "tipo": "excecao", "ref": "Art. 37, XII"}, {"t": "XIII – Vedada vinculação ou equiparação de espécies remuneratórias", "tipo": "excecao", "ref": "Art. 37, XIII"}, {"t": "XIV – Acréscimos não computados nem acumulados para acréscimos ulteriores", "tipo": "excecao", "d": "Veda o efeito cascata.", "ref": "Art. 37, XIV"}, {"t": "XV – Irredutibilidade de subsídio e vencimentos", "tipo": "regra", "d": "Ressalvados incisos XI e XIV e arts. 39, § 4º, 150, II, 153, III, e 153, § 2º, I.", "ref": "Art. 37, XV"}]}, {"t": "XVI – Acumulação remunerada de cargos: VEDADA, salvo", "tipo": "excecao", "d": "Exige compatibilidade de horários e observância do teto (XI).", "ref": "Art. 37, XVI", "filhos": [{"t": "a) dois cargos de professor", "tipo": "classificacao", "ref": "Art. 37, XVI, a"}, {"t": "b) um de professor + outro técnico ou científico", "tipo": "classificacao", "ref": "Art. 37, XVI, b"}, {"t": "c) dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas", "tipo": "classificacao", "ref": "Art. 37, XVI, c"}, {"t": "XVII – Vedação alcança empregos e funções", "tipo": "regra", "d": "Abrange autarquias, fundações, EP, SEM, subsidiárias e sociedades controladas direta ou indiretamente pelo poder público.", "ref": "Art. 37, XVII"}, {"t": "Outras hipóteses nesta parte da CF", "tipo": "atencao", "d": "Vereador com compatibilidade (art. 38, III); militares estaduais, com prevalência da atividade militar (art. 42, § 3º).", "ref": "Art. 38, III; art. 42, § 3º"}, {"t": "Proventos + remuneração: vedado, salvo cargos acumuláveis, eletivos e em comissão", "tipo": "excecao", "ref": "Art. 37, § 10"}, {"t": "Soma de proventos e remunerações acumuladas sujeita ao teto", "tipo": "prazo", "ref": "Art. 40, § 11"}, {"t": "Alínea b alterada pela EC 138/2025", "tipo": "atencao", "d": "Redação atual: 'a de um cargo de professor com outro de qualquer natureza' (antes: 'outro técnico ou científico', como no PDF). Atenção à banca: conferir qual texto o edital adota.", "ref": "Art. 37, XVI, b (EC 138/2025)", "ext": true}]}, {"t": "XVIII – Precedência da administração fazendária e seus servidores fiscais", "tipo": "regra", "d": "Dentro de suas áreas de co ecebimento", "tipo": "competencia", "ref": "Art. 71, I", "filhos": [{"t": "TCU aprecia (parecer); quem JULGA as contas do PR é o CN", "tipo": "atencao", "ref": "Arts. 49, IX, e 71, I"}]}, {"t": "II – JULGAR as contas dos administradores e responsáveis por dinheiros públicos", "tipo": "competencia", "d": "Administração direta e indireta, incluídas fundações e sociedades mantidas pelo Poder Público federal, e quem der causa a perda/extravio com prejuízo ao erário.", "ref": "Art. 71, II"}, {"t": "III – apreciar, para registro, legalidade de admissões de pessoal e concessões de aposentadorias, reformas e pensões", "tipo": "competencia", "ref": "Art. 71, III", "filhos": [{"t": "Exceto nomeações para cargo em comissão", "tipo": "excecao", "ref": "Art. 71, III"}, {"t": "Ressalvadas melhorias posteriores que não alterem o fundamento legal", "tipo": "excecao", "ref": "Art. 71, III"}]}, {"t": "IV – inspeções e auditorias nos três Poderes", "tipo": "competencia", "d": "Por iniciativa própria, da Câmara, do Senado, de Comissão técnica ou de inquérito.", "ref": "Art. 71, IV"}, {"t": "V – fiscalizar contas nacionais de empresas supranacionais com capital da União", "tipo": "competencia", "ref": "Art. 71, V"}, {"t": "VI – fiscalizar recursos repassados pela União a Estados, DF ou Municípios (convênios etc.)", "tipo": "competencia", "ref": "Art. 71, VI"}, {"t": "VII – prestar informações ao CN, Casas e Comissões", "tipo": "competencia", "ref": "Art. 71, VII"}, {"t": "VIII – aplicar sanções previstas em lei, entre elas multa proporcional ao dano", "tipo": "sancao", "ref": "Art. 71, VIII"}, {"t": "IX – assinar prazo para cumprimento da lei, se verificada ilegalidade", "tipo": "competencia", "ref": "Art. 71, IX"}, {"t": "X – sustar, se não atendido, a execução do ato impugnado", "tipo": "competencia", "d": "Comunica à Câmara e ao Senado.", "ref": "Art. 71, X"}, {"t": "XI – representar ao Poder competente sobre irregularidades", "tipo": "competencia", "ref": "Art. 71, XI"}, {"t": "CONT ecao", "ref": "Art. 134, § 1º"}]}, {"t": "Autonomia funcional e administrativa e iniciativa da proposta orçamentária (DPEs, DPU e DPDF)", "tipo": "regra", "d": "Nos limites da LDO e subordinada ao art. 99, § 2º.", "ref": "Art. 134, §§ 2º–3º"}, {"t": "Princípios: unidade, indivisibilidade e independência funcional", "tipo": "classificacao", "d": "Aplica-se, no que couber, o art. 93 e o art. 96, II.", "ref": "Art. 134, § 4º"}]}, {"t": "Remuneração (art. 135)", "tipo": "topico", "filhos": [{"t": "Servidores das carreiras das Seções II e III remunerados por subsídio (art. 39, § 4º)", "tipo": "regra", "ref": "Art. 135"}]}]}}, {"id": "cf4-estado-defesa-sitio", "titulo": "Título V, Cap. I – Estado de defesa e estado de sítio (arts. 136–141)", "raiz": {"t": "Estado de defesa e estado de sítio", "tipo": "topico", "ref": "Arts. 136–141", "filhos": [{"t": "Seção I – Estado de defesa", "tipo": "topico", "ref": "Art. 136", "filhos": [{"t": "Decretado pelo Presidente da República", "tipo": "competencia", "d": "O PR “pode” decretar, ouvidos o Conselho da República e o Conselho de Defesa Nacional. Decreta primeiro e submete depois ao Congresso.", "ref": "Art. 136, caput"}, {"t": "Finalidade: preservar ou prontamente restabelecer a ordem pública ou a paz social", "tipo": "conceito", "d": "Somente em locais restritos e determinados.", "ref": "Art. 136, caput", "filhos": [{"t": "Ameaçadas por grave e iminente instabilidade institucional", "tipo": "classificacao", "ref": "Art. 136, caput"}, {"t": "Atingidas por calamidades de grandes proporções na natureza", "tipo": "classificacao", "ref": "Art. 136, caput"}]}, {"t": "Conteúdo do decreto", "tipo": "regra", "d": "Determina o tempo de duração, especifica as áreas abrangidas e indica, nos termos e limites da lei, as medidas coercitivas.", "ref": "Art. 136, § 1º"}, {"t": "Medidas coercitivas admitidas", "tipo": "classificacao", "ref": "Art. 136, § 1º, I e II", "filhos": [{"t": "Restrição ao direito de reunião, ainda que no seio de associações", "tipo": "excecao", "ref": "Art. 136, § 1º, I, a"}, {"t": "Restrição ao sigilo de correspondência", "tipo": "excecao", "ref": "Art. 136, § 1º, I, b"}, {"t": "Restrição ao sigilo de comunicação telegráfica e telefônica", "tipo": "excecao", "ref": "Art. 136, § 1º, I, c"}, {"t": "Ocupação e uso temporário de bens e serviços públicos (calamidade pública)", "tipo": "regra", "d": "A União responde pelos danos e custos decorrentes.", "ref": "Art. 136, § 1º, II"}]}, {"t": "Duração máxima: 30 dias, prorrogável uma vez por igual período", "tipo": "prazo", "d": "Prorrogação só se persistirem as razões que justificaram a decretação (no máximo 60 dias no total).", "ref": "Art. 136, § 2º"}, {"t": "Prisões na vigência do estado de defesa", "tipo": "regra", "ref": "Art. 136, § 3º", "filhos": [{"t": "Prisão por crime contra o Estado comunicada imediatamente ao juiz", "tipo": "regra", "d": "Feita pelo executor da medida; o juiz relaxa se ilegal; o preso pode requerer exame de corpo de delito à autoridade policial.", "ref": "Art. 136, § 3º, I"}, {"t": "Comunicação acompanhada de declaração do estado físico e mental do detido", "tipo": "regra", "ref": "Art. 136, § 3º, II"}, {"t": "Prisão ou detenção: máximo 10 dias, salvo autorização do Judiciário", "tipo": "prazo", "ref": "Art. 136, § 3º, III"}, {"t": "Vedada a incomunicabilidade do preso", "tipo": "excecao", "ref": "Art. 136, § 3º, IV"}]}, {"t": "Controle político posterior pelo Congresso Nacional", "tipo": "competencia", "ref": "Art. 136, §§ 4º–7º", "filhos": [{"t": "PR submete o ato ao CN em 24 horas, com justificação", "tipo": "prazo", "d": "Vale para a decretação e para a prorrogação.", "ref": "Art. 136, § 4º"}, {"t": "CN decide por maioria absoluta", "tipo": "prazo", "ref": "Art. 136, § 4º"}, {"t": "Em recesso: convocação extraordinária no prazo de 5 dias", "tipo": "prazo", "ref": "Art. 136, § 5º"}, {"t": "CN aprecia em 10 dias do recebimento e continua funcionando", "tipo": "prazo", "ref": "Art. 136, § 6º"}, {"t": "Rejeitado o decreto, cessa imediatamente o estado de defesa", "tipo": "sancao", "ref": "Art. 136, § 7º"}]}]}, {"t": "Seção II – Estado de sítio", "tipo": "topico", "ref": "Arts. 137–139", "filhos": [{"t": "PR solicita autorização ao CN para decretar", "tipo": "competencia", "d": "Ouvidos o Conselho da República e o Conselho de Defesa Nacional. Controle prévio: sem autorização não há decreto.", "ref": "Art. 137, caput"}, {"t": "Hipóteses", "tipo": "classificacao", "ref": "Art. 137, I e II", "filhos": [{"t": "I – Comoção grave de repercussão nacional ou ineficácia de medida do estado de defesa", "tipo": "classificacao", "ref": "Art. 137, I"}, {"t": "II – Declaração de estado de guerra ou resposta a agressão armada estrangeira", "tipo": "classificacao", "ref": "Art. 137, II"}]}, {"t": "PR relata os motivos; CN decide por maioria absoluta", "tipo": "prazo", "d": "Também na solicitação de prorrogação.", "ref": "Art. 137, parágrafo único"}, {"t": "Decreto indica duração, normas de execução e garantias suspensas", "tipo": "regra", "d": "Depois de publicado, o PR designa o executor das medidas específicas e as áreas abrangidas.", "ref": "Art. 138, caput"}, {"t": "Prazos", "tipo": "prazo", "ref": "Art. 138, § 1º", "filhos": [{"t": "Inciso I: até 30 dias; cada prorrogação não superior a 30 dias", "tipo": "prazo", "d": "O texto não limita o número de prorrogações (“de cada vez”).", "ref": "Art. 138, § 1º"}, {"t": "Inciso II: por todo o tempo que perdurar a guerra ou a agressão armada estrangeira", "tipo": "prazo", "ref": "Art. 138, § 1º"}]}, {"t": "Pedido no recesso: Presidente do Senado convoca de imediato, reunião em 5 dias", "tipo": "prazo", "ref": "Art. 138, § 2º"}, {"t": "CN permanece em funcionamento até o término das medidas coercitivas", "tipo": "regra", "ref": "Art. 138, § 3º"}, {"t": "Medidas contra pessoas no sítio do art. 137, I (rol restrito)", "tipo": "classificacao", "ref": "Art. 139", "filhos": [{"t": "Obrigação de permanência em localidade determinada", "tipo": "excecao", "ref": "Art. 139, I"}, {"t": "Detenção em edifício não destinado a acusados/condenados por crimes comuns", "tipo": "excecao", "ref": "Art. 139, II"}, {"t": "Restrições a correspondência, comunicações, informações e liberdade de imprensa, radiodifusão e TV", "tipo": "excecao", "d": "Na forma da lei.", "ref": "Art. 139, III"}, {"t": "Suspensão da liberdade de reunião", "tipo": "excecao", "ref": "Art. 139, IV"}, {"t": "Busca e apreensão em domicílio", "tipo": "excecao", "ref": "Art. 139, V"}, {"t": "Intervenção nas empresas de serviços públicos", "tipo": "excecao", "ref": "Art. 139, VI"}, {"t": "Requisição de bens", "tipo": "excecao", "ref": "Art. 139, VII"}, {"t": "Fora da restrição: pronunciamentos de parlamentares nas Casas, liberados pela Mesa", "tipo": "atencao", "ref": "Art. 139, parágrafo único"}]}, {"t": "O rol do art. 139 refere-se só ao sítio do inciso I; no inciso II o decreto indica as garantias suspensas", "tipo": "atencao", "ref": "Arts. 138, caput, e 139"}]}, {"t": "Seção III – Disposições gerais", "tipo": "topico", "ref": "Arts. 140–141", "filhos": [{"t": "Comissão de 5 membros acompanha e fiscaliza as medidas", "tipo": "competencia", "d": "Designada pela Mesa do Congresso Nacional, ouvidos os líderes partidários; vale para defesa e sítio.", "ref": "Art. 140"}, {"t": "Cessado o estado, cessam os efeitos, sem prejuízo da responsabilidade pelos ilícitos", "tipo": "sancao", "d": "Responsabilidade dos executores ou agentes.", "ref": "Art. 141"}, {"t": "PR relata as medidas ao CN em mensagem", "tipo": "regra", "d": "Logo que cesse; com especificação e justificação das providências, relação nominal dos atingidos e indicação das restrições aplicadas.", "ref": "Art. 141, parágrafo único"}]}]}}, {"id": "cf4-forcas-armadas", "titulo": "Título V, Cap. II – Forças Armadas (arts. 142–143)", "raiz": {"t": "Forças Armadas", "tipo": "topico", "ref": "Arts. 142–143", "filhos": [{"t": "Conceito e composição", "tipo": "conceito", "ref": "Art. 142, caput", "filhos": [{"t": "Marinha, Exército e Aeronáutica", "tipo": "classificacao", "ref": "Art. 142, caput"}, {"t": "Instituições nacionais permanentes e regulares", "tipo": "conceito", "ref": "Art. 142, caput"}, {"t": "Organizadas com base na hierarquia e na disciplina", "tipo": "conceito", "ref": "Art. 142, caput"}, {"t": "Sob a autoridade suprema do Presidente da República", "tipo": "competencia", "ref": "Art. 142, caput"}]}, {"t": "Destinação", "tipo": "classificacao", "ref": "Art. 142, caput", "filhos": [{"t": "Defesa da Pátria", "tipo": "classificacao", "ref": "Art. 142, caput"}, {"t": "Garantia dos poderes constitucionais", "tipo": "classificacao", "ref": "Art. 142, caput"}, {"t": "Garantia da lei e da ordem, por iniciativa de qualquer dos poderes", "tipo": "classificacao", "ref": "Art. 142, caput"}]}, {"t": "LC: normas gerais de organização, preparo e emprego", "tipo": "regra", "ref": "Art. 142, § 1º"}, {"t": "Não cabe habeas corpus em relação a punições disciplinares militares", "tipo": "excecao", "ref": "Art. 142, § 2º"}, {"t": "Disposições aplicáveis aos militares", "tipo": "topico", "ref": "Art. 142, § 3º", "filhos": [{"t": "Patentes conferidas pelo PR; asseguradas a oficiais da ativa, da reserva ou reformados", "tipo": "competencia", "d": "Títulos e postos militares são privativos; uso dos uniformes junto com os demais membros.", "ref": "Art. 142, § 3º, I"}, {"t": "Posse em cargo/emprego público civil permanente → transferência para a reserva", "tipo": "regra", "d": "Ressalvada a hipótese do art. 37, XVI, “c”.", "ref": "Art. 142, § 3º, II"}, {"t": "Posse em cargo/função civil temporária não eletiva → fica agregado", "tipo": "regra", "d": "Ainda que na administração indireta (ressalvado art. 37, XVI, “c”). Só pode ser promovido por antiguidade; tempo conta só para essa promoção e para a transferência para a reserva; após 2 anos de afastamento, contínuos ou não, vai para a reserva.", "ref": "Art. 142, § 3º, III"}, {"t": "Proibidas a sindicalização e a greve", "tipo": "excecao", "ref": "Art. 142, § 3º, IV"}, {"t": "Em serviço ativo, não pode estar filiado a partido político", "tipo": "excecao", "ref": "Art. 142, § 3º, V"}, {"t": "Perda do posto e da patente do oficial", "tipo": "sancao", "ref": "Art. 142, § 3º, VI e VII", "filhos": [{"t": "Só se julgado indigno do oficialato ou com ele incompatível", "tipo": "regra", "d": "Por tribunal militar de caráter permanente em tempo de paz, ou tribunal especial em tempo de guerra.", "ref": "Art. 142, § 3º, VI"}, {"t": "Condenado a pena privativa de liberdade superior a 2 anos, com trânsito em julgado, vai a esse julgamento", "tipo": "prazo", "d": "Condenação na justiça comum ou militar.", "ref": "Art. 142, § 3º, VII"}]}, {"t": "Direitos sociais e regras do art. 37 aplicáveis", "tipo": "classificacao", "d": "Art. 7º, VIII, XII, XVII, XVIII, XIX e XXV; art. 37, XI, XIII, XIV e XV; e, na forma da lei e com prevalência da atividade militar, art. 37, XVI, “c”.", "ref": "Art. 142, § 3º, VIII"}, {"t": "Inciso IX revogado", "tipo": "atencao", "ref": "Art. 142, § 3º, IX"}, {"t": "Lei disporá sobre ingresso, limites de idade, estabilidade, inatividade, direitos, deveres, remuneração e prerrogativas", "tipo": "regra", "d": "Consideradas as peculiaridades das atividades, inclusive por compromissos internacionais e de guerra.", "ref": "Art. 142, § 3º, X"}]}, {"t": "Serviço militar", "tipo": "topico", "ref": "Art. 143", "filhos": [{"t": "Obrigatório nos termos da lei", "tipo": "regra", "ref": "Art. 143, caput"}, {"t": "Serviço alternativo por imperativo de consciência", "tipo": "regra", "d": "Compete às Forças Armadas atribuí-lo, na forma da lei, em tempo de paz, aos alistados que aleguem crença religiosa ou convicção filosófica ou política para se eximirem de atividades essencialmente militares.", "ref": "Art. 143, § 1º"}, {"t": "Mulheres e eclesiásticos isentos em tempo de paz", "tipo": "excecao", "d": "Sujeitos, porém, a outros encargos que a lei atribuir.", "ref": "Art. 143, § 2º"}]}]}}, {"id": "cf4-seguranca-publica", "titulo": "Título V, Cap. III – Segurança pública (art. 144)", "raiz": {"t": "Segurança pública", "tipo": "topico", "ref": "Art. 144", "filhos": [{"t": "Dever do Estado, direito e responsabilidade de todos", "tipo": "conceito", "d": "Exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio.", "ref": "Art. 144, caput"}, {"t": "Órgãos (rol)", "tipo": "classificacao", "ref": "Art. 144, I–VI", "filhos": [{"t": "Polícia federal", "tipo": "competencia", "d": "Instituída por lei como órgão permanente, organizado e mantido pela União e estruturado em carreira.", "ref": "Art. 144, I e § 1º", "filhos": [{"t": "Apurar infrações contra a ordem política e social ou contra bens, serviços e interesses da União, autarquias e empresas públicas", "tipo": "competencia", "d": "E outras infrações de repercussão interestadual ou internacional que exijam repressão uniforme, segundo a lei.", "ref": "Art. 144, § 1º, I"}, {"t": "Prevenir e reprimir tráfico de drogas, contrabando e descaminho", "tipo": "competencia", "d": "Sem prejuízo da ação fazendária e de outros órgãos públicos.", "ref": "Art. 144, § 1º, II"}, {"t": "Funções de polícia marítima, aeroportuária e de fronteiras", "tipo": "competencia", "ref": "Art. 144, § 1º, III"}, {"t": "Com exclusividade: polícia judiciária da União", "tipo": "competencia", "ref": "Art. 144, § 1º, IV"}]}, {"t": "Polícia rodoviária federal: patrulhamento ostensivo das rodovias federais", "tipo": "competencia", "ref": "Art. 144, II e § 2º"}, {"t": "Polícia ferroviária federal: patrulhamento ostensivo das ferrovias federais", "tipo": "competencia", "ref": "Art. 144, III e § 3º"}, {"t": "Polícias civis: polícia judiciária e apuração de infrações penais, exceto militares", "tipo": "competencia", "d": "Dirigidas por delegados de polícia de carreira; ressalvada a competência da União.", "ref": "Art. 144, IV e § 4º"}, {"t": "Polícias militares: polícia ostensiva e preservação da ordem pública", "tipo": "compete
