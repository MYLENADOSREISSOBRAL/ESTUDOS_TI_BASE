s em 2 parcelas anuais se a lei dispuser; alimentares têm precedência.", "ref": "Art. 86"}, {"t": "RPV até lei do ente: 40 SM (Estados e DF) e 30 SM (Municípios)", "tipo": "prazo", "ref": "Art. 87, I e II"}, {"t": "Valor acima: sempre precatório, salvo renúncia ao excedente", "tipo": "excecao", "ref": "Art. 87, parágrafo único"}]}, {"t": "Regime especial da EC 62/2009", "tipo": "topico", "ref": "Art. 97", "filhos": [{"t": "Estados, DF e Municípios em mora: art. 100 inaplicável, salvo §§ 2º, 3º, 9º a 14", "tipo": "regra", "ref": "Art. 97, caput"}, {"t": "Opção: depósito mensal vinculado à RCL ou regime de até 15 anos", "tipo": "classificacao", "ref": "Art. 97, § 1º"}, {"t": "Percentuais mínimos da RCL", "tipo": "prazo", "d": "Estados/DF: 1,5% (N, NE, CO, DF ou estoque até 35% da RCL) ou 2% (S/SE com estoque acima de 35%); Municípios: 1% ou 1,5% nas mesmas hipóteses.", "ref": "Art. 97, § 2º"}, {"t": "Contas especiais administradas pelo TJ; recursos não retornam ao devedor", "tipo": "competencia", "ref": "Art. 97, §§ 4º, 5º"}, {"t": "Mínimo de 50% em ordem cronológica; empate: paga o de menor valor", "tipo": "regra", "ref": "Art. 97, §§ 6º, 7º"}, {"t": "Restante: leilão (deságio), pagamento à vista em ordem crescente de valor ou acordo direto", "tipo": "classificacao", "d": "Leilão eletrônico por entidade autorizada pela CVM ou BCB, oferta pública, sem recurso pendente, quitação homologada pelo Tribunal.", "ref": "Art. 97, §§ 8º, 9º"}, {"t": "Não liberação: sequestro, compensação automática, responsabilização do chefe do Executivo, vedação de empréstimos e retenção de FPE/FPM", "tipo": "sancao", "ref": "Art. 97, § 10"}, {"t": "RPV supletiva: 40 SM (Estados/DF) e 30 SM (Municípios) se a lei não sair em 180 dias", "tipo": "prazo", "ref": "Art. 97, § 12"}, {"t": "Outras regras: litisconsórcio, vedação de sequestro, correção pela poupança, preferência de idosos (60 anos)", "tipo": "regra", "ref": "Art. 97, §§ 11, 13–18"}, {"t": "STF (ADIs 4357 e 4425, 2013) declarou inconstitucional o art. 97 do ADCT", "tipo": "atencao", "d": "A EC 62/2009 foi invalidada só em parte, mas o art. 97 foi declarado inconstitucional por inteiro. Na modulação (25/3/2015), o regime especial foi mantido por 5 exercícios a partir de 1º/1/2016; depois vieram os regimes das EC 94/2016 e 99/2017 (arts. 101–105).", "ext": true}]}, {"t": "Regime especial atual (EC 94/2016, EC 99/2017)", "tipo": "topico", "ref": "Arts. 101–105", "filhos": [{"t": "Entes em mora em 25/3/2015 quitam até 31/12/2029", "tipo": "prazo", "d": "Atualização pelo IPCA-E; depósito mensal de 1/12 de percentual da RCL em conta do TJ, nunca inferior ao percentual inicial; plano anual ao TJ.", "ref": "Art. 101, caput"}, {"t": "Conceito de RCL para o regime", "tipo": "conceito", "d": "Receitas correntes do 2º mês anterior e 11 meses precedentes, deduzidas transferências constitucionais a Municípios e contribuições de servidores e compensação do art. 201, § 9º.", "ref": "Art. 101, § 1º"}, {"t": "Fontes adicionais", "tipo": "classificacao", "d": "Até 75% dos depósitos judiciais/administrativos em que o ente é parte (fundo garantidor de 1/3); até 30% dos demais depósitos (DF 100%; Estados 50% e Municípios 50%); empréstimos fora dos limites de endividamento; depósitos não levantados até 31/12/2009.", "ref": "Art. 101, § 2º"}, {"t": "Transferência pela instituição depositária em 60 dias, sob pena de improbidade do dirigente", "tipo": "sancao", "ref": "Art. 101, § 3º"}, {"t": "Empréstimos podem ser usados só em acordos diretos", "tipo": "regra", "ref": "Art. 101, § 5º"}, {"t": "Mínimo de 50% em ordem cronológica, com preferências", "tipo": "regra", "ref": "Art. 102, caput"}, {"t": "Acordos diretos com redução máxima de 40%", "tipo": "prazo", "d": "Perante Juízos Auxiliares de Conciliação, sem recurso pendente.", "ref": "Art. 102, § 1º"}, {"t": "Preferência por idade, saúde e deficiência até o quíntuplo do pequeno valor", "tipo": "prazo", "ref": "Art. 102, § 2º"}, {"t": "Pagando em dia, não sofrem sequestro; vedadas desapropriações se estoque > 70% da RCL", "tipo": "excecao", "d": "Exceto desapropriações para saúde, educação, segurança, transporte público, saneamento e habitação de interesse social.", "ref": "Art. 103"}, {"t": "Sem liberação: sequestro pelo Presidente do TJ, responsabilidade do chefe do Executivo, retenção de FPE/FPM e de repasses estaduais", "tipo": "sancao", "d": "Enquanto durar a omissão: sem empréstimos (salvo § 2º do art. 101) e sem transferências voluntárias.", "ref": "Art. 104"}, {"t": "Compensação de precatórios com dívida ativa inscrita até 25/3/2015", "tipo": "regra", "d": "Sem vinculações; regulamentação em 120 dias a partir de 1º/1/2018, sob pena de autorização direta aos credores.", "ref": "Art. 105"}]}, {"t": "Limite de precatórios da União (EC 114/2021)", "tipo": "topico", "ref": "Art. 107-A", "filhos": [{"t": "Até 2026: teto = despesa paga em 2016 corrigida pelo IPCA", "tipo": "prazo", "d": "Espaço fiscal destinado à renda básica (art. 6º, par. único) e à seguridade.", "ref": "Art. 107-A, caput e I a III"}, {"t": "RPVs têm prioridade e são abatidas do limite", "tipo": "regra", "ref": "Art. 107-A, § 1º"}, {"t": "Não pagos: prioridade nos exercícios seguintes", "tipo": "regra", "ref": "Art. 107-A, § 2º"}, {"t": "Credor pode receber em parcela única com renúncia de 40%", "tipo": "prazo", "ref": "Art. 107-A, § 3º"}, {"t": "CNJ regulamenta a atuação dos Presidentes de Tribunais", "tipo": "competencia", "ref": "Art. 107-A, § 4º"}, {"t": "Fora do limite: §§ 11, 20 e 21 do art. 100, acordos do § 3º e atualização monetária", "tipo": "excecao", "ref": "Art. 107-A, §§ 5º–7º"}, {"t": "Ordem de pagamento", "tipo": "classificacao", "d": "1) RPV; 2) alimentares de idosos (60+), doentes graves ou PcD até 3× RPV; 3) demais alimentares até 3× RPV; 4) alimentares acima disso; 5) demais.", "ref": "Art. 107-A, § 8º"}, {"t": "Redação atual: prazo “até o fim de 2026” mantido; Planalto remete à ADI 7064", "tipo": "atencao", "d": "A EC 126/2022 só trocou, no caput, a remissão ao art. 107 (revogado) pela correção expressa (7,2% em 2017 e IPCA depois). O STF julgou a validade desse limite na ADI 7064: conferir o alcance da decisão.", "ref": "Art. 107-A (redação atual)", "ext": true}]}]}}, {"id": "cf6-nrf", "titulo": "Novo Regime Fiscal – teto de gastos (arts. 106–114)", "raiz": {"t": "Novo Regime Fiscal (EC 95/2016)", "tipo": "topico", "filhos": [{"t": "Instituição", "tipo": "topico", "ref": "Art. 106", "filhos": [{"t": "Orçamentos Fiscal e da Seguridade Social da União, por 20 exercícios", "tipo": "prazo", "ref": "Art. 106"}]}, {"t": "Limites individualizados de despesas primárias", "tipo": "topico", "ref": "Art. 107", "filhos": [{"t": "Executivo; órgãos do Judiciário; Senado, Câmara e TCU; MPU e CNMP; DPU", "tipo": "classificacao", "ref": "Art. 107, I a V"}, {"t": "2017: despesa paga em 2016 + 7,2%", "tipo": "prazo", "ref": "Art. 107, § 1º, I"}, {"t": "Exercícios seguintes: limite anterior corrigido pelo IPCA", "tipo": "prazo", "ref": "Art. 107, § 1º, II"}, {"t": "Limites próprios de Câmara, Senado, Judiciário, MP e DPU não podem superar os do art. 107", "tipo": "excecao", "ref": "Art. 107, § 2º"}, {"t": "LOA não pode exceder os valores máximos; vedado crédito suplementar ou especial que amplie a despesa", "tipo": "excecao", "ref": "Art. 107, §§ 3º–5º"}, {"t": "Fora do teto", "tipo": "classificacao", "d": "Transferências constitucionais (incl. complementação do Fundeb), créditos extraordinários, eleições, capitalização de estatais não dependentes e repasses da cessão onerosa.", "ref": "Art. 107, § 6º"}, {"t": "Executivo pode compensar excesso de outros Poderes nos 3 primeiros anos, até 0,25% do seu limite", "tipo": "prazo", "ref": "Art. 107, §§ 7º, 8º"}, {"t": "LDO pode prever compensação entre órgãos do mesmo inciso", "tipo": "regra", "ref": "Art. 107, § 9º"}, {"t": "Verificação pela despesa paga, incluídos restos a pagar", "tipo": "regra", "d": "Restos a pagar até 2015 podem ser excluídos até o excesso de resultado primário.", "ref": "Art. 107, §§ 10, 11"}, {"t": "IPCA para a LOA: realizado até junho + estimado até dezembro; ajuste no exercício seguinte", "tipo": "regra", "ref": "Art. 107, §§ 12–14"}]}, {"t": "Art. 108 revogado", "tipo": "atencao", "ref": "Art. 108"}, {"t": "Gatilhos: despesa obrigatória acima de 95% da primária", "tipo": "topico", "ref": "Art. 109", "filhos": [{"t": "Vedações até o fim do exercício", "tipo": "sancao", "d": "Aumentos de remuneração; criação de cargos; alteração de carreira com aumento de despesa; admissões (salvo reposições e temporários); concursos (salvo reposição); novos auxílios e bônus; nova despesa obrigatória; reajuste acima da inflação; aumento de benefícios indenizatórios.", "ref": "Art. 109, I a IX"}, {"t": "Ressalva: sentença transitada em julgado ou lei anterior", "tipo": "excecao", "ref": "Art. 109, I, VI, IX"}, {"t": "Vedações I, III e VI aplicam-se ao conjunto de órgãos do inciso", "tipo": "regra", "ref": "Art. 109, § 1º"}, {"t": "Se acionadas no Executivo: vedados novos subsídios e benefícios tributários", "tipo": "sancao", "ref": "Art. 109, § 2º"}, {"t": "Vedada a revisão geral anual (art. 37, X)", "tipo": "sancao", "ref": "Art. 109, § 3º"}, {"t": "Não geram obrigação de pagamento futuro; valem também para proposições", "tipo": "regra", "ref": "Art. 109, § 4º"}, {"t": "Calamidade pública nacional afasta incisos II, IV, VII, VIII e § 2º", "tipo": "excecao", "ref": "Art. 109, § 5º"}]}, {"t": "Saúde e educação: piso de 2017 corrigido pelo IPCA", "tipo": "prazo", "ref": "Art. 110"}, {"t": "Emendas individuais impositivas: montante de 2017 corrigido pelo IPCA, a partir de 2018", "tipo": "prazo", "ref": "Art. 111"}, {"t": "Não gera obrigação de pagamento futuro nem revoga metas fiscais", "tipo": "regra", "ref": "Art. 112"}, {"t": "Proposição que crie despesa obrigatória ou renúncia de receita: estimativa de impacto", "tipo": "regra", "ref": "Art. 113"}, {"t": "Tramitação suspensa por até 20 dias, a pedido de 1/5 da Casa", "tipo": "prazo", "d": "Proposições do art. 59 (exceto medidas provisórias) que aumentem despesa ou renunciem receita.", "ref": "Art. 114"}, {"t": "Teto revogado: EC 126/2022 revogou os arts. 106, 107, 109, 110, 111, 111-A, 112 e 114", "tipo": "atencao", "d": "A revogação valeu após a sanção da lei complementar do novo regime fiscal sustentável (LC 200/2023), conforme o art. 9º da EC 126/2022. O art. 113 (estimativa de impacto) continua vigente.", "ref": "EC 126/2022, art. 9º", "ext": true}]}}, {"id": "cf6-economia", "titulo": "Ordem econômica, recursos naturais, terras e consumidor (arts. 40–52, 65–68, 92, 92-A)", "raiz": {"t": "Ordem econômica e territorial no ADCT", "tipo": "topico", "filhos": [{"t": "Zona Franca de Manaus", "tipo": "topico", "ref": "Arts. 40, 92, 92-A", "filhos": [{"t": "Mantida por 25 anos com área livre de comércio e incentivos fiscais", "tipo": "prazo", "ref": "Art. 40, caput"}, {"t": "Critérios de aprovação de projetos só mudam por lei federal", "tipo": "regra", "ref": "Art. 40, parágrafo único"}, {"t": "+10 anos (art. 92) e +50 anos (art. 92-A)", "tipo": "prazo", "d": "Total de 85 anos desde 1988, ou seja, até 2073.", "ref": "Arts. 92, 92-A"}]}, {"t": "Incentivos fiscais setoriais", "tipo": "topico", "ref": "Art. 41", "filhos": [{"t": "Reavaliação pelos Executivos", "tipo": "regra", "ref": "Art. 41, caput"}, {"t": "Revogados após 2 anos se não confirmados por lei", "tipo": "prazo", "ref": "Art. 41, § 1º"}, {"t": "Ressalvados direitos adquiridos sob condição e prazo certo", "tipo": "excecao", "ref": "Art. 41, § 2º"}, {"t": "Convênios entre Estados também reavaliados", "tipo": "regra", "ref": "Art. 41, § 3º"}]}, {"t": "Irrigação por 40 anos: 20% Centro-Oeste e 50% Nordeste (preferencialmente Semiárido)", "tipo": "prazo", "d": "No mínimo 50% para projetos que beneficiem agricultores familiares.", "ref": "Art. 42"}, {"t": "Mineração e energia", "tipo": "topico", "ref": "Arts. 43–45", "filhos": [{"t": "Títulos minerários sem efeito se pesquisa/lavra não ini reza"], ["Art. 84", "Até 31/12/2004", "0,38% em 2002 e 2003", "0,20 FNS; 0,10 previdência; 0,08 FCEP"], ["Art. 90", "Até 31/12/2007", "0,38%", "Mantida a destinação do art. 84"]]}, {"titulo": "Estabilidade do art. 19 ADCT × Estabilidade do art. 41 CF", "colunas": ["Aspecto", "Art. 19 ADCT", "Art. 41 CF"], "linhas": [["Ingresso", "Sem concurso (não admitidos na forma do art. 37)", "Concurso público para cargo efetivo"], ["Requisito", "5 anos continuados de exercício em 5/10/1988", "3 anos de efetivo exercício e avaliação especial de desempenho"], ["Alcance", "Administração direta, autárquica e fundacional", "Servidores nomeados para cargo de provimento efetivo"], ["Exclusões", "Comissionados, livre exoneração e professores de nível superior", "-"], ["Efetivação", "Depende de concurso; o tempo conta como título", "Já é efetivo"]]}, {"titulo": "RPV provisória × ordem do art. 107-A", "colunas": ["Aspecto", "Art. 87 / art. 97, § 12", "Art. 107-A, § 8º"], "linhas": [["Assunto", "Teto da RPV até a lei de cada ente", "Ordem de pagamento das sentenças contra a União"], ["Valores", "40 SM (Estados/DF); 30 SM (Municípios)", "Preferências até 3× o valor da RPV"], ["Prioridade", "Acima do teto: precatório, salvo renúncia", "RPV, depois alimentares preferenciais, demais alimentares e demais"]]}], "pegadinhas": [{"texto": "A casa pode ser invadida por determinação judicial apenas durante o dia; flagrante, desastre e socorro autorizam a qualquer hora.", "ref": "Art. 5º, XI"}, {"texto": "A interceptação telefônica exige ordem judicial e só serve à investigação criminal ou instrução processual penal (não a processo civil ou administrativo).", "ref": "Art. 5º, XII"}, {"texto": "Reunião não depende de autorização, apenas de prévio aviso à autoridade competente.", "ref": "Art. 5º, XVI"}, {"texto": "Suspensão das atividades de associação exige decisão judicial; dissolução compulsória exige decisão judicial transitada em julgado.", "ref": "Art. 5º, XIX"}, {"texto": "Imprescritíveis são apenas racismo e ação de grupos armados; tortura, tráfico, terrorismo e hediondos são inafiançáveis e insuscetíveis de graça ou anistia, mas prescritíveis.", "ref": "Art. 5º, XLII–XLIV"}, {"texto": "A pena de morte é admitida em caso de guerra declarada (art. 84, XIX); as demais penas vedadas (perpétua, trabalhos forçados, banimento, cruéis) não têm exceção.", "ref": "Art. 5º, XLVII"}, {"texto": "O naturalizado pode ser extraditado por crime comum praticado ANTES da naturalização; por tráfico de entorpecentes, basta comprovado envolvimento, na forma da lei.", "ref": "Art. 5º, LI"}, {"texto": "Somente HC e HD são gratuitos por força da CF; ação popular só isenta o autor de custas e sucumbência, salvo má-fé.", "ref": "Art. 5º, LXXIII e LXXVII"}, {"texto": "O requisito de 1 ano de funcionamento para impetrar MS coletivo aplica-se à organização sindical/entidade/associação (alínea b), não ao partido político, que precisa ter representação no Congresso.", "ref": "Art. 5º, LXX"}, {"texto": "Tratados de direitos humanos equivalem a emendas se aprovados em cada Casa, em 2 turnos, por 3/5 dos votos dos respectivos membros (não maioria absoluta, nem sessão conjunta).", "ref": "Art. 5º, § 3º"}, {"texto": "Hora extra: no MÍNIMO 50% a mais; férias: PELO MENOS 1/3 a mais.", "ref": "Art. 7º, XVI e XVII"}, {"texto": "Prescrição trabalhista: 5 anos, até o limite de 2 anos após a extinção do contrato (não o inverso).", "ref": "Art. 7º, XXIX"}, {"texto": "Trabalho do menor: aprendiz a partir de 14 anos; qualquer trabalho a partir de 16; noturno, perigoso ou insalubre só a partir de 18.", "ref": "Art. 7º, XXXIII"}, {"texto": "Irredutibilidade do salário admite exceção por convenção ou acordo coletivo.", "ref": "Art. 7º, VI"}, {"texto": "Unicidade sindical: base territorial não inferior à área de um Município, definida pelos trabalhadores ou empregadores interessados (não pelo Estado).", "ref": "Art. 8º, II"}, {"texto": "Representante dos empregados é assegurado em empresas com MAIS de 200 empregados, com finalidade exclusiva de entendimento direto com o empregador.", "ref": "Art. 11"}, {"texto": "Presidente da Câmara e do Senado são privativos de nato, mas deputado e senador não; Ministro de Estado da Defesa é privativo, os demais ministros não.", "ref": "Art. 12, § 3º"}, {"texto": "Naturalização extraordinária: MAIS de 15 anos ininterruptos de residência, sem condenação penal e com requerimento; lusófonos (ordinária): 1 ano ininterrupto + idoneidade moral.", "ref": "Art. 12, II"}, {"texto": "Senador exige 35 anos (igual ao Presidente), não 30; juiz de paz exige 21 anos.", "ref": "Art. 14, § 3º, VI"}, {"texto": "Analfabetos podem votar (facultativo), mas são inelegíveis.", "ref": "Art. 14, § 1º, II, a, e § 4º"}, {"texto": "Militar com menos de 10 anos de serviço deve afastar-se; com mais de 10 é agregado e, se eleito, passa para a inatividade na diplomação.", "ref": "Art. 14, § 8º"}, {"texto": "AIME: 15 dias contados da diplomação (não da posse nem da eleição), em segredo de justiça.", "ref": "Art. 14, §§ 10–11"}, {"texto": "É vedada a CASSAÇÃO de direitos políticos; admitem-se apenas perda ou suspensão nos casos do art. 15.", "ref": "Art. 15"}, {"texto": "Lei que altera o processo eleitoral entra em vigor na publicação, mas não se aplica à eleição que ocorra até 1 ano da data de sua vigência.", "ref": "Art. 16"}, {"texto": "Coligações são vedadas nas eleições proporcionais, mas permitidas nas majoritárias; os requisitos da cláusula de desempenho são alternativos.", "ref": "Art. 17, §§ 1º e 3º"}, {"texto": "Validade do concurso é de ATÉ 2 anos, prorrogável UMA vez por IGUAL período — não necessariamente 'mais 2 anos'.", "ref": "Art. 37, III"}, {"texto": "Função de confiança é EXCLUSIVA de servidor efetivo; cargo em comissão só exige percentual MÍNIMO de servidores de carreira.", "ref": "Art. 37, V"}, {"texto": "Greve do servidor: lei ESPECÍFICA (não lei complementar).", "ref": "Art. 37, VII"}, {"texto": "Lei específica CRIA autarquia, mas apenas AUTORIZA a instituição de EP, SEM e fundação; LC define áreas das fundações.", "ref": "Art. 37, XIX"}, {"texto": "Improbidade gera SUSPENSÃO dos direitos políticos (não perda/cassação) e é sem prejuízo da ação penal.", "ref": "Art. 37, § 4º"}, {"texto": "Responsabilidade objetiva alcança PJ de direito privado PRESTADORAS de serviço público; regresso contra o agente só com dolo ou culpa.", "ref": "Art. 37, § 6º"}, {"texto": "Acumulação de dois cargos de saúde exige profissões REGULAMENTADAS e compatibilidade de horários; sempre sujeita ao teto.", "ref": "Art. 37, XVI, c"}, {"texto": "Subteto do Judiciário estadual é 90,25% do subsídio do Ministro do STF e se aplica também a MP, Procuradores e Defensores.", "ref": "Art. 37, XI"}, {"texto": "Estabilidade: 3 anos de efetivo exercício + avaliação especial de desempenho por comissão; avaliação periódica (perda do cargo) exige LEI COMPLEMENTAR.", "ref": "Art. 41, caput, §§ 1º, III, e 4º"}, {"texto": "Disponibilidade é com remuneração PROPORCIONAL ao tempo de serviço, não integral.", "ref": "Art. 41, § 3º"}, {"texto": "Recondução do ocupante da vaga é SEM direito a indenização.", "ref": "Art. 41, § 2º"}, {"texto": "Tempo de mandato eletivo conta para tudo, EXCETO promoção por merecimento.", "ref": "Art. 38, IV"}, {"texto": "Concorrente (art. 24) não inclui Municípios; Municípios suplementam (art. 30, II).", "ref": "Art. 24; art. 30, II"}, {"texto": "Lei federal superveniente de normas gerais SUSPENDE (não revoga) a lei estadual no que for contrário.", "ref": "Art. 24, § 4º"}, {"texto": "Previdência social é concorrente; seguridade social é privativa da União.", "ref": "Art. 22, XXIII; art. 24, XII"}, {"texto": "Criação de Municípios: lei ESTADUAL, no período de LC FEDERAL, com plebiscito e Estudos de Viabilidade.", "ref": "Art. 18, § 4º"}, {"texto": "Segundo turno para Prefeito só em Municípios com mais de 200 mil ELEITORES (não habitantes).", "ref": "Art. 29, II"}, {"texto": "Parecer prévio do Tribunal de Contas sobre contas do Prefeito só deixa de prevalecer por 2/3 da Câmara.", "ref": "Art. 31, § 2º"}, {"texto": "É vedada a criação de Tribunais/Conselhos de Contas Municipais; os existentes ('onde houver') permanecem.", "ref": "Art. 31, §§ 1º e 4º"}, {"texto": "Decreto de intervenção vai ao Congresso/Assembleia em 24 horas; nos casos de art. 34, VI e VII e art. 35, IV, a apreciação é dispensada.", "ref": "Art. 36, §§ 1º e 3º"}, {"texto": "Desobediência a decisão judicial: requisição do STF, STJ ou TSE; princípios sensíveis: representação do PGR provida pelo STF.", "ref": "Art. 36, II e III"}, {"texto": "Gás canalizado: competência dos Estados, vedada medida provisória para regulamentar.", "ref": "Art. 25, § 2º"}, {"texto": "Aposentadoria compulsória é com proventos PROPORCIONAIS ao tempo de contribuição (70 ou 75 anos).", "ref": "Art. 40, § 1º, II"}, {"texto": "Redução de 5 anos para professor vale para educação infantil, ensino fundamental e médio — não para o ensino superior.", "ref": "Art. 40, § 5º"}, {"texto": "Escolas de governo: União, Estados e DF (Municípios não estão no texto).", "ref": "Art. 39, § 2º"}, {"texto": "Território elege 4 Deputados, mas não elege Senadores.", "ref": "Arts. 45, § 2º, e 46"}, {"texto": "Estado de defesa e intervenção federal: o CN APROVA; estado de sítio: o CN AUTORIZA.", "ref": "Art. 49, IV"}, {"texto": "Ausência do PR/VPR do País: autorização do CN só quando EXCEDER 15 dias; sem licença, perda do cargo.", "ref": "Arts. 49, III, e 83"}, {"texto": "Pedido escrito de informação a Ministro: prazo de 30 dias; recusa, não atendimento ou informação falsa = crime de responsabilidade.", "ref": "Art. 50, § 2º"}, {"texto": "Prisão em flagrante de parlamentar: resolve a Casa pelo voto da MAIORIA de seus membros (não 2/3).", "ref": "Art. 53, § 2º"}, {"texto": "Sustação de ação penal contra parlamentar: só para crime APÓS a diplomação, por iniciativa de partido político, prazo de 45 dias improrrogáveis.", "ref": "Art. 53, §§ 3º–4º"}, {"texto": "Perda de mandato por condenação criminal transitada (inciso VI) é DECIDIDA pela Casa (maioria absoluta), não declarada pela Mesa.", "ref": "Art. 55, § 2º"}, {"texto": "Recurso contra apreciação conclusiva de comissão: 1/10 dos membros da Casa; CPI: requerimento de 1/3.", "ref": "Art. 58, §§ 2º, I, e 3º"}, {"texto": "PEC por Assembleias: MAIS DA METADE delas, cada uma por maioria RELATIVA.", "ref": "Art. 60, III"}, {"texto": "Iniciativa popular: 1% do eleitorado, em pelo menos 5 Estados, com no mínimo 0,3% em cada; apresentada à Câmara.", "ref": "Art. 61, § 2º"}, {"texto": "MP: trancamento de pauta após 45 dias; prazo de vigência 60 + 60 dias, suspenso no recesso.", "ref": "Art. 62, §§ 3º, 4º, 6º e 7º"}, {"texto": "Veto: 15 dias ÚTEIS para vetar; 48 horas para comunicar motivos; 30 dias para o CN apreciar em sessão conjunta; rejeição por maioria absoluta.", "ref": "Art. 66, §§ 1º e 4º"}, {"texto": "Projeto de lei rejeitado pode ser reapresentado na mesma sessão legislativa por maioria absoluta de qualquer Casa; PEC e MP rejeitadas, não.", "ref": "Arts. 60, § 5º; 62, § 10; 67"}, {"texto": "TCU APRECIA as contas do PR (parecer prévio em 60 dias); quem JULGA é o Congresso Nacional.", "ref": "Arts. 49, IX, e 71, I"}, {"texto": "Sustação de CONTRATO irregular é feita diretamente pelo CN; o TCU só decide se CN/Executivo ficarem inertes por 90 dias.", "ref": "Art. 71, §§ 1º–2º"}, {"texto": "Dupla vacância nos últimos 2 anos: eleição INDIRETA pelo CN em 30 dias; nos 2 primeiros anos, direta em 90 dias.", "ref": "Art. 81"}, {"texto": "Delegáveis pelo PR: só VI, XII e XXV (primeira parte), a Ministros, PGR ou AGU.", "ref": "Art. 84, p.ú."}, {"texto": "Ministro de Estado: maior de 21 anos; membros cidadãos do Conselho da República: brasileiros natos com mais de 35 anos.", "ref": "Arts. 87 e 89, VII"}, {"texto": "Recusa do juiz mais antigo na promoção: 2/3 do tribunal; remoção/disponibilidade por interesse público: maioria absoluta.", "ref": "Art. 93, II, d, e VIII"}, {"texto": "Executivo escolhe o integrante do quinto constitucional em 20 dias, a partir de lista TRÍPLICE (os órgãos de classe enviam lista SÊXTUPLA).", "ref": "Art. 94"}, {"texto": "Repercussão geral: recusa do RE só por 2/3 dos membros do STF; súmula vinculante aprovada por 2/3.", "ref": "Arts. 102, § 3º, e 103-A"}, {"texto": "ADC: apenas lei ou ato normativo FEDERAL; ADI: federal ou estadual.", "ref": "Art. 102, I, a"}, {"texto": "Governador: STJ julga crimes comuns; desembargadores e membros de TCE: STJ nos comuns e de responsabilidade.", "ref": "Art. 105, I, a"}, {"texto": "Idade máxima nos tribunais e no TCU no PDF é 'menos de 65 anos' (texto até EC 116/2022); a EC 122/2022 alterou para 'menos de 70' e também fixou esse limite para os Ministros civis do STM.", "ref": "Arts. 73, 101, 104, 107, 111-A, 115 e 123"}, {"texto": "PGR: recondução sem limite expresso; PGJ: apenas UMA recondução.", "ref": "Art. 128, §§ 1º e 3º"}, {"texto": "No estado de defesa o PR decreta e depois submete ao CN em 24h; no estado de sítio ele precisa de autorização prévia. Inverter isso é erro clássico.", "ref": "Arts. 136, § 4º, e 137"}, {"texto": "Estado de defesa: até 30 dias, prorrogável UMA vez. Sítio do art. 137, I: 30 dias por vez, sem limite expresso de prorrogações.", "ref": "Arts. 136, § 2º, e 138, § 1º"}, {"texto": "Ambos exigem maioria absoluta do CN, não maioria simples nem 3/5.", "ref": "Arts. 136, § 4º, e 137, parágrafo único"}, {"texto": "No estado de defesa a prisão não pode passar de 10 dias, salvo autorização do Poder Judiciário (não do executor).", "ref": "Art. 136, § 3º, III"}, {"texto": "A Comissão fiscalizadora tem 5 membros e é designada pela Mesa do CN, ouvidos os líderes partidários.", "ref": "Art. 140"}, {"texto": "Os Conselhos (da República e de Defesa Nacional) são “ouvidos”; quem decreta ou solicita é o Presidente da República.", "ref": "Arts. 136 e 137"}, {"texto": "Não cabe habeas corpus em relação a punições disciplinares militares.", "ref": "Art. 142, § 2º"}, {"texto": "Militar em serviço ativo não pode ser filiado a partido; sindicalização e greve são proibidas.", "ref": "Art. 142, § 3º, IV e V"}, {"texto": "Oficial condenado a pena superior a 2 anos não perde automaticamente o posto: é submetido a julgamento por tribunal militar.", "ref": "Art. 142, § 3º, VI e VII"}, {"texto": "Guardas municipais são facultativas (“poderão”) e protegem bens, serviços e instalações do Município.", "ref": "Art. 144, § 8º"}, {"texto": "PM e CBM são forças auxiliares e reserva do Exército, mas subordinam-se aos Governadores.", "ref": "Art. 144, § 6º"}, {"texto": "IR é exceção só à noventena; IPI é exceção só à anterioridade anual.", "ref": "Art. 150, § 1º"}, {"texto": "Empréstimo compulsório de investimento urgente (148, II) respeita a anterioridade; só o de calamidade/guerra é exceção.", "ref": "Arts. 148, II, e 150, § 1º"}, {"texto": "Imunidades do art. 150, VI alcançam apenas impostos.", "ref": "Art. 150, VI"}, {"texto": "IPI “será” seletivo; ICMS “poderá” ser seletivo.", "ref": "Arts. 153, § 3º, I, e 155, § 2º, III"}, {"texto": "Senado fixa alíquotas MÁXIMAS do ITCMD e MÍNIMAS do IPVA.", "ref": "Art. 155, § 1º, IV, e § 6º, I"}, {"texto": "Município que optar por fiscalizar e cobrar o ITR fica com 100%; sem opção, 50%.", "ref": "Arts. 153, § 4º, III, e 158, II"}, {"texto": "Municípios recebem 25% do ICMS e 50% do IPVA; Estados recebem 20% do imposto residual.", "ref": "Arts. 157, II, e 158, III e IV"}, {"texto": "FPE = 21,5% e FPM = 22,5% (+1% dez., +1% jul., +1% set.) de IR + IPI.", "ref": "Art. 159, I"}, {"texto": "Quem calcula as quotas dos fundos de participação é o TCU.", "ref": "Art. 161, parágrafo único"}, {"texto": "A vedação de vinculação do art. 167, IV atinge receita de IMPOSTOS, não de todos os tributos.", "ref": "Art. 167, IV"}, {"texto": "Crédito extraordinário: despesas imprevisíveis e urgentes; especial/extraordinário autorizado nos últimos 4 meses é reaberto no exercício seguinte.", "ref": "Art. 167, §§ 2º e 3º"}, {"texto": "Duodécimos até o dia 20 de cada mês (não dia 10).", "ref": "Art. 168"}, {"texto": "Ordem do art. 169: corte de 20% em comissionados → exoneração de não estáveis → perda do cargo por estáveis (com indenização).", "ref": "Art. 169, §§ 3º–5º"}, {"texto": "Plano diretor obrigatório para cidades com MAIS de 20 mil habitantes, aprovado pela Câmara Municipal.", "ref": "Art. 182, § 1º"}, {"texto": "Desapropriação urbana comum: em dinheiro; sancionatória: títulos em até 10 anos; reforma agrária: TDA em até 20 anos.", "ref": "Arts. 182, §§ 3º e 4º, e 184"}, {"texto": "Alienação de terras públicas acima de 2.500 ha exige aprovação prévia do Congresso, salvo para reforma agrária.", "ref": "Art. 188, §§ 1º e 2º"}, {"texto": "O planejamento estatal é determinante para o setor público e indicativo para o privado.", "ref": "Art. 174"}, {"texto": "Gestão da seguridade é QUADRIPARTITE (trabalhadores, empregadores, aposentados e Governo), não tripartite.", "ref": "Art. 194, parágrafo único, VII"}, {"texto": "Contribuições da seguridade: anterioridade de 90 dias, mas NÃO se aplica a anterioridade do exercício (art. 150, III, b).", "ref": "Art. 195, § 6º"}, {"texto": "Moratória e parcelamento das contribuições sobre folha e do trabalhador: vedados acima de 60 meses.", "ref": "Art. 195, § 11"}, {"texto": "Bases de cálculo diferenciadas só para receita/faturamento e lucro (alíneas b e c), não para a folha.", "ref": "Art. 195, § 9º"}, {"texto": "União aplica em saúde no mínimo 15% da receita CORRENTE LÍQUIDA; em educação, 18% da receita de IMPOSTOS.", "ref": "Arts. 198, § 2º, I, e 212"}, {"texto": "Recursos públicos não podem subvencionar instituições privadas de saúde COM fins lucrativos; participação complementar no SUS dá preferência a filantrópicas e sem fins lucrativos.", "ref": "Art. 199, §§ 1º e 2º"}, {"texto": "Mulher se aposenta no RGPS aos 62 anos (regra geral), não 60; rural: 60 (H) e 55 (M).", "ref": "Art. 201, § 7º"}, {"texto": "Redução de 5 anos do professor vale só para educação infantil, fundamental e médio — não para o ensino superior.", "ref": "Art. 201, § 8º"}, {"texto": "Critérios diferenciados por exposição a agentes nocivos: vedada caracterização por categoria profissional ou ocupação.", "ref": "Art. 201, § 1º, II"}, {"texto": "Salário-família e auxílio-reclusão são para dependentes de segurados de BAIXA RENDA.", "ref": "Art. 201, IV"}, {"texto": "Patrocinador público de previdência privada: contribuição normal NUNCA pode exceder a do segurado.", "ref": "Art. 202, § 3º"}, {"texto": "Assistência social independe de contribuição; benefício de 1 salário mínimo para pessoa com deficiência e idoso sem meios.", "ref": "Art. 203, V"}, {"texto": "Educação básica obrigatória: dos 4 aos 17 anos; educação infantil: até 5 anos.", "ref": "Art. 208, I e IV"}, {"texto": "Gestão democrática é princípio do ensino PÚBLICO, não de todo o ensino.", "ref": "Art. 206, VI"}, {"texto": "Ensino religioso é de matrícula FACULTATIVA, mas integra os horários normais das escolas públicas de ensino fundamental.", "ref": "Art. 210, § 1º"}, {"texto": "Municípios: prioridade no fundamental e na educação infantil; Estados/DF: fundamental e médio.", "ref": "Art. 211, §§ 2º e 3º"}, {"texto": "Fundeb: 20% dos impostos; complementação da União de no MÍNIMO 23%; ≥ 70% para pagamento de profissionais.", "ref": "Art. 212-A, II, V e XI"}, {"texto": "Vinculação do art. 212 pode suportar no MÁXIMO 30% da complementação da União ao Fundeb; salário-educação não pode ser usado nela.", "ref": "Art. 212-A, VIII e XIII"}, {"texto": "PNE é decenal; Plano Nacional de Cultura é plurianual.", "ref": "Arts. 214 e 215, § 3º"}, {"texto": "Justiça desportiva: 60 dias para decisão final; o Judiciário só admite ações sobre disciplina e competições após esgotá-la.", "ref": "Art. 217, §§ 1º e 2º"}, {"texto": "Não renovação de concessão de rádio/TV exige 2/5 do Congresso em votação nominal; cancelamento antes do prazo exige decisão judicial.", "ref": "Art. 223, §§ 2º e 4º"}, {"texto": "Propriedade de empresa jornalística: brasileiros natos ou naturalizados há mais de 10 anos; ≥ 70% do capital total e votante.", "ref": "Art. 222"}, {"texto": "Cerrado e Caatinga não estão no rol de patrimônio nacional do art. 225, § 4º.", "ref": "Art. 225, § 4º"}, {"texto": "Gratuidade de transporte coletivo urbano: maiores de 65 anos (não 60).", "ref": "Art. 230, § 2º"}, {"texto": "Aproveitamento de recursos hídricos e mineração em terras indígenas exige autorização do Congresso Nacional, ouvidas as comunidades.", "ref": "Art. 231, § 3º"}, {"texto": "Serventia notarial não pode ficar vaga sem concurso por mais de 6 meses.", "ref": "Art. 236, § 3º"}, {"texto": "Os 14 anos do art. 227, § 3º, I não autorizam qualquer trabalho: pelo art. 7º, XXXIII, abaixo de 16 anos só como aprendiz (a partir de 14), e trabalho noturno, perigoso ou insalubre só a partir de 18.", "ref": "Art. 227, § 3º, I; art. 7º, XXXIII"}, {"texto": "O plebiscito do art. 2º previa 7 de setembro de 1993 e abrangia forma (república × monarquia constitucional) e sistema (parlamentarismo × presidencialismo), não regime de governo.", "ref": "Art. 2º"}, {"texto": "A revisão constitucional exigia maioria absoluta em sessão unicameral, não 3/5 em dois turnos em cada Casa.", "ref": "Art. 3º"}, {"texto": "O art. 19 exige 5 anos continuados de exercício na data da promulgação, e não 5 anos de serviço em qualquer época.", "ref": "Art. 19"}, {"texto": "O art. 19 abrange administração direta, autárquica e fundações públicas; empresas públicas e sociedades de economia mista ficam de fora.", "ref": "Art. 19, caput"}, {"texto": "A estabilidade do art. 19 não se aplica a cargos em comissão, funções de confiança, livre exoneração nem professores de nível superior.", "ref": "Art. 19, §§ 2º e 3º"}, {"texto": "No art. 19, o tempo de serviço conta como título em concurso para efetivação; o servidor não se torna efetivo automaticamente.", "ref": "Art. 19, § 1º"}, {"texto": "O art. 17 afasta expressamente o direito adquirido a remunerações acima dos limites da CF.", "ref": "Art. 17"}, {"texto": "Estabilidade provisória da gestante no ADCT: da confirmação da gravidez até 5 meses após o parto, e não da concepção nem 120 dias.", "ref": "Art. 10, II, b"}, {"texto": "Cipeiro: estabilidade do registro da candidatura até 1 ano após o fim do mandato, e só para o eleito para cargo de direção.", "ref": "Art. 10, II, a"}, {"texto": "Licença-paternidade transitória: 5 dias, não 20.", "ref": "Art. 10, § 1º"}, {"texto": "A Assembleia Legislativa tinha 1 ano para a Constituição estadual; a Câmara Municipal tinha 6 meses após ela para a Lei Orgânica.", "ref": "Art. 11"}, {"texto": "O STJ foi instalado sob a Presidência do STF, e não do TFR.", "ref": "Art. 27, caput"}, {"texto": "O ADCT criou 5 TRFs originalmente e depois mais 4 (6ª a 9ª Regiões); a 6ª tem sede em Curitiba, não em Belo Horizonte (7ª).", "ref": "Art. 27, §§ 6º e 11"}, {"texto": "A opção dos Procuradores da República entre MPF e AGU é irretratável.", "ref": "Art. 29, § 2º"}, {"texto": "Quilombolas: o ADCT reconhece a propriedade definitiva, e não mera posse ou usufruto, como ocorre com os indígenas (art. 231).", "ref": "Art. 68"}, {"texto": "Demarcação de terras indígenas: prazo de 5 anos (art. 67); demarcação de divisas litigiosas entre Estados e Municípios: 3 anos (art. 12, § 2º).", "ref": "Arts. 67 e 12"}, {"texto": "Zona Franca de Manaus: 25 anos (art. 40) + 10 (art. 92) + 50 (art. 92-A).", "ref": "Arts. 40, 92, 92-A"}, {"texto": "RPV provisória: 40 SM para Estados e DF e 30 SM para Municípios; não inverter.", "ref": "Art. 87"}, {"texto": "Novo Regime Fiscal: 20 exercícios; em 2017 a base foi a despesa de 2016 corrigida em 7,2%, e não pelo IPCA.", "ref": "Arts. 106, 107, § 1º"}, {"texto": "Gatilho do art. 109: despesa obrigatória primária acima de 95% da despesa primária total.", "ref": "Art. 109"}, {"texto": "A suspensão do art. 114 é de até 20 dias, a pedido de 1/5 dos membros da Casa, e não alcança medidas provisórias.", "ref": "Art. 114"}, {"texto": "No acordo direto do art. 102, § 1º, a redução máxima é de 40%; no art. 107-A, § 3º, há renúncia de 40% para receber em parcela única.", "ref": "Arts. 102, § 1º; 107-A, § 3º"}, {"texto": "Seringueiros: pensão de 2 salários mínimos (art. 54) e indenização única de R$ 25.000 (art. 54-A).", "ref": "Arts. 54, 54-A"}, {"texto": "Limite transitório com pessoal: 65% das receitas correntes (art. 38), e não 50% ou 60% da RCL.", "ref": "Art. 38"}, {"texto": "O FSE não podia ser regulado por medida provisória.", "ref": "Art. 73"}], "erros_frequentes": [{"texto": "Confundir fundamentos (art. 1º, substantivos) com objetivos (art. 3º, verbos) e princípios internacionais (art. 4º).", "ref": "Arts. 1º, 3º e 4º"}, {"texto": "Achar que o Ministério Público ou o Tribunal de Contas compõem os Poderes do art. 2º.", "ref": "Art. 2º"}, {"texto": "Usar habeas data para obter informações de terceiros ou de interesse geral (cabe direito de informação/MS).", "ref": "Art. 5º, XXXIII e LXXII"}, {"texto": "Supor que a ação popular pode ser proposta por qualquer pessoa ou por pessoa jurídica; o texto exige cidadão.", "ref": "Art. 5º, LXXIII"}, {"texto": "Achar que a lei ordinária pode criar inelegibilidades; o § 9º exige lei complementar.", "ref": "Art. 14, § 9º"}, {"texto": "Pensar que o rol dos direitos fundamentais é taxativo; o § 2º do art. 5º admite outros decorrentes do regime, princípios e tratados.", "ref": "Art. 5º, § 2º"}, {"texto": "Considerar que todos os incisos do art. 7º se aplicam aos domésticos; o parágrafo único lista quais.", "ref": "Art. 7º, parágrafo único"}, {"texto": "Atribuir a perda de mandato por infidelidade partidária a cargos majoritários; o § 6º só fala em Deputados e Vereadores.", "ref": "Art. 17, § 6º"}, {"texto": "Achar que a Capital Federal é o DF; o texto diz que Brasília é a Capital.", "ref": "Art. 18, § 1º"}, {"texto": "Confundir competência exclusiva (art. 21, administrativa) com privativa (art. 22, legislativa e delegável).", "ref": "Arts. 21 e 22"}, {"texto": "Afirmar que a União pode intervir em Municípios de Estados; só nos localizados em Território Federal.", "ref": "Art. 35, caput"}, {"texto": "Pensar que o § 6º do art. 37 cobre empresas estatais exploradoras de atividade econômica.", "ref": "Art. 37, § 6º"}, {"texto": "Achar que o estável só perde o cargo por sentença transitada em julgado; há também PAD e avaliação periódica.", "ref": "Art. 41, § 1º"}, {"texto": "Supor que verbas indenizatórias entram no teto remuneratório.", "ref": "Art. 37, § 11"}, {"texto": "Confundir regiões do art. 43 (União) com regiões metropolitanas do art. 25, § 3º (Estados, por LC).", "ref": "Arts. 25, § 3º, e 43"}, {"texto": "Achar que servidor em mandato federal/estadual pode optar pela remuneração; a opção é só para Prefeito (e Vereador sem compatibilidade).", "ref": "Art. 38"}, {"texto": "Achar que o subsídio dos parlamentares é fixado por lei: é por decreto legislativo (competência exclusiva do CN, art. 49, VII). Lei (art. 48, XV) é para o subsídio dos Ministros do STF.", "ref": "Arts. 48, XV, e 49, VII"}, {"texto": "Confundir quóruns: LC = maioria absoluta; LO = maioria simples; EC = 3/5 em 2 turnos; rejeição de veto = maioria absoluta em sessão conjunta.", "ref": "Arts. 47, 60, § 2º, 66, § 4º, 69"}, {"texto": "Afirmar que o voto obrigatório é cláusula pétrea: o rol protege o voto direto, secreto, universal e periódico.", "ref": "Art. 60, § 4º, II"}, {"texto": "Pensar que MP não pode tratar de direito civil: a vedação é para processual civil.", "ref": "Art. 62, § 1º, I, b"}, {"texto": "Supor que a Câmara julga o PR: ela só autoriza (2/3); o Senado julga crimes de responsabilidade e o STF as infrações comuns.", "ref": "Arts. 51, I, 52, I, e 86"}, {"texto": "Incluir a Mesa do Congresso Nacional ou Prefeitos entre os legitimados da ADI.", "ref": "Art. 103"}, {"texto": "Acreditar que CNJ e CNMP têm a mesma composição numérica: CNJ 15, CNMP 14.", "ref": "Arts. 103-B e 130-A"}, {"texto": "Pensar que o AGU depende de aprovação do Senado: é de livre nomeação pelo PR.", "ref": "Art. 131, § 1º"}, {"texto": "Entender que o MP pode fazer representação judicial de entidades públicas: é vedado.", "ref": "Art. 129, IX"}, {"texto": "Confundir competência do STF (extradição) com a do STJ (homologação de sentença estrangeira e exequatur).", "ref": "Arts. 102, I, g, e 105, I, i"}, {"texto": "Achar que o estado de defesa pode abranger todo o território nacional: ele é restrito a locais determinados.", "ref": "Art. 136, caput"}, {"texto": "Confundir as medidas do estado de defesa (restrições) com as do sítio (busca e apreensão, requisição, suspensão da reunião).", "ref": "Arts. 136, § 1º, e 139"}, {"texto": "Considerar que contribuições sociais podem ser instituídas por Estados: a regra é competência exclusiva da União, salvo contribuição de RPPS e COSIP.", "ref": "Arts. 149 e 149-A"}, {"texto": "Pensar que imposto residual pode ser criado por lei ordinária ou medida provisória: exige lei complementar.", "ref": "Art. 154, I"}, {"texto": "Supor que a anterioridade nonagesimal substitui a anual: ambas se aplicam juntas.", "ref": "Art. 150, III, c"}, {"texto": "Achar que a União pode conceder isenção de ISS ou ICMS: vedada a isenção heterônoma.", "ref": "Art. 151, III"}, {"texto": "Esquecer que empresas públicas e sociedades de economia mista dispensam autorização na LDO para aumentos de pessoal.", "ref": "Art. 169, § 1º, II"}, {"texto": "Confundir emendas individuais (1,2%) com de bancada (1%).", "ref": "Art. 166, §§ 11 e 12"}, {"texto": "Acreditar que a pequena propriedade é sempre insuscetível de reforma agrária: exige que o proprietário não possua outra.", "ref": "Art. 185, I"}, {"texto": "Confundir área da usucapião urbana (250 m²) com rural (50 ha).", "ref": "Arts. 183 e 191"}, {"texto": "Confundir “seletividade e distributividade” (objetivo da seguridade) com universalidade.", "ref": "Art. 194, parágrafo único, III"}, {"texto": "Achar que a contribuição do trabalhador incide sobre aposentadoria e pensão do RGPS.", "ref": "Art. 195, II"}, {"texto": "Dizer que a assistência social é financiada por contribuição do beneficiário.", "ref": "Art. 203, caput"}, {"texto": "Atribuir autonomia financeira plena às universidades: o texto fala em autonomia de “gestão financeira e patrimonial”.", "ref": "Art. 207"}, {"texto": "Supor que a vinculação de 0,5% (assistência/cultura) é obrigatória ou alcança Municípios: é faculdade de Estados e DF.", "ref": "Arts. 204, parágrafo único, e 216, § 6º"}, {"texto": "Afirmar que a responsabilidade ambiental penal só alcança pessoas físicas.", "ref": "Art. 225, § 3º"}, {"texto": "Confundir remoção de índios por catástrofe/epidemia (ad referendum do CN) com interesse da soberania (após deliberação do CN).", "ref": "Art. 231, § 5º"}, {"texto": "Afirmar que a previdência complementar é obrigatória.", "ref": "Art. 202, caput"}, {"texto": "Achar que o ADCT tem hierarquia inferior à parte permanente da CF; suas normas são constitucionais.", "ref": "ADCT"}, {"texto": "Confundir a estabilidade do art. 19 (sem concurso, excepcional) com efetividade no cargo.", "ref": "Art. 19"}, {"texto": "Supor que o art. 18 manteve estabilidades dadas sem concurso após a instalação da Constituinte; ele extinguiu seus efeitos.", "ref": "Art. 18"}, {"texto": "Trocar os percentuais mínimos de saúde do art. 77: Estados 12%, Municípios 15%.", "ref": "Art. 77, II e III"}, {"texto": "Esquecer que a DRU da União não alcança o salário-educação nem as contribuições sociais da seguridade.", "ref": "Art. 76, §§ 2º e 4º"}, {"texto": "Confundir os percentuais de complementação do Fundeb (12% no 1º ano até 23% no 6º).", "ref": "Art. 60"}], "relacoes": [{"texto": "Art. 5º, VIII ↔ art. 15, IV: a recusa de obrigação a todos imposta e de prestação alternativa leva à perda/suspensão dos direitos políticos.", "ext": false}, {"texto": "Art. 15, V remete ao art. 37, § 4º (improbidade administrativa: suspensão dos direitos políticos, perda da função, indisponibilidade de bens e ressarcimento).", "ext": false}, {"texto": "Art. 5º, XLVII, a remete ao art. 84, XIX (competência do Presidente para declarar guerra).", "ext": false}, {"texto": "Art. 12, § 4º, I ↔ art. 15, I: o cancelamento da naturalização gera a perda da nacionalidade (art. 12, § 4º, I) e é hipótese de perda/suspensão dos direitos políticos quando por sentença transitada em julgado (art. 15, I).", "ext": false}, {"texto": "Para o servidor público (IFPA), o direito de greve e de sindicalização do servidor civil está no art. 37, VI e VII; os arts. 8º e 9º tratam do trabalhador em geral. O art. 39, § 3º manda aplicar ao servidor parte dos incisos do art. 7º.", "ext": true}, {"texto": "Lei 12.016/2009 (MS), Lei 13.300/2016 (MI), Lei 9.507/1997 (HD), Lei 4.717/1965 (ação popular) e LC 64/1990 (inelegibilidades) regulamentam dispositivos desta parte.", "ext": true}, {"texto": "Art. 5º, LXXIX (proteção de dados) relaciona-se com a LGPD (Lei 13.709/2018) e com o art. 5º, XXXIII e a Lei de Acesso à Informação (Lei 12.527/2011).", "ext": true}, {"texto": "Lei 8.112/1990: estágio probatório, PAD, reintegração, recondução, disponibilidade e aproveitamento desenvolvem os arts. 37 a 41.", "ext": true}, {"texto": "Lei 8.429/1992 (com Lei 14.230/2021): regulamenta as sanções de improbidade do art. 37, § 4º.", "ext": true}, {"texto": "Lei 14.133/2021: normas gerais de licitação (art. 22, XXVII c/c art. 37, XXI).", "ext": true}, {"texto": "Lei 7.783/1989 aplicada à greve do servidor por decisão do STF (MIs 670, 708 e 712) enquanto não editada a lei específica do art. 37, VII.", "ext": true}, {"texto": "Súmula Vinculante 13 (nepotismo) concretiza moralidade e impessoalidade.", "ext": true}, {"texto": "EC 103/2019: regras de transição e requisitos dos servidores federais complementam o art. 40.", "ext": true}, {"texto": "Art. 169, § 4º, CF: perda do cargo do estável por excesso de despesa com pessoal (fora desta parte).", "ext": true}, {"texto": "Art. 84, X, e art. 49, IV, CF: Presidente decreta a intervenção federal; Congresso a aprova ou suspende.", "ext": true}, {"texto": "Relação com o Título V (estado de defesa, sítio) e Título III (intervenção federal): o CN aprova/autoriza (art. 49, IV) e os Conselhos opinam (arts. 90 e 91).", "ext": false}, {"texto": "Art. 37, XI e art. 39, § 4º (Título III): teto e subsídio são referidos na fixação de subsídios de parlamentares, PR, Ministros, magistrados e membros do MP/AGU/Defensoria (arts. 49, 93, V, 128, § 5º, I, c, 135).", "ext": false}, {"texto": "Art. 5º, LXXIV (Título II): a Defensoria Pública concretiza a assistência jurídica integral e gratuita (art. 134).", "ext": false}, {"texto": "Lei nº 1.079/1950 define os crimes de responsabilidade e o processo de impeachment (art. 85, p.ú.).", "ext": true}, {"texto": "Lei nº 9.868/1999 (ADI/ADC) e Lei nº 9.882/1999 (ADPF) regulamentam o controle concentrado; Lei nº 11.417/2006 regula a súmula vinculante.", "ext": true}, {"texto": "Lei nº 8.443/1992 (Lei Orgânica do TCU) detalha as competências do art. 71.", "ext": true}, {"texto": "Para o servidor do IFPA: TCU aprecia, para registro, admissões e aposentadorias (art. 71, III) e julga contas de gestores; regime jurídico e criação de cargos dependem de lei de iniciativa privativa do PR (art. 61, § 1º, II, a e c) – base da Lei 8.112/90.", "ext": true}, {"texto": "Art. 37, XVI, “c” (acumulação de cargos de saúde) é ressalva para militares que assumem cargos civis.", "ext": false}, {"texto": "Art. 62 (medida provisória) é o veículo para abertura de crédito extraordinário (art. 167, § 3º).", "ext": false}, {"texto": "Arts. 198, § 2º, e 212 (mínimos de saúde e educação) são ressalvas à não vinculação de impostos.", "ext": false}, {"texto": "Art. 195 (seguridade social) – contribuições sociais e anterioridade de 90 dias do § 6º referida no art. 149.", "ext": false}, {"texto": "Lei de Responsabilidade Fiscal (LC 101/2000) é a lei complementar que fixa os limites de despesa com pessoal do art. 169 e normas de finanças do art. 163.", "ext": true}, {"texto": "Código Tributário Nacional (Lei 5.172/1966) cumpre o papel de lei complementar de normas gerais do art. 146, III.", "ext": true}, {"texto": "Estatuto da Cidade (Lei 10.257/2001) é a lei federal de diretrizes da política urbana dos arts. 182 e 183.", "ext": true}, {"texto": "A EC 132/2023 (Reforma Tributária) alterou profundamente os arts. 145–162 e criou IBS/CBS; este PDF é anterior a ela.", "ext": true}, {"texto": "Lei 13.303/2016 (Estatuto das Estatais) regulamenta o art. 173, § 1º.", "ext": true}, {"texto": "Educação no Título VIII × competência comum do art. 23: o CAQ é pactuado na forma do art. 23, parágrafo único (art. 211, § 7º).", "ext": false}, {"texto": "Art. 201, § 16 remete à idade máxima de aposentadoria compulsória do art. 40, § 1º, II (servidores – RPPS).", "ext": false}, {"texto": "Art. 248 vincula benefícios pagos pelo órgão do RGPS ao teto remuneratório do art. 37, XI.", "ext": false}, {"texto": "Art. 247 complementa o art. 41, § 1º, III e o art. 169, § 7º (perda do cargo do servidor estável).", "ext": false}, {"texto": "Para o IFPA (educação profissional e tecnológica): art. 213, § 2º prevê apoio financeiro público a pesquisa, extensão e inovação dessas instituições; art. 207, § 2º estende a autonomia às instituições de pesquisa científica e tecnológica.", "ext": false}, {"texto": "Leis que regulamentam o Título VIII: Lei 8.080/90 (SUS), Lei 8.213/91 (benefícios do RGPS), Lei 8.742/93 (LOAS), Lei 9.394/96 (LDB), Lei 14.113/2020 (Fundeb), Lei 8.069/90 (ECA), Lei 10.741/2003 (Estatuto da Pessoa Idosa).", "ext": true}, {"texto": "Art. 19 ADCT × art. 37, II e art. 41 da CF: exceção transitória à exigência de concurso e às regras gerais de estabilidade."}, {"texto": "Art. 10 ADCT × art. 7º da CF: proteções provisórias até a lei complementar contra dispensa arbitrária (art. 7º, I) e a lei da licença-paternidade (art. 7º, XIX)."}, {"texto": "Arts. 33, 78, 86, 87, 97, 101–105 e 107-A × art. 100 da CF: regimes transitórios do pagamento de precatórios."}, {"texto": "Arts. 106–114 × arts. 165–169 da CF: Novo Regime Fiscal limita a execução orçamentária federal."}, {"texto": "Art. 68 ADCT × arts. 215 e 216 da CF: proteção às comunidades quilombolas; Decreto 4.887/2003 regulamenta a titulação.", "ext": true}, {"texto": "Art. 48 ADCT originou a Lei 8.078/1990 (Código de Defesa do Consumidor).", "ext": true}, {"texto": "Arts. 60 e 60-A × art. 212-A da CF (Fundeb permanente, EC 108/2020).", "ext": true}], "perguntas": [{"p": "Quais são os fundamentos da República Federativa do Brasil?", "r": "Soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa e pluralismo político.", "ref": "Art. 1º, I–V"}, {"p": "Como o povo exerce o poder segundo a CF?", "r": "Por meio de representantes eleitos ou diretamente, nos termos da Constituição.", "ref": "Art. 1º, parágrafo único"}, {"p": "Quais são os objetivos fundamentais da República?", "r": "Construir sociedade livre, justa e solidária; garantir o desenvolvimento nacional; erradicar a pobreza e a marginalização e reduzir as desigualdades sociais e regionais; promover o bem de todos, sem preconceitos.", "ref": "Art. 3º"}, {"p": "A concessão de asilo político é fundamento ou princípio das relações internacionais?", "r": "Princípio das relações internacionais (art. 4º, X).", "ref": "Art. 4º, X"}, {"p": "Quando se pode entrar na casa de alguém sem consentimento do morador?", "r": "Em flagrante delito, desastre ou para prestar socorro (a qualquer hora) e, durante o dia, por determinação judicial.", "ref": "Art. 5º, XI"}, {"p": "Qual sigilo pode ser quebrado por ordem judicial para investigação criminal, segundo o texto do inciso XII?", "r": "O das comunicações telefônicas (\"no último caso\"), nas hipóteses e forma da lei, para investigação criminal ou instrução processual penal.", "ref": "Art. 5º, XII"}, {"p": "Quais são as garantias do Tribunal do Júri?", "r": "Plenitude de defesa, sigilo das votações, soberania dos veredictos e competência para crimes dolosos contra a vida.", "ref": "Art. 5º, XXXVIII"}, {"p": "Quais crimes são imprescritíveis?", "r": "Racismo e ação de grupos armados, civis ou militares, contra a ordem constitucional e o Estado Democrático.", "ref": "Art. 5º, XLII e XLIV"}, {"p": "Quais penas são vedadas pela CF?", "r": "De morte (salvo guerra declarada), de caráter perpétuo, de trabalhos forçados, de banimento e cruéis.", "ref": "Art. 5º, XLVII"}, {"p": "Em que casos o brasileiro naturalizado pode ser extraditado?", "r": "Crime comum praticado antes da naturalização ou comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei.", "ref": "Art. 5º, LI"}, {"p": "Quais prisões civis por dívida o texto ressalva?", "r": "A do responsável pelo inadimplemento voluntário e inescusável de obrigação alimentícia e a do depositário infiel (esta última afastada pelo STF – SV 25).", "ref": "Art. 5º, LXVII"}, {"p": "Quem pode impetrar mandado de segurança coletivo?", "r": "Partido político com representação no Congresso Nacional; organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa de seus membros/associados.", "ref": "Art. 5º, LXX"}, {"p": "Quando cabe mandado de injunção?", "r": "Quando a falta de norma regulamentadora torne inviável o exercício dos direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania.", "ref": "Art. 5º, LXXI"}, {"p": "Para que serve o habeas data?", "r": "Para assegurar o conhecimento de informações relativas à pessoa do impetrante em registros/bancos de dados governamentais ou de caráter público e para retificar dados quando não se prefira processo sigiloso.", "ref": "Art. 5º, LXXII"}, {"p": "Quem pode propor ação popular e o que ela visa?", "r": "Qualquer cidadão, para anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural.", "ref": "Art. 5º, LXXIII"}, {"p": "Quais ações são gratuitas por força direta do art. 5º, LXXVII?", "r": "Habeas corpus e habeas data (e, na forma da lei, os atos necessários ao exercício da cidadania).", "ref": "Art. 5º, LXXVII"}, {"p": "Qual o rito para um tratado de direitos humanos equivaler a emenda constitucional?", "r": "Aprovação em cada Casa do Congresso, em dois turnos, por três quintos dos votos dos respectivos membros.", "ref": "Art. 5º, § 3º"}, {"p": "Qual a aplicabilidade das normas definidoras de direitos e garantias fundamentais?", "r": "Aplicação imediata.", "ref": "Art. 5º, § 1º"}, {"p": "Quais são os direitos sociais do art. 6º?", "r": "Educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, proteção à maternidade e à infância e assistência aos desamparados.", "ref": "Art. 6º"}, {"p": "Qual a jornada normal e o adicional mínimo de hora extra?", "r": "Até 8 horas diárias e 44 semanais; hora extra no mínimo 50% superior à normal.", "ref": "Art. 7º, XIII e XVI"}, {"p": "Qual a duração da licença à gestante e o mínimo do aviso prévio?", "r": "120 dias; aviso prévio proporcional, no mínimo 30 dias.", "ref": "Art. 7º, XVIII e XXI"}, {"p": "Qual o prazo prescricional dos créditos trabalhistas?", "r": "Cinco anos, até o limite de dois anos após a extinção do contrato de trabalho.", "ref": "Art. 7º, XXIX"}, {"p": "Até quando dura a estabilidade do dirigente sindical?", "r": "Desde o registro da candidatura e, se eleito (inclusive suplente), até um ano após o final do mandato, salvo falta grave.", "ref": "Art. 8º, VIII"}, {"p": "Quem decide sobre a oportunidade do exercício do direito de greve?", "r": "Os trabalhadores; a lei define serviços essenciais e atendimento das necessidades inadiáveis.", "ref": "Art. 9º"}, {"p": "Quais os cargos privativos de brasileiro nato?", "r": "Presidente e Vice da República, Presidente da Câmara, Presidente do Senado, Ministro do STF, carreira diplomática, oficial das Forças Armadas e Ministro de Estado da Defesa.", "ref": "Art. 12, § 3º"}, {"p": "Quais os requisitos da naturalização extraordinária?", "r": "Estrangeiro residente no Brasil há mais de 15 anos ininterruptos, sem condenação penal, que requeira a nacionalidade.", "ref": "Art. 12, II, b"}, {"p": "Quais são os símbolos da República?", "r": "Bandeira, hino, armas e selo nacionais.", "ref": "Art. 13, § 1º"}, {"p": "Para quem o voto é facultativo?", "r": "Analfabetos, maiores de setenta anos e maiores de dezesseis e menores de dezoito anos.", "ref": "Art. 14, § 1º, II"}, {"p": "Qual a idade mínima para Governador e para Vereador?", "r": "30 anos para Governador e Vice; 18 anos para Vereador.", "ref": "Art. 14, § 3º, VI"}, {"p": "Até quando o Prefeito deve renunciar para concorrer a outro cargo?", "r": "Até seis meses antes do pleito.", "ref": "Art. 14, § 6º"}, {"p": "Qual o prazo da ação de impugnação de mandato eletivo?", "r": "Quinze dias contados da diplomação.", "ref": "Art. 14, § 10"}, {"p": "Em quais casos há perda ou suspensão dos direitos políticos?", "r": "Cancelamento da naturalização por sentença transitada em julgado; incapacidade civil absoluta; condenação criminal transitada em julgado enquanto durarem seus efeitos; recusa de obrigação a todos imposta ou prestação alternativa; improbidade administrativa.", "ref": "Art. 15"}, {"p": "Quais partidos têm acesso ao fundo partidário e ao rádio e TV gratuitos?", "r": "Os que obtiverem 3% dos votos válidos para a Câmara em pelo menos 1/3 das UFs, com mínimo de 2% em cada, ou elegerem ao menos 15 Deputados Federais em 1/3 das UFs.", "ref": "Art. 17, § 3º"}, {"p": "Onde os partidos registram seus estatutos?", "r": "No Tribunal Superior Eleitoral, após adquirirem personalidade jurídica na forma da lei civil.", "ref": "Art. 17, § 2º"}, {"p": "Quais os princípios expressos da Administração Pública?", "r": "Legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE).", "ref": "Art. 37, caput"}, {"p": "Qual o prazo de validade do concurso público?", "r": "Até 2 anos, prorrogável uma vez por igual período.", "ref": "Art. 37, III"}, {"p": "Quem pode exercer funções de confiança?", "r": "Exclusivamente servidores ocupantes de cargo efetivo; destinam-se a direção, chefia e assessoramento.", "ref": "Art. 37, V"}, {"p": "Quais as hipóteses de acumulação remunerada de cargos públicos?", "r": "Com compatibilidade de horários e respeitado o teto: dois de professor; um de professor com outro técnico ou científico; dois privativos de profissionais de saúde com profissões regulamentadas. (Redação do PDF; a EC 138/2025 mudou a alínea b para 'professor com outro de qualquer natureza'.)", "ref": "Art. 37, XVI"}, {"p": "Qual o teto remuneratório nos Municípios e no Executivo estadual?", "r": "Municípios: subsídio do Prefeito; Executivo estadual: subsídio do Governador (teto geral: Ministro do STF).", "ref": "Art. 37, XI"}, {"p": "Quais as consequências constitucionais da improbidade?", "r": "Suspensão dos direitos políticos, perda da função pública, indisponibilidade dos bens e ressarcimento ao erário, na forma e gradação da lei, sem prejuízo da ação penal.", "ref": "Art. 37, § 4º"}, {"p": "Quem responde objetivamente pelos danos causados por agentes a terceiros?", "r": "PJ de direito público e PJ de direito privado prestadoras de serviços públicos, com regresso contra o agente em caso de dolo ou culpa.", "ref": "Art. 37, § 6º"}, {"p": "O que acontece com o tempo de serviço do servidor afastado para mandato eletivo?", "r": "Conta para todos os efeitos legais, exceto promoção por merecimento.", "ref": "Art. 38, IV"}, {"p": "Quem é remunerado obrigatoriamente por subsídio?", "r": "Membro de Poder, detentor de mandato eletivo, Ministros de Estado e Secretários Estaduais e Municipais, em parcela única.", "ref": "Art. 39, § 4º"}, {"p": "Quais as idades da aposentadoria voluntária na União?", "r": "62 anos (mulher) e 65 anos (homem), com tempo de contribuição e demais requisitos em LC.", "ref": "Art. 40, § 1º, III"}, {"p": "Em quais casos pode haver requisitos diferenciados de aposentadoria no RPPS?", "r": "Servidor com deficiência (§ 4º-A), policiais e agentes penitenciários/socioeducativos (§ 4º-B), exposição a agentes nocivos (§ 4º-C) e professor (§ 5º).", "ref": "Art. 40, §§ 4º a 5º"}, {"p": "O que é o abono de permanência?", "r": "Valor até o da contribuição previdenciária, pago ao servidor que cumpriu os requisitos da voluntária e permanece em atividade, até a compulsória.", "ref": "Art. 40, § 19"}, {"p": "Quais os requisitos da estabilidade?", "r": "Cargo efetivo por concurso, 3 anos de efetivo exercício e avaliação especial de desempenho por comissão.", "ref": "Art. 41, caput e § 4º"}, {"p": "Em que hipóteses o servidor estável perde o cargo (art. 41)?", "r": "Sentença transitada em julgado; PAD com ampla defesa; avaliação periódica de desempenho na forma de LC, com ampla defesa.", "ref": "Art. 41, § 1º"}, {"p": "O que ocorre se o cargo do estável for extinto?", "r": "Fica em disponibilidade com remuneração proporcional ao tempo de serviço até o aproveitamento.", "ref": "Art. 41, § 3º"}, {"p": "Qual a diferença entre competência comum e concorrente?", "r": "Comum (art. 23) é material, de todos os entes; concorrente (art. 24) é legislativa, de União, Estados e DF, cabendo à União normas gerais.", "ref": "Arts. 23 e 24"}, {"p": "Sem lei federal de normas gerais, o que os Estados podem fazer?", "r": "Exercer competência legislativa plena; lei federal superveniente suspende a eficácia da estadual no que for contrário.", "ref": "Art. 24, §§ 3º e 4º"}, {"p": "Como a União pode permitir que Estados legislem sobre matérias do art. 22?", "r": "Por lei complementar, sobre questões específicas.", "ref": "Art. 22, parágrafo único"}, {"p": "Como se cria um Município?", "r": "Por lei estadual, no período fixado em LC federal, após Estudos de Viabilidade Municipal e plebiscito das populações envolvidas.", "ref": "Art. 18, § 4º"}, {"p": "Como se calcula o número de Deputados Estaduais?", "r": "Triplo da representação na Câmara; atingido 36, acresce-se um para cada Deputado Federal acima de 12.", "ref": "Art. 27, caput"}, {"p": "Qual o limite de subsídio do Deputado Estadual?", "r": "75% do subsídio do Deputado Federal, por lei de iniciativa da Assembleia.", "ref": "Art. 27, § 2º"}, {"p": "Qual o quórum e o rito da Lei Orgânica municipal?", "r": "Dois turnos, interstício mínimo de 10 dias, aprovação por 2/3 da Câmara, que a promulga.", "ref": "Art. 29, caput"}, {"p": "Quanto a Câmara Municipal pode gastar com folha de pagamento?", "r": "No máximo 70% de sua receita, incluído o subsídio dos Vereadores; desrespeito é crime de responsabilidade do Presidente da Câmara.", "ref": "Art. 29-A, §§ 1º e 3º"}, {"p": "Quem julga o Prefeito?", "r": "O Tribunal de Justiça.", "ref": "Art. 29, X"}, {"p": "Quais são os princípios constitucionais sensíveis?", "r": "Forma republicana, sistema representativo e regime democrático; direitos da pessoa humana; autonomia municipal; prestação de contas; aplicação mínima em ensino e saúde.", "ref": "Art. 34, VII"}, {"p": "Qual o prazo para submeter o decreto de intervenção ao Legislativo?", "r": "24 horas; se não estiver funcionando, convocação extraordinária no mesmo prazo.", "ref": "Art. 36, §§ 1º e 2º"}, {"p": "Quais competências legislativas tem o DF?", "r": "As reservadas aos Estados e aos Municípios.", "ref": "Art. 32, § 1º"}, {"p": "Quem confere as patentes dos oficiais das PMs e bombeiros?", "r": "Os respectivos Governadores.", "ref": "Art. 42, § 1º"}, {"p": "Qual a largura da faixa de fronteira?", "r": "Até 150 km ao longo das fronteiras terrestres.", "ref": "Art. 20, § 2º"}, {"p": "Quais os incentivos regionais previstos?", "r": "Igualdade de tarifas e fretes; juros favorecidos; isenções, reduções ou diferimento de tributos federais; prioridade no aproveitamento de rios em regiões de baixa renda sujeitas a secas.", "ref": "Art. 43, § 2º"}, {"p": "O que diz a CF sobre readaptação?", "r": "Servidor efetivo com limitação física ou mental pode ser readaptado em cargo compatível, se tiver habilitação e escolaridade exigidas, mantida a remuneração do cargo de origem.", "ref": "Art. 37, § 13"}, {"p": "A quem se aplica o RGPS no serviço público?", "r": "Ao ocupante exclusivamente de cargo em comissão, de outro cargo temporário (inclusive mandato eletivo) ou de emprego público.", "ref": "Art. 40, § 13"}, {"p": "Qual a duração da legislatura e do mandato de Senador?", "r": "Legislatura de 4 anos; Senador, 8 anos, com renovação alternada de 1/3 e 2/3 a cada 4 anos.", "ref": "Arts. 44, p.ú., e 46"}, {"p": "Quais os limites mínimo e máximo de Deputados por Estado?", "r": "Mínimo 8 e máximo 70; Territórios elegem 4.", "ref": "Art. 45, §§ 1º e 2º"}, {"p": "Qual o quórum geral de deliberação nas Casas?", "r": "Maioria dos votos, presente a maioria absoluta dos membros, salvo disposição em contrário.", "ref": "Art. 47"}, {"p": "Quem julga as contas do PR e quem emite parecer prévio?", "r": "O Congresso Nacional julga; o TCU aprecia mediante parecer prévio em 60 dias.", "ref": "Arts. 49, IX, e 71, I"}, {"p": "Qual o quórum do Senado para condenar o PR por crime de responsabilidade e qual a pena?", "r": "2/3 dos votos; perda do cargo com inabilitação por 8 anos para função pública, sob a presidência do Presidente do STF.", "ref": "Art. 52, p.ú."}, {"p": "Em que caso o parlamentar pode ser preso?", "r": "Somente em flagrante de crime inafiançável; os autos vão em 24 horas à Casa, que decide pela maioria de seus membros.", "ref": "Art. 53, § 2º"}, {"p": "Quem decide a perda de mandato por quebra de decoro e com que quórum?", "r": "A Casa respectiva, por maioria absoluta, por provocação da Mesa ou de partido representado no CN, com ampla defesa.", "ref": "Art. 55, II e § 2º"}, {"p": "Quais os períodos da sessão legislativa?", "r": "De 2 de fevereiro a 17 de julho e de 1º de agosto a 22 de dezembro.", "ref": "Art. 57"}, {"p": "Quais os requisitos para criar uma CPI?", "r": "Requerimento de 1/3 dos membros, fato determinado e prazo certo; conclusões enviadas ao MP.", "ref": "Art. 58, § 3º"}, {"p": "Quem pode propor emenda à Constituição?", "r": "1/3 dos membros da Câmara ou do Senado; o PR; mais da metade das Assembleias Legislativas, cada uma por maioria relativa.", "ref": "Art. 60, I–III"}, {"p": "Quais são as cláusulas pétreas?", "r": "Forma federativa; voto direto, secreto, universal e periódico; separação dos Poderes; direitos e garantias individuais.", "ref": "Art. 60, § 4º"}, {"p": "Quais os requisitos da iniciativa popular de lei?", "r": "Projeto à Câmara subscrito por 1% do eleitorado nacional, distribuído por ao menos 5 Estados, com no mínimo 0,3% dos eleitores de cada.", "ref": "Art. 61, § 2º"}, {"p": "Qual o prazo de vigência da MP e quando tranca a pauta?", "r": "60 dias, prorrogáveis uma vez por igual período, suspensos no recesso; após 45 dias entra em regime de urgência e sobrestá as demais deliberações.", "ref": "Art. 62, §§ 3º, 4º, 6º e 7º"}, {"p": "MP que majora imposto produz efeitos quando?", "r": "No exercício seguinte, se convertida em lei até o último dia do exercício da edição, exceto II, IE, IPI, IOF e imposto extraordinário de guerra.", "ref": "Art. 62, § 2º"}, {"p": "Qual o prazo para veto e quem promulga se o PR não o fizer?", "r": "15 dias úteis para vetar; promulgação em 48h pelo PR, senão pelo Presidente do Senado e, depois, pelo Vice-Presidente do Senado.", "ref": "Art. 66, §§ 1º e 7º"}, {"p": "O que não pode ser objeto de lei delegada?", "r": "Atos de competência exclusiva do CN ou privativa das Casas, matéria de LC, organização do Judiciário e MP, nacionalidade, cidadania, direitos individuais, políticos e eleitorais, PPA, LDO e orçamentos.", "ref": "Art. 68, § 1º"}, {"p": "Como são escolhidos os Ministros do TCU e quais os requisitos de idade?", "r": "1/3 pelo PR com aprovação do Senado (2 alternadamente dentre auditores e MP junto ao TCU) e 2/3 pelo CN; mais de 35 e menos de 65 anos (no PDF).", "ref": "Art. 73, §§ 1º e 2º"}, {"p": "Quem pode denunciar irregularidades ao TCU?", "r": "Qualquer cidadão, partido político, associação ou sindicato.", "ref": "Art. 74, § 2º"}, {"p": "Qual a ordem de substituição do PR no impedimento de PR e VPR?", "r": "Presidente da Câmara, Presidente do Senado e Presidente do STF, sucessivamente.", "ref": "Art. 80"}, {"p": "Quais atribuições do PR são delegáveis e a quem?", "r": "Incisos VI, XII e XXV (primeira parte), aos Ministros de Estado, ao PGR ou ao AGU.", "ref": "Art. 84, p.ú."}, {"p": "Quando o PR fica suspenso das funções?", "r": "Nas infrações comuns, recebida a denúncia ou queixa pelo STF; nos crimes de responsabilidade, após a instauração do processo pelo Senado; cessa após 180 dias sem julgamento.", "ref": "Art. 86, §§ 1º e 2º"}, {"p": "Quem compõe o Conselho da República?", "r": "VPR, Presidentes da Câmara e do Senado, líderes da maioria e minoria nas duas Casas, Ministro da Justiça e 6 brasileiros natos com mais de 35 anos (2 do PR, 2 do Senado, 2 da Câmara), mandato de 3 anos sem recondução.", "ref": "Art. 89"}, {"p": "Como se ingressa na magistratura?", "r": "Cargo de juiz substituto, concurso de provas e títulos com participação da OAB em todas as fases, exigidos 3 anos de atividade jurídica, nomeação pela ordem de classificação.", "ref": "Art. 93, I"}, {"p": "Quando o juiz de 1º grau adquire vitaliciedade?", "r": "Após 2 anos de exercício; nesse período a perda do cargo depende de deliberação do tribunal.", "ref": "Art. 95, I"}, {"p": "O que é a cláusula de reserva de plenário?", "r": "Os tribunais só declaram inconstitucionalidade pela maioria absoluta de seus membros ou do órgão especial.", "ref": "Art. 97"}, {"p": "Quem pode propor ADI e ADC?", "r": "PR; Mesas do Senado, da Câmara, de Assembleia Legislativa ou da CLDF; Governador de Estado ou do DF; PGR; Conselho Federal da OAB; partido com representação no CN; confederação sindical ou entidade de classe nacional.", "ref": "Art. 103"}, {"p": "Quais os requisitos para editar súmula vinculante?", "r": "Decisão de 2/3 do STF, após reiteradas decisões sobre matéria constitucional, com controvérsia atual que gere grave insegurança jurídica e multiplicação de processos.", "ref": "Art. 103-A, caput e § 1º"}, {"p": "Qual a composição e o mandato do CNJ?", "r": "15 membros, mandato de 2 anos, uma recondução, presidido pelo Presidente do STF; Corregedor é o Ministro do STJ.", "ref": "Art. 103-B"}, {"p": "Qual tribunal julga Governador por crime comum?", "r": "O STJ.", "ref": "Art. 105, I, a"}, {"p": "Quem suscita o incidente de deslocamento de competência e perante quem?", "r": "O PGR, perante o STJ, em casos de grave violação de direitos humanos.", "ref": "Art. 109, § 5º"}, {"p": "Como se compõe o TSE?", "r": "No mínimo 7 membros: 3 Ministros do STF e 2 do STJ eleitos por voto secreto, e 2 advogados nomeados pelo PR dentre 6 indicados pelo STF.", "ref": "Art. 119"}, {"p": "Quando cabe Tribunal de Justiça Militar estadual?", "r": "Nos Estados com efetivo militar superior a 20 mil integrantes.", "ref": "Art. 125, § 3º"}, {"p": "Quais os princípios institucionais do MP?", "r": "Unidade, indivisibilidade e independência funcional.", "ref": "Art. 127, § 1º"}, {"p": "Como é nomeado e destituído o PGR?", "r": "Nomeado pelo PR dentre integrantes da carreira maiores de 35 anos, após aprovação da maioria absoluta do Senado, mandato de 2 anos com recondução; destituição por iniciativa do PR com autorização da maioria absoluta do Senado.", "ref": "Art. 128, §§ 1º e 2º"}, {"p": "Qual a composição do CNMP?", "r": "14 membros: PGR (preside), 4 do MPU, 3 dos MPs estaduais, 2 juízes (STF e STJ), 2 advogados (OAB) e 2 cidadãos (Câmara e Senado); mandato de 2 anos, uma recondução.", "ref": "Art. 130-A"}, {"p": "Quem representa a União na execução da dívida ativa tributária?", "r": "A Procuradoria-Geral da Fazenda Nacional.", "ref": "Art. 131, § 3º"}, {"p": "Quando os Procuradores dos Estados adquirem estabilidade?", "r": "Após 3 anos de efetivo exercício, mediante avaliação de desempenho e relatório circunstanciado das corregedorias.", "ref": "Art. 132, p.ú."}, {"p": "Quais os princípios institucionais da Defensoria Pública?", "r": "Unidade, indivisibilidade e independência funcional.", "ref": "Art. 134, § 4º"}, {"p": "Quem deve ser ouvido antes da decretação do estado de defesa?", "r": "O Conselho da República e o Conselho de Defesa Nacional.", "ref": "Art. 136, caput"}, {"p": "Qual o prazo máximo do estado de defesa?", "r": "30 dias, prorrogável uma vez por igual período, se persistirem as razões.", "ref": "Art. 136, § 2º"}, {"p": "Em quanto tempo o PR submete o decreto de estado de defesa ao CN e qual o quórum?", "r": "24 horas; o CN decide por maioria absoluta.", "ref": "Art. 136, § 4º"}, {"p": "O que acontece se o CN rejeitar o decreto de estado de defesa?", "r": "Cessa imediatamente o estado de defesa.", "ref": "Art. 136, § 7º"}, {"p": "Quais as hipóteses de estado de sítio?", "r": "Comoção grave de repercussão nacional ou ineficácia de medida do estado de defesa; declaração de guerra ou resposta a agressão armada estrangeira.", "ref": "Art. 137"}, {"p": "Qual o prazo do estado de sítio por guerra?", "r": "Todo o tempo que perdurar a guerra ou a agressão armada estrangeira.", "ref": "Art. 138, § 1º"}, {"p": "Quem convoca o CN no recesso para apreciar pedido de estado de sítio?", "r": "O Presidente do Senado Federal, de imediato, para reunião em 5 dias.", "ref": "Art. 138, § 2º"}, {"p": "Quais as destinações das Forças Armadas?", "r": "Defesa da Pátria, garantia dos poderes constitucionais e, por iniciativa de qualquer destes, da lei e da ordem.", "ref": "Art. 142, caput"}, {"p": "Quem é isento do serviço militar obrigatório em tempo de paz?", "r": "Mulheres e eclesiásticos, sujeitos a outros encargos legais.", "ref": "Art. 143, § 2º"}, {"p": "Qual órgão exerce com exclusividade a polícia judiciária da União?", "r": "A polícia federal.", "ref": "Art. 144, § 1º, IV"}, {"p": "A quem cabe a segurança dos estabelecimentos penais?", "r": "Às polícias penais.", "ref": "Art. 144, § 5º-A"}, {"p": "Taxa pode ter base de cálculo própria de imposto?", "r": "Não.", "ref": "Art. 145, § 2º"}, {"p": "Em que hipóteses a União pode instituir empréstimo compulsório e por qual instrumento?", "r": "Por lei complementar: despesas extraordinárias de calamidade pública, guerra externa ou iminência; investimento público urgente e de relevante interesse nacional.", "ref": "Art. 148"}, {"p": "Quem pode instituir contribuição para custeio da iluminação pública?", "r": "Municípios e Distrito Federal.", "ref": "Art. 149-A"}, {"p": "Quais tributos são exceção à anterioridade nonagesimal?", "r": "Empréstimo compulsório do art. 148, I, II, IE, IR, IOF, impostos extraordinários de guerra e a fixação da base de cálculo de IPVA e IPTU.", "ref": "Art. 150, § 1º"}, {"p": "Quais imunidades genéricas de impostos o art. 150, VI prevê?", "r": "Recíproca; templos; partidos, sindicatos de trabalhadores, entidades de educação e assistência sem fins lucrativos; livros, jornais, periódicos e papel; fonogramas e videofonogramas musicais nacionais.", "ref": "Art. 150, VI"}, {"p": "O que é exigido para conceder isenção ou anistia tributária?", "r": "Lei específica, federal, estadual ou municipal, que regule exclusivamente a matéria ou o tributo.", "ref": "Art. 150, § 6º"}, {"p": "Quais impostos o Executivo pode ter alíquotas alteradas por ato próprio?", "r": "II, IE, IPI e IOF, nas condições e limites da lei.", "ref": "Art. 153, § 1º"}, {"p": "Como é repartido o IOF-ouro?", "r": "30% para o Estado/DF/Território de origem e 70% para o Município de origem; alíquota mínima de 1%.", "ref": "Art. 153, § 5º"}, {"p": "Quais os requisitos do imposto residual?", "r": "Lei complementar, não cumulatividade e fato gerador/base de cálculo distintos dos discriminados na CF.", "ref": "Art. 154, I"}, {"p": "Qual Estado cobra o ITCMD sobre imóveis?", "r": "O Estado da situação do bem, ou o DF.", "ref": "Art. 155, § 1º, I"}, {"p": "Em quais operações o ICMS não incide?", "r": "Exportações; petróleo, combustíveis e energia elétrica para outros Estados; ouro ativo financeiro; radiodifusão de recepção livre e gratuita.", "ref": "Art. 155, § 2º, X"}, {"p": "Quando o ITBI incide sobre integralização de capital?", "r": "Quando a atividade preponderante do adquirente for compra e venda, locação de imóveis ou arrendamento mercantil.", "ref": "Art. 156, § 2º, I"}, {"p": "Quais critérios de repasse da cota municipal do ICMS?", "r": "No mínimo 65% pelo valor adicionado; até 35% por lei estadual, com no mínimo 10 pontos percentuais por indicadores educacionais.", "ref": "Art. 158, parágrafo único"}, {"p": "Quanto do IPI vai aos Estados exportadores e qual o teto por unidade?", "r": "10%, proporcional às exportações; nenhum ente recebe mais de 20% do montante.", "ref": "Art. 159, II e § 2º"}, {"p": "Quem emite moeda?", "r": "O banco central, com exclusividade.", "ref": "Art. 164, caput"}, {"p": "Quais orçamentos compõem a LOA?", "r": "Fiscal, de investimento das empresas estatais e da seguridade social.", "ref": "Art. 165, § 5º"}, {"p": "Qual o prazo de publicação do relatório resumido da execução orçamentária?", "r": "Até 30 dias após o encerramento de cada bimestre.", "ref": "Art. 165, § 3º"}, {"p": "Quais despesas não podem ser anuladas para custear emendas à LOA?", "r": "Pessoal e encargos, serviço da dívida e transferências tributárias constitucionais.", "ref": "Art. 166, § 3º, II"}, {"p": "Qual a consequência de iniciar investimento plurianual sem inclusão no PPA?", "r": "Crime de responsabilidade.", "ref": "Art. 167, § 1º"}, {"p": "Qual o gatilho do mecanismo de ajuste fiscal do art. 167-A?", "r": "Despesas correntes acima de 95% das receitas correntes em 12 meses (ou acima de 85%, por ato do Chefe do Executivo).", "ref": "Art. 167-A, caput e § 1º"}, {"p": "Que indenização recebe o servidor estável que perde o cargo por excesso de despesa?", "r": "Um mês de remuneração por ano de serviço.", "ref": "Art. 169, § 5º"}, {"p": "Quais são os fundamentos da ordem econômica?", "r": "Valorização do trabalho humano e livre iniciativa.", "ref": "Art. 170, caput"}, {"p": "Quando o Estado pode explorar diretamente atividade econômica?", "r": "Quando necessária aos imperativos da segurança nacional ou a relevante interesse coletivo, conforme a lei, ressalvados os casos da CF.", "ref": "Art. 173, caput"}, {"p": "O que constitui monopólio da União no art. 177?", "r": "Pesquisa e lavra de petróleo e gás; refinação; importação/exportação de derivados; transporte marítimo e por conduto; minérios e minerais nucleares (exceto radioisótopos sob permissão).", "ref": "Art. 177"}, {"p": "Quais as sanções sucessivas ao solo urbano não edificado?", "r": "Parcelamento ou edificação compulsórios; IPTU progressivo no tempo; desapropriação com títulos da dívida pública.", "ref": "Art. 182, § 4º"}, {"p": "Quais requisitos simultâneos da função social rural?", "r": "Aproveitamento racional; uso adequado de recursos naturais e preservação ambiental; observância das normas trabalhistas; bem-estar de proprietários e trabalhadores.", "ref": "Art. 186"}, {"p": "Por quanto tempo os títulos da reforma agrária são inegociáveis?", "r": "10 anos.", "ref": "Art. 189"}, {"p": "Como é regulado o sistema financeiro nacional?", "r": "Por leis complementares, que dispõem inclusive sobre a participação do capital estrangeiro.", "ref": "Art. 192"}, {"p": "Qual a base e o objetivo da ordem social?", "r": "Base: primado do trabalho; objetivo: bem-estar e justiça sociais.", "ref": "Art. 193"}, {"p": "Quais as três áreas da seguridade social?", "r": "Saúde, previdência e assistência social.", "ref": "Art. 194"}, {"p": "Quem participa da gestão quadripartite da seguridade?", "r": "Trabalhadores, empregadores, aposentados e Governo.", "ref": "Art. 194, parágrafo único, VII"}, {"p": "Quais as fontes de contribuição social do art. 195?", "r": "Empregador/empresa (folha, receita/faturamento, lu
